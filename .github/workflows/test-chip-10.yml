name: Test CMoney Chip 10 Stocks

on:
  workflow_dispatch:

jobs:
  test-chip:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run 10-stock CMoney chip test
        run: |
          echo "================================================================"
          echo "CMoney 主力買賣超 10 檔測試"
          echo "================================================================"
          echo ""
          echo "本次只測試 10 檔："
          echo "2337 旺宏"
          echo "2426 鼎元"
          echo "2368 金像電"
          echo "3081 艾訊"
          echo "6770 力積電"
          echo "6695 芯鼎"
          echo "6914 阜爾運通"
          echo "6753 龍德造船"
          echo "6805 富世達"
          echo "9904 寶成"
          echo ""
          echo "================================================================"

          python Scripts/test_chip_10.py

      - name: Show test result
        if: always()
        run: |
          echo ""
          echo "================================================================"
          echo "10 檔測試完成"
          echo "================================================================"

          if [ -f Data/chip_test_10.json ]; then
            echo ""
            echo "✓ 找到測試結果："
            ls -lh Data/chip_test_10.json
            echo ""
            echo "================================================================"
            echo "結果摘要"
            echo "================================================================"
            cat Data/chip_test_10.json
          else
            echo ""
            echo "⚠️ 找不到 Data/chip_test_10.json"
          fi
