name: Apply Classification

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - "Update Stock Data"
    types:
      - completed

permissions:
  contents: write


jobs:

  apply-classification:

    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # Dependencies
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas


      # ==========================================================
      # Step 1
      # 建立正式 Universe
      #
      # Universe 必須由 build_universe.py 正確建立。
      #
      # 不透過移除 status 驗證來放行資料。
      #
      # 四層架構：
      #
      # 第一層：目前交易標的
      # 第二層：Instrument classification
      # 第三層：Status validation
      # 第四層：名稱 / 市場 / 代號補充
      # ==========================================================

      - name: Build official Universe
        run: |

          set -e

          echo "============================================================"
          echo "BUILD OFFICIAL UNIVERSE"
          echo "============================================================"

          python Scripts/build_universe.py


          echo ""
          echo "============================================================"
          echo "UNIVERSE FILE CHECK"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.json 的 stocks 不是 object/dict"
              )

          universe_count = data.get(
              "universe_count"
          )

          if universe_count != len(stocks):
              raise SystemExit(
                  f"❌ Universe 數量錯誤："
                  f"{universe_count} != {len(stocks)}"
              )

          if universe_count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          print(
              f"✓ universe_count = {universe_count}"
          )

          print(
              f"✓ stocks object = {len(stocks)}"
          )

          print(
              "✓ universe.json 結構驗證通過"
          )
          PY


      # ==========================================================
      # Step 2
      # 嚴格驗證 Universe
      #
      # 重要：
      #
      # 系統目前正式 status 是：
      #
      #     ACTIVE
      #
      # 所以所有驗證統一使用：
      #
      #     .strip().upper() == "ACTIVE"
      #
      # 不再混用：
      #
      #     active
      #     ACTIVE
      #     verify
      #
      # 這裡不移除 status 驗證。
      # ==========================================================

      - name: Validate Universe
        run: |

          set -e

          echo "============================================================"
          echo "VALIDATE UNIVERSE"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter

          path = Path(
              "Data/universe.json"
          )

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get(
              "stocks"
          )

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ stocks 必須是 object/dict"
              )

          count = data.get(
              "universe_count"
          )

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          if count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )


          # ------------------------------------------------------
          # Required fields
          # ------------------------------------------------------

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }


          # ------------------------------------------------------
          # Status
          # ------------------------------------------------------

          ACTIVE_STATUS = "ACTIVE"

          status_counter = Counter()


          # ------------------------------------------------------
          # Uniqueness
          # ------------------------------------------------------

          symbols = set()
          full_symbols = set()


          # ------------------------------------------------------
          # Validate every stock
          # ------------------------------------------------------

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )


              # --------------------------------------------------
              # Required fields
              # --------------------------------------------------

              missing = (
                  required
                  - set(item.keys())
              )

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )


              # --------------------------------------------------
              # Symbol
              # --------------------------------------------------

              symbol = str(
                  item.get("symbol", "")
              ).strip()

              if not symbol:
                  raise SystemExit(
                      f"❌ {key} symbol 為空"
                  )

              if symbol != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {symbol}"
                  )

              if symbol in symbols:
                  raise SystemExit(
                      f"❌ symbol duplicate："
                      f"{symbol}"
                  )

              symbols.add(symbol)


              # --------------------------------------------------
              # Full symbol
              # --------------------------------------------------

              full_symbol = str(
                  item.get("full_symbol", "")
              ).strip()

              if not full_symbol:
                  raise SystemExit(
                      f"❌ {symbol} full_symbol 為空"
                  )

              if full_symbol in full_symbols:
                  raise SystemExit(
                      f"❌ full_symbol duplicate："
                      f"{full_symbol}"
                  )

              full_symbols.add(
                  full_symbol
              )


              # --------------------------------------------------
              # Name
              # --------------------------------------------------

              name = str(
                  item.get("name", "")
              ).strip()

              if not name:
                  raise SystemExit(
                      f"❌ {symbol} name 為空"
                  )


              # --------------------------------------------------
              # Market
              # --------------------------------------------------

              market = str(
                  item.get("market", "")
              ).strip().upper()

              if market not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {symbol} market 不正確："
                      f"{market}"
                  )


              # --------------------------------------------------
              # Type
              # --------------------------------------------------

              item_type = str(
                  item.get("type", "")
              ).strip().upper()

              if item_type not in {
                  "STOCK",
                  "ETF",
                  "ETN",
                  "TDR",
                  "WARRANT",
                  "BOND",
              }:
                  raise SystemExit(
                      f"❌ {symbol} type 不正確："
                      f"{item_type}"
                  )


              # --------------------------------------------------
              # Instrument type
              # --------------------------------------------------

              instrument_type = str(
                  item.get(
                      "instrument_type",
                      ""
                  )
              ).strip()

              if not instrument_type:
                  raise SystemExit(
                      f"❌ {symbol} "
                      f"instrument_type 為空"
                  )


              # --------------------------------------------------
              # Status
              #
              # 關鍵修正：
              #
              # 原本：
              #
              # item["status"] != "active"
              #
              # 現在：
              #
              # ACTIVE / active / Active
              # 都統一正規化成 ACTIVE
              #
              # 正式資料必須代表 ACTIVE。
              # --------------------------------------------------

              status = str(
                  item.get("status", "")
              ).strip().upper()

              if status != ACTIVE_STATUS:
                  raise SystemExit(
                      f"❌ {symbol} status 不正確："
                      f"{item.get('status')}"
                  )

              status_counter[
                  status
              ] += 1


          # ======================================================
          # Statistics
          # ======================================================

          print(
              f"✓ Universe：{count}"
          )

          print(
              "✓ stocks object"
          )

          print(
              "✓ required fields"
          )

          print(
              "✓ symbol uniqueness"
          )

          print(
              "✓ full_symbol uniqueness"
          )

          print(
              "✓ name validation"
          )

          print(
              "✓ market validation"
          )

          print(
              "✓ type validation"
          )

          print(
              "✓ instrument_type validation"
          )

          print(
              "✓ status=ACTIVE"
          )

          print(
              "✓ status 統計："
          )

          for status, status_count in sorted(
              status_counter.items()
          ):
              print(
                  f"  {status}: "
                  f"{status_count}"
              )

          print(
              "✓ Universe validation PASS"
          )

          PY


      # ==========================================================
      # Step 3
      # Classification
      #
      # classification 建立在正式 Universe 上。
      #
      # 不允許 classification 反過來決定 Universe 股票池。
      # ==========================================================

      - name: Run classification
        run: |

          set -e

          echo "============================================================"
          echo "RUN CLASSIFICATION"
          echo "============================================================"

          if [ ! -f "Scripts/add_classification.py" ]; then

            echo "⚠ Scripts/add_classification.py 不存在"

            echo "⚠ 跳過 classification"

            exit 0

          fi

          python Scripts/add_classification.py


      # ==========================================================
      # Step 4
      # Classification 後再次驗證 Universe
      # ==========================================================

      - name: Validate generated data
        run: |

          set -e

          echo "============================================================"
          echo "FINAL DATA VALIDATION"
          echo "============================================================"

          python - <<'PY'
          import json
          from pathlib import Path

          universe_path = Path(
              "Data/universe.json"
          )


          # ------------------------------------------------------
          # File exists
          # ------------------------------------------------------

          if not universe_path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )


          # ------------------------------------------------------
          # Load
          # ------------------------------------------------------

          with universe_path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              universe = json.load(f)


          # ------------------------------------------------------
          # Root
          # ------------------------------------------------------

          if not isinstance(
              universe,
              dict
          ):
              raise SystemExit(
                  "❌ universe.json 根節點錯誤"
              )


          # ------------------------------------------------------
          # Stocks
          # ------------------------------------------------------

          stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              stocks,
              dict
          ):
              raise SystemExit(
                  "❌ universe.json stocks "
                  "不是 object"
              )


          # ------------------------------------------------------
          # Count
          # ------------------------------------------------------

          universe_count = universe.get(
              "universe_count"
          )

          if universe_count != len(
              stocks
          ):
              raise SystemExit(
                  f"❌ Universe count mismatch："
                  f"{universe_count} != "
                  f"{len(stocks)}"
              )

          if universe_count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )


          # ------------------------------------------------------
          # Required fields
          # ------------------------------------------------------

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }


          symbols = set()
          full_symbols = set()


          # ------------------------------------------------------
          # Validate
          # ------------------------------------------------------

          for key, item in stocks.items():

              if not isinstance(
                  item,
                  dict
              ):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )


              missing = (
                  required
                  - set(item.keys())
              )

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )


              symbol = str(
                  item.get(
                      "symbol",
                      ""
                  )
              ).strip()


              full_symbol = str(
                  item.get(
                      "full_symbol",
                      ""
                  )
              ).strip()


              name = str(
                  item.get(
                      "name",
                      ""
                  )
              ).strip()


              market = str(
                  item.get(
                      "market",
                      ""
                  )
              ).strip().upper()


              item_type = str(
                  item.get(
                      "type",
                      ""
                  )
              ).strip().upper()


              instrument_type = str(
                  item.get(
                      "instrument_type",
                      ""
                  )
              ).strip()


              status = str(
                  item.get(
                      "status",
                      ""
                  )
              ).strip().upper()


              # --------------------------------------------------
              # Key / symbol
              # --------------------------------------------------

              if symbol != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {symbol}"
                  )


              if not symbol:
                  raise SystemExit(
                      f"❌ {key} 缺少 symbol"
                  )


              # --------------------------------------------------
              # Full symbol
              # --------------------------------------------------

              if not full_symbol:
                  raise SystemExit(
                      f"❌ {key} 缺少 full_symbol"
                  )


              # --------------------------------------------------
              # Name
              # --------------------------------------------------

              if not name:
                  raise SystemExit(
                      f"❌ {key} 缺少 name"
                  )


              # --------------------------------------------------
              # Market
              # --------------------------------------------------

              if market not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{market}"
                  )


              # --------------------------------------------------
              # Type
              # --------------------------------------------------

              if item_type not in {
                  "STOCK",
                  "ETF",
                  "ETN",
                  "TDR",
                  "WARRANT",
                  "BOND",
              }:
                  raise SystemExit(
                      f"❌ {key} type 不正確："
                      f"{item_type}"
                  )


              # --------------------------------------------------
              # Instrument type
              # --------------------------------------------------

              if not instrument_type:
                  raise SystemExit(
                      f"❌ {key} "
                      f"instrument_type 為空"
                  )


              # --------------------------------------------------
              # Status
              #
              # 這裡同樣統一 ACTIVE。
              # --------------------------------------------------

              if status != "ACTIVE":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item.get('status')}"
                  )


              # --------------------------------------------------
              # Uniqueness
              # --------------------------------------------------

              if symbol in symbols:
                  raise SystemExit(
                      f"❌ symbol duplicate："
                      f"{symbol}"
                  )

              if full_symbol in full_symbols:
                  raise SystemExit(
                      f"❌ full_symbol duplicate："
                      f"{full_symbol}"
                  )


              symbols.add(
                  symbol
              )

              full_symbols.add(
                  full_symbol
              )


          # ======================================================
          # PASS
          # ======================================================

          print(
              f"✓ Universe：{len(stocks)}"
          )

          print(
              "✓ stocks object"
          )

          print(
              "✓ required fields"
          )

          print(
              "✓ status=ACTIVE"
          )

          print(
              "✓ market validation"
          )

          print(
              "✓ type validation"
          )

          print(
              "✓ instrument_type validation"
          )

          print(
              "✓ symbol uniqueness PASS"
          )

          print(
              "✓ full_symbol uniqueness PASS"
          )

          print(
              "✓ Final data validation PASS"
          )

          PY


      # ==========================================================
      # Step 5
      # 顯示變更
      # ==========================================================

      - name: Show generated changes
        run: |

          echo "============================================================"
          echo "GENERATED FILE CHANGES"
          echo "============================================================"

          git status --short

          echo ""

          echo "Changed files:"

          git diff --name-only


      # ==========================================================
      # Step 6
      # Commit
      # ==========================================================

      - name: Commit generated data
        run: |

          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # Add generated data
          # ------------------------------------------------------

          git add Data/


          # ------------------------------------------------------
          # No changes
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo "✓ 沒有新的 Data 變更"

            exit 0

          fi


          # ------------------------------------------------------
          # Commit
          # ------------------------------------------------------

          git commit \
            -m "chore: rebuild official universe and classification"


          # ------------------------------------------------------
          # Push
          # ------------------------------------------------------

          git push
