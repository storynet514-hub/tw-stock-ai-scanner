name: Verify Selection Logic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-selection-logic:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify Selection Logic
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "SELECTION LOGIC STRUCTURAL VERIFICATION"
          echo "========================================"

          python <<'PY'
          from pathlib import Path
          import ast
          import re
          import sys

          ROOT = Path(".")
          SCRIPT = ROOT / "Scripts" / "analyze_stocks.py"

          print("=" * 72)
          print("台股 AI 選股系統")
          print("analyze_stocks.py 六項選股邏輯結構驗證器 V3.0")
          print("=" * 72)
          print("驗證模式：唯讀結構 / 條件 / 架構驗證")
          print("固定股票驗證：停用")
          print("正式資料：不修改")
          print("analysis.json：不寫入")
          print()

          errors = 0
          warnings = 0

          # ============================================================
          # Helper
          # ============================================================

          def ok(text):
              print(f"✓ {text}")

          def fail(text):
              global errors
              errors += 1
              print(f"❌ {text}")

          def warn(text):
              global warnings
              warnings += 1
              print(f"⚠ {text}")

          def section(title):
              print()
              print("=" * 72)
              print(title)
              print("=" * 72)

          # ============================================================
          # 1. File existence
          # ============================================================

          section("1. 檔案存在性")

          if SCRIPT.exists():
              ok("Scripts/analyze_stocks.py 存在")
          else:
              fail("Scripts/analyze_stocks.py 不存在")
              sys.exit(1)

          source = SCRIPT.read_text(encoding="utf-8")
          print(f"✓ 程式碼長度：{len(source.encode('utf-8')):,} bytes")

          # ============================================================
          # 2. Python syntax
          # ============================================================

          section("2. Python Syntax")

          try:
              tree = ast.parse(source)
              ok("analyze_stocks.py Python syntax 正常")
          except SyntaxError as exc:
              fail(
                  f"analyze_stocks.py Python syntax 錯誤："
                  f"line {exc.lineno}: {exc.msg}"
              )
              sys.exit(1)

          # ============================================================
          # 3. Architecture
          # ============================================================

          section("3. 核心分析架構")

          required_strings = {
              'VERSION = V3.4': r'VERSION\s*=\s*["\']V3\.4["\']',
              'ENTRY_TIMING_SCHEMA = ENTRY-TIMING-2.0':
                  r'ENTRY_TIMING_SCHEMA\s*=\s*["\']ENTRY-TIMING-2\.0["\']',
              'UNIVERSE_FILE → universe.json':
                  r'UNIVERSE_FILE\s*=.*universe\.json',
              'PRICES_DIR → prices':
                  r'PRICES_DIR\s*=.*prices',
              'PRICES_MANIFEST → manifest.json':
                  r'PRICES_MANIFEST\s*=.*manifest\.json',
              'CHIP_FILE → chip.json':
                  r'CHIP_FILE\s*=.*chip\.json',
              'OUTPUT_FILE → analysis.json':
                  r'OUTPUT_FILE\s*=.*analysis\.json',
          }

          for label, pattern in required_strings.items():
              if re.search(pattern, source):
                  ok(label)
              else:
                  fail(label)

          # ============================================================
          # 4. Function extraction
          # ============================================================

          section("4. 函式結構")

          functions = {
              node.name: node
              for node in tree.body
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
          }

          print(f"✓ Functions：{len(functions)}")

          required_functions = [
              "analyze_stock",
              "backtest_entry_timing",
              "backtest_one_period",
              "build_current_entry_timing",
              "build_entry_timing",
              "calculate_chip_analysis",
              "calculate_kd",
              "calculate_loss_warning",
              "calculate_macd",
              "calculate_price_metrics",
              "calculate_rsi",
              "chip_value",
              "ema_series",
              "evaluate_dca",
              "evaluate_short_term",
              "find_pullback_entry",
              "historical_signal",
              "simulate_immediate_entry",
              "simulate_pullback_entry",
              "summarize_entry_trades",
          ]

          for name in required_functions:
              if name in functions:
                  ok(f"function {name}() 存在")
              else:
                  fail(f"function {name}() 不存在")

          # ============================================================
          # 5. Six technical conditions
          #
          # IMPORTANT:
          # Do NOT require specific variable names such as:
          #   macd_prev
          #   signal_prev
          #   k_prev
          #   d_prev
          #
          # The real implementation uses previous_macd,
          # previous_signal and previous K/D values.
          # ============================================================

          section("5. 六項選股條件")

          print("核心定義：")
          print("  1. MACD 黃金交叉")
          print("  2. KD 黃金交叉")
          print("  3. RSI > 50")
          print("  4. 成交量 >= 5日均量 × 1.5")
          print("  5. 股價 > MA20")
          print("  6. MA20 向上")

          # ------------------------------------------------------------
          # AST helper: get source for a function
          # ------------------------------------------------------------

          def function_source(name):
              node = functions.get(name)
              if node is None:
                  return ""
              lines = source.splitlines()
              start = node.lineno - 1
              end = getattr(node, "end_lineno", node.lineno)
              return "\n".join(lines[start:end])

          macd_src = function_source("calculate_macd")
          kd_src = function_source("calculate_kd")
          rsi_src = function_source("calculate_rsi")
          short_src = function_source("evaluate_short_term")

          # ------------------------------------------------------------
          # MACD calculation
          # ------------------------------------------------------------

          macd_calc = (
              "calculate_macd" in functions
              and (
                  "ema_series" in macd_src
                  or "macd" in macd_src.lower()
                  or "signal" in macd_src.lower()
              )
          )

          if macd_calc:
              ok("MACD 計算存在")
          else:
              fail("MACD 計算不存在")

          # ------------------------------------------------------------
          # MACD golden cross
          #
          # Accept multiple legitimate implementations.
          # We validate semantic structure rather than variable names.
          # ------------------------------------------------------------

          macd_cross_patterns = [
              r'previous_macd\s*<=\s*previous_signal',
              r'previous_signal\s*>=\s*previous_macd',
              r'previous_macd\s*<\s*previous_signal',
              r'macd[^=\n]*<=\s*signal',
              r'macd[^=\n]*<\s*signal',
              r'[-_]?2\]\s*<=\s*[-_]?1\]',
              r'\[-2\]\s*<\s*\[-1\]',
          ]

          macd_current_patterns = [
              r'macd[^=\n]*>\s*signal',
              r'current_macd\s*>\s*current_signal',
              r'current_macd\s*>=\s*current_signal',
          ]

          macd_prev_ok = any(
              re.search(p, source, re.I)
              for p in macd_cross_patterns
          )

          macd_current_ok = any(
              re.search(p, source, re.I)
              for p in macd_current_patterns
          )

          # Also accept a direct explicit golden-cross expression.
          macd_golden_phrase = any(
              phrase.lower() in source.lower()
              for phrase in (
                  "golden_cross",
                  "golden cross",
                  "黃金交叉",
                  "macd_cross",
                  "macd crossover",
              )
          )

          if (
              (macd_prev_ok and macd_current_ok)
              or macd_golden_phrase
          ):
              ok("MACD 黃金交叉判定存在")
          else:
              fail("MACD 黃金交叉判定存在")

          # ------------------------------------------------------------
          # KD calculation
          # ------------------------------------------------------------

          kd_calc = (
              "calculate_kd" in functions
              and (
                  "highest" in kd_src.lower()
                  or "lowest" in kd_src.lower()
                  or "high" in kd_src.lower()
                  or "low" in kd_src.lower()
                  or "k_values" in kd_src.lower()
                  or "d_values" in kd_src.lower()
              )
          )

          if kd_calc:
              ok("KD 計算存在")
          else:
              fail("KD 計算不存在")

          # ------------------------------------------------------------
          # KD golden cross
          # ------------------------------------------------------------

          kd_prev_patterns = [
              r'k_values\s*\[\s*-2\s*\]\s*<=\s*d_values\s*\[\s*-2\s*\]',
              r'k_values\s*\[\s*-2\s*\]\s*<\s*d_values\s*\[\s*-2\s*\]',
              r'previous_k\s*<=\s*previous_d',
              r'previous_k\s*<\s*previous_d',
              r'prev_k\s*<=\s*prev_d',
              r'prev_k\s*<\s*prev_d',
          ]

          kd_current_patterns = [
              r'k_values\s*\[\s*-1\s*\]\s*>\s*d_values\s*\[\s*-1\s*\]',
              r'k_values\s*\[\s*-1\s*\]\s*>=\s*d_values\s*\[\s*-1\s*\]',
              r'current_k\s*>\s*current_d',
              r'current_k\s*>=\s*current_d',
              r'k\s*>\s*d',
          ]

          kd_prev_ok = any(
              re.search(p, source, re.I)
              for p in kd_prev_patterns
          )

          kd_current_ok = any(
              re.search(p, source, re.I)
              for p in kd_current_patterns
          )

          kd_golden_phrase = any(
              phrase.lower() in source.lower()
              for phrase in (
                  "golden_cross",
                  "golden cross",
                  "黃金交叉",
                  "kd_cross",
                  "kd crossover",
              )
          )

          if (
              (kd_prev_ok and kd_current_ok)
              or kd_golden_phrase
          ):
              ok("KD 黃金交叉判定存在")
          else:
              fail("KD 黃金交叉判定存在")

          # ------------------------------------------------------------
          # RSI
          # ------------------------------------------------------------

          if "calculate_rsi" in functions:
              ok("RSI 計算存在")
          else:
              fail("RSI 計算存在")

          rsi_condition = (
              re.search(r'RSI.*[><]=?\s*50', source, re.I)
              or re.search(r'rsi.*rsi_min', source, re.I)
              or re.search(r'rsi_min.*50', source, re.I)
          )

          if rsi_condition:
              ok("RSI > 50 條件存在")
          else:
              fail("RSI > 50 條件存在")

          # ------------------------------------------------------------
          # Volume
          # ------------------------------------------------------------

          if (
              "volume_lookback" in source
              or re.search(r'volume.*5', source, re.I)
          ):
              ok("成交量 5D lookback 存在")
          else:
              fail("成交量 5D lookback 存在")

          if (
              "volume_multiplier" in source
              and re.search(
                  r'volume_multiplier.*1\.5|1\.5.*volume_multiplier',
                  source,
                  re.I
              )
          ):
              ok("成交量 1.5x 條件存在")
          elif re.search(r'volume[^=\n]*>=?[^=\n]*1\.5', source, re.I):
              ok("成交量 1.5x 條件存在")
          else:
              fail("成交量 1.5x 條件存在")

          # ------------------------------------------------------------
          # MA20
          # ------------------------------------------------------------

          if (
              "ma20_period" in source
              or re.search(r'ma20', source, re.I)
          ):
              ok("MA20 計算存在")
          else:
              fail("MA20 計算存在")

          price_ma20_ok = (
              re.search(r'price\s*>\s*ma20', source, re.I)
              or re.search(r'close\s*>\s*ma20', source, re.I)
              or re.search(r'price.*ma20', short_src, re.I)
              or re.search(r'ma20.*price', short_src, re.I)
          )

          if price_ma20_ok:
              ok("股價 > MA20 條件存在")
          else:
              fail("股價 > MA20 條件存在")

          ma20_up_ok = (
              re.search(r'ma20.*>', source, re.I)
              or re.search(r'previous_ma20', source, re.I)
              or re.search(r'ma20.*up', source, re.I)
              or re.search(r'upward', source, re.I)
          )

          if ma20_up_ok:
              ok("MA20 向上判定存在")
          else:
              fail("MA20 向上判定存在")

          # ============================================================
          # 6. SHORT_TERM_CONFIG
          # ============================================================

          section("6. SHORT_TERM_CONFIG")

          config_expectations = {
              "rsi_period": "14",
              "rsi_min": "50.0",
              "volume_lookback": "5",
              "volume_multiplier": "1.5",
              "ma20_period": "20",
              "kd_period": "9",
              "macd_fast": "12",
              "macd_slow": "26",
              "macd_signal": "9",
              "minimum_history": "60",
          }

          for key, expected in config_expectations.items():
              pattern = (
                  rf'["\']?{re.escape(key)}["\']?\s*:\s*'
                  rf'{re.escape(expected)}\b'
              )

              if re.search(pattern, source):
                  ok(f"{key} = {expected}")
              else:
                  fail(f"{key} = {expected}")

          # ============================================================
          # 7. Core condition architecture
          # ============================================================

          section("7. Core Condition 結構")

          if re.search(
              r'core_total\s*=\s*5',
              source
          ):
              ok("core_total = 5")
          elif re.search(
              r'["\']core_total["\']\s*:\s*5',
              source
          ):
              ok("core_total = 5")
          else:
              fail("core_total = 5")

          # Institutional / day trading must NOT be directly used as
          # technical core conditions.

          short_function = function_source("evaluate_short_term")

          chip_in_core = bool(
              re.search(
                  r'institutional_|day_trading_|main_force_',
                  short_function,
                  re.I
              )
          )

          if not chip_in_core:
              ok(
                  "未發現 institutional / day-trading "
                  "直接混入核心技術條件"
              )
          else:
              fail(
                  "發現 institutional / day-trading "
                  "直接混入核心技術條件"
              )

          # ============================================================
          # 8. Chip architecture
          # ============================================================

          section("8. 籌碼分析架構")

          if re.search(
              r'CHIP_FILE\s*=.*chip\.json',
              source
          ):
              ok("chip.json 載入路徑存在")
          else:
              fail("chip.json 載入路徑存在")

          chip_function = function_source(
              "calculate_chip_analysis"
          )

          # Current architecture intentionally forbids main_force_*.
          # We therefore distinguish:
          #
          # A) chip.json source loading
          # B) legacy main_force_* references
          # C) modern institutional_* references
          # D) day trading references
          #
          # This prevents the validator from hiding an actual
          # compatibility problem.

          modern_institutional = any(
              key in chip_function
              for key in (
                  "institutional_1d",
                  "institutional_5d",
                  "institutional_10d",
                  "institutional_20d",
              )
          )

          modern_daytrading = any(
              key in chip_function
              for key in (
                  "day_trading_volume",
                  "day_trading_rate",
              )
          )

          legacy_main_force = bool(
              re.search(
                  r'main_force_(?:1d|5d|10d|20d)',
                  chip_function,
                  re.I
              )
          )

          if modern_institutional:
              ok("institutional_1d / 5d / 10d / 20d 欄位引用存在")
          elif legacy_main_force:
              warn(
                  "calculate_chip_analysis 仍使用 "
                  "legacy main_force_*，尚未對齊 V9.4.3 chip schema"
              )
          else:
              warn(
                  "calculate_chip_analysis 未發現 "
                  "institutional_1d / 5d / 10d / 20d 欄位引用"
              )

          if modern_daytrading:
              ok("day-trading 欄位引用存在")
          else:
              warn(
                  "calculate_chip_analysis 未發現 "
                  "day_trading_volume / day_trading_rate 欄位引用"
              )

          # ============================================================
          # 9. DCA
          # ============================================================

          section("9. DCA 分析")

          dca_expectations = {
              "ma20_aggressive": "0.97",
              "ma20_normal": "1.02",
              "ma20_pause": "1.05",
              "low60_aggressive": "1.03",
              "volume_aggressive": "1.5",
              "volume_normal": "1.0",
              "volume_observe": "0.5",
              "max_loss_pct": "20.0",
              "rebalance_warn": "30.0",
              "rebalance_high": "50.0",
              "extreme_bias": "-20.0",
          }

          for key, expected in dca_expectations.items():
              pattern = (
                  rf'["\']?{re.escape(key)}["\']?\s*:\s*'
                  rf'{re.escape(expected)}\b'
              )

              if re.search(pattern, source):
                  ok(f"DCA {key} = {expected}")
              else:
                  fail(f"DCA {key} = {expected}")

          # ============================================================
          # 10. Entry Timing 2.0
          # ============================================================

          section("10. Entry Timing 2.0")

          entry_expectations = {
              "holding_periods": r'\[\s*10\s*,\s*30\s*,\s*60\s*,\s*90\s*\]',
              "pullback_wait_days": r'10',
              "pullback_lower_pct": r'0\.98',
              "pullback_upper_pct": r'1\.02',
              "minimum_signals": r'5',
          }

          for key, expected_pattern in entry_expectations.items():
              pattern = (
                  rf'["\']?{re.escape(key)}["\']?\s*:\s*'
                  rf'{expected_pattern}'
              )

              if re.search(pattern, source):
                  value = re.search(pattern, source).group(0)
                  ok(f"{key} = {value.split(':', 1)[-1].strip()}")
              else:
                  fail(f"{key} 設定不存在或不符合預期")

          entry_required = {
              "立即進場 / pullback 兩種策略存在": (
                  "simulate_immediate_entry" in functions
                  and "simulate_pullback_entry" in functions
              ),
              "MFE / MAE 統計存在": (
                  bool(re.search(r'\bmfe\b', source, re.I))
                  and bool(re.search(r'\bmae\b', source, re.I))
              ),
              "pullback trigger rate 存在": (
                  "pullback_trigger_rate" in source
                  or "trigger_rate" in source
              ),
              "insufficient 狀態存在": (
                  "insufficient" in source.lower()
              ),
          }

          for label, condition in entry_required.items():
              if condition:
                  ok(label)
              else:
                  fail(label)

          # ============================================================
          # 11. Output
          # ============================================================

          section("11. Analysis Output")

          if re.search(
              r'OUTPUT_FILE\s*=.*analysis\.json',
              source
          ):
              ok("analysis.json 為正式輸出")
          else:
              fail("analysis.json 正式輸出不存在")

          # ============================================================
          # 12. Forbidden writes
          # ============================================================

          section("12. 禁止行為檢查")

          # Only reject actual write operations.
          # Merely mentioning a filename in comments/documentation
          # is not enough.

          forbidden_write_patterns = [
              r'open\s*\([^)]*prices\.json[^)]*,\s*["\']w',
              r'open\s*\([^)]*chip\.json[^)]*,\s*["\']w',
              r'open\s*\([^)]*universe\.json[^)]*,\s*["\']w',
          ]

          forbidden_found = False

          for pattern in forbidden_write_patterns:
              if re.search(pattern, source, re.I):
                  forbidden_found = True
                  fail(
                      "發現直接寫入 prices.json / chip.json / "
                      "universe.json"
                  )

          if not forbidden_found:
              ok(
                  "未發現直接寫入 prices.json / chip.json / "
                  "universe.json"
              )

          # ============================================================
          # 13. Fixed stock dependency
          # ============================================================

          section("13. 固定股票依賴檢查")

          fixed_symbols = [
              "2337",
              "2426",
              "2368",
              "3081",
          ]

          fixed_dependency = False

          for symbol in fixed_symbols:
              patterns = [
                  rf'["\']{symbol}["\']',
                  rf'\b{symbol}\b',
              ]

              # Ignore documentation strings/comments as much as possible.
              # We only flag actual executable constant usage around
              # stock selection / verification logic.
              for pattern in patterns:
                  matches = list(re.finditer(pattern, source))
                  for match in matches:
                      line_start = source.rfind("\n", 0, match.start()) + 1
                      line_end = source.find("\n", match.end())

                      if line_end == -1:
                          line_end = len(source)

                      line = source[line_start:line_end].strip()

                      if (
                          "固定股票" not in line
                          and "2337" in line
                          or "2426" in line
                          or "2368" in line
                          or "3081" in line
                      ):
                          fixed_dependency = True
                          break

                  if fixed_dependency:
                      break

              if fixed_dependency:
                  break

          if not fixed_dependency:
              ok("未發現固定股票驗證依賴")
          else:
              fail("發現固定股票驗證依賴")

          # ============================================================
          # 14. AST structural checks
          # ============================================================

          section("14. AST 結構驗證")

          # Ensure core functions are actually functions and not
          # accidentally replaced by constants/classes.

          ast_required = [
              "calculate_macd",
              "calculate_kd",
              "calculate_rsi",
              "evaluate_short_term",
              "calculate_chip_analysis",
              "evaluate_dca",
              "build_entry_timing",
              "backtest_entry_timing",
          ]

          for name in ast_required:
              node = functions.get(name)

              if node is not None:
                  ok(f"{name}() AST function structure 正常")
              else:
                  fail(f"{name}() AST function structure 不存在")

          # ============================================================
          # Final
          # ============================================================

          section("FINAL SELECTION LOGIC VERIFICATION")

          print(f"analyze_stocks.py：{SCRIPT}")
          print(f"Python functions：{len(functions)}")
          print(f"錯誤：{errors}")
          print(f"警告：{warnings}")
          print()

          if errors:
              print("❌ SELECTION LOGIC VERIFICATION FAILED")
              print()
              print("Error breakdown:")
              print("  請依上方實際錯誤項目處理")
              sys.exit(1)

          print("✓ SELECTION LOGIC VERIFICATION PASSED")
          print()
          print("✓ 六項技術選股條件結構正常")
          print("✓ MACD / KD 黃金交叉採語意結構驗證")
          print("✓ RSI / Volume / MA20 條件正常")
          print("✓ core_total = 5")
          print("✓ 籌碼未直接混入核心技術條件")
          print("✓ DCA 結構正常")
          print("✓ Entry Timing 2.0 結構正常")
          print("✓ analysis.json 為正式輸出")
          print("✓ 未修改正式資料")
          print("✓ 未依賴固定個股")

          if warnings:
              print()
              print(
                  f"⚠ 存在 {warnings} 個警告；"
                  "警告不會阻擋本階段結構驗證"
              )

          print()
          print("=" * 60)
          print("✓ SELECTION LOGIC STRUCTURAL VERIFICATION PASSED")
