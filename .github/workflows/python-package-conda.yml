name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "Data/**"

  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: |
          set -e

          echo "========================================"
          echo "Building GitHub Pages site"
          echo "========================================"

          mkdir -p _site

          # 複製網站前端
          if [ -f "index.html" ]; then
            cp index.html _site/index.html
          else
            echo "ERROR: index.html not found"
            exit 1
          fi

          # 複製 Data
          if [ -d "Data" ]; then
            cp -R Data _site/Data
          else
            echo "WARNING: Data directory not found"
          fi

          echo ""
          echo "========================================"
          echo "Pages build verification"
          echo "========================================"

          test -f "_site/index.html"

          if [ -d "_site/Data" ]; then
            echo "✓ _site/Data exists"
            find _site/Data -maxdepth 2 -type f | sort
          else
            echo "WARNING: _site/Data does not exist"
          fi

          echo ""
          echo "✓ Pages site build completed"

      # ------------------------------------------------------
      # IMPORTANT:
      # 只有這一個步驟可以建立 github-pages artifact
      # 不要在其他 workflow/job 再建立同名 artifact
      # ------------------------------------------------------
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site


  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
