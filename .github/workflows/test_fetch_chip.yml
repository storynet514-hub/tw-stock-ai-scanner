name: Test fetch_chip 20D - 4 Stocks

on:
  workflow_dispatch:

jobs:
  test_fetch_chip:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # ======================================================
      # 4. 建立 4 檔測試 Universe
      #
      # 不修改 GitHub 正式 Universe
      #
      # 只在 Action runner 暫時測試：
      #
      # 2337 旺宏
      # 2426 鼎元
      # 2368 金像電
      # 3081 聯亞
      # ======================================================

      - name: Create 4-stock test universe
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          UNIVERSE_FILE = Path("Data/universe.json")


          TARGETS = {
              "2337",
              "2426",
              "2368",
              "3081",
          }


          print("=" * 64)
          print("建立 4 檔測試 Universe")
          print("=" * 64)


          if not UNIVERSE_FILE.exists():
              raise RuntimeError(
                  "找不到 Data/universe.json"
              )


          with UNIVERSE_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:
              original = json.load(f)


          items = original.get("items", [])


          if not isinstance(items, list):
              raise RuntimeError(
                  "universe.json items 不是 list"
              )


          selected = []


          for item in items:

              if not isinstance(item, dict):
                  continue

              code = item.get("code")

              if code is None:
                  code = item.get("symbol")

              if code is None:
                  continue

              code = str(code).strip().upper()

              code = code.replace(".TW", "")
              code = code.replace(".TWO", "")

              if code in TARGETS:
                  selected.append(item)


          found = set()


          for item in selected:

              code = item.get("code")

              if code is None:
                  code = item.get("symbol")

              if code is None:
                  continue

              code = str(code).strip().upper()

              code = code.replace(".TW", "")
              code = code.replace(".TWO", "")

              found.add(code)


          missing = TARGETS - found


          if missing:
              raise RuntimeError(
                  "測試股票缺失："
                  + ", ".join(sorted(missing))
              )


          test_universe = {
              "items": selected
          }


          with UNIVERSE_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  test_universe,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("測試股票：")


          for item in selected:

              code = item.get("code")

              if code is None:
                  code = item.get("symbol")

              print(
                  f"  {code} "
                  f"{item.get('name', '')}"
              )


          print()
          print(
              f"測試 Universe 數量："
              f"{len(selected)}"
          )


          if len(selected) != 4:
              raise RuntimeError(
                  "測試 Universe 不是 4 檔"
              )


          print()
          print(
              "✓ 4 檔測試 Universe 建立完成"
          )

          PY


      # ======================================================
      # 5. 執行前再次確認 Universe
      # ======================================================

      - name: Verify 4-stock universe
        run: |

          python - <<'PY'

          import json


          with open(
              "Data/universe.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          items = data.get("items", [])


          print("=" * 64)
          print("確認 fetch_chip 執行前 Universe")
          print("=" * 64)


          print(
              f"Universe 數量：{len(items)}"
          )


          expected = {
              "2337",
              "2426",
              "2368",
              "3081",
          }


          actual = set()


          for item in items:

              code = item.get(
                  "code",
                  item.get("symbol")
              )

              if code is None:
                  continue

              code = str(code).strip().upper()

              code = code.replace(".TW", "")
              code = code.replace(".TWO", "")

              actual.add(code)

              print(
                  f"{code} "
                  f"{item.get('name', '')}"
              )


          if len(items) != 4:
              raise RuntimeError(
                  f"錯誤：目前 Universe "
                  f"為 {len(items)} 檔，不是 4 檔"
              )


          if actual != expected:
              raise RuntimeError(
                  f"錯誤：Universe 不符合預期："
                  f"{sorted(actual)}"
              )


          print()
          print(
              "✓ 確認只會執行 4 檔"
          )

          PY


      # ======================================================
      # 6. 執行正式 fetch_chip.py
      # ======================================================

      - name: Run fetch_chip.py
        run: |

          echo "========================================"
          echo "開始執行 fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 7. 驗證 chip.json
      #
      # 核心：
      #
      # 1D
      # 5D
      # 10D
      # 20D
      #
      # history >= 20
      #
      # 並重新計算 20D
      # ======================================================

      - name: Verify chip.json 20D
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          CHIP_FILE = Path(
              "Data/chip.json"
          )


          TARGETS = [
              "2337",
              "2426",
              "2368",
              "3081",
          ]


          print()
          print("=" * 64)
          print("驗證 chip.json / 主力 20D")
          print("=" * 64)


          if not CHIP_FILE.exists():
              raise RuntimeError(
                  "找不到 Data/chip.json"
              )


          with CHIP_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          stocks = data.get(
              "stocks",
              {}
          )


          if not isinstance(stocks, dict):
              raise RuntimeError(
                  "chip.json stocks 格式錯誤"
              )


          print(
              "chip.json Universe：",
              data.get("universe_count")
          )


          print(
              "Statistics：",
              data.get("statistics")
          )


          if len(stocks) != 4:
              raise RuntimeError(
                  f"chip.json 股票數量 "
                  f"為 {len(stocks)}，不是 4"
              )


          # ==================================================
          # 逐檔驗證
          # ==================================================

          for code in TARGETS:

              print()
              print("-" * 64)
              print(
                  f"股票：{code}"
              )
              print("-" * 64)


              if code not in stocks:
                  raise RuntimeError(
                      f"{code} 不存在於 chip.json"
                  )


              stock = stocks[code]


              name = stock.get("name")

              force_1d = stock.get(
                  "main_force_1d"
              )

              force_5d = stock.get(
                  "main_force_5d"
              )

              force_10d = stock.get(
                  "main_force_10d"
              )

              force_20d = stock.get(
                  "main_force_20d"
              )

              history_count = stock.get(
                  "history_count"
              )

              history = stock.get(
                  "history",
                  []
              )

              status = stock.get(
                  "status"
              )


              print(
                  f"名稱：{name}"
              )

              print(
                  f"主力 1D ：{force_1d}"
              )

              print(
                  f"主力 5D ：{force_5d}"
              )

              print(
                  f"主力 10D：{force_10d}"
              )

              print(
                  f"主力 20D：{force_20d}"
              )

              print(
                  f"history_count：{history_count}"
              )

              print(
                  f"實際 history 長度："
                  f"{len(history)}"
              )

              print(
                  f"狀態：{status}"
              )


              # ----------------------------------------------
              # 1D
              # ----------------------------------------------

              if force_1d is None:
                  raise RuntimeError(
                      f"{code} 主力 1D 無資料"
                  )


              # ----------------------------------------------
              # 5D
              # ----------------------------------------------

              if force_5d is None:
                  raise RuntimeError(
                      f"{code} 主力 5D 無資料"
                  )


              # ----------------------------------------------
              # 10D
              # ----------------------------------------------

              if force_10d is None:
                  raise RuntimeError(
                      f"{code} 主力 10D 無資料"
                  )


              # ----------------------------------------------
              # 20D
              # ----------------------------------------------

              if force_20d is None:
                  raise RuntimeError(
                      f"{code} 主力 20D 無資料"
                  )


              # ----------------------------------------------
              # history_count >= 20
              # ----------------------------------------------

              if (
                  history_count is None
                  or history_count < 20
              ):

                  raise RuntimeError(
                      f"{code} history_count "
                      f"不足 20："
                      f"{history_count}"
                  )


              # ----------------------------------------------
              # 實際 history >= 20
              # ----------------------------------------------

              if len(history) < 20:

                  raise RuntimeError(
                      f"{code} history 實際筆數 "
                      f"不足 20："
                      f"{len(history)}"
                  )


              # ----------------------------------------------
              # status complete
              # ----------------------------------------------

              if status != "complete":

                  raise RuntimeError(
                      f"{code} status "
                      f"不是 complete："
                      f"{status}"
                  )


              # ----------------------------------------------
              # 重新計算 20D
              #
              # history 應該是最新日期在前
              # ----------------------------------------------

              values = []

              for row in history[:20]:

                  value = row.get(
                      "main_force"
                  )

                  if value is None:
                      raise RuntimeError(
                          f"{code} history "
                          f"存在空的 main_force"
                      )

                  values.append(
                      float(value)
                  )


              calculated_20d = round(
                  sum(values),
                  2
              )


              print(
                  f"重新計算 20D："
                  f"{calculated_20d}"
              )


              # ----------------------------------------------
              # 確認程式計算值與 history 加總一致
              # ----------------------------------------------

              if (
                  abs(
                      float(force_20d)
                      - calculated_20d
                  )
                  > 0.01
              ):

                  raise RuntimeError(
                      f"{code} 主力20D計算錯誤："
                      f"欄位={force_20d}, "
                      f"重新計算={calculated_20d}"
                  )


              print(
                  "✓ 20D 加總驗證通過"
              )


              # ----------------------------------------------
              # 額外驗證 1D
              # ----------------------------------------------

              calculated_1d = round(
                  values[0],
                  2
              )


              if (
                  abs(
                      float(force_1d)
                      - calculated_1d
                  )
                  > 0.01
              ):

                  raise RuntimeError(
                      f"{code} 主力1D計算錯誤"
                  )


              # ----------------------------------------------
              # 額外驗證 5D
              # ----------------------------------------------

              calculated_5d = round(
                  sum(values[:5]),
                  2
              )


              if (
                  abs(
                      float(force_5d)
                      - calculated_5d
                  )
                  > 0.01
              ):

                  raise RuntimeError(
                      f"{code} 主力5D計算錯誤"
                  )


              # ----------------------------------------------
              # 額外驗證 10D
              # ----------------------------------------------

              calculated_10d = round(
                  sum(values[:10]),
                  2
              )


              if (
                  abs(
                      float(force_10d)
                      - calculated_10d
                  )
                  > 0.01
              ):

                  raise RuntimeError(
                      f"{code} 主力10D計算錯誤"
                  )


              print(
                  "✓ 1D / 5D / 10D / 20D "
                  "全部計算一致"
              )


          # ==================================================
          # 全部通過
          # ==================================================

          print()
          print("=" * 64)
          print(
              "✓ 4 檔 fetch_chip 20D 測試全部通過"
          )
          print("=" * 64)


          print()
          print(
              "測試股票："
          )

          print(
              "2337 / 2426 / 2368 / 3081"
          )


          print()
          print(
              "確認項目："
          )

          print(
              "✓ Universe = 4"
          )

          print(
              "✓ 四檔都有 1D"
          )

          print(
              "✓ 四檔都有 5D"
          )

          print(
              "✓ 四檔都有 10D"
          )

          print(
              "✓ 四檔都有 20D"
          )

          print(
              "✓ 四檔 history >= 20"
          )

          print(
              "✓ 四檔 status = complete"
          )

          print(
              "✓ 1D = history[0]"
          )

          print(
              "✓ 5D = history[:5] 加總"
          )

          print(
              "✓ 10D = history[:10] 加總"
          )

          print(
              "✓ 20D = history[:20] 加總"
          )

          print()
          print(
              "下一步才能進入全市場測試。"
          )

          PY