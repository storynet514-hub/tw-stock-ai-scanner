name: Test fetch_chip 4 Stocks

on:
  workflow_dispatch:

jobs:
  test-fetch-chip:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4


      # ======================================================
      # 4. 建立 4 檔測試 Universe
      #
      # 不修改 GitHub 正式 Universe
      #
      # 只在 Action 執行環境中暫時建立：
      #
      # 2337 旺宏
      # 2426 鼎元
      # 3081 聯亞
      # 2368 金像電
      # ======================================================

      - name: Create 4-stock test universe
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          UNIVERSE_FILE = Path("Data/universe.json")


          TARGETS = {
              "2337",
              "2426",
              "3081",
              "2368",
          }


          print("=" * 64)
          print("建立 4 檔測試 Universe")
          print("=" * 64)


          if not UNIVERSE_FILE.exists():

              raise RuntimeError(
                  "找不到 Data/universe.json"
              )


          with UNIVERSE_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:

              original = json.load(f)


          items = original.get(
              "items",
              []
          )


          if not isinstance(
              items,
              list
          ):

              raise RuntimeError(
                  "universe.json items 不是 list"
              )


          selected = []


          for item in items:

              if not isinstance(
                  item,
                  dict
              ):
                  continue


              code = item.get("code")


              if code is None:

                  code = item.get(
                      "symbol"
                  )


              if code is None:

                  continue


              code = str(
                  code
              ).strip().upper()


              code = code.replace(
                  ".TW",
                  ""
              )

              code = code.replace(
                  ".TWO",
                  ""
              )


              if code in TARGETS:

                  selected.append(
                      item
                  )


          found = set()


          for item in selected:

              code = item.get("code")

              if code is None:

                  code = item.get(
                      "symbol"
                  )

              code = str(
                  code
              ).strip().upper()

              code = code.replace(
                  ".TW",
                  ""
              )

              code = code.replace(
                  ".TWO",
                  ""
              )

              found.add(
                  code
              )


          missing = TARGETS - found


          if missing:

              raise RuntimeError(
                  "測試股票缺失："
                  + ", ".join(
                      sorted(missing)
                  )
              )


          # --------------------------------------------------
          # 只保留 4 檔
          # --------------------------------------------------

          test_universe = {
              "items": selected
          }


          with UNIVERSE_FILE.open(
              "w",
              encoding="utf-8"
          ) as f:

              json.dump(
                  test_universe,
                  f,
                  ensure_ascii=False,
                  indent=2
              )


          print()
          print("測試股票：")


          for item in selected:

              code = item.get(
                  "code"
              )

              if code is None:

                  code = item.get(
                      "symbol"
                  )

              print(
                  f"  {code} "
                  f"{item.get('name', '')}"
              )


          print()
          print(
              f"測試 Universe 數量："
              f"{len(selected)}"
          )


          if len(selected) != 4:

              raise RuntimeError(
                  "測試 Universe 不是 4 檔"
              )


          print()
          print(
              "✓ 4 檔測試 Universe 建立完成"
          )

          PY


      # ======================================================
      # 5. 執行前再次確認
      # ======================================================

      - name: Verify 4-stock universe
        run: |

          python - <<'PY'

          import json


          with open(
              "Data/universe.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          items = data.get(
              "items",
              []
          )


          print("=" * 64)
          print("確認 fetch_chip 執行前 Universe")
          print("=" * 64)


          print(
              f"Universe 數量：{len(items)}"
          )


          for item in items:

              print(
                  f"{item.get('code', item.get('symbol'))} "
                  f"{item.get('name', '')}"
              )


          if len(items) != 4:

              raise RuntimeError(
                  f"錯誤：目前 Universe "
                  f"為 {len(items)} 檔，不是 4 檔"
              )


          print()
          print(
              "✓ 確認只會執行 4 檔"
          )

          PY


      # ======================================================
      # 6. 執行正式 fetch_chip.py
      # ======================================================

      - name: Run fetch_chip.py
        run: |

          echo "========================================"
          echo "開始執行 fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 7. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          CHIP_FILE = Path(
              "Data/chip.json"
          )


          TARGETS = [
              "2337",
              "2426",
              "3081",
              "2368",
          ]


          print()
          print("=" * 64)
          print("驗證 chip.json")
          print("=" * 64)


          if not CHIP_FILE.exists():

              raise RuntimeError(
                  "找不到 Data/chip.json"
              )


          with CHIP_FILE.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          stocks = data.get(
              "stocks",
              {}
          )


          if not isinstance(
              stocks,
              dict
          ):

              raise RuntimeError(
                  "chip.json stocks 格式錯誤"
              )


          print(
              "chip.json Universe：",
              data.get(
                  "universe_count"
              )
          )


          print(
              "Statistics：",
              data.get(
                  "statistics"
              )
          )


          if len(stocks) != 4:

              raise RuntimeError(
                  f"chip.json 股票數量 "
                  f"為 {len(stocks)}，不是 4"
              )


          # ==================================================
          # 逐檔驗證
          # ==================================================

          for code in TARGETS:

              print()
              print("-" * 64)
              print(
                  f"股票：{code}"
              )
              print("-" * 64)


              if code not in stocks:

                  raise RuntimeError(
                      f"{code} 不存在於 chip.json"
                  )


              stock = stocks[code]


              name = stock.get(
                  "name"
              )

              force_1d = stock.get(
                  "main_force_1d"
              )

              force_5d = stock.get(
                  "main_force_5d"
              )

              force_10d = stock.get(
                  "main_force_10d"
              )

              history_count = stock.get(
                  "history_count"
              )

              status = stock.get(
                  "status"
              )


              print(
                  f"名稱：{name}"
              )

              print(
                  f"主力 1D ：{force_1d}"
              )

              print(
                  f"主力 5D ：{force_5d}"
              )

              print(
                  f"主力 10D：{force_10d}"
              )

              print(
                  f"歷史筆數：{history_count}"
              )

              print(
                  f"狀態：{status}"
              )


              # ----------------------------------------------
              # 必須存在 1D
              # ----------------------------------------------

              if force_1d is None:

                  raise RuntimeError(
                      f"{code} 主力 1D 無資料"
                  )


              # ----------------------------------------------
              # 必須存在 5D
              # ----------------------------------------------

              if force_5d is None:

                  raise RuntimeError(
                      f"{code} 主力 5D 無資料"
                  )


              # ----------------------------------------------
              # 必須存在 10D
              # ----------------------------------------------

              if force_10d is None:

                  raise RuntimeError(
                      f"{code} 主力 10D 無資料"
                  )


              # ----------------------------------------------
              # 至少 10 筆歷史
              # ----------------------------------------------

              if (
                  history_count is None
                  or history_count < 10
              ):

                  raise RuntimeError(
                      f"{code} 歷史資料不足 10 筆"
                  )


              # ----------------------------------------------
              # 狀態必須 complete
              # ----------------------------------------------

              if status != "complete":

                  raise RuntimeError(
                      f"{code} status "
                      f"不是 complete："
                      f"{status}"
                  )


          # ==================================================
          # 全部通過
          # ==================================================

          print()
          print("=" * 64)
          print(
              "✓ 4 檔 fetch_chip 測試全部通過"
          )
          print("=" * 64)

          print()
          print(
              "測試股票："
          )

          print(
              "2337 / 2426 / 3081 / 2368"
          )

          print()
          print(
              "確認項目："
          )

          print(
              "✓ Universe = 4"
          )

          print(
              "✓ 四檔都有 1D"
          )

          print(
              "✓ 四檔都有 5D"
          )

          print(
              "✓ 四檔都有 10D"
          )

          print(
              "✓ 四檔歷史資料 >= 10 筆"
          )

          print(
              "✓ 四檔 status = complete"
          )

          print()
          print(
              "下一步才能進入全市場測試。"
          )

          PY