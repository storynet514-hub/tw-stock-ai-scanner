name: Test 00838B TPEx Official API Contract

on:
  workflow_dispatch:

jobs:
  test-00838b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python syntax check
        run: |
          set -e
          python -m py_compile Scripts/test_00838B.py
          echo "OK: Python syntax is valid"

      - name: Run 00838B diagnostic
        run: |
          set -e

          echo "============================================================"
          echo "RUN 00838B TPEx ETF API CONTRACT DIAGNOSTIC"
          echo "============================================================"

          python Scripts/test_00838B.py
