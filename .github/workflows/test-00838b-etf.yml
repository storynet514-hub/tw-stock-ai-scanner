name: Diagnose 00838B TPEx ETF API Contract

on:
  workflow_dispatch:

jobs:
  diagnose-00838b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          set -e
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Python syntax check
        run: |
          set -e

          echo "============================================================"
          echo "PYTHON SYNTAX CHECK"
          echo "============================================================"

          python -m py_compile Scripts/test_00838B_api_contract.py

          echo
          echo "OK: Python syntax is valid"

      - name: Run API contract diagnostic
        run: |
          set -e

          echo "============================================================"
          echo "RUN 00838B TPEx API CONTRACT DIAGNOSTIC"
          echo "============================================================"

          python Scripts/test_00838B_api_contract.py