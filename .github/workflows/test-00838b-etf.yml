name: Test 00838B TPEx ETF Historical Price

on:
  workflow_dispatch:

jobs:
  test-00838b-etf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run 00838B ETF diagnostic
        run: |
          set -e
          python Scripts/test_00838B_etf_history.py
