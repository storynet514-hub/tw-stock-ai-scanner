name: Test 00838B TPEx Official Price V3

on:
  workflow_dispatch:

jobs:
  test-00838b:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: |
          python -m pip install requests

      - name: Run diagnostic
        run: |
          set -e
          python Scripts/test_00838b.py
