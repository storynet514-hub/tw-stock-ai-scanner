name: Test CMoney API 20D

on:
  workflow_dispatch:

jobs:
  test-cmoney-api-20d:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run CMoney API 20D test
        run: |
          echo "========================================"
          echo "開始 CMoney API 20D 測試"
          echo "========================================"
          echo "固定測試 4 檔："
          echo "2337 旺宏"
          echo "2426 鼎元"
          echo "2368 金像電"
          echo "3081 艾訊"
          echo "========================================"

          python Scripts/test_cmoney_api_20d.py

      - name: Show test result
        if: always()
        run: |
          echo "========================================"
          echo "測試結果檔案"
          echo "========================================"

          if [ -f Data/test_cmoney_api_20d.json ]; then
            echo "✓ Data/test_cmoney_api_20d.json 已建立"
            ls -lh Data/test_cmoney_api_20d.json
          else
            echo "❌ 找不到 Data/test_cmoney_api_20d.json"
            exit 1
          fi
