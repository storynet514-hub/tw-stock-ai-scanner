name: Verify Universe

on:
  workflow_dispatch:

jobs:
  verify-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Universe verification
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "Universe verification"
          echo "========================================"

          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path
          from collections import Counter

          VERSION = "V2.1"

          BASE_DIR = Path.cwd()
          DATA_DIR = BASE_DIR / "Data"
          UNIVERSE_FILE = DATA_DIR / "universe.json"

          errors = 0
          warnings = 0

          illegal_symbols = []
          invalid_objects = []
          symbol_mismatches = []
          market_unknown = []

          print()
          print("=" * 72)
          print(f"台股 AI 選股系統 Universe 全市場驗證器 {VERSION}")
          print("=" * 72)
          print("驗證模式：Universe stocks object 全量驗證")
          print("固定股票驗證：停用")
          print("source 欄位：不要求")
          print("symbol 格式：依 Universe 實際標的格式驗證")
          print()

          # ==========================================================
          # Symbol normalization
          # ==========================================================

          def clean_code(value):
              if value is None:
                  return ""

              return (
                  str(value)
                  .strip()
                  .upper()
                  .replace(".TW", "")
                  .replace(".TWO", "")
              )

          # ==========================================================
          # Symbol validation
          #
          # 不再硬編碼「只能 4~6 碼純數字」或
          # 「數字 + 英文字母」。
          #
          # Universe 已經是上游正式股票池。
          #
          # 這裡只阻擋：
          # 1. 空字串
          # 2. 含空白
          # 3. 含明顯不允許的特殊字元
          #
          # 允許：
          # 2337
          # 0050
          # 006203
          # 00400A
          # 00631L
          # 00632R
          # 2887Z1
          # 等 Universe 實際存在格式。
          # ==========================================================

          def is_valid_symbol(code):
              code = clean_code(code)

              if not code:
                  return False

              if any(ch.isspace() for ch in code):
                  return False

              # 僅允許英數字
              #
              # 例如：
              # 2337
              # 0050
              # 00400A
              # 2887Z1
              #
              if not re.fullmatch(r"[0-9A-Z]+", code):
                  return False

              return True

          # ==========================================================
          # Market detection
          # ==========================================================

          def normalize_market(item, code):
              market = str(
                  item.get("market", "")
              ).strip().upper()

              if market in ("TWSE", "TPEX"):
                  return market

              symbol = str(
                  item.get("symbol", "")
              ).strip().upper()

              full_symbol = str(
                  item.get("full_symbol", "")
              ).strip().upper()

              candidates = (
                  symbol,
                  full_symbol,
              )

              for value in candidates:

                  if ".TWO" in value:
                      return "TPEX"

                  if ".TW" in value:
                      return "TWSE"

              return ""

          # ==========================================================
          # 1. File
          # ==========================================================

          print("=" * 72)
          print("1. 檔案存在性")
          print("=" * 72)

          if not UNIVERSE_FILE.exists():
              print("❌ Data/universe.json 不存在")
              sys.exit(1)

          print("✓ Data/universe.json 存在")
          print()

          # ==========================================================
          # 2. JSON
          # ==========================================================

          print("=" * 72)
          print("2. JSON 格式")
          print("=" * 72)

          try:
              with UNIVERSE_FILE.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:
                  universe = json.load(f)

              print("✓ universe.json JSON 格式正常")

          except Exception as e:
              print(f"❌ universe.json JSON 讀取失敗：{e}")
              sys.exit(1)

          print()

          # ==========================================================
          # 3. Structure
          # ==========================================================

          print("=" * 72)
          print("3. Universe 結構")
          print("=" * 72)

          if not isinstance(universe, dict):
              print("❌ Universe 根節點不是 object")
              sys.exit(1)

          stocks = universe.get("stocks")

          if not isinstance(stocks, dict):
              print("❌ Universe stocks 不是 object")
              sys.exit(1)

          universe_count = universe.get(
              "universe_count"
          )

          actual_count = len(stocks)

          print(
              f"✓ Universe stocks：{actual_count} 檔"
          )

          if universe_count is None:
              print("❌ universe_count 不存在")
              errors += 1

          else:
              try:
                  declared_count = int(
                      universe_count
                  )

              except Exception:
                  print(
                      "❌ universe_count 不是有效整數"
                  )
                  errors += 1
                  declared_count = None

              if declared_count is not None:

                  if declared_count != actual_count:

                      print(
                          "❌ universe_count 與 "
                          "stocks object 數量不一致"
                      )

                      print(
                          f"   universe_count："
                          f"{declared_count}"
                      )

                      print(
                          f"   stocks object："
                          f"{actual_count}"
                      )

                      errors += 1

                  else:

                      print(
                          "✓ universe_count 與 "
                          "stocks object 數量一致"
                      )

          print()

          # ==========================================================
          # 4. Symbol
          # ==========================================================

          print("=" * 72)
          print("4. Universe 股票代號格式")
          print("=" * 72)

          for key in stocks.keys():

              code = clean_code(key)

              if not is_valid_symbol(code):

                  illegal_symbols.append(
                      code or str(key)
                  )

          if illegal_symbols:

              print(
                  f"❌ 發現 "
                  f"{len(illegal_symbols)} 個非法 "
                  f"Universe 股票代號"
              )

              for code in illegal_symbols[:100]:
                  print(
                      f"   {code}"
                  )

              if len(illegal_symbols) > 100:
                  print(
                      f"   ...其餘 "
                      f"{len(illegal_symbols) - 100} 檔省略"
                  )

              errors += 1

          else:

              print(
                  "✓ Universe 所有股票代號格式正常"
              )

          print()

          # ==========================================================
          # 5. Item structure
          # ==========================================================

          print("=" * 72)
          print("5. Universe stocks object 欄位結構")
          print("=" * 72)

          for key, item in stocks.items():

              key_code = clean_code(key)

              if not isinstance(item, dict):

                  invalid_objects.append(
                      key_code
                  )

                  continue

              item_symbol = clean_code(
                  item.get("symbol", "")
              )

              if item_symbol != key_code:

                  symbol_mismatches.append(
                      (
                          key_code,
                          item_symbol
                      )
                  )

              market = normalize_market(
                  item,
                  key_code
              )

              if not market:

                  market_unknown.append(
                      key_code
                  )

          if invalid_objects:

              print(
                  f"❌ 發現 "
                  f"{len(invalid_objects)} 個 "
                  f"非 object stocks item"
              )

              for code in invalid_objects[:100]:
                  print(
                      f"   {code}"
                  )

              errors += 1

          else:

              print(
                  "✓ 所有 stocks item 均為 object"
              )

          if symbol_mismatches:

              print(
                  f"❌ 發現 "
                  f"{len(symbol_mismatches)} 個 "
                  f"stocks key / symbol 不一致"
              )

              for key_code, item_symbol in (
                  symbol_mismatches[:100]
              ):

                  print(
                      f"   key={key_code} "
                      f"symbol={item_symbol}"
                  )

              errors += 1

          else:

              print(
                  "✓ stocks key 與 symbol 一致"
              )

          if market_unknown:

              print(
                  f"❌ 發現 "
                  f"{len(market_unknown)} 個 "
                  f"無法判定市場標的"
              )

              for code in market_unknown[:100]:
                  print(
                      f"   {code}"
                  )

              errors += 1

          else:

              print(
                  "✓ 所有標的市場均可判定"
              )

          print()

          # ==========================================================
          # 6. Optional metadata
          # ==========================================================

          print("=" * 72)
          print("6. Optional metadata")
          print("=" * 72)

          generated_at = universe.get(
              "generated_at"
          )

          if generated_at:
              print(
                  f"✓ generated_at："
                  f"{generated_at}"
              )

          else:
              print(
                  "⚠ generated_at 不存在"
              )
              warnings += 1

          schema_version = universe.get(
              "schema_version"
          )

          if schema_version:
              print(
                  f"✓ schema_version："
                  f"{schema_version}"
              )

          else:
              print(
                  "⚠ schema_version 不存在"
              )

              # schema_version 不是目前必要欄位
              warnings += 1

          print(
              "✓ source 欄位不是 Universe 必要欄位"
          )

          print()

          # ==========================================================
          # 7. Statistics
          # ==========================================================

          print("=" * 72)
          print("7. Universe 統計")
          print("=" * 72)

          market_counter = Counter()

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  continue

              code = clean_code(key)

              market = normalize_market(
                  item,
                  code
              )

              if market:
                  market_counter[market] += 1

          twse_count = market_counter.get(
              "TWSE",
              0
          )

          tpex_count = market_counter.get(
              "TPEX",
              0
          )

          unknown_count = (
              actual_count
              - twse_count
              - tpex_count
          )

          print(
              f"TWSE：{twse_count} 檔"
          )

          print(
              f"TPEX：{tpex_count} 檔"
          )

          print(
              f"無法分類：{unknown_count} 檔"
          )

          if unknown_count != 0:
              errors += 1

          print()

          # ==========================================================
          # Final
          # ==========================================================

          print("=" * 72)
          print("FINAL UNIVERSE VERIFICATION")
          print("=" * 72)

          print(
              f"Universe：{actual_count} 檔"
          )

          print(
              f"universe_count："
              f"{universe_count} 檔"
          )

          print(
              f"非法代號："
              f"{len(illegal_symbols)}"
          )

          print(
              f"非法 object："
              f"{len(invalid_objects)}"
          )

          print(
              f"symbol 不一致："
              f"{len(symbol_mismatches)}"
          )

          print(
              f"市場無法判定："
              f"{len(market_unknown)}"
          )

          print(
              f"錯誤：{errors}"
          )

          print(
              f"警告：{warnings}"
          )

          print()

          if errors:

              print(
                  "============================================================"
              )

              print(
                  "❌ UNIVERSE VERIFICATION FAILED"
              )

              print(
                  "============================================================"
              )

              sys.exit(1)

          print(
              "============================================================"
          )

          print(
              "✓ UNIVERSE VERIFICATION PASSED"
          )

          print(
              "============================================================"
          )

          print(
              "✓ Universe stocks object 結構正常"
          )

          print(
              "✓ Universe 數量一致"
          )

          print(
              "✓ 所有 Universe 代號格式正常"
          )

          print(
              "✓ stocks key / symbol 完全一致"
          )

          print(
              "✓ 所有標的市場均可判定"
          )

          print(
              "✓ source 欄位不作為必要條件"
          )

          print(
              "✓ 固定個股驗證完全停用"
          )

          print(
              "✓ Universe 可以進入正式流程"
          )

          sys.exit(0)
          PY