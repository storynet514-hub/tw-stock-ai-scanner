name: Verify Universe

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-universe:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Install dependencies
      # ============================================================
      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

      # ============================================================
      # 4. Build Universe
      # ============================================================
      - name: Run build_universe.py
        run: |
          set -e

          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py

      # ============================================================
      # 5. Verify universe.json
      # ============================================================
      - name: Verify universe.json
        run: |
          set -e

          echo "========================================"
          echo "Universe verification"
          echo "========================================"

          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          universe_file = Path("Data/universe.json")

          if not universe_file.exists():
              print("❌ Data/universe.json 不存在")
              sys.exit(1)

          try:
              with universe_file.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"❌ universe.json 無法解析：{e}")
              sys.exit(1)

          if not isinstance(data, dict):
              print("❌ universe.json 根節點不是 object")
              sys.exit(1)

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              print("❌ universe.json 的 stocks 不是 object")
              sys.exit(1)

          universe_count = data.get("universe_count")
          stock_count = data.get("stock_count")
          etf_count = data.get("etf_count")
          bond_count = data.get("bond_count")

          actual_count = len(stocks)

          actual_stock_count = 0
          actual_etf_count = 0
          actual_bond_count = 0

          for symbol, item in stocks.items():

              if not isinstance(item, dict):
                  print(
                      f"❌ stocks[{symbol}] 不是 object"
                  )
                  sys.exit(1)

              item_type = str(
                  item.get("type", "")
              ).strip().upper()

              instrument_type = str(
                  item.get("instrument_type", "")
              ).strip().lower()

              if (
                  item_type == "ETF"
                  or instrument_type == "ETF".lower()
              ):
                  actual_etf_count += 1

              elif (
                  item_type == "BOND"
                  or instrument_type == "BOND".lower()
              ):
                  actual_bond_count += 1

              else:
                  actual_stock_count += 1

          print("")
          print("========================================")
          print("Universe statistics")
          print("========================================")
          print(f"universe_count : {universe_count}")
          print(f"actual stocks  : {actual_count}")
          print(f"stock_count    : {stock_count}")
          print(f"actual stocks  : {actual_stock_count}")
          print(f"etf_count      : {etf_count}")
          print(f"actual ETFs    : {actual_etf_count}")
          print(f"bond_count     : {bond_count}")
          print(f"actual bonds   : {actual_bond_count}")
          print("")

          # --------------------------------------------------------
          # universe_count
          # --------------------------------------------------------
          if not isinstance(universe_count, int):
              print("❌ universe_count 不是整數")
              sys.exit(1)

          if universe_count != actual_count:
              print(
                  "❌ Universe 數量不一致："
                  f"header={universe_count}, "
                  f"stocks={actual_count}"
              )
              sys.exit(1)

          print(
              f"✓ universe_count == len(stocks) "
              f"== {actual_count}"
          )

          # --------------------------------------------------------
          # stock_count
          # --------------------------------------------------------
          if not isinstance(stock_count, int):
              print("❌ stock_count 不是整數")
              sys.exit(1)

          if stock_count != actual_stock_count:
              print(
                  "❌ stock_count 不一致："
                  f"header={stock_count}, "
                  f"actual={actual_stock_count}"
              )
              sys.exit(1)

          print(
              f"✓ stock_count == actual Stock count "
              f"== {actual_stock_count}"
          )

          # --------------------------------------------------------
          # etf_count
          # --------------------------------------------------------
          if not isinstance(etf_count, int):
              print("❌ etf_count 不是整數")
              sys.exit(1)

          if etf_count != actual_etf_count:
              print(
                  "❌ etf_count 不一致："
                  f"header={etf_count}, "
                  f"actual={actual_etf_count}"
              )
              sys.exit(1)

          print(
              f"✓ etf_count == actual ETF count "
              f"== {actual_etf_count}"
          )

          # --------------------------------------------------------
          # bond_count
          # --------------------------------------------------------
          if bond_count is not None:

              if not isinstance(bond_count, int):
                  print("❌ bond_count 不是整數")
                  sys.exit(1)

              if bond_count != actual_bond_count:
                  print(
                      "❌ bond_count 不一致："
                      f"header={bond_count}, "
                      f"actual={actual_bond_count}"
                  )
                  sys.exit(1)

              print(
                  f"✓ bond_count == actual Bond count "
                  f"== {actual_bond_count}"
              )

          # ========================================================
          # 固定驗證股票
          # ========================================================

          required = {
              "2337": {
                  "name": "旺宏",
                  "market": "TWSE",
              },
              "2426": {
                  "name": "鼎元",
                  "market": "TWSE",
              },
              "2368": {
                  "name": "金像電",
                  "market": "TWSE",
              },
              "3081": {
                  "name": "聯亞",
                  "market": "TPEX",
              },
          }

          print("")
          print("========================================")
          print("Fixed stock verification")
          print("========================================")

          for symbol, expected in required.items():

              if symbol not in stocks:
                  print(
                      f"❌ 找不到 {symbol}"
                  )
                  sys.exit(1)

              item = stocks[symbol]

              if not isinstance(item, dict):
                  print(
                      f"❌ {symbol} 資料不是 object"
                  )
                  sys.exit(1)

              actual_name = str(
                  item.get("name", "")
              ).strip()

              actual_market = str(
                  item.get("market", "")
              ).strip().upper()

              expected_name = expected["name"]
              expected_market = expected["market"]

              print(
                  f"{symbol} | "
                  f"name={actual_name} | "
                  f"market={actual_market}"
              )

              if actual_name != expected_name:
                  print(
                      f"❌ {symbol} 名稱錯誤："
                      f"預期={expected_name}, "
                      f"實際={actual_name}"
                  )
                  sys.exit(1)

              if actual_market != expected_market:
                  print(
                      f"❌ {symbol} 市場錯誤："
                      f"預期={expected_market}, "
                      f"實際={actual_market}"
                  )
                  sys.exit(1)

              print(
                  f"✓ {symbol} "
                  f"{expected_name} / "
                  f"{expected_market}"
              )

          # ========================================================
          # 結構驗證
          # ========================================================

          print("")
          print("========================================")
          print("Structure verification")
          print("========================================")

          required_fields = [
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "source",
          ]

          for symbol, item in stocks.items():

              for field in required_fields:

                  if field not in item:
                      print(
                          f"❌ {symbol} 缺少欄位："
                          f"{field}"
                      )
                      sys.exit(1)

          print(
              f"✓ {actual_count} 檔標的結構欄位完整"
          )

          # ========================================================
          # 最終
          # ========================================================

          print("")
          print("========================================")
          print("UNIVERSE VERIFICATION PASS")
          print("========================================")
          print(
              f"✓ Universe      : {universe_count}"
          )
          print(
              f"✓ Stocks object : {actual_count}"
          )
          print(
              f"✓ Stock         : {actual_stock_count}"
          )
          print(
              f"✓ ETF           : {actual_etf_count}"
          )
          print(
              f"✓ Bond          : {actual_bond_count}"
          )
          print(
              "✓ 2337 旺宏 / TWSE"
          )
          print(
              "✓ 2426 鼎元 / TWSE"
          )
          print(
              "✓ 2368 金像電 / TWSE"
          )
          print(
              "✓ 3081 聯亞 / TPEX"
          )
          print("")
          print(
              "✓ Universe layer verification completed."
          )
          print(
              "✓ fetch_chip.py 尚未執行。"
          )
          print(
              "✓ update.yml 尚未執行。"
          )
          print("")
          PY

      # ============================================================
      # 6. 顯示 Universe 檔案摘要
      # ============================================================
      - name: Print universe summary
        run: |
          set -e

          echo "========================================"
          echo "Final universe.json summary"
          echo "========================================"

          python - <<'PY'
          import json

          with open(
              "Data/universe.json",
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          stocks = data["stocks"]

          print(
              f"schema_version : "
              f"{data.get('schema_version')}"
          )

          print(
              f"universe_count : "
              f"{data.get('universe_count')}"
          )

          print(
              f"actual_stocks  : "
              f"{len(stocks)}"
          )

          print(
              f"stock_count    : "
              f"{data.get('stock_count')}"
          )

          print(
              f"etf_count      : "
              f"{data.get('etf_count')}"
          )

          print(
              f"bond_count     : "
              f"{data.get('bond_count')}"
          )

          print("")
          print("Fixed stocks:")

          for symbol in [
              "2337",
              "2426",
              "2368",
              "3081",
          ]:
              item = stocks[symbol]

              print(
                  f"{symbol} | "
                  f"{item.get('name')} | "
                  f"{item.get('market')} | "
                  f"{item.get('full_symbol')}"
              )
          PY

      # ============================================================
      # 7. Commit universe.json only when changed
      # ============================================================
      - name: Commit verified universe.json
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- Data/universe.json; then
            echo "✓ Data/universe.json 沒有變更"
            exit 0
          fi

          git add Data/universe.json

          git commit \
            -m "verify: rebuild universe.json"

          git push
