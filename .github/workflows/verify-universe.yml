name: Verify Universe

on:
  workflow_dispatch:

jobs:
  verify-universe:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Universe verification
        run: |
          set -e

          echo "========================================"
          echo "Universe verification"
          echo "========================================"

          python - <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          BASE = Path(".")
          FILE = BASE / "Data" / "universe.json"

          errors = 0

          print()
          print("=" * 72)
          print("台股 AI 選股系統 Universe 全市場驗證器 V2.0")
          print("=" * 72)
          print("驗證模式：Universe stocks object 全量驗證")
          print("固定股票驗證：停用")
          print("source 欄位：不要求")
          print()

          # ==================================================
          # 1. File
          # ==================================================

          print("=" * 72)
          print("1. 檔案存在性")
          print("=" * 72)

          if not FILE.exists():
              print("❌ Data/universe.json 不存在")
              sys.exit(1)

          print("✓ Data/universe.json 存在")

          # ==================================================
          # 2. JSON
          # ==================================================

          print()
          print("=" * 72)
          print("2. JSON 格式")
          print("=" * 72)

          try:
              with FILE.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:
                  data = json.load(f)
          except Exception as e:
              print(f"❌ universe.json JSON 解析失敗：{e}")
              sys.exit(1)

          print("✓ universe.json JSON 格式正常")

          # ==================================================
          # 3. Root structure
          # ==================================================

          print()
          print("=" * 72)
          print("3. Universe 結構")
          print("=" * 72)

          if not isinstance(data, dict):
              print("❌ Universe 根節點不是 object")
              sys.exit(1)

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              print("❌ Universe stocks 不是 object")
              sys.exit(1)

          actual_count = len(stocks)

          print(f"✓ Universe stocks：{actual_count} 檔")

          # ==================================================
          # 4. universe_count
          # ==================================================

          declared_count = data.get("universe_count")

          if declared_count is None:
              print("❌ 缺少 universe_count")
              sys.exit(1)

          try:
              declared_count = int(declared_count)
          except Exception:
              print("❌ universe_count 不是有效整數")
              sys.exit(1)

          if declared_count != actual_count:
              print("❌ Universe 數量不一致")
              print(f"   universe_count：{declared_count}")
              print(f"   stocks object：{actual_count}")
              sys.exit(1)

          print(
              "✓ universe_count 與 stocks object 數量一致"
          )

          # ==================================================
          # 5. Symbol format
          # ==================================================

          print()
          print("=" * 72)
          print("4. Universe 股票代號格式")
          print("=" * 72)

          invalid_symbols = []

          def valid_symbol(code):
              code = str(code).strip().upper()

              if re.fullmatch(r"\d{4,6}", code):
                  return True

              if re.fullmatch(
                  r"\d{4,6}[A-Z]{1,2}",
                  code
              ):
                  return True

              return False

          for key in stocks.keys():

              code = str(key).strip().upper()

              if not valid_symbol(code):
                  invalid_symbols.append(code)

          if invalid_symbols:

              errors += len(invalid_symbols)

              print(
                  f"❌ 發現 {len(invalid_symbols)} "
                  "個非法 Universe 股票代號"
              )

              for code in invalid_symbols[:100]:
                  print(f"   {code}")

          else:

              print(
                  "✓ Universe 所有股票代號格式正常"
              )

          # ==================================================
          # 6. Stock object validation
          # ==================================================

          print()
          print("=" * 72)
          print("5. Universe stocks object 欄位結構")
          print("=" * 72)

          invalid_objects = []
          missing_symbol = []
          missing_market = []

          for key, item in stocks.items():

              code = str(key).strip().upper()

              if not isinstance(item, dict):

                  invalid_objects.append(
                      (code, "stock item 不是 object")
                  )

                  continue

              # ----------------------------------------------
              # symbol
              #
              # stocks object 的 key 已經是正式代號。
              # 不要求 source。
              # ----------------------------------------------

              symbol = item.get("symbol")

              if symbol is not None:

                  symbol_clean = (
                      str(symbol)
                      .strip()
                      .upper()
                      .replace(".TW", "")
                      .replace(".TWO", "")
                  )

                  if symbol_clean != code:

                      missing_symbol.append(
                          (
                              code,
                              f"symbol={symbol}"
                          )
                      )

              # ----------------------------------------------
              # market
              #
              # market 是 Chip 判斷 TWSE/TPEX 所需的核心欄位。
              # 若缺少，允許透過 symbol suffix 判斷。
              # ----------------------------------------------

              market = str(
                  item.get("market", "")
              ).strip().upper()

              if market not in ("TWSE", "TPEX"):

                  raw_symbol = str(
                      item.get("symbol", "")
                  ).strip().upper()

                  if ".TWO" in raw_symbol:
                      market = "TPEX"

                  elif ".TW" in raw_symbol:
                      market = "TWSE"

                  else:
                      missing_market.append(
                          (
                              code,
                              "market 無法判定"
                          )
                      )

          if invalid_objects:

              errors += len(invalid_objects)

              print(
                  f"❌ 發現 {len(invalid_objects)} "
                  "個非法 stock object"
              )

              for code, reason in invalid_objects[:100]:
                  print(f"   {code} | {reason}")

          else:

              print(
                  "✓ 所有 stocks item 均為 object"
              )

          if missing_symbol:

              errors += len(missing_symbol)

              print(
                  f"❌ 發現 {len(missing_symbol)} "
                  "個 symbol 與 key 不一致"
              )

              for code, value in missing_symbol[:100]:
                  print(f"   {code} | {value}")

          else:

              print(
                  "✓ stocks key 與 symbol 一致"
              )

          if missing_market:

              errors += len(missing_market)

              print(
                  f"❌ 發現 {len(missing_market)} "
                  "個標的無法判定市場"
              )

              for code, reason in missing_market[:100]:
                  print(f"   {code} | {reason}")

          else:

              print(
                  "✓ 所有標的市場均可判定"
              )

          # ==================================================
          # 7. Optional metadata
          # ==================================================

          print()
          print("=" * 72)
          print("6. Optional metadata")
          print("=" * 72)

          if "generated_at" in data:
              print(
                  f"✓ generated_at：{data['generated_at']}"
              )
          else:
              print(
                  "⚠ generated_at 不存在"
              )

          if "schema_version" in data:
              print(
                  f"✓ schema_version：{data['schema_version']}"
              )
          else:
              print(
                  "⚠ schema_version 不存在"
              )

          print(
              "✓ source 欄位不是 Universe 必要欄位"
          )

          # ==================================================
          # 8. Statistics
          # ==================================================

          print()
          print("=" * 72)
          print("7. Universe 統計")
          print("=" * 72)

          twse = 0
          tpex = 0
          other = 0

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  continue

              market = str(
                  item.get("market", "")
              ).strip().upper()

              if market == "TWSE":
                  twse += 1

              elif market == "TPEX":
                  tpex += 1

              else:
                  raw_symbol = str(
                      item.get("symbol", "")
                  ).strip().upper()

                  if ".TWO" in raw_symbol:
                      tpex += 1

                  elif ".TW" in raw_symbol:
                      twse += 1

                  else:
                      other += 1

          print(f"TWSE：{twse} 檔")
          print(f"TPEX：{tpex} 檔")
          print(f"無法分類：{other} 檔")

          # ==================================================
          # FINAL
          # ==================================================

          print()
          print("=" * 72)
          print("FINAL UNIVERSE VERIFICATION")
          print("=" * 72)

          print(f"Universe：{actual_count} 檔")
          print(f"universe_count：{declared_count} 檔")
          print(f"非法代號：{len(invalid_symbols)}")
          print(f"非法 object：{len(invalid_objects)}")
          print(f"symbol 不一致：{len(missing_symbol)}")
          print(f"市場無法判定：{len(missing_market)}")
          print(f"錯誤：{errors}")

          if errors:

              print()
              print(
                  "============================================================"
              )
              print(
                  "❌ UNIVERSE VERIFICATION FAILED"
              )
              print(
                  "============================================================"
              )

              sys.exit(1)

          print()
          print(
              "============================================================"
          )
          print(
              "✓ UNIVERSE VERIFICATION PASSED"
          )
          print(
              "============================================================"
          )

          print(
              "✓ Universe stocks object 結構正常"
          )

          print(
              "✓ universe_count 正確"
          )

          print(
              "✓ 所有股票代號格式正常"
          )

          print(
              "✓ 不依賴固定股票"
          )

          print(
              "✓ 不要求 source 欄位"
          )

          print(
              "✓ Universe 可以進入後續 Chip 驗證"
          )
          PY
