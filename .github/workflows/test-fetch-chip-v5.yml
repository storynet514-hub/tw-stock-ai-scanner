name: Verify fetch_chip V5.0.1

on:
  workflow_dispatch:

jobs:
  verify-fetch-chip-v5:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. 安裝依賴
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ============================================================
      # 4. 確認正式程式與驗證工具
      # ============================================================
      - name: Check V5.0.1 files
        run: |
          echo "========================================"
          echo "確認 V5.0.1 檔案"
          echo "========================================"

          test -f Scripts/fetch_chip.py
          test -f Scripts/diagnose_fetch_chip_v5.py
          test -f Scripts/verify_fetch_chip_v5_output.py

          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/diagnose_fetch_chip_v5.py"
          echo "✓ Scripts/verify_fetch_chip_v5_output.py"

      # ============================================================
      # 5. 確認正式 fetch_chip.py 版本
      # ============================================================
      - name: Verify official fetch_chip version
        run: |
          echo "========================================"
          echo "確認正式 fetch_chip.py 版本"
          echo "========================================"

          python - <<'PY'
          import importlib.util

          path = "Scripts/fetch_chip.py"

          spec = importlib.util.spec_from_file_location(
              "fetch_chip",
              path
          )

          if spec is None or spec.loader is None:
              raise RuntimeError(
                  "無法載入 Scripts/fetch_chip.py"
              )

          module = importlib.util.module_from_spec(spec)

          spec.loader.exec_module(module)

          version = getattr(
              module,
              "VERSION",
              None
          )

          print(
              "載入版本：",
              version
          )

          if version != "V5.0.1":
              raise RuntimeError(
                  "目前 fetch_chip.py "
                  f"不是 V5.0.1，而是 {version}"
              )

          print(
              "✓ 正式 fetch_chip.py "
              "V5.0.1 已確認"
          )
          PY

      # ============================================================
      # 6. 執行四檔資料來源診斷
      #
      # 注意：
      # 這一步只診斷，不執行 fetch_all()
      # ============================================================
      - name: Run V5.0.1 source diagnosis
        run: |
          echo "========================================"
          echo "開始 fetch_chip.py V5.0.1"
          echo "四檔資料來源診斷"
          echo "========================================"

          python Scripts/diagnose_fetch_chip_v5.py

      # ============================================================
      # 7. 確認診斷結果
      # ============================================================
      - name: Check diagnosis result
        run: |
          echo "========================================"
          echo "確認資料來源診斷結果"
          echo "========================================"

          test -f Data/chip_v5_diagnosis.json

          echo "✓ Data/chip_v5_diagnosis.json 已建立"

      # ============================================================
      # 8. 確認正式 chip.json
      #
      # 注意：
      # 本步不重新抓資料。
      # 只確認 repository 中已有正式輸出。
      # ============================================================
      - name: Check chip.json
        run: |
          echo "========================================"
          echo "確認正式 Data/chip.json"
          echo "========================================"

          test -f Data/chip.json

          echo "✓ Data/chip.json 存在"

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          stocks = data.get(
              "stocks",
              {}
          )

          if not isinstance(
              stocks,
              dict
          ):
              raise RuntimeError(
                  "Data/chip.json stocks 格式錯誤"
              )

          print(
              "chip.json 股票數量：",
              len(stocks)
          )

          required = [
              "2337",
              "2426",
              "2368",
              "3081",
          ]

          names = {
              "2337": "旺宏",
              "2426": "鼎元",
              "2368": "金像電",
              "3081": "聯亞",
          }

          for symbol in required:

              if symbol not in stocks:
                  raise RuntimeError(
                      f"chip.json 找不到 {symbol}"
                  )

              print(
                  f"✓ {symbol} "
                  f"{names[symbol]} 存在"
              )

          print(
              "✓ 四檔固定測試股票全部存在"
          )
          PY

      # ============================================================
      # 9. 驗證正式 chip.json
      #
      # 這一步：
      #
      # - 不呼叫 CMoney
      # - 不執行 fetch_chip.py
      # - 不執行 fetch_all()
      # - 不修改 chip.json
      # - 固定只驗證四檔
      #
      # 驗證：
      #
      # 1D
      # 5D
      # 10D
      # 20D
      #
      # 並重新由 history 計算後比對。
      # ============================================================
      - name: Verify official chip output
        run: |
          echo "========================================"
          echo "開始正式 chip.json 輸出驗證"
          echo "========================================"

          python Scripts/verify_fetch_chip_v5_output.py

      # ============================================================
      # 10. 顯示正式驗證摘要
      # ============================================================
      - name: Show verification summary
        if: always()
        run: |
          echo "========================================"
          echo "正式 chip.json 驗證摘要"
          echo "========================================"

          if [ -f Data/chip_v5_output_verification.json ]; then

            echo "✓ 驗證結果檔案存在"
            echo ""

            python - <<'PY'
          import json

          path = (
              "Data/"
              "chip_v5_output_verification.json"
          )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          summary = data.get(
              "summary",
              {}
          )

          print(
              "測試股票：",
              data.get(
                  "scope",
                  {}
              ).get(
                  "stock_count"
              )
          )

          print(
              "通過：",
              summary.get(
                  "passed"
              )
          )

          print(
              "失敗：",
              summary.get(
                  "failed"
              )
          )

          print(
              "全部通過：",
              summary.get(
                  "all_passed"
              )
          )

          print("")
          print("四檔驗證結果：")

          for symbol, result in data.get(
              "results",
              {}
          ).items():

              name = result.get(
                  "expected_name",
                  ""
              )

              passed = result.get(
                  "passed"
              )

              history_count = result.get(
                  "history_count"
              )

              latest = result.get(
                  "latest_date"
              )

              oldest = result.get(
                  "oldest_date"
              )

              print("")
              print(
                  symbol,
                  name
              )

              print(
                  "  passed =",
                  passed
              )

              print(
                  "  history =",
                  history_count
              )

              print(
                  "  date =",
                  latest,
                  "->",
                  oldest
              )

              checks = result.get(
                  "checks",
                  {}
              )

              for field in [
                  "main_force_1d",
                  "main_force_5d",
                  "main_force_10d",
                  "main_force_20d",
              ]:

                  check = checks.get(
                      field,
                      {}
                  )

                  print(
                      " ",
                      field,
                      "=",
                      check.get(
                          "actual"
                      ),
                      "| recalculated =",
                      check.get(
                          "calculated"
                      ),
                      "| passed =",
                      check.get(
                          "passed"
                      )
                  )

              errors = result.get(
                  "errors",
                  []
              )

              if errors:

                  print(
                      "  ERROR:"
                  )

                  for error in errors:

                      print(
                          "   -",
                          error
                      )
          PY

          else

            echo "❌ 找不到："
            echo "Data/chip_v5_output_verification.json"

          fi

      # ============================================================
      # 11. 上傳診斷與驗證結果
      # ============================================================
      - name: Upload V5.0.1 verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fetch-chip-v5.0.1-verification
          path: |
            Data/chip_v5_diagnosis.json
            Data/chip_v5_output_verification.json
          if-no-files-found: warn
