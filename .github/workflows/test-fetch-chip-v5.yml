name: Diagnose fetch_chip V5.0

on:
  workflow_dispatch:

jobs:
  diagnose-fetch-chip-v5:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. 安裝依賴
      # ============================================================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # ============================================================
      # 4. 確認 V5.0.1 必要檔案
      # ============================================================
      - name: Check V5.0.1 files
        run: |
          echo "========================================"
          echo "確認 V5.0.1 必要檔案"
          echo "========================================"

          test -f Scripts/fetch_chip.py
          test -f Scripts/diagnose_fetch_chip_v5.py

          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/diagnose_fetch_chip_v5.py"

          echo ""
          echo "不要求 verify_fetch_chip_v5_output.py"
          echo "因目前 V5.0.1 診斷流程不依賴此檔案"

      # ============================================================
      # 5. 確認正式 fetch_chip.py 版本
      # ============================================================
      - name: Verify official fetch_chip version
        run: |
          echo "========================================"
          echo "確認正式 fetch_chip.py 版本"
          echo "========================================"

          python - <<'PY'
          import importlib.util

          path = "Scripts/fetch_chip.py"

          spec = importlib.util.spec_from_file_location(
              "fetch_chip",
              path
          )

          if spec is None or spec.loader is None:
              raise RuntimeError(
                  "無法載入 Scripts/fetch_chip.py"
              )

          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)

          version = getattr(module, "VERSION", None)

          print("載入版本：", version)

          if version != "V5.0.1":
              raise RuntimeError(
                  f"目前 fetch_chip.py 不是 V5.0.1，而是 {version}"
              )

          print("✓ 正式 fetch_chip.py V5.0.1 已確認")
          PY

      # ============================================================
      # 6. 執行 V5.0.1 診斷
      # ============================================================
      - name: Run V5.0.1 diagnosis
        run: |
          echo "========================================"
          echo "開始 fetch_chip.py V5.0.1 診斷"
          echo "========================================"

          python Scripts/diagnose_fetch_chip_v5.py

      # ============================================================
      # 7. 確認診斷結果
      # ============================================================
      - name: Verify diagnosis result
        if: always()
        run: |
          echo "========================================"
          echo "確認 V5.0.1 診斷結果"
          echo "========================================"

          if [ -f Data/chip_v5_diagnosis.json ]; then
            echo "✓ Data/chip_v5_diagnosis.json 已建立"
          else
            echo "❌ 找不到 Data/chip_v5_diagnosis.json"
            exit 1
          fi

      # ============================================================
      # 8. 顯示診斷結果摘要
      # ============================================================
      - name: Show diagnosis result
        if: always()
        run: |
          echo "========================================"
          echo "V5.0.1 診斷結果摘要"
          echo "========================================"

          if [ -f Data/chip_v5_diagnosis.json ]; then

            python - <<'PY'
          import json

          path = "Data/chip_v5_diagnosis.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("Schema:")
          print(
              data.get(
                  "schema_version"
              )
          )

          print("")
          print("Generated:")
          print(
              data.get(
                  "generated_at"
              )
          )

          print("")
          print("Source:")
          print(
              data.get(
                  "source"
              )
          )

          results = data.get(
              "results",
              []
          )

          print("")
          print(
              "診斷股票數：",
              len(results)
          )

          total_abnormal = 0

          for record in results:

              symbol = record.get(
                  "symbol",
                  ""
              )

              name = record.get(
                  "name",
                  ""
              )

              homepage = record.get(
                  "homepage_rows",
                  []
              )

              discovered = record.get(
                  "discovered_urls",
                  []
              )

              pagination = record.get(
                  "pagination_urls",
                  []
              )

              abnormal = record.get(
                  "abnormal_sources",
                  []
              )

              total_abnormal += len(
                  abnormal
              )

              print("")
              print(
                  f"{symbol} {name}"
              )

              print(
                  "  homepage =",
                  len(homepage)
              )

              print(
                  "  discovered =",
                  len(discovered)
              )

              print(
                  "  pagination =",
                  len(pagination)
              )

              print(
                  "  abnormal =",
                  len(abnormal)
              )

              first = record.get(
                  "first_abnormal"
              )

              if first:

                  print(
                      "  第一個異常來源："
                  )

                  print(
                      "    type =",
                      first.get(
                          "url_type"
                      )
                  )

                  print(
                      "    date =",
                      first.get(
                          "date"
                      )
                  )

                  print(
                      "    main_force =",
                      first.get(
                          "main_force"
                      )
                  )

                  print(
                      "    classification =",
                      first.get(
                          "classification"
                      )
                  )

                  print(
                      "    url =",
                      first.get(
                          "url"
                      )
                  )

          print("")
          print(
              "異常資料總數：",
              total_abnormal
          )

          if total_abnormal == 0:
              print(
                  "✓ 四檔固定測試股票均未發現異常來源"
              )
          else:
              print(
                  "⚠️ 發現異常資料來源"
              )
          PY

          else
            echo "❌ 找不到診斷結果"
          fi

      # ============================================================
      # 9. 上傳診斷結果
      # ============================================================
      - name: Upload diagnosis result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-v5.0.1-diagnosis-result
          path: Data/chip_v5_diagnosis.json
          if-no-files-found: warn
