name: Test fetch_chip V5.0

on:
  workflow_dispatch:

jobs:
  test-fetch-chip-v5:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Check files
        run: |
          echo "========================================"
          echo "確認 V5.0 測試檔案"
          echo "========================================"

          test -f Scripts/fetch_chip.py
          test -f Scripts/test_fetch_chip_v5.py

          echo "✓ fetch_chip.py 存在"
          echo "✓ test_fetch_chip_v5.py 存在"

      - name: Run V5.0 baseline test
        run: |
          echo "========================================"
          echo "開始 fetch_chip.py V5.0 基準測試"
          echo "========================================"

          python Scripts/test_fetch_chip_v5.py

      - name: Show test result
        if: always()
        run: |
          echo "========================================"
          echo "測試結果檔案"
          echo "========================================"

          if [ -f Data/chip_test_v5.json ]; then
            echo "✓ Data/chip_test_v5.json 已建立"
            echo ""
            python - <<'PY'
          import json

          path = "Data/chip_test_v5.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Baseline:", data.get("baseline_version"))
          print("Test:", data.get("test_version"))
          print("Statistics:")
          print(json.dumps(
              data.get("statistics", {}),
              ensure_ascii=False,
              indent=2
          ))

          print("")
          print("股票結果:")

          for symbol, record in data.get("stocks", {}).items():
              print(
                  symbol,
                  record.get("name"),
                  "|",
                  "1D =", record.get("main_force_1d"),
                  "|",
                  "5D =", record.get("main_force_5d"),
                  "|",
                  "10D =", record.get("main_force_10d"),
                  "|",
                  "20D =", record.get("main_force_20d"),
                  "|",
                  "history =", record.get("history_count"),
                  "|",
                  "status =", record.get("status")
              )
          PY
          else
            echo "❌ 找不到 Data/chip_test_v5.json"
          fi

      - name: Upload test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chip-test-v5-result
          path: Data/chip_test_v5.json
          if-no-files-found: warn
