name: Verify CHIP Data

on:
  workflow_dispatch:

  push:
    paths:
      - "Data/universe.json"
      - "Data/chip.json"
      - "Scripts/verify_chip.py"
      - ".github/workflows/verify-chip.yml"

permissions:
  contents: read

jobs:
  verify-chip:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. Checkout
      # ==========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================================
      # 2. Python
      # ==========================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. 執行 CHIP 完整驗證
      # ==========================================================
      - name: Verify CHIP Data
        run: |
          set -e

          echo "========================================"
          echo "CHIP DATA VERIFICATION"
          echo "========================================"

          python Scripts/verify_chip.py

      # ==========================================================
      # 4. 額外確認 GitHub Workspace 沒有被修改
      # ==========================================================
      - name: Verify repository is unchanged
        run: |
          set -e

          echo "========================================"
          echo "VERIFY REPOSITORY STATE"
          echo "========================================"

          git status --short

          if [ -n "$(git status --short)" ]; then
            echo "❌ 驗證流程不應修改 Repository"
            exit 1
          fi

          echo "✓ Repository 未被驗證流程修改"

      # ==========================================================
      # 5. PASS
      # ==========================================================
      - name: Verification PASS
        run: |
          echo ""
          echo "============================================================"
          echo "CHIP VERIFICATION PASS"
          echo "============================================================"
          echo "✓ Universe / Chip 數量驗證"
          echo "✓ Universe symbol 完整性驗證"
          echo "✓ Chip JSON 結構驗證"
          echo "✓ 1D / 5D / 10D / 20D 欄位驗證"
          echo "✓ 三大法人資料驗證"
          echo "✓ 當沖資料驗證"
          echo "✓ main_force_* 禁止欄位驗證"
          echo "✓ 全市場抽樣驗證"
          echo "✓ Repository 完整性驗證"
          echo ""
