name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    # 台灣時間 UTC+8
    # 09:15
    # 10:30
    # 12:00
    # 14:30
    # 16:30
    # 17:30

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4


      # ======================================================
      # 4. 檢查專案結構
      # ======================================================

      - name: Check project structure
        run: |
          echo "========================================"
          echo "Project structure"
          echo "========================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Scripts:"
          ls -la Scripts || true

          echo ""
          echo "Data:"
          ls -la Data || true

          echo ""
          echo "Price directory:"
          ls -la Data/prices || true

          echo ""
          echo "========================================"


      # ======================================================
      # 5. 檢查必要檔案
      # ======================================================

      - name: Verify required files
        run: |
          test -f Scripts/build_universe.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_chip.py
          test -f Data/universe.json

          echo "✓ build_universe.py"
          echo "✓ fetch_prices.py"
          echo "✓ fetch_chip.py"
          echo "✓ universe.json"


      # ======================================================
      # 6. 建立全市場 Universe
      # ======================================================

      - name: Build market universe
        run: |
          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py


      # ======================================================
      # 7. 驗證 Universe
      # ======================================================

      - name: Verify universe.json
        run: |
          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          test -f Data/universe.json

          ls -lh Data/universe.json

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: universe.json 頂層不是 object"
              )

          total = data.get("total", 0)
          listed = data.get("listed_stocks", 0)
          otc = data.get("otc_stocks", 0)
          items = data.get("items", [])

          print("universe.json JSON OK")
          print("version:", data.get("version"))
          print("generated_at:", data.get("generated_at"))
          print("total:", total)
          print("listed_stocks:", listed)
          print("otc_stocks:", otc)
          print("items:", len(items))

          if not isinstance(items, list):
              raise SystemExit(
                  "ERROR: universe.json items 不是 list"
              )

          if total <= 0:
              raise SystemExit(
                  "ERROR: Universe 沒有股票資料"
              )

          if len(items) <= 0:
              raise SystemExit(
                  "ERROR: Universe items 為空"
              )

          if total != len(items):
              raise SystemExit(
                  "ERROR: total 與 items 數量不一致"
              )

          if total < 1900:
              raise SystemExit(
                  f"ERROR: Universe 數量異常：{total}"
              )

          print("✓ Universe validation passed")
          PY


      # ======================================================
      # 8. 取得價格資料
      # ======================================================

      - name: Fetch price data
        run: |
          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py


      # ======================================================
      # 9. 驗證價格分檔
      # ======================================================

      - name: Verify price shards
        run: |
          echo "========================================"
          echo "Verify Data/prices/"
          echo "========================================"

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo ""
          echo "Price files:"
          ls -lh Data/prices/

          python - <<'PY'
          import json
          from pathlib import Path

          prices_dir = Path("Data/prices")
          manifest_path = prices_dir / "manifest.json"

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          if not isinstance(manifest, dict):
              raise SystemExit(
                  "ERROR: manifest.json 頂層不是 object"
              )

          print("")
          print("manifest.json JSON OK")
          print("version:", manifest.get("version"))
          print(
              "schema_version:",
              manifest.get("schema_version")
          )
          print(
              "generated_at:",
              manifest.get("generated_at")
          )

          files = manifest.get("files")

          if files is None:
              files = manifest.get("shards")

          if files is None:
              raise SystemExit(
                  "ERROR: manifest.json 找不到 files / shards"
              )

          if not isinstance(files, list):
              raise SystemExit(
                  "ERROR: manifest files/shards 必須是 list"
              )

          if not files:
              raise SystemExit(
                  "ERROR: manifest 沒有價格分檔"
              )

          print(
              "manifest files:",
              len(files)
          )

          validated_files = 0
          total_records = 0

          for entry in files:

              if isinstance(entry, str):

                  filename = entry

              elif isinstance(entry, dict):

                  filename = (
                      entry.get("file")
                      or entry.get("filename")
                      or entry.get("path")
                      or entry.get("name")
                  )

              else:

                  raise SystemExit(
                      "ERROR: manifest 分檔格式錯誤"
                  )

              if not filename:
                  raise SystemExit(
                      "ERROR: manifest 出現空白檔名"
                  )

              path = prices_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: 找不到分檔：{path}"
                  )

              if path.stat().st_size <= 0:
                  raise SystemExit(
                      f"ERROR: 分檔為空：{path}"
                  )

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      shard = json.load(f)

              except Exception as e:

                  raise SystemExit(
                      f"ERROR: {filename} JSON "
                      f"無法解析：{e}"
                  )

              if isinstance(shard, dict):

                  stocks = None

                  for key in (
                      "stocks",
                      "prices",
                      "data",
                      "items"
                  ):

                      candidate = shard.get(key)

                      if isinstance(
                          candidate,
                          (dict, list)
                      ):

                          stocks = candidate
                          break

                  if stocks is None:
                      stocks = shard

                  if isinstance(stocks, dict):

                      count = len(stocks)

                  elif isinstance(stocks, list):

                      count = len(stocks)

                  else:

                      raise SystemExit(
                          f"ERROR: {filename} "
                          "資料格式無法辨識"
                      )

              elif isinstance(shard, list):

                  count = len(shard)

              else:

                  raise SystemExit(
                      f"ERROR: {filename} "
                      "JSON 結構錯誤"
                  )

              if count <= 0:
                  raise SystemExit(
                      f"ERROR: {filename} 沒有資料"
                  )

              validated_files += 1
              total_records += count

              print(
                  f"✓ {filename} | "
                  f"{count} records | "
                  f"{path.stat().st_size / 1024 / 1024:.2f} MB"
              )

          print("")
          print("========================================")
          print("Price shard validation summary")
          print("========================================")

          print(
              "validated files:",
              validated_files
          )

          print(
              "total records:",
              total_records
          )

          print(
              "manifest shards:",
              len(files)
          )

          if validated_files != len(files):
              raise SystemExit(
                  "ERROR: 價格分檔驗證數量不一致"
              )

          if total_records < 1900:
              raise SystemExit(
                  f"ERROR: 價格資料數量過低："
                  f"{total_records}"
              )

          print("")
          print(
              "✓ Price shard validation passed"
          )
          PY


      # ======================================================
      # 10. 檢查 Universe 實際結構
      #
      # 注意：
      # 這一步只讀取，不修改任何檔案。
      #
      # 目的：
      # 確認 fetch_chip.py 執行前，
      # universe.json 到底長什麼樣子。
      # ======================================================

      - name: Inspect universe before chip
        run: |
          echo "========================================"
          echo "Inspect universe before fetch_chip.py"
          echo "========================================"

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("Universe top-level type:")
          print(type(data).__name__)

          if isinstance(data, dict):

              print("")
              print("Universe keys:")

              for key, value in data.items():

                  if isinstance(value, list):

                      print(
                          f"  {key}: list "
                          f"({len(value)})"
                      )

                  elif isinstance(value, dict):

                      print(
                          f"  {key}: dict "
                          f"({len(value)})"
                      )

                  else:

                      print(
                          f"  {key}: "
                          f"{type(value).__name__} "
                          f"= {value}"
                      )

              items = data.get("items")

              print("")
              print(
                  "items type:",
                  type(items).__name__
              )

              if isinstance(items, list):

                  print(
                      "items count:",
                      len(items)
                  )

                  if items:

                      print("")
                      print("First 3 Universe items:")

                      for item in items[:3]:
                          print(
                              json.dumps(
                                  item,
                                  ensure_ascii=False
                              )
                          )

                      print("")
                      print("Last 3 Universe items:")

                      for item in items[-3:]:
                          print(
                              json.dumps(
                                  item,
                                  ensure_ascii=False
                              )
                          )

              else:

                  print(
                      "WARNING: items "
                      "不是 list"
                  )

          elif isinstance(data, list):

              print(
                  "Universe is directly a list"
              )

              print(
                  "items count:",
                  len(data)
              )

              print("")
              print("First 3 items:")

              for item in data[:3]:
                  print(
                      json.dumps(
                          item,
                          ensure_ascii=False
                      )
                  )

          else:

              raise SystemExit(
                  "ERROR: universe.json "
                  "頂層格式異常"
              )

          print("")
          print(
              "✓ Universe inspection completed"
          )
          PY


      # ======================================================
      # 11. 取得主力籌碼
      # ======================================================

      - name: Fetch chip data
        run: |
          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 12. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |
          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          test -f Data/chip.json

          ls -lh Data/chip.json

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: chip.json 頂層不是 object"
              )

          print("chip.json JSON OK")

          print(
              "schema_version:",
              data.get("schema_version")
          )

          print(
              "data_date:",
              data.get("data_date")
          )

          print(
              "universe_count:",
              data.get("universe_count")
          )

          statistics = data.get(
              "statistics",
              {}
          )

          print(
              "complete:",
              statistics.get("complete")
          )

          print(
              "partial:",
              statistics.get("partial")
          )

          print(
              "insufficient:",
              statistics.get("insufficient")
          )

          stocks = data.get(
              "stocks",
              {}
          )

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "ERROR: chip.json stocks "
                  "不是 object"
              )

          print(
              "stocks:",
              len(stocks)
          )

          found_5d = 0
          found_10d = 0
          complete = 0

          for stock in stocks.values():

              if not isinstance(stock, dict):
                  continue

              if stock.get(
                  "main_force_5d"
              ) is not None:

                  found_5d += 1

              if stock.get(
                  "main_force_10d"
              ) is not None:

                  found_10d += 1

              if (
                  stock.get(
                      "main_force_5d"
                  ) is not None
                  and
                  stock.get(
                      "main_force_10d"
                  ) is not None
              ):

                  complete += 1

          print(
              "main_force_5d available:",
              found_5d
          )

          print(
              "main_force_10d available:",
              found_10d
          )

          print(
              "main_force_5d_10d complete:",
              complete
          )

          if not stocks:

              raise SystemExit(
                  "ERROR: chip.json "
                  "沒有股票資料"
              )

          print(
              "✓ chip.json validation passed"
          )
          PY


      # ======================================================
      # 13. 顯示產生的資料
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          echo ""
          echo "Data:"
          ls -lh Data/

          echo ""
          echo "Data/prices:"
          ls -lh Data/prices/ || true

          echo ""
          echo "Git status:"
          git status --short


      # ======================================================
      # 14. Commit / Push
      # ======================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/universe.json
          git add Data/prices/
          git add Data/chip.json

          if [ -f Data/ui_data.json ]; then
            git add Data/ui_data.json
          fi

          if [ -f Data/prices.json ]; then
            git add Data/prices.json
          fi

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit -m \
              "Update stock universe, price and chip data"

            git push

          fi