
name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # Taiwan time (UTC+8)
    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

      # ======================================================
      # 4. Verify project structure
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_market.py
          test -f Scripts/analyze_stocks.py
          test -f Scripts/build_ui_data.py

          mkdir -p Data

          echo "✓ Scripts/build_universe.py"
          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/fetch_prices.py"
          echo "✓ Scripts/fetch_market.py"
          echo "✓ Scripts/analyze_stocks.py"
          echo "✓ Scripts/build_ui_data.py"
          echo "✓ Data/"

      # ======================================================
      # 5. Python Syntax Gate
      # ======================================================

      - name: Python syntax gate
        run: |
          set -e

          python -m py_compile \
            Scripts/build_universe.py \
            Scripts/fetch_chip.py \
            Scripts/fetch_prices.py \
            Scripts/fetch_market.py \
            Scripts/analyze_stocks.py \
            Scripts/build_ui_data.py

          echo "✓ Python syntax PASS"

      # ======================================================
      # 6. Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          test -f Data/universe.json

          echo "✓ Data/universe.json"

      # ======================================================
      # 7. Validate Universe
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.stocks 不是 object"
              )

          if not stocks:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{item['market']}"
                  )

          print("")
          print("========================================")
          print("UNIVERSE VALIDATION")
          print("========================================")
          print(f"✓ Universe：{count}")
          print("✓ stocks object")
          print("✓ required fields")
          print("✓ status=active")
          print("✓ market validation")
          print("✓ Universe validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 8. Fetch Chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

          test -f Data/chip.json

          echo "✓ Data/chip.json"

      # ======================================================
      # 9. Fetch Prices
      # ======================================================

      - name: Fetch Price Data
        shell: bash
        run: |
          set -euo pipefail

          rm -f .fetch_prices.log

          echo "========================================"
          echo "FETCH PRICE DATA"
          echo "========================================"

          python Scripts/fetch_prices.py 2>&1 | tee .fetch_prices.log

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo "✓ Data/prices/"
          echo "✓ Data/prices/manifest.json"

      # ======================================================
      # 10. Validate Price Data
      #
      # 修正重點：
      # prices-v14.0 的 stocks[symbol] 是價格資料 list，
      # 不是包含 symbol/history_status 的 dict。
      # ======================================================

      - name: Validate Price Data
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"
          UNIVERSE_FILE = DATA_DIR / "universe.json"
          MANIFEST_FILE = PRICES_DIR / "manifest.json"
          EXPECTED_SCHEMA_VERSION = "prices-v14.0"

          def fail(message):
              raise SystemExit(
                  f"PRICE DATA VALIDATION FAILED: {message}"
              )

          def load_json(path):
              if not path.is_file():
                  fail(f"檔案不存在：{path}")

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      return json.load(f)

              except Exception as exc:
                  fail(
                      f"JSON 解析失敗：{path}: {exc}"
                  )

          def normalize_symbol(value):
              if value is None:
                  return None

              symbol = str(value).strip().upper()

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):
                  if symbol.endswith(suffix):
                      symbol = symbol[:-len(suffix)]

              return symbol or None

          # 1. Validate Universe
          universe = load_json(UNIVERSE_FILE)

          if not isinstance(universe, dict):
              fail("universe.json 根節點不是 object")

          stocks = universe.get("stocks")

          if not isinstance(stocks, dict) or not stocks:
              fail(
                  "universe.stocks 不是有效的非空 object"
              )

          universe_symbols = set()

          for key, item in stocks.items():
              if not isinstance(item, dict):
                  fail(f"Universe {key} 不是 object")

              symbol = normalize_symbol(
                  item.get("symbol") or key
              )

              if not symbol:
                  fail(
                      f"Universe {key} 缺少有效 symbol"
                  )

              if symbol in universe_symbols:
                  fail(
                      f"Universe 有重複 symbol：{symbol}"
                  )

              universe_symbols.add(symbol)

          # 2. Validate manifest
          manifest = load_json(MANIFEST_FILE)

          if not isinstance(manifest, dict):
              fail("manifest.json 根節點不是 object")

          if manifest.get("schema_version") != EXPECTED_SCHEMA_VERSION:
              fail(
                  "manifest schema_version 不符："
                  f"{manifest.get('schema_version')}"
              )

          if manifest.get("total_symbols") != len(universe_symbols):
              fail(
                  "manifest.total_symbols 不符："
                  f"{manifest.get('total_symbols')} != "
                  f"{len(universe_symbols)}"
              )

          manifest_files = manifest.get("files")

          if not isinstance(manifest_files, list) or not manifest_files:
              fail(
                  "manifest.files 不是有效的非空 list"
              )

          shard_paths = []

          for item in manifest_files:
              if isinstance(item, str):
                  filename = item

              elif isinstance(item, dict):
                  filename = (
                      item.get("file")
                      or item.get("path")
                      or item.get("filename")
                      or item.get("name")
                  )

              else:
                  fail(
                      f"無效的 manifest shard 項目：{item!r}"
                  )

              if not filename:
                  fail("manifest shard 缺少檔名")

              filename = Path(str(filename)).name

              if not (
                  filename.startswith("prices_")
                  and filename.endswith(".json")
              ):
                  fail(
                      f"不合法的 shard 檔名：{filename}"
                  )

              path = PRICES_DIR / filename

              if not path.is_file():
                  fail(
                      f"manifest 指定的 shard 不存在：{path}"
                  )

              shard_paths.append(path)

          if len(set(shard_paths)) != len(shard_paths):
              fail("manifest.files 存在重複 shard")

          # 3. Validate prices-v14.0 shard structure.
          # Expected structure:
          # {
          #   "stocks": {
          #     "2330": [
          #       {"date": "...", ...},
          #       ...
          #     ]
          #   }
          # }
          seen_symbols = set()
          duplicate_symbols = set()
          empty_history_symbols = set()
          history_symbols = set()
          shard_counts = {}

          for shard_path in shard_paths:
              payload = load_json(shard_path)

              if not isinstance(payload, dict):
                  fail(
                      f"{shard_path.name} 根節點不是 object"
                  )

              if payload.get("schema_version") != EXPECTED_SCHEMA_VERSION:
                  fail(
                      f"{shard_path.name} schema_version 不符："
                      f"{payload.get('schema_version')}"
                  )

              shard_stocks = payload.get("stocks")

              if not isinstance(shard_stocks, dict):
                  fail(
                      f"{shard_path.name} 的 stocks 不是 object"
                  )

              local_symbols = set()

              for raw_symbol, prices in shard_stocks.items():
                  symbol = normalize_symbol(raw_symbol)

                  if not symbol:
                      fail(
                          f"{shard_path.name} 有無效 symbol："
                          f"{raw_symbol!r}"
                      )

                  if (
                      symbol in local_symbols
                      or symbol in seen_symbols
                  ):
                      duplicate_symbols.add(symbol)

                  local_symbols.add(symbol)
                  seen_symbols.add(symbol)

                  # Critical fix:
                  # prices-v14.0 stores a list for each symbol.
                  if not isinstance(prices, list):
                      fail(
                          f"{symbol} 的價格資料不是 list；"
                          f"實際型態={type(prices).__name__}"
                      )

                  if not prices:
                      empty_history_symbols.add(symbol)
                      continue

                  previous_date = None

                  for index, row in enumerate(prices):
                      if not isinstance(row, dict):
                          fail(
                              f"{symbol} 第 {index + 1} 筆行情不是 object"
                          )

                      date = str(
                          row.get("date", "")
                      ).strip()

                      if not date:
                          fail(
                              f"{symbol} 第 {index + 1} 筆行情缺少 date"
                          )

                      if (
                          previous_date is not None
                          and date <= previous_date
                      ):
                          fail(
                              f"{symbol} 日期重複或未按升冪排列："
                              f"{previous_date} -> {date}"
                          )

                      previous_date = date

                  history_symbols.add(symbol)

              shard_counts[shard_path.name] = len(local_symbols)

          # 4. Validate duplicate, unknown and missing symbols
          if duplicate_symbols:
              fail(
                  "價格 shard 存在重複 symbol："
                  f"{sorted(duplicate_symbols)[:30]}"
              )

          unknown_symbols = seen_symbols - universe_symbols

          if unknown_symbols:
              fail(
                  "價格資料包含 Universe 外代號："
                  f"count={len(unknown_symbols)}, "
                  f"sample={sorted(unknown_symbols)[:30]}"
              )

          missing_symbols = universe_symbols - seen_symbols

          if missing_symbols:
              fail(
                  "價格 shard 缺少 Universe symbol："
                  f"count={len(missing_symbols)}, "
                  f"sample={sorted(missing_symbols)[:30]}"
              )

          # 5. Validate empty history count.
          # Empty lists represent both no_history and not_started.
          # The current shard schema does not preserve per-symbol status,
          # so validate their combined count against the manifest.
          no_history_count = manifest.get("no_history_count")
          not_started_count = manifest.get("not_started_count")

          if (
              not isinstance(no_history_count, int)
              or no_history_count < 0
          ):
              fail("manifest.no_history_count 無效")

          if (
              not isinstance(not_started_count, int)
              or not_started_count < 0
          ):
              fail("manifest.not_started_count 無效")

          expected_empty_count = (
              no_history_count + not_started_count
          )

          actual_empty_count = len(empty_history_symbols)

          if actual_empty_count != expected_empty_count:
              fail(
                  "空價格陣列數量不符："
                  f"shards={actual_empty_count}, "
                  "manifest no_history + not_started="
                  f"{expected_empty_count}"
              )

          # 6. Final contract
          if len(seen_symbols) != len(universe_symbols):
              fail(
                  f"symbol 總數不符："
                  f"prices={len(seen_symbols)}, "
                  f"universe={len(universe_symbols)}"
              )

          print("========================================")
          print("PRICE DATA VALIDATION")
          print("========================================")
          print(f"Universe symbols: {len(universe_symbols)}")
          print(f"Price symbols:    {len(seen_symbols)}")
          print(f"Shards:           {len(shard_paths)}")
          print(f"With history:     {len(history_symbols)}")
          print(f"Empty history:    {actual_empty_count}")

          for name, count in sorted(shard_counts.items()):
              print(f"{name}: {count} symbols")

          print("PRICE DATA VALIDATION PASS")
          print("========================================")
          PY

      # ======================================================
      # 11. Fetch Market Data
      # ======================================================

      - name: Fetch Market Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH MARKET DATA"
          echo "========================================"

          python Scripts/fetch_market.py

          test -f Data/market.json

          echo "✓ Data/market.json"

      # ======================================================
      # 12. Validate Market
      # ======================================================

      - name: Validate Market Data
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/market.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/market.json 不存在"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8-sig"
              )
          )

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ market.json 根節點不是 object"
              )

          required = {
              "market_status",
              "latest_trading_date",
              "index",
              "sentiment",
              "conditions",
          }

          missing = required - set(data)

          if missing:
              raise SystemExit(
                  "❌ market.json 缺少欄位："
                  f"{sorted(missing)}"
              )

          conditions = data.get("conditions")

          if not isinstance(conditions, list):
              raise SystemExit(
                  "❌ market.conditions 不是 list"
              )

          if len(conditions) != 10:
              raise SystemExit(
                  "❌ market.conditions 數量錯誤："
                  f"{len(conditions)} != 10"
              )

          print("✓ Market V2.1 validation PASS")
          PY

      # ======================================================
      # 13. Analyze Stocks
      # ======================================================

      - name: Analyze Stocks
        run: |
          set -e

          echo "========================================"
          echo "ANALYZE STOCKS"
          echo "========================================"

          python Scripts/analyze_stocks.py

          test -f Data/analysis.json

          echo "✓ Data/analysis.json"

      # ======================================================
      # 14. Build UI Data
      # ======================================================

      - name: Build UI Data
        run: |
          set -e

          echo "========================================"
          echo "BUILD UI DATA"
          echo "========================================"

          python Scripts/build_ui_data.py

          test -f Data/ui_data.json

          echo "✓ Data/ui_data.json"

      # ======================================================
      # 15. Validate UI Data Contract
      # ======================================================

      - name: Validate UI Data Contract
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/ui_data.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/ui_data.json 不存在"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8-sig"
              )
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "❌ ui_data.status："
                  f"{data.get('status')}"
              )

          market = data.get("market")

          if not isinstance(market, dict):
              raise SystemExit(
                  "❌ ui_data.market 無效"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ ui_data.stocks 無效"
              )

          if not stocks:
              raise SystemExit(
                  "❌ ui_data.stocks 為 0"
              )

          tabs = data.get("tabs")

          if not isinstance(tabs, dict):
              raise SystemExit(
                  "❌ ui_data.tabs 無效"
              )

          required_tabs = {
              "today_picks",
              "top10",
              "etf",
              "bond",
              "watchlist",
          }

          missing = required_tabs - set(tabs)

          if missing:
              raise SystemExit(
                  "❌ ui_data.tabs 缺少："
                  f"{sorted(missing)}"
              )

          for symbol, item in stocks.items():
              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ UI stock {symbol} 不是 object"
                  )

              if item.get("symbol") != symbol:
                  raise SystemExit(
                      f"❌ UI symbol mismatch：{symbol}"
                  )

              if item.get("strength") not in {
                  "強勢",
                  "中性",
                  "弱勢",
              }:
                  raise SystemExit(
                      f"❌ {symbol} strength 無效："
                      f"{item.get('strength')}"
                  )

          def symbols(items):
              result = []

              if not isinstance(items, list):
                  return result

              for item in items:
                  if isinstance(item, str):
                      result.append(item)

                  elif isinstance(item, dict):
                      value = (
                          item.get("symbol")
                          or item.get("code")
                      )

                      if value:
                          result.append(value)

              return result

          today = set(symbols(tabs["today_picks"]))
          top10 = set(symbols(tabs["top10"]))
          etf = set(symbols(tabs["etf"]))
          bond = set(symbols(tabs["bond"]))

          if not top10 <= today:
              raise SystemExit(
                  "❌ Top10 必須是今日精選的子集合"
              )

          for symbol in etf:
              instrument_type = (
                  stocks.get(symbol, {}).get("instrument_type")
              )

              if instrument_type != "etf":
                  raise SystemExit(
                      f"❌ ETF tab 包含非 ETF：{symbol}"
                  )

          for symbol in bond:
              instrument_type = (
                  stocks.get(symbol, {}).get("instrument_type")
              )

              if instrument_type != "bond":
                  raise SystemExit(
                      f"❌ Bond tab 包含非 bond：{symbol}"
                  )

          print(f"✓ UI stocks：{len(stocks)}")
          print(f"✓ 今日精選：{len(today)}")
          print(f"✓ Top10：{len(top10)}")
          print(f"✓ ETF：{len(etf)}")
          print(f"✓ Bond：{len(bond)}")
          print("✓ UI data contract PASS")
          PY

      # ======================================================
      # 16. Final Data Contract
      # ======================================================

      - name: Final Data Contract
        run: |
          set -e

          test -f Data/universe.json
          test -f Data/chip.json
          test -f Data/prices/manifest.json
          test -f Data/market.json
          test -f Data/analysis.json
          test -f Data/ui_data.json
          test -f index.html

          echo "========================================"
          echo "FINAL DATA CONTRACT"
          echo "========================================"

          echo "✓ universe.json"
          echo "✓ chip.json"
          echo "✓ prices/manifest.json"
          echo "✓ market.json"
          echo "✓ analysis.json"
          echo "✓ ui_data.json"
          echo "✓ index.html"

          echo "========================================"
          echo "FINAL DATA CONTRACT PASS"
          echo "========================================"

      # ======================================================
      # 17. Commit updated data
      # ======================================================

      - name: Commit updated data
        shell: bash
        run: |
          set -e

          rm -f .fetch_prices.log

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update Taiwan stock AI data"

          git push
