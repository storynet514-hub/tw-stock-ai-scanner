name: Update Stock Data

on:
  schedule:
    - cron: "30 8 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. 取得目前 repository
      # ======================================================

      - name: Checkout
        uses: actions/checkout@v4

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # ======================================================
      # 4. 檢查 Data 目錄
      # ======================================================

      - name: Check data files
        run: |
          echo "================================"
          echo "檢查 Data 目錄"
          echo "================================"

          mkdir -p Data

          echo "目前 Data 內容："
          ls -lah Data || true

          echo ""
          echo "stocks.json："
          if [ -f Data/stocks.json ]; then
            wc -c Data/stocks.json
          else
            echo "不存在"
          fi

          echo ""
          echo "prices.json："
          if [ -f Data/prices.json ]; then
            wc -c Data/prices.json
          else
            echo "不存在"
          fi

      # ======================================================
      # 5. Fetch
      #
      # V10.2 已經不要求 stocks.json 必須存在。
      # ======================================================

      - name: Fetch stock data V10.2
        run: |
          python Scripts/fetch_data.py

      # ======================================================
      # 6. 分類 / UI 對應修正
      # ======================================================

      - name: Add classification
        run: |
          python Scripts/add_classification.py

      # ======================================================
      # 7. 驗證 prices.json
      # ======================================================

      - name: Validate generated prices.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/prices.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/prices.json 不存在"
              )

          if path.stat().st_size == 0:
              raise SystemExit(
                  "❌ Data/prices.json 是空檔案"
              )

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("================================")
          print("prices.json 驗證")
          print("================================")

          print(
              "status:",
              data.get("status")
          )

          print(
              "version:",
              data.get("version")
          )

          print(
              "date:",
              data.get("date")
          )

          print(
              "latest_market_date:",
              data.get(
                  "latest_market_date"
              )
          )

          summary = data.get(
              "summary",
              {}
          )

          print(
              "stock_count:",
              summary.get(
                  "stock_count"
              )
          )

          print(
              "today_selected_count:",
              summary.get(
                  "today_selected_count"
              )
          )

          print(
              "core_condition_count:",
              summary.get(
                  "core_condition_count"
              )
          )

          if data.get("status") != "success":
              raise SystemExit(
                  "❌ prices.json status 不是 success"
              )

          if not data.get("date"):
              raise SystemExit(
                  "❌ prices.json 缺少 date"
              )

          if not data.get(
              "latest_market_date"
          ):
              raise SystemExit(
                  "❌ prices.json 缺少 latest_market_date"
              )

          if (
              data.get("date")
              != data.get(
                  "latest_market_date"
              )
          ):
              raise SystemExit(
                  "❌ date 與 latest_market_date 不一致"
              )

          print(
              "================================"
          )

          print(
              "✅ prices.json 驗證通過"
          )
          PY

      # ======================================================
      # 8. Git commit
      # ======================================================

      - name: Commit updated data
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Data/prices.json \
            Data/stocks.json \
            index.html

          if git diff --cached --quiet; then
            echo "沒有資料需要提交"
          else
            git commit \
              -m "Update Taiwan stock data V10.2"

            git push
          fi
