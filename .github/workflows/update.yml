name: 台股 AI 選股系統 - 每日更新

on:
  schedule:
    - cron: "30 8 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  update:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ============================================================
      # 3. Install dependencies
      # ============================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip

          pip install \
            pandas \
            requests

      # ============================================================
      # 4. Verify project structure
      # ============================================================

      - name: Verify required files
        run: |
          set -e

          echo "========================================"
          echo "Verify required files"
          echo "========================================"

          REQUIRED_FILES=(
            "Scripts/build_universe.py"
            "Scripts/fetch_prices.py"
            "Scripts/fetch_chip.py"
            "Scripts/analyze_stocks.py"
            "Scripts/build_ui_data.py"
            "Data/universe.json"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do

            if [ ! -f "$FILE" ]; then

              echo "❌ 找不到必要檔案：$FILE"

              exit 1

            fi

            echo "✓ $FILE"

          done

      # ============================================================
      # 5. Build Universe
      # ============================================================

      - name: Run build_universe.py
        run: |

          set -e

          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py

      # ============================================================
      # 6. Verify Universe
      # ============================================================

      - name: Verify universe.json
        run: |
          set -e

          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 格式錯誤：根節點不是 object"
              )

          # --------------------------------------------------
          # build_universe.py V10.2 的正式格式：
          #
          # {
          #   "schema_version": "...",
          #   "universe_count": 2143,
          #   "stocks": {
          #       "2337": {...},
          #       "2426": {...}
          #   }
          # }
          #
          # 舊版 Verify 檢查的是：
          #     data["items"]
          #
          # 這已經與現在的 universe.json 架構不一致。
          # --------------------------------------------------

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.json stocks 格式錯誤："
                  "應為 object/dict"
              )

          if len(stocks) == 0:
              raise SystemExit(
                  "❌ universe.json stocks 沒有任何股票"
              )

          # --------------------------------------------------
          # 基本數量驗證
          # --------------------------------------------------

          universe_count = data.get("universe_count")

          if universe_count is not None:
              if universe_count != len(stocks):
                  raise SystemExit(
                      f"❌ universe_count 不一致："
                      f"header={universe_count}, "
                      f"實際={len(stocks)}"
                  )

          print(
              f"✓ Universe：{len(stocks)} 檔"
          )

          # --------------------------------------------------
          # 固定股票驗證
          # --------------------------------------------------

          expected = {
              "2337": {
                  "name": "旺宏",
                  "market": "TWSE",
              },
              "2426": {
                  "name": "鼎元",
                  "market": "TWSE",
              },
              "2368": {
                  "name": "金像電",
                  "market": "TWSE",
              },
              "3081": {
                  "name": "聯亞",
                  "market": "TPEX",
              },
          }

          for code, expected_item in expected.items():

              item = stocks.get(code)

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ 找不到股票：{code}"
                  )

              name = str(
                  item.get("name", "")
              ).strip()

              market = str(
                  item.get("market", "")
              ).strip().upper()

              if name != expected_item["name"]:
                  raise SystemExit(
                      f"❌ {code} 名稱錯誤："
                      f"實際={name}，"
                      f"預期={expected_item['name']}"
                  )

              if market != expected_item["market"]:
                  raise SystemExit(
                      f"❌ {code} 市場錯誤："
                      f"實際={market}，"
                      f"預期={expected_item['market']}"
                  )

              print(
                  f"✓ {code} | "
                  f"{name} | "
                  f"{market}"
              )

          # --------------------------------------------------
          # 全市場名稱完整性
          # --------------------------------------------------

          missing_name = []

          for code, item in stocks.items():

              if not isinstance(item, dict):
                  missing_name.append(code)
                  continue

              name = str(
                  item.get("name", "")
              ).strip()

              if not name:
                  missing_name.append(code)

          if missing_name:

              print(
                  "❌ 發現名稱缺失："
                  f"{len(missing_name)} 檔"
              )

              for code in missing_name[:50]:
                  print(f"   {code}")

              raise SystemExit(
                  "❌ universe.json 存在空白 name"
              )

          print(
              f"✓ 全部 {len(stocks)} 檔名稱完整"
          )

          # --------------------------------------------------
          # 股票代號唯一性
          # --------------------------------------------------

          codes = list(stocks.keys())

          if len(codes) != len(set(codes)):
              raise SystemExit(
                  "❌ universe.json 存在重複股票代號"
              )

          print(
              f"✓ 股票代號唯一：{len(codes)} 檔"
          )

          # --------------------------------------------------
          # schema_version
          # --------------------------------------------------

          version = data.get(
              "schema_version",
              "UNKNOWN"
          )

          print(
              f"✓ schema_version：{version}"
          )

          # --------------------------------------------------
          # 最終成功
          # --------------------------------------------------

          print("========================================")
          print("✓ Verify universe.json PASS")
          print("========================================")
          PY

      # ============================================================
      # 7. Fetch Prices
      # ============================================================

      - name: Run fetch_prices.py
        run: |

          set -e

          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py

      # ============================================================
      # 8. Verify Prices
      # ============================================================

      - name: Verify price shards
        run: |

          set -e

          echo "========================================"
          echo "Verify price shards"
          echo "========================================"

          if [ ! -d "Data/prices" ]; then

            echo "❌ Data/prices 不存在"

            exit 1

          fi

          COUNT=$(
            find Data/prices \
              -maxdepth 1 \
              -type f \
              -name "prices_*.json" \
              | wc -l
          )

          if [ "$COUNT" -eq 0 ]; then

            echo "❌ 找不到 prices_*.json"

            exit 1

          fi

          echo "✓ 價格分檔：$COUNT 個"

      # ============================================================
      # 9. Fetch Chip
      # ============================================================

      - name: Run fetch_chip.py
        run: |

          set -e

          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py

      # ============================================================
      # 10. Verify Chip
      # ============================================================

      - name: Verify chip.json
        run: |

          set -e

          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          python - <<'PY'

          import json
          from pathlib import Path

          path = Path("Data/chip.json")

          if not path.exists():

              raise SystemExit(
                  "❌ Data/chip.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:

              data = json.load(f)

          if not isinstance(data, dict):

              raise SystemExit(
                  "❌ chip.json 格式錯誤"
              )

          print(
              f"✓ Chip：{len(data)} 筆"
          )

          PY

      # ============================================================
      # 11. Analyze Stocks
      # ============================================================

      - name: Run analyze_stocks.py
        run: |

          set -e

          echo "========================================"
          echo "Running analyze_stocks.py"
          echo "========================================"

          python Scripts/analyze_stocks.py

      # ============================================================
      # 12. Verify Analysis
      # ============================================================

      - name: Verify analysis.json
        run: |

          set -e

          echo "========================================"
          echo "Verify analysis.json"
          echo "========================================"

          python - <<'PY'

          import json
          from pathlib import Path

          path = Path("Data/analysis.json")

          if not path.exists():

              raise SystemExit(
                  "❌ Data/analysis.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:

              data = json.load(f)

          if not isinstance(data, dict):

              raise SystemExit(
                  "❌ analysis.json 格式錯誤"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):

              raise SystemExit(
                  "❌ analysis.json stocks 格式錯誤"
              )

          if len(stocks) == 0:

              raise SystemExit(
                  "❌ analysis.json stocks 為空"
              )

          candidates = data.get(
              "short_term_candidates",
              []
          )

          if not isinstance(
              candidates,
              list
          ):

              raise SystemExit(
                  "❌ short_term_candidates 格式錯誤"
              )

          print(
              f"✓ Analysis：{len(stocks)} 檔"
          )

          print(
              f"✓ 六項核心候選：{len(candidates)} 檔"
          )

          PY

      # ============================================================
      # 13. Build UI Data
      #
      # 這一步是目前缺失的核心
      #
      # analysis.json
      #       ↓
      # build_ui_data.py
      #       ↓
      # ui_data.json
      # ============================================================

      - name: Run build_ui_data.py
        run: |

          set -e

          echo "========================================"
          echo "Running build_ui_data.py"
          echo "========================================"

          python Scripts/build_ui_data.py

      # ============================================================
      # 14. Verify UI Data
      #
      # 防止：
      #
      # Action 顯示成功
      # 但 ui_data.json 是舊檔案
      # 或 stocks 為空
      # ============================================================

      - name: Verify ui_data.json
        run: |

          set -e

          echo "========================================"
          echo "Verify ui_data.json"
          echo "========================================"

          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "Data/ui_data.json"
          )

          # --------------------------------------------------------
          # 檔案存在
          # --------------------------------------------------------

          if not path.exists():

              raise SystemExit(
                  "❌ Data/ui_data.json 不存在"
              )

          # --------------------------------------------------------
          # JSON
          # --------------------------------------------------------

          try:

              with path.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:

                  data = json.load(f)

          except Exception as exc:

              raise SystemExit(
                  f"❌ ui_data.json JSON 讀取失敗：{exc}"
              )

          # --------------------------------------------------------
          # Object
          # --------------------------------------------------------

          if not isinstance(
              data,
              dict
          ):

              raise SystemExit(
                  "❌ ui_data.json 必須是 object"
              )

          # --------------------------------------------------------
          # 必要欄位
          # --------------------------------------------------------

          required_keys = {

              "schema_version",

              "generated_at",

              "status",

              "market",

              "summary",

              "tabs",

              "stocks",

          }

          missing = (
              required_keys
              - set(data.keys())
          )

          if missing:

              raise SystemExit(
                  "❌ ui_data.json 缺少必要欄位："
                  + ", ".join(
                      sorted(missing)
                  )
              )

          # --------------------------------------------------------
          # Schema
          # --------------------------------------------------------

          schema = data.get(
              "schema_version"
          )

          if schema != "UI-DATA-2.0":

              raise SystemExit(
                  "❌ schema_version 錯誤："
                  + str(schema)
              )

          # --------------------------------------------------------
          # Stocks
          # --------------------------------------------------------

          stocks = data.get(
              "stocks"
          )

          if not isinstance(
              stocks,
              dict
          ):

              raise SystemExit(
                  "❌ ui_data.json stocks 必須是 object"
              )

          if len(stocks) == 0:

              raise SystemExit(
                  "❌ ui_data.json stocks 為空"
              )

          # --------------------------------------------------------
          # Tabs
          # --------------------------------------------------------

          tabs = data.get(
              "tabs"
          )

          if not isinstance(
              tabs,
              dict
          ):

              raise SystemExit(
                  "❌ ui_data.json tabs 必須是 object"
              )

          required_tabs = {

              "today_picks",

              "top10",

              "etf",

              "bond",

              "watchlist",

          }

          missing_tabs = (
              required_tabs
              - set(tabs.keys())
          )

          if missing_tabs:

              raise SystemExit(
                  "❌ tabs 缺少："
                  + ", ".join(
                      sorted(missing_tabs)
                  )
              )

          # --------------------------------------------------------
          # 每個 tab 都必須是 array
          # --------------------------------------------------------

          for tab_name in required_tabs:

              if not isinstance(
                  tabs[tab_name],
                  list
              ):

                  raise SystemExit(
                      f"❌ tabs.{tab_name} 必須是 array"
                  )

          # --------------------------------------------------------
          # Summary
          # --------------------------------------------------------

          summary = data.get(
              "summary"
          )

          if not isinstance(
              summary,
              dict
          ):

              raise SystemExit(
                  "❌ summary 必須是 object"
              )

          today_count = len(
              tabs["today_picks"]
          )

          summary_count = summary.get(
              "today_picks"
          )

          if summary_count != today_count:

              raise SystemExit(
                  "❌ summary.today_picks 與 "
                  "tabs.today_picks 數量不一致"
              )

          # --------------------------------------------------------
          # Holdings
          # --------------------------------------------------------

          if (

              summary.get(
                  "has_holdings"
              ) is False

              and

              summary.get(
                  "holdings_profit"
              ) is not None

          ):

              raise SystemExit(
                  "❌ 沒有持倉時不得產生 holdings_profit"
              )

          # --------------------------------------------------------
          # Watchlist
          # --------------------------------------------------------

          if tabs["watchlist"]:

              raise SystemExit(
                  "❌ watchlist 不允許建立預設股票"
              )

          # --------------------------------------------------------
          # 完成
          # --------------------------------------------------------

          print(
              "✓ ui_data.json 驗證成功"
          )

          print(
              f"✓ schema_version：{schema}"
          )

          print(
              f"✓ UI stocks：{len(stocks)}"
          )

          print(
              f"✓ 今日精選：{len(tabs['today_picks'])}"
          )

          print(
              f"✓ Top 10：{len(tabs['top10'])}"
          )

          print(
              f"✓ ETF：{len(tabs['etf'])}"
          )

          print(
              f"✓ 債券：{len(tabs['bond'])}"
          )

          print(
              "✓ 我的清單：初始空白"
          )

          PY

      # ============================================================
      # 15. Final Data Consistency Check
      #
      # 確認 analysis → UI 沒有斷掉
      # ============================================================

      - name: Verify analysis to UI connection
        run: |

          set -e

          echo "========================================"
          echo "Verify analysis → UI connection"
          echo "========================================"

          python - <<'PY'

          import json

          with open(
              "Data/analysis.json",
              "r",
              encoding="utf-8-sig"
          ) as f:

              analysis = json.load(f)

          with open(
              "Data/ui_data.json",
              "r",
              encoding="utf-8-sig"
          ) as f:

              ui = json.load(f)

          analysis_stocks = analysis.get(
              "stocks",
              {}
          )

          ui_stocks = ui.get(
              "stocks",
              {}
          )

          candidates = analysis.get(
              "short_term_candidates",
              []
          )

          today_picks = ui.get(
              "tabs",
              {}
          ).get(
              "today_picks",
              []
          )

          # --------------------------------------------------------
          # 股票數量
          # --------------------------------------------------------

          if len(
              analysis_stocks
          ) == 0:

              raise SystemExit(
                  "❌ analysis.json 沒有股票"
              )

          if len(
              ui_stocks
          ) == 0:

              raise SystemExit(
                  "❌ ui_data.json 沒有股票"
              )

          # --------------------------------------------------------
          # 今日精選
          # --------------------------------------------------------

          normalized_candidates = []

          for symbol in candidates:

              symbol = str(
                  symbol
              ).strip().upper()

              if symbol.endswith(
                  ".TW"
              ):

                  symbol = symbol[:-3]

              elif symbol.endswith(
                  ".TWO"
              ):

                  symbol = symbol[:-4]

              if symbol:

                  normalized_candidates.append(
                      symbol
                  )

          normalized_candidates = [

              symbol

              for symbol
              in normalized_candidates

              if symbol in ui_stocks

              and ui_stocks[
                  symbol
              ].get(
                  "instrument_type"
              ) == "stock"

          ]

          if (
              normalized_candidates
              != today_picks
          ):

              raise SystemExit(
                  "❌ analysis.json → "
                  "ui_data.json 今日精選對接錯誤"
              )

          print(
              "✓ analysis stocks → UI stocks：成功"
          )

          print(
              f"✓ analysis stocks：{len(analysis_stocks)}"
          )

          print(
              f"✓ UI stocks：{len(ui_stocks)}"
          )

          print(
              f"✓ 六項核心候選：{len(candidates)}"
          )

          print(
              f"✓ 今日精選：{len(today_picks)}"
          )

          PY

      # ============================================================
      # 16. Show Final Files
      # ============================================================

      - name: Show generated files
        run: |

          set -e

          echo "========================================"
          echo "Generated data files"
          echo "========================================"

          ls -lh \
            Data/analysis.json \
            Data/ui_data.json \
            Data/chip.json

          echo ""

          echo "Price shards:"

          find Data/prices \
            -maxdepth 1 \
            -type f \
            -name "prices_*.json" \
            -print \
            | sort

      # ============================================================
      # 17. Commit and Push
      #
      # 最重要：
      #
      # 必須包含 Data/ui_data.json
      # ============================================================

      - name: Commit updated data
        run: |

          set -e

          echo "========================================"
          echo "Commit updated data"
          echo "========================================"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # --------------------------------------------------------
          # Add generated data
          # --------------------------------------------------------

          git add Data/universe.json

          git add Data/prices/

          git add Data/chip.json

          git add Data/analysis.json

          git add Data/ui_data.json

          # --------------------------------------------------------
          # Check changes
          # --------------------------------------------------------

          if git diff --cached --quiet; then

            echo "沒有新的資料變更。"

            exit 0

          fi

          # --------------------------------------------------------
          # Commit
          # --------------------------------------------------------

          git commit \
            -m "chore: update Taiwan stock AI data"

          # --------------------------------------------------------
          # Push
          # --------------------------------------------------------

          git push

          echo ""

          echo "========================================"

          echo "✓ 資料已成功 Commit / Push"

          echo "========================================"
