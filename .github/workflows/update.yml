name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4


      # ======================================================
      # 4. 專案結構
      # ======================================================

      - name: Check project structure
        run: |
          echo "========================================"
          echo "Project structure"
          echo "========================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Scripts:"
          ls -la Scripts

          echo ""
          echo "Data:"
          ls -la Data

          echo ""
          echo "Workflow:"
          ls -la .github/workflows


      # ======================================================
      # 5. 必要檔案
      # ======================================================

      - name: Verify required files
        run: |
          set -e

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_chip.py
          test -f Data/universe.json

          echo "✓ build_universe.py"
          echo "✓ fetch_prices.py"
          echo "✓ fetch_chip.py"
          echo "✓ universe.json"


      # ======================================================
      # 6. 建立全市場 Universe
      #
      # 重要：
      # build_universe.py 失敗時，
      # 此 step 直接 exit 1。
      #
      # GitHub Actions 不會繼續執行後續 steps。
      # ======================================================

      - name: Build market universe
        run: |
          set -e

          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py


      # ======================================================
      # 7. 嚴格驗證 Universe
      # ======================================================

      - name: Verify universe.json
        run: |
          set -e

          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          test -f Data/universe.json

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path("Data/universe.json")

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: universe.json 頂層不是 object"
              )

          items = data.get("items")

          if not isinstance(items, list):
              raise SystemExit(
                  "ERROR: universe.json items 不是 list"
              )

          total = data.get("total")
          listed = data.get("listed_stocks")
          otc = data.get("otc_stocks")

          print("version:", data.get("version"))
          print("generated_at:", data.get("generated_at"))
          print("total:", total)
          print("listed_stocks:", listed)
          print("otc_stocks:", otc)
          print("items:", len(items))

          # --------------------------------------------------
          # 基本安全門檻
          # --------------------------------------------------

          if len(items) < 1200:
              raise SystemExit(
                  f"ERROR: Universe Total 不足："
                  f"{len(items)} < 1200"
              )

          if not isinstance(listed, int):
              raise SystemExit(
                  "ERROR: listed_stocks 不是整數"
              )

          if not isinstance(otc, int):
              raise SystemExit(
                  "ERROR: otc_stocks 不是整數"
              )

          if listed < 700:
              raise SystemExit(
                  f"ERROR: TWSE 不足："
                  f"{listed} < 700"
              )

          if otc < 300:
              raise SystemExit(
                  f"ERROR: TPEx 不足："
                  f"{otc} < 300"
              )

          if total != len(items):
              raise SystemExit(
                  f"ERROR: total ({total}) "
                  f"與 items ({len(items)}) 不一致"
              )

          # --------------------------------------------------
          # 股票格式驗證
          # --------------------------------------------------

          valid = 0
          invalid = 0
          twse_items = 0
          tpex_items = 0

          seen = set()

          for item in items:

              if not isinstance(item, dict):
                  invalid += 1
                  continue

              symbol = str(
                  item.get("symbol") or ""
              ).strip().upper()

              market = str(
                  item.get("market") or ""
              ).strip()

              if not re.fullmatch(
                  r"\d{4,6}\.(TW|TWO)",
                  symbol
              ):
                  invalid += 1
                  continue

              if market not in {
                  "TWSE",
                  "TPEx"
              }:
                  invalid += 1
                  continue

              if symbol in seen:
                  invalid += 1
                  continue

              seen.add(symbol)

              valid += 1

              if market == "TWSE":
                  twse_items += 1

              elif market == "TPEx":
                  tpex_items += 1

          print("")
          print("valid symbols:", valid)
          print("invalid items:", invalid)
          print("TWSE items:", twse_items)
          print("TPEx items:", tpex_items)

          if valid != len(items):
              raise SystemExit(
                  "ERROR: Universe 存在非法股票項目"
              )

          if twse_items < 700:
              raise SystemExit(
                  "ERROR: Universe TWSE 驗證失敗"
              )

          if tpex_items < 300:
              raise SystemExit(
                  "ERROR: Universe TPEx 驗證失敗"
              )

          print("")
          print("First 5 stocks:")

          for item in items[:5]:
              print(
                  " ",
                  item.get("symbol"),
                  item.get("name"),
                  item.get("market")
              )

          print("")
          print("✓ Universe validation passed")
          PY


      # ======================================================
      # 8. 取得價格資料
      #
      # 完全使用現有 fetch_prices.py
      # ======================================================

      - name: Fetch price data
        run: |
          set -e

          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py


      # ======================================================
      # 9. 驗證價格分檔
      # ======================================================

      - name: Verify price shards
        run: |
          set -e

          echo "========================================"
          echo "Verify Data/prices/"
          echo "========================================"

          test -d Data/prices
          test -f Data/prices/manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          prices_dir = Path("Data/prices")

          manifest_path = (
              prices_dir / "manifest.json"
          )

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          if not isinstance(manifest, dict):
              raise SystemExit(
                  "ERROR: manifest.json "
                  "頂層不是 object"
              )

          print(
              "manifest.json JSON OK"
          )

          print(
              "version:",
              manifest.get("version")
          )

          print(
              "schema_version:",
              manifest.get("schema_version")
          )

          print(
              "generated_at:",
              manifest.get("generated_at")
          )

          files = manifest.get("files")

          if files is None:
              files = manifest.get("shards")

          if not isinstance(files, list):
              raise SystemExit(
                  "ERROR: manifest files/shards "
                  "必須是 list"
              )

          if not files:
              raise SystemExit(
                  "ERROR: manifest 沒有價格分檔"
              )

          total_stocks = 0

          for entry in files:

              if isinstance(entry, str):

                  filename = entry

              elif isinstance(entry, dict):

                  filename = (
                      entry.get("file")
                      or entry.get("filename")
                      or entry.get("path")
                      or entry.get("name")
                  )

              else:

                  raise SystemExit(
                      "ERROR: manifest "
                      "分檔格式錯誤"
                  )

              if not filename:

                  raise SystemExit(
                      "ERROR: manifest "
                      "出現空白檔名"
                  )

              path = (
                  prices_dir / filename
              )

              if not path.exists():

                  raise SystemExit(
                      f"ERROR: 找不到分檔：{path}"
                  )

              if path.stat().st_size <= 0:

                  raise SystemExit(
                      f"ERROR: 分檔為空：{path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:

                  shard = json.load(f)

              if not isinstance(
                  shard,
                  dict
              ):

                  raise SystemExit(
                      f"ERROR: {filename} "
                      "頂層不是 object"
                  )

              stocks = shard.get(
                  "stocks"
              )

              if not isinstance(
                  stocks,
                  dict
              ):

                  stocks = shard.get(
                      "prices"
                  )

              if not isinstance(
                  stocks,
                  dict
              ):

                  stocks = shard.get(
                      "data"
                  )

              if not isinstance(
                  stocks,
                  dict
              ):

                  raise SystemExit(
                      f"ERROR: {filename} "
                      "股票資料不是 object"
                  )

              count = len(stocks)

              if count <= 0:

                  raise SystemExit(
                      f"ERROR: {filename} "
                      "沒有股票資料"
                  )

              total_stocks += count

              print(
                  f"✓ {filename} validated | "
                  f"{count} stocks | "
                  f"{path.stat().st_size / 1024 / 1024:.2f} MB"
              )

          print("")
          print("========================================")
          print("Price shard validation summary")
          print("========================================")

          print(
              "files:",
              len(files)
          )

          print(
              "stocks:",
              total_stocks
          )

          if total_stocks <= 0:

              raise SystemExit(
                  "ERROR: 沒有任何價格資料"
              )

          manifest_count = (
              manifest.get("count")
          )

          if manifest_count is not None:

              try:

                  manifest_count = int(
                      manifest_count
                  )

              except Exception:

                  raise SystemExit(
                      "ERROR: manifest "
                      "count 格式錯誤"
                  )

              if manifest_count != total_stocks:

                  raise SystemExit(
                      "ERROR: manifest count "
                      f"({manifest_count}) "
                      "與實際股票數 "
                      f"({total_stocks}) "
                      "不一致"
                  )

          print(
              "✓ Price shard validation passed"
          )
          PY


      # ======================================================
      # 10. Debug Universe
      # ======================================================

      - name: Inspect universe for chip
        run: |
          set -e

          echo "========================================"
          echo "Inspect Data/universe.json before chip"
          echo "========================================"

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Top-level type:",
              type(data).__name__
          )

          print(
              "version:",
              data.get("version")
          )

          print(
              "total:",
              data.get("total")
          )

          print(
              "listed_stocks:",
              data.get("listed_stocks")
          )

          print(
              "otc_stocks:",
              data.get("otc_stocks")
          )

          items = data.get(
              "items",
              []
          )

          print(
              "items count:",
              len(items)
          )

          if not items:

              raise SystemExit(
                  "ERROR: Universe "
                  "在 Fetch chip 前為空"
              )

          print("")
          print("First 3 items:")

          for item in items[:3]:
              print(item)

          print("")
          print("Last 3 items:")

          for item in items[-3:]:
              print(item)

          print("")
          print(
              "✓ Universe ready for chip"
          )
          PY


      # ======================================================
      # 11. 取得主力籌碼
      # ======================================================

      - name: Fetch chip data
        run: |
          set -e

          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 12. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |
          set -e

          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          test -f Data/chip.json

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          if not isinstance(
              data,
              dict
          ):

              raise SystemExit(
                  "ERROR: chip.json "
                  "頂層不是 object"
              )

          stocks = data.get(
              "stocks"
          )

          if not isinstance(
              stocks,
              dict
          ):

              raise SystemExit(
                  "ERROR: chip.json "
                  "stocks 不是 object"
              )

          print(
              "chip.json JSON OK"
          )

          print(
              "schema_version:",
              data.get("schema_version")
          )

          print(
              "data_date:",
              data.get("data_date")
          )

          print(
              "universe_count:",
              data.get("universe_count")
          )

          print(
              "stocks:",
              len(stocks)
          )

          if not stocks:

              raise SystemExit(
                  "ERROR: chip.json "
                  "沒有股票資料"
              )

          statistics = data.get(
              "statistics",
              {}
          )

          print(
              "complete:",
              statistics.get("complete")
          )

          print(
              "partial:",
              statistics.get("partial")
          )

          print(
              "insufficient:",
              statistics.get("insufficient")
          )

          valid_5d = 0
          valid_10d = 0

          for symbol, record in stocks.items():

              if not isinstance(
                  record,
                  dict
              ):
                  continue

              if record.get(
                  "main_force_5d"
              ) is not None:

                  valid_5d += 1

              if record.get(
                  "main_force_10d"
              ) is not None:

                  valid_10d += 1

          print(
              "valid main_force_5d:",
              valid_5d
          )

          print(
              "valid main_force_10d:",
              valid_10d
          )

          if valid_5d <= 0:

              raise SystemExit(
                  "ERROR: 沒有有效主力5日資料"
              )

          print(
              "✓ chip.json validation passed"
          )
          PY


      # ======================================================
      # 13. 顯示資料檔案
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated data files"
          echo "========================================"

          echo ""
          echo "Data:"
          ls -lh Data/

          echo ""
          echo "Price shards:"
          ls -lh Data/prices/

          echo ""
          echo "Git status:"
          git status --short


      # ======================================================
      # 14. Commit / Push
      # ======================================================

      - name: Commit updated data
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # -----------------------------------------------
          # 新正式資料
          # -----------------------------------------------

          git add Data/universe.json
          git add Data/prices/
          git add Data/chip.json

          # -----------------------------------------------
          # 舊架構 prices.json 移除
          # -----------------------------------------------

          if [ -f Data/prices.json ]; then
            git rm -f Data/prices.json
          fi

          # -----------------------------------------------
          # 判斷是否有變更
          # -----------------------------------------------

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit \
              -m "Update stock universe, price shards and chip data"

            git push

          fi