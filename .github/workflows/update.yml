name: 台股AI選股系統自動更新

on:
  schedule:
    # 台灣時間 16:30
    # GitHub Actions 使用 UTC，所以是 08:30 UTC
    - cron: "30 8 * * 1-5"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. 取得 Repository
      # =====================================================

      - name: Checkout Repository
        uses: actions/checkout@v4

      # =====================================================
      # 2. 設定 Python
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # =====================================================
      # 3. 安裝套件
      # =====================================================

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests

      # =====================================================
      # 4. 執行台股資料更新
      # =====================================================

      - name: Fetch Taiwan Stock Data
        run: |
          python Scripts/fetch_data.py

      # =====================================================
      # 5. 驗證 prices.json
      # =====================================================

      - name: Validate prices.json
        run: |
          python - <<'PY'
          import json
          import os

          path = "Data/prices.json"
      - name: Debug 1319 RSI backend data
        run: |
          python - <<'PY'
          import json

          with open("Data/prices.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          found = []

          for key in ["today_selected", "top10", "etfs", "bonds"]:
              for item in data.get(key, []):
                  if str(item.get("code")) == "1319":
                      found.append(item)

          if not found:
              print("❌ 找不到 1319 東陽")
          else:
              item = found[0]

              print("===== 1319 東陽後台資料 =====")
              print("code:", item.get("code"))
              print("name:", item.get("name"))
              print("price:", item.get("price"))
              print("change_pct:", item.get("change_pct"))
              print("ai_score:", item.get("ai_score"))
              print("strength_score:", item.get("strength_score"))
              print("indicators:", item.get("indicators"))
              print("============================")
          PY
          if not os.path.exists(path):
              raise SystemExit("❌ Data/prices.json 不存在")

          if os.path.getsize(path) == 0:
              raise SystemExit("❌ Data/prices.json 是空檔案")

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit("❌ prices.json 格式錯誤：不是 JSON object")

          required = [
              "version",
              "schema_version",
              "status",
              "date",
              "latest_market_date",
              "today_selected",
              "top10",
              "summary"
          ]

          missing = [
              key for key in required
              if key not in data
          ]

          if missing:
              raise SystemExit(
                  "❌ prices.json 缺少欄位："
                  + ", ".join(missing)
              )

          print("✅ prices.json 驗證成功")
          print("版本：", data.get("version"))
          print("日期：", data.get("date"))
          print(
              "最新市場日期：",
              data.get("latest_market_date")
          )
          print(
              "6/6 選股數量：",
              data.get("summary", {}).get(
                  "today_selected_count"
              )
          )
          print(
              "股票數量：",
              data.get("summary", {}).get(
                  "stock_count"
              )
          )
          print(
              "ETF 數量：",
              data.get("summary", {}).get(
                  "etf_count"
              )
          )
          print(
              "債券數量：",
              data.get("summary", {}).get(
                  "bond_count"
              )
          )
          PY

      # =====================================================
      # 6. 顯示 Git 差異
      # =====================================================

      - name: Check Updated Files
        run: |
          git status --short

      # =====================================================
      # 7. 提交更新
      # =====================================================

      - name: Commit Updated Data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/prices.json

          if git diff --cached --quiet; then
            echo "ℹ️ Data/prices.json 沒有新的變更"
          else
            git commit -m "chore: update Taiwan stock data"
            git push
          fi
