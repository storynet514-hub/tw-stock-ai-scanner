name: 台股 AI 選股系統自動更新

on:
  workflow_dispatch:

  schedule:
    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "20 6 * * 1-5"
    - cron: "30 7 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: tw-stock-ai-scanner-update
  cancel-in-progress: false

jobs:

  update:

    name: 更新台股資料

    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. Checkout
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true


      # ==========================================================
      # 2. Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 3. 安裝套件
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            numpy \
            pandas \
            requests \
            yfinance


      # ==========================================================
      # 4. 執行 fetch_data.py
      # ==========================================================

      - name: Run fetch_data.py
        run: |

          echo "=============================================="
          echo "開始台股 AI 資料更新"
          echo "=============================================="

          echo "台灣時間："

          TZ=Asia/Taipei date \
            "+%Y-%m-%d %H:%M:%S"

          echo ""

          python Scripts/fetch_data.py


      # ==========================================================
      # 5. 驗證 fetch_data.py 產生的正式資料
      # ==========================================================

      - name: Validate generated files
        run: |

          echo "=============================================="
          echo "驗證輸出檔案"
          echo "=============================================="

          test -f Data/prices.json
          test -f Data/backtest.json
          test -f Data/ui_data.json
          test -f Data/securities.json

          echo ""
          echo "✓ Data/prices.json"
          echo "✓ Data/backtest.json"
          echo "✓ Data/ui_data.json"
          echo "✓ Data/securities.json"

          echo ""
          echo "檔案大小："

          ls -lh \
            Data/prices.json \
            Data/backtest.json \
            Data/ui_data.json \
            Data/securities.json


      # ==========================================================
      # 6. 驗證 ui_data.json JSON 格式
      # ==========================================================

      - name: Validate ui_data.json
        run: |

          python <<'PY'

          import json
          from pathlib import Path

          path = Path("Data/ui_data.json")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise RuntimeError(
                  "ui_data.json 不是 JSON object"
              )

          print("✓ ui_data.json JSON 格式正常")

          print(
              "JSON keys:",
              list(data.keys())
          )

          PY


      # ==========================================================
      # 7. 驗證今日正式 6/6 結果
      #
      # 注意：
      # 這裡只讀取 prices.json 已產生的正式結果。
      # 不重新計算。
      # ==========================================================

      - name: Print today's 6-6 selections
        run: |

          python <<'PY'

          import json
          from pathlib import Path

          path = Path("Data/prices.json")

          with path.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("")
          print("=" * 72)
          print("今日正式 6/6 選股結果")
          print("=" * 72)

          updated_at = data.get(
              "updated_at_tw",
              ""
          )

          print(
              f"更新時間：{updated_at}"
          )

          selected = data.get(
              "today_selected",
              []
          )

          print(
              f"符合 6/6 個股數量：{len(selected)}"
          )

          print("")

          if not selected:

              print(
                  "今日沒有符合全部六項核心條件的個股。"
              )

          else:

              for index, stock in enumerate(
                  selected,
                  start=1
              ):

                  print(
                      f"[{index}] "
                      f"{stock.get('code', '')} "
                      f"{stock.get('name', '')}"
                  )

                  print(
                      f"    收盤價："
                      f"{stock.get('price')}"
                  )

                  print(
                      f"    RSI："
                      f"{stock.get('rsi')}"
                  )

                  print(
                      f"    MACD："
                      f"{stock.get('macd')}"
                      f" / Signal："
                      f"{stock.get('macd_signal')}"
                  )

                  print(
                      f"    K/D："
                      f"{stock.get('k')}"
                      f" / "
                      f"{stock.get('d')}"
                  )

                  print(
                      f"    成交量："
                      f"{stock.get('volume')}"
                  )

                  print(
                      f"    5日均量："
                      f"{stock.get('volume_ma5')}"
                  )

                  print(
                      f"    量比："
                      f"{stock.get('volume_ratio')}"
                  )

                  print(
                      f"    MA20："
                      f"{stock.get('ma20')}"
                  )

                  print(
                      f"    MA20 向上："
                      f"{stock.get('ma20_up')}"
                  )

                  print(
                      f"    AI Score："
                      f"{stock.get('ai_score')}"
                  )

                  print(
                      f"    Signal："
                      f"{stock.get('signal')}"
                  )

                  print("")

          print("=" * 72)

          print("核心條件：")

          for condition in data.get(
              "core_conditions",
              {}
          ).get(
              "names",
              []
          ):

              print(
                  f"✓ {condition}"
              )

          print("=" * 72)

          PY


      # ==========================================================
      # 8. A/B 回測摘要
      # ==========================================================

      - name: Print backtest summary
        run: |

          python <<'PY'

          import json

          with open(
              "Data/backtest.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print("")
          print("=" * 72)
          print("A/B 歷史回測摘要")
          print("=" * 72)

          comparison = data.get(
              "comparison",
              {}
          )

          print(
              "比較基準："
              f"{comparison.get('comparison_horizon')} "
              "交易日"
          )

          print("")

          strategies = comparison.get(
              "strategies",
              {}
          )

          for strategy_name in [
              "A_today_cross",
              "B_current_bullish"
          ]:

              strategy = strategies.get(
                  strategy_name,
                  {}
              )

              if strategy_name == "A_today_cross":

                  print(
                      "A = 當日黃金交叉"
                  )

              else:

                  print(
                      "B = 目前維持多方"
                  )

              for horizon in [
                  "5d",
                  "10d",
                  "20d"
              ]:

                  stats = strategy.get(
                      horizon,
                      {}
                  )

                  print(
                      f"  {horizon}: "
                      f"樣本={stats.get('signals', 0)} "
                      f"勝率={stats.get('win_rate', 0)}% "
                      f"平均報酬={stats.get('average_return', 0)}%"
                  )

              print("")

          print(
              "勝率較高："
              f"{comparison.get('better_by_win_rate')}"
          )

          print("=" * 72)

          PY


      # ==========================================================
      # 9. 設定 Git 身份
      # ==========================================================

      - name: Configure Git
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


      # ==========================================================
      # 10. 同步最新 main
      #
      # 這裡非常重要：
      #
      # 四個正式資料檔全部暫存。
      #
      # ui_data.json 不再漏掉。
      # ==========================================================

      - name: Sync with latest main
        run: |

          echo "=============================================="
          echo "同步最新 main"
          echo "=============================================="

          git add \
            Data/prices.json \
            Data/backtest.json \
            Data/ui_data.json \
            Data/securities.json

          git stash push \
            -m "temporary generated stock data"

          git fetch origin main

          git reset \
            --hard \
            origin/main

          git stash pop || true

          echo ""

          git status --short


      # ==========================================================
      # 11. 再次確認 ui_data.json 還存在
      # ==========================================================

      - name: Verify generated files after sync
        run: |

          echo "=============================================="
          echo "同步後再次驗證"
          echo "=============================================="

          test -f Data/prices.json
          test -f Data/backtest.json
          test -f Data/ui_data.json
          test -f Data/securities.json

          echo ""
          echo "✓ prices.json"
          echo "✓ backtest.json"
          echo "✓ ui_data.json"
          echo "✓ securities.json"


      # ==========================================================
      # 12. Stage 正式資料
      # ==========================================================

      - name: Stage generated data
        run: |

          git add \
            Data/prices.json \
            Data/backtest.json \
            Data/ui_data.json \
            Data/securities.json

          echo ""
          echo "已加入 Git："

          git diff \
            --cached \
            --name-status


      # ==========================================================
      # 13. 檢查資料變更
      # ==========================================================

      - name: Check data changes
        id: changes
        run: |

          if git diff --cached --quiet; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

            echo ""
            echo "沒有新的資料需要提交"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

            echo ""
            echo "偵測到資料變更"

            git diff \
              --cached \
              --stat

          fi


      # ==========================================================
      # 14. Commit
      # ==========================================================

      - name: Commit generated data
        if: steps.changes.outputs.changed == 'true'
        run: |

          git commit \
            -m "自動更新台股資料"


      # ==========================================================
      # 15. Push
      # ==========================================================

      - name: Push generated data
        if: steps.changes.outputs.changed == 'true'
        run: |

          git push origin HEAD:main


      # ==========================================================
      # 16. 最終確認
      # ==========================================================

      - name: Final result
        run: |

          echo ""
          echo "=============================================="
          echo "台股 AI 選股系統更新完成"
          echo "=============================================="

          echo ""
          echo "台灣時間："

          TZ=Asia/Taipei date \
            "+%Y-%m-%d %H:%M:%S"

          echo ""

          echo "✓ fetch_data.py 完成"
          echo "✓ prices.json 完成"
          echo "✓ backtest.json 完成"
          echo "✓ ui_data.json 完成"
          echo "✓ securities.json 完成"
          echo "✓ 6/6 選股驗證完成"
          echo "✓ A/B 回測驗證完成"
          echo "✓ GitHub 資料同步完成"

          echo ""
          echo "=============================================="
