name: 台股 AI 選股系統自動更新

on:
  workflow_dispatch:

  schedule:
    # 台灣時間每個交易日 18:00 左右執行
    # GitHub Actions 使用 UTC
    - cron: "0 10 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. 取得最新 main
      # ==========================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # ==========================================================
      # 2. 設定 Python
      # ==========================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ==========================================================
      # 3. 安裝套件
      # ==========================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            numpy \
            pandas \
            requests \
            yfinance

      # ==========================================================
      # 4. 執行台股資料更新
      # ==========================================================

      - name: Run fetch_data.py
        run: |
          python Scripts/fetch_data.py

      # ==========================================================
      # 5. 確認輸出檔案
      # ==========================================================

      - name: Validate output
        run: |
          test -f Data/prices.json

          python - <<'PY'
          import json

          path = "Data/prices.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("status") != "success":
              raise RuntimeError("prices.json status 不是 success")

          if not isinstance(data.get("stocks"), list):
              raise RuntimeError("stocks 不是 list")

          if not isinstance(data.get("etfs"), list):
              raise RuntimeError("etfs 不是 list")

          if not isinstance(data.get("top30"), list):
              raise RuntimeError("top30 不是 list")

          if not isinstance(data.get("backtest_summary"), dict):
              raise RuntimeError("backtest_summary 不存在")

          print("prices.json 驗證成功")
          print("stocks:", len(data["stocks"]))
          print("etfs:", len(data["etfs"]))
          print("top30:", len(data["top30"]))
          print(
              "today_selected:",
              len(data.get("today_selected", []))
          )
          PY

      # ==========================================================
      # 6. Git 同步
      #
      # 重要：
      # 不再使用 git pull --rebase
      #
      # 因為 fetch_data.py 可能已經產生
      # Data/prices.json 的工作區變更。
      #
      # 先把遠端 main 同步進來，再重新產生資料，
      # 避免：
      #
      # error: cannot pull with rebase:
      # You have unstaged changes.
      # ==========================================================

      - name: Sync main
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main

          git reset --hard origin/main

      # ==========================================================
      # 7. 重新執行資料產生
      #
      # Sync main 後重新產生 prices.json，
      # 確保最新資料不會因 reset 被清掉。
      # ==========================================================

      - name: Generate latest data
        run: |
          python Scripts/fetch_data.py

      # ==========================================================
      # 8. 驗證最新資料
      # ==========================================================

      - name: Validate generated data
        run: |
          test -f Data/prices.json

          test -f Data/backtest.json

          python - <<'PY'
          import json

          with open(
              "Data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:
              prices = json.load(f)

          with open(
              "Data/backtest.json",
              "r",
              encoding="utf-8"
          ) as f:
              backtest = json.load(f)

          if prices.get("status") != "success":
              raise RuntimeError(
                  "prices.json status != success"
              )

          if backtest.get("status") != "completed":
              raise RuntimeError(
                  "backtest status != completed"
              )

          if len(prices.get("stocks", [])) < 50:
              raise RuntimeError(
                  "stocks 少於 50 筆"
              )

          if not prices.get("top30"):
              raise RuntimeError(
                  "top30 為空"
              )

          if not prices.get(
              "backtest_summary"
          ):
              raise RuntimeError(
                  "backtest_summary 為空"
              )

          print("================================")
          print("資料驗證成功")
          print("stocks:", len(prices["stocks"]))
          print("etfs:", len(prices["etfs"]))
          print("top30:", len(prices["top30"]))
          print(
              "today_selected:",
              len(
                  prices.get(
                      "today_selected",
                      []
                  )
              )
          )
          print(
              "backtest stocks:",
              backtest.get(
                  "sample_stocks",
                  0
              )
          )
          print("================================")
          PY

      # ==========================================================
      # 9. 提交資料
      # ==========================================================

      - name: Commit and push data
        run: |
          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/prices.json
          git add Data/backtest.json

          if git diff --cached --quiet; then
            echo "沒有新的資料需要提交"
            exit 0
          fi

          git commit \
            -m "自動更新台股 AI 選股資料"

          git push origin HEAD:main
