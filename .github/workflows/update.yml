name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # ======================================================
    # 台灣時間：
    #
    # 09:15
    # 10:30
    # 12:00
    # 14:30
    # 16:30
    # 17:30
    #
    # GitHub Actions 使用 UTC
    # ======================================================

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

      # ======================================================
      # 4. Verify Scripts
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/analyze_stocks.py
          test -f Scripts/build_ui_data.py

          mkdir -p Data

          echo "✓ Scripts/build_universe.py"
          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/fetch_prices.py"
          echo "✓ Scripts/analyze_stocks.py"
          echo "✓ Scripts/build_ui_data.py"
          echo "✓ Data/"

      # ======================================================
      # 5. Syntax Gate
      # ======================================================

      - name: Python syntax gate
        run: |
          set -e

          python -m py_compile \
            Scripts/build_universe.py \
            Scripts/fetch_chip.py \
            Scripts/fetch_prices.py \
            Scripts/analyze_stocks.py \
            Scripts/build_ui_data.py

          echo "✓ Python syntax PASS"

      # ======================================================
      # 6. Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          echo "========================================"
          echo "UNIVERSE BUILD COMPLETED"
          echo "========================================"

      # ======================================================
      # 7. Validate Universe
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.stocks 不是 object"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          if count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{item['market']}"
                  )

          print("")
          print("========================================")
          print("UNIVERSE VALIDATION")
          print("========================================")
          print(f"✓ Universe：{count}")
          print("✓ stocks object")
          print("✓ required fields")
          print("✓ status=active")
          print("✓ market validation")
          print("✓ Universe validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 8. Fetch Chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

          test -f Data/chip.json

          echo "✓ Data/chip.json"

      # ======================================================
      # 9. Fetch Prices
      # ======================================================

      - name: Fetch Price Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH PRICE DATA"
          echo "========================================"

          python Scripts/fetch_prices.py

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo "✓ Data/prices/"
          echo "✓ Data/prices/manifest.json"

      # ======================================================
      # 10. Validate Price Data
      # ======================================================

      - name: Validate Price Data
        run: |
          set -e

          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          UNIVERSE_FILE = DATA_DIR / "universe.json"
          MANIFEST_FILE = PRICES_DIR / "manifest.json"

          NEW_LISTING_GRACE_DAYS = 30

          def fail(message):
              raise SystemExit(f"❌ {message}")

          def load_json(path):
              if not path.exists():
                  fail(f"找不到檔案：{path}")

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      return json.load(f)
              except Exception as exc:
                  fail(
                      f"JSON 解析失敗："
                      f"{path}: {exc}"
                  )

          def normalize_symbol(value):
              if value is None:
                  return None

              if not isinstance(value, str):
                  return None

              symbol = value.strip().upper()

              if not symbol:
                  return None

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):
                  if symbol.endswith(suffix):
                      symbol = symbol[:-len(suffix)]

              return symbol

          def parse_listing_date(value):
              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              for fmt in (
                  "%Y/%m/%d",
                  "%Y-%m-%d",
                  "%Y%m%d",
              ):
                  try:
                      return datetime.strptime(
                          text,
                          fmt
                      ).date()
                  except ValueError:
                      pass

              return None

          def extract_symbol_from_record(item, key=None):
              if isinstance(item, str):
                  return normalize_symbol(item)

              if not isinstance(item, dict):
                  return None

              symbol = (
                  item.get("symbol")
                  or item.get("stock_id")
                  or item.get("code")
                  or item.get("ticker")
              )

              symbol = normalize_symbol(symbol)

              if symbol:
                  return symbol

              if key is not None:
                  return normalize_symbol(str(key))

              return None

          def extract_stock_symbols(data, context):
              if isinstance(data, dict):

                  for preferred in (
                      "stocks",
                      "data",
                      "items",
                      "records",
                  ):
                      candidate = data.get(preferred)

                      if isinstance(candidate, dict):
                          return extract_stock_symbols(
                              candidate,
                              f"{context}.{preferred}"
                          )

                      if isinstance(candidate, list):
                          return extract_stock_symbols(
                              candidate,
                              f"{context}.{preferred}"
                          )

                  result = set()

                  for key, item in data.items():

                      symbol = extract_symbol_from_record(
                          item,
                          key=key
                      )

                      if symbol:
                          result.add(symbol)

                  return result

              if isinstance(data, list):

                  result = set()

                  for item in data:

                      symbol = extract_symbol_from_record(
                          item
                      )

                      if symbol:
                          result.add(symbol)

                  return result

              return set()

          universe = load_json(
              UNIVERSE_FILE
          )

          manifest = load_json(
              MANIFEST_FILE
          )

          if not isinstance(universe, dict):
              fail(
                  "universe.json 根節點不是 object"
              )

          if not isinstance(manifest, dict):
              fail(
                  "manifest.json 根節點不是 object"
              )

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):
              fail(
                  "universe.stocks 不是 object"
              )

          universe_symbols = set()
          universe_listing_dates = {}

          for key, item in universe_stocks.items():

              if not isinstance(item, dict):
                  fail(
                      f"Universe {key} 不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
                  or key
              )

              if not symbol:
                  fail(
                      f"Universe 股票 {key} "
                      "缺少有效代號"
                  )

              universe_symbols.add(symbol)

              listing_date = parse_listing_date(
                  item.get("listed_date")
              )

              universe_listing_dates[
                  symbol
              ] = listing_date

          universe_count = len(
              universe_symbols
          )

          manifest_files = manifest.get(
              "files"
          )

          shard_names = []

          if isinstance(
              manifest_files,
              list
          ):
              for item in manifest_files:

                  if isinstance(
                      item,
                      str
                  ):
                      shard_names.append(item)

                  elif isinstance(
                      item,
                      dict
                  ):
                      for field in (
                          "file",
                          "path",
                          "filename",
                          "name",
                      ):
                          value = item.get(field)

                          if value:
                              shard_names.append(
                                  str(value)
                              )
                              break

          if not shard_names:

              shard_names = [
                  p.name
                  for p in sorted(
                      PRICES_DIR.glob(
                          "prices_*.json"
                      )
                  )
              ]

          unique_shard_names = []

          seen = set()

          for name in shard_names:

              filename = Path(
                  str(name).replace(
                      "\\",
                      "/"
                  )
              ).name

              if filename in seen:
                  continue

              seen.add(filename)
              unique_shard_names.append(
                  filename
              )

          if not unique_shard_names:
              fail(
                  "manifest 沒有任何價格 shard"
              )

          price_symbols = set()
          shard_symbols = {}
          shard_duplicates = set()

          for filename in unique_shard_names:

              candidates = [
                  PRICES_DIR / filename,
                  DATA_DIR / filename,
              ]

              shard_path = None

              for candidate in candidates:

                  if candidate.exists():
                      shard_path = candidate
                      break

              if shard_path is None:
                  fail(
                      "manifest 指定的價格分檔不存在："
                      f"{filename}"
                  )

              data = load_json(
                  shard_path
              )

              symbols = extract_stock_symbols(
                  data,
                  filename
              )

              if not symbols:
                  fail(
                      f"{filename} 沒有解析到任何股票資料"
                  )

              shard_symbols[
                  filename
              ] = symbols

              duplicated = (
                  price_symbols
                  & symbols
              )

              if duplicated:
                  shard_duplicates.update(
                      duplicated
                  )

              price_symbols.update(
                  symbols
              )

          missing = (
              universe_symbols
              - price_symbols
          )

          extra = (
              price_symbols
              - universe_symbols
          )

          today = date.today()

          allowed_new_listing_missing = set()
          hard_missing = set()

          for symbol in missing:

              listing_date = (
                  universe_listing_dates.get(
                      symbol
                  )
              )

              if listing_date is None:
                  hard_missing.add(symbol)
                  continue

              age_days = (
                  today - listing_date
              ).days

              if (
                  age_days >= 0
                  and age_days <= NEW_LISTING_GRACE_DAYS
              ):
                  allowed_new_listing_missing.add(
                      symbol
                  )
              else:
                  hard_missing.add(symbol)

          print("")
          print("========================================")
          print("PRICE DATA VALIDATION")
          print("========================================")
          print(
              f"Universe STOCK："
              f"{universe_count}"
          )
          print(
              f"Price shards："
              f"{len(unique_shard_names)}"
          )
          print(
              f"Price 股票集合："
              f"{len(price_symbols)}"
          )
          print(
              f"Universe → Price 成功對接："
              f"{len(universe_symbols & price_symbols)}"
          )
          print(
              f"Price 缺失總數："
              f"{len(missing)}"
          )
          print(
              f"新掛牌豁免："
              f"{len(allowed_new_listing_missing)}"
          )
          print(
              f"真正缺失："
              f"{len(hard_missing)}"
          )
          print(
              f"Price 額外股票："
              f"{len(extra)}"
          )
          print(
              f"跨 shard 重複："
              f"{len(shard_duplicates)}"
          )

          if allowed_new_listing_missing:

              print("")
              print(
                  "⚠️ 新掛牌商品尚未累積足夠歷史價格，"
                  "本次允許通過："
              )

              for symbol in sorted(
                  allowed_new_listing_missing
              ):
                  listing_date = (
                      universe_listing_dates.get(
                          symbol
                      )
                  )

                  age_days = (
                      today - listing_date
                  ).days

                  print(
                      f"  {symbol} "
                      f"(listed={listing_date}, "
                      f"age={age_days} days)"
                  )

          if hard_missing:

              print("")
              print(
                  "❌ 非新掛牌商品缺少價格資料："
              )

              for symbol in sorted(
                  hard_missing
              )[:50]:
                  listing_date = (
                      universe_listing_dates.get(
                          symbol
                      )
                  )

                  print(
                      f"  {symbol} "
                      f"(listed={listing_date})"
                  )

              if len(hard_missing) > 50:
                  print(
                      f"  ... "
                      f"另外 {len(hard_missing) - 50} 檔"
                  )

              fail(
                  "Price Data 不完整："
                  "存在非新掛牌商品缺少價格資料"
              )

          if extra:

              print("")
              print(
                  "❌ Price 出現 Universe 以外股票："
              )

              for symbol in sorted(
                  extra
              )[:50]:
                  print(
                      f"  {symbol}"
                  )

              if len(extra) > 50:
                  print(
                      f"  ... "
                      f"另外 {len(extra) - 50} 檔"
                  )

              fail(
                  "Price Data 包含 Universe 外股票"
              )

          if shard_duplicates:

              print("")
              print(
                  "❌ 股票出現在多個 price shard："
              )

              for symbol in sorted(
                  shard_duplicates
              )[:50]:

                  locations = [
                      name
                      for name, symbols
                      in shard_symbols.items()
                      if symbol in symbols
                  ]

                  print(
                      f"  {symbol}: "
                      f"{', '.join(locations)}"
                  )

              fail(
                  "Price shard 存在重複股票"
              )

          effective_coverage = (
              len(price_symbols)
              +
              len(allowed_new_listing_missing)
          )

          if effective_coverage != universe_count:
              fail(
                  "Price 有效覆蓋數量與 Universe "
                  "不一致："
                  f"{effective_coverage} != "
                  f"{universe_count}"
              )

          print("")
          print("✓ manifest JSON OK")
          print("✓ 所有 price shard JSON OK")
          print("✓ 老商品價格資料完整")
          print("✓ 新掛牌商品正確豁免")
          print("✓ 無 Universe 外股票")
          print("✓ 無跨 shard 重複")
          print("✓ Price Data validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 11. Analyze Stocks
      # ======================================================

      - name: Analyze Stocks
        run: |
          set -e

          echo "========================================"
          echo "ANALYZE STOCKS"
          echo "========================================"

          python Scripts/analyze_stocks.py

          test -f Data/analysis.json

          echo "✓ Data/analysis.json"

      # ======================================================
      # 12. Build UI Data
      # ======================================================

      - name: Build UI Data
        run: |
          set -e

          echo "========================================"
          echo "BUILD UI DATA"
          echo "========================================"

          python Scripts/build_ui_data.py

          test -f Data/ui_data.json

          echo "✓ Data/ui_data.json"

      # ======================================================
      # 13. Final Data Contract
      # ======================================================

      - name: Validate final data chain
        run: |
          set -e

          echo "========================================"
          echo "FINAL DATA CHAIN"
          echo "========================================"

          test -f Data/universe.json
          test -f Data/chip.json
          test -d Data/prices
          test -f Data/prices/manifest.json
          test -f Data/analysis.json
          test -f Data/ui_data.json

          echo "✓ universe.json"
          echo "✓ chip.json"
          echo "✓ prices/"
          echo "✓ prices/manifest.json"
          echo "✓ analysis.json"
          echo "✓ ui_data.json"

          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          NEW_LISTING_GRACE_DAYS = 30

          def fail(message):
              raise SystemExit(
                  f"❌ {message}"
              )

          def load_json(path):
              if not path.exists():
                  fail(
                      f"找不到檔案：{path}"
                  )

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      value = json.load(f)
              except Exception as exc:
                  fail(
                      f"JSON 驗證失敗："
                      f"{path}: {exc}"
                  )

              print(
                  f"✓ JSON OK：{path}"
              )

              return value

          def normalize_symbol(value):
              if value is None:
                  return None

              if not isinstance(
                  value,
                  str
              ):
                  return None

              symbol = value.strip().upper()

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):
                  if symbol.endswith(
                      suffix
                  ):
                      symbol = symbol[
                          :-len(suffix)
                      ]

              return symbol or None

          def parse_listing_date(value):
              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              for fmt in (
                  "%Y/%m/%d",
                  "%Y-%m-%d",
                  "%Y%m%d",
              ):
                  try:
                      return datetime.strptime(
                          text,
                          fmt
                      ).date()
                  except ValueError:
                      pass

              return None

          def symbol_from_record(
              item,
              key=None
          ):
              if isinstance(
                  item,
                  str
              ):
                  return normalize_symbol(
                      item
                  )

              if not isinstance(
                  item,
                  dict
              ):
                  return normalize_symbol(
                      key
                  )

              symbol = (
                  item.get("symbol")
                  or item.get("stock_id")
                  or item.get("code")
                  or item.get("ticker")
              )

              return (
                  normalize_symbol(symbol)
                  or normalize_symbol(key)
              )

          def extract_symbols(
              value,
              preferred_keys=()
          ):
              if isinstance(
                  value,
                  dict
              ):

                  for key in preferred_keys:

                      candidate = value.get(
                          key
                      )

                      if isinstance(
                          candidate,
                          dict
                      ):
                          return extract_symbols(
                              candidate
                          )

                      if isinstance(
                          candidate,
                          list
                      ):
                          return extract_symbols(
                              candidate
                          )

                  result = set()

                  for key, item in value.items():

                      symbol = symbol_from_record(
                          item,
                          key
                      )

                      if symbol:
                          result.add(
                              symbol
                          )

                  return result

              if isinstance(
                  value,
                  list
              ):

                  result = set()

                  for item in value:

                      symbol = symbol_from_record(
                          item
                      )

                      if symbol:
                          result.add(
                              symbol
                          )

                  return result

              return set()

          # --------------------------------------------------
          # Load final datasets
          # --------------------------------------------------

          universe = load_json(
              DATA_DIR / "universe.json"
          )

          chip = load_json(
              DATA_DIR / "chip.json"
          )

          manifest = load_json(
              PRICES_DIR / "manifest.json"
          )

          analysis = load_json(
              DATA_DIR / "analysis.json"
          )

          ui_data = load_json(
              DATA_DIR / "ui_data.json"
          )

          # --------------------------------------------------
          # Universe
          # --------------------------------------------------

          if not isinstance(
              universe,
              dict
          ):
              fail(
                  "universe 根節點不是 object"
              )

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):
              fail(
                  "universe.stocks 必須是 object"
              )

          universe_symbols = set()
          universe_listing_dates = {}

          for key, item in (
              universe_stocks.items()
          ):

              symbol = symbol_from_record(
                  item,
                  key
              )

              if not symbol:
                  fail(
                      f"Universe "
                      f"{key} 缺少股票代號"
                  )

              universe_symbols.add(
                  symbol
              )

              listing_date = None

              if isinstance(
                  item,
                  dict
              ):
                  listing_date = (
                      parse_listing_date(
                          item.get(
                              "listed_date"
                          )
                      )
                  )

              universe_listing_dates[
                  symbol
              ] = listing_date

          universe_count = universe.get(
              "universe_count"
          )

          if universe_count != len(
              universe_symbols
          ):
              fail(
                  "universe_count 不一致："
                  f"{universe_count} != "
                  f"{len(universe_symbols)}"
              )

          # --------------------------------------------------
          # Chip
          # --------------------------------------------------

          chip_symbols = extract_symbols(
              chip,
              preferred_keys=(
                  "stocks",
                  "data",
                  "items",
                  "records",
              )
          )

          chip_extra = (
              chip_symbols
              - universe_symbols
          )

          if chip_extra:
              fail(
                  "chip.json 出現 "
                  "Universe 以外股票："
                  f"{sorted(chip_extra)[:20]}"
              )

          # --------------------------------------------------
          # Price shards
          # --------------------------------------------------

          manifest_files = manifest.get(
              "files"
          )

          shard_names = []

          if isinstance(
              manifest_files,
              list
          ):
              for item in manifest_files:

                  if isinstance(
                      item,
                      str
                  ):
                      shard_names.append(
                          item
                      )

                  elif isinstance(
                      item,
                      dict
                  ):

                      for field in (
                          "file",
                          "path",
                          "filename",
                          "name",
                      ):

                          value = item.get(
                              field
                          )

                          if value:
                              shard_names.append(
                                  str(value)
                              )
                              break

          if not shard_names:

              shard_names = [
                  p.name
                  for p in sorted(
                      PRICES_DIR.glob(
                          "prices_*.json"
                      )
                  )
              ]

          unique_shards = []

          seen = set()

          for name in shard_names:

              name = Path(
                  str(name).replace(
                      "\\",
                      "/"
                  )
              ).name

              if name in seen:
                  continue

              seen.add(name)
              unique_shards.append(
                  name
              )

          if not unique_shards:
              fail(
                  "沒有任何 price shard"
              )

          price_symbols = set()
          duplicate_symbols = set()

          for filename in unique_shards:

              path = (
                  PRICES_DIR
                  / filename
              )

              if not path.exists():
                  fail(
                      f"Price shard 不存在："
                      f"{path}"
                  )

              shard = load_json(
                  path
              )

              symbols = extract_symbols(
                  shard,
                  preferred_keys=(
                      "stocks",
                      "data",
                      "items",
                      "records",
                  )
              )

              if not symbols:
                  fail(
                      f"{filename} "
                      "沒有任何股票資料"
                  )

              overlap = (
                  price_symbols
                  & symbols
              )

              duplicate_symbols.update(
                  overlap
              )

              price_symbols.update(
                  symbols
              )

          if duplicate_symbols:
              fail(
                  "price shards 有重複股票："
                  f"{sorted(duplicate_symbols)[:20]}"
              )

          price_missing = (
              universe_symbols
              - price_symbols
          )

          price_extra = (
              price_symbols
              - universe_symbols
          )

          # --------------------------------------------------
          # 新掛牌豁免
          # --------------------------------------------------

          today = date.today()

          allowed_new_listing_missing = set()
          hard_price_missing = set()

          for symbol in price_missing:

              listing_date = (
                  universe_listing_dates.get(
                      symbol
                  )
              )

              if listing_date is None:
                  hard_price_missing.add(
                      symbol
                  )
                  continue

              age_days = (
                  today - listing_date
              ).days

              if (
                  age_days >= 0
                  and age_days <= NEW_LISTING_GRACE_DAYS
              ):
                  allowed_new_listing_missing.add(
                      symbol
                  )
              else:
                  hard_price_missing.add(
                      symbol
                  )

          if hard_price_missing:
              fail(
                  "Price 缺少非新掛牌 Universe 股票："
                  f"{sorted(hard_price_missing)[:20]}"
              )

          if price_extra:
              fail(
                  "Price 出現 Universe 外股票："
                  f"{sorted(price_extra)[:20]}"
              )

          effective_price_count = (
              len(price_symbols)
              +
              len(allowed_new_listing_missing)
          )

          if effective_price_count != (
              len(universe_symbols)
          ):
              fail(
                  "Price 有效覆蓋數量與 Universe "
                  "不一致："
                  f"{effective_price_count} != "
                  f"{len(universe_symbols)}"
              )

          # --------------------------------------------------
          # Analysis
          # --------------------------------------------------

          if not isinstance(
              analysis,
              dict
          ):
              fail(
                  "analysis 根節點不是 object"
              )

          analysis_stocks = analysis.get(
              "stocks"
          )

          if not isinstance(
              analysis_stocks,
              dict
          ):
              fail(
                  "analysis.stocks 必須是 object"
              )

          analysis_symbols = set()

          for key, item in (
              analysis_stocks.items()
          ):

              symbol = symbol_from_record(
                  item,
                  key
              )

              if symbol:
                  analysis_symbols.add(
                      symbol
                  )

          analysis_missing = (
              universe_symbols
              - analysis_symbols
              - allowed_new_listing_missing
          )

          analysis_extra = (
              analysis_symbols
              - universe_symbols
          )

          if analysis_missing:
              fail(
                  "Analysis 缺少 Universe 股票："
                  f"{sorted(analysis_missing)[:20]}"
              )

          if analysis_extra:
              fail(
                  "Analysis 出現 Universe 外股票："
                  f"{sorted(analysis_extra)[:20]}"
              )

          # --------------------------------------------------
          # UI Data
          #
          # UI 的唯一股票來源：
          # analysis.json
          #
          # 因此 Analysis → UI 必須：
          #
          # Analysis 有 → UI 必須有
          # UI 有 → 必須存在於 Analysis
          #
          # 新掛牌豁免只適用於：
          # Universe → Price
          # Universe → Analysis
          #
          # 不適用於 Analysis → UI。
          # --------------------------------------------------

          if not isinstance(
              ui_data,
              dict
          ):
              fail(
                  "ui_data 根節點不是 object"
              )

          ui_stocks = ui_data.get(
              "stocks"
          )

          if not isinstance(
              ui_stocks,
              dict
          ):
              fail(
                  "ui_data.stocks 必須是 object"
              )

          ui_symbols = set()

          for key, item in (
              ui_stocks.items()
          ):

              symbol = symbol_from_record(
                  item,
                  key
              )

              if symbol:
                  ui_symbols.add(
                      symbol
                  )

          # --------------------------------------------------
          # 正確契約：
          #
          # Analysis → UI
          # --------------------------------------------------

          ui_missing = (
              analysis_symbols
              - ui_symbols
          )

          ui_extra = (
              ui_symbols
              - analysis_symbols
          )

          if ui_missing:
              fail(
                  "UI Data 缺少 Analysis 股票："
                  f"{sorted(ui_missing)[:20]}"
              )

          if ui_extra:
              fail(
                  "UI Data 出現 Analysis 以外股票："
                  f"{sorted(ui_extra)[:20]}"
              )

          # --------------------------------------------------
          # Final report
          # --------------------------------------------------

          print("")
          print("========================================")
          print("FINAL DATA CHAIN RESULT")
          print("========================================")

          print(
              f"Universe STOCK："
              f"{len(universe_symbols)}"
          )

          print(
              f"Chip 股票："
              f"{len(chip_symbols)}"
          )

          print(
              f"Price shards："
              f"{len(unique_shards)}"
          )

          print(
              f"Price 股票："
              f"{len(price_symbols)}"
          )

          print(
              f"新掛牌 Price 豁免："
              f"{len(allowed_new_listing_missing)}"
          )

          print(
              f"Analysis 股票："
              f"{len(analysis_symbols)}"
          )

          print(
              f"UI 股票："
              f"{len(ui_symbols)}"
          )

          if allowed_new_listing_missing:

              print("")
              print(
                  "⚠️ 新掛牌商品尚未累積完整歷史價格："
              )

              for symbol in sorted(
                  allowed_new_listing_missing
              ):
                  listing_date = (
                      universe_listing_dates.get(
                          symbol
                      )
                  )

                  age_days = (
                      today - listing_date
                  ).days

                  print(
                      f"  {symbol} "
                      f"(listed={listing_date}, "
                      f"age={age_days} days)"
                  )

          print("")

          print(
              "✓ Universe → Price：完整覆蓋"
          )

          print(
              "✓ 新掛牌商品正確處理"
          )

          print(
              "✓ Price → Analysis：完整"
          )

          print(
              "✓ Analysis → UI：完整"
          )

          print(
              "✓ Chip 無 Universe 外股票"
          )

          print(
              "✓ Price 無 Universe 外股票"
          )

          print(
              "✓ Analysis 無 Universe 外股票"
          )

          print(
              "✓ UI 無 Analysis 外股票"
          )

          print(
              "✓ FINAL DATA CHAIN PASS"
          )

          print(
              "========================================"
          )
          PY

      # ======================================================
      # 14. Commit Data
      # ======================================================

      - name: Commit updated data
        run: |
          set -e

          echo "========================================"
          echo "COMMIT DATA"
          echo "========================================"

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          if git diff --cached --quiet; then
            echo "✓ 沒有新的 Data 變更"
            exit 0
          fi

          git commit -m \
            "chore: update Taiwan stock AI data"

          git push

          echo "✓ Data commit/push PASS"
