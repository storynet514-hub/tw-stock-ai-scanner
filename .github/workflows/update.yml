name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    # ======================================================
    # 台灣時間（UTC+8）
    #
    # 09:15
    # 10:30
    # 12:00
    # 14:30
    # 16:30
    # 17:30
    #
    # GitHub Actions 使用 UTC
    # ======================================================

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4


      # ======================================================
      # 4. 檢查專案結構
      # ======================================================

      - name: Check project structure
        run: |
          echo "========================================"
          echo "Project structure"
          echo "========================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Scripts:"
          ls -la Scripts || true

          echo ""
          echo "Data:"
          ls -la Data || true

          echo ""
          echo "========================================"


      # ======================================================
      # 5. 檢查必要檔案
      # ======================================================

      - name: Verify required files
        run: |
          test -f Scripts/build_universe.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_chip.py
          test -f Data/universe.json

          echo "✓ build_universe.py"
          echo "✓ fetch_prices.py"
          echo "✓ fetch_chip.py"
          echo "✓ universe.json"


      # ======================================================
      # 6. 建立全市場 Universe
      # ======================================================

      - name: Build market universe
        run: |
          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py


      # ======================================================
      # 7. 驗證 Universe
      # ======================================================

      - name: Verify universe.json
        run: |
          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          test -f Data/universe.json

          ls -lh Data/universe.json

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          total = data.get("total", 0)
          listed = data.get("listed_stocks", 0)
          otc = data.get("otc_stocks", 0)
          items = data.get("items", [])

          print("universe.json JSON OK")
          print("version:", data.get("version"))
          print("generated_at:", data.get("generated_at"))
          print("total:", total)
          print("listed_stocks:", listed)
          print("otc_stocks:", otc)
          print("items:", len(items))

          if total <= 0:
              raise SystemExit(
                  "ERROR: Universe 沒有股票資料"
              )

          if len(items) <= 0:
              raise SystemExit(
                  "ERROR: Universe items 為空"
              )

          if total != len(items):
              raise SystemExit(
                  "ERROR: total 與 items 數量不一致"
              )

          print("✓ Universe validation passed")
          PY


      # ======================================================
      # 8. 取得價格資料
      # ======================================================

      - name: Fetch price data
        run: |
          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py


      # ======================================================
      # 9. 驗證價格分檔
      #
      # 注意：
      # prices_001.json 等分檔的實際結構由
      # fetch_prices.py 決定。
      #
      # 不再假設頂層一定有 stocks/prices/data。
      #
      # 本驗證只確認：
      # 1. Data/prices 存在
      # 2. manifest.json 存在且 JSON 正確
      # 3. manifest 有分檔
      # 4. 每個分檔存在
      # 5. 每個分檔 JSON 正確
      # 6. 每個分檔至少有資料
      # 7. 分檔數量與 manifest 一致
      # 8. 股票總數達到合理範圍
      #
      # ======================================================

      - name: Verify price shards
        run: |
          echo "========================================"
          echo "Verify Data/prices/"
          echo "========================================"

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo ""
          echo "Price files:"
          ls -lh Data/prices/

          python - <<'PY'
          import json
          from pathlib import Path

          prices_dir = Path("Data/prices")
          manifest_path = prices_dir / "manifest.json"

          # --------------------------------------------------
          # 讀取 manifest
          # --------------------------------------------------

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          if not isinstance(manifest, dict):
              raise SystemExit(
                  "ERROR: manifest.json 頂層不是 object"
              )

          print("")
          print("manifest.json JSON OK")
          print("version:", manifest.get("version"))
          print("schema_version:", manifest.get("schema_version"))
          print("generated_at:", manifest.get("generated_at"))

          # --------------------------------------------------
          # 取得分檔清單
          # --------------------------------------------------

          files = manifest.get("files")

          if files is None:
              files = manifest.get("shards")

          if files is None:
              raise SystemExit(
                  "ERROR: manifest.json 找不到 files / shards"
              )

          if not isinstance(files, list):
              raise SystemExit(
                  "ERROR: manifest.json files/shards 必須是 list"
              )

          if not files:
              raise SystemExit(
                  "ERROR: manifest.json 沒有價格分檔"
              )

          print("manifest files:", len(files))

          # --------------------------------------------------
          # 驗證每一個分檔
          # --------------------------------------------------

          total_stocks = 0
          total_rows = 0
          validated_files = 0

          for entry in files:

              # ----------------------------------------------
              # 支援：
              # "prices_001.json"
              #
              # 或：
              # {"file": "prices_001.json"}
              # ----------------------------------------------

              if isinstance(entry, str):

                  filename = entry

              elif isinstance(entry, dict):

                  filename = (
                      entry.get("file")
                      or entry.get("filename")
                      or entry.get("path")
                      or entry.get("name")
                  )

              else:

                  raise SystemExit(
                      "ERROR: manifest 分檔格式錯誤"
                  )

              if not filename:
                  raise SystemExit(
                      "ERROR: manifest 出現空白檔名"
                  )

              path = prices_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: 找不到分檔：{path}"
                  )

              if path.stat().st_size <= 0:
                  raise SystemExit(
                      f"ERROR: 分檔為空：{path}"
                  )

              # ----------------------------------------------
              # JSON 驗證
              # ----------------------------------------------

              try:

                  with path.open(
                      "r",
                      encoding="utf-8"
                  ) as f:
                      shard = json.load(f)

              except Exception as e:

                  raise SystemExit(
                      f"ERROR: {filename} JSON 無法解析：{e}"
                  )

              # ----------------------------------------------
              # 不再硬性要求 object
              #
              # fetch_prices.py 實際輸出可能是：
              #
              # object
              # list
              #
              # 兩者都接受。
              # ----------------------------------------------

              if isinstance(shard, dict):

                  # ------------------------------------------
                  # 嘗試找股票資料容器
                  # ------------------------------------------

                  stocks = None

                  for key in (
                      "stocks",
                      "prices",
                      "data",
                      "items"
                  ):

                      candidate = shard.get(key)

                      if isinstance(
                          candidate,
                          (dict, list)
                      ):

                          stocks = candidate
                          break

                  # ------------------------------------------
                  # 如果沒有標準容器
                  #
                  # 就把 object 本身視為資料容器。
                  # ------------------------------------------

                  if stocks is None:
                      stocks = shard

                  if isinstance(stocks, dict):

                      stock_count = len(stocks)

                      if stock_count <= 0:
                          raise SystemExit(
                              f"ERROR: {filename} 沒有股票資料"
                          )

                      rows = 0

                      for symbol, value in stocks.items():

                          if not symbol:
                              raise SystemExit(
                                  f"ERROR: {filename} 出現空白 symbol"
                              )

                          if isinstance(value, list):

                              rows += len(value)

                          elif isinstance(value, dict):

                              history = (
                                  value.get("prices")
                                  or value.get("history")
                                  or value.get("data")
                              )

                              if isinstance(
                                  history,
                                  list
                              ):

                                  rows += len(history)

                              else:

                                  rows += 1

                          else:

                              # 若是其他基本型別，
                              # 仍視為一筆資料。
                              rows += 1

                  elif isinstance(stocks, list):

                      stock_count = len(stocks)
                      rows = len(stocks)

                      if stock_count <= 0:
                          raise SystemExit(
                              f"ERROR: {filename} 沒有股票資料"
                          )

                  else:

                      raise SystemExit(
                          f"ERROR: {filename} 資料格式無法辨識"
                      )

              # ----------------------------------------------
              # 頂層直接是 list
              # ----------------------------------------------

              elif isinstance(shard, list):

                  stock_count = len(shard)
                  rows = len(shard)

                  if stock_count <= 0:
                      raise SystemExit(
                          f"ERROR: {filename} 沒有股票資料"
                      )

              # ----------------------------------------------
              # 其他型別
              # ----------------------------------------------

              else:

                  raise SystemExit(
                      f"ERROR: {filename} JSON 結構錯誤"
                  )

              total_stocks += stock_count
              total_rows += rows
              validated_files += 1

              print(
                  f"✓ {filename} | "
                  f"{stock_count} records | "
                  f"{path.stat().st_size / 1024 / 1024:.2f} MB"
              )

          # --------------------------------------------------
          # manifest 數量驗證
          # --------------------------------------------------

          manifest_count = manifest.get("count")

          if manifest_count is not None:

              try:

                  manifest_count = int(
                      manifest_count
                  )

                  # 某些版本 count 代表股票總數，
                  # 某些版本可能代表分檔數。
                  #
                  # 因此只有在明確等於分檔數時，
                  # 才視為 shard count。
                  #
                  if manifest_count == len(files):

                      print(
                          "manifest count:",
                          manifest_count,
                          "(shard count)"
                      )

                  else:

                      print(
                          "manifest count:",
                          manifest_count
                      )

              except (TypeError, ValueError):

                  print(
                      "WARNING: manifest count "
                      "不是整數，略過此欄位驗證"
                  )

          # --------------------------------------------------
          # 最終結果
          # --------------------------------------------------

          print("")
          print("========================================")
          print("Price shard validation summary")
          print("========================================")

          print(
              "validated files:",
              validated_files
          )

          print(
              "total records:",
              total_stocks
          )

          print(
              "total rows:",
              total_rows
          )

          print(
              "manifest shards:",
              len(files)
          )

          # --------------------------------------------------
          # 基本安全檢查
          # --------------------------------------------------

          if validated_files != len(files):

              raise SystemExit(
                  "ERROR: 並非所有價格分檔都驗證成功"
              )

          if validated_files <= 0:

              raise SystemExit(
                  "ERROR: 沒有任何價格分檔"
              )

          if total_stocks <= 0:

              raise SystemExit(
                  "ERROR: 沒有任何價格資料"
              )

          # --------------------------------------------------
          # 1985 Universe 保護
          #
          # 價格成功率目前約 99.85%，
          # 所以至少應有接近 1985 檔。
          #
          # 設定最低門檻 1900，
          # 防止 API 異常時產生空資料卻仍然 commit。
          # --------------------------------------------------

          if total_stocks < 1900:

              raise SystemExit(
                  "ERROR: 價格資料數量過低："
                  f"{total_stocks}，"
                  "低於安全門檻 1900"
              )

          print("")
          print("✓ Price shard validation passed")


      # ======================================================
      # 10. 取得主力籌碼
      # ======================================================

      - name: Fetch chip data
        run: |
          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 11. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |
          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          test -f Data/chip.json

          ls -lh Data/chip.json

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("chip.json JSON OK")

          print(
              "schema_version:",
              data.get("schema_version")
          )

          print(
              "data_date:",
              data.get("data_date")
          )

          print(
              "universe_count:",
              data.get("universe_count")
          )

          statistics = data.get(
              "statistics",
              {}
          )

          print(
              "complete:",
              statistics.get("complete")
          )

          print(
              "partial:",
              statistics.get("partial")
          )

          print(
              "insufficient:",
              statistics.get("insufficient")
          )

          stocks = data.get(
              "stocks",
              {}
          )

          print(
              "stocks:",
              len(stocks)
          )

          found_5d = 0
          found_10d = 0
          complete = 0

          for stock in stocks.values():

              if not isinstance(stock, dict):
                  continue

              if stock.get(
                  "main_force_5d"
              ) is not None:

                  found_5d += 1

              if stock.get(
                  "main_force_10d"
              ) is not None:

                  found_10d += 1

              if (
                  stock.get(
                      "main_force_5d"
                  ) is not None
                  and
                  stock.get(
                      "main_force_10d"
                  ) is not None
              ):

                  complete += 1

          print(
              "main_force_5d available:",
              found_5d
          )

          print(
              "main_force_10d available:",
              found_10d
          )

          print(
              "main_force_5d_10d complete:",
              complete
          )

          if not stocks:

              raise SystemExit(
                  "ERROR: chip.json 沒有股票資料"
              )

          print("✓ chip.json validation passed")
          PY


      # ======================================================
      # 12. 顯示資料檔案
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated data files"
          echo "========================================"

          echo ""
          echo "Data:"
          ls -lh Data/

          echo ""
          echo "Price shards:"
          ls -lh Data/prices/ || true

          echo ""
          echo "Git status:"
          git status --short


      # ======================================================
      # 13. Commit / Push
      # ======================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/universe.json
          git add Data/prices/
          git add Data/chip.json
          git add Data/ui_data.json
          git add Data/prices.json

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit -m "Update stock universe, price and chip data"

            git push

          fi