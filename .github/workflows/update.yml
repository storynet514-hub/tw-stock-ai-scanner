name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # ======================================================
    # 台灣時間：
    #
    # 09:15
    # 10:30
    # 12:00
    # 14:30
    # 16:30
    # 17:30
    #
    # GitHub Actions 使用 UTC
    # ======================================================

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

      # ======================================================
      # 4. Verify Scripts
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_market.py
          test -f Scripts/analyze_stocks.py
          test -f Scripts/build_ui_data.py

          mkdir -p Data

          echo "✓ Scripts/build_universe.py"
          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/fetch_prices.py"
          echo "✓ Scripts/fetch_market.py"
          echo "✓ Scripts/analyze_stocks.py"
          echo "✓ Scripts/build_ui_data.py"
          echo "✓ Data/"

      # ======================================================
      # 5. Syntax Gate
      # ======================================================

      - name: Python syntax gate
        run: |
          set -e

          python -m py_compile \
            Scripts/build_universe.py \
            Scripts/fetch_chip.py \
            Scripts/fetch_prices.py \
            Scripts/fetch_market.py \
            Scripts/analyze_stocks.py \
            Scripts/build_ui_data.py

          echo "✓ Python syntax PASS"

      # ======================================================
      # 6. Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          test -f Data/universe.json

          echo "✓ Data/universe.json"

      # ======================================================
      # 7. Validate Universe
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.stocks 不是 object"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          if count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{item['market']}"
                  )

          print("")
          print("========================================")
          print("UNIVERSE VALIDATION")
          print("========================================")
          print(f"✓ Universe：{count}")
          print("✓ stocks object")
          print("✓ required fields")
          print("✓ status=active")
          print("✓ market validation")
          print("✓ Universe validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 8. Fetch Chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

          test -f Data/chip.json

          echo "✓ Data/chip.json"

      # ======================================================
      # 9. Fetch Prices
      # ======================================================

      - name: Fetch Price Data
        shell: bash
        run: |
          set -o errexit
          set -o pipefail

          rm -f .no_history_symbols.json
          rm -f .fetch_prices.log

          echo "========================================"
          echo "FETCH PRICE DATA"
          echo "========================================"

          python Scripts/fetch_prices.py 2>&1 | tee .fetch_prices.log

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          log_path = Path(".fetch_prices.log")

          if not log_path.exists():
              raise SystemExit(
                  "❌ fetch_prices.log 不存在"
              )

          log = log_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          symbols = set()

          for line in log.splitlines():

              match = re.search(
                  r"(?:^|\s)([A-Z0-9]+):no_history:",
                  line
              )

              if match:
                  symbols.add(
                      match.group(1).upper()
                  )

          output = Path(
              ".no_history_symbols.json"
          )

          output.write_text(
              json.dumps(
                  sorted(symbols),
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("")
          print("========================================")
          print("NO-HISTORY CONTRACT")
          print("========================================")
          print(
              f"no_history symbols："
              f"{len(symbols)}"
          )

          for symbol in sorted(symbols):
              print(
                  f"✓ {symbol} → no_history"
              )

          print("========================================")
          PY

          test -d Data/prices
          test -f Data/prices/manifest.json
          test -f .no_history_symbols.json

          echo "✓ Data/prices/"
          echo "✓ Data/prices/manifest.json"

      # ======================================================
      # 10. Validate Price Data
      # ======================================================

      - name: Validate Price Data
        run: |
          set -e

          python - <<'PY'
          import json
          from datetime import date, datetime
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          UNIVERSE_FILE = DATA_DIR / "universe.json"
          MANIFEST_FILE = PRICES_DIR / "manifest.json"

          NO_HISTORY_FILE = Path(
              ".no_history_symbols.json"
          )

          NEW_LISTING_GRACE_DAYS = 30

          EXPECTED_SCHEMA_VERSION = "prices-v14.0"

          def fail(message):
              raise SystemExit(
                  f"❌ {message}"
              )

          def load_json(path):

              if not path.exists():
                  fail(
                      f"找不到檔案：{path}"
                  )

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      return json.load(f)

              except Exception as exc:
                  fail(
                      f"JSON 解析失敗："
                      f"{path}: {exc}"
                  )

          def normalize_symbol(value):

              if value is None:
                  return None

              if not isinstance(
                  value,
                  str
              ):
                  return None

              symbol = value.strip().upper()

              if not symbol:
                  return None

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):

                  if symbol.endswith(
                      suffix
                  ):
                      symbol = symbol[
                          :-len(suffix)
                      ]

              return symbol or None

          def parse_listing_date(value):

              if value is None:
                  return None

              text = str(value).strip()

              if not text:
                  return None

              for fmt in (
                  "%Y/%m/%d",
                  "%Y-%m-%d",
                  "%Y%m%d",
              ):

                  try:
                      return datetime.strptime(
                          text,
                          fmt
                      ).date()

                  except ValueError:
                      pass

              return None

          # --------------------------------------------------
          # Load
          # --------------------------------------------------

          universe = load_json(
              UNIVERSE_FILE
          )

          manifest = load_json(
              MANIFEST_FILE
          )

          no_history_data = load_json(
              NO_HISTORY_FILE
          )

          if not isinstance(
              no_history_data,
              list
          ):
              fail(
                  ".no_history_symbols.json "
                  "不是 list"
              )

          no_history_symbols = set()

          for value in no_history_data:

              symbol = normalize_symbol(
                  value
              )

              if not symbol:
                  fail(
                      f"no_history symbol 無效："
                      f"{value}"
                  )

              no_history_symbols.add(
                  symbol
              )

          # --------------------------------------------------
          # Universe
          # --------------------------------------------------

          if not isinstance(
              universe,
              dict
          ):
              fail(
                  "universe.json 根節點不是 object"
              )

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):
              fail(
                  "universe.stocks 不是 object"
              )

          universe_symbols = set()
          universe_listing_dates = {}

          for key, item in universe_stocks.items():

              if not isinstance(
                  item,
                  dict
              ):
                  fail(
                      f"Universe {key} "
                      "不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
                  or key
              )

              if not symbol:
                  fail(
                      f"Universe 股票 {key} "
                      "缺少有效代號"
                  )

              universe_symbols.add(
                  symbol
              )

              universe_listing_dates[
                  symbol
              ] = parse_listing_date(
                  item.get("listed_date")
              )

          universe_count = len(
              universe_symbols
          )

          if universe_count <= 0:
              fail(
                  "Universe 股票數量為 0"
              )

          # --------------------------------------------------
          # Manifest
          # --------------------------------------------------

          if not isinstance(
              manifest,
              dict
          ):
              fail(
                  "manifest.json 根節點不是 object"
              )

          schema_version = manifest.get(
              "schema_version"
          )

          if schema_version != (
              EXPECTED_SCHEMA_VERSION
          ):
              fail(
                  f"manifest schema_version "
                  f"錯誤："
                  f"{schema_version} != "
                  f"{EXPECTED_SCHEMA_VERSION}"
              )

          manifest_no_history_count = (
              manifest.get(
                  "no_history_count"
              )
          )

          if manifest_no_history_count != len(
              no_history_symbols
          ):
              fail(
                  "no_history 數量不一致："
                  f"manifest="
                  f"{manifest_no_history_count}, "
                  f"diagnostics="
                  f"{len(no_history_symbols)}"
              )

          unknown_no_history = (
              no_history_symbols
              - universe_symbols
          )

          if unknown_no_history:
              fail(
                  "no_history 出現 "
                  "Universe 外股票："
                  f"{sorted(unknown_no_history)}"
              )

          # --------------------------------------------------
          # Shards
          # --------------------------------------------------

          manifest_files = manifest.get(
              "files"
          )

          if not isinstance(
              manifest_files,
              list
          ):
              fail(
                  "manifest.files 不是 list"
              )

          shard_names = []

          for item in manifest_files:

              if isinstance(
                  item,
                  str
              ):
                  value = item

              elif isinstance(
                  item,
                  dict
              ):
                  value = (
                      item.get("file")
                      or item.get("path")
                      or item.get("filename")
                      or item.get("name")
                  )

              else:
                  continue

              if not value:
                  continue

              filename = Path(
                  str(value).replace(
                      "\\",
                      "/"
                  )
              ).name

              if (
                  filename.startswith(
                      "prices_"
                  )
                  and filename.endswith(
                      ".json"
                  )
              ):
                  shard_names.append(
                      filename
                  )

          shard_names = list(
              dict.fromkeys(
                  shard_names
              )
          )

          if not shard_names:
              fail(
                  "manifest 沒有任何價格 shard"
              )

          price_symbols = set()
          empty_symbols = set()
          duplicate_symbols = set()

          # --------------------------------------------------
          # Read every shard
          # --------------------------------------------------

          for filename in shard_names:

              shard_path = (
                  PRICES_DIR
                  / filename
              )

              if not shard_path.exists():
                  fail(
                      "manifest 指定的價格 "
                      "分檔不存在："
                      f"{filename}"
                  )

              data = load_json(
                  shard_path
              )

              if data.get(
                  "schema_version"
              ) != EXPECTED_SCHEMA_VERSION:
                  fail(
                      f"{filename} "
                      "schema_version 錯誤"
                  )

              stocks = data.get(
                  "stocks"
              )

              if not isinstance(
                  stocks,
                  dict
              ):
                  fail(
                      f"{filename}.stocks "
                      "不是 object"
                  )

              if not stocks:
                  fail(
                      f"{filename}.stocks "
                      "為空"
                  )

              shard_symbols = set()

              for key, prices in stocks.items():

                  symbol = normalize_symbol(
                      key
                  )

                  if not symbol:
                      fail(
                          f"{filename} "
                          f"存在無效股票代號："
                          f"{key}"
                      )

                  if not isinstance(
                      prices,
                      list
                  ):
                      fail(
                          f"{filename}.stocks"
                          f"[{key}] "
                          "不是 price list"
                      )

                  # ------------------------------------------
                  # LEGAL NO_HISTORY
                  # ------------------------------------------

                  if not prices:

                      if symbol not in (
                          no_history_symbols
                      ):
                          fail(
                              f"{filename}.stocks"
                              f"[{key}] "
                              "價格資料為空，"
                              "但未被宣告為 "
                              "no_history"
                          )

                      empty_symbols.add(
                          symbol
                      )

                  shard_symbols.add(
                      symbol
                  )

              duplicated = (
                  price_symbols
                  & shard_symbols
              )

              if duplicated:
                  duplicate_symbols.update(
                      duplicated
                  )

              price_symbols.update(
                  shard_symbols
              )

          # --------------------------------------------------
          # Duplicate
          # --------------------------------------------------

          if duplicate_symbols:
              fail(
                  "跨 shard 重複股票："
                  f"{sorted(duplicate_symbols)[:50]}"
              )

          # --------------------------------------------------
          # Empty list contract
          # --------------------------------------------------

          if empty_symbols != (
              no_history_symbols
          ):
              fail(
                  "空價格股票與 "
                  "no_history 不一致："
                  f"empty="
                  f"{sorted(empty_symbols)}, "
                  f"no_history="
                  f"{sorted(no_history_symbols)}"
              )

          # --------------------------------------------------
          # Extra
          # --------------------------------------------------

          extra = (
              price_symbols
              - universe_symbols
          )

          if extra:
              fail(
                  "Price 出現 Universe "
                  "外股票："
                  f"{sorted(extra)[:50]}"
              )

          # --------------------------------------------------
          # Missing
          # --------------------------------------------------

          missing = (
              universe_symbols
              - price_symbols
          )

          today = date.today()

          allowed_new_listing_missing = set()
          hard_missing = set()

          for symbol in missing:

              listing_date = (
                  universe_listing_dates.get(
                      symbol
                  )
              )

              if (
                  listing_date is not None
                  and 0 <= (
                      today
                      - listing_date
                  ).days
                  <= NEW_LISTING_GRACE_DAYS
              ):

                  allowed_new_listing_missing.add(
                      symbol
                  )

              else:

                  hard_missing.add(
                      symbol
                  )

          if hard_missing:
              fail(
                  "非新掛牌商品缺少 Price："
                  f"{sorted(hard_missing)[:50]}"
              )

          effective_coverage = (
              len(price_symbols)
              + len(
                  allowed_new_listing_missing
              )
          )

          if effective_coverage != (
              universe_count
          ):
              fail(
                  "Price 有效覆蓋數量錯誤："
                  f"{effective_coverage} != "
                  f"{universe_count}"
              )

          print("")
          print("========================================")
          print("PRICE DATA VALIDATION")
          print("========================================")
          print(
              f"Universe：{universe_count}"
          )
          print(
              f"Price：{len(price_symbols)}"
          )
          print(
              f"No history："
              f"{len(no_history_symbols)}"
          )
          print(
              f"Empty price lists："
              f"{len(empty_symbols)}"
          )
          print(
              f"New listing grace："
              f"{len(allowed_new_listing_missing)}"
          )
          print(
              f"Price shards："
              f"{len(shard_names)}"
          )

          for symbol in sorted(
              no_history_symbols
          ):
              print(
                  f"✓ {symbol} → "
                  "legal no_history"
              )

          print(
              "✓ Empty price list is allowed "
              "ONLY for declared no_history"
          )

          print(
              "✓ Price Data validation PASS"
          )
          print("========================================")
          PY

      # ======================================================
      # 11. Fetch Market
      #
      # FIX:
      # 原正式 update workflow 缺少此階段。
      # build_ui_data.py 明確需要 Data/market.json。
      # ======================================================

      - name: Fetch Market Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH MARKET DATA"
          echo "========================================"

          python Scripts/fetch_market.py

          test -f Data/market.json
          test -s Data/market.json

          echo "✓ Data/market.json"

      # ======================================================
      # 12. Validate Market
      # ======================================================

      - name: Validate Market Data
        run: |
          set -e

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          path = Path(
              "Data/market.json"
          )

          if not path.exists():
              raise SystemExit(
                  "❌ Data/market.json 不存在"
              )

          if path.stat().st_size <= 0:
              raise SystemExit(
                  "❌ Data/market.json 為空"
              )

          try:
              data = json.loads(
                  path.read_text(
                      encoding="utf-8-sig"
                  )
              )

          except Exception as exc:
              raise SystemExit(
                  f"❌ market.json JSON "
                  f"解析失敗：{exc}"
              )

          if not isinstance(
              data,
              dict
          ):
              raise SystemExit(
                  "❌ market.json 根節點不是 object"
              )

          # --------------------------------------------------
          # Schema
          # --------------------------------------------------

          if data.get(
              "schema_version"
          ) != "market-v2.1":

              raise SystemExit(
                  "❌ market.json "
                  "schema_version 錯誤："
                  f"{data.get('schema_version')}"
              )

          # --------------------------------------------------
          # Required root fields
          # --------------------------------------------------

          required_fields = {
              "market_status",
              "latest_trading_date",
              "index",
              "sentiment",
              "conditions",
          }

          missing = (
              required_fields
              - set(data.keys())
          )

          if missing:
              raise SystemExit(
                  "❌ market.json "
                  "缺少欄位："
                  f"{sorted(missing)}"
              )

          # --------------------------------------------------
          # Market status
          # --------------------------------------------------

          market_status = data.get(
              "market_status"
          )

          if market_status not in {
              "open",
              "closed",
          }:

              raise SystemExit(
                  "❌ market_status 無效："
                  f"{market_status}"
              )

          # --------------------------------------------------
          # Latest trading date
          # --------------------------------------------------

          latest_date = data.get(
              "latest_trading_date"
          )

          if not isinstance(
              latest_date,
              str
          ) or not latest_date.strip():

              raise SystemExit(
                  "❌ latest_trading_date 無效"
              )

          # --------------------------------------------------
          # Index
          # --------------------------------------------------

          index = data.get(
              "index"
          )

          if not isinstance(
              index,
              dict
          ):

              raise SystemExit(
                  "❌ market.index "
                  "不是 object"
              )

          index_required = {
              "name",
              "value",
              "change",
              "change_pct",
          }

          index_missing = (
              index_required
              - set(index.keys())
          )

          if index_missing:
              raise SystemExit(
                  "❌ market.index "
                  "缺少欄位："
                  f"{sorted(index_missing)}"
              )

          for field in (
              "value",
              "change",
              "change_pct",
          ):

              value = index.get(
                  field
              )

              if (
                  not isinstance(
                      value,
                      (int, float)
                  )
                  or isinstance(
                      value,
                      bool
                  )
                  or not math.isfinite(
                      float(value)
                  )
              ):

                  raise SystemExit(
                      f"❌ market.index."
                      f"{field} 無效："
                      f"{value}"
                  )

          # --------------------------------------------------
          # Sentiment
          # --------------------------------------------------

          sentiment = data.get(
              "sentiment"
          )

          if not isinstance(
              sentiment,
              dict
          ):

              raise SystemExit(
                  "❌ market.sentiment "
                  "不是 object"
              )

          # --------------------------------------------------
          # Conditions
          # --------------------------------------------------

          conditions = data.get(
              "conditions"
          )

          if not isinstance(
              conditions,
              list
          ):

              raise SystemExit(
                  "❌ market.conditions "
                  "不是 list"
              )

          if len(
              conditions
          ) != 10:

              raise SystemExit(
                  "❌ market.json 必須有 "
                  "10 項市場條件，"
                  f"目前：{len(conditions)}"
              )

          # --------------------------------------------------
          # PASS
          # --------------------------------------------------

          print("")
          print("========================================")
          print("MARKET DATA VALIDATION")
          print("========================================")
          print(
              "✓ schema_version："
              f"{data['schema_version']}"
          )
          print(
              "✓ market_status："
              f"{market_status}"
          )
          print(
              "✓ latest_trading_date："
              f"{latest_date}"
          )
          print(
              "✓ index："
              f"{index.get('name')}"
          )
          print(
              "✓ index.value："
              f"{index.get('value')}"
          )
          print(
              "✓ sentiment：object"
          )
          print(
              "✓ conditions："
              f"{len(conditions)}"
          )
          print(
              "✓ Market Data validation PASS"
          )
          print("========================================")
          PY

      # ======================================================
      # 13. Analyze Stocks
      # ======================================================

      - name: Analyze Stocks
        run: |
          set -e

          echo "========================================"
          echo "ANALYZE STOCKS"
          echo "========================================"

          python Scripts/analyze_stocks.py

          test -f Data/analysis.json

          echo "✓ Data/analysis.json"

      # ======================================================
      # 14. Build UI Data
      # ======================================================

      - name: Build UI Data
        run: |
          set -e

          echo "========================================"
          echo "BUILD UI DATA"
          echo "========================================"

          python Scripts/build_ui_data.py

          test -f Data/ui_data.json

          echo "✓ Data/ui_data.json"

      # ======================================================
      # 15. Final Data Contract
      # ======================================================

      - name: Final Data Contract
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          DATA_DIR = Path("Data")

          NO_HISTORY_FILE = Path(
              ".no_history_symbols.json"
          )

          def fail(message):
              raise SystemExit(
                  f"❌ {message}"
              )

          def load_json(path):

              if not path.exists():
                  fail(
                      f"找不到檔案：{path}"
                  )

              try:
                  return json.loads(
                      path.read_text(
                          encoding="utf-8-sig"
                      )
                  )

              except Exception as exc:
                  fail(
                      f"JSON 解析失敗："
                      f"{path}: {exc}"
                  )

          def normalize_symbol(value):

              if not isinstance(
                  value,
                  str
              ):
                  return None

              value = value.strip().upper()

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):

                  if value.endswith(
                      suffix
                  ):

                      value = value[
                          :-len(suffix)
                      ]

              return value or None

          def extract_symbols(
              data,
              field_name
          ):

              value = data.get(
                  field_name
              )

              if not isinstance(
                  value,
                  dict
              ):
                  fail(
                      f"{field_name} "
                      "不是 object"
                  )

              symbols = set()

              for key, item in value.items():

                  if isinstance(
                      item,
                      dict
                  ):

                      candidate = (
                          item.get("symbol")
                          or item.get("stock_id")
                          or item.get("code")
                          or key
                      )

                  else:

                      candidate = key

                  symbol = normalize_symbol(
                      candidate
                  )

                  if symbol:
                      symbols.add(
                          symbol
                      )

              return symbols

          # --------------------------------------------------
          # Load
          # --------------------------------------------------

          universe = load_json(
              DATA_DIR / "universe.json"
          )

          chip = load_json(
              DATA_DIR / "chip.json"
          )

          analysis = load_json(
              DATA_DIR / "analysis.json"
          )

          market = load_json(
              DATA_DIR / "market.json"
          )

          ui = load_json(
              DATA_DIR / "ui_data.json"
          )

          no_history = set(
              load_json(
                  NO_HISTORY_FILE
              )
          )

          # --------------------------------------------------
          # Universe
          # --------------------------------------------------

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):

              fail(
                  "universe.stocks 無效"
              )

          universe_symbols = set()

          for key, item in (
              universe_stocks.items()
          ):

              if not isinstance(
                  item,
                  dict
              ):

                  fail(
                      f"Universe {key} "
                      "不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
                  or key
              )

              if not symbol:
                  fail(
                      f"Universe {key} "
                      "symbol 無效"
                  )

              universe_symbols.add(
                  symbol
              )

          # --------------------------------------------------
          # Analysis
          # --------------------------------------------------

          analysis_symbols = (
              extract_symbols(
                  analysis,
                  "stocks"
              )
          )

          # --------------------------------------------------
          # UI
          # --------------------------------------------------

          ui_symbols = (
              extract_symbols(
                  ui,
                  "stocks"
              )
          )

          # --------------------------------------------------
          # Analysis contract
          # --------------------------------------------------

          analysis_missing = (
              universe_symbols
              - analysis_symbols
              - no_history
          )

          analysis_extra = (
              analysis_symbols
              - universe_symbols
          )

          if analysis_missing:

              fail(
                  "Analysis 缺少股票："
                  f"{sorted(analysis_missing)[:50]}"
              )

          if analysis_extra:

              fail(
                  "Analysis 出現 Universe "
                  "以外股票："
                  f"{sorted(analysis_extra)[:50]}"
              )

          # --------------------------------------------------
          # UI contract
          # --------------------------------------------------

          ui_missing = (
              analysis_symbols
              - ui_symbols
          )

          ui_extra = (
              ui_symbols
              - analysis_symbols
          )

          if ui_missing:

              fail(
                  "UI Data 缺少 Analysis 股票："
                  f"{sorted(ui_missing)[:50]}"
              )

          if ui_extra:

              fail(
                  "UI Data 出現 Analysis "
                  "以外股票："
                  f"{sorted(ui_extra)[:50]}"
              )

          # --------------------------------------------------
          # Chip contract
          # --------------------------------------------------

          chip_stocks = chip.get(
              "stocks"
          )

          if isinstance(
              chip_stocks,
              dict
          ):

              chip_symbols = set()

              for key, item in (
                  chip_stocks.items()
              ):

                  if isinstance(
                      item,
                      dict
                  ):

                      candidate = (
                          item.get(
                              "symbol"
                          )
                          or item.get(
                              "stock_id"
                          )
                          or item.get(
                              "code"
                          )
                          or key
                      )

                  else:

                      candidate = key

                  symbol = normalize_symbol(
                      candidate
                  )

                  if symbol:
                      chip_symbols.add(
                          symbol
                      )

              chip_extra = (
                  chip_symbols
                  - universe_symbols
              )

              if chip_extra:

                  fail(
                      "Chip 出現 Universe "
                      "以外股票："
                      f"{sorted(chip_extra)[:50]}"
                  )

          # --------------------------------------------------
          # Market contract
          # --------------------------------------------------

          if market.get(
              "schema_version"
          ) != "market-v2.1":

              fail(
                  "Market schema_version "
                  "錯誤"
              )

          if not isinstance(
              market.get(
                  "conditions"
              ),
              list
          ):

              fail(
                  "Market conditions "
                  "不是 list"
              )

          if len(
              market["conditions"]
          ) != 10:

              fail(
                  "Market conditions "
                  "不是 10 項"
              )

          # --------------------------------------------------
          # Final report
          # --------------------------------------------------

          print("")
          print("========================================")
          print("FINAL DATA CHAIN")
          print("========================================")

          print(
              f"Universe："
              f"{len(universe_symbols)}"
          )

          print(
              f"No history："
              f"{len(no_history)}"
          )

          print(
              f"Analysis："
              f"{len(analysis_symbols)}"
          )

          print(
              f"UI："
              f"{len(ui_symbols)}"
          )

          print(
              "✓ Universe → Price：validated"
          )

          print(
              "✓ Universe → Chip：validated"
          )

          print(
              "✓ Market：validated"
          )

          print(
              "✓ Price → Analysis：validated"
          )

          print(
              "✓ Analysis → UI：validated"
          )

          print(
              "✓ FINAL DATA CHAIN PASS"
          )

          print(
              "========================================"
          )
          PY

