name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # 台灣時間 16:30
    # GitHub Actions 使用 UTC
    - cron: "30 8 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      # ======================================================
      # Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas

      # ======================================================
      # Directory check
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py

          mkdir -p Data

          echo "✓ build_universe.py"
          echo "✓ fetch_chip.py"
          echo "✓ Data directory"

      # ======================================================
      # Layer 1-4
      # Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          echo "========================================"
          echo "UNIVERSE BUILD COMPLETED"
          echo "========================================"

      # ======================================================
      # Universe structural validation
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ stocks 不是 object"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          if count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != "
                      f"{item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確"
                  )

          print(
              f"✓ Universe：{count}"
          )

          print(
              "✓ stocks object"
          )

          print(
              "✓ required fields"
          )

          print(
              "✓ status=active"
          )

          print(
              "✓ market validation"
          )

          print(
              "✓ Universe validation PASS"
          )
          PY

      # ======================================================
      # Fetch chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

      # ======================================================
      # Check generated files
      # ======================================================

      - name: Validate generated data
        run: |
          set -e

          echo "========================================"
          echo "GENERATED DATA"
          echo "========================================"

          if [ -f Data/universe.json ]; then
            echo "✓ Data/universe.json"
          else
            echo "❌ Data/universe.json missing"
            exit 1
          fi

          if [ -f Data/chip.json ]; then
            echo "✓ Data/chip.json"
          else
            echo "⚠ Data/chip.json not found"
          fi

          if [ -f Data/prices.json ]; then
            echo "✓ Data/prices.json"
          else
            echo "⚠ Data/prices.json not found"
          fi

      # ======================================================
      # Git diff
      # ======================================================

      - name: Show changed files
        run: |
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short

          echo "========================================"
          echo "GIT DIFF STAT"
          echo "========================================"

          git diff --stat

      # ======================================================
      # Commit
      # ======================================================

      - name: Commit generated data
        run: |
          set -e

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          if git diff --cached --quiet; then
            echo "========================================"
            echo "NO DATA CHANGES"
            echo "========================================"
            echo "沒有新的 Data 變更。"
            exit 0
          fi

          git commit -m \
            "chore: update Taiwan stock universe and chip data"

      # ======================================================
      # Push
      # ======================================================

      - name: Push changes
        run: |
          set -e

          git push origin HEAD:main

          echo "========================================"
          echo "UPDATE PUSH PASS"
          echo "========================================"
