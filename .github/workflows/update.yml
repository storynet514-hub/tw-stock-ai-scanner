name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # Taiwan time (UTC+8)
    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          pip install requests pandas

      # ======================================================
      # 4. Verify project structure
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_market.py
          test -f Scripts/analyze_stocks.py
          test -f Scripts/build_ui_data.py

          mkdir -p Data

          echo "✓ Scripts/build_universe.py"
          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/fetch_prices.py"
          echo "✓ Scripts/fetch_market.py"
          echo "✓ Scripts/analyze_stocks.py"
          echo "✓ Scripts/build_ui_data.py"
          echo "✓ Data/"

      # ======================================================
      # 5. Python Syntax Gate
      # ======================================================

      - name: Python syntax gate
        run: |
          set -e

          python -m py_compile \
            Scripts/build_universe.py \
            Scripts/fetch_chip.py \
            Scripts/fetch_prices.py \
            Scripts/fetch_market.py \
            Scripts/analyze_stocks.py \
            Scripts/build_ui_data.py

          echo "✓ Python syntax PASS"

      # ======================================================
      # 6. Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          test -f Data/universe.json

          echo "✓ Data/universe.json"

      # ======================================================
      # 7. Validate Universe
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          with path.open(
              "r",
              encoding="utf-8-sig"
          ) as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.stocks 不是 object"
              )

          if not stocks:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in {
                  "TWSE",
                  "TPEX",
              }:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{item['market']}"
                  )

          print("")
          print("========================================")
          print("UNIVERSE VALIDATION")
          print("========================================")
          print(f"✓ Universe：{count}")
          print("✓ stocks object")
          print("✓ required fields")
          print("✓ status=active")
          print("✓ market validation")
          print("✓ Universe validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 8. Fetch Chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

          test -f Data/chip.json

          echo "✓ Data/chip.json"

      # ======================================================
      # 9. Fetch Prices
      #
      # IMPORTANT:
      # 不再解析 stdout / regex 建立 no_history。
      #
      # fetch_prices.py 本身已經把：
      #
      # history_status=no_history
      #
      # 寫入正式 price shard。
      # ======================================================

      - name: Fetch Price Data
        shell: bash
        run: |
          set -euo pipefail

          rm -f .fetch_prices.log

          echo "========================================"
          echo "FETCH PRICE DATA"
          echo "========================================"

          python Scripts/fetch_prices.py 2>&1 | tee .fetch_prices.log

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo "✓ Data/prices/"
          echo "✓ Data/prices/manifest.json"

      # ======================================================
      # 10. Validate Price Data
      #
      # no_history 唯一來源：
      #
      # Data/prices/*.json
      #     ↓
      # history_status
      #     ↓
      # no_history_count
      #     ↓
      # manifest.json
      #
      # 不再依賴 stdout。
      # ======================================================

      - name: Validate Price Data
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          UNIVERSE_FILE = DATA_DIR / "universe.json"
          MANIFEST_FILE = PRICES_DIR / "manifest.json"

          EXPECTED_SCHEMA_VERSION = "prices-v14.0"

          def fail(message):
              raise SystemExit(
                  f"❌ {message}"
              )

          def load_json(path):

              if not path.exists():
                  fail(
                      f"找不到檔案：{path}"
                  )

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      return json.load(f)

              except Exception as exc:
                  fail(
                      f"JSON 解析失敗："
                      f"{path}: {exc}"
                  )

          def normalize_symbol(value):

              if value is None:
                  return None

              text = (
                  str(value)
                  .strip()
                  .upper()
              )

              if not text:
                  return None

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):
                  if text.endswith(suffix):
                      text = text[
                          :-len(suffix)
                      ]

              return text or None

          def iter_records(payload):
              """
              支援 price shard 的資料容器：

              1. {symbol: record}
              2. {"stocks": {symbol: record}}
              3. {"data": {symbol: record}}
              4. {"prices": {symbol: record}}
              5. {"stocks": [record]}
              6. {"data": [record]}
              7. [record]
              """

              if isinstance(
                  payload,
                  dict
              ):

                  for container_key in (
                      "stocks",
                      "data",
                      "prices",
                  ):

                      container = payload.get(
                          container_key
                      )

                      if isinstance(
                          container,
                          dict
                      ):

                          for symbol, record in (
                              container.items()
                          ):
                              yield (
                                  str(symbol),
                                  record
                              )

                          return

                      if isinstance(
                          container,
                          list
                      ):

                          for record in container:
                              yield (
                                  None,
                                  record
                              )

                          return

                  for symbol, record in (
                      payload.items()
                  ):

                      if isinstance(
                          record,
                          dict
                      ):

                          yield (
                              str(symbol),
                              record
                          )

                  return

              if isinstance(
                  payload,
                  list
              ):

                  for record in payload:

                      yield (
                          None,
                          record
                      )

          # ==================================================
          # Load Universe
          # ==================================================

          universe = load_json(
              UNIVERSE_FILE
          )

          if not isinstance(
              universe,
              dict
          ):
              fail(
                  "universe.json 根節點不是 object"
              )

          stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              stocks,
              dict
          ):
              fail(
                  "universe.stocks 不是 object"
              )

          universe_symbols = set()

          for key, item in stocks.items():

              if not isinstance(
                  item,
                  dict
              ):
                  fail(
                      f"Universe {key} "
                      "不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
                  or key
              )

              if not symbol:
                  fail(
                      f"Universe {key} "
                      "缺少有效 symbol"
                  )

              universe_symbols.add(
                  symbol
              )

          if not universe_symbols:
              fail(
                  "Universe symbol 數量為 0"
              )

          # ==================================================
          # Load Manifest
          # ==================================================

          manifest = load_json(
              MANIFEST_FILE
          )

          if not isinstance(
              manifest,
              dict
          ):
              fail(
                  "manifest.json 根節點不是 object"
              )

          schema_version = manifest.get(
              "schema_version"
          )

          if schema_version != (
              EXPECTED_SCHEMA_VERSION
          ):
              fail(
                  "manifest schema_version "
                  f"錯誤：{schema_version} != "
                  f"{EXPECTED_SCHEMA_VERSION}"
              )

          manifest_total = manifest.get(
              "total_symbols"
          )

          if manifest_total != len(
              universe_symbols
          ):
              fail(
                  "manifest.total_symbols "
                  "不一致："
                  f"{manifest_total} != "
                  f"{len(universe_symbols)}"
              )

          # ==================================================
          # Manifest shard list
          # ==================================================

          manifest_files = manifest.get(
              "files"
          )

          if not isinstance(
              manifest_files,
              list
          ):
              fail(
                  "manifest.files 不是 list"
              )

          shard_paths = []

          for item in manifest_files:

              if isinstance(
                  item,
                  str
              ):
                  filename = item

              elif isinstance(
                  item,
                  dict
              ):
                  filename = (
                      item.get("file")
                      or item.get("path")
                      or item.get("filename")
                      or item.get("name")
                  )

              else:
                  filename = None

              if not filename:
                  continue

              filename = Path(
                  str(filename)
              ).name

              if not (
                  filename.startswith(
                      "prices_"
                  )
                  and filename.endswith(
                      ".json"
                  )
              ):
                  continue

              shard_path = (
                  PRICES_DIR / filename
              )

              if not shard_path.exists():
                  fail(
                      "manifest 指定 shard "
                      f"不存在：{shard_path}"
                  )

              shard_paths.append(
                  shard_path
              )

          shard_paths = list(
              dict.fromkeys(
                  shard_paths
              )
          )

          if not shard_paths:
              fail(
                  "manifest 沒有任何有效 price shard"
              )

          # ==================================================
          # Read all shards
          # ==================================================

          seen_symbols = set()

          no_history_symbols = set()

          history_symbols = set()

          duplicate_symbols = set()

          shard_counts = {}

          for shard_path in shard_paths:

              payload = load_json(
                  shard_path
              )

              local_symbols = set()

              for raw_symbol, record in (
                  iter_records(payload)
              ):

                  if not isinstance(
                      record,
                      dict
                  ):
                      continue

                  symbol = normalize_symbol(
                      record.get("symbol")
                      or record.get("code")
                      or record.get("ticker")
                      or raw_symbol
                  )

                  if not symbol:
                      continue

                  if symbol in local_symbols:
                      duplicate_symbols.add(
                          symbol
                      )

                  local_symbols.add(
                      symbol
                  )

                  if symbol in seen_symbols:
                      duplicate_symbols.add(
                          symbol
                      )

                  seen_symbols.add(
                      symbol
                  )

                  history_status = str(
                      record.get(
                          "history_status",
                          ""
                      )
                  ).strip().lower()

                  history_rows = record.get(
                      "history_rows"
                  )

                  try:
                      history_rows = int(
                          history_rows
                      )
                  except (
                      TypeError,
                      ValueError
                  ):
                      history_rows = None

                  prices = record.get(
                      "prices"
                  )

                  has_prices = (
                      isinstance(
                          prices,
                          list
                      )
                      and len(prices) > 0
                  )

                  if history_status == (
                      "no_history"
                  ):

                      no_history_symbols.add(
                          symbol
                      )

                  elif (
                      (
                          history_rows
                          is not None
                          and history_rows > 0
                      )
                      or has_prices
                  ):

                      history_symbols.add(
                          symbol
                      )

              shard_counts[
                  shard_path.name
              ] = len(
                  local_symbols
              )

          # ==================================================
          # Duplicate check
          # ==================================================

          if duplicate_symbols:

              fail(
                  "價格 shard 發現重複 symbol："
                  f"{sorted(duplicate_symbols)[:20]}"
              )

          # ==================================================
          # Universe coverage
          # ==================================================

          unknown_symbols = (
              seen_symbols
              - universe_symbols
          )

          if unknown_symbols:

              fail(
                  "價格資料出現 "
                  "Universe 外 symbol："
                  f"count={len(unknown_symbols)}, "
                  f"sample="
                  f"{sorted(unknown_symbols)[:20]}"
              )

          missing_symbols = (
              universe_symbols
              - seen_symbols
          )

          if missing_symbols:

              fail(
                  "價格 shard 缺少 "
                  "Universe symbol："
                  f"count={len(missing_symbols)}, "
                  f"sample="
                  f"{sorted(missing_symbols)[:20]}"
              )

          # ==================================================
          # no_history contract
          # ==================================================

          manifest_no_history = manifest.get(
              "no_history_count"
          )

          actual_no_history = len(
              no_history_symbols
          )

          if manifest_no_history != (
              actual_no_history
          ):

              fail(
                  "no_history 數量不一致："
                  f"manifest="
                  f"{manifest_no_history}, "
                  f"shards="
                  f"{actual_no_history}"
              )

          # ==================================================
          # no_history must not also have history
          # ==================================================

          overlap = (
              no_history_symbols
              & history_symbols
          )

          if overlap:

              fail(
                  "同一 symbol 同時存在 "
                  "no_history 與有效歷史資料："
                  f"{sorted(overlap)}"
              )

          # ==================================================
          # Final output
          # ==================================================

          print("")
          print("========================================")
          print("PRICE DATA VALIDATION")
          print("========================================")

          print(
              f"✓ Universe："
              f"{len(universe_symbols)}"
          )

          print(
              f"✓ Price symbols："
              f"{len(seen_symbols)}"
          )

          print(
              f"✓ Shards："
              f"{len(shard_paths)}"
          )

          print(
              f"✓ History available："
              f"{len(history_symbols)}"
          )

          print(
              f"✓ no_history："
              f"{len(no_history_symbols)}"
          )

          if no_history_symbols:

              print(
                  "✓ no_history symbols："
                  f"{sorted(no_history_symbols)}"
              )

          for name, count in sorted(
              shard_counts.items()
          ):

              print(
                  f"✓ {name}: {count}"
              )

          print(
              "✓ Price data validation PASS"
          )

          print(
              "========================================"
          )
          PY

      # ======================================================
      # 11. Fetch Market
      # ======================================================

      - name: Fetch Market Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH MARKET DATA"
          echo "========================================"

          python Scripts/fetch_market.py

          test -f Data/market.json

          echo "✓ Data/market.json"

      # ======================================================
      # 12. Validate Market
      # ======================================================

      - name: Validate Market Data
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "Data/market.json"
          )

          if not path.exists():
              raise SystemExit(
                  "❌ Data/market.json 不存在"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8-sig"
              )
          )

          if not isinstance(
              data,
              dict
          ):
              raise SystemExit(
                  "❌ market.json "
                  "根節點不是 object"
              )

          required = {
              "market_status",
              "latest_trading_date",
              "index",
              "sentiment",
              "conditions",
          }

          missing = (
              required
              - set(data)
          )

          if missing:
              raise SystemExit(
                  "❌ market.json "
                  f"缺少欄位：{sorted(missing)}"
              )

          conditions = data.get(
              "conditions"
          )

          if not isinstance(
              conditions,
              list
          ):
              raise SystemExit(
                  "❌ market.conditions "
                  "不是 list"
              )

          if len(conditions) != 10:
              raise SystemExit(
                  "❌ market.conditions "
                  f"數量錯誤："
                  f"{len(conditions)} != 10"
              )

          print(
              "✓ Market V2.1 "
              "validation PASS"
          )
          PY

      # ======================================================
      # 13. Analyze Stocks
      # ======================================================

      - name: Analyze Stocks
        run: |
          set -e

          echo "========================================"
          echo "ANALYZE STOCKS"
          echo "========================================"

          python Scripts/analyze_stocks.py

          test -f Data/analysis.json

          echo "✓ Data/analysis.json"

      # ======================================================
      # 14. Build UI Data
      # ======================================================

      - name: Build UI Data
        run: |
          set -e

          echo "========================================"
          echo "BUILD UI DATA"
          echo "========================================"

          python Scripts/build_ui_data.py

          test -f Data/ui_data.json

          echo "✓ Data/ui_data.json"

      # ======================================================
      # 15. Validate UI Data Contract
      # ======================================================

      - name: Validate UI Data Contract
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path(
              "Data/ui_data.json"
          )

          if not path.exists():
              raise SystemExit(
                  "❌ Data/ui_data.json 不存在"
              )

          data = json.loads(
              path.read_text(
                  encoding="utf-8-sig"
              )
          )

          if data.get("status") != "ok":
              raise SystemExit(
                  "❌ ui_data.status："
                  f"{data.get('status')}"
              )

          market = data.get(
              "market"
          )

          if not isinstance(
              market,
              dict
          ):
              raise SystemExit(
                  "❌ ui_data.market 無效"
              )

          stocks = data.get(
              "stocks"
          )

          if not isinstance(
              stocks,
              dict
          ):

              raise SystemExit(
                  "❌ ui_data.stocks 無效"
              )

          if not stocks:
              raise SystemExit(
                  "❌ ui_data.stocks 為 0"
              )

          tabs = data.get(
              "tabs"
          )

          if not isinstance(
              tabs,
              dict
          ):
              raise SystemExit(
                  "❌ ui_data.tabs 無效"
              )

          required_tabs = {
              "today_picks",
              "top10",
              "etf",
              "bond",
              "watchlist",
          }

          missing = (
              required_tabs
              - set(tabs)
          )

          if missing:
              raise SystemExit(
                  "❌ ui_data.tabs "
                  f"缺少：{sorted(missing)}"
              )

          for symbol, item in (
              stocks.items()
          ):

              if not isinstance(
                  item,
                  dict
              ):
                  raise SystemExit(
                      f"❌ UI stock "
                      f"{symbol} 不是 object"
                  )

              if item.get(
                  "symbol"
              ) != symbol:

                  raise SystemExit(
                      "❌ UI symbol "
                      f"mismatch：{symbol}"
                  )

              if item.get(
                  "strength"
              ) not in {
                  "強勢",
                  "中性",
                  "弱勢",
              }:

                  raise SystemExit(
                      f"❌ {symbol} "
                      "strength 無效："
                      f"{item.get('strength')}"
                  )

          def symbols(items):

              result = []

              if not isinstance(
                  items,
                  list
              ):
                  return result

              for item in items:

                  if isinstance(
                      item,
                      str
                  ):

                      result.append(
                          item
                      )

                  elif isinstance(
                      item,
                      dict
                  ):

                      value = (
                          item.get(
                              "symbol"
                          )
                          or item.get(
                              "code"
                          )
                      )

                      if value:
                          result.append(
                              value
                          )

              return result

          today = set(
              symbols(
                  tabs[
                      "today_picks"
                  ]
              )
          )

          top10 = set(
              symbols(
                  tabs[
                      "top10"
                  ]
              )
          )

          etf = set(
              symbols(
                  tabs[
                      "etf"
                  ]
              )
          )

          bond = set(
              symbols(
                  tabs[
                      "bond"
                  ]
              )
          )

          if not top10 <= today:

              raise SystemExit(
                  "❌ Top10 必須是 "
                  "今日精選的子集合"
              )

          for symbol in etf:

              instrument_type = (
                  stocks.get(
                      symbol,
                      {}
                  ).get(
                      "instrument_type"
                  )
              )

              if instrument_type != "etf":

                  raise SystemExit(
                      f"❌ ETF tab "
                      f"包含非 ETF："
                      f"{symbol}"
                  )

          for symbol in bond:

              instrument_type = (
                  stocks.get(
                      symbol,
                      {}
                  ).get(
                      "instrument_type"
                  )
              )

              if instrument_type != "bond":

                  raise SystemExit(
                      f"❌ Bond tab "
                      f"包含非 bond："
                      f"{symbol}"
                  )

          print(
              f"✓ UI stocks："
              f"{len(stocks)}"
          )

          print(
              f"✓ 今日精選："
              f"{len(today)}"
          )

          print(
              f"✓ Top10："
              f"{len(top10)}"
          )

          print(
              f"✓ ETF："
              f"{len(etf)}"
          )

          print(
              f"✓ Bond："
              f"{len(bond)}"
          )

          print(
              "✓ UI data contract PASS"
          )
          PY

      # ======================================================
      # 16. Final Data Contract
      # ======================================================

      - name: Final Data Contract
        run: |
          set -e

          test -f Data/universe.json
          test -f Data/chip.json
          test -f Data/prices/manifest.json
          test -f Data/market.json
          test -f Data/analysis.json
          test -f Data/ui_data.json
          test -f index.html

          echo "========================================"
          echo "FINAL DATA CONTRACT"
          echo "========================================"

          echo "✓ universe.json"
          echo "✓ chip.json"
          echo "✓ prices/manifest.json"
          echo "✓ market.json"
          echo "✓ analysis.json"
          echo "✓ ui_data.json"
          echo "✓ index.html"

          echo "========================================"
          echo "FINAL DATA CONTRACT PASS"
          echo "========================================"

      # ======================================================
      # 17. Commit updated data
      # ======================================================

      - name: Commit updated data
        shell: bash
        run: |
          set -e

          rm -f .fetch_prices.log

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit \
            -m "chore: update Taiwan stock AI data"

          git push