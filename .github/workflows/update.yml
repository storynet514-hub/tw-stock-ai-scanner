name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    # ======================================================
    # 台灣時間 UTC+8
    #
    # 09:15
    # 10:30
    # 12:00
    # 14:30
    # 16:30
    # 17:30
    #
    # GitHub Actions 使用 UTC
    # ======================================================

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"


permissions:
  contents: write


jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4


      # ======================================================
      # 4. 檢查專案結構
      # ======================================================

      - name: Check project structure
        run: |
          echo "========================================"
          echo "Project structure"
          echo "========================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Scripts:"
          ls -la Scripts || true

          echo ""
          echo "Data:"
          ls -la Data || true

          echo ""
          echo "========================================"


      # ======================================================
      # 5. 檢查必要檔案
      # ======================================================

      - name: Verify required files
        run: |
          test -f Scripts/build_universe.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_chip.py
          test -f Data/universe.json

          echo "✓ build_universe.py"
          echo "✓ fetch_prices.py"
          echo "✓ fetch_chip.py"
          echo "✓ universe.json"


      # ======================================================
      # 6. 建立全市場 Universe
      # ======================================================

      - name: Build market universe
        run: |
          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py


      # ======================================================
      # 7. 驗證 Universe
      # ======================================================

      - name: Verify universe.json
        run: |
          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          test -f Data/universe.json

          ls -lh Data/universe.json

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("universe.json JSON OK")

          print("version:", data.get("version"))
          print("generated_at:", data.get("generated_at"))

          total = data.get("total", 0)
          listed = data.get("listed_stocks", 0)
          otc = data.get("otc_stocks", 0)

          items = data.get("items", [])

          print("total:", total)
          print("listed_stocks:", listed)
          print("otc_stocks:", otc)
          print("items:", len(items))

          if not isinstance(items, list):
              raise SystemExit(
                  "ERROR: universe.json items 不是 list"
              )

          if total <= 0:
              raise SystemExit(
                  "ERROR: Universe 沒有股票資料"
              )

          if len(items) <= 0:
              raise SystemExit(
                  "ERROR: Universe items 為空"
              )

          if total != len(items):
              raise SystemExit(
                  "ERROR: total 與 items 數量不一致"
              )

          if listed <= 0:
              raise SystemExit(
                  "ERROR: listed_stocks 為 0"
              )

          if otc <= 0:
              raise SystemExit(
                  "ERROR: otc_stocks 為 0"
              )

          print("✓ Universe validation passed")
          PY


      # ======================================================
      # 8. 取得價格資料
      #
      # V4.0 正式架構：
      #
      # Data/prices/
      #   prices_001.json
      #   prices_002.json
      #   ...
      #   manifest.json
      #
      # 不再使用 Data/prices.json
      # ======================================================

      - name: Fetch price data
        run: |
          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py


      # ======================================================
      # 9. 驗證 Data/prices/
      # ======================================================

      - name: Verify price shards
        run: |
          echo "========================================"
          echo "Verify Data/prices/"
          echo "========================================"

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo ""
          echo "Price files:"
          ls -lh Data/prices/


          python - <<'PY'
          import json
          from pathlib import Path

          prices_dir = Path("Data/prices")
          manifest_path = prices_dir / "manifest.json"

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          print("")
          print("manifest.json JSON OK")
          print("version:", manifest.get("version"))
          print("schema_version:", manifest.get("schema_version"))
          print("generated_at:", manifest.get("generated_at"))

          # --------------------------------------------------
          # 取得分檔清單
          # --------------------------------------------------

          files = manifest.get("files")

          if files is None:
              files = manifest.get("shards")

          if files is None:
              raise SystemExit(
                  "ERROR: manifest.json 找不到 files / shards"
              )

          if not isinstance(files, list):
              raise SystemExit(
                  "ERROR: manifest.json files/shards 必須是 list"
              )

          if not files:
              raise SystemExit(
                  "ERROR: manifest.json 沒有價格分檔"
              )

          print("manifest files:", len(files))


          # --------------------------------------------------
          # 驗證每一個分檔
          # --------------------------------------------------

          total_stocks = 0
          total_rows = 0
          validated_files = 0

          for entry in files:

              if isinstance(entry, str):
                  filename = entry

              elif isinstance(entry, dict):
                  filename = (
                      entry.get("file")
                      or entry.get("filename")
                      or entry.get("path")
                      or entry.get("name")
                  )

              else:
                  raise SystemExit(
                      "ERROR: manifest 分檔格式錯誤"
                  )

              if not filename:
                  raise SystemExit(
                      "ERROR: manifest 出現空白檔名"
                  )

              path = prices_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: 找不到分檔：{path}"
                  )

              if path.stat().st_size <= 0:
                  raise SystemExit(
                      f"ERROR: 分檔為空：{path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  shard = json.load(f)

              if not isinstance(shard, dict):
                  raise SystemExit(
                      f"ERROR: {filename} JSON 頂層不是 object"
                  )

              # ----------------------------------------------
              # 支援目前價格分檔可能使用的結構
              # ----------------------------------------------

              stocks = shard.get("stocks")

              if stocks is None:
                  stocks = shard.get("prices")

              if stocks is None:
                  stocks = shard.get("data")

              if stocks is None:
                  raise SystemExit(
                      f"ERROR: {filename} 找不到 stocks/prices/data"
                  )

              if not isinstance(stocks, dict):
                  raise SystemExit(
                      f"ERROR: {filename} 股票資料不是 object"
                  )

              stock_count = len(stocks)

              if stock_count <= 0:
                  raise SystemExit(
                      f"ERROR: {filename} 沒有股票資料"
                  )

              rows = 0

              for symbol, value in stocks.items():

                  if not symbol:
                      raise SystemExit(
                          f"ERROR: {filename} 出現空白 symbol"
                      )

                  if not isinstance(value, (dict, list)):
                      raise SystemExit(
                          f"ERROR: {filename} "
                          f"{symbol} 資料格式錯誤"
                      )

                  if isinstance(value, list):
                      rows += len(value)

                  elif isinstance(value, dict):

                      history = (
                          value.get("prices")
                          or value.get("history")
                          or value.get("data")
                      )

                      if isinstance(history, list):
                          rows += len(history)

                      else:
                          rows += 1

              total_stocks += stock_count
              total_rows += rows
              validated_files += 1

              print(
                  f"✓ {filename} | "
                  f"{stock_count} stocks | "
                  f"{path.stat().st_size / 1024 / 1024:.2f} MB"
              )


          # --------------------------------------------------
          # manifest 數量驗證
          # --------------------------------------------------

          manifest_count = manifest.get("count")

          if manifest_count is not None:

              try:
                  manifest_count = int(
                      manifest_count
                  )

                  if manifest_count != total_stocks:
                      raise SystemExit(
                          "ERROR: manifest count "
                          f"({manifest_count}) "
                          "與實際股票數 "
                          f"({total_stocks}) 不一致"
                      )

              except ValueError:
                  raise SystemExit(
                      "ERROR: manifest count 格式錯誤"
                  )


          print("")
          print("========================================")
          print("Price shard validation summary")
          print("========================================")
          print("validated files:", validated_files)
          print("total stocks:", total_stocks)
          print("total rows:", total_rows)

          if validated_files <= 0:
              raise SystemExit(
                  "ERROR: 沒有任何價格分檔"
              )

          if total_stocks <= 0:
              raise SystemExit(
                  "ERROR: 沒有任何股票價格資料"
              )

          print("")
          print("✓ Price shard validation passed")
          PY


      # ======================================================
      # 10. 取得主力籌碼
      # ======================================================

      - name: Fetch chip data
        run: |
          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 11. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |
          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          test -f Data/chip.json

          ls -lh Data/chip.json

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("chip.json JSON OK")

          print(
              "schema_version:",
              data.get("schema_version")
          )

          print(
              "data_date:",
              data.get("data_date")
          )

          print(
              "universe_count:",
              data.get("universe_count")
          )

          statistics = data.get(
              "statistics",
              {}
          )

          print(
              "complete:",
              statistics.get("complete")
          )

          print(
              "partial:",
              statistics.get("partial")
          )

          print(
              "insufficient:",
              statistics.get("insufficient")
          )

          stocks = data.get(
              "stocks",
              {}
          )

          print(
              "stocks:",
              len(stocks)
          )

          found_5d = 0
          found_10d = 0
          complete = 0

          for stock in stocks.values():

              if not isinstance(stock, dict):
                  continue

              if stock.get(
                  "main_force_5d"
              ) is not None:
                  found_5d += 1

              if stock.get(
                  "main_force_10d"
              ) is not None:
                  found_10d += 1

              if (
                  stock.get(
                      "main_force_5d"
                  ) is not None
                  and
                  stock.get(
                      "main_force_10d"
                  ) is not None
              ):
                  complete += 1

          print(
              "main_force_5d available:",
              found_5d
          )

          print(
              "main_force_10d available:",
              found_10d
          )

          print(
              "main_force_5d_10d complete:",
              complete
          )

          if not stocks:
              raise SystemExit(
                  "ERROR: chip.json 沒有股票資料"
              )

          print("✓ chip.json validation passed")
          PY


      # ======================================================
      # 12. 顯示最終資料
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated data files"
          echo "========================================"

          echo ""
          echo "Data:"
          ls -lh Data/

          echo ""
          echo "Data/prices/:"
          ls -lh Data/prices/

          echo ""
          echo "Git status:"
          git status --short


      # ======================================================
      # 13. Commit / Push
      #
      # 重要：
      # 不再 git add Data/prices.json
      #
      # 改為：
      # Data/prices/
      # ======================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/universe.json
          git add Data/prices/
          git add Data/chip.json

          # 舊版 prices.json 不再使用
          if [ -f Data/prices.json ]; then
            git rm -f Data/prices.json
          fi

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit -m "Update stock universe, price and chip data"

            git push

          fi