name: Update Taiwan Stock AI Data

on:
  workflow_dispatch:

  schedule:
    # ======================================================
    # 台灣時間
    #
    # 09:15 → UTC 01:15
    # 10:30 → UTC 02:30
    # 12:00 → UTC 04:00
    # 14:30 → UTC 06:30
    # 16:30 → UTC 08:30
    # 17:30 → UTC 09:30
    #
    # GitHub Actions 使用 UTC
    # ======================================================

    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:
  update:

    runs-on: ubuntu-latest

    timeout-minutes: 45

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ======================================================
      # 2. Setup Python
      # ======================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ======================================================
      # 3. Install Dependencies
      # ======================================================

      - name: Install dependencies
        run: |
          set -e

          python -m pip install --upgrade pip
          python -m pip install requests pandas

      # ======================================================
      # 4. Verify Project Structure
      # ======================================================

      - name: Verify project structure
        run: |
          set -e

          echo "========================================"
          echo "PROJECT STRUCTURE"
          echo "========================================"

          test -f Scripts/build_universe.py
          test -f Scripts/fetch_chip.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/analyze_stocks.py
          test -f Scripts/build_ui_data.py

          mkdir -p Data

          echo "✓ Scripts/build_universe.py"
          echo "✓ Scripts/fetch_chip.py"
          echo "✓ Scripts/fetch_prices.py"
          echo "✓ Scripts/analyze_stocks.py"
          echo "✓ Scripts/build_ui_data.py"
          echo "✓ Data/"

      # ======================================================
      # 5. Python Syntax Gate
      # ======================================================

      - name: Python syntax gate
        run: |
          set -e

          python -m py_compile \
            Scripts/build_universe.py \
            Scripts/fetch_chip.py \
            Scripts/fetch_prices.py \
            Scripts/analyze_stocks.py \
            Scripts/build_ui_data.py

          echo "✓ Python syntax PASS"

      # ======================================================
      # 6. Build Universe
      # ======================================================

      - name: Build Universe
        run: |
          set -e

          echo "========================================"
          echo "BUILD UNIVERSE"
          echo "========================================"

          python Scripts/build_universe.py

          echo "========================================"
          echo "UNIVERSE BUILD COMPLETED"
          echo "========================================"

      # ======================================================
      # 7. Validate Universe
      # ======================================================

      - name: Validate Universe
        run: |
          set -e

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("Data/universe.json")

          if not path.exists():
              raise SystemExit(
                  "❌ Data/universe.json 不存在"
              )

          try:
              with path.open(
                  "r",
                  encoding="utf-8-sig"
              ) as f:
                  data = json.load(f)
          except Exception as exc:
              raise SystemExit(
                  f"❌ universe.json JSON 解析失敗：{exc}"
              )

          if not isinstance(data, dict):
              raise SystemExit(
                  "❌ universe.json 根節點不是 object"
              )

          stocks = data.get("stocks")

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "❌ universe.stocks 不是 object"
              )

          count = data.get("universe_count")

          if count != len(stocks):
              raise SystemExit(
                  f"❌ universe_count 錯誤："
                  f"{count} != {len(stocks)}"
              )

          if count <= 0:
              raise SystemExit(
                  "❌ Universe 為 0"
              )

          required = {
              "symbol",
              "full_symbol",
              "name",
              "market",
              "type",
              "instrument_type",
              "status",
          }

          valid_markets = {
              "TWSE",
              "TPEX",
          }

          for key, item in stocks.items():

              if not isinstance(item, dict):
                  raise SystemExit(
                      f"❌ {key} 不是 object"
                  )

              missing = required - set(item)

              if missing:
                  raise SystemExit(
                      f"❌ {key} 缺少欄位："
                      f"{sorted(missing)}"
                  )

              if item["symbol"] != key:
                  raise SystemExit(
                      f"❌ key != symbol："
                      f"{key} != {item['symbol']}"
                  )

              if item["status"] != "active":
                  raise SystemExit(
                      f"❌ {key} status 不正確："
                      f"{item['status']}"
                  )

              if item["market"] not in valid_markets:
                  raise SystemExit(
                      f"❌ {key} market 不正確："
                      f"{item['market']}"
                  )

          print("")
          print("========================================")
          print("UNIVERSE VALIDATION")
          print("========================================")
          print(f"✓ Universe：{count}")
          print("✓ stocks object")
          print("✓ required fields")
          print("✓ status=active")
          print("✓ market validation")
          print("✓ Universe validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 8. Fetch Chip
      # ======================================================

      - name: Fetch Chip Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH CHIP DATA"
          echo "========================================"

          python Scripts/fetch_chip.py

          test -f Data/chip.json

          echo "✓ Data/chip.json"

      # ======================================================
      # 9. Fetch Prices
      # ======================================================

      - name: Fetch Price Data
        run: |
          set -e

          echo "========================================"
          echo "FETCH PRICE DATA"
          echo "========================================"

          python Scripts/fetch_prices.py

          test -d Data/prices
          test -f Data/prices/manifest.json

          echo "✓ Data/prices/"
          echo "✓ Data/prices/manifest.json"

      # ======================================================
      # 10. Validate Price Data
      #
      # 重要修正：
      #
      # 不再把 price shard 裡面的任意 dictionary key
      # 當成股票代號。
      #
      # 股票只能從明確的 symbol/code/stock_id/ticker
      # 或「真正的 symbol-keyed 股票 object」取得。
      #
      # 同時：
      # manifest.files[] 只負責描述 shard。
      # 絕對不把 manifest.files[] 當股票集合。
      # ======================================================

      - name: Validate Price Data
        run: |
          set -e

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          UNIVERSE_FILE = DATA_DIR / "universe.json"
          MANIFEST_FILE = PRICES_DIR / "manifest.json"

          SYMBOL_RE = re.compile(r"^[0-9A-Za-z]{4,12}$")

          def fail(message):
              raise SystemExit(f"❌ {message}")

          def load_json(path):
              if not path.exists():
                  fail(f"找不到檔案：{path}")

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      return json.load(f)
              except Exception as exc:
                  fail(
                      f"JSON 解析失敗："
                      f"{path}: {exc}"
                  )

          def normalize_symbol(value):
              if value is None:
                  return None

              if not isinstance(value, str):
                  return None

              symbol = value.strip()

              if not symbol:
                  return None

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):
                  if symbol.upper().endswith(suffix):
                      symbol = symbol[
                          :-len(suffix)
                      ]

              symbol = symbol.strip()

              if not symbol:
                  return None

              if not SYMBOL_RE.fullmatch(symbol):
                  return None

              return symbol

          def explicit_symbol(item):
              """
              只從明確股票欄位取得 symbol。
              """

              if not isinstance(item, dict):
                  return None

              for field in (
                  "symbol",
                  "stock_id",
                  "code",
                  "ticker",
                  "stock_code",
                  "security_code",
              ):
                  value = item.get(field)

                  symbol = normalize_symbol(value)

                  if symbol:
                      return symbol

              return None

          def extract_symbols_from_stock_object(obj):
              """
              處理真正的 symbol-keyed object：

                  {
                      "2337": {...},
                      "2426": {...}
                  }

              只有 key 本身符合股票代號格式，
              且 value 是股票資料 object/list，
              才接受 key 為股票代號。

              不會把 metadata key，例如：
                  date
                  generated_at
                  count
                  latest_date
                  source
              當股票。
              """

              result = set()

              if not isinstance(obj, dict):
                  return result

              for key, value in obj.items():

                  symbol = normalize_symbol(str(key))

                  if not symbol:
                      continue

                  if isinstance(value, dict):

                      explicit = explicit_symbol(value)

                      if explicit:
                          if explicit != symbol:
                              continue

                          result.add(symbol)
                          continue

                      # symbol-keyed stock object
                      result.add(symbol)

                  elif isinstance(value, list):

                      # symbol-keyed price list
                      result.add(symbol)

              return result

          def extract_symbols(data):
              """
              嚴格解析真正股票集合。

              優先處理：
                  stocks
                  data
                  items
                  records

              若是 list：
                  只接受含明確股票欄位的 record。

              若是 dict：
                  最後才處理真正的 symbol-keyed object。

              不會把任意 metadata key 當股票。
              """

              if isinstance(data, list):

                  result = set()

                  for item in data:

                      symbol = explicit_symbol(item)

                      if symbol:
                          result.add(symbol)

                  return result

              if not isinstance(data, dict):
                  return set()

              for field in (
                  "stocks",
                  "data",
                  "items",
                  "records",
              ):

                  candidate = data.get(field)

                  if isinstance(candidate, dict):

                      result = extract_symbols(
                          candidate
                      )

                      if result:
                          return result

                  elif isinstance(candidate, list):

                      result = extract_symbols(
                          candidate
                      )

                      if result:
                          return result

              return extract_symbols_from_stock_object(
                  data
              )

          universe = load_json(
              UNIVERSE_FILE
          )

          manifest = load_json(
              MANIFEST_FILE
          )

          if not isinstance(universe, dict):
              fail(
                  "universe.json 根節點不是 object"
              )

          if not isinstance(manifest, dict):
              fail(
                  "manifest.json 根節點不是 object"
              )

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):
              fail(
                  "universe.stocks 不是 object"
              )

          universe_symbols = set()

          for key, item in universe_stocks.items():

              if not isinstance(item, dict):
                  fail(
                      f"Universe {key} 不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
              )

              if not symbol:
                  fail(
                      f"Universe {key} 缺少有效 symbol"
                  )

              universe_symbols.add(symbol)

          manifest_files = manifest.get(
              "files"
          )

          if not isinstance(
              manifest_files,
              list
          ):
              fail(
                  "manifest.files 必須是 list"
              )

          shard_names = []

          for item in manifest_files:

              if isinstance(item, str):

                  filename = Path(
                      item.replace(
                          "\\",
                          "/"
                      )
                  ).name

                  if filename:
                      shard_names.append(
                          filename
                      )

              elif isinstance(item, dict):

                  filename = None

                  for field in (
                      "file",
                      "path",
                      "filename",
                      "name",
                  ):

                      value = item.get(field)

                      if isinstance(
                          value,
                          str
                      ) and value.strip():

                          filename = Path(
                              value.replace(
                                  "\\",
                                  "/"
                              )
                          ).name

                          break

                  if filename:
                      shard_names.append(
                          filename
                      )

          # 去除重複
          shard_names = list(
              dict.fromkeys(
                  shard_names
              )
          )

          if not shard_names:

              fail(
                  "manifest.files 沒有任何 price shard"
              )

          price_symbols = set()
          shard_symbols = {}
          duplicate_symbols = set()

          for filename in shard_names:

              shard_path = (
                  PRICES_DIR
                  / filename
              )

              if not shard_path.exists():
                  fail(
                      f"manifest 指定的價格分檔不存在："
                      f"{shard_path}"
                  )

              shard_data = load_json(
                  shard_path
              )

              symbols = extract_symbols(
                  shard_data
              )

              if not symbols:
                  fail(
                      f"{filename} "
                      "沒有解析到任何股票資料"
                  )

              # 只接受 Universe 內的候選，
              # 避免 metadata 被誤認為股票。
              valid_symbols = (
                  symbols
                  & universe_symbols
              )

              if not valid_symbols:
                  fail(
                      f"{filename} "
                      "沒有解析到任何 Universe 股票"
                  )

              shard_symbols[
                  filename
              ] = valid_symbols

              overlap = (
                  price_symbols
                  & valid_symbols
              )

              duplicate_symbols.update(
                  overlap
              )

              price_symbols.update(
                  valid_symbols
              )

          missing = (
              universe_symbols
              - price_symbols
          )

          extra = (
              price_symbols
              - universe_symbols
          )

          print("")
          print("========================================")
          print("PRICE DATA VALIDATION")
          print("========================================")

          print(
              f"Universe STOCK："
              f"{len(universe_symbols)}"
          )

          print(
              f"Price shards："
              f"{len(shard_names)}"
          )

          print(
              f"Price 股票集合："
              f"{len(price_symbols)}"
          )

          print(
              f"Universe → Price 成功對接："
              f"{len(universe_symbols & price_symbols)}"
          )

          print(
              f"Price 缺失："
              f"{len(missing)}"
          )

          print(
              f"Price 額外股票："
              f"{len(extra)}"
          )

          print(
              f"跨 shard 重複："
              f"{len(duplicate_symbols)}"
          )

          if missing:

              print("")
              print(
                  "❌ Universe 缺少價格資料："
              )

              for symbol in sorted(
                  missing
              )[:50]:

                  print(
                      f"  {symbol}"
                  )

              if len(missing) > 50:

                  print(
                      f"  ... "
                      f"另外 "
                      f"{len(missing) - 50} 檔"
                  )

              fail(
                  "Price Data 不完整"
              )

          if extra:

              print("")
              print(
                  "❌ Price 出現 Universe 以外股票："
              )

              for symbol in sorted(
                  extra
              )[:50]:

                  print(
                      f"  {symbol}"
                  )

              fail(
                  "Price Data 包含 Universe 外股票"
              )

          if duplicate_symbols:

              print("")
              print(
                  "❌ 股票出現在多個 price shard："
              )

              for symbol in sorted(
                  duplicate_symbols
              )[:50]:

                  locations = [
                      filename
                      for filename,
                      symbols
                      in shard_symbols.items()
                      if symbol in symbols
                  ]

                  print(
                      f"  {symbol}: "
                      f"{', '.join(locations)}"
                  )

              fail(
                  "Price shard 存在重複股票"
              )

          if len(price_symbols) != len(
              universe_symbols
          ):

              fail(
                  "Price 股票數量與 Universe "
                  "不一致"
              )

          print("")
          print("✓ manifest JSON OK")
          print("✓ 所有 price shard JSON OK")
          print("✓ Price 股票代號完整")
          print("✓ Universe → Price 完整對接")
          print("✓ 無 Universe 外股票")
          print("✓ 無跨 shard 重複")
          print("✓ Price Data validation PASS")
          print("========================================")
          PY

      # ======================================================
      # 11. Analyze Stocks
      # ======================================================

      - name: Analyze Stocks
        run: |
          set -e

          echo "========================================"
          echo "ANALYZE STOCKS"
          echo "========================================"

          python Scripts/analyze_stocks.py

          test -f Data/analysis.json

          echo "✓ Data/analysis.json"

      # ======================================================
      # 12. Build UI Data
      # ======================================================

      - name: Build UI Data
        run: |
          set -e

          echo "========================================"
          echo "BUILD UI DATA"
          echo "========================================"

          python Scripts/build_ui_data.py

          test -f Data/ui_data.json

          echo "✓ Data/ui_data.json"

      # ======================================================
      # 13. Final Data Contract
      #
      # 最終驗證：
      #
      # Universe
      #     ↓
      # Chip
      #     ↓
      # Price
      #     ↓
      # Analysis
      #     ↓
      # UI
      #
      # 注意：
      # Chip 可以因官方來源缺資料而少於 Universe。
      #
      # 但：
      # Chip / Price / Analysis / UI
      # 絕對不能出現 Universe 之外的股票。
      #
      # Price / Analysis / UI
      # 必須完整覆蓋 Universe。
      # ======================================================

      - name: Validate final data chain
        run: |
          set -e

          echo "========================================"
          echo "FINAL DATA CHAIN"
          echo "========================================"

          test -f Data/universe.json
          test -f Data/chip.json
          test -d Data/prices
          test -f Data/prices/manifest.json
          test -f Data/analysis.json
          test -f Data/ui_data.json

          echo "✓ universe.json"
          echo "✓ chip.json"
          echo "✓ prices/"
          echo "✓ prices/manifest.json"
          echo "✓ analysis.json"
          echo "✓ ui_data.json"

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          DATA_DIR = Path("Data")
          PRICES_DIR = DATA_DIR / "prices"

          SYMBOL_RE = re.compile(r"^[0-9A-Za-z]{4,12}$")

          def fail(message):
              raise SystemExit(
                  f"❌ {message}"
              )

          def load_json(path):
              if not path.exists():
                  fail(
                      f"找不到檔案：{path}"
                  )

              try:
                  with path.open(
                      "r",
                      encoding="utf-8-sig"
                  ) as f:
                      value = json.load(f)
              except Exception as exc:
                  fail(
                      f"JSON 驗證失敗："
                      f"{path}: {exc}"
                  )

              print(
                  f"✓ JSON OK：{path}"
              )

              return value

          def normalize_symbol(value):

              if value is None:
                  return None

              if not isinstance(
                  value,
                  str
              ):
                  return None

              symbol = value.strip()

              if not symbol:
                  return None

              for suffix in (
                  ".TW",
                  ".TWO",
                  ".HK",
              ):

                  if symbol.upper().endswith(
                      suffix
                  ):

                      symbol = symbol[
                          :-len(suffix)
                      ]

              symbol = symbol.strip()

              if not symbol:
                  return None

              if not SYMBOL_RE.fullmatch(
                  symbol
              ):
                  return None

              return symbol

          def explicit_symbol(item):

              if not isinstance(
                  item,
                  dict
              ):
                  return None

              for field in (
                  "symbol",
                  "stock_id",
                  "code",
                  "ticker",
                  "stock_code",
                  "security_code",
              ):

                  symbol = normalize_symbol(
                      item.get(field)
                  )

                  if symbol:
                      return symbol

              return None

          def extract_symbols_from_object(
              obj
          ):

              if not isinstance(
                  obj,
                  dict
              ):
                  return set()

              result = set()

              for key, value in obj.items():

                  symbol = normalize_symbol(
                      str(key)
                  )

                  if not symbol:
                      continue

                  if isinstance(
                      value,
                      dict
                  ):

                      explicit = explicit_symbol(
                          value
                      )

                      if explicit:

                          if explicit != symbol:
                              continue

                          result.add(symbol)

                      else:
                          result.add(symbol)

                  elif isinstance(
                      value,
                      list
                  ):

                      result.add(symbol)

              return result

          def extract_symbols(data):

              if isinstance(
                  data,
                  list
              ):

                  result = set()

                  for item in data:

                      symbol = explicit_symbol(
                          item
                      )

                      if symbol:
                          result.add(symbol)

                  return result

              if not isinstance(
                  data,
                  dict
              ):
                  return set()

              for field in (
                  "stocks",
                  "data",
                  "items",
                  "records",
              ):

                  candidate = data.get(
                      field
                  )

                  if isinstance(
                      candidate,
                      dict
                  ):

                      result = extract_symbols(
                          candidate
                      )

                      if result:
                          return result

                  elif isinstance(
                      candidate,
                      list
                  ):

                      result = extract_symbols(
                          candidate
                      )

                      if result:
                          return result

              return extract_symbols_from_object(
                  data
              )

          # ==================================================
          # Load
          # ==================================================

          universe = load_json(
              DATA_DIR / "universe.json"
          )

          chip = load_json(
              DATA_DIR / "chip.json"
          )

          manifest = load_json(
              PRICES_DIR / "manifest.json"
          )

          analysis = load_json(
              DATA_DIR / "analysis.json"
          )

          ui_data = load_json(
              DATA_DIR / "ui_data.json"
          )

          # ==================================================
          # Universe
          # ==================================================

          if not isinstance(
              universe,
              dict
          ):
              fail(
                  "universe 根節點不是 object"
              )

          universe_stocks = universe.get(
              "stocks"
          )

          if not isinstance(
              universe_stocks,
              dict
          ):
              fail(
                  "universe.stocks 必須是 object"
              )

          universe_symbols = set()

          for key, item in (
              universe_stocks.items()
          ):

              if not isinstance(
                  item,
                  dict
              ):
                  fail(
                      f"Universe {key} 不是 object"
                  )

              symbol = normalize_symbol(
                  item.get("symbol")
              )

              if not symbol:
                  fail(
                      f"Universe {key} "
                      "缺少有效 symbol"
                  )

              universe_symbols.add(
                  symbol
              )

          if universe.get(
              "universe_count"
          ) != len(
              universe_symbols
          ):

              fail(
                  "universe_count 不一致："
                  f"{universe.get('universe_count')} != "
                  f"{len(universe_symbols)}"
              )

          # ==================================================
          # Chip
          # ==================================================

          chip_symbols = extract_symbols(
              chip
          )

          chip_extra = (
              chip_symbols
              - universe_symbols
          )

          if chip_extra:

              fail(
                  "chip.json 出現 "
                  "Universe 以外股票："
                  f"{sorted(chip_extra)[:20]}"
              )

          # ==================================================
          # Price
          # ==================================================

          manifest_files = manifest.get(
              "files"
          )

          if not isinstance(
              manifest_files,
              list
          ):

              fail(
                  "manifest.files 必須是 list"
              )

          shard_names = []

          for item in manifest_files:

              if isinstance(
                  item,
                  str
              ):

                  filename = Path(
                      item.replace(
                          "\\",
                          "/"
                      )
                  ).name

                  if filename:
                      shard_names.append(
                          filename
                      )

              elif isinstance(
                  item,
                  dict
              ):

                  for field in (
                      "file",
                      "path",
                      "filename",
                      "name",
                  ):

                      value = item.get(
                          field
                      )

                      if isinstance(
                          value,
                          str
                      ) and value.strip():

                          filename = Path(
                              value.replace(
                                  "\\",
                                  "/"
                              )
                          ).name

                          shard_names.append(
                              filename
                          )

                          break

          shard_names = list(
              dict.fromkeys(
                  shard_names
              )
          )

          if not shard_names:

              fail(
                  "manifest 沒有任何 price shard"
              )

          price_symbols = set()
          duplicate_symbols = set()

          for filename in shard_names:

              path = (
                  PRICES_DIR
                  / filename
              )

              if not path.exists():

                  fail(
                      f"Price shard 不存在："
                      f"{path}"
                  )

              shard = load_json(
                  path
              )

              symbols = extract_symbols(
                  shard
              )

              if not symbols:

                  fail(
                      f"{filename} "
                      "沒有任何股票資料"
                  )

              valid_symbols = (
                  symbols
                  & universe_symbols
              )

              overlap = (
                  price_symbols
                  & valid_symbols
              )

              duplicate_symbols.update(
                  overlap
              )

              price_symbols.update(
                  valid_symbols
              )

          if duplicate_symbols:

              fail(
                  "price shards 有重複股票："
                  f"{sorted(duplicate_symbols)[:20]}"
              )

          price_missing = (
              universe_symbols
              - price_symbols
          )

          if price_missing:

              fail(
                  "Price 缺少 Universe 股票："
                  f"{sorted(price_missing)[:20]}"
              )

          if len(price_symbols) != (
              len(universe_symbols)
          ):

              fail(
                  "Price 與 Universe 股票數量不一致："
                  f"{len(price_symbols)} != "
                  f"{len(universe_symbols)}"
              )

          # ==================================================
          # Analysis
          # ==================================================

          if not isinstance(
              analysis,
              dict
          ):

              fail(
                  "analysis 根節點不是 object"
              )

          analysis_stocks = analysis.get(
              "stocks"
          )

          if not isinstance(
              analysis_stocks,
              dict
          ):

              fail(
                  "analysis.stocks 必須是 object"
              )

          analysis_symbols = set()

          for key, item in (
              analysis_stocks.items()
          ):

              symbol = normalize_symbol(
                  item.get("symbol")
                  if isinstance(
                      item,
                      dict
                  )
                  else key
              )

              if symbol:
                  analysis_symbols.add(
                      symbol
                  )

          analysis_missing = (
              universe_symbols
              - analysis_symbols
          )

          analysis_extra = (
              analysis_symbols
              - universe_symbols
          )

          if analysis_missing:

              fail(
                  "Analysis 缺少 Universe 股票："
                  f"{sorted(analysis_missing)[:20]}"
              )

          if analysis_extra:

              fail(
                  "Analysis 出現 Universe 外股票："
                  f"{sorted(analysis_extra)[:20]}"
              )

          # ==================================================
          # UI
          # ==================================================

          if not isinstance(
              ui_data,
              dict
          ):

              fail(
                  "ui_data 根節點不是 object"
              )

          ui_stocks = ui_data.get(
              "stocks"
          )

          if not isinstance(
              ui_stocks,
              dict
          ):

              fail(
                  "ui_data.stocks 必須是 object"
              )

          ui_symbols = set()

          for key, item in (
              ui_stocks.items()
          ):

              symbol = normalize_symbol(
                  item.get("symbol")
                  if isinstance(
                      item,
                      dict
                  )
                  else key
              )

              if symbol:
                  ui_symbols.add(
                      symbol
                  )

          ui_missing = (
              universe_symbols
              - ui_symbols
          )

          ui_extra = (
              ui_symbols
              - universe_symbols
          )

          if ui_missing:

              fail(
                  "UI Data 缺少 Universe 股票："
                  f"{sorted(ui_missing)[:20]}"
              )

          if ui_extra:

              fail(
                  "UI Data 出現 Universe 外股票："
                  f"{sorted(ui_extra)[:20]}"
              )

          # ==================================================
          # Final Result
          # ==================================================

          print("")
          print("========================================")
          print("FINAL DATA CHAIN RESULT")
          print("========================================")

          print(
              f"Universe STOCK："
              f"{len(universe_symbols)}"
          )

          print(
              f"Chip 股票："
              f"{len(chip_symbols)}"
          )

          print(
              f"Price shards："
              f"{len(shard_names)}"
          )

          print(
              f"Price 股票："
              f"{len(price_symbols)}"
          )

          print(
              f"Analysis 股票："
              f"{len(analysis_symbols)}"
          )

          print(
              f"UI 股票："
              f"{len(ui_symbols)}"
          )

          print("")

          print(
              "✓ Universe → Price：完整"
          )

          print(
              "✓ Price → Analysis：完整"
          )

          print(
              "✓ Analysis → UI：完整"
          )

          print(
              "✓ Chip 無 Universe 外股票"
          )

          print(
              "✓ Price 無 Universe 外股票"
          )

          print(
              "✓ Analysis 無 Universe 外股票"
          )

          print(
              "✓ UI 無 Universe 外股票"
          )

          print(
              "✓ FINAL DATA CHAIN PASS"
          )

          print(
              "========================================"
          )
          PY

