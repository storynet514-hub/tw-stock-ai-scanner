name: Update Stock Data

on:
  workflow_dispatch:

  schedule:
    - cron: "15 1 * * 1-5"
    - cron: "30 2 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "30 6 * * 1-5"
    - cron: "30 8 * * 1-5"
    - cron: "30 9 * * 1-5"

permissions:
  contents: write

jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. Checkout
      # ======================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # 2. Python
      # ======================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ======================================================
      # 3. 安裝套件
      # ======================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests beautifulsoup4


      # ======================================================
      # 4. 檢查專案結構
      # ======================================================

      - name: Check project structure
        run: |
          echo "========================================"
          echo "Project structure"
          echo "========================================"

          echo ""
          echo "Root:"
          ls -la

          echo ""
          echo "Scripts:"
          ls -la Scripts

          echo ""
          echo "Data:"
          ls -la Data

          echo ""
          echo "Workflow:"
          ls -la .github/workflows

          echo ""


      # ======================================================
      # 5. 檢查必要檔案
      # ======================================================

      - name: Verify required files
        run: |
          test -f Scripts/build_universe.py
          test -f Scripts/fetch_prices.py
          test -f Scripts/fetch_chip.py
          test -f Data/universe.json

          echo "✓ build_universe.py"
          echo "✓ fetch_prices.py"
          echo "✓ fetch_chip.py"
          echo "✓ universe.json"


      # ======================================================
      # 6. 建立全市場 Universe
      # ======================================================

      - name: Build market universe
        run: |
          echo "========================================"
          echo "Running build_universe.py"
          echo "========================================"

          python Scripts/build_universe.py


      # ======================================================
      # 7. 驗證 Universe
      # ======================================================

      - name: Verify universe.json
        run: |
          echo "========================================"
          echo "Verify universe.json"
          echo "========================================"

          test -f Data/universe.json

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: universe.json 頂層不是 object"
              )

          items = data.get("items", [])

          if not isinstance(items, list):
              raise SystemExit(
                  "ERROR: universe.json items 不是 list"
              )

          print("universe.json JSON OK")
          print("version:", data.get("version"))
          print("generated_at:", data.get("generated_at"))
          print("total:", data.get("total"))
          print("listed_stocks:", data.get("listed_stocks"))
          print("otc_stocks:", data.get("otc_stocks"))
          print("items:", len(items))

          if not items:
              raise SystemExit(
                  "ERROR: Universe items 為空"
              )

          valid = 0
          invalid = 0

          for item in items:

              if not isinstance(item, dict):
                  invalid += 1
                  continue

              symbol = (
                  item.get("symbol")
                  or item.get("code")
                  or item.get("ticker")
              )

              if symbol:
                  valid += 1
              else:
                  invalid += 1

          print("valid symbols:", valid)
          print("invalid items:", invalid)

          if valid <= 0:
              raise SystemExit(
                  "ERROR: Universe 沒有任何合法股票"
              )

          print("✓ Universe validation passed")
          PY


      # ======================================================
      # 8. 取得價格資料
      #
      # 注意：
      # 這裡完全使用現有 Scripts/fetch_prices.py
      # 不修改 fetch_prices.py
      # ======================================================

      - name: Fetch price data
        run: |
          echo "========================================"
          echo "Running fetch_prices.py"
          echo "========================================"

          python Scripts/fetch_prices.py


      # ======================================================
      # 9. 驗證 Data/prices/
      # ======================================================

      - name: Verify price shards
        run: |
          echo "========================================"
          echo "Verify Data/prices/"
          echo "========================================"

          test -d Data/prices
          test -f Data/prices/manifest.json

          python - <<'PY'
          import json
          from pathlib import Path

          prices_dir = Path("Data/prices")
          manifest_path = prices_dir / "manifest.json"

          with manifest_path.open(
              "r",
              encoding="utf-8"
          ) as f:
              manifest = json.load(f)

          print("manifest.json JSON OK")
          print("version:", manifest.get("version"))
          print("schema_version:", manifest.get("schema_version"))
          print("generated_at:", manifest.get("generated_at"))

          files = manifest.get("files")

          if files is None:
              files = manifest.get("shards")

          if not isinstance(files, list):
              raise SystemExit(
                  "ERROR: manifest files/shards 必須是 list"
              )

          if not files:
              raise SystemExit(
                  "ERROR: manifest 沒有價格分檔"
              )

          total_stocks = 0

          for entry in files:

              if isinstance(entry, str):
                  filename = entry

              elif isinstance(entry, dict):
                  filename = (
                      entry.get("file")
                      or entry.get("filename")
                      or entry.get("path")
                      or entry.get("name")
                  )

              else:
                  raise SystemExit(
                      "ERROR: manifest 分檔格式錯誤"
                  )

              if not filename:
                  raise SystemExit(
                      "ERROR: manifest 出現空白檔名"
                  )

              path = prices_dir / filename

              if not path.exists():
                  raise SystemExit(
                      f"ERROR: 找不到分檔：{path}"
                  )

              if path.stat().st_size <= 0:
                  raise SystemExit(
                      f"ERROR: 分檔為空：{path}"
                  )

              with path.open(
                  "r",
                  encoding="utf-8"
              ) as f:
                  shard = json.load(f)

              if not isinstance(shard, dict):
                  raise SystemExit(
                      f"ERROR: {filename} 頂層不是 object"
                  )

              stocks = (
                  shard.get("stocks")
                  if isinstance(
                      shard.get("stocks"),
                      dict
                  )
                  else shard.get("prices")
              )

              if stocks is None:
                  stocks = shard.get("data")

              if not isinstance(stocks, dict):
                  raise SystemExit(
                      f"ERROR: {filename} 股票資料不是 object"
                  )

              count = len(stocks)

              if count <= 0:
                  raise SystemExit(
                      f"ERROR: {filename} 沒有股票資料"
                  )

              total_stocks += count

              print(
                  f"✓ {filename} validated | "
                  f"{count} stocks | "
                  f"{path.stat().st_size / 1024 / 1024:.2f} MB"
              )

          print("")
          print("========================================")
          print("Price shard validation summary")
          print("========================================")
          print("files:", len(files))
          print("stocks:", total_stocks)

          if total_stocks <= 0:
              raise SystemExit(
                  "ERROR: 沒有任何價格資料"
              )

          manifest_count = manifest.get("count")

          if manifest_count is not None:
              try:
                  manifest_count = int(manifest_count)

                  if manifest_count != total_stocks:
                      raise SystemExit(
                          "ERROR: manifest count "
                          f"({manifest_count}) 與實際股票數 "
                          f"({total_stocks}) 不一致"
                      )

              except ValueError:
                  raise SystemExit(
                      "ERROR: manifest count 格式錯誤"
                  )

          print("✓ Price shard validation passed")
          PY


      # ======================================================
      # 10. Debug Universe 結構
      #
      # 注意：
      # 這一段只是讀取 Data/universe.json
      # 不修改 universe.json
      # ======================================================

      - name: Inspect universe for chip
        run: |
          echo "========================================"
          echo "Inspect Data/universe.json before chip"
          echo "========================================"

          python - <<'PY'
          import json

          path = "Data/universe.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Top-level type:", type(data).__name__)

          if isinstance(data, dict):

              print("Top-level keys:")

              for key, value in data.items():

                  if isinstance(value, list):
                      print(
                          f"  {key}: list ({len(value)})"
                      )

                  elif isinstance(value, dict):
                      print(
                          f"  {key}: dict ({len(value)})"
                      )

                  else:
                      print(
                          f"  {key}: "
                          f"{type(value).__name__} = {value}"
                      )

              items = data.get("items")

              print("")
              print(
                  "items type:",
                  type(items).__name__
              )

              print(
                  "items count:",
                  len(items)
                  if isinstance(items, list)
                  else "N/A"
              )

              if isinstance(items, list) and items:

                  print("")
                  print("First 3 items:")

                  for item in items[:3]:
                      print(item)

                  print("")
                  print("Last 3 items:")

                  for item in items[-3:]:
                      print(item)

          elif isinstance(data, list):

              print(
                  "Universe is directly a list"
              )

              print(
                  "items count:",
                  len(data)
              )

              print("")
              print("First 3 items:")

              for item in data[:3]:
                  print(item)

          else:

              raise SystemExit(
                  "ERROR: universe.json "
                  "頂層格式異常"
              )

          print("")
          print(
              "✓ Universe inspection completed"
          )
          PY


      # ======================================================
      # 11. 取得主力籌碼
      # ======================================================

      - name: Fetch chip data
        run: |
          echo "========================================"
          echo "Running fetch_chip.py"
          echo "========================================"

          python Scripts/fetch_chip.py


      # ======================================================
      # 12. 驗證 chip.json
      # ======================================================

      - name: Verify chip.json
        run: |
          echo "========================================"
          echo "Verify chip.json"
          echo "========================================"

          test -f Data/chip.json

          python - <<'PY'
          import json

          path = "Data/chip.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "ERROR: chip.json 頂層不是 object"
              )

          stocks = data.get("stocks", {})

          print("chip.json JSON OK")
          print("schema_version:", data.get("schema_version"))
          print("data_date:", data.get("data_date"))
          print("universe_count:", data.get("universe_count"))
          print("stocks:", len(stocks))

          if not isinstance(stocks, dict):
              raise SystemExit(
                  "ERROR: chip.json stocks 不是 object"
              )

          if not stocks:
              raise SystemExit(
                  "ERROR: chip.json 沒有股票資料"
              )

          statistics = data.get(
              "statistics",
              {}
          )

          print(
              "complete:",
              statistics.get("complete")
          )

          print(
              "partial:",
              statistics.get("partial")
          )

          print(
              "insufficient:",
              statistics.get("insufficient")
          )

          print("✓ chip.json validation passed")
          PY


      # ======================================================
      # 13. 顯示資料檔案
      # ======================================================

      - name: Show generated files
        run: |
          echo "========================================"
          echo "Generated data files"
          echo "========================================"

          echo ""
          echo "Data:"
          ls -lh Data/

          echo ""
          echo "Price shards:"
          ls -lh Data/prices/

          echo ""
          echo "Git status:"
          git status --short


      # ======================================================
      # 14. Commit / Push
      # ======================================================

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/universe.json
          git add Data/prices/
          git add Data/chip.json

          # 舊的空 prices.json 不再作為正式價格資料
          git rm -f Data/prices.json 2>/dev/null || true

          if git diff --cached --quiet; then

            echo "No data changes to commit."

          else

            git commit -m "Update stock universe, price shards and chip data"

            git push

          fi