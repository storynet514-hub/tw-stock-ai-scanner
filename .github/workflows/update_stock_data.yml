name: 更新台股資料

on:

  # ============================================================
  # 手動執行
  # ============================================================

  workflow_dispatch:


  # ============================================================
  # 自動執行
  #
  # GitHub Actions 使用 UTC
  # 台灣時間 = UTC + 8
  #
  # 每週一～週五
  # ============================================================

  schedule:

    # 台灣時間 09:15
    - cron: "15 1 * * 1-5"

    # 台灣時間 10:30
    - cron: "30 2 * * 1-5"

    # 台灣時間 12:00
    - cron: "0 4 * * 1-5"

    # 台灣時間 14:30
    - cron: "30 6 * * 1-5"

    # 台灣時間 15:30
    - cron: "30 7 * * 1-5"

    # 台灣時間 17:30
    - cron: "30 9 * * 1-5"


# ================================================================
# GitHub Actions 權限
# ================================================================

permissions:
  contents: write


# ================================================================
# 工作
# ================================================================

jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # 取得專案
      # ==========================================================

      - name: 取得專案
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 設定 Python
      # ==========================================================

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 安裝 Python 套件
      # ==========================================================

      - name: 安裝套件
        run: |

          python -m pip install --upgrade pip

          pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            lxml


      # ==========================================================
      # 執行股票資料更新
      # ==========================================================

      - name: 執行股票資料更新
        run: |

          python Scripts/fetch_data.py


      # ==========================================================
      # 驗證 prices.json
      # ==========================================================

      - name: 驗證 prices.json
        run: |

          echo "======================================"
          echo "驗證 Data/prices.json"
          echo "======================================"

          test -f Data/prices.json

          echo "檔案存在"

          wc -c Data/prices.json


          python - <<'PY'

          import json
          import os


          path = "Data/prices.json"


          # ------------------------------------------------------
          # 確認檔案存在
          # ------------------------------------------------------

          if not os.path.exists(path):

              raise SystemExit(
                  "ERROR: prices.json 不存在"
              )


          # ------------------------------------------------------
          # 檢查檔案大小
          # ------------------------------------------------------

          size = os.path.getsize(path)

          print(
              f"prices.json 大小：{size} bytes"
          )


          if size < 1000:

              raise SystemExit(
                  f"ERROR: prices.json 異常過小：{size} bytes"
              )


          # ------------------------------------------------------
          # 讀取 JSON
          # ------------------------------------------------------

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          # ------------------------------------------------------
          # 取得股票資料
          # ------------------------------------------------------

          stocks = data.get(
              "stocks",
              []
          )

          top30 = data.get(
              "top30",
              []
          )


          print(
              f"stocks = {len(stocks)}"
          )

          print(
              f"top30 = {len(top30)}"
          )


          # ------------------------------------------------------
          # 最低資料量檢查
          # ------------------------------------------------------

          if len(stocks) < 50:

              raise SystemExit(
                  "ERROR: stocks 少於 50 筆"
              )


          if len(top30) == 0:

              raise SystemExit(
                  "ERROR: top30 為空"
              )


          # ------------------------------------------------------
          # TOP30 必要欄位
          # ------------------------------------------------------

          required = {

              "code",
              "name",
              "price",
              "ai_score",
              "signal"

          }


          for item in top30:

              missing = (

                  required -
                  set(item.keys())

              )


              if missing:

                  raise SystemExit(

                      f"ERROR: "
                      f"{item.get('code')} "
                      f"缺少欄位："
                      f"{missing}"

                  )


          print(
              "prices.json 驗證成功"
          )

          PY


      # ==========================================================
      # 顯示 TOP30
      # ==========================================================

      - name: 顯示 TOP30
        run: |

          python - <<'PY'

          import json


          with open(
              "Data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("")

          print(
              "======================================"
          )

          print(
              "TOP 30"
          )

          print(
              "======================================"
          )


          for item in data.get(
              "top30",
              []
          ):

              print(

                  f"#{item.get('rank', '-'):<3} "
                  f"{item.get('code', ''):<8} "
                  f"{item.get('name', ''):<12} "
                  f"price={item.get('price')} "
                  f"score={item.get('ai_score')} "
                  f"signal={item.get('signal')}"

              )


          print(
              "======================================"
          )

          PY


      # ==========================================================
      # 提交最新資料
      # ==========================================================

      - name: 提交最新資料
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # 同步遠端最新 main
          #
          # 避免：
          # ! [rejected] main -> main (fetch first)
          # non-fast-forward
          # ------------------------------------------------------

          git fetch origin main

          git pull --rebase origin main


          # ------------------------------------------------------
          # 加入最新資料
          # ------------------------------------------------------

          git add Data/prices.json


          # ------------------------------------------------------
          # 判斷是否有資料變更
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo "沒有新的資料需要提交"

          else

            git commit \
              -m "自動更新台股資料 V7.5"

            git push origin main

          fi
