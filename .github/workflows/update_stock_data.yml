name: 更新台股資料

on:

  # ============================================================
  # 手動執行
  # ============================================================

  workflow_dispatch:


  # ============================================================
  # 自動執行
  #
  # GitHub Actions 使用 UTC
  # 台灣時間 = UTC + 8
  #
  # 每週一～週五
  # ============================================================

  schedule:

    # 台灣時間 09:15
    - cron: "15 1 * * 1-5"

    # 台灣時間 10:30
    - cron: "30 2 * * 1-5"

    # 台灣時間 12:00
    - cron: "0 4 * * 1-5"

    # 台灣時間 14:30
    - cron: "30 6 * * 1-5"

    # 台灣時間 15:30
    - cron: "30 7 * * 1-5"

    # 台灣時間 17:30
    - cron: "30 9 * * 1-5"


# ================================================================
# GitHub Actions 權限
# ================================================================

permissions:
  contents: write


# ================================================================
# 工作
# ================================================================

jobs:

  update-stock-data:

    runs-on: ubuntu-latest


    steps:

      # ==========================================================
      # 取得專案
      # ==========================================================

      - name: 取得專案
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ==========================================================
      # 設定 Python
      # ==========================================================

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================================
      # 安裝 Python 套件
      # ==========================================================

      - name: 安裝套件
        run: |

          python -m pip install --upgrade pip

          pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            lxml


      # ==========================================================
      # 執行股票資料更新
      # ==========================================================

      - name: 執行股票資料更新
        run: |

          python Scripts/fetch_data.py


      # ==========================================================
      # 驗證所有資料檔案
      # ==========================================================

      - name: 驗證資料檔案
        run: |

          echo "=============================================="
          echo "驗證輸出檔案"
          echo "=============================================="


          test -f Data/prices.json
          test -f Data/backtest.json
          test -f Data/ui_data.json
          test -f Data/securities.json


          echo ""
          echo "✓ Data/prices.json"
          echo "✓ Data/backtest.json"
          echo "✓ Data/ui_data.json"
          echo "✓ Data/securities.json"


          echo ""
          echo "檔案大小："


          ls -lh \
            Data/prices.json \
            Data/backtest.json \
            Data/ui_data.json \
            Data/securities.json


      # ==========================================================
      # 驗證 prices.json
      # ==========================================================

      - name: 驗證 prices.json
        run: |

          echo "======================================"
          echo "驗證 Data/prices.json"
          echo "======================================"


          test -f Data/prices.json


          echo "檔案存在"


          wc -c Data/prices.json


          python - <<'PY'

          import json
          import os


          path = "Data/prices.json"


          # ------------------------------------------------------
          # 確認檔案存在
          # ------------------------------------------------------

          if not os.path.exists(path):

              raise SystemExit(
                  "ERROR: prices.json 不存在"
              )


          # ------------------------------------------------------
          # 檢查檔案大小
          # ------------------------------------------------------

          size = os.path.getsize(path)


          print(
              f"prices.json 大小：{size} bytes"
          )


          if size < 1000:

              raise SystemExit(
                  f"ERROR: prices.json 異常過小：{size} bytes"
              )


          # ------------------------------------------------------
          # 讀取 JSON
          # ------------------------------------------------------

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          # ------------------------------------------------------
          # 取得股票資料
          # ------------------------------------------------------

          stocks = data.get(
              "stocks",
              []
          )


          top30 = data.get(
              "top30",
              []
          )


          print(
              f"stocks = {len(stocks)}"
          )


          print(
              f"top30 = {len(top30)}"
          )


          # ------------------------------------------------------
          # 最低資料量檢查
          # ------------------------------------------------------

          if len(stocks) < 50:

              raise SystemExit(
                  "ERROR: stocks 少於 50 筆"
              )


          if len(top30) == 0:

              raise SystemExit(
                  "ERROR: top30 為空"
              )


          # ------------------------------------------------------
          # TOP30 必要欄位
          # ------------------------------------------------------

          required = {

              "code",
              "name",
              "price",
              "ai_score",
              "signal"

          }


          for item in top30:

              missing = (
                  required -
                  set(item.keys())
              )


              if missing:

                  raise SystemExit(

                      f"ERROR: "
                      f"{item.get('code')} "
                      f"缺少欄位："
                      f"{missing}"

                  )


          print(
              "prices.json 驗證成功"
          )

          PY


      # ==========================================================
      # 顯示 TOP30
      # ==========================================================

      - name: 顯示 TOP30
        run: |

          python - <<'PY'

          import json


          with open(
              "Data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("")


          print(
              "======================================"
          )


          print(
              "TOP 30"
          )


          print(
              "======================================"
          )


          for item in data.get(
              "top30",
              []
          ):

              print(

                  f"#{item.get('rank', '-'):<3} "
                  f"{item.get('code', ''):<8} "
                  f"{item.get('name', ''):<12} "
                  f"price={item.get('price')} "
                  f"score={item.get('ai_score')} "
                  f"signal={item.get('signal')}"

              )


          print(
              "======================================"
          )

          PY


      # ==========================================================
      # 驗證 6/6 正式選股結果
      # ==========================================================

      - name: 驗證 6/6 選股結果
        run: |

          python - <<'PY'

          import json
          from pathlib import Path


          path = Path(
              "Data/prices.json"
          )


          with path.open(
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("")
          print("=" * 72)
          print("今日正式 6/6 選股結果")
          print("=" * 72)


          updated_at = data.get(
              "updated_at_tw",
              ""
          )


          print(
              f"更新時間：{updated_at}"
          )


          selected = data.get(
              "today_selected",
              []
          )


          print(
              f"符合 6/6 個股數量："
              f"{len(selected)}"
          )


          print("")


          if not selected:

              print(
                  "今日沒有符合全部六項核心條件的個股。"
              )

          else:

              for index, stock in enumerate(
                  selected,
                  start=1
              ):

                  print(
                      f"[{index}] "
                      f"{stock.get('code', '')} "
                      f"{stock.get('name', '')}"
                  )


                  print(
                      f"    收盤價："
                      f"{stock.get('price')}"
                  )


                  print(
                      f"    RSI："
                      f"{stock.get('rsi')}"
                  )


                  print(
                      f"    MACD："
                      f"{stock.get('macd')}"
                      f" / Signal："
                      f"{stock.get('macd_signal')}"
                  )


                  print(
                      f"    K/D："
                      f"{stock.get('k')}"
                      f" / "
                      f"{stock.get('d')}"
                  )


                  print(
                      f"    成交量："
                      f"{stock.get('volume')}"
                  )


                  print(
                      f"    5日均量："
                      f"{stock.get('volume_ma5')}"
                  )


                  print(
                      f"    量比："
                      f"{stock.get('volume_ratio')}"
                  )


                  print(
                      f"    MA20："
                      f"{stock.get('ma20')}"
                  )


                  print(
                      f"    MA20 向上："
                      f"{stock.get('ma20_up')}"
                  )


                  print(
                      f"    AI Score："
                      f"{stock.get('ai_score')}"
                  )


                  print(
                      f"    Signal："
                      f"{stock.get('signal')}"
                  )


                  print("")


          print("=" * 72)


          print("核心條件：")


          for condition in data.get(
              "core_conditions",
              {}
          ).get(
              "names",
              []
          ):

              print(
                  f"✓ {condition}"
              )


          print("=" * 72)

          PY


      # ==========================================================
      # 檢查 00720B 是否存在於資料庫
      # ==========================================================

      - name: 檢查 00720B 資料
        run: |

          python - <<'PY'

          import json


          target = "00720B"


          print("")
          print("=" * 72)
          print("檢查 00720B 元大投資級公司債")
          print("=" * 72)


          files = [

              "Data/prices.json",
              "Data/securities.json",
              "Data/ui_data.json"

          ]


          for path in files:

              print("")
              print(f"檔案：{path}")


              try:

                  with open(
                      path,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      data = json.load(f)

              except Exception as e:

                  print(
                      f"無法讀取：{e}"
                  )

                  continue


              found = []


              def search(
                  obj,
                  location="root"
              ):

                  if isinstance(
                      obj,
                      dict
                  ):

                      code_values = [

                          obj.get("code"),
                          obj.get("symbol"),
                          obj.get("ticker"),
                          obj.get("stock_code"),
                          obj.get("id")

                      ]


                      if any(
                          str(value).strip() == target
                          for value in code_values
                          if value is not None
                      ):

                          found.append(
                              (
                                  location,
                                  obj
                              )
                          )


                      for key, value in obj.items():

                          search(
                              value,
                              f"{location}.{key}"
                          )


                  elif isinstance(
                      obj,
                      list
                  ):

                      for index, value in enumerate(obj):

                          search(
                              value,
                              f"{location}[{index}]"
                          )


              search(data)


              if not found:

                  print(
                      "✗ 找不到 00720B"
                  )

              else:

                  print(
                      f"✓ 找到 {len(found)} 筆 00720B 資料"
                  )


                  for location, item in found[:5]:

                      print(
                          f"  位置：{location}"
                      )


                      if isinstance(
                          item,
                          dict
                      ):

                          print(
                              f"  code："
                              f"{item.get('code')}"
                          )


                          print(
                              f"  name："
                              f"{item.get('name')}"
                          )


                          print(
                              f"  price："
                              f"{item.get('price')}"
                          )


                          print(
                              f"  close："
                              f"{item.get('close')}"
                          )


          print("")
          print("=" * 72)

          PY


      # ==========================================================
      # 提交最新資料
      # ==========================================================

      - name: 提交最新資料
        run: |

          git config user.name \
            "github-actions[bot]"


          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"


          # ------------------------------------------------------
          # 同步遠端最新 main
          #
          # 避免：
          # ! [rejected] main -> main (fetch first)
          # non-fast-forward
          # ------------------------------------------------------

          git fetch origin main


          git pull --rebase origin main


          # ------------------------------------------------------
          # 加入所有最新資料
          # ------------------------------------------------------

          git add \
            Data/prices.json \
            Data/backtest.json \
            Data/ui_data.json \
            Data/securities.json


          # ------------------------------------------------------
          # 判斷是否有資料變更
          # ------------------------------------------------------

          if git diff --cached --quiet; then

            echo "沒有新的資料需要提交"

          else

            git commit \
              -m "自動更新台股資料 V7.5"


            git push origin main

          fi
