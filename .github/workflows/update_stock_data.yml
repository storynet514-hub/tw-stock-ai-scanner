name: 更新台股資料

on:

  workflow_dispatch:

  schedule:
    - cron: "30 6 * * 1-5"

permissions:
  contents: write

jobs:

  update-stock-data:

    runs-on: ubuntu-latest

    steps:

      - name: 取得專案
        uses: actions/checkout@v4

      - name: 設定 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          pip install \
            yfinance \
            pandas \
            numpy \
            requests \
            lxml

      - name: 執行股票資料更新
        run: |
          python Scripts/fetch_data.py

      - name: 驗證 prices.json
        run: |

          echo "======================================"
          echo "驗證 Data/prices.json"
          echo "======================================"

          test -f Data/prices.json

          echo "檔案存在"

          wc -c Data/prices.json

          python - <<'PY'
          import json
          import os

          path = "Data/prices.json"

          if not os.path.exists(path):
              raise SystemExit(
                  "ERROR: prices.json 不存在"
              )

          size = os.path.getsize(path)

          if size < 1000:
              raise SystemExit(
                  f"ERROR: prices.json 異常過小：{size} bytes"
              )

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          stocks = data.get("stocks", [])
          top30 = data.get("top30", [])

          print(
              f"stocks = {len(stocks)}"
          )

          print(
              f"top30 = {len(top30)}"
          )

          if len(stocks) < 50:
              raise SystemExit(
                  "ERROR: stocks 少於 50 筆"
              )

          if len(top30) == 0:
              raise SystemExit(
                  "ERROR: top30 為空"
              )

          required = {
              "code",
              "name",
              "price",
              "ai_score",
              "signal"
          }

          for item in top30:

              missing = (
                  required -
                  set(item.keys())
              )

              if missing:
                  raise SystemExit(
                      f"ERROR: "
                      f"{item.get('code')} "
                      f"缺少欄位："
                      f"{missing}"
                  )

          print(
              "prices.json 驗證成功"
          )
          PY

      - name: 顯示 TOP30
        run: |

          python - <<'PY'
          import json

          with open(
              "Data/prices.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print("")
          print("======================================")
          print("TOP 30")
          print("======================================")

          for item in data.get("top30", []):

              print(
                  f"#{item.get('rank', '-'):<3} "
                  f"{item.get('code', ''):<8} "
                  f"{item.get('name', ''):<12} "
                  f"price={item.get('price')} "
                  f"score={item.get('ai_score')} "
                  f"signal={item.get('signal')}"
              )

          print("======================================")
          PY

      - name: 提交最新資料
        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add Data/prices.json

          if git diff --cached --quiet; then

            echo "沒有新的資料需要提交"

          else

            git commit \
              -m "自動更新台股資料 V7.4.2"

            git push

          fi
