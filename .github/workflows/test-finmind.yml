name: FinMind API 測試 - 五項核心與籌碼

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:

  test-finmind:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Python
      # ============================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================================
      # 3. Install
      # ============================================================

      - name: Install dependencies
        run: |

          set -e

          python -m pip install --upgrade pip

          pip install \
            requests \
            pandas


      # ============================================================
      # 4. FinMind API Test
      #
      # 固定測試：
      #
      # 2337 旺宏
      # 2426 鼎元
      # 2368 金像電
      # 3081 聯亞
      #
      # 不修改任何 Data/*
      # 不 Commit
      # 不 Push
      # ============================================================

      - name: Run FinMind API diagnostic
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}

        run: |

          set -e

          python - <<'PY'

          import os
          import sys
          import json
          import requests
          import pandas as pd

          from datetime import date, timedelta


          # ========================================================
          # 基本設定
          # ========================================================

          API_URL = (
              "https://api.finmindtrade.com/api/v4/data"
          )

          STOCKS = {

              "2337": "旺宏",
              "2426": "鼎元",
              "2368": "金像電",
              "3081": "聯亞",

          }

          END_DATE = date.today()

          START_DATE = (
              END_DATE -
              timedelta(days=45)
          )

          START_DATE_STR = (
              START_DATE.isoformat()
          )

          END_DATE_STR = (
              END_DATE.isoformat()
          )


          TOKEN = (
              os.environ.get(
                  "FINMIND_TOKEN",
                  ""
              )
              .strip()
          )


          HEADERS = {}

          if TOKEN:

              HEADERS = {
                  "Authorization":
                      f"Bearer {TOKEN}"
              }


          print("")
          print("=" * 72)
          print("FinMind API Diagnostic")
          print("=" * 72)

          print(
              f"測試日期範圍："
              f"{START_DATE_STR} ~ {END_DATE_STR}"
          )

          print(
              "Token："
              + (
                  "已設定"
                  if TOKEN
                  else "未設定（使用匿名 API）"
              )
          )

          print("")
          print(
              "固定測試股票："
          )

          for code, name in STOCKS.items():

              print(
                  f"  {code} {name}"
              )

          print("")
          print("=" * 72)


          # ========================================================
          # HTTP GET
          # ========================================================

          session = requests.Session()

          session.headers.update({
              "User-Agent":
                  "tw-stock-ai-scanner-finmind-test/1.0"
          })


          def fetch_dataset(
              dataset,
              data_id=None,
              start_date=START_DATE_STR,
              end_date=END_DATE_STR,
          ):

              params = {

                  "dataset":
                      dataset,

                  "start_date":
                      start_date,

                  "end_date":
                      end_date,

              }


              if data_id:

                  params["data_id"] = data_id


              try:

                  response = session.get(

                      API_URL,

                      params=params,

                      headers=HEADERS,

                      timeout=30,

                  )

              except Exception as exc:

                  return {

                      "ok": False,

                      "status": None,

                      "error":
                          f"HTTP exception: {exc}",

                      "data": None,

                  }


              try:

                  payload = (
                      response.json()
                  )

              except Exception:

                  payload = None


              if response.status_code != 200:

                  return {

                      "ok": False,

                      "status":
                          response.status_code,

                      "error":
                          (
                              "HTTP "
                              f"{response.status_code}"
                          ),

                      "data":
                          payload,

                  }


              if not isinstance(
                  payload,
                  dict
              ):

                  return {

                      "ok": False,

                      "status":
                          response.status_code,

                      "error":
                          "JSON root 不是 object",

                      "data":
                          payload,

                  }


              return {

                  "ok": True,

                  "status":
                      response.status_code,

                  "error":
                      None,

                  "data":
                      payload,

              }


          # ========================================================
          # 顯示資料集測試結果
          # ========================================================

          def print_result(
              title,
              result
          ):

              print("")
              print("-" * 72)
              print(title)
              print("-" * 72)


              if not result["ok"]:

                  print(
                      "❌ API FAILED"
                  )

                  print(
                      f"HTTP：{result['status']}"
                  )

                  print(
                      f"錯誤：{result['error']}"
                  )

                  if result["data"] is not None:

                      print(
                          "API Response:"
                      )

                      print(
                          json.dumps(
                              result["data"],
                              ensure_ascii=False,
                              indent=2
                          )[:5000]
                      )

                  return


              payload = result["data"]


              print(
                  "✓ HTTP 200"
              )


              msg = payload.get(
                  "msg"
              )

              if msg is not None:

                  print(
                      f"API msg：{msg}"
                  )


              status = payload.get(
                  "status"
              )

              if status is not None:

                  print(
                      f"API status：{status}"
                  )


              data = payload.get(
                  "data"
              )


              if isinstance(
                  data,
                  list
              ):

                  print(
                      f"records：{len(data)}"
                  )


                  if data:

                      first = data[0]

                      if isinstance(
                          first,
                          dict
                      ):

                          print(
                              "欄位："
                              + ", ".join(
                                  first.keys()
                              )
                          )


                          print(
                              "第一筆："
                          )

                          print(
                              json.dumps(
                                  first,
                                  ensure_ascii=False
                              )
                          )


              elif data is None:

                  print(
                      "data：None"
                  )

              else:

                  print(
                      "data type："
                      + type(data).__name__
                  )


          # ========================================================
          # 5. Dataset Availability
          # ========================================================

          DATASETS = [

              "TaiwanStockPrice",

              "TaiwanStockDayTrading",

              "TaiwanStockInstitutionalInvestorsBuySell",

              "TaiwanStockMarginPurchaseShortSale",

          ]


          print("")
          print("=" * 72)
          print("第一階段：資料集 API 測試")
          print("=" * 72)


          results = {}


          for dataset in DATASETS:

              code = "2337"

              result = fetch_dataset(
                  dataset=dataset,
                  data_id=code,
              )

              results[
                  dataset
              ] = result

              print_result(
                  f"{dataset} | {code} 旺宏",
                  result
              )


          # ========================================================
          # 6. Price Test - 四檔
          # ========================================================

          print("")
          print("=" * 72)
          print("第二階段：TaiwanStockPrice 四檔測試")
          print("=" * 72)


          price_data = {}


          for code, name in STOCKS.items():

              result = fetch_dataset(

                  dataset=
                      "TaiwanStockPrice",

                  data_id=
                      code,

              )


              print_result(

                  f"Price | {code} {name}",

                  result

              )


              if result["ok"]:

                  data = (
                      result["data"]
                      .get("data", [])
                  )

                  price_data[code] = data


          # ========================================================
          # 7. Technical Indicator Verification
          #
          # 這裡只驗證「原始價格資料足不足夠」
          #
          # 正式五項核心尚未寫入正式系統。
          # ========================================================

          print("")
          print("=" * 72)
          print("第三階段：五項核心原始資料驗證")
          print("=" * 72)


          def normalize_price_dataframe(
              rows
          ):

              if not rows:

                  return None


              df = pd.DataFrame(
                  rows
              )


              required = {

                  "date",
                  "close",
                  "Trading_Volume",

              }


              missing = (
                  required
                  -
                  set(df.columns)
              )


              if missing:

                  print(
                      "❌ 缺少價格欄位："
                      + ", ".join(
                          sorted(missing)
                      )
                  )

                  print(
                      "實際欄位："
                      + ", ".join(
                          df.columns
                      )
                  )

                  return None


              df["date"] = pd.to_datetime(
                  df["date"],
                  errors="coerce"
              )


              df["close"] = pd.to_numeric(
                  df["close"],
                  errors="coerce"
              )


              df["Trading_Volume"] = (
                  pd.to_numeric(
                      df["Trading_Volume"],
                      errors="coerce"
                  )
              )


              df = (
                  df
                  .dropna(
                      subset=[
                          "date",
                          "close",
                          "Trading_Volume"
                      ]
                  )
                  .sort_values("date")
                  .drop_duplicates(
                      subset=["date"],
                      keep="last"
                  )
                  .reset_index(drop=True)
              )


              return df


          def verify_five_core(
              code,
              name,
              rows
          ):

              print("")
              print(
                  f"### {code} {name}"
              )


              df = normalize_price_dataframe(
                  rows
              )


              if df is None:

                  print(
                      "❌ 無法建立價格 DataFrame"
                  )

                  return False


              print(
                  f"有效交易日：{len(df)}"
              )


              if len(df) < 30:

                  print(
                      "❌ 歷史資料不足以穩定計算 "
                      "MA20 / RSI / KD / MACD"
                  )

                  return False


              # ----------------------------------------------------
              # 五項核心所需原始資料
              # ----------------------------------------------------

              # 5 日均量

              df["volume_ma5"] = (
                  df["Trading_Volume"]
                  .rolling(5)
                  .mean()
              )


              # 20 MA

              df["ma20"] = (
                  df["close"]
                  .rolling(20)
                  .mean()
              )


              # MA20 向上
              #
              # 定義：
              # 今日 MA20 > 前一交易日 MA20

              df["ma20_up"] = (
                  df["ma20"]
                  >
                  df["ma20"].shift(1)
              )


              # ----------------------------------------------------
              # RSI 14
              # ----------------------------------------------------

              delta = (
                  df["close"]
                  .diff()
              )


              gain = (
                  delta
                  .clip(lower=0)
              )


              loss = (
                  -delta
                  .clip(upper=0)
              )


              avg_gain = (
                  gain
                  .ewm(
                      alpha=1 / 14,
                      adjust=False,
                      min_periods=14
                  )
                  .mean()
              )


              avg_loss = (
                  loss
                  .ewm(
                      alpha=1 / 14,
                      adjust=False,
                      min_periods=14
                  )
                  .mean()
              )


              rs = (
                  avg_gain /
                  avg_loss.replace(
                      0,
                      float("nan")
                  )
              )


              df["rsi"] = (
                  100 -
                  (
                      100 /
                      (1 + rs)
                  )
              )


              # ----------------------------------------------------
              # KD
              #
              # RSV 9日
              # K/D 使用 3/3 平滑
              # ----------------------------------------------------

              low9 = (
                  df["close"]
                  .rolling(9)
                  .min()
              )


              high9 = (
                  df["close"]
                  .rolling(9)
                  .max()
              )


              denominator = (
                  high9 - low9
              )


              rsv = (

                  (
                      df["close"]
                      - low9
                  )
                  /
                  denominator.replace(
                      0,
                      float("nan")
                  )
                  *
                  100

              )


              k_values = []

              d_values = []

              previous_k = 50.0
              previous_d = 50.0


              for value in rsv:

                  if pd.isna(value):

                      k_values.append(
                          float("nan")
                      )

                      d_values.append(
                          float("nan")
                      )

                      continue


                  current_k = (
                      previous_k * 2 / 3
                      +
                      float(value) / 3
                  )


                  current_d = (
                      previous_d * 2 / 3
                      +
                      current_k / 3
                  )


                  k_values.append(
                      current_k
                  )

                  d_values.append(
                      current_d
                  )


                  previous_k = (
                      current_k
                  )

                  previous_d = (
                      current_d
                  )


              df["kd_k"] = k_values
              df["kd_d"] = d_values


              # KD 黃金交叉：
              #
              # 今日 K > D
              # 且昨日 K <= D

              df["kd_golden_cross"] = (

                  (df["kd_k"] > df["kd_d"])

                  &

                  (
                      df["kd_k"].shift(1)
                      <=
                      df["kd_d"].shift(1)
                  )

              )


              # ----------------------------------------------------
              # MACD
              #
              # EMA12 - EMA26
              # Signal = EMA9
              # ----------------------------------------------------

              ema12 = (
                  df["close"]
                  .ewm(
                      span=12,
                      adjust=False
                  )
                  .mean()
              )


              ema26 = (
                  df["close"]
                  .ewm(
                      span=26,
                      adjust=False
                  )
                  .mean()
              )


              df["macd"] = (
                  ema12 -
                  ema26
              )


              df["macd_signal"] = (
                  df["macd"]
                  .ewm(
                      span=9,
                      adjust=False
                  )
                  .mean()
              )


              # MACD 黃金交叉：
              #
              # 今日 MACD > Signal
              # 且昨日 MACD <= Signal

              df["macd_golden_cross"] = (

                  (
                      df["macd"]
                      >
                      df["macd_signal"]
                  )

                  &

                  (
                      df["macd"].shift(1)
                      <=
                      df["macd_signal"].shift(1)
                  )

              )


              # ----------------------------------------------------
              # 五項條件
              # ----------------------------------------------------

              df["core_1_macd"] = (
                  df["macd_golden_cross"]
              )


              df["core_2_rsi"] = (
                  df["rsi"] > 50
              )


              df["core_3_kd"] = (
                  df["kd_golden_cross"]
              )


              df["core_4_volume"] = (

                  df["Trading_Volume"]
                  >
                  (
                      df["volume_ma5"]
                      * 1.5
                  )

              )


              df["core_5_ma20"] = (

                  (
                      df["close"]
                      >
                      df["ma20"]
                  )

                  &

                  df["ma20_up"]

              )


              latest = (
                  df.iloc[-1]
              )


              print(
                  f"最新交易日："
                  f"{latest['date'].date()}"
              )


              print(
                  f"收盤價："
                  f"{latest['close']:.2f}"
              )


              print(
                  f"成交量："
                  f"{latest['Trading_Volume']:,.0f}"
              )


              print(
                  f"MA5量："
                  f"{latest['volume_ma5']:,.2f}"
                  if pd.notna(
                      latest["volume_ma5"]
                  )
                  else "MA5量：--"
              )


              print(
                  f"MA20："
                  f"{latest['ma20']:.2f}"
                  if pd.notna(
                      latest["ma20"]
                  )
                  else "MA20：--"
              )


              print(
                  f"RSI："
                  f"{latest['rsi']:.2f}"
                  if pd.notna(
                      latest["rsi"]
                  )
                  else "RSI：--"
              )


              print(
                  f"KD K："
                  f"{latest['kd_k']:.2f}"
                  if pd.notna(
                      latest["kd_k"]
                  )
                  else "KD K：--"
              )


              print(
                  f"KD D："
                  f"{latest['kd_d']:.2f}"
                  if pd.notna(
                      latest["kd_d"]
                  )
                  else "KD D：--"
              )


              print(
                  f"MACD："
                  f"{latest['macd']:.4f}"
              )


              print(
                  f"Signal："
                  f"{latest['macd_signal']:.4f}"
              )


              print("")
              print(
                  "五項核心條件："
              )


              conditions = [

                  (
                      "1. MACD 黃金交叉",
                      bool(
                          latest[
                              "core_1_macd"
                          ]
                      )
                  ),

                  (
                      "2. RSI > 50",
                      bool(
                          latest[
                              "core_2_rsi"
                          ]
                      )
                  ),

                  (
                      "3. KD 黃金交叉",
                      bool(
                          latest[
                              "core_3_kd"
                          ]
                      )
                  ),

                  (
                      "4. 成交量 > MA5 × 1.5",
                      bool(
                          latest[
                              "core_4_volume"
                          ]
                      )
                  ),

                  (
                      "5. 股價 > MA20 "
                      "且 MA20 向上",
                      bool(
                          latest[
                              "core_5_ma20"
                          ]
                      )
                  ),

              ]


              passed = 0


              for label, value in conditions:

                  mark = (
                      "✓ PASS"
                      if value
                      else "✗ FAIL"
                  )


                  print(
                      f"  {mark} | {label}"
                  )


                  if value:

                      passed += 1


              print("")
              print(
                  f"核心通過："
                  f"{passed}/5"
              )


              qualified = (
                  passed == 5
              )


              print(
                  "五項全部符合："
                  + (
                      "YES"
                      if qualified
                      else "NO"
                  )
              )


              return True


          for code, name in STOCKS.items():

              verify_five_core(

                  code,

                  name,

                  price_data.get(
                      code,
                      []
                  )

              )


          # ========================================================
          # 8. Chip Data Test
          # ========================================================

          print("")
          print("=" * 72)
          print("第四階段：籌碼資料四檔測試")
          print("=" * 72)


          CHIP_DATASETS = [

              (
                  "TaiwanStockInstitutionalInvestorsBuySell",
                  "三大法人"
              ),

              (
                  "TaiwanStockMarginPurchaseShortSale",
                  "融資融券"
              ),

              (
                  "TaiwanStockDayTrading",
                  "當沖"
              ),

          ]


          for dataset, label in CHIP_DATASETS:

              print("")
              print(
                  f"### {label}"
              )


              for code, name in STOCKS.items():

                  result = fetch_dataset(

                      dataset=
                          dataset,

                      data_id=
                          code,

                  )


                  if not result["ok"]:

                      print(
                          f"❌ {code} {name} "
                          f"| {result['error']}"
                      )

                      continue


                  data = (
                      result["data"]
                      .get(
                          "data",
                          []
                      )
                  )


                  print(
                      f"✓ {code} {name} "
                      f"| records={len(data)}"
                  )


                  if data:

                      first = data[0]

                      if isinstance(
                          first,
                          dict
                      ):

                          print(
                              "  欄位："
                              +
                              ", ".join(
                                  first.keys()
                              )
                          )


          # ========================================================
          # 9. Broker Daily Report
          #
          # 這是特別測試：
          #
          # TaiwanStockTradingDailyReport
          #
          # 用來確認目前帳號是否有權限。
          # ========================================================

          print("")
          print("=" * 72)
          print(
              "第五階段：全台券商分點權限測試"
          )
          print("=" * 72)


          broker_dataset = (
              "TaiwanStockTradingDailyReport"
          )


          broker_result = fetch_dataset(

              dataset=
                  broker_dataset,

              data_id=
                  "2337",

          )


          print_result(

              (
                  "Broker Daily Report | "
                  "2337 旺宏"
              ),

              broker_result

          )


          if broker_result["ok"]:

              broker_data = (
                  broker_result["data"]
                  .get(
                      "data",
                      []
                  )
              )


              print("")


              if broker_data:

                  print(
                      "✓ 券商分點資料可取得"
                  )

                  print(
                      f"records："
                      f"{len(broker_data)}"
                  )


              else:

                  print(
                      "⚠ API HTTP 成功，"
                      "但沒有回傳資料"
                  )


          else:

              print("")
              print(
                  "⚠ 券商分點資料目前無法以"
                  "目前 API 權限取得。"
              )

              print(
                  "這不會影響五項技術核心測試。"
              )


          # ========================================================
          # 10. Multi-period Chip Calculation Test
          #
          # 驗證我們能否由每日資料累計：
          #
          # 1D / 5D / 10D / 20D
          # ========================================================

          print("")
          print("=" * 72)
          print(
              "第六階段：籌碼 1/5/10/20D 累計能力測試"
          )
          print("=" * 72)


          institutional_result = fetch_dataset(

              dataset=
                  "TaiwanStockInstitutionalInvestorsBuySell",

              data_id=
                  "2337",

              start_date=(
                  END_DATE -
                  timedelta(days=35)
              ).isoformat(),

              end_date=
                  END_DATE_STR,

          )


          if institutional_result["ok"]:

              rows = (
                  institutional_result["data"]
                  .get(
                      "data",
                      []
                  )
              )


              print(
                  f"2337 三大法人原始 records："
                  f"{len(rows)}"
              )


              if rows:

                  df = pd.DataFrame(
                      rows
                  )


                  print(
                      "原始欄位："
                      +
                      ", ".join(
                          df.columns
                      )
                  )


                  print("")
                  print(
                      "資料可進一步累計"
                      " 1D / 5D / 10D / 20D。"
                  )


                  print(
                      "注意：正式實作前仍需確認"
                      "買賣超欄位的正確定義。"
                  )

          else:

              print(
                  "❌ 三大法人 API 測試失敗"
              )


          # ========================================================
          # 11. Final Summary
          # ========================================================

          print("")
          print("=" * 72)
          print("FinMind API Diagnostic Summary")
          print("=" * 72)


          print("")
          print(
              "固定五項核心："
          )

          print(
              "  1. MACD 黃金交叉"
          )

          print(
              "  2. RSI > 50"
          )

          print(
              "  3. KD 黃金交叉（K 向上突破 D）"
          )

          print(
              "  4. 成交量 > MA5 × 1.5"
          )

          print(
              "  5. 股價 > MA20 且 MA20 向上"
          )


          print("")
          print(
              "籌碼面："
          )

          print(
              "  三大法人 1D / 5D / 10D / 20D"
          )

          print(
              "  全台券商 1D / 5D / 10D / 20D"
          )

          print(
              "  資券 / 當沖相關資料"
          )


          print("")
          print(
              "⚠ 本 Workflow 是診斷工具。"
          )

          print(
