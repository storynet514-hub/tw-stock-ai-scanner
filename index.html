<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080c14">
<title>台股 AI 選股・零股定投</title>

<style>
:root {
  --bg: #080c14;
  --panel: #111827;
  --panel-2: #0d1422;
  --border: #243047;
  --text: #e5e7eb;
  --sub: #94a3b8;
  --white: #ffffff;
  --blue: #38bdf8;

  /* 台股價格顏色 */
  --up: #ef4444;
  --down: #22c55e;

  /* 強弱燈號 */
  --strength-strong: #ef4444;
  --strength-neutral: #ffffff;
  --strength-weak: #22c55e;

  --gray: #64748b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(56, 189, 248, 0.06),
      transparent 32%
    ),
    radial-gradient(
      circle at top left,
      rgba(168, 85, 247, 0.05),
      transparent 30%
    ),
    var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: default;
  opacity: .55;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 12px 44px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  margin-bottom: 15px;
}

.brand {
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
}

.market-title {
  margin-top: 5px;
  color: var(--white);
  font-size: 25px;
  line-height: 1.2;
  font-weight: 850;
}

.market-subtitle {
  margin-top: 4px;
  color: var(--sub);
  font-size: 12px;
}

.market-status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(17,24,39,.82);
}

.market-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text);
  font-size: 12px;
  font-weight: 750;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.status-open .status-dot {
  background: var(--up);
  box-shadow: 0 0 8px rgba(239,68,68,.45);
}

.status-closed .status-dot {
  background: var(--down);
}

.status-other .status-dot {
  background: var(--gray);
}

.latest-date {
  color: var(--sub);
  font-size: 11px;
  white-space: nowrap;
}

/* =========================================================
   SUMMARY
========================================================= */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 9px;
  margin-bottom: 14px;
}

.summary-panel {
  min-height: 104px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background:
    linear-gradient(
      145deg,
      rgba(17,24,39,.98),
      rgba(13,20,34,.98)
    );
}

.summary-label {
  color: var(--sub);
  font-size: 11px;
  font-weight: 700;
}

.summary-value {
  margin-top: 7px;
  color: var(--white);
  font-size: 23px;
  line-height: 1.15;
  font-weight: 850;
}

.summary-value.small {
  font-size: 20px;
}

.summary-value.holdings-empty {
  font-size: 16px;
  color: var(--sub);
}

.summary-note {
  margin-top: 6px;
  color: var(--sub);
  font-size: 10px;
  line-height: 1.4;
}

.index-change {
  display: flex;
  gap: 7px;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 750;
}

.sentiment-line {
  display: flex;
  align-items: center;
  gap: 7px;
}

.sentiment-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.sentiment-bullish .sentiment-dot {
  background: var(--up);
}

.sentiment-neutral .sentiment-dot {
  background: var(--strength-neutral);
  border: 1px solid #64748b;
}

.sentiment-bearish .sentiment-dot {
  background: var(--down);
}

/* =========================================================
   SEARCH
========================================================= */

.search-section {
  margin-bottom: 13px;
}

.search-title {
  margin-bottom: 7px;
  color: var(--white);
  font-size: 12px;
  font-weight: 800;
}

.search-row {
  display: flex;
  gap: 7px;
}

.search-input {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  background: var(--panel-2);
  color: var(--white);
  font-size: 13px;
}

.search-input:focus {
  border-color: var(--blue);
}

.search-input::placeholder {
  color: #64748b;
}

.search-button {
  height: 40px;
  padding: 0 15px;
  border: 1px solid rgba(56,189,248,.45);
  border-radius: 9px;
  background: rgba(56,189,248,.1);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
}

.search-results {
  display: none;
  margin-top: 7px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
}

.search-results.show {
  display: block;
}

.search-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  text-align: left;
}

.search-item:last-child {
  border-bottom: 0;
}

.search-main {
  min-width: 0;
}

.search-name {
  color: var(--white);
  font-size: 14px;
  font-weight: 800;
}

.search-symbol {
  margin-top: 2px;
  color: var(--sub);
  font-size: 10px;
}

.search-action {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel-2);
  color: var(--blue);
  font-size: 10px;
  font-weight: 750;
}

/* =========================================================
   TABS
========================================================= */

.tabs {
  display: grid;
  grid-template-columns: repeat(5,minmax(0,1fr));
  gap: 5px;
  margin-bottom: 15px;
}

.tab {
  min-width: 0;
  padding: 9px 4px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--sub);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.tab.active {
  border-color: var(--blue);
  background: rgba(56,189,248,.1);
  color: var(--blue);
}

/* =========================================================
   SECTION
========================================================= */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 0 2px 9px;
}

.section-title {
  color: var(--white);
  font-size: 17px;
  font-weight: 850;
}

.section-count {
  color: var(--sub);
  font-size: 10px;
}

/* =========================================================
   STOCK CARD
========================================================= */

.stock-card {
  width: 100%;
  margin-bottom: 10px;
  padding: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background:
    linear-gradient(
      145deg,
      rgba(17,24,39,.98),
      rgba(13,20,34,.98)
    );
}

.stock-name {
  color: var(--white);
  font-size: 21px;
  line-height: 1.2;
  font-weight: 900;
}

.stock-symbol {
  margin-top: 3px;
  color: var(--sub);
  font-size: 12px;
  font-weight: 650;
}

.price-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 14px;
}

.price {
  color: var(--white);
  font-size: 24px;
  font-weight: 900;
}

.change {
  font-size: 13px;
  font-weight: 800;
}

.text-up {
  color: var(--up) !important;
}

.text-down {
  color: var(--down) !important;
}

.text-flat {
  color: var(--sub) !important;
}

/* =========================================================
   STRENGTH
========================================================= */

.ai-summary {
  display: grid;
  grid-template-columns: minmax(0,.8fr) minmax(0,1.2fr);
  gap: 8px;
  margin-top: 12px;
}

.ai-cell {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
}

.ai-label {
  color: var(--sub);
  font-size: 10px;
  font-weight: 700;
}

.ai-value {
  margin-top: 4px;
  color: var(--white);
  font-size: 12px;
  line-height: 1.35;
  font-weight: 800;
}

.strength {
  display: inline-flex;
  align-items: center;
  gap: 5px;
}

.strength-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  display: inline-block;
}

.strength-strong {
  color: var(--strength-strong);
}

.strength-strong .strength-dot {
  background: var(--strength-strong);
}

.strength-neutral {
  color: var(--strength-neutral);
}

.strength-neutral .strength-dot {
  background: var(--strength-neutral);
  border: 1px solid #64748b;
}

.strength-weak {
  color: var(--strength-weak);
}

.strength-weak .strength-dot {
  background: var(--strength-weak);
}

.strength-unavailable {
  color: var(--sub);
}

/* =========================================================
   MY LIST
========================================================= */

.my-list-holding {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px dashed var(--border);
}

.holding-grid {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 8px;
}

.holding-input-group label {
  display: block;
  margin-bottom: 4px;
  color: var(--sub);
  font-size: 10px;
}

.holding-input {
  width: 100%;
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  background: var(--panel-2);
  color: var(--white);
  font-size: 12px;
  text-align: right;
}

.holding-result {
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 7px;
  margin-top: 8px;
}

.holding-result-cell {
  padding: 8px 9px;
  border-radius: 7px;
  background: var(--panel-2);
}

.holding-result-label {
  color: var(--sub);
  font-size: 9px;
}

.holding-result-value {
  margin-top: 3px;
  color: var(--white);
  font-size: 12px;
  font-weight: 850;
}

.remove-button {
  width: 100%;
  margin-top: 8px;
  padding: 7px;
  border: 1px solid rgba(239,68,68,.3);
  border-radius: 7px;
  background: rgba(239,68,68,.05);
  color: #fca5a5;
  font-size: 10px;
}

/* =========================================================
   STATE
========================================================= */

.state-box {
  padding: 32px 15px;
  border: 1px dashed var(--border);
  border-radius: 11px;
  background: rgba(17,24,39,.55);
  text-align: center;
}

.state-title {
  color: var(--white);
  font-size: 14px;
  font-weight: 850;
}

.state-text {
  margin-top: 6px;
  color: var(--sub);
  font-size: 11px;
  line-height: 1.6;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
  margin-top: 25px;
  color: #475569;
  font-size: 9px;
  text-align: center;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width:430px) {

  .app {
    padding: 14px 9px 35px;
  }

  .summary-value {
    font-size: 21px;
  }

  .stock-name {
    font-size: 20px;
  }

  .price {
    font-size: 22px;
  }

  .ai-summary {
    grid-template-columns: 1fr;
  }

  .tab {
    font-size: 9px;
  }
}
</style>
</head>

<body>

<script>
"use strict";

const UI_DATA_URL = "Data/ui_data.json";
const STORAGE_KEY = "tw_stock_ai_my_list_v2";

let uiData = null;
let currentTab = "today";
let myList = loadMyList();


/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


function normalizeSymbol(value) {
  let text = String(value ?? "")
    .trim()
    .toUpperCase();

  for (const suffix of [
    ".TW",
    ".TWO",
    ".TSE",
    ".OTC",
    ".TWSE",
    ".TPEX"
  ]) {
    if (text.endsWith(suffix)) {
      text = text.slice(
        0,
        -suffix.length
      );
      break;
    }
  }

  return text;
}


function toNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : null;
  }

  const n = Number(
    String(value)
      .replace(/,/g,"")
      .replace(/%/g,"")
      .trim()
  );

  return Number.isFinite(n)
    ? n
    : null;
}


function formatNumber(
  value,
  digits = 2
) {

  const n = toNumber(value);

  if (n === null) {
    return "—";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatPrice(value) {

  const n = toNumber(value);

  if (n === null) {
    return "—";
  }

  let digits = 2;

  if (Math.abs(n) >= 1000) {
    digits = 0;
  } else if (Math.abs(n) >= 100) {
    digits = 1;
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


/* =========================================================
   STRENGTH
   固定：
   🔴 強勢
   ⚪ 中性
   🟢 弱勢
========================================================= */

function strengthInfo(value) {

  const strength = String(
    value || "中性"
  ).trim();

  if (strength === "強勢") {
    return {
      text: "強勢",
      className: "strength-strong"
    };
  }

  if (strength === "弱勢") {
    return {
      text: "弱勢",
      className: "strength-weak"
    };
  }

  return {
    text: "中性",
    className: "strength-neutral"
  };
}


/* =========================================================
   PRICE COLOR
   台股慣例：
   上漲紅
   下跌綠
========================================================= */

function changeClass(value) {

  const n = toNumber(value);

  if (n === null || n === 0) {
    return "text-flat";
  }

  return n > 0
    ? "text-up"
    : "text-down";
}


function formatChange(value) {

  const n = toNumber(value);

  if (n === null) {
    return "—";
  }

  const sign = n > 0
    ? "+"
    : "";

  return `${sign}${formatNumber(n,2)}%`;
}


/* =========================================================
   MY LIST
========================================================= */

function loadMyList() {

  try {

    const data = JSON.parse(
      localStorage.getItem(
        STORAGE_KEY
      ) || "[]"
    );

    return Array.isArray(data)
      ? data
      : [];

  } catch {
    return [];
  }
}


function saveMyList() {

  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify(myList)
  );
}


function isInMyList(symbol) {

  const normalized =
    normalizeSymbol(symbol);

  return myList.some(
    item =>
      normalizeSymbol(item.symbol)
      === normalized
  );
}


function addToMyList(symbol) {

  const normalized =
    normalizeSymbol(symbol);

  if (!normalized) {
    return;
  }

  if (!isInMyList(normalized)) {

    myList.push({
      symbol: normalized,
      shares: 0,
      average_cost: 0
    });

    saveMyList();
  }

  renderSearchResults();
  render();
}


function removeFromMyList(symbol) {

  const normalized =
    normalizeSymbol(symbol);

  myList =
    myList.filter(
      item =>
        normalizeSymbol(item.symbol)
        !== normalized
    );

  saveMyList();
  render();
}


/* =========================================================
   HOLDING RECOMMENDATION
========================================================= */

function holdingRecommendation(
  stock,
  shares,
  averageCost
) {

  const price = toNumber(
    stock.price
  );

  if (
    price === null ||
    shares <= 0 ||
    averageCost <= 0
  ) {
    return stock.recommendation
      || "續抱觀察";
  }

  const roi =
    (
      (price - averageCost)
      / averageCost
    ) * 100;

  const strength =
    stock.strength;

  if (
    roi >= 20 ||
    roi <= -20
  ) {
    return "考慮減碼";
  }

  if (
    strength === "強勢" &&
    roi < 10
  ) {
    return "偏多，可分批加碼";
  }

  if (
    strength === "強勢" &&
    roi >= 10
  ) {
    return "持有觀察，不追價";
  }

  if (
    strength === "弱勢"
  ) {
    return "暫停加碼";
  }

  return "持有觀察，不追價";
}


/* =========================================================
   SEARCH
========================================================= */

function searchStocks(query) {

  const q = String(query || "")
    .trim()
    .toUpperCase();

  if (!q || !uiData) {
    return [];
  }

  const stocks =
    Object.values(
      uiData.stocks || {}
    );

  return stocks
    .filter(stock => {

      const symbol =
        normalizeSymbol(
          stock.symbol
        );

      const name =
        String(
          stock.name || ""
        ).toUpperCase();

      return (
        symbol.includes(q) ||
        name.includes(q)
      );
    })
    .slice(0,20);
}


function renderSearchResults() {

  const box =
    document.getElementById(
      "searchResults"
    );

  const input =
    document.getElementById(
      "searchInput"
    );

  const query =
    input.value.trim();

  if (!query) {

    box.classList.remove("show");
    box.innerHTML = "";
    return;
  }

  const results =
    searchStocks(query);

  if (!results.length) {

    box.innerHTML = `
      <div class="search-item">
        <div class="search-main">
          <div class="search-name">
            找不到符合的股票
          </div>
        </div>
      </div>
    `;

    box.classList.add("show");
    return;
  }

  box.innerHTML =
    results.map(stock => {

      const symbol =
        normalizeSymbol(
          stock.symbol
        );

      const added =
        isInMyList(symbol);

      return `
        <div class="search-item">

          <div class="search-main">
            <div class="search-name">
              ${escapeHtml(stock.name)}
            </div>

            <div class="search-symbol">
              ${escapeHtml(symbol)}
            </div>
          </div>

          <button
            class="search-action"
            type="button"
            data-add="${escapeHtml(symbol)}"
            ${added ? "disabled" : ""}
          >
            ${added ? "已加入" : "＋加入我的清單"}
          </button>

        </div>
      `;

    }).join("");

  box.classList.add("show");

  box
    .querySelectorAll("[data-add]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          addToMyList(
            button.dataset.add
          );
        }
      );

    });
}


/* =========================================================
   CARD
========================================================= */

function renderCard(
  stock,
  options = {}
) {

  const strength =
    strengthInfo(
      stock.strength
    );

  const changeClassName =
    changeClass(
      stock.change_pct
    );

  const symbol =
    normalizeSymbol(
      stock.symbol
    );

  const isMyList =
    options.myList === true;

  let holdingHtml = "";

  if (isMyList) {

    const saved =
      myList.find(
        item =>
          normalizeSymbol(
            item.symbol
          ) === symbol
      ) || {
        shares: 0,
        average_cost: 0
      };

    const shares =
      toNumber(
        saved.shares
      ) || 0;

    const averageCost =
      toNumber(
        saved.average_cost
      ) || 0;

    const price =
      toNumber(
        stock.price
      );

    const marketValue =
      price !== null
        ? price * shares
        : 0;

    const costValue =
      averageCost * shares;

    const profit =
      marketValue - costValue;

    const roi =
      costValue > 0
        ? (profit / costValue) * 100
        : null;

    const recommendation =
      holdingRecommendation(
        stock,
        shares,
        averageCost
      );

    holdingHtml = `
      <div class="my-list-holding">

        <div class="holding-grid">

          <div class="holding-input-group">
            <label>持有股數</label>
            <input
              class="holding-input"
              type="number"
              min="0"
              step="1"
              value="${shares}"
              data-shares="${escapeHtml(symbol)}"
            >
          </div>

          <div class="holding-input-group">
            <label>平均成本</label>
            <input
              class="holding-input"
              type="number"
              min="0"
              step="0.01"
              value="${averageCost}"
              data-cost="${escapeHtml(symbol)}"
            >
          </div>

        </div>

        <div class="ai-summary">

          <div class="ai-cell">

            <div class="ai-label">
              持倉建議
            </div>

            <div class="ai-value">
              ${escapeHtml(recommendation)}
            </div>

          </div>

          <div class="ai-cell">

            <div class="ai-label">
              強弱
            </div>

            <div class="ai-value ${strength.className}">
              <span class="strength">
                <span class="strength-dot"></span>
                ${strength.text}
              </span>
            </div>

          </div>

        </div>

        <div class="holding-result">

          <div class="holding-result-cell">
            <div class="holding-result-label">
              市值
            </div>
            <div class="holding-result-value">
              ${formatNumber(marketValue,0)}
            </div>
          </div>

          <div class="holding-result-cell">
            <div class="holding-result-label">
              損益
            </div>
            <div class="holding-result-value ${changeClass(profit)}">
              ${profit >= 0 ? "+" : ""}
              ${formatNumber(profit,0)}
            </div>
          </div>

          <div class="holding-result-cell">
            <div class="holding-result-label">
              報酬率
            </div>
            <div class="holding-result-value ${changeClass(roi)}">
              ${roi === null ? "—" : formatChange(roi)}
            </div>
          </div>

          <div class="holding-result-cell">
            <div class="holding-result-label">
              平均成本
            </div>
            <div class="holding-result-value">
              ${formatPrice(averageCost)}
            </div>
          </div>

        </div>

        <button
          class="remove-button"
          type="button"
          data-remove="${escapeHtml(symbol)}"
        >
          移除我的清單
        </button>

      </div>
    `;
  }

  return `
    <article class="stock-card">

      <div class="stock-name">
        ${escapeHtml(stock.name)}
      </div>

      <div class="stock-symbol">
        ${escapeHtml(symbol)}
      </div>

      <div class="price-row">

        <span class="price">
          ${formatPrice(stock.price)}
        </span>

        <span class="change ${changeClassName}">
          ${formatChange(stock.change_pct)}
        </span>

      </div>

      <div class="ai-summary">

        <div class="ai-cell">

          <div class="ai-label">
            強弱
          </div>

          <div class="ai-value ${strength.className}">

            <span class="strength">
              <span class="strength-dot"></span>
              ${strength.text}
            </span>

          </div>

        </div>

        <div class="ai-cell">

          <div class="ai-label">
            建議
          </div>

          <div class="ai-value">
            ${escapeHtml(
              isMyList
                ? holdingRecommendation(
                    stock,
                    0,
                    0
                  )
                : stock.recommendation
            )}
          </div>

        </div>

      </div>

      ${holdingHtml}

    </article>
  `;
}


/* =========================================================
   TAB DATA
========================================================= */

function getTabSymbols() {

  const tabs =
    uiData.tabs || {};

  if (currentTab === "today") {
    return tabs.today || [];
  }

  if (currentTab === "top10") {
    return tabs.top10 || [];
  }

  if (currentTab === "etf") {
    return tabs.etf || [];
  }

  if (currentTab === "bond") {
    return tabs.bond || [];
  }

  if (currentTab === "mylist") {

    return myList
      .map(item =>
        normalizeSymbol(
          item.symbol
        )
      )
      .filter(Boolean);
  }

  return [];
}


/* =========================================================
   RENDER TAB
========================================================= */

function render() {

  if (!uiData) {
    return;
  }

  const content =
    document.getElementById(
      "content"
    );

  const symbols =
    getTabSymbols();

  const stocks =
    uiData.stocks || {};

  let title = "今日精選";

  if (currentTab === "top10") {
    title = "Top 10";
  }

  if (currentTab === "etf") {
    title = "ETF";
  }

  if (currentTab === "bond") {
    title = "債券";
  }

  if (currentTab === "mylist") {
    title = "我的清單";
  }

  if (
    currentTab === "mylist" &&
    symbols.length === 0
  ) {

    content.innerHTML = `
      <div class="section-header">
        <div class="section-title">
          ${title}
        </div>
        <div class="section-count">
          0 檔
        </div>
      </div>

      <div class="state-box">
        <div class="state-title">
          尚未建立我的清單
        </div>

        <div class="state-text">
          使用上方搜尋功能，以股票名稱或代號加入。
        </div>
      </div>
    `;

    updateTabs();
    updatePortfolio();
    return;
  }

  const cards =
    symbols
      .map(symbol => stocks[symbol])
      .filter(Boolean)
      .map(stock =>
        renderCard(
          stock,
          {
            myList:
              currentTab === "mylist"
          }
        )
      )
      .join("");

  content.innerHTML = `
    <div class="section-header">

      <div class="section-title">
        ${title}
      </div>

      <div class="section-count">
        ${symbols.length} 檔
      </div>

    </div>

    ${
      cards ||
      `
      <div class="state-box">
        <div class="state-title">
          目前沒有符合標的
        </div>
      </div>
      `
    }
  `;

  bindHoldingInputs();
  updateTabs();
  updatePortfolio();
}


/* =========================================================
   TABS
========================================================= */

function updateTabs() {

  document
    .querySelectorAll(".tab")
    .forEach(tab => {

      tab.classList.toggle(
        "active",
        tab.dataset.tab === currentTab
      );

    });
}


/* =========================================================
   HOLDING INPUTS
========================================================= */

function bindHoldingInputs() {

  document
    .querySelectorAll("[data-shares]")
    .forEach(input => {

      input.addEventListener(
        "change",
        () => {

          const symbol =
            normalizeSymbol(
              input.dataset.shares
            );

          const item =
            myList.find(
              x =>
                normalizeSymbol(
                  x.symbol
                ) === symbol
            );

          if (!item) {
            return;
          }

          item.shares =
            Math.max(
              0,
              Number(input.value || 0)
            );

          saveMyList();
          render();

        }
      );

    });


  document
    .querySelectorAll("[data-cost]")
    .forEach(input => {

      input.addEventListener(
        "change",
        () => {

          const symbol =
            normalizeSymbol(
              input.dataset.cost
            );

          const item =
            myList.find(
              x =>
                normalizeSymbol(
                  x.symbol
                ) === symbol
            );

          if (!item) {
            return;
          }

          item.average_cost =
            Math.max(
              0,
              Number(input.value || 0)
            );

          saveMyList();
          render();

        }
      );

    });


  document
    .querySelectorAll("[data-remove]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          removeFromMyList(
            button.dataset.remove
          );

        }
      );

    });
}


/* =========================================================
   PORTFOLIO
========================================================= */

function updatePortfolio() {

  const element =
    document.getElementById(
      "portfolioProfit"
    );

  if (!myList.length) {

    element.textContent =
      "尚未建立持倉";

    element.className =
      "summary-value holdings-empty";

    return;
  }

  let totalProfit = 0;
  let hasHolding = false;

  for (const item of myList) {

    const stock =
      uiData.stocks[
        normalizeSymbol(
          item.symbol
        )
      ];

    if (!stock) {
      continue;
    }

    const shares =
      toNumber(item.shares) || 0;

    const cost =
      toNumber(item.average_cost) || 0;

    const price =
      toNumber(stock.price);

    if (
      shares <= 0 ||
      cost <= 0 ||
      price === null
    ) {
      continue;
    }

    totalProfit +=
      (price - cost) * shares;

    hasHolding = true;
  }

  if (!hasHolding) {

    element.textContent =
      "尚未建立持倉";

    element.className =
      "summary-value holdings-empty";

    return;
  }

  element.textContent =
    `${totalProfit >= 0 ? "+" : ""}${formatNumber(totalProfit,0)} 元`;

  element.className =
    `summary-value ${
      changeClass(
        totalProfit
      )
    }`;
}


/* =========================================================
   HEADER
========================================================= */

function renderHeader() {

  const market =
    uiData.market || {};

  const summary =
    uiData.summary || {};

  const status =
    String(
      market.status || ""
    );

  const statusElement =
    document.getElementById(
      "marketStatus"
    );

  const statusText =
    document.getElementById(
      "marketStatusText"
    );

  statusElement.className =
    "market-status";

  if (
    status.includes("開市") ||
    status.includes("交易")
  ) {

    statusElement.classList.add(
      "status-open"
    );

    statusText.textContent =
      "🟢 今日開市";

  } else {

    statusElement.classList.add(
      "status-closed"
    );

    statusText.textContent =
      "🔴 非交易日";
  }

  document.getElementById(
    "latestDate"
  ).textContent =
    `最新交易日：${
      market.latest_trading_date || "—"
    }`;

  document.getElementById(
    "todayPickCount"
  ).textContent =
    formatNumber(
      summary.today_picks || 0,
      0
    );

  const index =
    market.index || {};

  const indexValueRaw =
    index.value ??
    index.close ??
    index.price ??
    index.index;

  const indexChangeRaw =
    index.change ??
    index.price_change;

  const indexPctRaw =
    index.change_pct ??
    index.change_percent ??
    index.pct_change;

  document.getElementById(
    "indexValue"
  ).textContent =
    formatNumber(
      indexValueRaw,
      2
    );

  const indexChangeElement =
    document.getElementById(
      "indexChange"
    );

  indexChangeElement.innerHTML = `
    <span class="${changeClass(indexChangeRaw)}">
      ${
        toNumber(indexChangeRaw) > 0
          ? "+"
          : ""
      }${formatNumber(indexChangeRaw,2)}
    </span>

    <span class="${changeClass(indexPctRaw)}">
      ${formatChange(indexPctRaw)}
    </span>
  `;

  renderSentiment(
    market.sentiment
  );
}


function renderSentiment(
  sentiment
) {

  const element =
    document.getElementById(
      "sentimentValue"
    );

  const note =
    document.getElementById(
      "sentimentNote"
    );

  let value =
    "資料不足";

  if (typeof sentiment === "string") {
    value = sentiment;
  }

  if (
    sentiment &&
    typeof sentiment === "object"
  ) {

    value =
      sentiment.level ||
      sentiment.status ||
      sentiment.label ||
      sentiment.result ||
      "資料不足";
  }

  let className =
    "sentiment-neutral";

  if (
    value.includes("偏多") ||
    value.includes("多頭") ||
    value.includes("看多")
  ) {
    className =
      "sentiment-bullish";
  }

  if (
    value.includes("偏弱") ||
    value.includes("空頭") ||
    value.includes("看空")
  ) {
    className =
      "sentiment-bearish";
  }

  element.className =
    `summary-value small sentiment-line ${className}`;

  element.innerHTML = `
    <span class="sentiment-dot"></span>
    <span>${escapeHtml(value)}</span>
  `;

  note.textContent =
    "市場風向";
}


/* =========================================================
   LOAD
========================================================= */

async function loadData() {

  try {

    const response =
      await fetch(
        `${UI_DATA_URL}?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (
      data.schema_version !==
      "UI-DATA-2.2"
    ) {
      throw new Error(
        "UI-DATA schema version 不符"
      );
    }

    if (
      !data.stocks ||
      typeof data.stocks !== "object"
    ) {
      throw new Error(
        "ui_data.stocks 無效"
      );
    }

    uiData = data;

    renderHeader();
    render();

  } catch (error) {

    console.error(
      "UI DATA LOAD ERROR",
      error
    );

    document.getElementById(
      "content"
    ).innerHTML = `
      <div class="state-box">
        <div class="state-title">
          資料載入失敗
        </div>

        <div class="state-text">
          ${escapeHtml(error.message)}
        </div>
      </div>
    `;
  }
}


/* =========================================================
   EVENTS
========================================================= */

document
  .getElementById("tabs")
  .addEventListener(
    "click",
    event => {

      const tab =
        event.target.closest(
          ".tab"
        );

      if (!tab) {
        return;
      }

      currentTab =
        tab.dataset.tab;

      render();
    }
  );


document
  .getElementById("searchButton")
  .addEventListener(
    "click",
    renderSearchResults
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "input",
    renderSearchResults
  );


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {
        renderSearchResults();
      }

    }
  );


loadData();

</script>
