<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>台股 AI 選股・零股定投・動態風控</title>

  <meta
    name="description"
    content="台股 AI 選股、短期核心訊號、零股定投與動態風控儀表板"
  >

  <style>
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --text: #17202a;
      --muted: #6b7280;
      --border: #e5e7eb;

      --green: #16a34a;
      --green-bg: #ecfdf3;

      --red: #dc2626;
      --red-bg: #fef2f2;

      --yellow: #d97706;
      --yellow-bg: #fffbeb;

      --blue: #2563eb;
      --blue-bg: #eff6ff;

      --purple: #7c3aed;
      --purple-bg: #f5f3ff;

      --shadow: 0 4px 18px rgba(0, 0, 0, 0.06);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    button,
    input {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
    }

    /* =====================================================
       Header
    ===================================================== */

    header {
      padding: 24px 0 12px;
    }

    .header-box {
      background: linear-gradient(
        135deg,
        #111827,
        #1f2937
      );

      color: #fff;
      border-radius: 24px;
      padding: 24px;
      box-shadow: var(--shadow);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .brand-title {
      margin: 0;

      font-size: clamp(22px, 4vw, 32px);
      font-weight: 800;

      letter-spacing: -0.5px;
    }

    .brand-subtitle {
      margin-top: 6px;
      color: #d1d5db;
      font-size: 14px;
    }

    .data-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 11px;
      border-radius: 999px;

      background: rgba(255,255,255,0.1);
      color: #e5e7eb;

      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      flex: 0 0 auto;
    }

    .status-dot.error {
      background: #ef4444;
    }

    .status-dot.loading {
      background: #f59e0b;
    }

    /* =====================================================
       Navigation
    ===================================================== */

    .tabs {
      display: flex;
      gap: 8px;

      overflow-x: auto;

      padding: 14px 0 4px;

      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab {
      flex: 0 0 auto;

      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);

      border-radius: 999px;

      padding: 9px 15px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition:
        background 0.15s ease,
        color 0.15s ease,
        border-color 0.15s ease;
    }

    .tab:hover {
      border-color: #cbd5e1;
    }

    .tab.active {
      background: #111827;
      border-color: #111827;
      color: #fff;
    }

    /* =====================================================
       Main
    ===================================================== */

    main {
      padding-bottom: 40px;
    }

    .section {
      margin-top: 18px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;

      margin-bottom: 12px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 20px;
    }

    .section-title small {
      color: var(--muted);
      font-size: 12px;
    }

    /* =====================================================
       Stats
    ===================================================== */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .stat-card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
    }

    .stat-value {
      margin-top: 6px;

      font-size: 28px;
      font-weight: 800;
    }

    .stat-note {
      margin-top: 4px;

      color: var(--muted);
      font-size: 12px;
    }

    /* =====================================================
       Strategy
    ===================================================== */

    .strategy-card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .strategy-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .condition {
      border: 1px solid var(--border);

      border-radius: 13px;

      padding: 11px;

      background: #fafafa;
    }

    .condition.active {
      background: var(--green-bg);
      border-color: #bbf7d0;
    }

    .condition.inactive {
      background: #fafafa;
    }

    .condition-name {
      font-size: 12px;
      color: var(--muted);
    }

    .condition-value {
      margin-top: 3px;

      font-size: 14px;
      font-weight: 800;
    }

    .condition-status {
      margin-top: 5px;

      font-size: 11px;
      font-weight: 800;
    }

    .condition-status.ok {
      color: var(--green);
    }

    .condition-status.no {
      color: #9ca3af;
    }

    /* =====================================================
       Ranking
    ===================================================== */

    .ranking-list {
      display: grid;
      gap: 10px;
    }

    .ranking-card {
      display: grid;

      grid-template-columns:
        42px
        minmax(0, 1fr)
        auto;

      align-items: center;

      gap: 12px;

      background: var(--card);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 15px;

      box-shadow: var(--shadow);
    }

    .rank-number {
      width: 36px;
      height: 36px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 12px;

      background: #f3f4f6;

      font-weight: 900;
    }

    .rank-number.top {
      background: #111827;
      color: #fff;
    }

    .stock-main {
      min-width: 0;
    }

    .stock-name-row {
      display: flex;
      align-items: center;

      gap: 7px;

      flex-wrap: wrap;
    }

    .stock-code {
      font-weight: 900;
      font-size: 16px;
    }

    .stock-name {
      color: var(--muted);
      font-size: 13px;
    }

    .stock-price {
      margin-top: 2px;

      font-size: 20px;
      font-weight: 900;
    }

    .stock-change {
      margin-left: 7px;

      font-size: 13px;
      font-weight: 700;
    }

    .positive {
      color: var(--red);
    }

    .negative {
      color: var(--green);
    }

    .score-box {
      text-align: right;
      min-width: 70px;
    }

    .score {
      font-size: 23px;
      font-weight: 900;
    }

    .score-label {
      color: var(--muted);
      font-size: 11px;
    }

    /* =====================================================
       Badges
    ===================================================== */

    .badge {
      display: inline-flex;

      align-items: center;

      padding: 4px 8px;

      border-radius: 999px;

      font-size: 11px;
      font-weight: 800;

      white-space: nowrap;
    }

    .badge-green {
      background: var(--green-bg);
      color: var(--green);
    }

    .badge-red {
      background: var(--red-bg);
      color: var(--red);
    }

    .badge-yellow {
      background: var(--yellow-bg);
      color: var(--yellow);
    }

    .badge-blue {
      background: var(--blue-bg);
      color: var(--blue);
    }

    .badge-purple {
      background: var(--purple-bg);
      color: var(--purple);
    }

    .badge-gray {
      background: #f3f4f6;
      color: #6b7280;
    }

    /* =====================================================
       Stock Cards
    ===================================================== */

    .stock-grid {
      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 14px;
    }

    .stock-card {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 18px;

      box-shadow: var(--shadow);
    }

    .stock-card-header {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      align-items: flex-start;
    }

    .stock-card-price {
      margin-top: 10px;

      display: flex;

      align-items: baseline;

      gap: 8px;
    }

    .stock-card-price strong {
      font-size: 29px;
    }

    .stock-card-price span {
      font-size: 13px;
      font-weight: 700;
    }

    /* =====================================================
       Metrics
    ===================================================== */

    .metrics {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 8px;

      margin-top: 15px;
    }

    .metric {
      padding: 10px;

      border-radius: 12px;

      background: #f8fafc;

      border: 1px solid #eef0f3;
    }

    .metric-label {
      color: var(--muted);
      font-size: 11px;
    }

    .metric-value {
      margin-top: 2px;

      font-size: 14px;
      font-weight: 800;
    }

    /* =====================================================
       Conditions
    ===================================================== */

    .conditions {
      margin-top: 15px;

      display: grid;

      grid-template-columns: repeat(2, 1fr);

      gap: 7px;
    }

    .condition-row {
      display: flex;

      justify-content: space-between;

      align-items: center;

      padding: 8px 10px;

      border-radius: 10px;

      background: #f9fafb;

      font-size: 12px;
    }

    .condition-row.ok {
      background: var(--green-bg);
    }

    .check {
      font-weight: 900;
    }

    .check.ok {
      color: var(--green);
    }

    .check.no {
      color: #9ca3af;
    }

    /* =====================================================
       DCA
    ===================================================== */

    .dca-box {
      margin-top: 15px;

      border-radius: 15px;

      padding: 14px;

      background: var(--blue-bg);

      border: 1px solid #dbeafe;
    }

    .dca-header {
      display: flex;

      justify-content: space-between;

      gap: 10px;

      align-items: center;
    }

    .dca-title {
      font-weight: 900;
      color: #1d4ed8;
    }

    .dca-action {
      font-size: 12px;

      font-weight: 900;

      color: #1e40af;
    }

    .dca-status {
      margin-top: 5px;

      color: #1e40af;

      font-size: 12px;

      font-weight: 700;
    }

    .dca-levels {
      display: grid;

      grid-template-columns: repeat(4, 1fr);

      gap: 7px;

      margin-top: 10px;
    }

    .dca-level {
      background: rgba(255,255,255,0.8);

      border-radius: 10px;

      padding: 8px;

      border: 1px solid #dbeafe;
    }

    .dca-level span {
      display: block;

      color: var(--muted);

      font-size: 10px;
    }

    .dca-level strong {
      display: block;

      margin-top: 2px;

      font-size: 13px;
    }

    /* =====================================================
       Risk
    ===================================================== */

    .risk-box {
      margin-top: 12px;

      border-radius: 15px;

      padding: 14px;

      background: #fafafa;

      border: 1px solid var(--border);
    }

    .risk-header {
      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 10px;
    }

    .risk-grid {
      display: grid;

      grid-template-columns: repeat(3, 1fr);

      gap: 8px;

      margin-top: 10px;
    }

    .risk-item {
      background: #fff;

      border: 1px solid var(--border);

      border-radius: 10px;

      padding: 9px;
    }

    .risk-item span {
      display: block;

      color: var(--muted);

      font-size: 10px;
    }

    .risk-item strong {
      display: block;

      margin-top: 2px;

      font-size: 14px;
    }

    /* =====================================================
       Reasons
    ===================================================== */

    .reasons {
      margin-top: 12px;

      display: flex;

      flex-wrap: wrap;

      gap: 5px;
    }

    /* =====================================================
       Search
    ===================================================== */

    .toolbar {
      display: flex;

      gap: 8px;

      margin-bottom: 12px;
    }

    .search {
      width: 100%;

      border: 1px solid var(--border);

      border-radius: 13px;

      padding: 12px 14px;

      background: #fff;

      outline: none;

      font-size: 14px;
    }

    .search:focus {
      border-color: #9ca3af;

      box-shadow:
        0 0 0 3px
        rgba(37, 99, 235, 0.08);
    }

    /* =====================================================
       Loading / Empty / Error
    ===================================================== */

    .loading,
    .empty,
    .error {
      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 30px 20px;

      text-align: center;

      color: var(--muted);
    }

    .loading {
      margin-top: 18px;
    }

    .error {
      margin-top: 18px;

      color: var(--red);

      background: var(--red-bg);

      border-color: #fecaca;
    }

    .error-title {
      font-weight: 900;

      font-size: 17px;

      margin-bottom: 6px;
    }

    .error-detail {
      font-size: 12px;

      line-height: 1.7;
    }

    /* =====================================================
       Footer
    ===================================================== */

    footer {
      padding: 10px 0 35px;

      color: var(--muted);

      text-align: center;

      font-size: 11px;
    }

    /* =====================================================
       Utility
    ===================================================== */

    .hidden {
      display: none !important;
    }

    .muted {
      color: var(--muted);
    }

    /* =====================================================
       Responsive
    ===================================================== */

    @media (max-width: 900px) {

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .strategy-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .stock-grid {
        grid-template-columns: 1fr;
      }

      .metrics {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    @media (max-width: 600px) {

      .container {
        width: min(100% - 18px, 1180px);
      }

      header {
        padding-top: 10px;
      }

      .header-box {
        border-radius: 19px;
        padding: 18px;
      }

      .header-top {
        display: block;
      }

      .data-status {
        margin-top: 12px;
      }

      .stats-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .stat-card {
        padding: 14px;
      }

      .stat-value {
        font-size: 23px;
      }

      .strategy-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .ranking-card {
        grid-template-columns: 36px 1fr auto;

        padding: 12px;
      }

      .score {
        font-size: 20px;
      }

      .stock-card {
        padding: 14px;
      }

      .metrics {
        grid-template-columns: repeat(2, 1fr);
      }

      .conditions {
        grid-template-columns: 1fr;
      }

      .dca-levels {
        grid-template-columns: repeat(2, 1fr);
      }

      .risk-grid {
        grid-template-columns: 1fr;
      }

      .stock-card-price strong {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       Header
  ====================================================== -->

  <header>

    <div class="container">

      <div class="header-box">

        <div class="header-top">

          <div>

            <h1 class="brand-title">
              📊 台股 AI 選股・零股定投
            </h1>

            <div class="brand-subtitle">
              短期核心訊號 × 定投區間 × 動態風控
            </div>

          </div>

          <div
            id="dataStatusBox"
            class="data-status"
          >

            <span
              id="statusDot"
              class="status-dot loading"
            ></span>

            <span id="dataStatus">
              資料載入中
            </span>

          </div>

        </div>

      </div>

    </div>

  </header>


  <!-- =====================================================
       Main
  ====================================================== -->

  <main class="container">

    <!-- Tabs -->

    <div class="tabs">

      <button
        class="tab active"
        data-tab="dashboard"
      >
        📊 總覽
      </button>

      <button
        class="tab"
        data-tab="short"
      >
        🔥 短期選股
      </button>

      <button
        class="tab"
        data-tab="dca"
      >
        💰 零股定投
      </button>

      <button
        class="tab"
        data-tab="stocks"
      >
        📋 股票清單
      </button>

    </div>


    <!-- Loading -->

    <div
      id="loading"
      class="loading"
    >
      正在載入股票資料……
    </div>


    <!-- Error -->

    <div
      id="error"
      class="error hidden"
    >

      <div class="error-title">
        ⚠️ 股票資料載入失敗
      </div>

      <div
        id="errorDetail"
        class="error-detail"

        無法讀取 Data/prices.json
      </div>

    </div>


    <!-- ===================================================
         Dashboard
    ==================================================== -->

    <section
      id="dashboard"
      class="tab-content"
    >

      <div class="section">

        <div class="section-title">

          <h2>
            市場訊號總覽
          </h2>

          <small id="dataDate">
            —
          </small>

        </div>

        <div
          id="stats"
          class="stats-grid"
        ></div>

      </div>


      <div class="section">

        <div class="section-title">

          <h2>
            短期核心策略
          </h2>

          <small>
            六項條件全部成立＝強勢啟動
          </small>

        </div>

        <div class="strategy-card">

          <div
            id="strategyConditions"
            class="strategy-grid"
          ></div>

        </div>

      </div>


      <div class="section">

        <div class="section-title">

          <h2>
            🔥 短期強勢排名
          </h2>

          <small>

          </small>

        </div>

        <div

        ></div>

      </div>

    </section>


    <!-- ===================================================
         Short
    ==================================================== -->

    <section
      id="short"
      class="tab-content hidden"
    >

      <div class="section">

        <div class="section-title">

          <h2>
            🔥 短期選股
          </h2>

          <small>
            核心條件＋技術評分
          </small>

        </div>

        <div
          id="shortGrid"
          class="stock-grid"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         DCA
    ==================================================== -->

    <section
      id="dca"
      class="tab-content hidden"
    >

      <div class="section">

        <div class="section-title">

          <h2>
            💰 零股定投
          </h2>

          <small>
            以20MA為動態參考
          </small>

        </div>

        <div
          id="dcaGrid"
          class="stock-grid"
        ></div>

      </div>

    </section>


    <!-- ===================================================
         Stocks
    ==================================================== -->

    <section
      id="stocks"
      class="tab-content hidden"
    >

      <div class="section">

        <div class="section-title">

          <h2>
            📋 股票清單
          </h2>

          <small id="stockCount">
            —
          </small>

        </div>

        <div class="toolbar">

          <input
            id="searchInput"
            class="search"
            type="search"
            autocomplete="off"
            placeholder="搜尋股票代號或名稱，例如 2330、台積電"
          >

        </div>

        <div
          id="stockGrid"
          class="stock-grid"
        ></div>

      </div>

    </section>

  </main>


  <!-- =====================================================
       Footer
  ====================================================== -->

  <footer class="container">

    <div>
      台股 AI 選股與零股定投動態風控儀表板
    </div>

    <div>
      資料來源：Yahoo Finance ｜ 僅供研究與決策輔助
    </div>

  </footer>


  <script>

    /* =====================================================
       Global
    ===================================================== */

    let appData = null;

    let stocks = [];


    /* =====================================================
       DOM
    ===================================================== */

    const $ = id =>
      document.getElementById(id);


    /* =====================================================
       Escape HTML
    ===================================================== */

    function escapeHTML(value) {

      if (
        value === null ||
        value === undefined
      ) {
        return "";
      }

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =====================================================
       Number
    ===================================================== */

    function toNumber(value) {

      const number = Number(value);

      return Number.isFinite(number)
        ? number
        : null;
    }


    function formatNumber(
      value,
      digits = 2
    ) {

      const number =
        toNumber(value);

      if (number === null) {
        return "—";
      }

      return number.toLocaleString(
        "zh-TW",
        {
          minimumFractionDigits: digits,
          maximumFractionDigits: digits
        }
      );
    }


    function formatInteger(value) {

      const number =
        toNumber(value);

      if (number === null) {
        return "—";
      }

      return number.toLocaleString(
        "zh-TW"
      );
    }


    /* =====================================================
       Boolean
    ===================================================== */

    function boolValue(value) {

      if (typeof value === "boolean") {
        return value;
      }

      if (
        value === 1 ||
        value === "1" ||
        value === "true" ||
        value === "True" ||
        value === "TRUE"
      ) {
        return true;
      }

      return false;
    }


    function boolIcon(value) {

      return boolValue(value)

        ? `<span class="check ok">✓</span>`

        : `<span class="check no">—</span>`;
    }


    /* =====================================================
       Signal Badge
    ===================================================== */

    function getSignalBadge(
      signal
    ) {

      const value =
        String(signal || "")
          .trim();


      switch (value) {

        case "強勢啟動":

          return `
            <span class="badge badge-red">
              🔥 強勢啟動
            </span>
          `;


        case "高度關注":

          return `
            <span class="badge badge-purple">
              ⭐ 高度關注
            </span>
          `;


        case "偏多":

          return `
            <span class="badge badge-green">
              ▲ 偏多
            </span>
          `;


        case "觀察":

          return `
            <span class="badge badge-yellow">
              ● 觀察
            </span>
          `;


        case "弱勢":

          return `
            <span class="badge badge-blue">
              ▼ 弱勢
            </span>
          `;


        default:

          return `
            <span class="badge badge-gray">
              未定義
            </span>
          `;
      }
    }


    /* =====================================================
       Risk Badge
    ===================================================== */

    function getRiskBadge(
      level
    ) {

      if (!level) {

        return `
          <span class="badge badge-gray">
            風險未定義
          </span>
        `;
      }


      const value =
        String(level);


      if (value.includes("低")) {

        return `
          <span class="badge badge-green">
            ${escapeHTML(value)}風險
          </span>
        `;
      }


      if (value.includes("高")) {

        return `
          <span class="badge badge-red">
            ${escapeHTML(value)}風險
          </span>
        `;
      }


      return `
        <span class="badge badge-yellow">
          ${escapeHTML(value)}風險
        </span>
      `;
    }


    /* =====================================================
       Change
    ===================================================== */

    function getChangeClass(
      value
    ) {

      const number =
        toNumber(value);


      if (number === null) {
        return "";
      }


      if (number > 0) {
        return "positive";
      }


      if (number < 0) {
        return "negative";
      }


      return "";
    }


    function getChangeText(
      value
    ) {

      const number =
        toNumber(value);


      if (number === null) {
        return "—";
      }


      if (number > 0) {

        return `+${formatNumber(
          number,
          2
        )}%`;
      }


      return `${formatNumber(
        number,
        2
      )}%`;
    }


    /* =====================================================
       Core Conditions
    ===================================================== */

    function getConditions(
      stock
    ) {

      const c =
        stock.conditions || {};

      const tech =
        stock.technical || {};

      const strategy =
        appData?.strategy?.short_term || {};


      const rsiThreshold =
        toNumber(
          strategy.rsi_above
        ) ?? 50;


      const volumeMultiplier =
        toNumber(
          strategy.volume_multiplier
        ) ?? 1.5;


      const rsi =
        toNumber(tech.rsi);


      const volumeRatio =
        toNumber(tech.volume_ratio);


      return {

        macd_golden_cross:
          boolValue(
            c.macd_golden_cross
          ),


        kd_golden_cross:
          boolValue(
            c.kd_golden_cross
          ),


        rsi_above_50:
          c.rsi_above_50 !== undefined
            ? boolValue(c.rsi_above_50)
            : rsi !== null &&
              rsi > rsiThreshold,


        volume_over_1_5x:
          c.volume_over_1_5x !== undefined
            ? boolValue(c.volume_over_1_5x)
            : volumeRatio !== null &&
              volumeRatio >= volumeMultiplier,


        above_ma20:
          c.above_ma20 !== undefined
            ? boolValue(c.above_ma20)
            : false,


        ma20_up:
          c.ma20_up !== undefined
            ? boolValue(c.ma20_up)
            : false,


        kd_low_golden_cross:
          boolValue(
            c.kd_low_golden_cross
          )

      };
    }


    function countCoreConditions(
      stock
    ) {

      const c =
        getConditions(stock);


      return [

        c.macd_golden_cross,

        c.kd_golden_cross,

        c.rsi_above_50,

        c.volume_over_1_5x,

        c.above_ma20,

        c.ma20_up

      ].filter(Boolean).length;
    }


    function isCoreStock(
      stock
    ) {

      return countCoreConditions(
        stock
      ) === 6;
    }


    /* =====================================================
       Load Data
    ===================================================== */

    async function loadData() {

      setLoadingState();


      try {

        const url =
          `./Data/prices.json?t=${Date.now()}`;


        const response =
          await fetch(
            url,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );
        }


        const data =
          await response.json();


        if (
          !data ||
          typeof data !== "object"
        ) {

          throw new Error(
            "JSON 格式無效"
          );
        }


        appData = data;


        stocks =
          Array.isArray(
            appData.stocks
          )
            ? appData.stocks
            : [];


        if (!stocks.length) {

          throw new Error(
            "prices.json 已讀取，但 stocks 陣列沒有資料"
          );
        }


        setSuccessState();


        renderAll();


      } catch (error) {

        console.error(
          "Data loading error:",
          error
        );


        setErrorState(
          error
        );
      }
    }

    /* =====================================================
       Ranking
    ===================================================== */

    function getSortedStocks() {

      return [...stocks]
        .sort(
          (a, b) => {

            const scoreA =
              toNumber(
                a.short_term?.score
              ) ?? 0;


            const scoreB =
              toNumber(
                b.short_term?.score
              ) ?? 0;


            if (
              scoreB !== scoreA
            ) {

              return scoreB -
                scoreA;
            }


            return (
              countCoreConditions(b) -
              countCoreConditions(a)
            );
          }
        );
    }

              stocks.find(
                stock =>
                  String(stock.id) ===
                  String(id)
              )
          )
          .filter(Boolean);


      if (!list.length) {

        list =
          getSortedStocks();
      }


      if (!list.length) {

        $("shortGrid")
          .innerHTML =
          `<div class="empty">
            目前沒有股票資料
          </div>`;

        return;
      }


      $("shortGrid")
        .innerHTML =
        list
          .map(
            stock =>
              createStockCard(stock)
          )
          .join("");
    }


    /* =====================================================
       DCA
    ===================================================== */

    function renderDCA() {

      const rankingIds =
        Array.isArray(
          appData.rankings?.dca
        )
          ? appData.rankings.dca
          : [];


      let list =
        rankingIds
          .map(
            id =>
              stocks.find(
                stock =>
                  String(stock.id) ===
                  String(id)
              )
          )
          .filter(Boolean);


      if (!list.length) {

        list =
          getSortedStocks();
      }


      if (!list.length) {

        $("dcaGrid")
          .innerHTML =
          `<div class="empty">
            目前沒有股票資料
          </div>`;

        return;
      }


      $("dcaGrid")
        .innerHTML =
        list
          .map(
            stock =>
              createStockCard(stock)
          )
          .join("");
    }


    /* =====================================================
       Stocks
    ===================================================== */

    function renderStocks(
      filter = ""
    ) {

      const keyword =
        String(filter)
          .trim()
          .toLowerCase();


      const filtered =
        stocks.filter(
          stock => {

            if (!keyword) {
              return true;
            }


            const id =
              String(
                stock.id ?? ""
              )
              .toLowerCase();


            const name =
              String(
                stock.name ?? ""
              )
              .toLowerCase();


            return (
              id.includes(keyword) ||
              name.includes(keyword)
            );
          }
        );


      $("stockCount")
        .textContent =
        `顯示 ${filtered.length} / ${stocks.length} 檔`;


      if (!filtered.length) {

        $("stockGrid")
          .innerHTML =
          `<div class="empty">
            找不到符合的股票
          </div>`;

        return;
      }


      $("stockGrid")
        .innerHTML =
        filtered
          .map(
            stock =>
              createStockCard(stock)
          )
          .join("");
    }


    /* =====================================================
       Render All
    ===================================================== */

    function renderAll() {

      renderStats();

      renderStrategy();

      renderRanking();

      renderShort();

      renderDCA();

      renderStocks();

    }


    /* =====================================================
       Tabs
    ===================================================== */

    function setupTabs() {

      const tabs =
        document.querySelectorAll(
          ".tab"
        );


      const contents =
        document.querySelectorAll(
          ".tab-content"
        );


      tabs.forEach(
        tab => {

          tab.addEventListener(
            "click",
            () => {

              const target =
                tab.dataset.tab;


              tabs.forEach(
                item =>
                  item.classList.remove(
                    "active"
                  )
              );


              tab.classList.add(
                "active"
              );


              contents.forEach(
                content => {

                  content.classList.toggle(
                    "hidden",
                    content.id !== target
                  );

                }
              );

            }
          );

        }
      );

    }


    /* =====================================================
       Search
    ===================================================== */

    function setupSearch() {

      const input =
        $("searchInput");


      input.addEventListener(
        "input",
        event => {

          renderStocks(
            event.target.value
          );

        }
      );

    }


    /* =====================================================
       Start
    ===================================================== */

    document.addEventListener(
      "DOMContentLoaded",
      () => {

        setupTabs();

        setupSearch();

        loadData();

      }
    );

  </script>

</body>
</html>
