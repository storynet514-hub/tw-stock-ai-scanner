<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
台股 AI 選股儀表板 V8.0
</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "Noto Sans TC",
    Arial,
    sans-serif;

  background:
    #f3f5f8;

  color:
    #172033;
}

header {

  background:
    #111827;

  color:
    white;

  padding:
    20px;
}

.header-inner {

  max-width:
    1200px;

  margin:
    auto;
}

h1 {

  margin:
    0 0 8px 0;

  font-size:
    25px;
}

.subtitle {

  color:
    #cbd5e1;

  font-size:
    14px;
}

.container {

  max-width:
    1200px;

  margin:
    auto;

  padding:
    18px;
}

.grid {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        180px,
        1fr
      )
    );

  gap:
    12px;

  margin-bottom:
    18px;
}

.card {

  background:
    white;

  border-radius:
    14px;

  padding:
    16px;

  box-shadow:
    0 3px 12px
    rgba(
      0,
      0,
      0,
      0.06
    );
}

.card-title {

  color:
    #64748b;

  font-size:
    13px;

  margin-bottom:
    8px;
}

.card-value {

  font-size:
    26px;

  font-weight:
    700;
}

.section {

  margin-top:
    20px;
}

.section-title {

  font-size:
    20px;

  font-weight:
    700;

  margin-bottom:
    12px;
}

.table-wrap {

  overflow-x:
    auto;

  background:
    white;

  border-radius:
    14px;

  box-shadow:
    0 3px 12px
    rgba(
      0,
      0,
      0,
      0.06
    );
}

table {

  width:
    100%;

  border-collapse:
    collapse;

  min-width:
    760px;
}

th,
td {

  padding:
    11px 10px;

  border-bottom:
    1px solid
    #e5e7eb;

  text-align:
    left;

  font-size:
    14px;
}

th {

  background:
    #f8fafc;

  color:
    #475569;

  position:
    sticky;

  top:
    0;
}

.badge {

  display:
    inline-block;

  padding:
    4px 9px;

  border-radius:
    999px;

  font-size:
    12px;

  font-weight:
    700;

  background:
    #e5e7eb;
}

.badge-good {

  background:
    #dcfce7;

  color:
    #166534;
}

.badge-mid {

  background:
    #fef3c7;

  color:
    #92400e;
}

.badge-low {

  background:
    #fee2e2;

  color:
    #991b1b;
}

.up {

  color:
    #dc2626;

  font-weight:
    700;
}

.down {

  color:
    #16a34a;

  font-weight:
    700;
}

.conditions {

  display:
    grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(
        150px,
        1fr
      )
    );

  gap:
    10px;
}

.condition {

  background:
    #f8fafc;

  border-radius:
    10px;

  padding:
    12px;
}

.condition-pass {

  border-left:
    5px solid
    #16a34a;
}

.condition-fail {

  border-left:
    5px solid
    #dc2626;
}

.loading {

  text-align:
    center;

  padding:
    50px;

  color:
    #64748b;
}

.error {

  background:
    #fee2e2;

  color:
    #991b1b;

  padding:
    16px;

  border-radius:
    12px;
}

.small {

  font-size:
    12px;

  color:
    #64748b;
}

button {

  border:
    0;

  border-radius:
    9px;

  padding:
    9px 14px;

  cursor:
    pointer;

  background:
    #2563eb;

  color:
    white;

  font-weight:
    600;
}

button:hover {

  opacity:
    0.9;
}

</style>

</head>

<body>

<header>

<div class="header-inner">

<h1>
台股 AI 選股儀表板
</h1>

<div class="subtitle">
V8.0 FINAL｜後台六項條件＋A/B 歷史回測
</div>

</div>

</header>


<main class="container">

<div id="loading" class="loading">
正在讀取最新資料……
</div>

<div id="error"></div>

<div id="app" style="display:none">


<!-- ========================================================= -->
<!-- 統計 -->
<!-- ========================================================= -->

<div class="grid">

<div class="card">

<div class="card-title">
股票數量
</div>

<div
  id="stockCount"
  class="card-value"
>
-
</div>

</div>


<div class="card">

<div class="card-title">
ETF 數量
</div>

<div
  id="etfCount"
  class="card-value"
>
-
</div>

</div>


<div class="card">

<div class="card-title">
今日 6/6
</div>

<div
  id="selectedCount"
  class="card-value"
>
-
</div>

</div>


<div class="card">

<div class="card-title">
Top 30
</div>

<div
  id="top30Count"
  class="card-value"
>
-
</div>

</div>

</div>


<!-- ========================================================= -->
<!-- 更新 -->
<!-- ========================================================= -->

<div class="card">

<div class="card-title">
資料更新時間
</div>

<div
  id="updatedAt"
>
-
</div>

<br>

<button
  onclick="loadData()"
>
重新整理
</button>

</div>


<!-- ========================================================= -->
<!-- 今日精選 -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
今日符合六項條件
</div>

<div
  id="selectedTable"
  class="table-wrap"
>
</div>

</section>


<!-- ========================================================= -->
<!-- Top30 -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
AI Top 30
</div>

<div
  id="top30Table"
  class="table-wrap"
>
</div>

</section>


<!-- ========================================================= -->
<!-- 回測 -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
A / B 歷史回測
</div>

<div
  id="backtestTable"
  class="table-wrap"
>
</div>

</section>


<!-- ========================================================= -->
<!-- 六項條件 -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
正式六項核心條件
</div>

<div class="card">

<div class="conditions">

<div class="condition">
MACD 多方
</div>

<div class="condition">
RSI > 50
</div>

<div class="condition">
KD 多方
</div>

<div class="condition">
成交量 ≥ MA5 × 1.5
</div>

<div class="condition">
股價 > MA20
</div>

<div class="condition">
MA20 今日 > 昨日
</div>

</div>

<br>

<div class="small">
正式選股模式：目前維持多方
</div>

</div>

</section>


<!-- ========================================================= -->
<!-- 股票完整資料 -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
股票完整資料
</div>

<div
  id="stocksTable"
  class="table-wrap"
>
</div>

</section>


<!-- ========================================================= -->
<!-- ETF -->
<!-- ========================================================= -->

<section class="section">

<div class="section-title">
ETF
</div>

<div
  id="etfTable"
  class="table-wrap"
>
</div>

</section>


</div>

</main>


<script>

const DATA_URL =
  "./Data/prices.json?t=" +
  Date.now();


function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function scoreBadge(score) {

  if (score === 6) {

    return `
      <span class="badge badge-good">
        6 / 6
      </span>
    `;
  }

  if (score >= 4) {

    return `
      <span class="badge badge-good">
        ${score} / 6
      </span>
    `;
  }

  if (score >= 2) {

    return `
      <span class="badge badge-mid">
        ${score} / 6
      </span>
    `;
  }

  return `
    <span class="badge badge-low">
      ${score} / 6
    </span>
  `;
}


function changeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {

    return "-";
  }

  const number =
    Number(value);

  if (
    !Number.isFinite(number)
  ) {

    return "-";
  }

  const cls =
    number >= 0
      ? "up"
      : "down";

  const sign =
    number >= 0
      ? "+"
      : "";

  return `
    <span class="${cls}">
      ${sign}${number.toFixed(2)}%
    </span>
  `;
}


function stockTable(
  stocks
) {

  if (
    !stocks ||
    !stocks.length
  ) {

    return `
      <div style="padding:20px">
        沒有資料
      </div>
    `;
  }

  let html = `
    <table>

      <thead>

        <tr>

          <th>排名</th>

          <th>代號</th>

          <th>名稱</th>

          <th>價格</th>

          <th>漲跌</th>

          <th>AI Score</th>

          <th>核心條件</th>

          <th>訊號</th>

          <th>RSI</th>

          <th>量比</th>

        </tr>

      </thead>

      <tbody>
  `;

  stocks.forEach(
    (item, index) => {

      const score =
        item.core_score;

      html += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            <strong>
              ${escapeHtml(
                item.code
              )}
            </strong>
          </td>

          <td>
            ${escapeHtml(
              item.name
            )}
          </td>

          <td>
            ${
              item.price !== null
                ? Number(
                    item.price
                  ).toFixed(2)
                : "-"
            }
          </td>

          <td>
            ${changeHtml(
              item.change_pct
            )}
          </td>

          <td>
            ${
              item.ai_score !== null
                ? Number(
                    item.ai_score
                  ).toFixed(2)
                : "-"
            }
          </td>

          <td>
            ${scoreBadge(
              Number(score || 0)
            )}
          </td>

          <td>
            ${escapeHtml(
              item.signal || "-"
            )}
          </td>

          <td>
            ${
              item.rsi !== null
                ? Number(
                    item.rsi
                  ).toFixed(2)
                : "-"
            }
          </td>

          <td>
            ${
              item.volume_ratio !== null
                ? Number(
                    item.volume_ratio
                  ).toFixed(2) + "x"
                : "-"
            }
          </td>

        </tr>
      `;
    }
  );

  html += `
      </tbody>
    </table>
  `;

  return html;
}


function etfTable(
  etfs
) {

  if (
    !etfs ||
    !etfs.length
  ) {

    return `
      <div style="padding:20px">
        沒有 ETF 資料
      </div>
    `;
  }

  let html = `
    <table>

      <thead>

        <tr>

          <th>排名</th>

          <th>代號</th>

          <th>名稱</th>

          <th>價格</th>

          <th>漲跌</th>

          <th>強勢分數</th>

          <th>訊號</th>

        </tr>

      </thead>

      <tbody>
  `;

  etfs.forEach(
    (item, index) => {

      html += `

        <tr>

          <td>
            ${index + 1}
          </td>

          <td>
            <strong>
              ${escapeHtml(
                item.code
              )}
            </strong>
          </td>

          <td>
            ${escapeHtml(
              item.name
            )}
          </td>

          <td>
            ${
              item.price !== null
                ? Number(
                    item.price
                  ).toFixed(2)
                : "-"
            }
          </td>

          <td>
            ${changeHtml(
              item.change_pct
            )}
          </td>

          <td>
            ${
              item.strength_score !== null
                ? Number(
                    item.strength_score
                  ).toFixed(2)
                : "-"
            }
          </td>

          <td>
            ${escapeHtml(
              item.signal || "-"
            )}
          </td>

        </tr>
      `;
    }
  );

  html += `
      </tbody>
    </table>
  `;

  return html;
}


function backtestTable(
  comparison
) {

  if (
    !comparison ||
    !comparison.strategies
  ) {

    return `
      <div style="padding:20px">
        尚無回測資料
      </div>
    `;
  }

  const A =
    comparison.strategies
      .A_today_cross;

  const B =
    comparison.strategies
      .B_current_bullish;

  let html = `
    <table>

      <thead>

        <tr>

          <th>策略</th>

          <th>5 日勝率</th>

          <th>5 日平均</th>

          <th>10 日勝率</th>

          <th>10 日平均</th>

          <th>20 日勝率</th>

          <th>20 日平均</th>

        </tr>

      </thead>

      <tbody>
  `;

  html += `
    <tr>

      <td>
        <strong>
          A：當日黃金交叉
        </strong>
      </td>

      <td>
        ${A["5d"].win_rate}%
      </td>

      <td>
        ${A["5d"].average_return}%
      </td>

      <td>
        ${A["10d"].win_rate}%
      </td>

      <td>
        ${A["10d"].average_return}%
      </td>

      <td>
        ${A["20d"].win_rate}%
      </td>

      <td>
        ${A["20d"].average_return}%
      </td>

    </tr>

    <tr>

      <td>
        <strong>
          B：目前維持多方
        </strong>
      </td>

      <td>
        ${B["5d"].win_rate}%
      </td>

      <td>
        ${B["5d"].average_return}%
      </td>

      <td>
        ${B["10d"].win_rate}%
      </td>

      <td>
        ${B["10d"].average_return}%
      </td>

      <td>
        ${B["20d"].win_rate}%
      </td>

      <td>
        ${B["20d"].average_return}%
      </td>

    </tr>
  `;

  html += `
      </tbody>
    </table>

    <div style="padding:14px">

      比較基準：
      ${comparison.comparison_horizon}
      個交易日

      <br><br>

      勝率較高：
      <strong>
        ${escapeHtml(
          comparison.better_by_win_rate
        )}
      </strong>

    </div>
  `;

  return html;
}


function render(
  data
) {

  const stats =
    data.statistics || {};

  document.getElementById(
    "stockCount"
  ).textContent =
    stats.stock_count ?? "-";

  document.getElementById(
    "etfCount"
  ).textContent =
    stats.etf_count ?? "-";

  document.getElementById(
    "selectedCount"
  ).textContent =
    stats.today_selected_count ?? "-";

  document.getElementById(
    "top30Count"
  ).textContent =
    stats.top30_count ?? "-";

  document.getElementById(
    "updatedAt"
  ).textContent =
    data.updated_at_tw ||
    data.updated_at ||
    "-";

  document.getElementById(
    "selectedTable"
  ).innerHTML =
    stockTable(
      data.today_selected || []
    );

  document.getElementById(
    "top30Table"
  ).innerHTML =
    stockTable(
      data.top30 || []
    );

  document.getElementById(
    "stocksTable"
  ).innerHTML =
    stockTable(
      data.stocks || []
    );

  document.getElementById(
    "etfTable"
  ).innerHTML =
    etfTable(
      data.etfs || []
    );

  document.getElementById(
    "backtestTable"
  ).innerHTML =
    backtestTable(
      data.backtest_summary
    );

  document.getElementById(
    "loading"
  ).style.display =
    "none";

  document.getElementById(
    "app"
  ).style.display =
    "block";
}


async function loadData() {

  document.getElementById(
    "loading"
  ).style.display =
    "block";

  document.getElementById(
    "app"
  ).style.display =
    "none";

  document.getElementById(
    "error"
  ).innerHTML =
    "";

  try {

    const response =
      await fetch(
        "./Data/prices.json?t=" +
        Date.now(),
        {
          cache:
            "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }

    const data =
      await response.json();

    if (
      !data ||
      data.status !==
      "success"
    ) {

      throw new Error(
        "prices.json 狀態異常"
      );
    }

    render(data);

  } catch (error) {

    document.getElementById(
      "loading"
    ).style.display =
      "none";

    document.getElementById(
      "error"
    ).innerHTML = `

      <div class="error">

        無法讀取最新資料。

        <br><br>

        ${escapeHtml(
          error.message
        )}

      </div>

    `;
  }
}


loadData();

</script>

</body>

</html>
