body {

th,

.badge-mid {

}

.badge-low {

}

.up {

}

.down {
  color: #16a34a;

}

.loading {
  text-align: center;

.error {

}

}

.condition-grid {
  display: grid;
  grid-template-columns:
    repeat(
      auto-fit,
      minmax(180px, 1fr)

  gap: 10px;
}

.condition {
  background: #f8fafc;
  border-radius: 10px;
  padding: 12px;
}

.pass {
  border-left:
    5px solid #16a34a;
}

.fail {
  border-left:
    5px solid #dc2626;
}

.meta {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.meta-item {
  background: #f8fafc;
  border-radius: 9px;
  padding: 8px 12px;

<script>

/*
================================================================
V8.0 FRONTEND LOCK
================================================================

本頁禁止自行計算：

- RSI
- MACD
- KD
- MA
- 成交量條件
- Core Score
- AI Score
- 今日 6/6
- Top30
- 回測

所有結果只接受：

Data/prices.json

後台 fetch_data.py 是唯一計算來源。

================================================================
*/


const DATA_URL =
  "./Data/prices.json";


/* ==============================================================
   HTML Escape
============================================================== */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==============================================================
   數字格式
============================================================== */

function number(value, digits = 2) {

  if (
    value === null ||
    value === undefined ||
    !Number.isFinite(Number(value))
  ) {
    return "-";
  }

  return Number(value).toFixed(digits);
}


/* ==============================================================
   漲跌顯示
============================================================== */

function changeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "-";
  }

  const n = Number(value);

  if (!Number.isFinite(n)) {
    return "-";
  }

  const cls =
    n >= 0
      ? "up"
      : "down";

  const sign =
    n >= 0
      ? "+"
      : "";

  return `
    <span class="${cls}">
      ${sign}${n.toFixed(2)}%
    </span>
  `;
}


/* ==============================================================
   Core Score 顯示
============================================================== */

function scoreBadge(score) {

  if (
    score === null ||
    score === undefined
  ) {
    return "-";
  }

  const n = Number(score);

  if (!Number.isFinite(n)) {
    return "-";
  }

  if (n === 6) {

    return `
      <span class="badge badge-good">
        6 / 6
      </span>
    `;
  }

  if (n >= 4) {

    return `
      <span class="badge badge-good">
        ${n} / 6
      </span>
    `;
  }

  if (n >= 2) {

    return `
      <span class="badge badge-mid">
        ${n} / 6
      </span>
    `;
  }

  return `
    <span class="badge badge-low">
      ${n} / 6
    </span>
  `;
}


/* ==============================================================
   股票表格
============================================================== */

function stockTable(stocks) {

  if (
    !Array.isArray(stocks) ||
    stocks.length === 0
  ) {

    return `
      <div style="padding:20px">
        沒有資料
      </div>
    `;
  }

  let html = `

<table>

<thead>

<tr>

<th>排名</th>
<th>代號</th>
<th>名稱</th>
<th>價格</th>
<th>漲跌</th>
<th>AI Score</th>
<th>核心條件</th>
<th>訊號</th>
<th>RSI</th>
<th>K</th>
<th>D</th>
<th>MACD</th>
<th>MA20</th>
<th>量比</th>

</tr>

</thead>

<tbody>
  `;


  stocks.forEach(
    (item, index) => {

      html += `

<tr>

<td>
${index + 1}
</td>

<td>
<strong>
${escapeHtml(item.code)}
</strong>
</td>

<td>
${escapeHtml(item.name)}
</td>

<td>
${number(item.price)}
</td>

<td>
${changeHtml(item.change_pct)}
</td>

<td>
${number(item.ai_score)}
</td>

<td>
${scoreBadge(item.core_score)}
</td>

<td>
${escapeHtml(item.signal || "-")}
</td>

<td>
${number(item.rsi)}
</td>

<td>
${number(item.k)}
</td>

<td>
${number(item.d)}
</td>

<td>
${number(item.macd)}
</td>

<td>
${number(item.ma20)}
</td>

<td>
${
  item.volume_ratio !== null &&
  item.volume_ratio !== undefined
    ? number(item.volume_ratio) + "x"
    : "-"
}
</td>

</tr>
      `;
    }
  );


  html += `

</tbody>

</table>
  `;

  return html;
}


/* ==============================================================
   ETF 表格
============================================================== */

function etfTable(etfs) {

  if (
    !Array.isArray(etfs) ||
    etfs.length === 0
  ) {

    return `
      <div style="padding:20px">
        沒有 ETF 資料
      </div>
    `;
  }

  let html = `

<table>

<thead>

<tr>

<th>排名</th>
<th>代號</th>
<th>名稱</th>
<th>價格</th>
<th>漲跌</th>
<th>強勢分數</th>
<th>訊號</th>
<th>RSI</th>
<th>量比</th>

</tr>

</thead>

<tbody>
  `;


  etfs.forEach(
    (item, index) => {

      html += `

<tr>

<td>
${index + 1}
</td>

<td>
<strong>
${escapeHtml(item.code)}
</strong>
</td>

<td>
${escapeHtml(item.name)}
</td>

<td>
${number(item.price)}
</td>

<td>
${changeHtml(item.change_pct)}
</td>

<td>
${number(item.strength_score)}
</td>

<td>
${escapeHtml(item.signal || "-")}
</td>

<td>
${number(item.rsi)}
</td>

<td>
${
  item.volume_ratio !== null &&
  item.volume_ratio !== undefined
    ? number(item.volume_ratio) + "x"
    : "-"
}
</td>

</tr>

      `;
    }
  );


  html += `

</tbody>

</table>
  `;

  return html;
}


/* ==============================================================
   回測表格
============================================================== */

function backtestTable(comparison) {

  if (
    !comparison ||
    !comparison.strategies
  ) {

    return `
      <div style="padding:20px">
        尚無回測資料
      </div>
    `;
  }


  const A =
    comparison
      .strategies
      .A_today_cross;

  const B =
    comparison
      .strategies
      .B_current_bullish;


  if (!A || !B) {

    return `
      <div style="padding:20px">
        回測資料結構錯誤
      </div>
    `;
  }


  let html = `

<table>

<thead>

<tr>

<th>策略</th>

<th>5 日勝率</th>
<th>5 日平均</th>

<th>10 日勝率</th>
<th>10 日平均</th>

<th>20 日勝率</th>
<th>20 日平均</th>

</tr>

</thead>

<tbody>

<tr>

<td>
<strong>
A：當日黃金交叉
</strong>
</td>

<td>
${number(A["5d"]?.win_rate)}%
</td>

<td>
${number(A["5d"]?.average_return)}%
</td>

<td>
${number(A["10d"]?.win_rate)}%
</td>

<td>
${number(A["10d"]?.average_return)}%
</td>

<td>
${number(A["20d"]?.win_rate)}%
</td>

<td>
${number(A["20d"]?.average_return)}%
</td>

</tr>


<tr>

<td>
<strong>
B：目前維持多方
</strong>
</td>

<td>
${number(B["5d"]?.win_rate)}%
</td>

<td>
${number(B["5d"]?.average_return)}%
</td>

<td>
${number(B["10d"]?.win_rate)}%
</td>

<td>
${number(B["10d"]?.average_return)}%
</td>

<td>
${number(B["20d"]?.win_rate)}%
</td>

<td>
${number(B["20d"]?.average_return)}%
</td>

</tr>

</tbody>

</table>


<div style="padding:14px">

比較基準：
<strong>
${escapeHtml(
  comparison.comparison_horizon
)}
</strong>
個交易日

<br><br>

勝率較高：
<strong>
${escapeHtml(
  comparison.better_by_win_rate
)}
</strong>

</div>
  `;

  return html;
}


/* ==============================================================
   六項條件
============================================================== */

function renderConditions(core) {

  const container =
    document.getElementById(
      "conditionGrid"
    );

  if (
    !core ||
    !Array.isArray(core.names)
  ) {

    container.innerHTML = `
      <div class="error">
        核心條件資料錯誤
      </div>
    `;

    return;
  }


  const rules =
    core.rules || {};


  const entries = [
    [
      "MACD 多方",
      rules.macd_golden_cross
    ],
    [
      "RSI > 50",
      rules.rsi_over_50
    ],
    [
      "KD 多方",
      rules.kd_golden_cross
    ],
    [
      "成交量放大",
      rules.volume_expand
    ],
    [
      "股價 > MA20",
      rules.price_over_ma20
    ],
    [
      "MA20 向上",
      rules.ma20_up
    ]
  ];


  container.innerHTML =
    entries.map(
      item => `

<div class="condition pass">

<strong>
${escapeHtml(item[0])}
</strong>

<br>

<span class="small">
${escapeHtml(item[1] || "-")}
</span>

</div>

      `
    ).join("");
}


/* ==============================================================
   V8.0 資料結構驗證
============================================================== */

function validateData(data) {

  if (!data || typeof data !== "object") {
    throw new Error(
      "prices.json 不是有效 JSON"
    );
  }


  if (data.version !== "V8.0") {
    throw new Error(
      "資料版本不是 V8.0"
    );
  }


  if (
    data.schema_version !==
    "prices.v8"
  ) {
    throw new Error(
      "資料結構版本不是 prices.v8"
    );
  }


  if (
    data.status !==
    "success"
  ) {
    throw new Error(
      "後台資料狀態不是 success"
    );
  }


  if (
    !Array.isArray(data.stocks)
  ) {
    throw new Error(
      "stocks 資料結構錯誤"
    );
  }


  if (
    !Array.isArray(data.etfs)
  ) {
    throw new Error(
      "etfs 資料結構錯誤"
    );
  }


  if (
    !Array.isArray(data.top30)
  ) {
    throw new Error(
      "top30 資料結構錯誤"
    );
  }


  if (
    !Array.isArray(
      data.today_selected
    )
  ) {
    throw new Error(
      "today_selected 資料結構錯誤"
    );
  }


  if (
    !data.statistics
  ) {
    throw new Error(
      "statistics 缺失"
    );
  }


  if (
    !data.core_conditions
  ) {
    throw new Error(
      "core_conditions 缺失"
    );
  }


  return true;
}


/* ==============================================================
   Render
============================================================== */

function render(data) {

  validateData(data);


  const stats =
    data.statistics || {};


  document.getElementById(
    "stockCount"
  ).textContent =
    stats.stock_count ?? "-";


  document.getElementById(
    "etfCount"
  ).textContent =
    stats.etf_count ?? "-";


  document.getElementById(
    "selectedCount"
  ).textContent =
    stats.today_selected_count ?? "-";


  document.getElementById(
    "top30Count"
  ).textContent =
    stats.top30_count ?? "-";


  document.getElementById(
    "version"
  ).textContent =
    data.version || "-";


  document.getElementById(
    "dataDate"
  ).textContent =
    data.date || "-";


  document.getElementById(
    "updatedAt"
  ).textContent =
    data.updated_at_tw ||
    data.updated_at ||
    "-";


  document.getElementById(
    "dataStatus"
  ).textContent =
    data.status || "-";


  /*
   * 注意：
   *
   * 以下全部直接使用後台資料。
   *
   * 前台不篩選。
   * 前台不排序。
   * 前台不重新計算。
   */

  document.getElementById(
    "selectedTable"
  ).innerHTML =
    stockTable(
      data.today_selected
    );


  document.getElementById(
    "top30Table"
  ).innerHTML =
    stockTable(
      data.top30
    );


  document.getElementById(
    "stocksTable"
  ).innerHTML =
    stockTable(
      data.stocks
    );


  document.getElementById(
    "etfTable"
  ).innerHTML =
    etfTable(
      data.etfs
    );


  document.getElementById(
    "backtestTable"
  ).innerHTML =
    backtestTable(
      data.backtest_summary
    );


  renderConditions(
    data.core_conditions
  );


  document.getElementById(
    "loading"
  ).style.display =
    "none";


  document.getElementById(
    "app"
  ).style.display =
    "block";
}


/* ==============================================================
   讀取 prices.json
============================================================== */

async function loadData() {

  document.getElementById(
    "loading"
  ).style.display =
    "block";


  document.getElementById(
    "app"
  ).style.display =
    "none";


  document.getElementById(
    "error"
  ).innerHTML =
    "";


  try {

    const response =
      await fetch(
        DATA_URL +
        "?t=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    render(data);


  } catch (error) {

    document.getElementById(
      "loading"
    ).style.display =
      "none";


    document.getElementById(
      "error"
    ).innerHTML = `

<div class="error">

<strong>
無法讀取 V8.0 後台資料
</strong>

<br><br>

${escapeHtml(
  error.message
)}

<br><br>

前台未自行產生任何選股結果。
請確認 GitHub Actions 是否成功產生
Data/prices.json。

</div>

    `;
  }
}


/* ==============================================================
   啟動
============================================================== */

loadData();

</script>

</body>

</html>
