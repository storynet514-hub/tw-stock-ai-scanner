<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI MARKET INTELLIGENCE｜台股市場</title>

<style>
:root {
    --bg: #080b12;
    --bg2: #0d111a;
    --panel: #111722;
    --panel2: #151c28;
    --border: rgba(255,255,255,.08);

    --text: #f4f7fb;
    --muted: #8d98a8;
    --muted2: #667182;

    --red: #ff4d5e;
    --red-soft: rgba(255,77,94,.12);

    --green: #27d17f;
    --green-soft: rgba(39,209,127,.12);

    --yellow: #f4c95d;
    --yellow-soft: rgba(244,201,93,.12);

    --blue: #5d8cff;
    --blue-soft: rgba(93,140,255,.12);

    --shadow: 0 18px 50px rgba(0,0,0,.28);

    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(93,140,255,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(39,209,127,.06),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #080b12 0%,
            #0a0e16 100%
        );
}

/* =========================================================
   APP
========================================================= */

.app {
    width: min(1180px, calc(100% - 28px));
    margin: 0 auto;
    padding: 28px 0 60px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    margin-bottom: 22px;
}

.brand {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
}

.brand-title {
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1.1;
}

.brand-subtitle {
    margin-top: 7px;
    font-size: 15px;
    color: var(--muted);
}

.brand-caption {
    margin-top: 5px;
    font-size: 13px;
    color: var(--muted2);
}

.market-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;

    padding: 10px 14px;

    border-radius: 999px;

    background: rgba(255,255,255,.045);
    border: 1px solid var(--border);

    white-space: nowrap;

    font-size: 13px;
    color: var(--muted);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.status-dot.open {
    background: var(--green);
    box-shadow: 0 0 12px rgba(39,209,127,.7);
}

.status-dot.closed {
    background: var(--red);
    box-shadow: 0 0 12px rgba(255,77,94,.6);
}

.latest-date {
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   DASHBOARD GRID
========================================================= */

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.info-card {
    position: relative;
    overflow: hidden;

    padding: 20px;

    min-height: 140px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid var(--border);

    border-radius: var(--radius);

    box-shadow: var(--shadow);
}

.info-card::after {
    content: "";
    position: absolute;

    width: 120px;
    height: 120px;

    right: -50px;
    bottom: -50px;

    border-radius: 50%;

    background: rgba(255,255,255,.025);
}

.info-label {
    position: relative;
    z-index: 1;

    color: var(--muted);
    font-size: 13px;
}

.info-value {
    position: relative;
    z-index: 1;

    margin-top: 12px;

    font-size: clamp(25px, 5vw, 34px);
    font-weight: 800;

    letter-spacing: -.02em;
}

.info-description {
    position: relative;
    z-index: 1;

    margin-top: 5px;

    color: var(--muted2);
    font-size: 12px;
}

.market-up {
    color: var(--red);
}

.market-down {
    color: var(--green);
}

.market-neutral {
    color: var(--yellow);
}

/* =========================================================
   SEARCH
========================================================= */

.search-section {
    margin-bottom: 22px;
}

.section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
}

.search-box {
    display: flex;
    gap: 10px;
}

.search-input {
    flex: 1;

    min-width: 0;

    height: 48px;

    padding: 0 15px;

    border:
        1px solid var(--border);

    border-radius: 12px;

    background: rgba(255,255,255,.045);

    color: var(--text);

    outline: none;

    font-size: 14px;
}

.search-input::placeholder {
    color: var(--muted2);
}

.search-input:focus {
    border-color: rgba(93,140,255,.55);
    background: rgba(255,255,255,.06);
}

.search-button {
    height: 48px;

    padding: 0 20px;

    border: 0;
    border-radius: 12px;

    background: var(--blue);

    color: white;

    font-weight: 700;

    cursor: pointer;
}

.search-button:active {
    transform: translateY(1px);
}

/* =========================================================
   SEARCH RESULT
========================================================= */

.search-result {
    display: none;

    margin-top: 12px;

    padding: 15px;

    border:
        1px solid var(--border);

    border-radius: 14px;

    background: rgba(255,255,255,.035);
}

.search-result.show {
    display: block;
}

.search-result-main {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 15px;
}

.search-result-name {
    font-size: 17px;
    font-weight: 750;
}

.search-result-symbol {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
}

.add-watch-button {
    border: 1px solid rgba(93,140,255,.35);

    background: var(--blue-soft);

    color: #9bb6ff;

    padding: 9px 13px;

    border-radius: 10px;

    cursor: pointer;

    white-space: nowrap;
}

/* =========================================================
   TABS
========================================================= */

.tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);

    gap: 6px;

    padding: 5px;

    margin-bottom: 20px;

    background: rgba(255,255,255,.035);

    border:
        1px solid var(--border);

    border-radius: 14px;
}

.tab {
    border: 0;

    padding: 11px 8px;

    border-radius: 10px;

    background: transparent;

    color: var(--muted);

    cursor: pointer;

    font-size: 13px;
    font-weight: 650;
}

.tab.active {
    background: rgba(255,255,255,.09);
    color: var(--text);
}

/* =========================================================
   CONTENT HEADER
========================================================= */

.content-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    gap: 15px;

    margin-bottom: 13px;
}

.content-title {
    font-size: 19px;
    font-weight: 800;
}

.content-description {
    margin-top: 4px;

    color: var(--muted);

    font-size: 12px;
}

/* =========================================================
   STOCK GRID
========================================================= */

.stock-grid {
    display: grid;

    grid-template-columns:
        repeat(3, minmax(0, 1fr));

    gap: 14px;
}

/* =========================================================
   STOCK CARD
========================================================= */

.stock-card {
    position: relative;

    padding: 18px;

    min-width: 0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border:
        1px solid var(--border);

    border-radius: var(--radius);

    box-shadow:
        0 12px 36px rgba(0,0,0,.20);

    transition:
        transform .18s ease,
        border-color .18s ease,
        background .18s ease;
}

.stock-card:hover {
    transform: translateY(-2px);

    border-color:
        rgba(255,255,255,.14);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );
}

.stock-top {
    display: flex;
    justify-content: space-between;

    gap: 12px;
}

.stock-name {
    font-size: 19px;
    font-weight: 800;
}

.stock-symbol {
    margin-top: 3px;

    font-size: 12px;

    color: var(--muted);
}

.stock-price-row {
    display: flex;
    align-items: baseline;

    gap: 10px;

    margin-top: 22px;
}

.stock-price {
    font-size: 27px;
    font-weight: 800;

    letter-spacing: -.03em;
}

.stock-change {
    font-size: 14px;
    font-weight: 750;
}

.strength {
    display: inline-flex;
    align-items: center;

    gap: 6px;

    margin-top: 16px;

    padding: 7px 10px;

    border-radius: 9px;

    font-size: 12px;
    font-weight: 700;
}

.strength.strong {
    color: #75e7aa;
    background: var(--green-soft);
}

.strength.neutral {
    color: #f4d77f;
    background: var(--yellow-soft);
}

.strength.weak {
    color: #ff8994;
    background: var(--red-soft);
}

.advice {
    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px solid var(--border);

    color: var(--text);

    font-size: 13px;

    line-height: 1.5;
}

.advice-label {
    color: var(--muted2);
    font-size: 11px;

    margin-bottom: 3px;
}

.watch-button {
    width: 100%;

    margin-top: 15px;

    height: 38px;

    border:
        1px solid var(--border);

    border-radius: 10px;

    background: rgba(255,255,255,.035);

    color: var(--muted);

    cursor: pointer;
}

.watch-button:hover {
    color: var(--text);
    background: rgba(255,255,255,.07);
}

/* =========================================================
   HOLDING
========================================================= */

.holding-panel {
    margin-top: 15px;

    padding-top: 14px;

    border-top:
        1px solid var(--border);
}

.holding-row {
    display: flex;
    justify-content: space-between;

    gap: 10px;

    margin-bottom: 7px;

    font-size: 12px;
}

.holding-label {
    color: var(--muted2);
}

.holding-value {
    color: var(--text);
    font-weight: 650;
}

.holding-input {
    width: 100%;

    height: 36px;

    padding: 0 9px;

    margin-top: 7px;

    background: rgba(255,255,255,.04);

    border:
        1px solid var(--border);

    border-radius: 8px;

    color: var(--text);

    outline: none;
}

.profit {
    font-weight: 800;
}

.profit-positive {
    color: var(--red);
}

.profit-negative {
    color: var(--green);
}

.profit-neutral {
    color: var(--muted);
}

/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    padding: 50px 20px;

    text-align: center;

    border:
        1px dashed rgba(255,255,255,.12);

    border-radius: var(--radius);

    color: var(--muted);
}

.empty-title {
    color: var(--text);

    font-size: 17px;

    font-weight: 750;

    margin-bottom: 7px;
}

.empty-description {
    font-size: 13px;

    line-height: 1.6;
}

/* =========================================================
   ERROR
========================================================= */

.error-panel {
    display: none;

    margin-top: 20px;

    padding: 18px;

    border:
        1px solid rgba(255,77,94,.25);

    border-radius: 14px;

    background:
        rgba(255,77,94,.07);
}

.error-panel.show {
    display: block;
}

.error-title {
    color: #ff8792;

    font-weight: 750;

    margin-bottom: 6px;
}

.error-message {
    color: var(--muted);

    font-size: 13px;

    line-height: 1.6;

    white-space: pre-wrap;
}

/* =========================================================
   LOADING
========================================================= */

.loading {
    padding: 50px 20px;

    text-align: center;

    color: var(--muted);
}

.loading-dot {
    display: inline-block;

    width: 7px;
    height: 7px;

    margin: 0 3px;

    border-radius: 50%;

    background: var(--blue);

    animation: loading 1s infinite alternate;
}

.loading-dot:nth-child(2) {
    animation-delay: .2s;
}

.loading-dot:nth-child(3) {
    animation-delay: .4s;
}

@keyframes loading {
    from {
        opacity: .25;
        transform: translateY(2px);
    }

    to {
        opacity: 1;
        transform: translateY(-2px);
    }
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    margin-top: 40px;

    padding-top: 20px;

    border-top:
        1px solid var(--border);

    text-align: center;

    color: var(--muted2);

    font-size: 11px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 900px) {

    .stock-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 650px) {

    .app {
        width: min(100% - 20px, 1180px);
        padding-top: 20px;
    }

    .brand {
        flex-direction: column;
        gap: 12px;
    }

    .dashboard-grid {
        grid-template-columns: 1fr 1fr;
    }

    .tabs {
        grid-template-columns:
            repeat(5, minmax(0, 1fr));
    }

    .tab {
        font-size: 11px;
        padding: 10px 3px;
    }

    .stock-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 420px) {

    .dashboard-grid {
        gap: 9px;
    }

    .info-card {
        padding: 15px;
        min-height: 125px;
    }

    .info-value {
        font-size: 23px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-button {
        width: 100%;
    }
}
</style>
</head>

<body>

<div class="app">

<script>

/* ============================================================
   CONFIGURATION

   重要：
   這裡只使用目前專案真正存在的 UI 資料入口。

   禁止：
   ./Data/stocks.json

   因為目前專案沒有這個檔案。
============================================================ */

const DATA_URL = "./Data/ui_data.json";

const WATCHLIST_KEY =
    "ai_market_intelligence_watchlist_v1";


/* ============================================================
   GLOBAL STATE
============================================================ */

let dashboardData = null;

let allStocks = [];

let currentTab = "selected";


/* ============================================================
   DOM
============================================================ */

const contentArea =
    document.getElementById("contentArea");

const contentTitle =
    document.getElementById("contentTitle");

const contentDescription =
    document.getElementById("contentDescription");

const errorPanel =
    document.getElementById("errorPanel");

const errorMessage =
    document.getElementById("errorMessage");


/* ============================================================
   SAFE NUMBER
============================================================ */

function numberValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const n =
        Number(
            String(value)
                .replace(/,/g, "")
                .replace(/%/g, "")
        );

    return Number.isFinite(n)
        ? n
        : null;
}


/* ============================================================
   FORMAT NUMBER
============================================================ */

function formatNumber(
    value,
    digits = 0
) {

    const n =
        numberValue(value);

    if (n === null) {
        return "—";
    }

    return n.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }
    );
}


/* ============================================================
   FORMAT PERCENT
============================================================ */

function formatPercent(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "—";
    }

    return (
        n >= 0 ? "+" : ""
    )
    + n.toFixed(2)
    + "%";
}


/* ============================================================
   MARKET COLOR
============================================================ */

function marketClass(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "market-neutral";
    }

    if (n > 0) {
        return "market-up";
    }

    if (n < 0) {
        return "market-down";
    }

    return "market-neutral";
}


/* ============================================================
   WATCHLIST
============================================================ */

function getWatchlist() {

    try {

        const raw =
            localStorage.getItem(
                WATCHLIST_KEY
            );

        if (!raw) {
            return {};
        }

        const parsed =
            JSON.parse(raw);

        return (
            parsed &&
            typeof parsed === "object"
        )
            ? parsed
            : {};

    } catch {

        return {};
    }
}


function saveWatchlist(
    data
) {

    localStorage.setItem(
        WATCHLIST_KEY,
        JSON.stringify(data)
    );
}


/* ============================================================
   ADD WATCHLIST
============================================================ */

function addToWatchlist(
    symbol
) {

    if (!symbol) {
        return;
    }

    const watchlist =
        getWatchlist();

    if (!watchlist[symbol]) {

        watchlist[symbol] = {
            shares: 0,
            averageCost: 0
        };

        saveWatchlist(
            watchlist
        );
    }

    renderCurrentTab();

    updateTotalProfit();
}


/* ============================================================
   REMOVE WATCHLIST
============================================================ */

function removeFromWatchlist(
    symbol
) {

    const watchlist =
        getWatchlist();

    delete watchlist[symbol];

    saveWatchlist(
        watchlist
    );

    renderCurrentTab();

    updateTotalProfit();
}


/* ============================================================
   HOLDING INPUT
============================================================ */

function updateHolding(
    symbol,
    field,
    value
) {

    const watchlist =
        getWatchlist();

    if (!watchlist[symbol]) {

        watchlist[symbol] = {
            shares: 0,
            averageCost: 0
        };
    }

    const n =
        numberValue(value);

    watchlist[symbol][field] =
        n === null ? 0 : n;

    saveWatchlist(
        watchlist
    );

    updateTotalProfit();

    renderCurrentTab();
}


/* ============================================================
   NORMALIZE STOCK
============================================================ */

function normalizeStock(
    raw,
    fallbackSymbol = ""
) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {
        return null;
    }

    const symbol =
        String(
            raw.symbol ??
            raw.code ??
            raw.stock_id ??
            fallbackSymbol ??
            ""
        ).trim();

    if (!symbol) {
        return null;
    }

    const name =
        String(
            raw.name ??
            raw.stock_name ??
            raw.company_name ??
            symbol
        ).trim();

    const price =
        numberValue(
            raw.price ??
            raw.close ??
            raw.latest_price ??
            raw.current_price
        );

    const change =
        numberValue(
            raw.change_pct ??
            raw.change_percent ??
            raw.pct_change ??
            raw.changePercent
        );

    return {

        symbol,

        name,

        price,

        change,

        strength:
            raw.strength ??
            raw.signal_strength ??
            raw.level ??
            "中性",

        advice:
            raw.advice ??
            raw.recommendation ??
            raw.suggestion ??
            "觀察",

        category:
            String(
                raw.category ??
                raw.type ??
                "stock"
            ).toLowerCase(),

        selected:
            Boolean(
                raw.selected ??
                raw.is_selected ??
                raw.featured
            ),

        rank:
            numberValue(
                raw.rank ??
                raw.top_rank
            ),

        market:
            raw.market ??
            "TWSE",

        raw
    };
}


/* ============================================================
   EXTRACT STOCKS

   ui_data.json 的實際結構可能隨後端版本不同，
   因此只做結構容錯，不另外創造資料來源。
============================================================ */

function extractStocks(
    data
) {

    const result = [];

    function append(
        value
    ) {

        if (
            Array.isArray(value)
        ) {

            value.forEach(
                item => {

                    const stock =
                        normalizeStock(item);

                    if (stock) {
                        result.push(stock);
                    }
                }
            );

            return;
        }

        if (
            value &&
            typeof value === "object"
        ) {

            Object.entries(value)
                .forEach(
                    ([symbol, item]) => {

                        const stock =
                            normalizeStock(
                                item,
                                symbol
                            );

                        if (stock) {
                            result.push(stock);
                        }
                    }
                );
        }
    }


    if (!data) {
        return [];
    }


    append(
        data.stocks
    );

    append(
        data.selected
    );

    append(
        data.featured
    );

    append(
        data.top10
    );

    append(
        data.top_10
    );

    append(
        data.etf
    );

    append(
        data.bond
    );


    if (
        data.data
    ) {

        append(
            data.data.stocks
        );

        append(
            data.data.selected
        );

        append(
            data.data.featured
        );

        append(
            data.data.top10
        );

        append(
            data.data.top_10
        );

        append(
            data.data.etf
        );

        append(
            data.data.bond
        );
    }


    if (
        data.dashboard
    ) {

        append(
            data.dashboard.stocks
        );

        append(
            data.dashboard.selected
        );
    }


    const unique =
        new Map();

    result.forEach(
        stock => {

            if (
                !unique.has(
                    stock.symbol
                )
            ) {

                unique.set(
                    stock.symbol,
                    stock
                );
            }
        }
    );

    return Array.from(
        unique.values()
    );
}

/* ============================================================
   STOCK STRENGTH
============================================================ */

function strengthClass(
    strength
) {

    const text =
        String(
            strength || ""
        );

    if (
        text.includes("強")
    ) {
        return "strong";
    }

    if (
        text.includes("弱")
    ) {
        return "weak";
    }

    return "neutral";
}


function strengthText(
    strength
) {

    const text =
        String(
            strength || ""
        );

    if (
        text.includes("強")
    ) {
        return "🟢 強勢";
    }

    if (
        text.includes("弱")
    ) {
        return "🔴 弱勢";
    }

    return "🟡 中性";
}


/* ============================================================
   STOCK CARD
============================================================ */

function renderStockCard(
    stock,
    options = {}
) {

    const watchlist =
        getWatchlist();

    const holding =
        watchlist[
            stock.symbol
        ];

    const change =
        stock.change;

    const changeClass =
        marketClass(change);

    const changeText =
        formatPercent(change);

    let holdingHtml = "";


    /* --------------------------------------------------------
       我的清單才顯示持倉資訊
    -------------------------------------------------------- */

    if (
        options.watchlist
    ) {

        const shares =
            numberValue(
                holding?.shares
            ) || 0;

        const averageCost =
            numberValue(
                holding?.averageCost
            ) || 0;

        const marketValue =
            stock.price !== null
                ? stock.price * shares
                : null;

        const cost =
            averageCost * shares;

        const profit =
            marketValue !== null
                ? marketValue - cost
                : null;

        const returnPct =
            cost > 0 &&
            profit !== null
                ? (
                    profit /
                    cost *
                    100
                )
                : null;

        let profitClass =
            "profit-neutral";

        if (
            profit !== null &&
            profit > 0
        ) {

            profitClass =
                "profit-positive";

        } else if (
            profit !== null &&
            profit < 0
        ) {

            profitClass =
                "profit-negative";
        }


        holdingHtml = `

            <div class="holding-panel">

                <div class="holding-row">
                    <span class="holding-label">
                        持有股數
                    </span>

                    <span class="holding-value">
                        ${formatNumber(shares)} 股
                    </span>
                </div>

                <input
                    class="holding-input"
                    type="number"
                    min="0"
                    step="1"
                    value="${shares || ""}"
                    placeholder="輸入持有股數"
                    data-holding-field="shares"
                    data-symbol="${stock.symbol}"
                >

                <div class="holding-row"
                     style="margin-top:12px;">
                    <span class="holding-label">
                        平均成本
                    </span>

                    <span class="holding-value">
                        ${
                            averageCost > 0
                                ? formatNumber(
                                    averageCost,
                                    2
                                )
                                : "尚未輸入"
                        }
                    </span>
                </div>

                <input
                    class="holding-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="${averageCost || ""}"
                    placeholder="輸入平均成本"
                    data-holding-field="averageCost"
                    data-symbol="${stock.symbol}"
                >

                <div class="holding-row"
                     style="margin-top:12px;">

                    <span class="holding-label">
                        目前市值
                    </span>

                    <span class="holding-value">
                        ${
                            marketValue !== null
                                ? formatNumber(
                                    marketValue
                                ) + " 元"
                                : "—"
                        }
                    </span>

                </div>

                <div class="holding-row">

                    <span class="holding-label">
                        損益
                    </span>

                    <span
                        class="holding-value ${profitClass}"
                    >
                        ${
                            profit !== null
                                ? (
                                    profit >= 0
                                        ? "+"
                                        : ""
                                )
                                + formatNumber(
                                    profit
                                )
                                + " 元"
                                : "—"
                        }
                    </span>

                </div>

                <div class="holding-row">

                    <span class="holding-label">
                        報酬率
                    </span>

                    <span
                        class="holding-value ${profitClass}"
                    >
                        ${
                            returnPct !== null
                                ? formatPercent(
                                    returnPct
                                )
                                : "—"
                        }
                    </span>

                </div>

            </div>
        `;
    }


    return `

        <article class="stock-card">

            <div class="stock-top">

                <div>

                    <div class="stock-name">
                        ${escapeHtml(
                            stock.name
                        )}
                    </div>

                    <div class="stock-symbol">
                        ${escapeHtml(
                            stock.symbol
                        )}
                    </div>

                </div>

            </div>


            <div class="stock-price-row">

                <div class="stock-price">
                    ${
                        stock.price !== null
                            ? formatNumber(
                                stock.price,
                                2
                            )
                            : "—"
                    }
                </div>

                <div
                    class="stock-change ${changeClass}"
                >
                    ${changeText}
                </div>

            </div>


            <div
                class="strength ${strengthClass(
                    stock.strength
                )}"
            >
                ${strengthText(
                    stock.strength
                )}
            </div>


            <div class="advice">

                <div class="advice-label">
                    建議
                </div>

                <div>
                    ${escapeHtml(
                        stock.advice
                    )}
                </div>

            </div>


            ${holdingHtml}


            ${
                options.watchlist
                    ? `

                            class="watch-button"
                            data-remove-symbol="${stock.symbol}"
                        >

                        </button>
                    `
                    : `
                        <button
                            class="watch-button"
                            data-add-symbol="${stock.symbol}"
                        >
                            ＋ 加入我的清單
                        </button>
                    `
            }

        </article>
    `;
}


/* ============================================================
   ESCAPE HTML
============================================================ */

function escapeHtml(
    value
) {

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}


/* ============================================================
   GET TAB STOCKS
============================================================ */

function getTabStocks(
    tab
) {

    const watchlist =
        getWatchlist();

    if (
        tab === "watchlist"
    ) {

        return allStocks.filter(
            stock =>
                Boolean(
                    watchlist[
                        stock.symbol
                    ]
                )
        );
    }


    if (
        tab === "selected"
    ) {

        const selected =
            allStocks.filter(
                stock =>
                    stock.selected
            );

        if (
            selected.length
        ) {
            return selected;
        }

        /*
         * 如果後端尚未提供 selected
         * 標記，不假造選股結果。
         */
        return [];
    }


    if (
        tab === "top10"
    ) {

        return allStocks
            .filter(
                stock =>
                    stock.rank !== null
            )
            .sort(
                (a, b) =>
                    a.rank - b.rank
            )
            .slice(
                0,
                10
            );
    }


    if (
        tab === "etf"
    ) {

        return allStocks.filter(
            stock =>
                stock.category === "etf"
        );
    }


    if (
        tab === "bond"
    ) {

        return allStocks.filter(
            stock =>
                stock.category === "bond"
        );
    }


    return [];
}

/* ============================================================
   TOTAL PROFIT
============================================================ */

function updateTotalProfit() {

    const watchlist =
        getWatchlist();

    const symbols =
        Object.keys(
            watchlist
        );

    const profitEl =
        document.getElementById(
            "totalProfit"
        );


    if (
        symbols.length === 0
    ) {

        profitEl.textContent =
            "尚未建立持倉";

        profitEl.className =
            "info-value";

        return;
    }


    let total = 0;

    let hasHolding = false;


    symbols.forEach(
        symbol => {

            const stock =
                allStocks.find(
                    s =>
                        s.symbol === symbol
                );

            const holding =
                watchlist[symbol];

            if (
                !stock ||
                stock.price === null
            ) {
                return;
            }

            const shares =
                numberValue(
                    holding.shares
                ) || 0;

            const averageCost =
                numberValue(
                    holding.averageCost
                ) || 0;

            if (
                shares <= 0 ||
                averageCost <= 0
            ) {
                return;
            }

            hasHolding = true;

            total +=
                (
                    stock.price -
                    averageCost
                )
                *
                shares;
        }
    );


    if (
        !hasHolding
    ) {

        profitEl.textContent =
            "尚未建立持倉";

        profitEl.className =
            "info-value";

        return;
    }


    profitEl.textContent =
        (
            total >= 0
                ? "+"
                : ""
        )
        +
        formatNumber(total)
        +
        " 元";


    if (
        total > 0
    ) {

        profitEl.className =
            "info-value market-up";

    } else if (
        total < 0
    ) {

        profitEl.className =
            "info-value market-down";

    } else {

        profitEl.className =
            "info-value market-neutral";
    }
}

                        stock.name
                    )}

                        stock.symbol
                    )}

                            ? " · " +
                              formatNumber(
                                  stock.price,

                              )

                    <div
                        style="
                            color:var(--green);
                            font-size:13px;
                        "
                    >
                        ✓ ${escapeHtml(
                            stock.name
                        )}
                        已加入我的清單
                    </div>
                `;
            }
        );
}


/* ============================================================
   TAB EVENTS
============================================================ */

document
    .querySelectorAll(
        ".tab"
    )
    .forEach(
        tab => {

            tab.addEventListener(
                "click",
                () => {

                    document
                        .querySelectorAll(
                            ".tab"
                        )
                        .forEach(
                            item =>
                                item.classList.remove(
                                    "active"
                                )
                        );

                    tab.classList.add(
                        "active"
                    );

                    currentTab =
                        tab.dataset.tab;

                    renderCurrentTab();
                }
            );
        }
    );

    .getElementById(

/* ============================================================
   LOAD UI DATA
============================================================ */

async function loadDashboardData() {

    errorPanel.classList.remove(
        "show"
    );


    try {

        /*
         * 唯一正式資料入口：
         *
         * ./Data/ui_data.json
         *
         * 不再請求：
         *
         * ./Data/stocks.json
         */

        const response =
            await fetch(
                DATA_URL,
                {
                    cache: "no-store"
                }
            );


        if (
            response.status === 404
        ) {

            throw new Error(
                "HTTP 404：./Data/ui_data.json 不存在"
            );
        }


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}：${DATA_URL}`
            );
        }


        const data =
            await response.json();


        if (
            !data ||
            typeof data !== "object"
        ) {

            throw new Error(
                "ui_data.json 格式錯誤"
            );
        }


        dashboardData =
            data;


        allStocks =
            extractStocks(
                data
            );


        renderHeader(
            data
        );


        renderDashboardCards(
            data
        );


        renderCurrentTab();


    } catch (error) {

        console.error(
            "Dashboard load error:",
            error
        );


        contentArea.innerHTML = `

            <div class="empty-state">

                <div class="empty-title">
                    資料尚未準備完成
                </div>

                <div class="empty-description">
                    儀表板目前無法取得後台 UI 資料。
                </div>

            </div>
        `;


        errorMessage.textContent =
            error.message ||
            String(error);


        errorPanel.classList.add(
            "show"
        );


        document.getElementById(
            "latestDate"
        ).textContent =
            "最新交易日：尚無資料";


        document.getElementById(
            "selectedCount"
        ).textContent =
            "—";


        document.getElementById(
            "marketIndex"
        ).textContent =
            "—";


        document.getElementById(
            "marketIndexChange"
        ).textContent =
            "尚無大盤資料";


        document.getElementById(
            "marketTrend"
        ).textContent =
            "—";


        document.getElementById(
            "marketTrendDescription"
        ).textContent =
            "尚無市場風向資料";


        updateTotalProfit();
    }
}


/* ============================================================
   INIT
============================================================ */

loadDashboardData();

</script>
