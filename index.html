<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>台股 AI 選股儀表板 V8.0</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
    background:#f1f5f9;
    color:#0f172a;
}

header{
    background:#0f172a;
    color:white;
    padding:22px 18px;
}

.header-inner{
    max-width:1400px;
    margin:auto;
}

h1{
    margin:0;
    font-size:25px;
}

.subtitle{
    margin-top:7px;
    color:#cbd5e1;
    font-size:14px;
}

.container{
    max-width:1400px;
    margin:auto;
    padding:18px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:18px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:
        0 2px 8px rgba(15,23,42,.07);
}

.card-title{
    color:#64748b;
    font-size:13px;
    margin-bottom:8px;
}

.card-value{
    font-size:28px;
    font-weight:800;
}

.card-sub{
    margin-top:5px;
    color:#64748b;
    font-size:12px;
}

.section{
    margin-top:20px;
}

.section-title{
    font-size:20px;
    font-weight:800;
    margin-bottom:12px;
}

.status{
    display:inline-flex;
    align-items:center;
    gap:6px;
    border-radius:999px;
    padding:5px 10px;
    font-size:12px;
    font-weight:700;
}

.status-good{
    background:#dcfce7;
    color:#166534;
}

.status-warn{
    background:#fef3c7;
    color:#92400e;
}

.status-bad{
    background:#fee2e2;
    color:#991b1b;
}

.table-wrap{
    overflow-x:auto;
    background:white;
    border-radius:16px;
    box-shadow:
        0 2px 8px rgba(15,23,42,.07);
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:900px;
}

th{
    background:#f8fafc;
    color:#475569;
    font-size:13px;
    text-align:left;
    padding:12px;
    white-space:nowrap;
}

td{
    padding:12px;
    border-top:1px solid #e2e8f0;
    font-size:14px;
    white-space:nowrap;
}

.stock-code{
    font-weight:800;
}

.stock-name{
    color:#475569;
}

.price{
    font-weight:800;
}

.up{
    color:#dc2626;
    font-weight:700;
}

.down{
    color:#16a34a;
    font-weight:700;
}

.neutral{
    color:#64748b;
}

.score{
    font-weight:800;
}

.search-box{
    display:flex;
    gap:10px;
    margin-bottom:12px;
}

input{
    flex:1;
    padding:12px 14px;
    border:
        1px solid #cbd5e1;
    border-radius:10px;
    font-size:15px;
    outline:none;
}

input:focus{
    border-color:#64748b;
}

button{
    border:0;
    border-radius:10px;
    padding:11px 16px;
    background:#0f172a;
    color:white;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

.pick-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:14px;
}

.pick{
    background:white;
    border-radius:16px;
    padding:17px;
    box-shadow:
        0 2px 8px rgba(15,23,42,.07);
    border-left:5px solid #16a34a;
}

.pick-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.pick-code{
    font-size:20px;
    font-weight:800;
}

.pick-name{
    color:#64748b;
    margin-top:3px;
}

.pick-price{
    font-size:25px;
    font-weight:800;
    margin-top:12px;
}

.conditions{
    display:grid;
    grid-template-columns:
        repeat(2,minmax(0,1fr));
    gap:7px;
    margin-top:13px;
}

.condition{
    padding:8px;
    border-radius:8px;
    font-size:12px;
    font-weight:700;
}

.pass{
    background:#dcfce7;
    color:#166534;
}

.fail{
    background:#fee2e2;
    color:#991b1b;
}

.backtest-grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(280px,1fr));
    gap:14px;
}

.backtest-card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:
        0 2px 8px rgba(15,23,42,.07);
}

.backtest-card h3{
    margin-top:0;
}

.metric{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #e2e8f0;
}

.metric:last-child{
    border-bottom:0;
}

.empty{
    padding:30px;
    text-align:center;
    color:#64748b;
    background:white;
    border-radius:16px;
}

.loading{
    text-align:center;
    padding:50px;
    color:#64748b;
}

footer{
    max-width:1400px;
    margin:20px auto;
    padding:0 18px 30px;
    color:#64748b;
    font-size:12px;
}

@media(max-width:600px){
    .container{
        padding:12px;
    }

    header{
        padding:18px 14px;
    }

    h1{
        font-size:21px;
    }

    .card-value{
        font-size:24px;
    }

    .conditions{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
<div class="header-inner">
    <h1>台股 AI 選股儀表板</h1>
    <div class="subtitle">
        V8.0｜後台計算・前台顯示｜目前維持多方
    </div>
</div>
</header>

<main class="container">

<div id="loading" class="loading">
    正在讀取最新市場資料……
</div>

<div id="app" style="display:none;">

    <!-- =====================================================
         市場摘要
    ====================================================== -->

    <section>
        <div class="grid">

            <div class="card">
                <div class="card-title">
                    股票資料
                </div>
                <div id="stockCount" class="card-value">
                    -
                </div>
                <div class="card-sub">
                    後台成功取得
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    ETF
                </div>
                <div id="etfCount" class="card-value">
                    -
                </div>
                <div class="card-sub">
                    獨立分析
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    今日 6 / 6
                </div>
                <div id="selectedCount" class="card-value">
                    -
                </div>
                <div class="card-sub">
                    六項條件全部符合
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    回測樣本
                </div>
                <div id="backtestCount" class="card-value">
                    -
                </div>
                <div class="card-sub">
                    歷史有效股票
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    資料日期
                </div>
                <div id="dataDate" class="card-value"
                     style="font-size:18px;">
                    -
                </div>
                <div class="card-sub">
                    台灣時間
                </div>
            </div>

            <div class="card">
                <div class="card-title">
                    系統狀態
                </div>
                <div id="systemStatus">
                    -
                </div>
                <div id="updateTime"
                     class="card-sub">
                    -
                </div>
            </div>

        </div>
    </section>


    <!-- =====================================================
         今日精選
    ====================================================== -->

    <section class="section">

        <div class="section-title">
            今日符合六項核心條件
        </div>

        <div id="todayPicks"
             class="pick-grid">
        </div>

    </section>


    <!-- =====================================================
         AI Top 30
    ====================================================== -->

    <section class="section">

        <div class="section-title">
            AI Top 30
        </div>

        <div class="table-wrap">

            <table>

                <thead>
                <tr>
                    <th>排名</th>
                    <th>代號</th>
                    <th>名稱</th>
                    <th>價格</th>
                    <th>漲跌</th>
                    <th>AI Score</th>
                    <th>核心條件</th>
                    <th>訊號</th>
                </tr>
                </thead>

                <tbody id="topTable">
                </tbody>

            </table>

        </div>

    </section>


    <!-- =====================================================
         市場搜尋
    ====================================================== -->

    <section class="section">

        <div class="section-title">
            全市場股票搜尋
        </div>

        <div class="search-box">

            <input
                id="searchInput"
                type="search"
                placeholder="輸入股票代號或名稱，例如 2330、台積電"
            >

            <button onclick="searchStocks()">
                搜尋
            </button>

        </div>

        <div class="table-wrap">

            <table>

                <thead>
                <tr>
                    <th>代號</th>
                    <th>名稱</th>
                    <th>價格</th>
                    <th>漲跌</th>
                    <th>RSI</th>
                    <th>K</th>
                    <th>D</th>
                    <th>MACD</th>
                    <th>成交量比</th>
                    <th>核心</th>
                    <th>訊號</th>
                </tr>
                </thead>

                <tbody id="searchTable">
                </tbody>

            </table>

        </div>

    </section>


    <!-- =====================================================
         A/B 回測
    ====================================================== -->

    <section class="section">

        <div class="section-title">
            A / B 歷史回測
        </div>

        <div id="backtestGrid"
             class="backtest-grid">
        </div>

    </section>


    <!-- =====================================================
         定投入口
    ====================================================== -->

    <section class="section">

        <div class="card">

            <div class="section-title">
                零股定投
            </div>

            <div style="color:#64748b;margin-bottom:14px;">
                零股定投系統已與短線選股完全分離。
            </div>

            <button onclick="location.href='dca.html'">
                開啟零股定投儀表板
            </button>

        </div>

    </section>

</div>

</main>

<footer>
    台股 AI 選股系統 V8.0｜
    技術指標與回測結果由後台資料引擎產生。
</footer>


<script>

const DATA_URL =
    "./Data/prices.json";

const BACKTEST_URL =
    "./Data/backtest.json";

let stockData = [];

let backtestData = null;


/* ============================================================
   工具
============================================================ */

function escapeHtml(value){

    return String(value ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


function formatNumber(value,digits=2){

    if(
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ){
        return "-";
    }

    return Number(value).toFixed(digits);
}


function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ){
        return "-";
    }

    const n = Number(value);

    const sign =
        n > 0 ? "+" : "";

    return sign +
        n.toFixed(2) +
        "%";
}


function changeClass(value){

    if(value > 0){
        return "up";
    }

    if(value < 0){
        return "down";
    }

    return "neutral";
}


function condition(value,label){

    return `
        <div class="condition ${value ? "pass":"fail"}">
            ${value ? "✓":"✕"} ${label}
        </div>
    `;
}


/* ============================================================
   載入資料
============================================================ */

async function loadData(){

    try{

        const cacheBust =
            "?t=" +
            Date.now();

        const [
            priceResponse,
            backtestResponse
        ] = await Promise.all([

            fetch(
                DATA_URL +
                cacheBust,
                {
                    cache:"no-store"
                }
            ),

            fetch(
                BACKTEST_URL +
                cacheBust,
                {
                    cache:"no-store"
                }
            )
        ]);


        if(!priceResponse.ok){

            throw new Error(
                "prices.json 讀取失敗"
            );
        }


        const prices =
            await priceResponse.json();


        if(backtestResponse.ok){

            backtestData =
                await backtestResponse.json();

        }else{

            backtestData = null;

        }


        stockData =
            Array.isArray(prices.stocks)
                ? prices.stocks
                : [];


        renderDashboard(prices);

    }catch(error){

        document.getElementById(
            "loading"
        ).innerHTML =
            `
            <div style="color:#991b1b;">
                資料讀取失敗
            </div>
            <div style="margin-top:8px;font-size:13px;">
                ${escapeHtml(error.message)}
            </div>
            `;

        console.error(error);

    }
}


/* ============================================================
   Dashboard
============================================================ */

function renderDashboard(data){

    document.getElementById(
        "loading"
    ).style.display = "none";

    document.getElementById(
        "app"
    ).style.display = "block";


    const statistics =
        data.statistics || {};


    document.getElementById(
        "stockCount"
    ).textContent =
        statistics.stock_count ??
        stockData.length;


    document.getElementById(
        "etfCount"
    ).textContent =
        statistics.etf_count ?? 0;


    document.getElementById(
        "selectedCount"
    ).textContent =
        statistics.today_selected_count ??
        0;


    document.getElementById(
        "backtestCount"
    ).textContent =
        statistics.backtest_stock_count ??
        0;


    document.getElementById(
        "dataDate"
    ).textContent =
        data.date || "-";


    document.getElementById(
        "updateTime"
    ).textContent =
        data.updated_at_tw || "-";


    document.getElementById(
        "systemStatus"
    ).innerHTML =
        data.status === "success"
            ? `<span class="status status-good">
                ● 正常
               </span>`
            : `<span class="status status-bad">
                ● 異常
               </span>`;


    renderTodayPicks(
        data.today_selected ||
        data.today_picks ||
        []
    );


    renderTop30(
        data.top30 ||
        stockData.slice(0,30)
    );


    renderSearch(
        stockData
    );


    renderBacktest(
        data.backtest_summary ||
        backtestData?.comparison ||
        null
    );
}


/* ============================================================
   今日精選
============================================================ */

function renderTodayPicks(list){

    const container =
        document.getElementById(
            "todayPicks"
        );


    if(!list.length){

        container.innerHTML =
            `
            <div class="empty">
                今日沒有符合 6 / 6 核心條件的股票。
            </div>
            `;

        return;
    }


    container.innerHTML =
        list.map(stock => {

            return `
            <div class="pick">

                <div class="pick-head">

                    <div>
                        <div class="pick-code">
                            ${escapeHtml(stock.code)}
                        </div>

                        <div class="pick-name">
                            ${escapeHtml(stock.name)}
                        </div>
                    </div>

                    <span class="status status-good">
                        6 / 6
                    </span>

                </div>


                <div class="pick-price">
                    ${formatNumber(stock.price)}
                </div>


                <div class="${changeClass(stock.change_pct)}">
                    ${formatPercent(stock.change_pct)}
                </div>


                <div class="conditions">

                    ${condition(
                        stock.macd_golden_cross,
                        "MACD 多方"
                    )}

                    ${condition(
                        stock.rsi_over_50,
                        "RSI > 50"
                    )}

                    ${condition(
                        stock.kd_golden_cross,
                        "KD 多方"
                    )}

                    ${condition(
                        stock.volume_expand,
                        "成交量放大"
                    )}

                    ${condition(
                        stock.price_over_ma20,
                        "股價 > MA20"
                    )}

                    ${condition(
                        stock.ma20_up,
                        "MA20 向上"
                    )}

                </div>


                <div style="
                    margin-top:14px;
                    color:#64748b;
                    font-size:13px;
                ">
                    AI Score：
                    <strong>
                        ${formatNumber(stock.ai_score)}
                    </strong>
                </div>

            </div>
            `;

        }).join("");
}


/* ============================================================
   Top 30
============================================================ */

function renderTop30(list){

    const table =
        document.getElementById(
            "topTable"
        );


    table.innerHTML =
        list.map((stock,index) => {

            return `
            <tr>

                <td>
                    <strong>
                        ${index + 1}
                    </strong>
                </td>

                <td class="stock-code">
                    ${escapeHtml(stock.code)}
                </td>

                <td class="stock-name">
                    ${escapeHtml(stock.name)}
                </td>

                <td class="price">
                    ${formatNumber(stock.price)}
                </td>

                <td class="${changeClass(stock.change_pct)}">
                    ${formatPercent(stock.change_pct)}
                </td>

                <td class="score">
                    ${formatNumber(stock.ai_score)}
                </td>

                <td>
                    ${
                        stock.core_score ??
                        "-"
                    }
                    /
                    ${
                        stock.core_total ??
                        6
                    }
                </td>

                <td>
                    ${escapeHtml(stock.signal || "-")}
                </td>

            </tr>
            `;

        }).join("");
}


/* ============================================================
   搜尋
============================================================ */

function searchStocks(){

    const input =
        document.getElementById(
            "searchInput"
        );

    const keyword =
        input.value
            .trim()
            .toLowerCase();


    const filtered =
        keyword
            ? stockData.filter(stock => {

                const code =
                    String(
                        stock.code || ""
                    ).toLowerCase();

                const name =
                    String(
                        stock.name || ""
                    ).toLowerCase();

                return (
                    code.includes(keyword) ||
                    name.includes(keyword)
                );

            })
            : stockData;


    renderSearch(
        filtered.slice(0,100)
    );
}


function renderSearch(list){

    const table =
        document.getElementById(
            "searchTable"
        );


    if(!list.length){

        table.innerHTML =
            `
            <tr>
                <td colspan="11"
                    style="text-align:center;">
                    找不到資料
                </td>
            </tr>
            `;

        return;
    }


    table.innerHTML =
        list.map(stock => {

            return `
            <tr>

                <td class="stock-code">
                    ${escapeHtml(stock.code)}
                </td>

                <td class="stock-name">
                    ${escapeHtml(stock.name)}
                </td>

                <td class="price">
                    ${formatNumber(stock.price)}
                </td>

                <td class="${changeClass(stock.change_pct)}">
                    ${formatPercent(stock.change_pct)}
                </td>

                <td>
                    ${formatNumber(stock.rsi)}
                </td>

                <td>
                    ${formatNumber(stock.k)}
                </td>

                <td>
                    ${formatNumber(stock.d)}
                </td>

                <td>
                    ${formatNumber(stock.macd)}
                </td>

                <td>
                    ${
                        stock.volume_ratio == null
                            ? "-"
                            : formatNumber(
                                stock.volume_ratio,
                                2
                              ) + "x"
                    }
                </td>

                <td>
                    ${
                        stock.core_score ??
                        "-"
                    } / 6
                </td>

                <td>
                    ${escapeHtml(stock.signal || "-")}
                </td>

            </tr>
            `;

        }).join("");
}


/* ============================================================
   Enter 搜尋
============================================================ */

document
    .getElementById("searchInput")
    .addEventListener(
        "keydown",
        event => {

            if(event.key === "Enter"){

                searchStocks();

            }

        }
    );


/* ============================================================
   回測
============================================================ */

function renderBacktest(comparison){

    const container =
        document.getElementById(
            "backtestGrid"
        );


    if(
        !comparison ||
        !comparison.strategies
    ){

        container.innerHTML =
            `
            <div class="empty">
                尚無有效回測資料。
            </div>
            `;

        return;
    }


    const strategies =
        comparison.strategies;


    const names = {

        A_today_cross:
            "A｜當日黃金交叉",

        B_current_bullish:
            "B｜目前維持多方"

    };


    container.innerHTML =
        Object.keys(names)
            .map(strategy => {

                const data =
                    strategies[strategy];


                if(!data){
                    return "";
                }


                return `
                <div class="backtest-card">

                    <h3>
                        ${names[strategy]}
                    </h3>

                    <div class="metric">
                        <span>5 日勝率</span>
                        <strong>
                            ${formatNumber(
                                data["5d"]?.win_rate
                            )}%
                        </strong>
                    </div>

                    <div class="metric">
                        <span>10 日勝率</span>
                        <strong>
                            ${formatNumber(
                                data["10d"]?.win_rate
                            )}%
                        </strong>
                    </div>

                    <div class="metric">
                        <span>20 日勝率</span>
                        <strong>
                            ${formatNumber(
                                data["20d"]?.win_rate
                            )}%
                        </strong>
                    </div>

                    <div class="metric">
                        <span>10 日平均報酬</span>
                        <strong>
                            ${formatPercent(
                                data["10d"]?.average_return
                            )}
                        </strong>
                    </div>

                    <div class="metric">
                        <span>10 日訊號數</span>
                        <strong>
                            ${
                                data["10d"]?.signals ??
                                0
                            }
                        </strong>
                    </div>

                </div>
                `;

            })
            .join("");


    const better =
        comparison.better_by_win_rate;


    if(better){

        container.insertAdjacentHTML(
            "afterbegin",

            `
            <div class="backtest-card">

                <h3>
                    回測比較
                </h3>

                <div class="metric">
                    <span>
                        比較基準
                    </span>

                    <strong>
                        ${
                            comparison.comparison_horizon ??
                            10
                        } 日
                    </strong>
                </div>

                <div class="metric">
                    <span>
                        勝率較高
                    </span>

                    <strong>
                        ${
                            better === "A_today_cross"
                                ? "A｜當日黃金交叉"
                                : better === "B_current_bullish"
                                    ? "B｜目前維持多方"
                                    : better === "tie"
                                        ? "兩者相同"
                                        : "資料不足"
                        }
                    </strong>
                </div>

            </div>
            `
        );
    }
}
