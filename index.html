<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI MARKET INTELLIGENCE｜台股市場</title>

<style>
:root {
    --bg: #080b12;
    --bg2: #0d111a;
    --panel: #111722;
    --panel2: #151c28;
    --border: rgba(255,255,255,.08);

    --text: #f4f7fb;
    --muted: #8d98a8;
    --muted2: #667182;

    --red: #ff4d5e;
    --red-soft: rgba(255,77,94,.12);

    --green: #27d17f;
    --green-soft: rgba(39,209,127,.12);

    --yellow: #f4c95d;
    --yellow-soft: rgba(244,201,93,.12);

    --blue: #5d8cff;
    --blue-soft: rgba(93,140,255,.12);

    --shadow: 0 18px 50px rgba(0,0,0,.28);
    --radius: 18px;
}

* {
    box-sizing: border-box;
}

html {
    background: var(--bg);
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "PingFang TC",
        "Noto Sans TC",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 10% 0%,
            rgba(93,140,255,.10),
            transparent 32%
        ),
        radial-gradient(
            circle at 90% 15%,
            rgba(39,209,127,.06),
            transparent 28%
        ),
        linear-gradient(
            180deg,
            #080b12 0%,
            #0a0e16 100%
        );
}

.app {
    width: min(1180px, calc(100% - 28px));
    margin: 0 auto;
    padding: 28px 0 60px;
}

.header {
    margin-bottom: 22px;
}

.brand {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
}

.brand-title {
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 800;
    letter-spacing: .04em;
    line-height: 1.1;
}

.brand-subtitle {
    margin-top: 7px;
    font-size: 15px;
    color: var(--muted);
}

.brand-caption {
    margin-top: 5px;
    font-size: 13px;
    color: var(--muted2);
}

.market-status {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,.045);
    border: 1px solid var(--border);
    white-space: nowrap;
    font-size: 13px;
    color: var(--muted);
}

.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
}

.status-dot.open {
    background: var(--green);
    box-shadow: 0 0 12px rgba(39,209,127,.7);
}

.status-dot.closed {
    background: var(--red);
    box-shadow: 0 0 12px rgba(255,77,94,.6);
}

.latest-date {
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
}

.dashboard-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 22px;
}

.info-card {
    position: relative;
    overflow: hidden;
    padding: 20px;
    min-height: 140px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}

.info-card::after {
    content: "";
    position: absolute;
    width: 120px;
    height: 120px;
    right: -50px;
    bottom: -50px;
    border-radius: 50%;
    background: rgba(255,255,255,.025);
}

.info-label {
    position: relative;
    z-index: 1;
    color: var(--muted);
    font-size: 13px;
}

.info-value {
    position: relative;
    z-index: 1;
    margin-top: 12px;
    font-size: clamp(25px, 5vw, 34px);
    font-weight: 800;
    letter-spacing: -.02em;
}

.info-description {
    position: relative;
    z-index: 1;
    margin-top: 5px;
    color: var(--muted2);
    font-size: 12px;
}

.market-up {
    color: var(--red);
}

.market-down {
    color: var(--green);
}

.market-neutral {
    color: var(--yellow);
}

.search-section {
    margin-bottom: 22px;
}

.section-title {
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 10px;
}

.search-box {
    display: flex;
    gap: 10px;
}

.search-input {
    flex: 1;
    min-width: 0;
    height: 48px;
    padding: 0 15px;

    border: 1px solid var(--border);
    border-radius: 12px;

    background: rgba(255,255,255,.045);
    color: var(--text);

    outline: none;
    font-size: 14px;
}

.search-input::placeholder {
    color: var(--muted2);
}

.search-input:focus {
    border-color: rgba(93,140,255,.55);
    background: rgba(255,255,255,.06);
}

.search-button {
    height: 48px;
    padding: 0 20px;
    border: 0;
    border-radius: 12px;
    background: var(--blue);
    color: white;
    font-weight: 700;
    cursor: pointer;
}

.search-result {
    display: none;
    margin-top: 12px;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 14px;
    background: rgba(255,255,255,.035);
}

.search-result.show {
    display: block;
}

.search-result-main {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.search-result-name {
    font-size: 17px;
    font-weight: 750;
}

.search-result-symbol {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
}

.add-watch-button {
    border: 1px solid rgba(93,140,255,.35);
    background: var(--blue-soft);
    color: #9bb6ff;
    padding: 9px 13px;
    border-radius: 10px;
    cursor: pointer;
    white-space: nowrap;
}

.tabs {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    padding: 5px;
    margin-bottom: 20px;

    background: rgba(255,255,255,.035);
    border: 1px solid var(--border);
    border-radius: 14px;
}

.tab {
    border: 0;
    padding: 11px 8px;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 650;
}

.tab.active {
    background: rgba(255,255,255,.09);
    color: var(--text);
}

.content-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 15px;
    margin-bottom: 13px;
}

.content-title {
    font-size: 19px;
    font-weight: 800;
}

.content-description {
    margin-top: 4px;
    color: var(--muted);
    font-size: 12px;
}

.stock-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 14px;
}

.stock-card {
    position: relative;
    padding: 18px;
    min-width: 0;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.055),
            rgba(255,255,255,.018)
        );

    border: 1px solid var(--border);
    border-radius: var(--radius);

    box-shadow:
        0 12px 36px rgba(0,0,0,.20);

    transition:
        transform .18s ease,
        border-color .18s ease;
}

.stock-card:hover {
    transform: translateY(-2px);
    border-color: rgba(255,255,255,.14);
}

.stock-top {
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.stock-name {
    font-size: 19px;
    font-weight: 800;
}

.stock-symbol {
    margin-top: 3px;
    font-size: 12px;
    color: var(--muted);
}

.stock-price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 22px;
}

.stock-price {
    font-size: 27px;
    font-weight: 800;
    letter-spacing: -.03em;
}

.stock-change {
    font-size: 14px;
    font-weight: 750;
}

.strength {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    padding: 7px 10px;
    border-radius: 9px;
    font-size: 12px;
    font-weight: 700;
}

.strength.strong {
    color: #75e7aa;
    background: var(--green-soft);
}

.strength.neutral {
    color: #f4d77f;
    background: var(--yellow-soft);
}

.strength.weak {
    color: #ff8994;
    background: var(--red-soft);
}

.advice {
    margin-top: 15px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
}

.advice-label {
    color: var(--muted2);
    font-size: 11px;
    margin-bottom: 3px;
}

.watch-button {
    width: 100%;
    margin-top: 15px;
    height: 38px;

    border: 1px solid var(--border);
    border-radius: 10px;

    background: rgba(255,255,255,.035);
    color: var(--muted);
    cursor: pointer;
}

.watch-button:hover {
    color: var(--text);
    background: rgba(255,255,255,.07);
}

.holding-panel {
    margin-top: 15px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
}

.holding-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 7px;
    font-size: 12px;
}

.holding-label {
    color: var(--muted2);
}

.holding-value {
    color: var(--text);
    font-weight: 650;
}

.holding-input {
    width: 100%;
    height: 36px;
    padding: 0 9px;
    margin-top: 7px;

    background: rgba(255,255,255,.04);

    border: 1px solid var(--border);
    border-radius: 8px;

    color: var(--text);
    outline: none;
}

.profit-positive {
    color: var(--red);
}

.profit-negative {
    color: var(--green);
}

.profit-neutral {
    color: var(--muted);
}

.empty-state {
    padding: 50px 20px;
    text-align: center;

    border: 1px dashed rgba(255,255,255,.12);
    border-radius: var(--radius);

    color: var(--muted);
}

.empty-title {
    color: var(--text);
    font-size: 17px;
    font-weight: 750;
    margin-bottom: 7px;
}

.empty-description {
    font-size: 13px;
    line-height: 1.6;
}

.error-panel {
    display: none;
    margin-top: 20px;
    padding: 18px;

    border: 1px solid rgba(255,77,94,.25);
    border-radius: 14px;
    background: rgba(255,77,94,.07);
}

.error-panel.show {
    display: block;
}

.error-title {
    color: #ff8792;
    font-weight: 750;
    margin-bottom: 6px;
}

.error-message {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
    white-space: pre-wrap;
}

.loading {
    padding: 50px 20px;
    text-align: center;
    color: var(--muted);
}

.loading-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    margin: 0 3px;
    border-radius: 50%;
    background: var(--blue);
    animation: loading 1s infinite alternate;
}

.loading-dot:nth-child(2) {
    animation-delay: .2s;
}

.loading-dot:nth-child(3) {
    animation-delay: .4s;
}

@keyframes loading {
    from {
        opacity: .25;
        transform: translateY(2px);
    }

    to {
        opacity: 1;
        transform: translateY(-2px);
    }
}

.footer {
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    text-align: center;
    color: var(--muted2);
    font-size: 11px;
}

@media (max-width: 900px) {
    .stock-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
    }
}

@media (max-width: 650px) {

    .app {
        width: min(100% - 20px, 1180px);
        padding-top: 20px;
    }

    .brand {
        flex-direction: column;
        gap: 12px;
    }

    .dashboard-grid {
        grid-template-columns: 1fr 1fr;
    }

    .tab {
        font-size: 11px;
        padding: 10px 3px;
    }

    .stock-grid {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 420px) {

    .dashboard-grid {
        gap: 9px;
    }

    .info-card {
        padding: 15px;
        min-height: 125px;
    }

    .info-value {
        font-size: 23px;
    }

    .search-box {
        flex-direction: column;
    }

    .search-button {
        width: 100%;
    }

    .search-result-main {
        align-items: flex-start;
        flex-direction: column;
    }

    .add-watch-button {
        width: 100%;
    }
}
</style>
</head>

<script>

/* ============================================================
   正式資料入口
============================================================ */

const DATA_URL = "./Data/ui_data.json";

const WATCHLIST_KEY =
    "ai_market_intelligence_watchlist_v1";


/* ============================================================
   GLOBAL STATE
============================================================ */

let dashboardData = null;
let allStocks = [];
let currentTab = "today_picks";


/* ============================================================
   DOM
============================================================ */

const contentArea =
    document.getElementById("contentArea");

const contentTitle =
    document.getElementById("contentTitle");

const contentDescription =
    document.getElementById("contentDescription");

const errorPanel =
    document.getElementById("errorPanel");

const errorMessage =
    document.getElementById("errorMessage");


/* ============================================================
   NUMBER
============================================================ */

function numberValue(value) {

    if (
        value === null ||
        value === undefined ||
        value === ""
    ) {
        return null;
    }

    const n =
        Number(
            String(value)
                .replace(/,/g, "")
                .replace(/%/g, "")
        );

    return Number.isFinite(n)
        ? n
        : null;
}


function formatNumber(
    value,
    digits = 0
) {

    const n =
        numberValue(value);

    if (n === null) {
        return "—";
    }

    return n.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits: digits,
            maximumFractionDigits: digits
        }
    );
}


function formatPercent(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "—";
    }

    return (
        n >= 0 ? "+" : ""
    ) +
    n.toFixed(2) +
    "%";
}


function marketClass(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "market-neutral";
    }

    if (n > 0) {
        return "market-up";
    }

    if (n < 0) {
        return "market-down";
    }

    return "market-neutral";
}


/* ============================================================
   ESCAPE
============================================================ */

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* ============================================================
   WATCHLIST
============================================================ */

function getWatchlist() {

    try {

        const raw =
            localStorage.getItem(
                WATCHLIST_KEY
            );

        if (!raw) {
            return {};
        }

        const parsed =
            JSON.parse(raw);

        return (
            parsed &&
            typeof parsed === "object"
        )
            ? parsed
            : {};

    } catch {

        return {};
    }
}


function saveWatchlist(data) {

    localStorage.setItem(
        WATCHLIST_KEY,
        JSON.stringify(data)
    );
}


function addToWatchlist(symbol) {

    if (!symbol) {
        return;
    }

    const watchlist =
        getWatchlist();

    if (!watchlist[symbol]) {

        watchlist[symbol] = {
            shares: 0,
            averageCost: 0
        };

        saveWatchlist(
            watchlist
        );
    }

    renderCurrentTab();
    updateTotalProfit();
}


function removeFromWatchlist(symbol) {

    const watchlist =
        getWatchlist();

    delete watchlist[symbol];

    saveWatchlist(
        watchlist
    );

    renderCurrentTab();
    updateTotalProfit();
}


function updateHolding(
    symbol,
    field,
    value
) {

    const watchlist =
        getWatchlist();

    if (!watchlist[symbol]) {

        watchlist[symbol] = {
            shares: 0,
            averageCost: 0
        };
    }

    const n =
        numberValue(value);

    watchlist[symbol][field] =
        n === null ? 0 : n;

    saveWatchlist(
        watchlist
    );

    updateTotalProfit();
    renderCurrentTab();
}


/* ============================================================
   NORMALIZE STOCK
============================================================ */

function normalizeStock(
    raw,
    fallbackSymbol = ""
) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {
        return null;
    }

    const symbol =
        String(
            raw.symbol ??
            raw.code ??
            raw.stock_id ??
            raw.stock_code ??
            fallbackSymbol ??
            ""
        ).trim();

    if (!symbol) {
        return null;
    }

    const name =
        String(
            raw.name ??
            raw.stock_name ??
            raw.company_name ??
            symbol
        ).trim();

    const price =
        numberValue(
            raw.price ??
            raw.close ??
            raw.latest_price ??
            raw.current_price
        );

    const change =
        numberValue(
            raw.change_pct ??
            raw.change_percent ??
            raw.pct_change ??
            raw.changePercent ??
            raw.change
        );

    const rank =
        numberValue(
            raw.rank ??
            raw.top_rank ??
            raw.ranking
        );

    return {

        symbol,

        name,

        price,

        change,

        strength:
            raw.strength ??
            raw.signal_strength ??
            raw.level ??
            "中性",

        advice:
            raw.advice ??
            raw.recommendation ??
            raw.suggestion ??
            "觀察",

        category:
            String(
                raw.category ??
                raw.type ??
                "stock"
            ).toLowerCase(),

        selected:
            Boolean(
                raw.selected ??
                raw.is_selected ??
                raw.featured
            ),

        rank,

        raw
    };
}


/* ============================================================
   STOCK MAP
============================================================ */

function buildStockMap(data) {

    const map = new Map();

    if (
        data &&
        data.stocks &&
        typeof data.stocks === "object"
    ) {

        Object.entries(
            data.stocks
        ).forEach(
            ([symbol, raw]) => {

                const stock =
                    normalizeStock(
                        raw,
                        symbol
                    );

                if (stock) {

                    map.set(
                        stock.symbol,
                        stock
                    );
                }
            }
        );
    }

    return map;
}


/* ============================================================
   TAB DATA → STOCK DATA

   正式架構：

   tabs.today_picks
   tabs.top10
   tabs.etf
   tabs.bond

   每個項目可能只有代號，
   因此優先從 stocks 取得完整資料。
============================================================ */

function resolveTabStocks(
    data,
    tabName
) {

    const stockMap =
        buildStockMap(data);

    const tabData =
        data?.tabs?.[tabName];

    if (!Array.isArray(tabData)) {
        return [];
    }

    const result = [];

    tabData.forEach(
        (item, index) => {

            if (
                typeof item === "string"
            ) {

                const symbol =
                    item.trim();

                const stock =
                    stockMap.get(
                        symbol
                    );

                if (stock) {
                    result.push(stock);
                }

                return;
            }


            if (
                item &&
                typeof item === "object"
            ) {

                const symbol =
                    String(
                        item.symbol ??
                        item.code ??
                        item.stock_id ??
                        item.stock_code ??
                        ""
                    ).trim();

                const base =
                    symbol
                        ? stockMap.get(symbol)
                        : null;

                const merged =
                    normalizeStock(
                        {
                            ...(base?.raw || {}),
                            ...item
                        },
                        symbol
                    );

                if (merged) {
                    result.push(merged);
                }

                return;
            }

            /*
             * 如果後端 tab 直接使用索引，
             * 仍然不假造資料。
             */
            if (
                Number.isInteger(index)
            ) {
                return;
            }
        }
    );

    return result;
}


/* ============================================================
   ALL STOCKS
============================================================ */

function extractAllStocks(data) {

    const map =
        buildStockMap(data);

    return Array.from(
        map.values()
    );
}


/* ============================================================
   LATEST DATE
============================================================ */

function getLatestDate(data) {

    return (
        data?.status?.latest_trading_date ??
        null
    );
}


/* ============================================================
   MARKET STATUS
============================================================ */

function updateMarketStatus(data) {

    const status =
        String(
            data?.status?.market_status ??
            ""
        ).toLowerCase();

    const dot =
        document.getElementById(
            "marketStatusDot"
        );

    const text =
        document.getElementById(
            "marketStatusText"
        );

    if (
        status === "open" ||
        status === "trading"
    ) {

        dot.className =
            "status-dot open";

        text.textContent =
            "🟢 今日開市";

    } else {

        dot.className =
            "status-dot closed";

        text.textContent =
            "🔴 市場休市";
    }
}


/* ============================================================
   HEADER
============================================================ */

function renderHeader(data) {

    const date =
        getLatestDate(data);

    document.getElementById(
        "latestDate"
    ).textContent =
        "最新交易日：" +
        (
            date
                ? String(date).slice(0, 10)
                : "尚無資料"
        );

    updateMarketStatus(data);
}


/* ============================================================
   DASHBOARD CARDS

   完全對應：

   status
   market
   summary
============================================================ */

function renderDashboardCards(data) {

    const summary =
        data?.summary || {};

    const market =
        data?.market || {};

    const index =
        market.index || {};

    const sentiment =
        market.sentiment || {};


    /* 今日精選 */

    document.getElementById(
        "selectedCount"
    ).textContent =
        formatNumber(
            summary.today_picks
        );


    /* 持有總盈虧 */

    const profitEl =
        document.getElementById(
            "totalProfit"
        );

    const holdingsProfit =
        numberValue(
            summary.holdings_profit
        );

    if (
        summary.has_holdings &&
        holdingsProfit !== null
    ) {

        profitEl.textContent =
            (
                holdingsProfit >= 0
                    ? "+"
                    : ""
            ) +
            formatNumber(
                holdingsProfit
            ) +
            " 元";

        profitEl.className =
            "info-value " +
            marketClass(
                holdingsProfit
            );

    } else {

        profitEl.textContent =
            "尚未建立持倉";

        profitEl.className =
            "info-value";
    }


    /* 加權指數 */

    document.getElementById(
        "marketIndex"
    ).textContent =
        formatNumber(
            index.value,
            2
        );


    const indexChangeEl =
        document.getElementById(
            "marketIndexChange"
        );

    const indexChange =
        numberValue(
            index.change_pct
        );

    if (
        indexChange !== null
    ) {

        indexChangeEl.textContent =
            formatPercent(
                indexChange
            );

        indexChangeEl.className =
            "info-description " +
            marketClass(
                indexChange
            );

    } else {

        indexChangeEl.textContent =
            "尚無大盤資料";

        indexChangeEl.className =
            "info-description market-neutral";
    }


    /* 市場風向 */

    const trendEl =
        document.getElementById(
            "marketTrend"
        );

    const trendDescriptionEl =
        document.getElementById(
            "marketTrendDescription"
        );

    const level =
        sentiment.level;

    const description =
        sentiment.description;


    if (!level) {

        trendEl.textContent =
            "—";

        trendEl.className =
            "info-value market-neutral";

        trendDescriptionEl.textContent =
            description ||
            "尚無市場風向資料";

        return;
    }


    trendEl.textContent =
        String(level);

    trendDescriptionEl.textContent =
        description ||
        "市場狀態";


    const levelText =
        String(level);


    if (
        levelText.includes("偏多") ||
        levelText.includes("強")
    ) {

        trendEl.className =
            "info-value market-up";

    } else if (
        levelText.includes("偏弱") ||
        levelText.includes("弱")
    ) {

        trendEl.className =
            "info-value market-down";

    } else {

        trendEl.className =
            "info-value market-neutral";
    }
}


/* ============================================================
   STRENGTH
============================================================ */

function strengthClass(strength) {

    const text =
        String(
            strength || ""
        );

    if (
        text.includes("強")
    ) {
        return "strong";
    }

    if (
        text.includes("弱")
    ) {
        return "weak";
    }

    return "neutral";
}


function strengthText(strength) {

    const text =
        String(
            strength || ""
        );

    if (
        text.includes("強")
    ) {
        return "🟢 強勢";
    }

    if (
        text.includes("弱")
    ) {
        return "🔴 弱勢";
    }

    return "🟡 中性";
}


/* ============================================================
   STOCK CARD
============================================================ */

function renderStockCard(
    stock,
    options = {}
) {

    const watchlist =
        getWatchlist();

    const holding =
        watchlist[
            stock.symbol
        ];

    let holdingHtml = "";


    if (
        options.watchlist
    ) {

        const shares =
            numberValue(
                holding?.shares
            ) || 0;

        const averageCost =
            numberValue(
                holding?.averageCost
            ) || 0;

        const marketValue =
            stock.price !== null
                ? stock.price * shares
                : null;

        const cost =
            averageCost * shares;

        const profit =
            marketValue !== null
                ? marketValue - cost
                : null;

        const returnPct =
            cost > 0 &&
            profit !== null
                ? profit / cost * 100
                : null;

        let profitClass =
            "profit-neutral";

        if (
            profit !== null &&
            profit > 0
        ) {

            profitClass =
                "profit-positive";

        } else if (
            profit !== null &&
            profit < 0
        ) {

            profitClass =
                "profit-negative";
        }


        holdingHtml = `

            <div class="holding-panel">

                <div class="holding-row">
                    <span class="holding-label">
                        持有股數
                    </span>

                    <span class="holding-value">
                        ${formatNumber(shares)} 股
                    </span>
                </div>

                <input
                    class="holding-input"
                    type="number"
                    min="0"
                    step="1"
                    value="${shares || ""}"
                    placeholder="輸入持有股數"
                    data-holding-field="shares"
                    data-symbol="${escapeHtml(stock.symbol)}"
                >

                <div
                    class="holding-row"
                    style="margin-top:12px;"
                >
                    <span class="holding-label">
                        平均成本
                    </span>

                    <span class="holding-value">
                        ${
                            averageCost > 0
                                ? formatNumber(
                                    averageCost,
                                    2
                                )
                                : "尚未輸入"
                        }
                    </span>
                </div>

                <input
                    class="holding-input"
                    type="number"
                    min="0"
                    step="0.01"
                    value="${averageCost || ""}"
                    placeholder="輸入平均成本"
                    data-holding-field="averageCost"
                    data-symbol="${escapeHtml(stock.symbol)}"
                >

                <div
                    class="holding-row"
                    style="margin-top:12px;"
                >
                    <span class="holding-label">
                        目前市值
                    </span>

                    <span class="holding-value">
                        ${
                            marketValue !== null
                                ? formatNumber(
                                    marketValue
                                ) + " 元"
                                : "—"
                        }
                    </span>
                </div>

                <div class="holding-row">

                    <span class="holding-label">
                        損益
                    </span>

                    <span
                        class="holding-value ${profitClass}"
                    >
                        ${
                            profit !== null
                                ? (
                                    profit >= 0
                                        ? "+"
                                        : ""
                                ) +
                                formatNumber(
                                    profit
                                ) +
                                " 元"
                                : "—"
                        }
                    </span>

                </div>

                <div class="holding-row">

                    <span class="holding-label">
                        報酬率
                    </span>

                    <span
                        class="holding-value ${profitClass}"
                    >
                        ${
                            returnPct !== null
                                ? formatPercent(
                                    returnPct
                                )
                                : "—"
                        }
                    </span>

                </div>

            </div>
        `;
    }


    return `

        <article class="stock-card">

            <div class="stock-top">

                <div>

                    <div class="stock-name">
                        ${escapeHtml(stock.name)}
                    </div>

                    <div class="stock-symbol">
                        ${escapeHtml(stock.symbol)}
                    </div>

                </div>

            </div>


            <div class="stock-price-row">

                <div class="stock-price">
                    ${
                        stock.price !== null
                            ? formatNumber(
                                stock.price,
                                2
                            )
                            : "—"
                    }
                </div>

                <div
                    class="stock-change ${marketClass(stock.change)}"
                >
                    ${formatPercent(stock.change)}
                </div>

            </div>


            <div
                class="strength ${strengthClass(stock.strength)}"
            >
                ${strengthText(stock.strength)}
            </div>


            <div class="advice">

                <div class="advice-label">
                    建議
                </div>

                <div>
                    ${escapeHtml(stock.advice)}
                </div>

            </div>


            ${holdingHtml}


            ${
                options.watchlist
                    ? `
                        <button
                            class="watch-button"
                            data-remove-symbol="${escapeHtml(stock.symbol)}"
                        >
                            移除我的清單
                        </button>
                    `
                    : `
                        <button
                            class="watch-button"
                            data-add-symbol="${escapeHtml(stock.symbol)}"
                        >
                            ＋ 加入我的清單
                        </button>
                    `
            }

        </article>
    `;
}


/* ============================================================
   TAB META
============================================================ */

function getTabMeta(tab) {

    const map = {

        today_picks: {
            title: "今日精選",
            description:
                "最新交易日量化篩選結果"
        },

        top10: {
            title: "Top 10",
            description:
                "市場量化排名前十"
        },

        etf: {
            title: "ETF",
            description:
                "ETF 市場資料"
        },

        bond: {
            title: "債券",
            description:
                "債券市場資料"
        },

        watchlist: {
            title: "我的清單",
            description:
                "你的持股與追蹤標的"
        }
    };

    return (
        map[tab] ||
        map.today_picks
    );
}


/* ============================================================
   GET TAB STOCKS
============================================================ */

function getTabStocks(tab) {

    if (
        tab === "watchlist"
    ) {

        const watchlist =
            getWatchlist();

        return allStocks.filter(
            stock =>
                Boolean(
                    watchlist[
                        stock.symbol
                    ]
                )
        );
    }


    if (
        tab === "today_picks"
    ) {

        return resolveTabStocks(
            dashboardData,
            "today_picks"
        );
    }


    if (
        tab === "top10"
    ) {

        return resolveTabStocks(
            dashboardData,
            "top10"
        );
    }


    if (
        tab === "etf"
    ) {

        return resolveTabStocks(
            dashboardData,
            "etf"
        );
    }


    if (
        tab === "bond"
    ) {

        return resolveTabStocks(
            dashboardData,
            "bond"
        );
    }


    return [];
}


/* ============================================================
   RENDER CURRENT TAB
============================================================ */

function renderCurrentTab() {

    const meta =
        getTabMeta(
            currentTab
        );

    contentTitle.textContent =
        meta.title;

    contentDescription.textContent =
        meta.description;


    const stocks =
        getTabStocks(
            currentTab
        );


    if (
        stocks.length === 0
    ) {

        if (
            currentTab === "today_picks"
        ) {

            contentArea.innerHTML = `

                <div class="empty-state">

                    <div class="empty-title">
                        今日沒有符合條件的個股
                    </div>

                    <div class="empty-description">
                        後端目前回傳今日精選 0 檔。
                        儀表板不會自行假造選股結果。
                    </div>

                </div>
            `;

        } else if (
            currentTab === "watchlist"
        ) {

            contentArea.innerHTML = `

                <div class="empty-state">

                    <div class="empty-title">
                        我的清單目前是空的
                    </div>

                    <div class="empty-description">
                        先透過上方「查詢個股」，
                        找到股票後加入我的清單。
                    </div>

                </div>
            `;

        } else {

            contentArea.innerHTML = `

                <div class="empty-state">

                    <div class="empty-title">
                        目前沒有可顯示的資料
                    </div>

                    <div class="empty-description">
                        後端目前尚未提供此分頁資料。
                    </div>

                </div>
            `;
        }

        return;
    }


    contentArea.innerHTML = `

        <div class="stock-grid">

            ${stocks
                .map(
                    stock =>
                        renderStockCard(
                            stock,
                            {
                                watchlist:
                                    currentTab ===
                                    "watchlist"
                            }
                        )
                )
                .join("")
            }

        </div>
    `;


    bindStockButtons();
    bindHoldingInputs();
}


/* ============================================================
   BUTTON EVENTS
============================================================ */

function bindStockButtons() {

    document
        .querySelectorAll(
            "[data-add-symbol]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        addToWatchlist(
                            button.dataset.addSymbol
                        );
                    }
                );
            }
        );


    document
        .querySelectorAll(
            "[data-remove-symbol]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        removeFromWatchlist(
                            button.dataset.removeSymbol
                        );
                    }
                );
            }
        );
}


/* ============================================================
   HOLDING EVENTS
============================================================ */

function bindHoldingInputs() {

    document
        .querySelectorAll(
            "[data-holding-field]"
        )
        .forEach(
            input => {

                input.addEventListener(
                    "change",
                    () => {

                        updateHolding(
                            input.dataset.symbol,
                            input.dataset.holdingField,
                            input.value
                        );
                    }
                );
            }
        );
}


/* ============================================================
   TOTAL PROFIT

   前端只計算 localStorage 持倉，
   不修改後端 summary。
============================================================ */

function updateTotalProfit() {

    const watchlist =
        getWatchlist();

    const symbols =
        Object.keys(
            watchlist
        );

    const profitEl =
        document.getElementById(
            "totalProfit"
        );


    if (
        symbols.length === 0
    ) {

        profitEl.textContent =
            "尚未建立持倉";

        profitEl.className =
            "info-value";

        return;
    }


    let total = 0;
    let hasHolding = false;


    symbols.forEach(
        symbol => {

            const stock =
                allStocks.find(
                    s =>
                        s.symbol === symbol
                );

            const holding =
                watchlist[symbol];

            if (
                !stock ||
                stock.price === null
            ) {
                return;
            }

            const shares =
                numberValue(
                    holding.shares
                ) || 0;

            const averageCost =
                numberValue(
                    holding.averageCost
                ) || 0;

            if (
                shares <= 0 ||
                averageCost <= 0
            ) {
                return;
            }

            hasHolding = true;

            total +=
                (
                    stock.price -
                    averageCost
                ) *
                shares;
        }
    );


    if (
        !hasHolding
    ) {

        profitEl.textContent =
            "尚未建立持倉";

        profitEl.className =
            "info-value";

        return;
    }


    profitEl.textContent =
        (
            total >= 0
                ? "+"
                : ""
        ) +
        formatNumber(total) +
        " 元";


    profitEl.className =
        "info-value " +
        marketClass(total);
}


/* ============================================================
   SEARCH
============================================================ */

function searchStock() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const keyword =
        input.value
            .trim()
            .toLowerCase();

    const result =
        document.getElementById(
            "searchResult"
        );


    if (!keyword) {

        result.classList.remove(
            "show"
        );

        result.innerHTML = "";

        return;
    }


    const matches =
        allStocks.filter(
            stock =>

                stock.symbol
                    .toLowerCase()
                    .includes(keyword)

                ||

                stock.name
                    .toLowerCase()
                    .includes(keyword)
        );


    if (
        matches.length === 0
    ) {

        result.innerHTML = `

            <div
                style="
                    color:var(--muted);
                    font-size:13px;
                "
            >
                找不到符合的個股。
            </div>
        `;

        result.classList.add(
            "show"
        );

        return;
    }


    const stock =
        matches[0];


    result.innerHTML = `

        <div class="search-result-main">

            <div>

                <div class="search-result-name">
                    ${escapeHtml(stock.name)}
                </div>

                <div class="search-result-symbol">

                    ${escapeHtml(stock.symbol)}

                    ${
                        stock.price !== null
                            ? " · " +
                              formatNumber(
                                  stock.price,
                                  2
                              )
                            : ""
                    }

                    ${
                        stock.change !== null
                            ? " · " +
                              formatPercent(
                                  stock.change
                              )
                            : ""
                    }

                </div>

            </div>

            <button
                class="add-watch-button"
                data-search-add="${escapeHtml(stock.symbol)}"
            >
                ＋ 加入我的清單
            </button>

        </div>
    `;


    result.classList.add(
        "show"
    );


    result
        .querySelector(
            "[data-search-add]"
        )
        .addEventListener(
            "click",
            () => {

                addToWatchlist(
                    stock.symbol
                );

                result.innerHTML = `

                    <div
                        style="
                            color:var(--green);
                            font-size:13px;
                        "
                    >
                        ✓ ${escapeHtml(stock.name)}
                        已加入我的清單
                    </div>
                `;
            }
        );
}

/* ============================================================
   LOAD UI DATA
============================================================ */

async function loadDashboardData() {

    errorPanel.classList.remove(
        "show"
    );


    try {

        /*
         * 唯一正式資料入口
         */

        const response =
            await fetch(
                DATA_URL,
                {
                    cache: "no-store"
                }
            );


        if (
            response.status === 404
        ) {

            throw new Error(
                "HTTP 404：./Data/ui_data.json 不存在"
            );
        }


        if (
            !response.ok
        ) {

            throw new Error(
                `HTTP ${response.status}：${DATA_URL}`
            );
        }


        const data =
            await response.json();


        if (
            !data ||
            typeof data !== "object"
        ) {

            throw new Error(
                "ui_data.json 格式錯誤"
            );
        }


        /*
         * 驗證正式架構
         */

        if (
            !data.status ||
            !data.market ||
            !data.summary ||
            !data.tabs ||
            !data.stocks
        ) {

            throw new Error(
                "ui_data.json 缺少正式資料結構：status / market / summary / tabs / stocks"
            );
        }


        dashboardData =
            data;


        allStocks =
            extractAllStocks(
                data
            );


        renderHeader(
            data
        );


        renderDashboardCards(
            data
        );


        renderCurrentTab();


    } catch (error) {

        console.error(
            "Dashboard load error:",
            error
        );


        contentArea.innerHTML = `

            <div class="empty-state">

                <div class="empty-title">
                    資料尚未準備完成
                </div>

                <div class="empty-description">
                    儀表板目前無法取得後台 UI 資料。
                </div>

            </div>
        `;


        errorMessage.textContent =
            error.message ||
            String(error);


        errorPanel.classList.add(
            "show"
        );


        document.getElementById(
            "latestDate"
        ).textContent =
