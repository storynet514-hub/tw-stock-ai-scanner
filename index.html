<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台股 AI 智能選股儀表板</title>
<style>
/* =========================================================
   ROOT
========================================================= */
:root {
    --bg: #070b12;
    --bg2: #0b111b;
    --panel: #101824;
    --panel2: #131d2a;
    --panel3: #182333;
    --border: rgba(255,255,255,.08);
    --border-light: rgba(255,255,255,.13);
    --text: #f3f6fb;
    --text2: #a9b4c5;
    --text3: #738095;
    --green: #25d98a;
    --green-soft: rgba(37,217,138,.12);
    --red: #ff5f6d;
    --red-soft: rgba(255,95,109,.12);
    --yellow: #ffc857;
    --yellow-soft: rgba(255,200,87,.12);
    --blue: #5ca9ff;
    --blue-soft: rgba(92,169,255,.12);
    --purple: #a78bfa;
    --purple-soft: rgba(167,139,250,.12);
    --shadow:
        0 18px 50px rgba(0,0,0,.28);
    --radius: 18px;
}
/* =========================================================
   RESET
========================================================= */
* {
    box-sizing: border-box;
}
html {
    scroll-behavior: smooth;
}
body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(
            circle at top right,
            rgba(92,169,255,.08),
            transparent 32%
        ),
        radial-gradient(
            circle at top left,
            rgba(37,217,138,.05),
            transparent 28%
        ),
        var(--bg);
    color: var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
}
/* =========================================================
   COMMON
========================================================= */
button,
input {
    font: inherit;
}
button {
    cursor: pointer;
}
.hidden {
    display: none !important;
}
/* =========================================================
   APP
========================================================= */
.app {
    width: min(
        1400px,
        calc(100% - 32px)
    );
    margin: 0 auto;
    padding: 28px 0 50px;
}
/* =========================================================
   HEADER
========================================================= */
.header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;
    margin-bottom: 24px;
}
.brand {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.brand-title {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: .5px;
}
.brand-subtitle {
    color: var(--text2);
    font-size: 13px;
}
.header-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 13px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: rgba(255,255,255,.025);
    color: var(--text2);
    font-size: 12px;
}
.status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow:
        0 0 12px
        rgba(37,217,138,.6);
}
/* =========================================================
   SEARCH
========================================================= */
.search-area {
    position: relative;
    margin-bottom: 24px;
}
.search-box {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
}
.search-icon {
    padding-left: 8px;
    color: var(--text3);
}
.search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--text);
    padding: 10px;
}
.search-input::placeholder {
    color: var(--text3);
}
.search-button {
    border: 0;
    border-radius: 12px;
    padding: 10px 18px;
    background: var(--blue);
    color: #07101d;
    font-weight: 700;
}
.search-button:hover {
    filter: brightness(1.08);
}
.search-results {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 8px);
    left: 0;
    right: 0;
    max-height: 420px;
    overflow-y: auto;
    background: var(--panel2);
    border: 1px solid var(--border-light);
    border-radius: 16px;
    box-shadow: var(--shadow);
}
.search-results.active {
    display: block;
}
.search-result-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
}
.search-result-item:last-child {
    border-bottom: 0;
}
.search-result-main {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
}
.stock-code {
    font-weight: 800;
}
.stock-name {
    color: var(--text2);
}
.stock-market {
    color: var(--text3);
    font-size: 11px;
}
.search-result-actions {
    flex-shrink: 0;
}
/* =========================================================
   BUTTON
========================================================= */
.small-button {
    border: 1px solid var(--border-light);
    background: transparent;
    color: var(--text2);
    border-radius: 9px;
    padding: 7px 11px;
    font-size: 11px;
}
.small-button.primary {
    border-color:
        rgba(92,169,255,.35);
    background:
        var(--blue-soft);
    color: var(--blue);
}
.small-button.remove {
    border-color:
        rgba(255,95,109,.25);
    background:
        var(--red-soft);
    color: var(--red);
}
/* =========================================================
   ERROR
========================================================= */
.error-panel {
    display: none;
    margin-bottom: 22px;
    padding: 18px;
    border: 1px solid
        rgba(255,95,109,.3);
    border-radius: var(--radius);
    background: var(--red-soft);
}
.error-panel.active {
    display: block;
}
.error-title {
    color: var(--red);
    font-weight: 800;
    margin-bottom: 6px;
}
.error-message {
    color: var(--text2);
    font-size: 12px;
    white-space: pre-wrap;
}
/* =========================================================
   LOADING
========================================================= */
.loading {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 160px;
    color: var(--text2);
}
.loading-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
}
.loading-spinner {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    border: 3px solid
        rgba(255,255,255,.08);
    border-top-color: var(--blue);
    animation:
        spin .8s linear infinite;
}
@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}
/* =========================================================
   METRICS
========================================================= */
.metrics-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 26px;
}
.metric-card {
    padding: 20px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.metric-label {
    color: var(--text3);
    font-size: 11px;
    margin-bottom: 9px;
}
.metric-value {
    font-size: 26px;
    font-weight: 800;
}
.metric-note {
    margin-top: 5px;
    color: var(--text2);
    font-size: 11px;
}
/* =========================================================
   SECTION
========================================================= */
.section {
    margin-bottom: 30px;
}
.section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 14px;
}
.section-title {
    font-size: 18px;
    font-weight: 800;
}
.section-count {
    color: var(--text3);
    font-size: 11px;
}
/* =========================================================
   FEATURED
========================================================= */
.featured-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 14px;
}
.featured-card {
    padding: 18px;
    background:
        linear-gradient(
            145deg,
            rgba(92,169,255,.07),
            transparent
        ),
        var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    min-height: 190px;
}
.featured-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}
.featured-label {
    color: var(--blue);
    font-size: 10px;
    font-weight: 800;
}
.featured-stock {
    margin-top: 20px;
}
.featured-code {
    font-size: 22px;
    font-weight: 850;
}
.featured-name {
    margin-top: 3px;
    color: var(--text2);
    font-size: 12px;
}
.price-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-top: 18px;
}
.price {
    font-size: 25px;
    font-weight: 800;
}
.change {
    font-size: 12px;
    font-weight: 700;
}
.up {
    color: var(--green);
}
.down {
    color: var(--red);
}
.flat {
    color: var(--text3);
}
.featured-bottom {
    margin-top: 15px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.recommendation {
    color: var(--text2);
    font-size: 11px;
    line-height: 1.5;
}
/* =========================================================
   SIGNAL
========================================================= */
.signal {
    display: inline-flex;
    align-items: center;
    padding: 5px 8px;
    border-radius: 999px;
    font-size: 9px;
    font-weight: 800;
    white-space: nowrap;
}
.signal.bullish {
    color: var(--green);
    background: var(--green-soft);
}
.signal.weak {
    color: var(--red);
    background: var(--red-soft);
}
.signal.wait {
    color: var(--yellow);
    background: var(--yellow-soft);
}
.signal.neutral {
    color: var(--text2);
    background: rgba(255,255,255,.06);
}
/* =========================================================
   TOP TABLE
========================================================= */
.table-wrap {
    overflow-x: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.top-table {
    width: 100%;
    min-width: 720px;
    border-collapse: collapse;
}
.top-table th {
    color: var(--text3);
    font-size: 10px;
    font-weight: 600;
    text-align: left;
    padding: 13px 15px;
    border-bottom: 1px solid var(--border);
}
.top-table td {
    padding: 15px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
}
.top-table tr:last-child td {
    border-bottom: 0;
}
.rank {
    color: var(--yellow);
    font-weight: 900;
}
.table-stock-code {
    font-weight: 800;
}
.table-stock-name {
    margin-top: 3px;
    color: var(--text3);
    font-size: 10px;
}
.recommendation-table {
    max-width: 250px;
    color: var(--text2);
    line-height: 1.5;
}
/* =========================================================
   ASSET
========================================================= */
.asset-grid {
    display: grid;
    grid-template-columns:
        repeat(4, minmax(0, 1fr));
    gap: 14px;
}
.asset-card {
    padding: 17px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
}
.asset-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}
.asset-code {
    font-size: 16px;
    font-weight: 800;
}
.asset-name {
    margin-top: 3px;
    color: var(--text2);
    font-size: 11px;
}
.asset-type {
    padding: 4px 7px;
    border-radius: 7px;
    color: var(--purple);
    background: var(--purple-soft);
    font-size: 9px;
    font-weight: 800;
}
.asset-price {
    margin-top: 20px;
    font-size: 22px;
    font-weight: 800;
}
.asset-change {
    margin-top: 5px;
    font-size: 11px;
}
/* =========================================================
   WATCHLIST
========================================================= */
.watch-grid {
    display: grid;
    grid-template-columns:
        repeat(3, minmax(0, 1fr));
    gap: 14px;
}
.watch-card {
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.watch-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 10px;
}
.watch-code {
    font-size: 20px;
    font-weight: 850;
}
.watch-name {
    color: var(--text2);
    font-size: 11px;
    margin-top: 3px;
}
.watch-price {
    margin-top: 18px;
    font-size: 27px;
    font-weight: 850;
}
.watch-change {
    margin-top: 4px;
    font-size: 11px;
}
.watch-status-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
}
.watch-status-label {
    color: var(--text3);
    font-size: 10px;
}
.watch-recommendation {
    margin-top: 13px;
    padding: 11px;
    border-radius: 11px;
    background: rgba(255,255,255,.025);
    color: var(--text2);
    font-size: 11px;
    line-height: 1.55;
}
/* =========================================================
   HOLDING
========================================================= */
.not-holding {
    margin-top: 13px;
    padding: 11px;
    color: var(--text3);
    background: rgba(255,255,255,.025);
    border-radius: 11px;
    font-size: 10px;
}
.holding-box {
    margin-top: 14px;
    padding: 14px;
    border-radius: 13px;
    background:
        rgba(92,169,255,.045);
    border: 1px solid
        rgba(92,169,255,.12);
}
.holding-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 13px;
}
.holding-title {
    font-size: 11px;
    font-weight: 800;
}
.holding-toggle {
    border: 0;
    background: transparent;
    color: var(--red);
    font-size: 9px;
}
.holding-fields {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0,1fr));
    gap: 9px;
}
.holding-field label {
    display: block;
    margin-bottom: 5px;
    color: var(--text3);
    font-size: 9px;
}
.holding-field input {
    width: 100%;
    padding: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    outline: 0;
    background: var(--bg2);
    color: var(--text);
    font-size: 11px;
}
.holding-field input:focus {
    border-color:
        rgba(92,169,255,.5);
}
.holding-summary {
    display: grid;
    grid-template-columns:
        repeat(2, minmax(0,1fr));
    gap: 8px;
    margin-top: 12px;
}
.holding-stat {
    padding: 9px;
    border-radius: 8px;
    background: rgba(255,255,255,.025);
}
.holding-stat-label {
    color: var(--text3);
    font-size: 8px;
}
.holding-stat-value {
    margin-top: 4px;
    font-size: 11px;
    font-weight: 800;
}
.holding-stat-value.profit {
    color: var(--green);
}
.holding-stat-value.loss {
    color: var(--red);
}
/* =========================================================
   EMPTY
========================================================= */
.empty {
    padding: 35px 20px;
    text-align: center;
}
.empty-title {
    color: var(--text2);
    font-weight: 700;
}
.empty-description {
    margin-top: 7px;
    color: var(--text3);
    font-size: 11px;
}
/* =========================================================
   FOOTER
========================================================= */
.footer {
    padding-top: 20px;
    color: var(--text3);
    font-size: 10px;
    text-align: center;
}
/* =========================================================
   RESPONSIVE
========================================================= */
@media (max-width: 1050px) {
    .featured-grid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }
    .asset-grid {
        grid-template-columns:
            repeat(3, minmax(0,1fr));
    }
    .watch-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }
}
@media (max-width: 800px) {
    .metrics-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }
    .featured-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }
    .asset-grid {
        grid-template-columns:
            repeat(2, minmax(0,1fr));
    }
}
@media (max-width: 600px) {
    .app {
        width: min(
            100% - 20px,
            1400px
        );
        padding-top: 18px;
    }
    .header {
        flex-direction: column;
    }
    .brand-title {
        font-size: 23px;
    }
    .metrics-grid,
    .featured-grid,
    .asset-grid,
    .watch-grid {
        grid-template-columns:
            1fr;
    }
    .search-button {
        padding-left: 12px;
        padding-right: 12px;
    }
    .search-result-main {
        flex-wrap: wrap;
    }
}
/* =========================================================
   END CSS
========================================================= */
</style>
</head>
<body>
<div class="app">
<!-- =====================================================
     HEADER
====================================================== -->
<header class="header">
    <div class="brand">
        <div class="brand-title">
            台股 AI 智能選股儀表板
        </div>
        <div class="brand-subtitle">
            收盤資料 × AI 選股 × 市場趨勢 × 個人追蹤
        </div>
    </div>
    <div class="header-status">
        <span class="status-dot"></span>
        <span>
            系統運作中
        </span>
    </div>
</header>
<!-- =====================================================
     SEARCH
====================================================== -->
<section class="search-area">
    <div class="search-box">
        <div class="search-icon">
            🔎
        </div>
        <input
            id="searchInput"
            class="search-input"
            type="search"
            autocomplete="off"
            placeholder="查詢個股，例如：2330、台積電、聯亞"
        >
        <button
            id="searchButton"
            class="search-button"
            type="button"
        >
            查詢個股
        </button>
    </div>
    <div
        id="searchResults"
        class="search-results"
    ></div>
</section>
<!-- =====================================================
     ERROR
====================================================== -->
<section
    id="errorPanel"
    class="error-panel"
>
    <div
        id="errorTitle"
        class="error-title"
    >
        無法載入儀表板資料
    </div>
    <div
        id="errorMessage"
        class="error-message"
    ></div>
</section>
<!-- =====================================================
     LOADING
====================================================== -->
<div
    id="loading"
    class="loading"
>
    <div class="loading-inner">
        <div class="loading-spinner"></div>
        <div>
            正在載入最新市場資料…
        </div>
    </div>
</div>
<!-- =====================================================
     DASHBOARD
====================================================== -->
<main
    id="dashboard"
    class="hidden"
>
    <!-- =================================================
         METRICS
    ================================================== -->
    <section class="metrics-grid">
        <article class="metric-card">
            <div class="metric-label">
                今日符合條件
            </div>
            <div
                id="featuredCount"
                class="metric-value"
            >
                --
            </div>
            <div class="metric-note">
                AI 今日精選
            </div>
        </article>
        <article class="metric-card">
            <div class="metric-label">
                股票資料
            </div>
            <div
                id="stockCount"
                class="metric-value"
            >
                --
            </div>
            <div class="metric-note">
                後端有效股票資料
            </div>
        </article>
        <article class="metric-card">
            <div class="metric-label">
                ETF
            </div>
            <div
                id="etfCount"
                class="metric-value"
            >
                --
            </div>
            <div class="metric-note">
                ETF 資料
            </div>
        </article>
        <article class="metric-card">
            <div class="metric-label">
                最新交易日
            </div>
            <div
                id="dataDate"
                class="metric-value"
            >
                --
            </div>
            <div class="metric-note">
                市場資料日期
            </div>
        </article>
    </section>
    <!-- =================================================
         FEATURED
    ================================================== -->
    <section class="section">
        <div class="section-header">
            <div class="section-title">
                今日精選
            </div>
            <div
                id="featuredSectionCount"
                class="section-count"
            >
                0 檔
            </div>
        </div>
        <div
            id="featuredGrid"
            class="featured-grid"
        ></div>
    </section>
    <!-- =================================================
         TOP 10
    ================================================== -->
    <section class="section">
        <div class="section-header">
            <div class="section-title">
                AI Top 10
            </div>
            <div
                id="topCount"
                class="section-count"
            >
                0 檔
            </div>
        </div>
        <div class="table-wrap">
            <table class="top-table">
                <thead>
                    <tr>
                        <th>
                            #
                        </th>
                        <th>
                            標的
                        </th>
                        <th>
                            股價
                        </th>
                        <th>
                            漲跌
                        </th>
                        <th>
                            趨勢
                        </th>
                        <th>
                            建議
                        </th>
                    </tr>
                </thead>
                <tbody
                    id="topTableBody"
                ></tbody>
            </table>
        </div>
    </section>
    <!-- =================================================
         ETF
    ================================================== -->
    <section class="section">
        <div class="section-header">
            <div class="section-title">
                ETF
            </div>
            <div
                id="etfSectionCount"
                class="section-count"
            >
                0 檔
            </div>
        </div>
        <div
            id="etfGrid"
            class="asset-grid"
        ></div>
    </section>

<script>
/* =========================================================
   CONFIG
========================================================= */
const DATA_URL =
    "Data/ui_data.json";
const SECURITIES_URL =
    "Data/securities.json";
/* =========================================================
   GLOBAL STATE
========================================================= */
let uiData = {
    statistics: {},
    today_selected: [],
    top10: [],
    stocks: [],
    stock: [],
    etfs: [],
    bonds: [],
    latest_market_date: "",
    date: "",
    updated_at: "",
    updated_at_tw: ""
};
let securitiesData = [];
let watchlist = [];
let holdings = {};
/* =========================================================
   DOM HELPER
========================================================= */
function $(
    id
) {
    return document.getElementById(id);
}
/* =========================================================
   INIT
========================================================= */
document.addEventListener(
    "DOMContentLoaded",
    init
);
async function init() {
    loadWatchlist();
    loadHoldings();
    bindEvents();
    showLoading(true);
    hideError();
    try {
        const result =
            await loadAllData();
        uiData =
            normalizeUiData(
                result.ui
            );
        securitiesData =
            normalizeSecurities(
                result.securities
            );
        renderDashboard();
        $("dashboard")
            .classList
            .remove("hidden");
    } catch(error) {
        console.error(
            "Dashboard load error:",
            error
        );
        showError(
            error
        );
    } finally {
        showLoading(false);
    }
}
/* =========================================================
   EVENTS
========================================================= */
function bindEvents() {
    $("searchButton")
        .addEventListener(
            "click",
            performSearch
        );
    $("searchInput")
        .addEventListener(
            "input",
            performSearch
        );
    $("searchInput")
        .addEventListener(
            "keydown",
            event => {
                if (
                    event.key === "Escape"
                ) {
                    $("searchInput")
                        .value = "";
                    clearSearchResults();
                }
            }
        );
    document.addEventListener(
        "click",
        event => {
            const area =
                document.querySelector(
                    ".search-area"
                );
            if (
                area
                &&
                !area.contains(
                    event.target
                )
            ) {
                clearSearchResults();
            }
        }
    );
}
/* =========================================================
   LOAD DATA
========================================================= */
async function loadAllData() {
    const uiResponse =
        await fetch(
            `${DATA_URL}?t=${Date.now()}`,
            {
                cache: "no-store"
            }
        );
    if (
        !uiResponse.ok
    ) {
        throw new Error(
            `無法讀取 ${DATA_URL}，HTTP ${uiResponse.status}`
        );
    }
    const ui =
        await uiResponse.json();
    let securities = [];
    try {
        const securitiesResponse =
            await fetch(
                `${SECURITIES_URL}?t=${Date.now()}`,
                {
                    cache: "no-store"
                }
            );
        if (
            securitiesResponse.ok
        ) {
            securities =
                await securitiesResponse.json();
        }
    } catch(error) {
        console.warn(
            "securities.json load warning:",
            error
        );
    }
    return {
        ui,
        securities
    };
}
/* =========================================================
   NORMALIZE UI DATA
========================================================= */
function normalizeUiData(
    data
) {
    if (
        !data
        ||
        typeof data !== "object"
    ) {
        return {
            statistics: {},
            today_selected: [],
            top10: [],
            stocks: [],
            stock: [],
            etfs: [],
            bonds: []
        };
    }
    const result = {
        ...data
    };
    result.today_selected =
        firstArray(
            data.today_selected,
            data.todaySelected,
            data.featured,
            data.recommended,
            data.recommendations
        );
    result.top10 =
        firstArray(
            data.top10,
            data.top_10,
            data.ai_top10,
            data.ranking
        );
    result.stocks =
        firstArray(
            data.stocks,
            data.stock_data,
            data.stockData,
            data.items
        );
    result.stock =
        firstArray(
            data.stock
        );
    result.etfs =
        firstArray(
            data.etfs,
            data.ETF,
            data.etf
        );
    result.bonds =
        firstArray(
            data.bonds,
            data.bond
        );
    result.statistics =
        data.statistics
        ||
        data.summary
        ||
        {};
    return result;
}
/* =========================================================
   NORMALIZE SECURITIES
========================================================= */
function normalizeSecurities(
    data
) {
    if (
        Array.isArray(data)
    ) {
        return data;
    }
    if (
        data &&
        Array.isArray(
            data.securities
        )
    ) {
        return data.securities;
    }
    if (
        data &&
        Array.isArray(
            data.items
        )
    ) {
        return data.items;
    }
    return [];
}
/* =========================================================
   ARRAY HELPER
========================================================= */
function firstArray(
    ...values
) {
    for (
        const value
        of values
    ) {
        if (
            Array.isArray(value)
        ) {
            return value;
        }
    }
    return [];
}
/* =========================================================
   RENDER DASHBOARD
========================================================= */
function renderDashboard() {
    renderMetrics();
    renderFeatured();
    renderTop10();
    renderEtf();
    renderBonds();
    renderWatchlist();
    renderFooter();
}
/* =========================================================
   METRICS
========================================================= */
function renderMetrics() {

        uiData.today_selected

            stats.stocks

        );

/* =========================================================
   FEATURED

function renderFeatured() {

    ) {

/* =========================================================
   FEATURED CARD

function renderFeaturedCard(

) {
    const code =

}
/* =========================================================
   TOP 10
========================================================= */
function renderTop10() {
    const body =
        $("topTableBody");

        )

    ) {

/* =========================================================
   TOP ROW

function renderTopRow(

                class="${changeClass(change)}"

}
/* =========================================================
   ETF
========================================================= */
function renderEtf() {
    const container =

        )

function renderAssetCard(

}
/* =========================================================
   BONDS
========================================================= */
function renderBonds() {
    const container =
        $("bondGrid");
    const items =
        Array.isArray(
            uiData.bonds
        )
            ? uiData.bonds
            : [];
    if (

    ) {
        container.innerHTML =

/* =========================================================
   BOND CARD
========================================================= */
function renderBondCard(
    item
) {
    const code =
        getCode(item);
    const name =
        getName(item);
    const price =
        getPrice(item);
    return `
        <article class="asset-card">

                <div>
                    <div class="asset-code">

                    </div>

                </div>
                <div
                    class="asset-type"
                    style="
                        background:var(--yellow-soft);
                        color:var(--yellow);
                    "
                >

                </div>

            <div class="asset-price">

            </div>

                債券資產資料
            </div>
        </article>
    `;
}
/* =========================================================
   SEARCH
========================================================= */
function performSearch() {
    const keyword =
        $("searchInput")
            .value
            .trim()
            .toLowerCase();
    const results =
        $("searchResults");
    if (!keyword) {
        clearSearchResults();
        return;
    }
    if (
        !Array.isArray(
            securitiesData
        )
        ||
        !securitiesData.length
    ) {
        results.innerHTML =
            emptyHtml(
                "資料檔尚未部署",
                "目前沒有可供搜尋的 securities.json。"
            );
        results
            .classList
            .add("active");
        return;
    }
    const matches =
        securitiesData
            .filter(
                item =>
                    securityMatches(
                        item,
                        keyword
                    )
            )
            .slice(
                0,
                20
            );
    if (!matches.length) {
        results.innerHTML =
            emptyHtml(
                "找不到符合的標的",
                `沒有找到「${escapeHtml(keyword)}」相關資料。`
            );
        results
            .classList
            .add("active");
        return;
    }
    results.innerHTML =
        matches
            .map(
                renderSearchResult
            )
            .join("");
    results
        .classList
        .add("active");
}
/* =========================================================
   CLEAR SEARCH
========================================================= */
function clearSearchResults() {
    $("searchResults")
        .innerHTML = "";
    $("searchResults")
        .classList
        .remove("active");
}
/* =========================================================
   SECURITY MATCH
========================================================= */
function securityMatches(
    item,
    keyword
) {
    const code =
        String(
            item?.code
            ??
            item?.symbol
            ??
            ""
        )
        .toLowerCase();
    const name =
        String(
            item?.name
            ??
            item?.CompanyName
            ??
            ""
        )
        .toLowerCase();
    const symbol =
        String(
            item?.symbol
            ??
            ""
        )
        .toLowerCase();
    return (
        code.includes(keyword)
        ||
        name.includes(keyword)
        ||
        symbol.includes(keyword)
    );
}
/* =========================================================
   SEARCH RESULT
========================================================= */
function renderSearchResult(
    item
) {
    const code =
        getCode(item);
    const name =
        getName(item);
    const market =
        getMarket(item);
    const key =
        securityKey(item);
    const exists =
        watchlist.some(
            x =>
                securityKey(x)
                ===
                key
        );
    return `
        <div class="search-result-item">
            <div class="search-result-main">
                <span class="stock-code">
                    ${escapeHtml(code)}
                </span>
                <span class="stock-name">
                    ${escapeHtml(name)}
                </span>
                <span class="stock-market">
                    ${escapeHtml(market)}
                </span>
            </div>
            <div class="search-result-actions">
                ${
                    exists
                    ?
                    `
                    <button
                        class="small-button remove"
                        type="button"
                        onclick="removeFromWatchlistByKey('${escapeAttribute(key)}')"
                    >
                        已加入
                    </button>
                    `
                    :
                    `
                    <button
                        class="small-button primary"
                        type="button"
                        onclick="addToWatchlist('${escapeAttribute(key)}')"
                    >
                        ＋ 加入清單
                    </button>
                    `
                }
            </div>
        </div>
    `;
}
/* =========================================================
   WATCHLIST STORAGE
========================================================= */
function loadWatchlist() {
    try {
        const raw =
            localStorage.getItem(
                "tw_ai_watchlist_v11"
            );
        watchlist =
            raw
                ? JSON.parse(raw)
                : [];
        if (
            !Array.isArray(
                watchlist
            )
        ) {
            watchlist = [];
        }
    } catch {
        watchlist = [];
    }
}
/* =========================================================
   HOLDINGS STORAGE
========================================================= */
function loadHoldings() {
    try {
        const raw =
            localStorage.getItem(
                "tw_ai_holdings_v11"
            );
        holdings =
            raw
                ? JSON.parse(raw)
                : {};
        if (
            !holdings
            ||
            typeof holdings !== "object"
        ) {
            holdings = {};
        }
    } catch {
        holdings = {};
    }
}
/* =========================================================
   SAVE WATCHLIST
========================================================= */
function saveWatchlist() {
    try {
        localStorage.setItem(
            "tw_ai_watchlist_v11",
            JSON.stringify(
                watchlist
            )
        );
    } catch(error) {
        console.warn(
            "Watchlist save error:",
            error
        );
    }
}
/* =========================================================
   SAVE HOLDINGS
========================================================= */
function saveHoldings() {
    try {
        localStorage.setItem(
            "tw_ai_holdings_v11",
            JSON.stringify(
                holdings
            )
        );
    } catch(error) {
        console.warn(
            "Holdings save error:",
            error
        );
    }
}
/* =========================================================
   ADD WATCHLIST
========================================================= */
function addToWatchlist(
    key
) {
    const item =
        securitiesData.find(
            x =>
                securityKey(x)
                ===
                key
        );
    if (!item) {
        return;
    }
    const exists =
        watchlist.some(
            x =>
                securityKey(x)
                ===
                key
        );
    if (exists) {
        return;
    }
    watchlist.push(
        normalizeWatchItem(
            item
        )
    );
    saveWatchlist();
    renderWatchlist();
    performSearch();
}
/* =========================================================
   REMOVE WATCHLIST
========================================================= */
function removeFromWatchlistByKey(
    key
) {
    watchlist =
        watchlist.filter(
            item =>
                securityKey(item)
                !==
                key
        );
    saveWatchlist();
    renderWatchlist();
    performSearch();
}
/* =========================================================
   NORMALIZE WATCH ITEM
========================================================= */
function normalizeWatchItem(
    item
) {
    return {
        code:
            item.code
            ??
            item.symbol
            ??
            "",
        symbol:
            item.symbol
            ??
            "",
        name:
            item.name
            ??
            item.CompanyName
            ??
            "",
        market:
            item.market
            ??
            item.exchange
            ??
            "",
        type:
            item.type
            ??
            "stock",
        is_etf:
            Boolean(
                item.is_etf
            )
    };
}
/* =========================================================
   RENDER WATCHLIST
========================================================= */
function renderWatchlist() {
    const container =
        $("watchlistGrid");
    const count =
        $("watchCount");
    count.textContent =
        `${watchlist.length} 檔`;
    if (
        !watchlist.length
    ) {
        container.innerHTML =
            emptyHtml(
                "目前沒有追蹤標的",
                "請使用上方「查詢個股」搜尋股票，再加入你的清單。"
            );
        return;
    }
    container.innerHTML =
        watchlist
            .map(
                renderWatchCard
            )
            .join("");
}
/* =========================================================
   WATCH CARD
========================================================= */
function renderWatchCard(
    item
) {
    const code =
        getCode(item);
    const name =
        getName(item);
    const key =
        securityKey(item);
    const live =
        findCurrentRecord(
            code,
            item.market
        );
    const price =
        live
            ? getPrice(live)
            : null;
    const change =
        live
            ? getChange(live)
            : null;
    const trend =
        live
            ? getTrend(live)
            : "待分析";
    const normalRecommendation =
        live
            ? getRecommendation(live)
            : "等待最新市場資料";
    const holding =
        getHolding(key);
    const isHolding =
        isValidHolding(
            holding
        );
    const recommendation =
        isHolding
            ? getHoldingRecommendation(
                live,
                holding
              )
            : normalRecommendation;
    return `
        <article class="watch-card">
            <div class="watch-top">
                <div>
                    <div class="watch-code">
                        ${escapeHtml(code)}
                    </div>
                    <div class="watch-name">
                        ${escapeHtml(name)}
                    </div>
                </div>
                <button
                    class="small-button remove"
                    type="button"
                    onclick="removeFromWatchlistByKey('${escapeAttribute(key)}')"
                >
                    移除
                </button>
            </div>
            <div class="watch-price">
                ${
                    price !== null
                    ?
                    formatPrice(price)
                    :
                    "--"
                }
            </div>
            <div
                class="watch-change
                ${changeClass(change)}"
            >
                ${
                    live
                    ?
                    formatChange(change)
                    :
                    "尚無行情"
                }
            </div>
            <div class="watch-status-row">
                <span class="watch-status-label">
                    趨勢狀態
                </span>
                ${renderSignal(trend)}
            </div>
            <div class="watch-recommendation">
                <div
                    style="
                        color:var(--text3);
                        font-size:9px;
                        margin-bottom:5px;
                    "
                >
                    ${isHolding
                        ? "持有狀態建議"
                        : "目前建議"}
                </div>
                ${escapeHtml(
                    recommendation
                )}
            </div>
            ${
                isHolding
                ?
                renderHoldingBox(
                    key,
                    holding,
                    price
                )
                :
                `
                <div class="not-holding">
                    目前未設定持有部位。
                    <button
                        class="small-button primary"
                        style="margin-left:6px;"
                        type="button"
                        onclick="startHolding('${escapeAttribute(key)}')"
                    >
                        設定持有
                    </button>
                </div>
                `
            }
        </article>
    `;
}
/* =========================================================
   HOLDING BOX
========================================================= */
function renderHoldingBox(
    key,
    holding,
    currentPrice
) {
    const shares =
        Number(
            holding.shares
        ) || 0;
    const cost =
        Number(
            holding.cost
        ) || 0;
    const marketValue =
        Number.isFinite(
            currentPrice
        )
            ? currentPrice * shares
            : null;
    const costValue =
        cost * shares;
    const pnl =
        marketValue !== null
            ? marketValue - costValue
            : null;
    const returnPct =
        cost > 0
        &&
        Number.isFinite(
            currentPrice
        )
            ? (
                (
                    currentPrice
                    -
                    cost
                )
                /
                cost
              ) * 100
            : null;
    return `
        <div class="holding-box">
            <div class="holding-header">
                <div class="holding-title">
                    我的持有部位
                </div>
                <button
                    class="holding-toggle"
                    type="button"
                    onclick="clearHolding('${escapeAttribute(key)}')"
                >
                    清除持有
                </button>
            </div>
            <div class="holding-fields">
                <div class="holding-field">
                    <label>
                        持有股數
                    </label>
                    <input
                        type="number"
                        min="0"
                        step="1"
                        value="${shares || ""}"
                        onchange="updateHoldingShares('${escapeAttribute(key)}', this.value)"
                    >
                </div>
                <div class="holding-field">
                    <label>
                        持有成本
                    </label>
                    <input
                        type="number"
                        min="0"
                        step="0.01"
                        value="${cost || ""}"
                        onchange="updateHoldingCost('${escapeAttribute(key)}', this.value)"
                    >
                </div>
            </div>
            <div class="holding-summary">
                <div class="holding-stat">
                    <div class="holding-stat-label">
                        目前市值
                    </div>
                    <div class="holding-stat-value">
                        ${
                            marketValue !== null
                            ?
                            formatMoney(
                                marketValue
                            )
                            :
                            "--"
                        }
                    </div>
                </div>
                <div class="holding-stat">
                    <div class="holding-stat-label">
                        未實現損益
                    </div>
                    <div
                        class="
                            holding-stat-value
                            ${
                                pnl === null
                                ? ""
                                : pnl >= 0
                                    ? "profit"
                                    : "loss"
                            }
                        "
                    >
                        ${
                            pnl !== null
                            ?
                            formatMoney(
                                pnl,
                                true
                            )
                            :
                            "--"
                        }
                    </div>
                </div>
                <div class="holding-stat">
                    <div class="holding-stat-label">
                        報酬率
                    </div>
                    <div
                        class="
                            holding-stat-value
                            ${
                                returnPct === null
                                ? ""
                                : returnPct >= 0
                                    ? "profit"
                                    : "loss"
                            }
                        "
                    >
                        ${
                            returnPct !== null
                            ?
                            formatPercent(
                                returnPct
                            )
                            :
                            "--"
                        }
                    </div>
                </div>
                <div class="holding-stat">
                    <div class="holding-stat-label">
                        成本總額
                    </div>
                    <div class="holding-stat-value">
                        ${
                            costValue > 0
                            ?
                            formatMoney(
                                costValue
                            )
                            :
                            "--"
                        }
                    </div>
                </div>
            </div>
        </div>
    `;
}
/* =========================================================
   HOLDING ACTIONS
========================================================= */
function startHolding(
    key
) {
    holdings[key] = {
        shares: 0,
        cost: 0
    };
    saveHoldings();
    renderWatchlist();
}
function updateHoldingShares(
    key,
    value
) {
    if (!holdings[key]) {
        holdings[key] = {
            shares: 0,
            cost: 0
        };
    }
    const shares =
        Number(value);
    holdings[key].shares =
        Number.isFinite(shares)
            ? Math.max(
                0,
                shares
              )
            : 0;
    saveHoldings();
    renderWatchlist();
}
function updateHoldingCost(
    key,
    value
) {
    if (!holdings[key]) {
        holdings[key] = {
            shares: 0,
            cost: 0
        };
    }
    const cost =
        Number(value);
    holdings[key].cost =
        Number.isFinite(cost)
            ? Math.max(
                0,
                cost
              )
            : 0;
    saveHoldings();
    renderWatchlist();
}
function clearHolding(
    key
) {
    delete holdings[key];
    saveHoldings();
    renderWatchlist();
}
/* =========================================================
   HOLDING VALIDATION
========================================================= */
function getHolding(
    key
) {
    return holdings[key]
        ||
        null;
}
function isValidHolding(
    holding
) {
    if (
        !holding
    ) {
        return false;
    }
    const shares =
        Number(
            holding.shares
        );
    const cost =
        Number(
            holding.cost
        );
    return (
        Number.isFinite(shares)
        &&
        shares > 0
        &&
        Number.isFinite(cost)
        &&
        cost > 0
    );
}
/* =========================================================
   HOLDING RECOMMENDATION
   ---------------------------------------------------------
   優先使用後端提供的 holding_recommendation。
   前端不自行重算 RSI / MACD / KD。
========================================================= */
function getHoldingRecommendation(
    live,
    holding
) {
    if (
        live
        &&
        typeof live === "object"
        &&
        live.holding_recommendation
    ) {
        return String(
            live.holding_recommendation
        );
    }
    if (
        live
        &&
        typeof live === "object"
        &&
        live.recommendation_holding
    ) {
        return String(
            live.recommendation_holding
        );
    }
    if (
        live
        &&
        typeof live === "object"
        &&
        live.holder_recommendation
    ) {
        return String(
            live.holder_recommendation
        );
    }
    return getRecommendation(
        live
    );
}
/* =========================================================
   FIND CURRENT RECORD
========================================================= */
function findCurrentRecord(
    code,
    market
) {
    const arrays = [
        uiData?.today_selected,
        uiData?.top10,
        uiData?.stocks,
        uiData?.stock
    ];
    for (
        const array
        of arrays
    ) {
        if (
            !Array.isArray(
                array
            )
        ) {
            continue;
        }
        const found =
            array.find(
                item => {
                    const itemCode =
                        String(
                            getCode(item)
                        );
                    const sameCode =
                        itemCode ===
                        String(code);
                    const itemMarket =
                        getMarket(item);
                    const sameMarket =
                        !market
                        ||
                        !itemMarket
                        ||
                        itemMarket ===
                        market;
                    return (
                        sameCode
                        &&
                        sameMarket
                    );
                }
            );
        if (found) {
            return found;
        }
    }
    return null;
}
/* =========================================================
   TREND
========================================================= */
function getTrend(
    item
) {
    if (
        !item
    ) {
        return "待分析";
    }
    return String(
        item.trend_status
        ??
        item.trend
        ??
        item.market_trend
        ??
        "待分析"
    );
}
/* =========================================================
   RECOMMENDATION
========================================================= */
function getRecommendation(
    item
) {
    if (
        !item
    ) {
        return "等待最新市場資料";
    }
    return String(
        item.recommendation
        ??
        item.action
        ??
        item.advice
        ??
        "等待後端分析"
    );
}
/* =========================================================
   SIGNAL
========================================================= */
function renderSignal(
    trend
) {
    const text =
        String(
            trend
            ||
            "待分析"
        );
    const cls =
        trendClass(
            text
        );
    return `
        <span
            class="signal ${cls}"
        >
            ${escapeHtml(text)}
        </span>
    `;
}
/* =========================================================
   TREND CLASS
========================================================= */
function trendClass(
    trend
) {
    const text =
        String(
            trend
            ||
            ""
        );
    if (
        /強勢|偏多|多方|上升|轉強|看多|積極/
            .test(text)
    ) {
        return "bullish";
    }
    if (
        /偏弱|弱勢|空方|下降|轉弱|看空/
            .test(text)
    ) {
        return "weak";
    }
    if (
        /等待|觀望|確認|待分析/
            .test(text)
    ) {
        return "wait";
    }
    return "neutral";
}
/* =========================================================
   BASIC DATA HELPERS
========================================================= */
function getCode(
    item
) {
    return String(
        item?.code
        ??
        item?.symbol
        ??
        item?.ticker
        ??
        ""
    )
    .replace(
        ".TW",
        ""
    )
    .replace(
        ".TWO",
        "");
}
function getName(
    item
) {
    return String(
        item?.name
        ??
        item?.CompanyName
        ??
        item?.company_name
        ??
        "未命名"
    );
}
function getMarket(
    item
) {
    return String(
        item?.market
        ??
        item?.exchange
        ??
        ""
    );
}
function getPrice(
    item
) {
    if (!item) {
        return null;
    }
    const value =
        item.price
        ??
        item.close
        ??
        item.Close;
    const number =
        Number(value);
    return Number.isFinite(
        number
    )
        ? number
        : null;
}
function getChange(
    item
) {
    if (!item) {
        return null;
    }
    const value =
        item.change_pct
        ??
        item.changePercent
        ??
        item.change
        ??
        null;
    const number =
        Number(value);
    return Number.isFinite(
        number
    )
        ? number
        : null;
}
/* =========================================================
   SECURITY KEY
========================================================= */
function securityKey(
    item
) {
    return `${getMarket(item)}:${getCode(item)}`;
}
/* =========================================================
   FORMAT
========================================================= */
function formatNumber(
    value
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "--";
    }
    return number.toLocaleString(
        "zh-TW",
        {
            maximumFractionDigits:
                2
        }
    );
}
function formatPrice(
    value
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "--";
    }
    return number.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits:
                2,
            maximumFractionDigits:
                2
        }
    );
}
function formatMoney(
    value,
    signed = false
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "--";
    }
    const prefix =
        signed && number > 0
            ? "+"
            : "";
    return prefix +
        number.toLocaleString(
            "zh-TW",
            {
                minimumFractionDigits:
                    0,
                maximumFractionDigits:
                    2
            }
        ) +
        " 元";
}
function formatPercent(
    value
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "--";
    }
    const prefix =
        number > 0
            ? "+"
            : "";
    return `${prefix}${number.toFixed(2)}%`;
}
function formatChange(
    value
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "--";
    }
    const prefix =
        number > 0
            ? "+"
            : "";
    return `${prefix}${number.toFixed(2)}%`;
}
function changeClass(
    value
) {
    const number =
        Number(value);
    if (
        !Number.isFinite(
            number
        )
    ) {
        return "flat";
    }
    if (
        number > 0
    ) {
        return "up";
    }
    if (
        number < 0
    ) {
        return "down";
    }
    return "flat";
}
/* =========================================================
   DATE
========================================================= */
function formatDateShort(
    value
) {
    if (!value) {
        return "-";
    }
    const text =
        String(value);
    if (
        /^\d{4}-\d{2}-\d{2}$/
            .test(text)
    ) {
        return text.slice(
            5
        );
    }
    if (
        text.length >= 10
    ) {
        return text.slice(
            5,
            10
        );
    }
    return text;
}
/* =========================================================
   EMPTY
========================================================= */
function emptyHtml(
    title,
    description
) {
    return `
        <div class="empty">
            <div class="empty-title">
                ${escapeHtml(title)}
            </div>
            <div class="empty-description">
                ${escapeHtml(description)}
            </div>
        </div>
    `;
}
/* =========================================================
   ESCAPE
========================================================= */
function escapeHtml(
    value
) {
    return String(
        value
        ??
        ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );
}
function escapeAttribute(
    value
) {
    return String(
        value
        ??
        ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );
}
/* =========================================================
   ERROR
========================================================= */
function showError(
    error
) {
    $("errorPanel")
        .classList
        .add(
            "active"
        );
    $("errorTitle")
        .textContent =
        "無法載入儀表板資料";
    $("errorMessage")
        .textContent =
        `${error.message || error}`;
    $("dashboard")
        .classList
        .add(
            "hidden"
        );
}
function hideError() {
    $("errorPanel")
        .classList
        .remove(
            "active"
        );
}
/* =========================================================
   LOADING
========================================================= */
function showLoading(
    visible
) {
    if (visible) {
        $("loading")
            .classList
            .remove(
                "hidden"
            );
    } else {
        $("loading")
            .classList
            .add(
                "hidden"
            );
    }
}
/* =========================================================
   FOOTER
========================================================= */
function renderFooter() {
    const date =
        uiData?.updated_at_tw
        ||
        uiData?.updated_at
        ||
        uiData?.latest_market_date
        ||
        uiData?.date
        ||
        "";
    $("footerUpdated")
        .textContent =
        date
            ? `最後資料更新：${date}`
            : "";
}
/* =========================================================
   GLOBAL FUNCTIONS
========================================================= */
window.addToWatchlist =
    addToWatchlist;
window.removeFromWatchlistByKey =
    removeFromWatchlistByKey;
window.startHolding =
    startHolding;
window.updateHoldingShares =
    updateHoldingShares;
window.updateHoldingCost =
    updateHoldingCost;
window.clearHolding =
    clearHolding;
</script>
