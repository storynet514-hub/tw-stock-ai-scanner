<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="台股 AI 選股與零股定投動態分析儀表板">
  <title>台股 AI 選股・零股定投</title>

  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151c2c;
      --card: #1e293b;
      --card2: #111827;
      --border: #2e3d56;
      --text: #f8fafc;
      --sub: #94a3b8;
      --blue: #3b82f6;
      --blue-soft: rgba(59,130,246,.15);
      --red: #ef4444;
      --green: #22c55e;
      --yellow: #f59e0b;
      --orange: #f97316;
      --gray: #64748b;
      --purple: #8b5cf6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Helvetica Neue",
        Arial,
        sans-serif;

      background:
        radial-gradient(
          circle at top,
          #111827 0%,
          var(--bg) 45%
        );

      color: var(--text);
      min-height: 100vh;
      padding: 16px;
    }

    .app {
      width: 100%;
      max-width: 980px;
      margin: 0 auto;
    }

    /* ======================================================
       Header
       ====================================================== */

    header {
      margin-bottom: 18px;
    }

    .brand {
      font-size: 1.45rem;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .subtitle {
      margin-top: 4px;
      color: var(--sub);
      font-size: .95rem;
    }

    .status-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--sub);
      font-size: .78rem;
    }

    .status-pill.ok {
      color: #86efac;
      border-color: rgba(34,197,94,.35);
      background: rgba(34,197,94,.08);
    }

    .status-pill.warn {
      color: #fcd34d;
      border-color: rgba(245,158,11,.35);
      background: rgba(245,158,11,.08);
    }

    .status-pill.error {
      color: #fca5a5;
      border-color: rgba(239,68,68,.35);
      background: rgba(239,68,68,.08);
    }

    /* ======================================================
       Top summary
       ====================================================== */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .summary-label {
      color: var(--sub);
      font-size: .78rem;
      margin-bottom: 6px;
    }

    .summary-value {
      font-size: 1.45rem;
      font-weight: 800;
    }

    .summary-sub {
      margin-top: 4px;
      color: var(--sub);
      font-size: .72rem;
    }

    /* ======================================================
       Search
       ====================================================== */

    .search-section {
      margin-bottom: 16px;
    }

    .search-title {
      color: var(--sub);
      font-size: .82rem;
      margin-bottom: 7px;
    }

    .search-row {
      display: flex;
      gap: 8px;
    }

    .search-row input {
      flex: 1;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 13px;
      color: var(--text);
      outline: none;
      font-size: .9rem;
    }

    .search-row input:focus {
      border-color: var(--blue);
    }

    .search-row button {
      border: 0;
      border-radius: 9px;
      padding: 0 18px;
      background: var(--blue);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    /* ======================================================
       Tabs
       ====================================================== */

    .tabs {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      margin-bottom: 16px;
      padding-bottom: 4px;
    }

    .tab {
      flex: 0 0 auto;
      padding: 9px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--sub);
      cursor: pointer;
      font-size: .82rem;
      font-weight: 600;
    }

    .tab.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    /* ======================================================
       Common
       ====================================================== */

    .section {
      margin-bottom: 16px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 9px;
      font-weight: 800;
    }

    .section-title small {
      color: var(--sub);
      font-size: .72rem;
      font-weight: 400;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .mini-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .mini-label {
      color: var(--sub);
      font-size: .7rem;
      margin-bottom: 5px;
    }

    .mini-value {
      font-size: 1rem;
      font-weight: 800;
    }

    .muted {
      color: var(--sub);
    }

    .empty {
      text-align: center;
      padding: 30px 16px;
      color: var(--sub);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }

    .error-box {
      padding: 18px;
      border-radius: 12px;
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.3);
      color: #fca5a5;
      line-height: 1.7;
    }

    .notice-box {
      padding: 12px;
      border-radius: 10px;
      background: rgba(59,130,246,.08);
      border: 1px solid rgba(59,130,246,.25);
      color: #bfdbfe;
      font-size: .78rem;
      line-height: 1.6;
    }

    /* ======================================================
       Stock cards
       ====================================================== */

    .stock-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .stock-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 13px;
      padding: 13px;
    }

    .stock-head {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .stock-title {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .stock-code {
      color: var(--sub);
      font-size: .75rem;
      margin-top: 2px;
    }

    .price-area {
      text-align: right;
      flex: 0 0 auto;
    }

    .price {
      font-size: 1.1rem;
      font-weight: 800;
    }

    .change {
      font-size: .75rem;
      margin-top: 2px;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .metric {
      background: rgba(15,23,42,.65);
      border-radius: 8px;
      padding: 8px;
    }

    .metric-label {
      color: var(--sub);
      font-size: .66rem;
    }

    .metric-value {
      margin-top: 3px;
      font-size: .82rem;
      font-weight: 700;
    }

    .signal-row {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }

    .signal {
      border-radius: 999px;
      padding: 4px 7px;
      font-size: .66rem;
      border: 1px solid var(--border);
      color: var(--sub);
      background: rgba(15,23,42,.7);
    }

    .signal.pass {
      color: #86efac;
      border-color: rgba(34,197,94,.3);
      background: rgba(34,197,94,.08);
    }

    .signal.fail {
      color: #fca5a5;
      border-color: rgba(239,68,68,.3);
      background: rgba(239,68,68,.08);
    }

    .signal.neutral {
      color: #cbd5e1;
    }

    /* ======================================================
       DCA action
       ====================================================== */

    .action {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: .72rem;
      font-weight: 800;
    }

    .action-buy {
      color: #86efac;
      background: rgba(34,197,94,.12);
      border: 1px solid rgba(34,197,94,.3);
    }

    .action-observe {
      color: #fde68a;
      background: rgba(245,158,11,.12);
      border: 1px solid rgba(245,158,11,.3);
    }

    .action-pause {
      color: #fca5a5;
      background: rgba(239,68,68,.12);
      border: 1px solid rgba(239,68,68,.3);
    }

    .action-extreme {
      color: #c4b5fd;
      background: rgba(139,92,246,.12);
      border: 1px solid rgba(139,92,246,.3);
    }

    /* ======================================================
       Historical stats
       ====================================================== */

    .history-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px;
    }

    .history-period {
      font-weight: 800;
      font-size: .82rem;
      margin-bottom: 7px;
    }

    .history-value {
      font-size: .9rem;
      font-weight: 700;
    }

    /* ======================================================
       Stock detail
       ====================================================== */

    .detail-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 12px;
    }

    .detail-name {
      font-size: 1.35rem;
      font-weight: 900;
    }

    .detail-code {
      color: var(--sub);
      font-size: .78rem;
      margin-top: 3px;
    }

    .back-btn {
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--sub);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
    }

    /* ======================================================
       Responsive
       ====================================================== */

    @media (min-width: 700px) {
      body {
        padding: 28px;
      }

      .summary-grid {
        grid-template-columns: repeat(4, 1fr);
      }

      .metric-grid {
        grid-template-columns: repeat(6, 1fr);
      }
    }

    @media (max-width: 520px) {
      .grid-3 {
        grid-template-columns: repeat(2, 1fr);
      }

      .metric-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* 台股：上漲紅、下跌綠 */
    .up {
      color: var(--red) !important;
    }

    .down {
      color: var(--green) !important;
    }

    .flat {
      color: var(--sub) !important;
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ====================================================
       Header
       ==================================================== -->

  <header>

    <div class="brand">
      台股 AI 選股・零股定投

  <!-- ====================================================

  <!-- ====================================================

  <!-- ====================================================

<script>
"use strict";

/* =========================================================
   Data Sources
   ========================================================= */

const DATA_PATHS = {

  analysis:
    "./Data/analysis.json",

  universe:
    "./Data/universe.json",

  chip:
    "./Data/chip.json",

  priceManifest:
    "./Data/prices/manifest.json"

};


/* =========================================================
   Global State
   ========================================================= */

const APP = {

  analysis: null,

  universe: null,

  chip: null,

  priceManifest: null,

  stocks: {},

  universeStocks: [],

  currentTab: "overview",

  searchResult: null,

  loaded: {

    analysis: false,

    universe: false,

    chip: false,

    priceManifest: false

  }

};


/* =========================================================
   Utility
   ========================================================= */

function byId(id) {
  return document.getElementById(id);
}


function number(value, fallback = null) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return fallback;
  }

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : fallback;
}


function formatNumber(value, digits = 0) {

  const n = number(value);

  if (n === null) {
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatPct(value, digits = 2) {

  const n = number(value);

  if (n === null) {
    return "--";
  }

  const sign = n > 0
    ? "+"
    : "";

  return sign +
    n.toFixed(digits) +
    "%";
}


function escapeHTML(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


function normalizeSymbol(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .trim()
    .toUpperCase()
    .replace(/\.TW$/, "")
    .replace(/\.TWO$/, "");
}


function getStock(symbol) {

  return APP.stocks[
    normalizeSymbol(symbol)
  ] || null;
}


function getMetric(stock, key) {

  return stock?.metrics?.[key]
    ?? null;
}


function latestDateFromStock(stock) {

  return (
    stock?.latest_date
    ||
    stock?.metrics?.date
    ||
    null
  );
}


function priceColorClass(change) {

  const n = number(change);

  if (n === null) {
    return "flat";
  }

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "flat";
}


/* =========================================================
   Fetch JSON
   ========================================================= */

async function fetchJSON(path) {

  const separator =
    path.includes("?")
      ? "&"
      : "?";

  const url =
    path +
    separator +
    "_=" +
    Date.now();

  const response =
    await fetch(
      url,
      {
        cache: "no-store"
      }
    );

  if (!response.ok) {

    throw new Error(
      `${response.status} ${response.statusText}: ${path}`
    );

  }

  return await response.json();
}


/* =========================================================
   Load Data
   ========================================================= */

async function loadAllData() {

  setSystemStatus(
    "⏳ 正在讀取分析資料",
    "warn"
  );

  /*
   * analysis.json 是核心資料。
   * 如果 analysis.json 失敗，儀表板不能假裝正常。
   */

  try {

    APP.analysis =
      await fetchJSON(
        DATA_PATHS.analysis
      );

    APP.loaded.analysis = true;

  } catch (error) {

    console.error(
      "analysis.json 讀取失敗",
      error
    );

    renderFatalError(
      "無法載入核心分析資料",
      error.message
    );

    setSystemStatus(
      "❌ analysis.json 讀取失敗",
      "error"
    );

    return false;
  }


  /*
   * universe.json
   */

  try {

    APP.universe =
      await fetchJSON(
        DATA_PATHS.universe
      );

    APP.loaded.universe = true;

  } catch (error) {

    console.warn(
      "universe.json 讀取失敗",
      error
    );

  }


  /*
   * chip.json
   *
   * 不是核心依賴。
   * analysis.json 已經包含主要籌碼分析結果。
   */

  try {

    APP.chip =
      await fetchJSON(
        DATA_PATHS.chip
      );

    APP.loaded.chip = true;

  } catch (error) {

    console.warn(
      "chip.json 尚未載入",
      error
    );

  }


  /*
   * prices/manifest.json
   *
   * 主要用於確認價格資料層。
   * 個股主要分析結果直接使用 analysis.json。
   */

  try {

    APP.priceManifest =
      await fetchJSON(
        DATA_PATHS.priceManifest
      );

    APP.loaded.priceManifest = true;

  } catch (error) {

    console.warn(
      "prices/manifest.json 尚未載入",
      error
    );

  }


  buildStockIndex();

  updateSummary();

  updateDataStatus();

  return true;
}


/* =========================================================
   Build Stock Index
   ========================================================= */

function buildStockIndex() {

  APP.stocks = {};

  /*
   * 主要來源：
   *
   * analysis.json
   * └── stocks
   *      └── 2337
   */

  const analysisStocks =
    APP.analysis?.stocks;

  if (
    analysisStocks &&
    typeof analysisStocks === "object" &&
    !Array.isArray(analysisStocks)
  ) {

    for (
      const [symbol, stock]
      of Object.entries(
        analysisStocks
      )
    ) {

      const normalized =
        normalizeSymbol(symbol);

      if (!normalized) {
        continue;
      }

      APP.stocks[normalized] = {

        ...stock,

        symbol:
          stock.symbol ||
          normalized

      };

    }

  }


  /*
   * Universe 名冊
   *
   * 用來補名稱、代號、Market。
   */

  const universeItems =
    Array.isArray(
      APP.universe
    )
      ? APP.universe
      : Array.isArray(
          APP.universe?.items
        )
        ? APP.universe.items
        : Array.isArray(
            APP.universe?.stocks
          )
          ? APP.universe.stocks
          : [];

  APP.universeStocks =
    universeItems;


  for (
    const item
    of universeItems
  ) {

    const symbol =
      normalizeSymbol(
        item.code ||
        item.symbol ||
        item.ticker
      );

    if (!symbol) {
      continue;
    }

    if (!APP.stocks[symbol]) {

      APP.stocks[symbol] = {

        symbol,

        name:
          item.name || "",

        market:
          item.market || "",

        status:
          "no_analysis"

      };

    } else {

      APP.stocks[symbol].name =
        APP.stocks[symbol].name ||
        item.name ||
        "";

      APP.stocks[symbol].market =
        APP.stocks[symbol].market ||
        item.market ||
        "";

    }

  }

}


/* =========================================================
   Status
   ========================================================= */

function setSystemStatus(
  text,
  type = ""
) {

  const el =
    byId("system-status");

  if (!el) {
    return;
  }

  el.textContent = text;

  el.className =
    "status-pill " +
    type;
}


function updateDataStatus() {

  const stats =
    APP.analysis?.statistics ||
    {};

  const universe =
    number(
      stats.universe
    );

  const matched =
    number(
      stats.universe_price_matched
    );

  if (
    universe !== null &&
    matched !== null &&
    universe > 0 &&
    matched > 0
  ) {

    setSystemStatus(
      "🟢 分析資料正常",
      "ok"
    );

  } else {

    setSystemStatus(
      "⚠️ 資料尚未完整對接",
      "warn"
    );

  }

  const version =
    APP.analysis?.schema_version;

  if (version) {

    byId(
      "analysis-version"
    ).textContent =
      "分析版本：" +
      version;

  }

  const latest =
    findLatestDate();

  if (latest) {

    byId(
      "latest-date"
    ).textContent =
      "最新交易日：" +
      latest;

  }

}


function findLatestDate() {

  const stocks =
    Object.values(
      APP.stocks
    );

  const dates =
    stocks
      .map(
        stock =>
          latestDateFromStock(stock)
      )
      .filter(Boolean)
      .sort();

  if (!dates.length) {
    return null;
  }

  return dates[
    dates.length - 1
  ];

}

/* =========================================================

   ========================================================= */

function switchTab(tab) {

  APP.currentTab =
    tab;

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tab === tab
        );

      }
    );

  APP.searchResult =
    null;

  renderActiveTab();

}


function renderActiveTab() {

  const container =
    byId(
      "main-content"
    );

  if (!container) {
    return;
  }

  if (
    APP.searchResult
  ) {

    renderStockDetail(
      APP.searchResult
    );

    return;

  }

  switch (
    APP.currentTab
  ) {

    case "short":
      renderShortTerm(container);
      break;

    case "dca":
      renderDCA(container);
      break;

    case "stocks":
      renderStockList(container);
      break;

    case "overview":
    default:
      renderOverview(container);
      break;

  }

}

            : "--"
        )}

        ${metricBox(
          "20MA乖離",
          formatPct(
            metrics.bias20_pct

          "60日位置",
          number(

            : "--"
        )}

          "成交量",
          metrics.volume_signal ||
            "--"
        )}

      </div>

    </article>

  `;

}


/* =========================================================

  if (!stock) {

      symbol
    );

    return;
  }

  APP.searchResult =
    stock;

  renderActiveTab();

}


function closeStockDetail() {

  APP.searchResult =

  renderActiveTab();

}

/* =========================================================

   ========================================================= */

function renderStockHistorical(stock) {

  const historical =
    stock.historical ||
    stock.historical_stats ||
    null;


  if (
    !historical ||
    typeof historical !== "object"
  ) {

    return `

      <section class="section">

        <div class="section-title">
          <span>
            歷史訊號績效
          </span>

          <small>
            30 / 60 / 90 日
          </small>
        </div>

        <div class="panel">

          <div class="empty">

            此股票目前沒有
            30 / 60 / 90 日歷史績效資料。

            <br><br>

            不虛構勝率、平均報酬、
            最大獲利或最大虧損。

          </div>

        </div>

      </section>

    `;

  }


  const periods = [
    ["30d", "30 日"],
    ["60d", "60 日"],
    ["90d", "90 日"]
  ];


  return `

    <section class="section">

      <div class="section-title">
        <span>
          歷史訊號績效
        </span>

        <small>
          實際樣本
        </small>
      </div>

      <div class="grid-3">

        ${periods
          .map(
            ([key, label]) => {

              const h =
                historical[key] ||
                {};

              return `

                <div class="history-card">

                  <div class="history-period">
                    ${label}
                  </div>

                  <div class="mini-label">
                    勝率
                  </div>

                  <div class="history-value">
                    ${formatPct(
                      h.win_rate
                    )}
                  </div>

                  <div class="mini-label" style="margin-top:7px">
                    樣本
                  </div>

                  <div class="history-value">
                    ${formatNumber(
                      h.sample_count
                    )}
                  </div>

                  <div class="mini-label" style="margin-top:7px">
                    平均報酬
                  </div>

                  <div class="history-value">
                    ${formatPct(
                      h.average_return
                    )}
                  </div>

                  <div class="mini-label" style="margin-top:7px">
                    最大獲利
                  </div>

                  <div class="history-value">
                    ${formatPct(
                      h.max_gain
                    )}
                  </div>

                  <div class="mini-label" style="margin-top:7px">
                    最大虧損
                  </div>

                  <div class="history-value">
                    ${formatPct(
                      h.max_loss
                    )}
                  </div>

                </div>

              `;

            }
          )
          .join("")}

      </div>

    </section>

  `;

}


/* =========================================================
   Search
   ========================================================= */

function searchStock() {

  const input =
    byId(
      "search-input"
    );

  const keyword =
    normalizeSymbol(
      input?.value
    );

  if (!keyword) {

    alert(
      "請輸入股票代號或名稱"
    );

    return;

  }


  /*
   * 先用代號完全匹配
   */

  if (
    APP.stocks[keyword]
  ) {

    openStock(
      keyword
    );

    return;

  }


  /*
   * 再搜尋股票名稱
   */

  const found =
    Object.values(
      APP.stocks
    )
    .find(
      stock =>
        String(
          stock.name || ""
        )
        .toUpperCase()
        .includes(
          keyword
        )
    );


  if (found) {

    openStock(
      found.symbol
    );

    return;

  }


  alert(
    "找不到股票：" +
    input.value
  );

}


/* =========================================================
   UI Helpers
   ========================================================= */

function mini(
  label,
  value
) {

  return `

    <div class="mini-card">

      <div class="mini-label">
        ${escapeHTML(label)}
      </div>

      <div class="mini-value">
        ${escapeHTML(value)}
      </div>

    </div>

  `;

}


function metricBox(
  label,
  value
) {

  return `

    <div class="metric">

      <div class="metric-label">
        ${escapeHTML(label)}
      </div>

      <div class="metric-value">
        ${escapeHTML(value)}
      </div>

    </div>

  `;

}


function signal(
  label,
  passed
) {

  const cls =
    passed
      ? "pass"
      : "fail";

  return `

    <span
      class="signal ${cls}"
    >

      ${passed ? "✓" : "✕"}

      ${escapeHTML(label)}

    </span>

  `;

}


function chipSignal(
  label,
  value
) {

  const n =
    number(value);

  let cls =
    "neutral";

  let text =
    "--";

  if (n !== null) {

    text =
      (
        n > 0
          ? "+"
          : ""
      ) +
      n.toFixed(2);

    cls =
      n > 0
        ? "pass"
        : n < 0
          ? "fail"
          : "neutral";

  }

  return `

    <span
      class="signal ${cls}"
    >
      ${escapeHTML(label)}：
      ${escapeHTML(text)}
    </span>

  `;

}


function formatChip(value) {

  const n =
    number(value);

  if (n === null) {
    return "--";
  }

  return (
    n > 0
      ? "+"
      : ""
  ) +
  n.toFixed(2);

}


function statusText(status) {

  switch (status) {

    case "complete":
      return "完整";

    case "partial":
      return "部分";

    case "insufficient":
      return "不足";

    case "no_analysis":
      return "無分析";

    default:
      return status || "--";

  }

}


/* =========================================================
   Fatal Error
   ========================================================= */

  detail

  const container =

  container.innerHTML = `

      ${escapeHTML(detail)}

      儀表板核心資料：
      <br>
      <code>
        ./Data/analysis.json
      </code>

      <br><br>

      請確認 GitHub Actions
      已經成功產生並提交
      Data/analysis.json。

    </div>

  `;

}


/* =========================================================
   Keyboard
   ========================================================= */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      document.activeElement?.id ===
        "search-input"
    ) {

      searchStock();

    }

  }
);


/* =========================================================
   Start
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  async () => {

    const success =
      await loadAllData();

    if (!success) {
      return;
    }

    renderActiveTab();

  }
);
