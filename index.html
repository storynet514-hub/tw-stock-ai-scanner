<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<title>台股 AI 選股・零股定投</title>
<style>
:root {
  --bg: #0b0f19;
  --card: #151c2c;
  --card-dark: #0b0f19;
  --border: #263247;
  --text: #e2e8f0;
  --sub: #94a3b8;
  --white: #ffffff;
  --blue: #38bdf8;
  --green: #22c55e;
  --red: #ef4444;
  --yellow: #f59e0b;
  --purple: #a855f7;
  --gray: #64748b;
}
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
html {
  background: var(--bg);
}
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}
button,
input {
  font: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: default;
  opacity: .6;
}
.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 12px 40px;
}
/* ==========================================================
   HEADER
========================================================== */
.header {
  margin-bottom: 14px;
}
.title-row {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.title {
  color: var(--white);
  font-size: 21px;
  font-weight: 800;
  line-height: 1.3;
}
.subtitle {
  margin-top: 4px;
  color: var(--sub);
  font-size: 11px;
}
.system-status {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 9px;
  border: 1px solid var(--border);
  border-radius: 20px;
  color: var(--sub);
  font-size: 10px;
  white-space: nowrap;
}
.status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--gray);
}
.system-status.ok {
  color: var(--green);
}
.system-status.ok .status-dot {
  background: var(--green);
}
.system-status.warn {
  color: var(--yellow);
}
.system-status.warn .status-dot {
  background: var(--yellow);
}
.system-status.error {
  color: var(--red);
}
.system-status.error .status-dot {
  background: var(--red);
}
/* ==========================================================
   MARKET
========================================================== */
.market-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px;
  margin-bottom: 14px;
}
.market-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.market-name {
  color: var(--white);
  font-size: 15px;
  font-weight: 800;
}
.market-date {
  margin-top: 4px;
  color: var(--sub);
  font-size: 11px;
}
.market-status {
  color: var(--sub);
  font-size: 11px;
  text-align: right;
}
.market-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-top: 12px;
}
.market-metric {
  min-width: 0;
  padding: 10px;
  border-radius: 9px;
  background: var(--card-dark);
  border: 1px solid var(--border);
}
.metric-label {
  color: var(--sub);
  font-size: 10px;
}
.metric-value {
  margin-top: 4px;
  color: var(--white);
  font-size: 17px;
  font-weight: 800;
  word-break: break-word;
}
.text-up {
  color: var(--red) !important;
}
.text-down {
  color: var(--green) !important;
}
.text-flat {
  color: var(--sub) !important;
}
/* ==========================================================
   PORTFOLIO
========================================================== */
.portfolio-card {
  background:
    linear-gradient(
      135deg,
      #1e293b 0%,
      #0f172a 100%
    );
  border: 1px solid #334155;
  border-radius: 11px;
  padding: 12px;
  margin-bottom: 14px;
}
.portfolio-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 7px;
  font-size: 13px;
}
.portfolio-row:last-child {
  margin-bottom: 0;
}
.portfolio-value {
  color: var(--white);
  font-weight: 800;
  text-align: right;
}
.portfolio-note {
  color: var(--sub);
  font-size: 10px;
  line-height: 1.5;
}
.portfolio-info {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.info-btn {
  padding: 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: #1e293b;
  color: var(--sub);
  text-align: center;
  font-size: 11px;
}
.info-btn strong {
  color: var(--white);
}
/* ==========================================================
   SEARCH
========================================================== */
.search-box {
  position: relative;
  margin-bottom: 12px;
}
.search-input {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  outline: none;
  background: var(--card-dark);
  color: var(--white);
  font-size: 13px;
}
.search-input:focus {
  border-color: var(--blue);
}
.search-input::placeholder {
  color: #64748b;
}
.search-results {
  display: none;
  margin-top: 6px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
}
.search-results.show {
  display: block;
}
.search-item {
  display: block;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  text-align: left;
}
.search-item:last-child {
  border-bottom: 0;
}
.search-item:hover {
  background: #1e293b;
}
.search-symbol {
  color: var(--white);
  font-weight: 800;
}
.search-name {
  margin-left: 8px;
  color: var(--sub);
  font-size: 11px;
}
/* ==========================================================
   TABS
========================================================== */
.tabs {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 3px;
  margin-bottom: 14px;
  scrollbar-width: thin;
}
.tab {
  flex: 0 0 auto;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--sub);
  font-size: 11px;
  font-weight: 700;
}
.tab.active {
  border-color: var(--blue);
  background: rgba(56, 189, 248, .10);
  color: var(--blue);
}
/* ==========================================================
   SECTION
========================================================== */
.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 0 2px 9px;
}
.section-title {
  color: var(--white);
  font-size: 16px;
  font-weight: 800;
}
.section-count {
  color: var(--sub);
  font-size: 11px;
}
/* ==========================================================
   STOCK CARD
========================================================== */
.stock-card {
  width: 100%;
  margin-bottom: 12px;
  padding: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--card);
}
.stock-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.stock-main {
  min-width: 0;
}
.stock-title-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 7px;
}
.stock-name {
  color: var(--white);
  font-size: 17px;
  font-weight: 800;
}
.stock-symbol {
  color: var(--sub);
  font-size: 11px;
}
.stock-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 5px;
}
.tag {
  display: inline-block;
  padding: 2px 7px;
  border: 1px solid var(--purple);
  border-radius: 12px;
  color: var(--purple);
  font-size: 10px;
}
.meta-tag {
  padding: 2px 6px;
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--sub);
  font-size: 9px;
}
.strength-badge {
  flex: 0 0 auto;
  padding: 5px 8px;
  border-radius: 8px;
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}
.strength-strong {
  border: 1px solid rgba(239,68,68,.45);
  background: rgba(239,68,68,.10);
  color: #fca5a5;
}
.strength-neutral {
  border: 1px solid rgba(245,158,11,.45);
  background: rgba(245,158,11,.08);
  color: #fcd34d;
}
.strength-weak {
  border: 1px solid rgba(34,197,94,.45);
  background: rgba(34,197,94,.08);
  color: #86efac;
}
/* ==========================================================
   PRICE
========================================================== */
.price-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 13px;
}
.price {
  color: var(--white);
  font-size: 23px;
  font-weight: 850;
}
.change {
  font-size: 12px;
  font-weight: 750;
}
/* ==========================================================
   AI
========================================================== */
.ai-box {
  margin-top: 11px;
  padding: 10px;
  border-radius: 8px;
  background: var(--card-dark);
  border: 1px solid var(--border);
}
.ai-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 5px;
  font-size: 12px;
}
.ai-row:last-child {
  margin-bottom: 0;
}
.ai-label {
  color: var(--sub);
}
.ai-value {
  color: var(--white);
  font-weight: 700;
  text-align: right;
}
/* ==========================================================
   HOLDING
========================================================== */
.holding-section {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px dashed var(--border);
}
.holding-title {
  margin-bottom: 7px;
  color: var(--sub);
  font-size: 11px;
  font-weight: 700;
}
.input-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}
.input-group {
  min-width: 0;
}
.input-group label {
  display: block;
  margin-bottom: 4px;
  color: var(--sub);
  font-size: 10px;
}
.input-group input {
  width: 100%;
  min-width: 0;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  outline: none;
  background: var(--card-dark);
  color: var(--white);
  font-size: 12px;
  text-align: right;
}
.input-group input:focus {
  border-color: var(--blue);
}
.roi-row {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 8px;
  padding: 8px 9px;
  border-radius: 6px;
  background: var(--card-dark);
  font-size: 11px;
}
.roi-value {
  font-weight: 800;
}
.rebalance-badge {
  display: inline-block;
  margin-left: 5px;
  padding: 2px 6px;
  border: 1px solid var(--yellow);
  border-radius: 10px;
  color: var(--yellow);
  font-size: 9px;
}
/* ==========================================================
   LOADING / EMPTY / ERROR
========================================================== */
.loading-box,
.empty-box,
.error-box {
  padding: 28px 15px;
  border: 1px dashed var(--border);
  border-radius: 11px;
  background: rgba(21,28,44,.55);
  text-align: center;
}
.loading-box,
.empty-text {
  color: var(--sub);
  font-size: 12px;
}
.empty-title,
.error-title {
  margin-bottom: 6px;
  color: var(--white);
  font-size: 14px;
  font-weight: 800;
}
.error-box {
  border-color: rgba(239,68,68,.35);
  background: rgba(239,68,68,.06);
}
.error-title {
  color: #fecaca;
}
.error-detail {
  color: #fca5a5;
  font-size: 11px;
  line-height: 1.6;
}
/* ==========================================================
   FOOTER
========================================================== */
.footer {
  margin-top: 24px;
  color: #475569;
  font-size: 9px;
  line-height: 1.7;
  text-align: center;
}
/* ==========================================================
   MOBILE
========================================================== */
@media (max-width: 430px) {
  .app {
    padding: 12px 9px 30px;
  }
  .title {
    font-size: 19px;
  }
  .stock-name {
    font-size: 16px;
  }
  .price {
    font-size: 21px;
  }
}
</style>
</head>

<script>
"use strict";
/* ==========================================================
   台股 AI 選股・零股定投
   ==========================================================
   FRONTEND CONTRACT
   ----------------------------------------------------------
   唯一資料來源：
       Data/ui_data.json
   不直接讀取：
       Data/prices.json
       Data/analysis.json
       Data/chip.json
       Data/universe.json
       Data/market.json
   不使用：
       Yahoo Finance
       CORS Proxy
       前端技術指標計算
       前端自行建立選股條件
       固定股票清單
   後端：
       build_ui_data.py
       UI-DATA-2.1
   ========================================================== */
/* ==========================================================
   CONSTANTS
========================================================== */
const MONTHLY_BUDGET = 6000;
const UI_DATA_URLS = [
  "Data/ui_data.json",
  "./Data/ui_data.json"
];
const TAB_CONFIG = [
  {
    id: "today_picks",
    label: "今日選股",
    title: "今日選股"
  },
  {
    id: "top10",
    label: "AI Top 10",
    title: "AI Top 10"
  },
  {
    id: "etf",
    label: "ETF",
    title: "ETF"
  },
  {
    id: "bond",
    label: "債券",
    title: "債券"
  },
  {
    id: "watchlist",
    label: "觀察",
    title: "觀察清單"
  },
  {
    id: "all",
    label: "全部",
    title: "全部商品"
  }
];
/* ==========================================================
   STATE
========================================================== */
let uiData = null;
let stocks = [];
let currentTab = "today_picks";
/* ==========================================================
   DOM
========================================================== */
const $ = id =>
  document.getElementById(id);
const systemStatus =
  $("system-status");
const systemStatusText =
  $("system-status-text");
const marketName =
  $("market-name");
const marketDate =
  $("market-date");
const marketStatus =
  $("market-status");
const marketIndex =
  $("market-index");
const marketSentiment =
  $("market-sentiment");
const totalPortfolioValue =
  $("total-portfolio-value");
const totalPortfolioROI =
  $("total-portfolio-roi");
const holdingCount =
  $("holding-count");
const stockCount =
  $("stock-count");
const tabs =
  $("tabs");
const sectionTitle =
  $("section-title");
const sectionCount =
  $("section-count");
const stockList =
  $("stock-list");
const searchInput =
  $("search-input");
const searchResults =
  $("search-results");
/* ==========================================================
   BASIC HELPERS
========================================================== */
function escapeHtml(value) {
  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character])
    );
}
function normalizeSymbol(value) {
  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }
  return String(value)
    .trim()
    .toUpperCase()
    .replace(
      /\.(TW|TWO|TSE|OTC)$/i,
      ""
    );
}
function isObject(value) {
  return (
    value !== null &&
    typeof value === "object" &&
    !Array.isArray(value)
  );
}
function numberOrNull(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }
  const n =
    Number(value);
  return Number.isFinite(n)
    ? n
    : null;
}
function formatNumber(
  value,
  digits = 2
) {
  const n =
    numberOrNull(value);
  if (n === null) {
    return "—";
  }
  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}
function formatPrice(value) {
  const n =
    numberOrNull(value);
  if (n === null) {
    return "—";
  }
  let digits = 2;
  if (Math.abs(n) >= 1000) {
    digits = 0;
  } else if (Math.abs(n) >= 100) {
    digits = 1;
  }
  return formatNumber(
    n,
    digits
  );
}
function formatPercent(value) {
  const n =
    numberOrNull(value);
  if (n === null) {
    return "—";
  }
  return (
    (n >= 0 ? "+" : "") +
    n.toFixed(2) +
    "%"
  );
}
function changeClass(value) {
  const n =
    numberOrNull(value);
  if (n === null || n === 0) {
    return "text-flat";
  }
  return n > 0
    ? "text-up"
    : "text-down";
}
function strengthClass(value) {
  const text =
    String(value || "");
  if (text.includes("強")) {
    return "strength-strong";
  }
  if (text.includes("弱")) {
    return "strength-weak";
  }
  return "strength-neutral";
}
function sentimentClass(value) {
  const text =
    String(value || "");
  if (
    /強|樂觀|多頭|偏多/.test(text)
  ) {
    return "text-up";
  }
  if (
    /弱|悲觀|空頭|偏空/.test(text)
  ) {
    return "text-down";
  }
  return "text-flat";
}
/* ==========================================================
   LOCAL STORAGE
========================================================== */
function storageKey(
  type,
  symbol
) {
  return `user_${type}_${normalizeSymbol(symbol)}`;
}
function getShares(symbol) {
  return (
    numberOrNull(
      localStorage.getItem(
        storageKey(
          "shares",
          symbol
        )
      )
    ) || 0
  );
}
function getCost(symbol) {
  return (
    numberOrNull(
      localStorage.getItem(
        storageKey(
          "cost",
          symbol
        )
      )
    ) || 0
  );
}
function getTag(symbol) {
  return (
    localStorage.getItem(
      storageKey(
        "tag",
        symbol
      )
    ) || ""
  );
}
function saveHolding(
  symbol,
  shares,
  cost
) {
  const normalized =
    normalizeSymbol(symbol);
  const sharesNumber =
    numberOrNull(shares) || 0;
  const costNumber =
    numberOrNull(cost) || 0;
  if (sharesNumber > 0) {
    localStorage.setItem(
      storageKey(
        "shares",
        normalized
      ),
      String(sharesNumber)
    );
  } else {
    localStorage.removeItem(
      storageKey(
        "shares",
        normalized
      )
    );
  }
  if (costNumber > 0) {
    localStorage.setItem(
      storageKey(
        "cost",
        normalized
      ),
      String(costNumber)
    );
  } else {
    localStorage.removeItem(
      storageKey(
        "cost",
        normalized
      )
    );
  }
}
function setTag(symbol) {
  const current =
    getTag(symbol);
  const value =
    prompt(
      "設定標籤（留空可取消）",
      current
    );
  if (value === null) {
    return;
  }
  const key =
    storageKey(
      "tag",
      symbol
    );
  if (value.trim()) {
    localStorage.setItem(
      key,
      value.trim()
    );
  } else {
    localStorage.removeItem(
      key
    );
  }
  renderCurrentTab();
}
/* ==========================================================
   UI DATA LOADING
========================================================== */
async function loadUiData() {
  let lastError =
    null;
  for (
    const url of UI_DATA_URLS
  ) {
    try {
      const response =
        await fetch(
          `${url}?t=${Date.now()}`,
          {
            cache: "no-store",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );
      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }
      const data =
        await response.json();
      validateUiData(data);
      return data;
    } catch (error) {
      lastError = error;
    }
  }
  throw (
    lastError ||
    new Error(
      "ui_data.json 無法載入"
    )
  );
}
/* ==========================================================
   UI DATA VALIDATION
========================================================== */
function validateUiData(data) {
  if (!isObject(data)) {
    throw new Error(
      "ui_data.json 根物件無效"
    );
  }
  if (
    data.schema_version !==
    "UI-DATA-2.1"
  ) {
    throw new Error(
      "UI schema 不符："
      +
      String(
        data.schema_version ||
        "未提供"
      )
    );
  }
  if (
    data.status !== "ok"
  ) {
    throw new Error(
      "UI data status 非 ok"
    );
  }
  if (
    !isObject(data.market)
  ) {
    throw new Error(
      "缺少 market"
    );
  }
  if (
    !isObject(data.summary)
  ) {
    throw new Error(
      "缺少 summary"
    );
  }
  if (
    !isObject(data.tabs)
  ) {
    throw new Error(
      "缺少 tabs"
    );
  }
  if (
    !isObject(data.stocks)
  ) {
    throw new Error(
      "缺少 stocks"
    );
  }
}
/* ==========================================================
   BUILD STOCK LIST
========================================================== */
function buildStocks(data) {
  const result = [];
  const seen =
    new Set();
  Object.entries(
    data.stocks || {}
  ).forEach(
    ([key, raw]) => {
      if (!isObject(raw)) {
        return;
      }
      const symbol =
        normalizeSymbol(
          raw.symbol || key
        );
      if (
        !symbol ||
        seen.has(symbol)
      ) {
        return;
      }
      seen.add(symbol);
      result.push({
        ...raw,
        symbol,
        name:
          raw.name ||
          symbol,
        market:
          raw.market ||
          "—",
        instrument_type:
          raw.instrument_type ||
          "stock",
        strength:
          raw.strength ||
          "中性",
        recommendation:
          raw.recommendation ||
          "續抱觀察"
      });
    }
  );
  result.sort(
    (a, b) =>
      String(a.symbol)
        .localeCompare(
          String(b.symbol),
          "zh-TW",
          {
            numeric: true
          }
        )
  );
  return result;
}
/* ==========================================================
   FIND STOCKS FROM TAB
========================================================== */
function extractSymbol(item) {
  if (
    typeof item === "string"
  ) {
    return normalizeSymbol(
      item
    );
  }
  if (
    isObject(item)
  ) {
    return normalizeSymbol(
      item.symbol ||
      item.code ||
      item.ticker
    );
  }
  return "";
}
function symbolsToStocks(
  values
) {
  if (
    !Array.isArray(values)
  ) {
    return [];
  }
  const map =
    new Map();
  stocks.forEach(
    stock => {
      map.set(
        normalizeSymbol(
          stock.symbol
        ),
        stock
      );
    }
  );
  const result = [];
  const seen =
    new Set();
  values.forEach(
    item => {
      const symbol =
        extractSymbol(item);
      if (
        !symbol ||
        seen.has(symbol)
      ) {
        return;
      }
      const stock =
        map.get(symbol);
      if (!stock) {
        return;
      }
      seen.add(symbol);
      result.push(stock);
    }
  );
  return result;
}
function getTabStocks(
  tab
) {
  if (tab === "all") {
    return [...stocks];
  }
  return symbolsToStocks(
    uiData.tabs?.[tab]
  );
}

    index.close ??

function instrumentLabel(
  value
) {
  const text =
    String(value || "")
      .toLowerCase();
  if (
    text === "etf" ||
    text.includes("基金")
  ) {
    return "ETF";
  }
  if (
    text === "bond" ||
    text.includes("債券")
  ) {
    return "債券";
  }
  if (
    text === "etn" ||
    text.includes("指數投資證券")
  ) {
    return "ETN";
  }
  return "個股";
}

/* ==========================================================
   PORTFOLIO SUMMARY
========================================================== */
function updatePortfolioSummary() {
  let totalValue = 0;
  let totalCost = 0;
  let count = 0;
  stocks.forEach(
    stock => {
      const symbol =
        normalizeSymbol(
          stock.symbol
        );
      const shares =
        getShares(symbol);
      const cost =
        getCost(symbol);
      const price =
        numberOrNull(
          stock.price
        );
      if (
        shares <= 0
      ) {
        return;
      }
      count += 1;
      if (
        price !== null
      ) {
        totalValue +=
          price * shares;
      }
      if (
        cost > 0
      ) {
        totalCost +=
          cost * shares;
      }
    }
  );
  stockCount.textContent =
    String(stocks.length);
  holdingCount.textContent =
    `${count} 檔`;
  if (
    totalValue > 0
  ) {
    totalPortfolioValue.textContent =
      formatNumber(
        totalValue,
        0
      );
  } else {
    totalPortfolioValue.textContent =
      "—";
  }
  if (
    totalValue > 0 &&
    totalCost > 0
  ) {
    const profit =
      totalValue -
      totalCost;
    const pct =
      profit /
      totalCost *
      100;
    totalPortfolioROI.className =
      `portfolio-value ${
        profit > 0
          ? "text-up"
          : profit < 0
            ? "text-down"
            : "text-flat"
      }`;
    totalPortfolioROI.textContent =
      `${
        profit >= 0
          ? "+"
          : ""
      }${formatNumber(
        profit,
        0
      )} (${formatPercent(pct)})`;
  } else {
    totalPortfolioROI.className =
      "portfolio-value";
    totalPortfolioROI.textContent =
      "—";
  }
}
/* ==========================================================
   SEARCH
========================================================== */
function searchStocks(
  query
) {
  const q =
    String(query || "")
      .trim()
      .toUpperCase();
  if (!q) {
    searchResults.classList.remove(
      "show"
    );
    searchResults.innerHTML =
      "";
    return;
  }
  const matches =
    stocks
      .filter(
        stock => {
          const symbol =
            normalizeSymbol(
              stock.symbol
            ).toUpperCase();
          const name =
            String(
              stock.name || ""
            ).toUpperCase();
          return (
            symbol.includes(q) ||
            name.includes(q)
          );
        }
      )
      .slice(0, 12);
  if (!matches.length) {
    searchResults.innerHTML =
      `
        <div
          style="
            padding:10px 12px;
            color:var(--sub);
            font-size:11px;
          "
        >
          後端 UI-DATA-2.1 中沒有符合的商品
        </div>
      `;
    searchResults.classList.add(
      "show"
    );
    return;
  }
  searchResults.innerHTML =
    matches
      .map(
        stock => `
          <button
            type="button"
            class="search-item"
            data-search-symbol="${escapeHtml(
              stock.symbol
            )}"
          >
            <span class="search-symbol">
              ${escapeHtml(
                stock.symbol
              )}
            </span>
            <span class="search-name">
              ${escapeHtml(
                stock.name
              )}
            </span>
          </button>
        `
      )
      .join("");
  searchResults.classList.add(
    "show"
  );
  searchResults
    .querySelectorAll(
      "[data-search-symbol]"
    )
    .forEach(
      button => {
        button.addEventListener(
          "click",
          () => {
            const symbol =
              normalizeSymbol(
                button.dataset.searchSymbol
              );
            currentTab =
              "all";
            renderTabs();
            renderCurrentTab();
            searchInput.value =
              "";
            searchResults.classList.remove(
              "show"
            );
            setTimeout(
              () => {
                const target =
                  document.querySelector(
                    `[data-symbol="${CSS.escape(symbol)}"]`
                  );
                if (target) {
                  target.scrollIntoView({
                    behavior: "smooth",
                    block: "center"
                  });
                }
              },
              30
            );
          }
        );
      }
    );
}

/* ==========================================================
   DATA FRESHNESS
========================================================== */
function checkDataFreshness() {
  const generatedAt =
    uiData.generated_at;
  if (!generatedAt) {
    setSystemStatus(
      "warn",
      "資料正常"
    );
    return;
  }
  const date =
    new Date(
      generatedAt
    );
  if (
    Number.isNaN(
      date.getTime()
    )
  ) {
    setSystemStatus(
      "warn",
      "資料正常"
    );
    return;
  }
  const age =
    Date.now() -
    date.getTime();
  const hours =
    age /
    1000 /
    60 /
    60;
  if (hours > 48) {
    setSystemStatus(
      "warn",
      "資料較舊"
    );
  } else {
    setSystemStatus(
      "ok",
      "資料正常"
    );
  }
}
/* ==========================================================
   INITIALIZATION
========================================================== */
async function initDashboard() {
  setSystemStatus(
    "warn",
    "資料載入中"
  );
  try {
    uiData =
      await loadUiData();
    stocks =
      buildStocks(
        uiData
      );
    if (!stocks.length) {
      throw new Error(
        "ui_data.json 的 stocks 為空"
      );
    }
    renderMarket();
    renderTabs();
    renderCurrentTab();
    checkDataFreshness();
    document.title =
      `台股 AI 選股・零股定投｜${stocks.length} 檔`;
  } catch (error) {
    console.error(
      "UI DATA ERROR:",
      error
    );
    setSystemStatus(
      "error",
      "資料錯誤"
    );
    stockList.innerHTML =
      `
        <div class="error-box">
          <div class="error-title">
            無法載入台股 AI 資料
          </div>
          <div class="error-detail">
            ${escapeHtml(
              error?.message ||
              "未知錯誤"
            )}
          </div>
          <div class="error-detail">
            前端唯一資料來源：
            Data/ui_data.json
          </div>
        </div>
      `;
    sectionCount.textContent =
      "—";
  }
}
/* ==========================================================
   START
========================================================== */
document.addEventListener(
  "DOMContentLoaded",
  initDashboard
);
</script>
</body>
</html>
