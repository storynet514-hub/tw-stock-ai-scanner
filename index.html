<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">

  <title>AI MARKET INTELLIGENCE｜台股市場</title>

  <style>
    :root {
      --bg: #07111f;
      --bg2: #0b1728;
      --panel: rgba(16, 30, 49, 0.88);
      --panel2: rgba(20, 38, 61, 0.9);
      --border: rgba(148, 163, 184, 0.16);
      --text: #f5f7fb;
      --muted: #91a0b5;
      --muted2: #66758b;
      --red: #ff5c67;
      --green: #32d583;
      --yellow: #f5c451;
      --blue: #5ea7ff;
      --purple: #9b7cff;
      --shadow: 0 18px 45px rgba(0, 0, 0, 0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 10% 0%, rgba(62, 121, 255, 0.12), transparent 28%),
        radial-gradient(circle at 90% 15%, rgba(155, 124, 255, 0.10), transparent 28%),
        linear-gradient(145deg, #050c16 0%, #07111f 48%, #091523 100%);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Noto Sans TC",
        "Microsoft JhengHei",
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    /* =====================================================
       Header
       ===================================================== */

    .hero {
      position: relative;
      overflow: hidden;
      padding: 30px 28px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background:
        linear-gradient(
          135deg,
          rgba(18, 35, 58, 0.95),
          rgba(8, 20, 34, 0.96)
        );
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      right: -80px;
      top: -110px;
      border-radius: 50%;
      background: rgba(94, 167, 255, 0.08);
      filter: blur(8px);
      pointer-events: none;
    }

    .brand {
      position: relative;
      z-index: 1;
    }

    .brand-title {
      margin: 0;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 800;
      letter-spacing: 0.05em;
      line-height: 1.1;
    }

    .brand-subtitle {
      margin-top: 9px;
      color: #d2d9e5;
      font-size: 17px;
      font-weight: 600;
    }

    .brand-caption {
      margin-top: 4px;
      color: var(--muted);
      font-size: 14px;
    }

    .market-status-row {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 24px;
    }

    .market-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      font-size: 14px;
      font-weight: 700;
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .status-dot.open {
      background: var(--green);
      box-shadow: 0 0 12px rgba(50, 213, 131, 0.65);
    }

    .status-dot.closed {
      background: var(--red);
      box-shadow: 0 0 12px rgba(255, 92, 103, 0.55);
    }

    .market-date {
      color: var(--muted);
      font-size: 14px;
    }

    .market-date strong {
      color: var(--text);
      margin-left: 5px;
    }

    /* =====================================================
       Four info panels
       ===================================================== */

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 18px;
    }

    .info-card {
      min-height: 138px;
      padding: 22px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(
          145deg,
          rgba(18, 34, 55, 0.94),
          rgba(11, 24, 40, 0.92)
        );
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .info-label {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .info-value {
      margin-top: 11px;
      font-size: clamp(26px, 5vw, 34px);
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .info-sub {
      margin-top: 5px;
      color: var(--muted2);
      font-size: 13px;
    }

    .index-main {
      display: flex;
      align-items: baseline;
      gap: 10px;
      flex-wrap: wrap;
    }

    .index-change {
      font-size: 14px;
      font-weight: 700;
    }

    .market-direction {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .direction-icon {
      font-size: 25px;
    }

    .direction-text {
      font-size: 28px;
      font-weight: 800;
    }

    /* =====================================================
       Search
       ===================================================== */

    .search-panel {
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: rgba(13, 27, 45, 0.86);
      box-shadow: var(--shadow);
    }

    .search-title {
      margin-bottom: 12px;
      font-size: 15px;
      font-weight: 800;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input {
      min-width: 0;
      flex: 1;
      height: 46px;
      padding: 0 15px;
      color: var(--text);
      background: rgba(3, 11, 20, 0.62);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 12px;
      outline: none;
    }

    .search-input:focus {
      border-color: rgba(94, 167, 255, 0.65);
      box-shadow: 0 0 0 3px rgba(94, 167, 255, 0.08);
    }

    .search-input::placeholder {
      color: #65758b;
    }

    .search-button {
      height: 46px;
      padding: 0 20px;
      color: white;
      background: linear-gradient(135deg, #337fdc, #5d66e8);
      border: 0;
      border-radius: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .search-button:hover {
      filter: brightness(1.08);
    }

    .search-result {
      margin-top: 14px;
    }

    .search-result:empty {
      display: none;
    }

    /* =====================================================
       Tabs
       ===================================================== */

    .tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 10px;
      margin-bottom: 8px;
      scrollbar-width: none;
    }

    .tabs::-webkit-scrollbar {
      display: none;
    }

    .tab-button {
      flex: 0 0 auto;
      padding: 11px 17px;
      color: var(--muted);
      background: rgba(16, 30, 49, 0.78);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .tab-button.active {
      color: white;
      background: linear-gradient(
        135deg,
        rgba(57, 121, 220, 0.95),
        rgba(96, 88, 220, 0.95)
      );
      border-color: transparent;
      box-shadow: 0 8px 22px rgba(67, 105, 220, 0.25);
    }

    /* =====================================================
       Section
       ===================================================== */

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin: 18px 2px 12px;
    }

    .section-title {
      margin: 0;
      font-size: 21px;
      font-weight: 800;
    }

    .section-count {
      color: var(--muted);
      font-size: 13px;
    }

    /* =====================================================
       Stock cards
       ===================================================== */

    .cards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .stock-card {
      position: relative;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(
          145deg,
          rgba(17, 32, 52, 0.96),
          rgba(9, 21, 36, 0.96)
        );
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.17);
      transition:
        transform 0.18s ease,
        border-color 0.18s ease;
    }

    .stock-card:hover {
      transform: translateY(-2px);
      border-color: rgba(148, 163, 184, 0.28);
    }

    .stock-head {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      align-items: flex-start;
    }

    .stock-name {
      font-size: 22px;
      line-height: 1.15;
      font-weight: 850;
    }

    .stock-code {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .asset-badge {
      padding: 5px 9px;
      color: #a9c8ef;
      background: rgba(94, 167, 255, 0.09);
      border: 1px solid rgba(94, 167, 255, 0.15);
      border-radius: 999px;
      font-size: 11px;
      font-weight: 800;
    }

    .stock-price-row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-top: 20px;
    }

    .stock-price {
      font-size: 30px;
      font-weight: 850;
      letter-spacing: -0.02em;
    }

    .stock-change {
      font-size: 15px;
      font-weight: 800;
    }

    /*
      台股：
      上漲 = 紅
      下跌 = 綠
    */

    .up {
      color: var(--red);
    }

    .down {
      color: var(--green);
    }

    .flat {
      color: var(--muted);
    }

    .stock-divider {
      height: 1px;
      margin: 17px 0;
      background: rgba(148, 163, 184, 0.10);
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .strength {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 14px;
      font-weight: 800;
    }

    .strength-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
    }

    .strength-strong {
      color: #57df9b;
    }

    .strength-strong .strength-dot {
      background: #32d583;
      box-shadow: 0 0 10px rgba(50, 213, 131, 0.45);
    }

    .strength-neutral {
      color: #f5c451;
    }

    .strength-neutral .strength-dot {
      background: #f5c451;
    }

    .strength-weak {
      color: #ff6872;
    }

    .strength-weak .strength-dot {
      background: #ff5c67;
    }

    .recommendation {
      margin-top: 15px;
      padding: 11px 12px;
      color: #dce4ef;
      background: rgba(255, 255, 255, 0.035);
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.55;
    }

    .recommendation-label {
      display: block;
      margin-bottom: 3px;
      color: var(--muted2);
      font-size: 11px;
      font-weight: 800;
    }

    .add-watchlist {
      width: 100%;
      margin-top: 13px;
      padding: 10px 12px;
      color: #cfe3ff;
      background: rgba(94, 167, 255, 0.08);
      border: 1px solid rgba(94, 167, 255, 0.16);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
    }

    .add-watchlist:hover {
      background: rgba(94, 167, 255, 0.14);
    }

    /* =====================================================
       My list
       ===================================================== */

    .holding-box {
      margin-top: 16px;
      padding: 15px;
      background: rgba(3, 10, 18, 0.30);
      border: 1px solid rgba(148, 163, 184, 0.10);
      border-radius: 13px;
    }

    .holding-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .holding-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .holding-field input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      color: var(--text);
      background: rgba(5, 14, 24, 0.72);
      border: 1px solid rgba(148, 163, 184, 0.16);
      border-radius: 9px;
      outline: none;
    }

    .holding-field input:focus {
      border-color: rgba(94, 167, 255, 0.55);
    }

    .holding-stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 12px;
    }

    .holding-stat {
      padding: 9px;
      background: rgba(255, 255, 255, 0.025);
      border-radius: 9px;
    }

    .holding-stat-label {
      color: var(--muted2);
      font-size: 10px;
    }

    .holding-stat-value {
      margin-top: 4px;
      font-size: 13px;
      font-weight: 800;
    }

    .remove-watchlist {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      color: #9aa8bb;
      background: transparent;
      border: 1px solid rgba(148, 163, 184, 0.12);
      border-radius: 9px;
      font-size: 12px;
    }

    .remove-watchlist:hover {
      color: var(--red);
      border-color: rgba(255, 92, 103, 0.25);
    }

    /* =====================================================
       Empty / loading / error
       ===================================================== */

    .state-box {
      padding: 45px 20px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed rgba(148, 163, 184, 0.18);
      border-radius: var(--radius);
      background: rgba(13, 27, 45, 0.58);
    }

    .state-title {
      color: #dce4ef;
      font-size: 16px;
      font-weight: 800;
    }

    .state-text {
      margin-top: 8px;
      font-size: 13px;
      line-height: 1.7;
    }

    .error-box {
      color: #ffb4ba;
      border-color: rgba(255, 92, 103, 0.25);
      background: rgba(100, 20, 30, 0.16);
    }

    /* =====================================================
       Footer
       ===================================================== */

    .footer {
      margin-top: 28px;
      padding-top: 18px;
      color: var(--muted2);
      border-top: 1px solid rgba(148, 163, 184, 0.08);
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    /* =====================================================
       Search result card
       ===================================================== */

    .search-result-card {
      border: 1px solid rgba(94, 167, 255, 0.18);
      border-radius: 14px;
      background: rgba(10, 25, 43, 0.92);
    }

    /* =====================================================
       Responsive
       ===================================================== */

    @media (max-width: 760px) {
      .app {
        width: min(100% - 18px, 1180px);
        padding-top: 10px;
      }

      .hero {
        padding: 24px 20px;
        border-radius: 19px;
      }

      .dashboard-grid,
      .cards {
        grid-template-columns: 1fr;
      }

      .info-card {
        min-height: 125px;
      }

      .stock-card {
        padding: 18px;
      }

      .search-panel {
        padding: 16px;
      }

      .holding-stats {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 470px) {
      .search-row {
        flex-direction: column;
      }

      .search-button {
        width: 100%;
      }

      .holding-grid {
        grid-template-columns: 1fr;
      }

      .card-bottom {
        align-items: flex-start;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       ① AI MARKET INTELLIGENCE
       ===================================================== -->

  <header class="hero">

    <div class="brand">

      <h1 class="brand-title">
        AI MARKET INTELLIGENCE
      </h1>

      <div class="brand-subtitle">
        台股市場
      </div>

      <div class="brand-caption">
        今日量化訊號
      </div>

    </div>

    <div class="market-status-row">

      <div
        id="marketStatus"
        class="market-status"
      >
        <span
          id="marketStatusDot"
          class="status-dot closed"
        ></span>

        <span id="marketStatusText">
          載入市場狀態
        </span>
      </div>

      <div class="market-date">
        最新交易日：
        <strong id="latestMarketDate">--</strong>
      </div>

    </div>

  </header>


  <!-- =====================================================
       ② 四小格資訊面板
       ===================================================== -->

  <section class="dashboard-grid">

    <!-- 今日精選 -->

    <div class="info-card">

      <div class="info-label">
        今日精選
      </div>

      <div
        id="selectedCount"
        class="info-value"
      >
        --
      </div>

      <div class="info-sub">
        最新交易日篩選結果
      </div>

    </div>


    <!-- 持有個股總盈虧 -->

    <div class="info-card">

      <div class="info-label">
        持有個股總盈虧
      </div>

      <div
        id="portfolioProfit"
        class="info-value"
      >
        尚未建立持倉
      </div>

      <div class="info-sub">
        目前持倉
      </div>

    </div>


    <!-- 加權指數 -->

    <div class="info-card">

      <div class="info-label">
        加權指數
      </div>

      <div class="index-main">

        <div
          id="taiexValue"
          class="info-value"
        >
          --
        </div>

        <div
          id="taiexChange"
          class="index-change"
        >
          --
        </div>

      </div>

    </div>


    <!-- 市場風向 -->

    <div class="info-card">

      <div class="info-label">
        市場風向
      </div>

      <div class="market-direction">

        <div
          id="marketDirectionIcon"
          class="direction-icon"
        >
          ⚪
        </div>

        <div
          id="marketDirectionText"
          class="direction-text"
        >
          --
        </div>

      </div>

      <div
        id="marketDirectionSub"
        class="info-sub"
      >
        等待市場資料
      </div>

    </div>

  </section>


  <!-- =====================================================
       ③ 查詢個股
       ===================================================== -->

  <section class="search-panel">

    <div class="search-title">
      🔍 查詢個股
    </div>

    <div class="search-row">

      <input
        id="searchInput"
        class="search-input"
        type="text"
        autocomplete="off"
        placeholder="輸入股票名稱或代號"
      >

      <button
        id="searchButton"
        class="search-button"
        type="button"
      >
        查詢
      </button>

    </div>

    <div
      id="searchResult"
      class="search-result"
    ></div>

  </section>


  <!-- =====================================================
       ④ 五個固定分頁
       ===================================================== -->

  <nav
    id="tabs"
    class="tabs"
    aria-label="股票分類"
  >

    <button
      class="tab-button active"
      data-tab="selected"
      type="button"
    >
      今日精選
    </button>

    <button
      class="tab-button"
      data-tab="top10"
      type="button"
    >
      Top 10
    </button>

    <button
      class="tab-button"
      data-tab="etf"
      type="button"
    >
      ETF
    </button>

    <button
      class="tab-button"
      data-tab="bond"
      type="button"
    >
      債券
    </button>

    <button
      class="tab-button"
      data-tab="watchlist"
      type="button"
    >
      我的清單
    </button>

  </nav>


  <!-- =====================================================
       內容
       ===================================================== -->

  <main>

    <div class="section-header">

      <h2
        id="sectionTitle"
        class="section-title"
      >
        今日精選
      </h2>

      <div
        id="sectionCount"
        class="section-count"
      >
        --
      </div>

    </div>

    <section
      id="cards"
      class="cards"
    ></section>

  </main>


  <footer class="footer">
    AI MARKET INTELLIGENCE<br>
    資料依 Data/prices.json 最新有效交易日資料顯示
  </footer>

</div>


<script>
"use strict";

/* ============================================================
   AI MARKET INTELLIGENCE
   index.html

   對齊：
   fetch_data.py V10.3

   前台原則：
   ------------------------------------------------------------
   1. 後台負責技術分析
   2. 前台只呈現整理後的投資資訊
   3. 主卡片不公開 RSI / MACD / KD / MA / Volume
   4. 不顯示 6/6
   5. 不顯示強度分數
   6. 不對任何特定股票做特殊處理
   7. 1319 不存在任何特殊驗證邏輯
   8. 台股紅漲綠跌
   ============================================================ */


/* ============================================================
   全域資料
   ============================================================ */

const DATA_URL = "./Data/prices.json";

let appData = null;

let activeTab = "selected";

let allItems = [];

let stockItems = [];

let selectedItems = [];

let top10Items = [];

let etfItems = [];

let bondItems = [];

let watchlist = loadWatchlist();


/* ============================================================
   DOM
   ============================================================ */

const els = {
  marketStatus:
    document.getElementById("marketStatus"),

  marketStatusDot:
    document.getElementById("marketStatusDot"),

  marketStatusText:
    document.getElementById("marketStatusText"),

  latestMarketDate:
    document.getElementById("latestMarketDate"),

  selectedCount:
    document.getElementById("selectedCount"),

  portfolioProfit:
    document.getElementById("portfolioProfit"),

  taiexValue:
    document.getElementById("taiexValue"),

  taiexChange:
    document.getElementById("taiexChange"),

  marketDirectionIcon:
    document.getElementById("marketDirectionIcon"),

  marketDirectionText:
    document.getElementById("marketDirectionText"),

  marketDirectionSub:
    document.getElementById("marketDirectionSub"),

  searchInput:
    document.getElementById("searchInput"),

  searchButton:
    document.getElementById("searchButton"),

  searchResult:
    document.getElementById("searchResult"),

  tabs:
    document.getElementById("tabs"),

  sectionTitle:
    document.getElementById("sectionTitle"),

  sectionCount:
    document.getElementById("sectionCount"),

  cards:
    document.getElementById("cards")
};


/* ============================================================
   初始化
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  () => {

    bindEvents();

    loadData();

  }
);


/* ============================================================
   Events
   ============================================================ */

function bindEvents() {

  els.tabs
    .addEventListener(
      "click",
      event => {

        const button =
          event.target.closest(
            ".tab-button"
          );

        if (!button) {
          return;
        }

        const tab =
          button.dataset.tab;

        if (!tab) {
          return;
        }

        setActiveTab(tab);

      }
    );


  els.searchButton
    .addEventListener(
      "click",
      performSearch
    );


  els.searchInput
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          performSearch();

        }

      }
    );


  els.cards
    .addEventListener(
      "input",
      event => {

        const input =
          event.target.closest(
            "[data-holding-field]"
          );

        if (!input) {
          return;
        }

        updateHoldingFromInput(
          input
        );

      }
    );


  els.cards
    .addEventListener(
      "click",
      event => {

        const addButton =
          event.target.closest(
            "[data-add-watchlist]"
          );

        if (addButton) {

          addToWatchlist(
            addButton.dataset.addWatchlist
          );

          return;

        }


        const removeButton =
          event.target.closest(
            "[data-remove-watchlist]"
          );

        if (removeButton) {

          removeFromWatchlist(
            removeButton.dataset.removeWatchlist
          );

        }

      }
    );

}


/* ============================================================
   Load JSON
   ============================================================ */

async function loadData() {

  renderLoading();

  try {

    const response =
      await fetch(
        DATA_URL + "?t=" + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    validateData(data);


    appData = data;

    prepareData();

    renderDashboard();

    renderCurrentTab();

  }
  catch (error) {

    console.error(
      "無法載入儀表板資料：",
      error
    );

    renderError(error);

  }

}


/* ============================================================
   Validate
   ============================================================ */

function validateData(data) {

  if (
    !data ||
    typeof data !== "object" ||
    Array.isArray(data)
  ) {

    throw new Error(
      "prices.json 根資料格式錯誤"
    );

  }


  if (
    data.status &&
    data.status !== "success"
  ) {

    throw new Error(
      "後台資料狀態不是 success"
    );

  }


  if (
    !Array.isArray(
      data.today_selected
    )
  ) {

    throw new Error(
      "today_selected 資料不存在或格式錯誤"
    );

  }


  if (
    !Array.isArray(
      data.top10
    )
  ) {

    throw new Error(
      "top10 資料不存在或格式錯誤"
    );

  }


  if (
    data.universe &&
    Array.isArray(
      data.universe.items
    )
  ) {

    return;

  }

}


/* ============================================================
   Prepare
   ============================================================ */

function prepareData() {

  selectedItems =
    normalizeItems(
      appData.today_selected
    );


  top10Items =
    normalizeItems(
      appData.top10
    );


  etfItems =
    normalizeItems(
      Array.isArray(
        appData.etfs
      )
        ? appData.etfs
        : []
    );


  bondItems =
    normalizeItems(
      Array.isArray(
        appData.bonds
      )
        ? appData.bonds
        : []
    );


  if (
    appData.universe &&
    Array.isArray(
      appData.universe.items
    )
  ) {

    allItems =
      normalizeItems(
        appData.universe.items
      );

  }
  else {

    allItems =
      [
        ...selectedItems,
        ...top10Items,
        ...etfItems,
        ...bondItems
      ];

  }


  allItems =
    uniqueBySymbol(
      allItems
    );


  stockItems =
    allItems.filter(
      item =>
        item.type === "stock"
    );


  selectedItems =
    mergeWithUniverse(
      selectedItems
    );

  top10Items =
    mergeWithUniverse(
      top10Items
    );

  etfItems =
    mergeWithUniverse(
      etfItems
    );

  bondItems =
    mergeWithUniverse(
      bondItems
    );

}


/* ============================================================
   Normalize
   ============================================================ */

function normalizeItems(items) {

  if (!Array.isArray(items)) {
    return [];
  }


  return items
    .filter(
      item =>
        item &&
        typeof item === "object"
    )
    .map(
      item => {

        const indicators =
          item.indicators || {};

        const conditions =
          item.core_conditions || {};

        return {
          ...item,

          symbol:
            item.symbol ||
            normalizeSymbol(
              item.code
            ),

          code:
            item.code ||
            extractCode(
              item.symbol
            ),

          name:
            item.name ||
            item.code ||
            extractCode(
              item.symbol
            ),

          type:
            normalizeType(
              item.type
            ),

          market:
            item.market ||
            inferMarket(
              item.symbol
            ),

          price:
            toNumber(
              item.price
            ),

          change_pct:
            toNumber(
              item.change_pct
            ),

          ai_score:
            toNumber(
              item.ai_score
            ),

          strength_score:
            toNumber(
              item.strength_score
            ),

          indicators,

          core_conditions:
            conditions
        };

      }
    );

}


/* ============================================================
   Merge
   ============================================================ */

function mergeWithUniverse(
  items
) {

  return items.map(
    item => {

      const full =
        allItems.find(
          x =>
            x.symbol ===
            item.symbol
        );

      return full
        ? {
            ...full,
            ...item
          }
        : item;

    }
  );

}


/* ============================================================
   Utility
   ============================================================ */

function toNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {

    return null;

  }


  const number =
    Number(value);


  return Number.isFinite(
    number
  )
    ? number
    : null;

}


function normalizeSymbol(
  value
) {

  if (!value) {
    return "";
  }


  const s =
    String(value)
      .trim();


  if (
    s.endsWith(".TW") ||
    s.endsWith(".TWO")
  ) {

    return s;

  }


  if (
    /^\d+$/.test(s)
  ) {

    return (
      s.padStart(4, "0")
      + ".TW"
    );

  }


  return s;

}


function extractCode(
  symbol
) {

  if (!symbol) {
    return "";
  }


  return String(symbol)
    .split(".")[0];

}


function inferMarket(
  symbol
) {

  if (
    String(symbol)
      .endsWith(".TWO")
  ) {

    return "TWO";

  }


  if (
    String(symbol)
      .endsWith(".TW")
  ) {

    return "TW";

  }


  return "OTHER";

}


function normalizeType(
  type
) {

  const value =
    String(
      type || "stock"
    ).toLowerCase();


  if (
    value === "etf"
  ) {

    return "etf";

  }


  if (
    value === "bond" ||
    value === "bond_etf" ||
    value === "bond-fund"
  ) {

    return "bond";

  }


  return "stock";

}


function uniqueBySymbol(
  items
) {

  const map =
    new Map();


  items.forEach(
    item => {

      if (
        item.symbol
      ) {

        map.set(
          item.symbol,
          item
        );

      }

    }
  );


  return Array.from(
    map.values()
  );

}

/* ============================================================
   Market status
   ============================================================ */

function renderMarketStatus() {

  const latestDate =
    appData.latest_market_date ||
    appData.date;


  if (!latestDate) {

    els.marketStatusDot
      .className =
      "status-dot closed";

    els.marketStatusText
      .textContent =
      "🔴 非交易日";

    return;

  }


  const marketDate =
    new Date(
      latestDate + "T00:00:00+08:00"
    );


  const now =
    new Date();


  const sameDate =
    marketDate
      .toLocaleDateString(
        "en-CA",
        {
          timeZone:
            "Asia/Taipei"
        }
      ) ===
    now
      .toLocaleDateString(
        "en-CA",
        {
          timeZone:
            "Asia/Taipei"
        }
      );


  if (sameDate) {

    els.marketStatusDot
      .className =
      "status-dot open";

    els.marketStatusText
      .textContent =
      "🟢 今日開市";

  }
  else {

    els.marketStatusDot
      .className =
      "status-dot closed";

    els.marketStatusText
      .textContent =
      "🔴 非交易日";

  }

}

      );

/* ============================================================
   Portfolio
   ============================================================ */

function renderPortfolioSummary() {

  const positions =
    getPositions();


  if (
    positions.length === 0
  ) {

    els.portfolioProfit
      .textContent =
      "尚未建立持倉";

    els.portfolioProfit
      .className =
      "info-value";

    return;

  }


  let totalProfit = 0;

  let hasProfitValue =
    false;


  positions.forEach(
    position => {

      const result =
        calculateHolding(
          position.item,
          position.shares,
          position.cost
        );


      if (
        result &&
        result.profit !== null
      ) {

        totalProfit +=
          result.profit;

        hasProfitValue =
          true;

      }

    }
  );


  if (!hasProfitValue) {

    els.portfolioProfit
      .textContent =
      "尚未建立持倉";

    els.portfolioProfit
      .className =
      "info-value";

    return;

  }


  els.portfolioProfit
    .textContent =
    formatSignedCurrency(
      totalProfit
    );


  els.portfolioProfit
    .className =
    "info-value " +
    (
      totalProfit > 0
        ? "up"
        : totalProfit < 0
          ? "down"
          : "flat"
    );

}


/* ============================================================
   TAIEX
   ============================================================

   fetch_data.py V10.3 目前沒有建立明確的加權指數欄位。

   因此：
   - 有後台資料才顯示
   - 沒有資料就顯示 --
   - 絕不自行假造數字
   ============================================================ */

function renderTaiex() {

  const index =
    findTaiexData();


  if (!index) {

    els.taiexValue.textContent =
      "--";

    els.taiexChange.textContent =
      "--";

    els.taiexChange.className =
      "index-change flat";

    return;

  }


  const value =
    toNumber(
      index.value ??
      index.price ??
      index.close ??
      index.index
    );


  const change =
    toNumber(
      index.change_pct ??
      index.changePercent ??
      index.percent
    );


  els.taiexValue.textContent =
    value === null
      ? "--"
      : formatNumber(
          value,
          2
        );


  if (change === null) {

    els.taiexChange.textContent =
      "--";

    els.taiexChange.className =
      "index-change flat";

  }
  else {

    els.taiexChange.textContent =
      formatSignedPercent(
        change
      );

    els.taiexChange.className =
      "index-change " +
      priceColorClass(
        change
      );

  }

}


/* ============================================================
   Find TAIEX
   ============================================================ */

function findTaiexData() {

  const candidates = [

    appData.taiex,

    appData.taiwan_index,

    appData.market_index,

    appData.index,

    appData.market &&
      appData.market.taiex,

    appData.market &&
      appData.market.index,

    appData.summary &&
      appData.summary.taiex,

    appData.summary &&
      appData.summary.market_index

  ];


  for (
    const candidate
    of candidates
  ) {

    if (
      candidate &&
      typeof candidate === "object"
    ) {

      return candidate;

    }

  }


  return null;

}

/* ============================================================
   Market direction

   優先使用後台已整理結果。

   如果後台沒有 market_direction，
   前台只根據 market_breadth 做簡單呈現。

   不公開計算規則。
   ============================================================ */

function getMarketDirection() {

  const candidates = [

    appData.market_direction,

    appData.marketDirection,

    appData.market &&
      appData.market.direction,

    appData.summary &&
      appData.summary.market_direction,

    appData.summary &&
      appData.summary.marketDirection

  ];


  for (
    const candidate
    of candidates
  ) {

    if (
      candidate &&
      typeof candidate === "object"
    ) {

      const text =
        candidate.text ||
        candidate.label ||
        candidate.direction;


      if (text) {

        return normalizeDirection(
          text,
          candidate.description ||
          candidate.sub
        );

      }

    }


    if (
      typeof candidate === "string"
    ) {

      return normalizeDirection(
        candidate,
        ""
      );

    }

  }


  const breadth =
    appData.summary &&
    appData.summary.market_breadth;


  if (
    !breadth ||
    typeof breadth !== "object"
  ) {

    return {
      icon: "⚪",
      text: "--",
      sub: "等待市場資料",
      className: "flat"
    };

  }


  const rising =
    Number(
      breadth.rising || 0
    );


  const falling =
    Number(
      breadth.falling || 0
    );


  if (
    rising > falling
  ) {

    return {
      icon: "🟢",
      text: "偏多",
      sub: "市場氣氛偏強",
      className: "strength-strong"
    };

  }


  if (
    falling > rising
  ) {

    return {
      icon: "🔴",
      text: "偏弱",
      sub: "市場氣氛偏弱",
      className: "strength-weak"
    };

  }


  return {
    icon: "🟡",
    text: "震盪",
    sub: "多空力量接近",
    className: "strength-neutral"
  };

}


function normalizeDirection(
  value,
  description
) {

  const text =
    String(value);


  if (
    text.includes("偏多") ||
    text.includes("強")
  ) {

    return {
      icon: "🟢",
      text: "偏多",
      sub:
        description ||
        "市場氣氛偏強",
      className:
        "strength-strong"
    };

  }


  if (
    text.includes("偏弱") ||
    text.includes("弱")
  ) {

    return {
      icon: "🔴",
      text: "偏弱",
      sub:
        description ||
        "市場氣氛偏弱",
      className:
        "strength-weak"
    };

  }


  if (
    text.includes("震盪") ||
    text.includes("中性")
  ) {

    return {
      icon: "🟡",
      text: "震盪",
      sub:
        description ||
        "多空力量接近",
      className:
        "strength-neutral"
    };

  }


  return {
    icon: "⚪",
    text: text,
    sub:
      description ||
      "",
    className: "flat"
  };

}


/* ============================================================
   Tabs
   ============================================================ */

function setActiveTab(
  tab
) {

  activeTab = tab;


  document
    .querySelectorAll(
      ".tab-button"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tab ===
          tab
        );

      }
    );


  renderCurrentTab();

}


function renderCurrentTab() {

  let items = [];

  let title = "";


  switch (
    activeTab
  ) {

    case "selected":

      items =
        selectedItems;

      title =
        "今日精選";

      break;


    case "top10":

      items =
        top10Items;

      title =
        "Top 10";

      break;


    case "etf":

      items =
        etfItems;

      title =
        "ETF";

      break;


    case "bond":

      items =
        bondItems;

      title =
        "債券";

      break;


    case "watchlist":

      items =
        getWatchlistItems();

      title =
        "我的清單";

      break;


    default:

      items =
        selectedItems;

      title =
        "今日精選";

  }


  els.sectionTitle.textContent =
    title;


  els.sectionCount.textContent =
    `${items.length} 檔`;


  renderCards(
    items,
    activeTab
  );

}


/* ============================================================
   Cards
   ============================================================ */

function renderCards(
  items,
  tab
) {

  if (
    !Array.isArray(items) ||
    items.length === 0
  ) {

    renderEmptyState(
      tab
    );

    return;

  }


  els.cards.innerHTML =
    items
      .map(
        item =>
          renderStockCard(
            item,
            tab
          )
      )
      .join("");

}


/* ============================================================
   Stock card
   ============================================================ */

function renderStockCard(
  item,
  tab
) {

  const name =
    escapeHtml(
      item.name ||
      item.code ||
      "--"
    );


  const code =
    escapeHtml(
      item.code ||
      extractCode(
        item.symbol
      )
    );


  const price =
    item.price === null
      ? "--"
      : formatNumber(
          item.price,
          2
        );


  const change =
    item.change_pct === null
      ? "--"
      : formatSignedPercent(
          item.change_pct
        );


  const changeClass =
    priceColorClass(
      item.change_pct
    );


  const strength =
    getStrength(
      item
    );


  const recommendation =
    getRecommendation(
      item,
      tab
    );


  const assetBadge =
    getAssetBadge(
      item
    );


  let html = `

    <article
      class="stock-card"
      data-symbol="${escapeAttribute(
        item.symbol || ""
      )}"
    >

      <div class="stock-head">

        <div>

          <div class="stock-name">
            ${name}
          </div>

          <div class="stock-code">
            ${code}
          </div>

        </div>

        <div class="asset-badge">
          ${assetBadge}
        </div>

      </div>


      <div class="stock-price-row">

        <div class="stock-price">
          ${price}
        </div>

        <div
          class="stock-change ${changeClass}"
        >
          ${change}
        </div>

      </div>


      <div class="stock-divider"></div>


      <div class="card-bottom">

        <div
          class="strength ${strength.className}"
        >

          <span class="strength-dot"></span>

          <span>
            ${strength.text}
          </span>

        </div>

      </div>


      <div class="recommendation">

        <span class="recommendation-label">
          建議
        </span>

        ${escapeHtml(
          recommendation
        )}

      </div>
  `;


  if (
    tab !== "watchlist" &&
    item.symbol
  ) {

    const isAdded =
      isInWatchlist(
        item.symbol
      );


    if (!isAdded) {

      html += `

        <button
          type="button"
          class="add-watchlist"
          data-add-watchlist="${escapeAttribute(
            item.symbol
          )}"
        >
          ＋加入我的清單
        </button>

      `;

    }
    else {

      html += `

        <button
          type="button"
          class="add-watchlist"
          disabled
        >
          ✓ 已加入我的清單
        </button>

      `;

    }

  }


  if (
    tab === "watchlist"
  ) {

    html +=
      renderHoldingBox(
        item
      );

  }


  html += `
    </article>
  `;


  return html;

}


/* ============================================================
   Asset badge
   ============================================================ */

function getAssetBadge(
  item
) {

  if (
    item.type === "etf"
  ) {

    return "ETF";

  }


  if (
    item.type === "bond"
  ) {

    return "債券";

  }


  return "股票";

}


/* ============================================================
   Strength

   注意：
   前台不顯示 strength_score。
   只轉換成文字。
   ============================================================ */

function getStrength(
  item
) {

  const signal =
    String(
      item.signal || ""
    );


  if (
    signal.includes("強勢")
  ) {

    return {
      text: "強勢",
      className:
        "strength-strong"
    };

  }


  if (
    signal.includes("偏多")
  ) {

    return {
      text: "強勢",
      className:
        "strength-strong"
    };

  }


  if (
    signal.includes("弱勢") ||
    signal.includes("偏弱")
  ) {

    return {
      text: "弱勢",
      className:
        "strength-weak"
    };

  }


  const score =
    toNumber(
      item.strength_score
    );


  if (
    score !== null
  ) {

    if (
      score >= 70
    ) {

      return {
        text: "強勢",
        className:
          "strength-strong"
      };

    }


    if (
      score >= 45
    ) {

      return {
        text: "中性",
        className:
          "strength-neutral"
      };

    }


    return {
      text: "弱勢",
      className:
        "strength-weak"
    };

  }


  return {
    text: "中性",
    className:
      "strength-neutral"
  };

}


/* ============================================================
   Recommendation
   ============================================================ */

function getRecommendation(
  item,
  tab
) {

  if (
    tab === "watchlist"
  ) {

    return getHoldingRecommendation(
      item
    );

  }


  if (
    item.recommendation
  ) {

    return translateRecommendation(
      item.recommendation
    );

  }


  return "等待進一步觀察";

}


/* ============================================================
   Translate backend recommendation

   不把 6/6 或技術公式顯示出來。
   ============================================================ */

function translateRecommendation(
  value
) {

  const text =
    String(value);


  if (
    text.includes("符合")
  ) {

    return "偏多，可分批";

  }


  if (
    text.includes("接近")
  ) {

    return "積極關注";

  }


  if (
    text.includes("部分")
  ) {

    return "等待拉回";

  }


  if (
    text.includes("暫不")
  ) {

    return "暫停操作";

  }


  return text;

}


/* ============================================================
   Holding recommendation
   ============================================================ */

function getHoldingRecommendation(
  item
) {

  const position =
    getPosition(
      item.symbol
    );


  if (!position) {

    return "尚未建立持倉";

  }


  const shares =
    toNumber(
      position.shares
    );


  const cost =
    toNumber(
      position.cost
    );


  const price =
    toNumber(
      item.price
    );


  if (
    !shares ||
    !cost ||
    price === null
  ) {

    return "請輸入持有股數與平均成本";

  }


  const result =
    calculateHolding(
      item,
      shares,
      cost
    );


  if (!result) {

    return "等待持倉資料";

  }


  const profitPct =
    result.returnPct;


  const strength =
    getStrength(
      item
    );


  if (
    profitPct >= 25 &&
    strength.text === "強勢"
  ) {

    return "續抱觀察，不追價";

  }


  if (
    profitPct >= 15
  ) {

    return "持有觀察，不追價";

  }


  if (
    profitPct <= -15
  ) {

    return "暫停加碼，注意風險";

  }


  if (
    profitPct <= -8
  ) {

    return "等待止穩，再評估加碼";

  }


  if (
    strength.text === "強勢"
  ) {

    return "偏多，可分批加碼";

  }


  if (
    strength.text === "弱勢"
  ) {

    return "暫停加碼";

  }


  return "持有觀察";

}

/* ============================================================
   Holding calculation
   ============================================================ */

function calculateHolding(
  item,
  shares,
  cost
) {

  const currentPrice =
    toNumber(
      item &&
      item.price
    );


  const quantity =
    toNumber(
      shares
    );


  const averageCost =
    toNumber(
      cost
    );


  if (
    currentPrice === null ||
    quantity === null ||
    averageCost === null ||
    quantity <= 0 ||
    averageCost <= 0
  ) {

    return null;

  }


  const marketValue =
    currentPrice *
    quantity;


  const invested =
    averageCost *
    quantity;


  const profit =
    marketValue -
    invested;


  const returnPct =
    invested === 0
      ? null
      : (
          profit /
          invested
        ) * 100;


  return {
    marketValue,
    invested,
    profit,
    returnPct
  };

}


/* ============================================================
   Search
   ============================================================ */

function performSearch() {

  const keyword =
    els.searchInput
      .value
      .trim()
      .toLowerCase();


  if (!keyword) {

    els.searchResult.innerHTML =
      "";

    return;

  }


  const results =
    allItems.filter(
      item => {

        const code =
          String(
            item.code || ""
          ).toLowerCase();

        const name =
          String(
            item.name || ""
          ).toLowerCase();

        const symbol =
          String(
            item.symbol || ""
          ).toLowerCase();

        return (
          code.includes(keyword) ||
          name.includes(keyword) ||
          symbol.includes(keyword)
        );

      }
    )
    .slice(
      0,
      8
    );


  if (
    results.length === 0
  ) {

    els.searchResult.innerHTML = `

      <div class="state-box">

        <div class="state-title">
          找不到個股
        </div>

        <div class="state-text">
          請確認股票名稱或代號。
        </div>

      </div>

    `;

    return;

  }


  els.searchResult.innerHTML =
    results
      .map(
        item =>
          renderSearchResult(
            item
          )
      )
      .join("");

}

/* ============================================================
   Watchlist
   ============================================================ */

function loadWatchlist() {

  try {

    const raw =
      localStorage.getItem(
        "ai_market_watchlist_v10"
      );


    if (!raw) {
      return {};
    }


    const parsed =
      JSON.parse(raw);


    if (
      !parsed ||
      typeof parsed !== "object"
    ) {

      return {};

    }


    return parsed;

  }
  catch (error) {

    console.warn(
      "讀取我的清單失敗",
      error
    );

    return {};

  }

}


function saveWatchlist() {

  try {

    localStorage.setItem(
      "ai_market_watchlist_v10",
      JSON.stringify(
        watchlist
      )
    );

  }
  catch (error) {

    console.warn(
      "儲存我的清單失敗",
      error
    );

  }

}


function isInWatchlist(
  symbol
) {

  return Boolean(
    symbol &&
    watchlist[
      symbol
    ]
  );

}


function addToWatchlist(
  symbol
) {

  const item =
    allItems.find(
      x =>
        x.symbol ===
        symbol
    );


  if (!item) {
    return;
  }


  if (
    !watchlist[symbol]
  ) {

    watchlist[symbol] = {
      symbol,
      shares: "",
      cost: ""
    };

  }


  saveWatchlist();

  renderCurrentTab();

  renderPortfolioSummary();


  if (
    els.searchResult
  ) {

    performSearch();

  }

}


function removeFromWatchlist(
  symbol
) {

  if (
    watchlist[symbol]
  ) {

    delete watchlist[
      symbol
    ];

  }


  saveWatchlist();

  renderCurrentTab();

  renderPortfolioSummary();


  if (
    els.searchInput.value.trim()
  ) {

    performSearch();

  }

}


function getPosition(
  symbol
) {

  if (
    !symbol ||
    !watchlist[symbol]
  ) {

    return null;

  }


  return watchlist[
    symbol
  ];

}


function getWatchlistItems() {

  const symbols =
    Object.keys(
      watchlist
    );


  return symbols
    .map(
      symbol =>
        allItems.find(
          item =>
            item.symbol ===
            symbol
        )
    )
    .filter(Boolean);

}


function getPositions() {

  return getWatchlistItems()
    .map(
      item => {

        const position =
          getPosition(
            item.symbol
          );


        if (!position) {
          return null;
        }


        const shares =
          toNumber(
            position.shares
          );


        const cost =
          toNumber(
            position.cost
          );


        if (
          shares === null ||
          cost === null ||
          shares <= 0 ||
          cost <= 0
        ) {

          return null;

        }


        return {
          item,
          shares,
          cost
        };

      }
    )
    .filter(Boolean);

}


/* ============================================================
   Holding input
   ============================================================ */

function updateHoldingFromInput(
  input
) {

  const symbol =
    input.dataset.symbol;


  const field =
    input.dataset.holdingField;


  if (
    !symbol ||
    !field
  ) {

    return;

  }


  if (
    !watchlist[symbol]
  ) {

    watchlist[symbol] = {
      symbol,
      shares: "",
      cost: ""
    };

  }


  watchlist[symbol][
    field
  ] = input.value;


  saveWatchlist();


  /*
    不重新 render 卡片。
    這樣輸入框不會因為每打一個字就失去焦點。
    */

  updateWatchlistCalculatedValues(
    symbol
  );


  renderPortfolioSummary();

}


function updateWatchlistCalculatedValues(
  symbol
) {

  if (
    activeTab !== "watchlist"
  ) {

    return;

  }


  const item =
    allItems.find(
      x =>
        x.symbol ===
        symbol
    );


  if (!item) {
    return;
  }


  const position =
    getPosition(
      symbol
    );


  if (!position) {
    return;
  }


  const result =
    calculateHolding(
      item,
      position.shares,
      position.cost
    );


  const card =
    els.cards.querySelector(
      `[data-symbol="${cssEscape(
        symbol
      )}"]`
    );


  if (!card) {
    return;
  }


  const stats =
    card.querySelectorAll(
      ".holding-stat-value"
    );


  if (
    !stats ||
    stats.length < 3
  ) {

    return;

  }


  if (!result) {

    stats[0].textContent =
      "--";

    stats[1].textContent =
      "--";

    stats[2].textContent =
      "--";

    stats[1].className =
      "holding-stat-value";

    stats[2].className =
      "holding-stat-value";

    return;

  }


  stats[0].textContent =
    formatCurrency(
      result.marketValue
    );


  stats[1].textContent =
    formatSignedCurrency(
      result.profit
    );


  stats[2].textContent =
    formatSignedPercent(
      result.returnPct
    );


  const color =
    priceColorClass(
      result.profit
    );


  stats[1].className =
    "holding-stat-value " +
    color;


  stats[2].className =
    "holding-stat-value " +
    color;


  const recommendation =
    card.querySelector(
      ".recommendation"
    );


  if (recommendation) {

    recommendation.innerHTML = `

      <span class="recommendation-label">
        建議
      </span>

      ${escapeHtml(
        getHoldingRecommendation(
          item
        )
      )}

    `;

  }

}

/* ============================================================
   Formatting
   ============================================================ */

function formatDate(
  value
) {

  if (!value) {
    return "--";
  }


  const match =
    String(value)
      .match(
        /^(\d{4})-(\d{2})-(\d{2})/
      );


  if (!match) {
    return String(value);
  }


  return (
    match[1] +
    "-" +
    match[2] +
    "-" +
    match[3]
  );

}


function formatNumber(
  value,
  decimals = 2
) {

  const number =
    toNumber(value);


  if (number === null) {
    return "--";
  }


  return number.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:
        decimals,
      maximumFractionDigits:
        decimals
    }
  );

}


function formatCurrency(
  value
) {

  const number =
    toNumber(value);


  if (number === null) {
    return "--";
  }


  return (
    number.toLocaleString(
      "zh-TW",
      {
        maximumFractionDigits: 0
      }
    ) +
    " 元"
  );

}


function formatSignedCurrency(
  value
) {

  const number =
    toNumber(value);


  if (number === null) {
    return "--";
  }


  const rounded =
    Math.round(
      number
    );


  const prefix =
    rounded > 0
      ? "+"
      : rounded < 0
        ? "-"
        : "";


  return (
    prefix +
    Math.abs(
      rounded
    ).toLocaleString(
      "zh-TW"
    ) +
    " 元"
  );

}


function formatSignedPercent(
  value
) {

  const number =
    toNumber(value);


  if (number === null) {
    return "--";
  }


  const prefix =
    number > 0
      ? "+"
      : number < 0
        ? "-"
        : "";


  return (
    prefix +
    Math.abs(number)
      .toFixed(2) +
    "%"
  );

}


function priceColorClass(
  value
) {

  const number =
    toNumber(value);


  if (
    number === null
  ) {

    return "flat";

  }


  if (
    number > 0
  ) {

    return "up";

  }


  if (
    number < 0
  ) {

    return "down";

  }


  return "flat";

}


/* ============================================================
   Escape
   ============================================================ */

function escapeHtml(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function escapeAttribute(
  value
) {

  return escapeHtml(
    value
  );

}


function cssEscape(
  value
) {

  if (
    window.CSS &&
    typeof window.CSS.escape ===
      "function"
  ) {

    return window.CSS.escape(
      value
    );

  }


  return String(value)
    .replace(
      /["\\]/g,
      "\\$&"
    );

}
