<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI MARKET INTELLIGENCE｜台股市場</title>

  <style>
    :root {
      --bg: #07111f;
      --bg2: #0b1728;
      --panel: rgba(16, 31, 50, 0.88);
      --panel2: rgba(20, 38, 61, 0.92);
      --border: rgba(255,255,255,0.08);
      --text: #f3f7fb;
      --muted: #91a2b7;
      --muted2: #64758b;
      --accent: #54a8ff;
      --accent2: #7dd3fc;

      /* 台股：紅漲綠跌 */
      --up: #ff5c68;
      --up-bg: rgba(255,92,104,0.12);

      --down: #36d399;
      --down-bg: rgba(54,211,153,0.12);

      --warning: #f4c95d;
      --warning-bg: rgba(244,201,93,0.12);

      --shadow: 0 18px 50px rgba(0,0,0,0.28);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      color-scheme: dark;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at 15% 0%,
          rgba(52, 120, 246, 0.16),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 8%,
          rgba(31, 180, 190, 0.10),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #06101d 0%,
          #081321 45%,
          #07101c 100%
        );
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 60px;
    }

    /* ======================================================
       Header
       ====================================================== */

    .hero {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 28px 24px;
      background:
        linear-gradient(
          145deg,
          rgba(19, 42, 70, 0.94),
          rgba(10, 23, 39, 0.94)
        );
      box-shadow: var(--shadow);
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 260px;
      height: 260px;
      right: -90px;
      top: -110px;
      border-radius: 50%;
      background: rgba(84,168,255,0.10);
      filter: blur(8px);
      pointer-events: none;
    }

    .eyebrow {
      color: var(--accent2);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 2.4px;
      margin-bottom: 8px;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(28px, 5vw, 42px);
      font-weight: 850;
      letter-spacing: -1px;
    }

    .hero-subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 15px;
    }

    .market-state {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 22px;
      font-size: 14px;
      font-weight: 700;
    }

    .state-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
    }

    .state-open {
      background: #42e6a4;
      box-shadow: 0 0 12px rgba(66,230,164,0.7);
    }

    .state-closed {
      background: #ff5c68;
      box-shadow: 0 0 12px rgba(255,92,104,0.55);
    }

    .market-date {
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .market-date strong {
      color: var(--text);
      font-size: 14px;
    }

    /* ======================================================
       Summary Grid
       ====================================================== */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .summary-card {
      min-height: 132px;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .summary-label {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .summary-value {
      margin-top: 12px;
      color: var(--text);
      font-size: 28px;
      line-height: 1;
      font-weight: 850;
      letter-spacing: -0.6px;
    }

    .summary-note {
      margin-top: 9px;
      color: var(--muted2);
      font-size: 12px;
    }

    .summary-value.up {
      color: var(--up);
    }

    .summary-value.down {
      color: var(--down);
    }

    .summary-value.warning {
      color: var(--warning);
    }

    /* ======================================================
       Search
       ====================================================== */

    .search-section {
      margin-top: 20px;
    }

    .section-title {
      margin-bottom: 10px;
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 16px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      color: var(--text);
      background: rgba(13,27,44,0.94);
    }

    .search-input::placeholder {
      color: var(--muted2);
    }

    .search-input:focus {
      border-color: rgba(84,168,255,0.55);
      box-shadow: 0 0 0 3px rgba(84,168,255,0.10);
    }

    .search-button {
      flex: 0 0 auto;
      height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      color: #06101d;
      background: linear-gradient(
        135deg,
        #7dd3fc,
        #54a8ff
      );
      font-weight: 850;
    }

    .search-result {
      margin-top: 12px;
    }

    /* ======================================================
       Tabs
       ====================================================== */

    .tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 20;
      margin-top: 22px;
      padding: 8px 0;
      background: rgba(7,17,31,0.88);
      backdrop-filter: blur(18px);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 7px;
      padding: 6px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(12,25,42,0.92);
    }

    .tab {
      min-height: 42px;
      border: 0;
      border-radius: 11px;
      color: var(--muted);
      background: transparent;
      font-size: 13px;
      font-weight: 800;
      transition: 0.2s ease;
    }

    .tab:hover {
      color: var(--text);
      background: rgba(255,255,255,0.04);
    }

    .tab.active {
      color: #eaf6ff;
      background: linear-gradient(
        135deg,
        rgba(84,168,255,0.26),
        rgba(125,211,252,0.12)
      );
      box-shadow:
        inset 0 0 0 1px rgba(125,211,252,0.13);
    }

    /* ======================================================
       Content
       ====================================================== */

    .content {
      margin-top: 18px;
    }

    .content-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .content-title {
      margin: 0;
      font-size: 19px;
      font-weight: 850;
    }

    .content-count {
      color: var(--muted);
      font-size: 12px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(260px, 1fr)
      );
      gap: 12px;
    }

    /* ======================================================
       Stock Card
       ====================================================== */

    .stock-card {
      position: relative;
      overflow: hidden;
      padding: 18px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background:
        linear-gradient(
          145deg,
          rgba(17,35,56,0.96),
          rgba(11,24,40,0.96)
        );
      box-shadow:
        0 14px 35px rgba(0,0,0,0.20);
    }

    .stock-card::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: rgba(84,168,255,0.55);
    }

    .stock-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .stock-name {
      color: var(--text);
      font-size: 22px;
      line-height: 1.1;
      font-weight: 900;
      letter-spacing: -0.4px;
    }

    .stock-code {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .asset-badge {
      flex: 0 0 auto;
      padding: 5px 8px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-top: 20px;
    }

    .price {
      color: var(--text);
      font-size: 25px;
      font-weight: 900;
    }

    .change {
      font-size: 14px;
      font-weight: 850;
    }

    .change.up {
      color: var(--up);
    }

    .change.down {
      color: var(--down);
    }

    .change.flat {
      color: var(--muted);
    }

    .card-divider {
      height: 1px;
      margin: 17px 0;
      background: var(--border);
    }

    .strength-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .label {
      color: var(--muted);
      font-size: 12px;
    }

    .strength {
      font-size: 13px;
      font-weight: 850;
    }

    .strength.strong {
      color: var(--up);
    }

    .strength.neutral {
      color: var(--warning);
    }

    .strength.weak {
      color: var(--down);
    }

    .recommendation {
      margin-top: 15px;
      padding: 11px 12px;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 11px;
      background: rgba(255,255,255,0.025);
    }

    .recommendation-title {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
    }

    .recommendation-text {
      margin-top: 5px;
      color: var(--text);
      font-size: 13px;
      line-height: 1.45;
      font-weight: 800;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .small-button {
      flex: 1;
      min-height: 38px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255,255,255,0.025);
      font-size: 12px;
      font-weight: 800;
    }

    .small-button:hover {
      color: var(--text);
      background: rgba(255,255,255,0.06);
    }

    .small-button.primary {
      color: #dff4ff;
      border-color: rgba(84,168,255,0.22);
      background: rgba(84,168,255,0.10);
    }

    /* ======================================================
       Holding section
       ====================================================== */

    .holding-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 8px;
      margin-top: 16px;
    }

    .holding-item {
      padding: 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(255,255,255,0.025);
    }

    .holding-item-label {
      color: var(--muted2);
      font-size: 10px;
    }

    .holding-item-value {
      margin-top: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 850;
    }

    .holding-item-value.up {
      color: var(--up);
    }

    .holding-item-value.down {
      color: var(--down);
    }

    .holding-edit {
      margin-top: 12px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .holding-edit input {
      width: 100%;
      height: 38px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
      color: var(--text);
      background: rgba(5,15,27,0.75);
      font-size: 12px;
    }

    /* ======================================================
       Empty / loading
       ====================================================== */

    .empty {
      padding: 38px 18px;
      border: 1px dashed rgba(255,255,255,0.10);
      border-radius: var(--radius);
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.018);
    }

    .empty-title {
      color: var(--text);
      font-size: 15px;
      font-weight: 800;
    }

    .empty-note {
      margin-top: 7px;
      color: var(--muted2);
      font-size: 12px;
      line-height: 1.6;
    }

    .loading {
      padding: 50px 20px;
      color: var(--muted);
      text-align: center;
    }

    .error {
      padding: 18px;
      border: 1px solid rgba(255,92,104,0.18);
      border-radius: 14px;
      color: #ff9ca5;
      background: rgba(255,92,104,0.06);
      font-size: 13px;
      line-height: 1.6;
    }

    /* ======================================================
       Search result
       ====================================================== */

    .search-result-card {
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
    }

    .search-result-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .search-result-name {
      color: var(--text);
      font-size: 17px;
      font-weight: 850;
    }

    .search-result-code {
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ======================================================
       Footer
       ====================================================== */

    footer {
      margin-top: 40px;
      padding: 20px 4px;
      color: var(--muted2);
      text-align: center;
      font-size: 11px;
      line-height: 1.7;
    }

    /* ======================================================
       Responsive
       ====================================================== */

    @media (max-width: 720px) {

      .app {
        width: min(100% - 18px, 1180px);
        padding-top: 10px;
      }

      .hero {
        padding: 22px 18px;
        border-radius: 20px;
      }

      .summary-grid {
        gap: 9px;
      }

      .summary-card {
        min-height: 120px;
        padding: 16px;
      }

      .summary-value {
        font-size: 22px;
      }

      .tabs {
        gap: 4px;
        padding: 4px;
      }

      .tab {
        min-height: 40px;
        padding: 0 3px;
        font-size: 11px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .search-box {
        gap: 7px;
      }

      .search-button {
        padding: 0 15px;
      }
    }

    @media (max-width: 430px) {

      .hero-title {
        font-size: 27px;
      }

      .summary-card {
        min-height: 110px;
      }

      .summary-value {
        font-size: 20px;
      }

      .holding-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ======================================================

  <!-- ======================================================

  <section class="search-section">

    <div class="search-box">

  <!-- ======================================================

  <div class="tabs-wrap">

  <!-- ======================================================

  <main

<script>
"use strict";

/* ============================================================
   CONFIG
   ============================================================ */

const DATA_URL = "./Data/prices.json";

const WATCHLIST_STORAGE_KEY =
  "tw_ai_market_watchlist_v1";

const HOLDINGS_STORAGE_KEY =
  "tw_ai_market_holdings_v1";


/* ============================================================
   STATE
   ============================================================ */

let marketData = null;

let activeTab = "selected";

let watchlist = loadJSON(
  WATCHLIST_STORAGE_KEY,
  []
);

let holdings = loadJSON(
  HOLDINGS_STORAGE_KEY,
  {}
);


/* ============================================================
   Helpers
   ============================================================ */

function loadJSON(key, fallback) {

  try {

    const raw =
      localStorage.getItem(key);

    if (!raw) {
      return fallback;
    }

    const parsed =
      JSON.parse(raw);

    return parsed;

  } catch (error) {

    console.warn(
      "localStorage 讀取失敗",
      error
    );

    return fallback;
  }
}


function saveJSON(key, value) {

  try {

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  } catch (error) {

    console.warn(
      "localStorage 寫入失敗",
      error
    );
  }
}


function safeNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  const number =
    Number(value);

  if (!Number.isFinite(number)) {
    return null;
  }

  return number;
}


function formatNumber(
  value,
  digits = 2
) {

  const number =
    safeNumber(value);

  if (number === null) {
    return "--";
  }

  return number.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatInteger(value) {

  const number =
    safeNumber(value);

  if (number === null) {
    return "--";
  }

  return Math.round(number)
    .toLocaleString("zh-TW");
}


function formatPercent(value) {

  const number =
    safeNumber(value);

  if (number === null) {
    return "--";
  }

  const prefix =
    number > 0
      ? "+"
      : "";

  return (
    prefix
    + number.toFixed(2)
    + "%"
  );
}


function escapeHTML(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ============================================================
   Market status
   ============================================================ */

function isWeekday(dateString) {

  if (!dateString) {
    return false;
  }

  const date =
    new Date(
      dateString + "T12:00:00+08:00"
    );

  if (Number.isNaN(date.getTime())) {
    return false;
  }

  const day =
    date.getDay();

  return (
    day !== 0 &&
    day !== 6
  );
}


function updateMarketState() {

  const date =
    marketData?.latest_market_date
    || marketData?.date;

  const today =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Taipei",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).format(
      new Date()
    );

  const dot =
    document.getElementById(
      "marketStateDot"
    );

  const text =
    document.getElementById(
      "marketStateText"
    );

  if (!date) {

    dot.className =
      "state-dot state-closed";

    text.textContent =
      "資料尚未更新";

    return;
  }

  /*
   * V10.3 的 date / latest_market_date
   * 是實際有效行情交易日。
   *
   * 如果最新交易日不是今天，
   * 不假造今天有收盤。
   */

  if (date === today) {

    dot.className =
      "state-dot state-open";

    text.textContent =
      "🟢 今日開市";

  } else {

    dot.className =
      "state-dot state-closed";

    text.textContent =
      "🔴 非交易日／等待最新行情";
  }
}


/* ============================================================
   Portfolio
   ============================================================ */

function calculatePortfolioProfit() {

  if (
    !marketData ||
    !Array.isArray(
      marketData.universe?.items
    )
  ) {
    return null;
  }

  let totalProfit = 0;

  let hasPosition = false;

  const allItems =
    marketData.universe.items;

  for (const holdingCode of Object.keys(holdings)) {

    const holding =
      holdings[holdingCode];

    const shares =
      safeNumber(
        holding?.shares
      );

    const avgCost =
      safeNumber(
        holding?.avgCost
      );

    if (
      shares === null ||
      avgCost === null ||
      shares <= 0 ||
      avgCost <= 0
    ) {
      continue;
    }

    const stock =
      allItems.find(
        item =>
          String(
            item.code
          ) === String(
            holdingCode
          )
      );

    if (!stock) {
      continue;
    }

    /*
     * prices.json 的完整 Universe
     * 本身只保存 universe metadata。
     *
     * 個股行情在：
     * today_selected / top10 / etfs / bonds
     *
     * 所以從所有可取得的結果找行情。
     */

    const current =
      findStockData(
        holdingCode
      );

    const price =
      safeNumber(
        current?.price
      );

    if (price === null) {
      continue;
    }

    const profit =
      (
        price -
        avgCost
      ) * shares;

    totalProfit +=
      profit;

    hasPosition = true;
  }

  if (!hasPosition) {
    return null;
  }

  return totalProfit;
}


/* ============================================================
   Find stock data
   ============================================================ */

function allMarketItems() {

  if (!marketData) {
    return [];
  }

  const result = [];

  const sources = [
    marketData.today_selected,
    marketData.top10,
    marketData.etfs,
    marketData.bonds
  ];

  for (const source of sources) {

    if (!Array.isArray(source)) {
      continue;
    }

    for (const item of source) {

      if (!item?.symbol) {
        continue;
      }

      if (
        !result.some(
          existing =>
            existing.symbol === item.symbol
        )
      ) {
        result.push(item);
      }
    }
  }

  return result;
}


function findStockData(
  codeOrSymbol
) {

  const query =
    String(
      codeOrSymbol ?? ""
    )
    .trim()
    .toLowerCase();

  if (!query) {
    return null;
  }

  const items =
    allMarketItems();

  return (
    items.find(
      item =>
        String(
          item.code ?? ""
        )
        .toLowerCase() === query
    )
    ||
    items.find(
      item =>
        String(
          item.symbol ?? ""
        )
        .toLowerCase() === query
    )
    ||
    items.find(
      item =>
        String(
          item.name ?? ""
        )
        .toLowerCase()
        .includes(query)
    )
    ||
    null
  );
}


/* ============================================================
   Market Direction
   ============================================================ */

function calculateMarketDirection() {

  const breadth =
    marketData?.summary?.market_breadth
    || {};

  const rising =
    safeNumber(
      breadth.rising
    ) || 0;

  const falling =
    safeNumber(
      breadth.falling
    ) || 0;

  const unchanged =
    safeNumber(
      breadth.unchanged
    ) || 0;

  const total =
    rising +
    falling +
    unchanged;

  if (total <= 0) {

    return {
      label: "--",
      note: "市場資料不足",
      className: ""
    };
  }

  const risingRatio =
    rising / total;

  const fallingRatio =
    falling / total;

  if (
    risingRatio >= 0.60
    &&
    rising > falling
  ) {

    return {
      label: "🟢 偏多",
      note: "市場氣氛偏強",
      className: "up"
    };
  }

  if (
    fallingRatio >= 0.60
    &&
    falling > rising
  ) {

    return {
      label: "🔴 偏弱",
      note: "市場氣氛偏弱",
      className: "down"
    };
  }

  return {
    label: "🟡 震盪",
    note: "多空力量接近",
    className: "warning"
  };
}


/* ============================================================
   Strength
   ============================================================ */

function strengthInfo(
  item
) {

  const signal =
    String(
      item?.signal ?? ""
    );

  /*
   * V10.3 已經產生 signal。
   * 前台只顯示整理後的強度，
   * 不顯示 strength_score。
   */

  if (
    signal.includes("強勢")
  ) {

    return {
      text: "🟢 強勢",
      className: "strong"
    };
  }

  if (
    signal.includes("偏多")
  ) {

    return {
      text: "🟢 偏多",
      className: "strong"
    };
  }

  if (
    signal.includes("弱勢")
    ||
    signal.includes("偏弱")
  ) {

    return {
      text: "🔴 弱勢",
      className: "weak"
    };
  }

  return {
    text: "🟡 中性",
    className: "neutral"
  };
}


/* ============================================================
   Recommendation
   ============================================================ */

function recommendationForNormal(
  item
) {

  const recommendation =
    String(
      item?.recommendation ?? ""
    );

  const signal =
    String(
      item?.signal ?? ""
    );

  /*
   * 前台不顯示後台的 6/6。
   * recommendation 如果本身只是：
   * 「符合 6/6 核心條件」
   * 也不能直接原樣顯示。
   */

  if (
    recommendation.includes("符合")
  ) {

    if (
      signal.includes("強勢")
      ||
      signal.includes("偏多")
    ) {
      return "偏多，可分批";
    }

    return "積極關注";
  }

  if (
    recommendation.includes("接近")
  ) {
    return "等待拉回";
  }

  if (
    recommendation.includes("部分")
  ) {
    return "續抱觀察";
  }

  return "暫停操作";
}


/* ============================================================
   Holding recommendation
   ============================================================ */

function recommendationForHolding(
  item,
  holding
) {

  const shares =
    safeNumber(
      holding?.shares
    );

  const avgCost =
    safeNumber(
      holding?.avgCost
    );

  const price =
    safeNumber(
      item?.price
    );

  if (
    shares === null ||
    avgCost === null ||
    price === null ||
    shares <= 0 ||
    avgCost <= 0
  ) {

    return recommendationForNormal(
      item
    );
  }

  const returnPct =
    (
      (
        price -
        avgCost
      )
      / avgCost
    ) * 100;

  const strength =
    strengthInfo(
      item
    );

  if (
    returnPct >= 20
  ) {

    return "考慮減碼，鎖定部分獲利";
  }

  if (
    returnPct >= 10
    &&
    strength.className === "strong"
  ) {

    return "持有觀察，不追價";
  }

  if (
    returnPct < -20
  ) {

    return "檢視風險，暫停加碼";
  }

  if (
    strength.className === "strong"
    &&
    returnPct <= 8
  ) {

    return "偏多，可分批加碼";
  }

  if (
    strength.className === "neutral"
  ) {

    return "續抱觀察";
  }

  return "暫停加碼";
}


/* ============================================================
   Change class
   ============================================================ */

function changeClass(
  value
) {

  const number =
    safeNumber(value);

  if (number === null) {
    return "flat";
  }

  if (number > 0) {
    return "up";
  }

  if (number < 0) {
    return "down";
  }

  return "flat";
}

        <div class="holding-item">
          <div class="holding-item-label">
            平均成本
          </div>
          <div class="holding-item-value">
            ${
              avgCost === null
                ? "--"
                : formatNumber(avgCost, 2)

          </div>
        </div>

        <div class="holding-item">
          <div class="holding-item-label">
            目前市值
          </div>
          <div class="holding-item-value">
            ${
              marketValue === null
                ? "--"
                : formatInteger(marketValue)
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-item-label">
            損益
          </div>
          <div
            class="
              holding-item-value
              ${

                  ? (
                    profit > 0
                      ? "up"
                      : profit < 0
                        ? "down"
                        : ""
                  )
                  : ""
              }
            "
          >
            ${
              profit === null
                ? "--"
                : (
                  (profit > 0 ? "+" : "")
                  + formatInteger(profit)
                )
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-item-label">
            報酬率
          </div>
          <div
            class="
              holding-item-value
              ${
                returnPct !== null
                  ? (
                    returnPct > 0
                      ? "up"
                      : returnPct < 0
                        ? "down"
                        : ""
                  )
                  : ""
              }
            "
          >
            ${
              returnPct === null
                ? "--"
                : formatPercent(returnPct)
            }
          </div>
        </div>

      </div>

      <div class="holding-edit">

        <input
          type="number"
          min="0"

        >

        <input

          min="0"

        </div>

          ${priceText}

        <div class="change ${changeCls}">

        <div class="label">

/* ============================================================
   Render cards
   ============================================================ */

function renderCards(
  items,
  options = {}
) {

  if (
    !Array.isArray(items)
    ||
    items.length === 0
  ) {

    return `
      <div class="empty">

        <div class="empty-title">
          ${escapeHTML(
            options.emptyTitle
            || "目前沒有資料"
          )}
        </div>

        <div class="empty-note">
          ${escapeHTML(
            options.emptyNote
            || "目前沒有符合條件的資料。"
          )}
        </div>

      </div>
    `;
  }

  return `
    <div class="cards">
      ${
        items
          .map(
            item =>
              createStockCard(
                item,
                options
              )
          )
          .join("")
      }
    </div>
  `;
}


/* ============================================================
   Tab data
   ============================================================ */

function getTabItems(tab) {

  if (!marketData) {
    return [];
  }

  switch (tab) {

    case "selected":
      return Array.isArray(
        marketData.today_selected
      )
        ? marketData.today_selected
        : [];

    case "top10":
      return Array.isArray(
        marketData.top10
      )
        ? marketData.top10
        : [];

    case "etf":
      return Array.isArray(
        marketData.etfs
      )
        ? marketData.etfs
        : [];

    case "bond":
      return Array.isArray(
        marketData.bonds
      )
        ? marketData.bonds
        : [];

    case "watchlist":
      return getWatchlistItems();

    default:
      return [];
  }
}


/* ============================================================
   Watchlist
   ============================================================ */

function getWatchlistItems() {

  if (!Array.isArray(watchlist)) {
    return [];
  }

  const result = [];

  for (const symbol of watchlist) {

    const item =
      findStockData(symbol);

    if (item) {
      result.push(item);
    }
  }

  return result;
}


function addToWatchlist(
  symbol
) {

  if (!symbol) {
    return;
  }

  if (!Array.isArray(watchlist)) {
    watchlist = [];
  }

  if (
    watchlist.includes(symbol)
  ) {
    return;
  }

  watchlist.push(symbol);

  saveJSON(
    WATCHLIST_STORAGE_KEY,
    watchlist
  );

  renderActiveTab();
}


function removeFromWatchlist(
  symbol
) {

  watchlist =
    watchlist.filter(
      value =>
        String(value) !==
        String(symbol)
    );

  saveJSON(
    WATCHLIST_STORAGE_KEY,
    watchlist
  );

  renderActiveTab();
}


/* ============================================================
   Holdings
   ============================================================ */

function saveHolding(
  code,
  shares,
  avgCost
) {

  const parsedShares =
    safeNumber(shares);

  const parsedCost =
    safeNumber(avgCost);

  if (
    parsedShares === null
    ||
    parsedCost === null
    ||
    parsedShares <= 0
    ||
    parsedCost <= 0
  ) {

    delete holdings[code];

  } else {

    holdings[code] = {
      shares: parsedShares,
      avgCost: parsedCost
    };
  }

  saveJSON(
    HOLDINGS_STORAGE_KEY,
    holdings
  );

  updatePortfolioSummary();
  renderActiveTab();
}


/* ============================================================
   Portfolio summary
   ============================================================ */

function updatePortfolioSummary() {

  const element =
    document.getElementById(
      "portfolioProfit"
    );

  const profit =
    calculatePortfolioProfit();

  element.className =
    "summary-value";

  if (profit === null) {

    element.textContent =
      "尚未建立持倉";

    return;
  }

  if (profit > 0) {

    element.classList.add(
      "up"
    );

  } else if (profit < 0) {

    element.classList.add(
      "down"
    );
  }

  element.textContent =
    (
      profit > 0
        ? "+"
        : ""
    )
    + formatInteger(profit)
    + " 元";
}


/* ============================================================
   Summary
   ============================================================ */

function updateSummary() {

  const selected =
    Array.isArray(
      marketData?.today_selected
    )
      ? marketData.today_selected
      : [];

  document.getElementById(
    "selectedCount"
  ).textContent =
    formatInteger(
      selected.length
    );

  document.getElementById(
    "latestMarketDate"
  ).textContent =
    marketData?.latest_market_date
    || marketData?.date
    || "--";

  updateMarketState();

  /*
   * V10.3 目前沒有大盤指數欄位。
   * 因此禁止假造數值。
   */

  const indexValue =
    marketData?.market_index
    ?? marketData?.summary?.market_index
    ?? null;

  const indexChange =
    marketData?.market_index_change_pct
    ?? marketData?.summary?.market_index_change_pct
    ?? null;

  const indexElement =
    document.getElementById(
      "marketIndex"
    );

  const indexChangeElement =
    document.getElementById(
      "marketIndexChange"
    );

  if (indexValue !== null) {

    indexElement.textContent =
      formatNumber(
        indexValue,
        2
      );

    indexChangeElement.textContent =
      indexChange === null
        ? "--"
        : formatPercent(
            indexChange
          );

    indexChangeElement.className =
      "summary-note "
      + changeClass(indexChange);

  } else {

    indexElement.textContent =
      "--";

    indexChangeElement.textContent =
      "大盤資料尚未提供";

    indexChangeElement.className =
      "summary-note";
  }


  const direction =
    calculateMarketDirection();

  const directionElement =
    document.getElementById(
      "marketDirection"
    );

  const directionNote =
    document.getElementById(
      "marketDirectionNote"
    );

  directionElement.textContent =
    direction.label;

  directionElement.className =
    "summary-value "
    + (
      direction.className
      || ""
    );

  directionNote.textContent =
    direction.note;

  updatePortfolioSummary();
}

/* ============================================================
   Render active tab
   ============================================================ */

function renderActiveTab() {

  const container =
    document.getElementById(
      "mainContent"
    );

  const items =
    getTabItems(
      activeTab
    );

  const title =
    getContentTitle(
      activeTab
    );

  const empty =
    getEmptyText(
      activeTab
    );

  container.innerHTML = `

    <div class="content-header">

      <h2 class="content-title">
        ${escapeHTML(title)}
      </h2>

      <div class="content-count">
        ${formatInteger(items.length)} 筆
      </div>

    </div>

    ${
      renderCards(
        items,
        {
          watchlist:
            activeTab === "watchlist",

          emptyTitle:
            empty.title,

          emptyNote:
            empty.note
        }
      )
    }

  `;

  bindCardEvents();
}


/* ============================================================
   Card events
   ============================================================ */

function bindCardEvents() {

  document
    .querySelectorAll(
      "[data-add-watchlist]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            addToWatchlist(
              button.dataset.addWatchlist
            );
          }
        );
      }
    );


  document
    .querySelectorAll(
      "[data-remove-watchlist]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            removeFromWatchlist(
              button.dataset.removeWatchlist
            );
          }
        );
      }
    );


  document
    .querySelectorAll(
      "[data-holding-shares]"
    )
    .forEach(
      input => {

        input.addEventListener(
          "change",
          () => {

            const code =
              input.dataset.holdingShares;

            const costInput =
              document.querySelector(
                `[data-holding-cost="${code}"]`
              );

            saveHolding(
              code,
              input.value,
              costInput?.value
            );
          }
        );
      }
    );


  document
    .querySelectorAll(
      "[data-holding-cost]"
    )
    .forEach(
      input => {

        input.addEventListener(
          "change",
          () => {

            const code =
              input.dataset.holdingCost;

            const sharesInput =
              document.querySelector(
                `[data-holding-shares="${code}"]`
              );

            saveHolding(
              code,
              sharesInput?.value,
              input.value
            );
          }
        );
      }
    );
}


/* ============================================================
   Search
   ============================================================ */

function performSearch() {

  const input =
    document.getElementById(
      "searchInput"
    );

  const result =
    document.getElementById(
      "searchResult"
    );

  const query =
    input.value.trim();

  if (!query) {

    result.innerHTML = "";

    return;
  }

  const item =
    findStockData(query);

  if (!item) {

    result.innerHTML = `
      <div class="empty">
        <div class="empty-title">
          找不到個股
        </div>
        <div class="empty-note">
          請輸入正確的股票名稱或代號。
        </div>
      </div>
    `;

    return;
  }

  const isWatched =
    watchlist.includes(
      item.symbol
    );

  const strength =
    strengthInfo(item);

  const recommendation =
    recommendationForNormal(
      item
    );

  result.innerHTML = `

    <div class="search-result-card">

      <div class="search-result-top">

        <div>

          <div class="search-result-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="search-result-code">
            ${escapeHTML(item.code)}
          </div>

        </div>

        <button
          id="searchAddButton"
          class="
            small-button
            ${
              isWatched
                ? ""
                : "primary"
            }
          "
          type="button"
        >
          ${
            isWatched
              ? "已加入我的清單"
              : "＋加入我的清單"
          }
        </button>

      </div>

      <div class="price-row">

        <div class="price">
          ${
            item.price === null
              ? "--"
              : formatNumber(item.price, 2)
          }
        </div>

        <div
          class="
            change
            ${changeClass(item.change_pct)}
          "
        >
          ${formatPercent(item.change_pct)}
        </div>

      </div>

      <div class="card-divider"></div>

      <div class="strength-row">

        <div class="label">
          指數強度
        </div>

        <div
          class="
            strength
            ${strength.className}
          "
        >
          ${strength.text}
        </div>

      </div>

      <div class="recommendation">

        <div class="recommendation-title">
          建議
        </div>

        <div class="recommendation-text">
          ${escapeHTML(recommendation)}
        </div>

      </div>

    </div>
  `;


  const addButton =
    document.getElementById(
      "searchAddButton"
    );

  addButton.addEventListener(
    "click",
    () => {

      addToWatchlist(
        item.symbol
      );

      performSearch();
    }
  );
}


/* ============================================================
   Tabs events
   ============================================================ */

function bindTabs() {

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            activeTab =
              button.dataset.tab;

            document
              .querySelectorAll(
                ".tab"
              )
              .forEach(
                tab =>
                  tab.classList.remove(
                    "active"
                  )
              );

            button.classList.add(
              "active"
            );

            renderActiveTab();
          }
        );
      }
    );
}


/* ============================================================
   Load data
   ============================================================ */

async function loadMarketData() {

  const container =
    document.getElementById(
      "mainContent"
    );

  try {

    const response =
      await fetch(
        DATA_URL
        + "?t="
        + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (
      !data
      ||
      typeof data !== "object"
    ) {

      throw new Error(
        "prices.json 格式錯誤"
      );
    }

    marketData = data;

    updateSummary();

    renderActiveTab();

  } catch (error) {

    console.error(
      "prices.json 讀取失敗",
      error
    );

    container.innerHTML = `

      <div class="error">

        <strong>
          資料尚未更新
        </strong>

        <br><br>

        無法讀取：
        Data/prices.json

        <br><br>

        請確認 GitHub Actions 是否已完成
        fetch_data.py V10.3，
        並確認 Data/prices.json 已成功提交。

      </div>

    `;

    document.getElementById(
      "latestMarketDate"
    ).textContent =
      "資料尚未更新";

    document.getElementById(
      "selectedCount"
    ).textContent =
      "--";

    document.getElementById(
      "marketStateText"
    ).textContent =
      "🔴 資料尚未更新";
  }
}


/* ============================================================
   Search events
   ============================================================ */

function bindSearch() {

  document
    .getElementById(
      "searchButton"
    )
    .addEventListener(
      "click",
      performSearch
    );


  document
    .getElementById(
      "searchInput"
    )
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          performSearch();
        }
      }
    );
}


/* ============================================================
   Initialize
   ============================================================ */

function init() {

  bindTabs();

  bindSearch();

  loadMarketData();
}


document.addEventListener(
  "DOMContentLoaded",
  init
);
</script>
