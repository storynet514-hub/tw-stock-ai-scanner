<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>零股定投儀表板 V8.0</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#f1f5f9;
    color:#0f172a;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        sans-serif;
}

header{
    background:#0f172a;
    color:white;
    padding:20px;
}

.header{
    max-width:1200px;
    margin:auto;
}

.container{
    max-width:1200px;
    margin:auto;
    padding:18px;
}

.grid{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:
        0 2px 8px rgba(15,23,42,.07);
}

.title{
    color:#64748b;
    font-size:13px;
}

.value{
    margin-top:7px;
    font-size:26px;
    font-weight:800;
}

.form{
    display:grid;
    grid-template-columns:
        repeat(auto-fit,minmax(160px,1fr));
    gap:10px;
}

input{
    width:100%;
    padding:11px;
    border:
        1px solid #cbd5e1;
    border-radius:9px;
}

button{
    padding:11px 15px;
    border:0;
    border-radius:9px;
    background:#0f172a;
    color:white;
    font-weight:700;
    cursor:pointer;
}

button.delete{
    background:#991b1b;
}

.section{
    margin-top:20px;
}

.table-wrap{
    overflow-x:auto;
    background:white;
    border-radius:16px;
}

table{
    width:100%;
    border-collapse:collapse;
    min-width:850px;
}

th,td{
    padding:12px;
    text-align:left;
    border-bottom:
        1px solid #e2e8f0;
}

th{
    background:#f8fafc;
    color:#475569;
    font-size:13px;
}

.profit{
    color:#dc2626;
    font-weight:800;
}

.loss{
    color:#16a34a;
    font-weight:800;
}

</style>
</head>

<body>

<header>
<div class="header">

    <h1>
        零股定投儀表板
    </h1>

    <div>
        V8.0｜獨立定投資料
    </div>

</div>
</header>

<main class="container">

<section class="grid">

<div class="card">
    <div class="title">
        累積投入
    </div>
    <div id="totalInvested"
         class="value">
        $0
    </div>
</div>

<div class="card">
    <div class="title">
        目前市值
    </div>
    <div id="totalValue"
         class="value">
        $0
    </div>
</div>

<div class="card">
    <div class="title">
        未實現損益
    </div>
    <div id="totalProfit"
         class="value">
        $0
    </div>
</div>

<div class="card">
    <div class="title">
        總報酬率
    </div>
    <div id="totalReturn"
         class="value">
        0%
    </div>
</div>

</section>


<section class="section">

<div class="card">

<h2>
新增定投紀錄
</h2>

<div class="form">

<input
    id="code"
    placeholder="股票代號"
/>

<input
    id="name"
    placeholder="股票名稱"
/>

<input
    id="date"
    type="date"
/>

<input
    id="shares"
    type="number"
    step="0.001"
    placeholder="股數"
/>

<input
    id="price"
    type="number"
    step="0.01"
    placeholder="買入價格"
/>

<button onclick="addRecord()">
    新增
</button>

</div>

</div>

</section>


<section class="section">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>
日期
</th>

<th>
代號
</th>

<th>
名稱
</th>

<th>
股數
</th>

<th>
買入價
</th>

<th>
投入金額
</th>

<th>
目前價格
</th>

<th>
目前市值
</th>

<th>
損益
</th>

<th>
報酬率
</th>

<th>
操作
</th>

</tr>

</thead>

<tbody id="records">
</tbody>

</table>

</div>

</section>


<section class="section">

<button onclick="location.href='index.html'">
    ← 返回 AI 選股
</button>

</section>

</main>


<script>

const STORAGE_KEY =
    "tw_stock_dca_v8";


let records =
    JSON.parse(
        localStorage.getItem(
            STORAGE_KEY
        ) || "[]"
    );


function save(){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(records)
    );

}


function money(value){

    return "$" +
        Number(value || 0)
            .toLocaleString(
                "zh-TW",
                {
                    maximumFractionDigits:2
                }
            );

}


function addRecord(){

    const code =
        document.getElementById(
            "code"
        ).value.trim();


    const name =
        document.getElementById(
            "name"
        ).value.trim();


    const date =
        document.getElementById(
            "date"
        ).value;


    const shares =
        Number(
            document.getElementById(
                "shares"
            ).value
        );


    const price =
        Number(
            document.getElementById(
                "price"
            ).value
        );


    if(
        !code ||
        !date ||
        !Number.isFinite(shares) ||
        shares <= 0 ||
        !Number.isFinite(price) ||
        price <= 0
    ){

        alert(
            "請完整輸入代號、日期、股數與價格。"
        );

        return;

    }


    records.push({

        id:
            Date.now(),

        code,

        name,

        date,

        shares,

        price,

        invested:
            shares * price,

        currentPrice:
            price

    });


    save();

    render();

}


function deleteRecord(id){

    records =
        records.filter(
            record =>
                record.id !== id
        );

    save();

    render();

}


async function getPrices(){

    try{

        const response =
            await fetch(
                "./Data/prices.json?t=" +
                Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){
            return [];
        }

        const data =
            await response.json();

        return data.stocks || [];

    }catch{

        return [];

    }

}


async function render(){

    const stocks =
        await getPrices();


    const priceMap =
        new Map();

    stocks.forEach(stock => {

        priceMap.set(
            String(stock.code),
            Number(stock.price)
        );

    });


    let totalInvested = 0;

    let totalValue = 0;


    const tbody =
        document.getElementById(
            "records"
        );


    tbody.innerHTML =
        records.map(record => {

            const currentPrice =
                priceMap.get(
                    String(record.code)
                ) ||
                Number(
                    record.currentPrice
                ) ||
                Number(record.price);


            const invested =
                Number(
                    record.shares
                ) *
                Number(
                    record.price
                );


            const value =
                Number(
                    record.shares
                ) *
                currentPrice;


            const profit =
                value -
                invested;


            const returnRate =
                invested > 0
                    ? profit /
                      invested *
                      100
                    : 0;


            totalInvested +=
                invested;


            totalValue +=
                value;


            return `

            <tr>

                <td>
                    ${record.date}
                </td>

                <td>
                    <strong>
                        ${record.code}
                    </strong>
                </td>

                <td>
                    ${record.name || "-"}
                </td>

                <td>
                    ${Number(record.shares)}
                </td>

                <td>
                    ${money(record.price)}
                </td>

                <td>
                    ${money(invested)}
                </td>

                <td>
                    ${money(currentPrice)}
                </td>

                <td>
                    ${money(value)}
                </td>

                <td class="${
                    profit >= 0
                        ? "profit"
                        : "loss"
                }">
                    ${money(profit)}
                </td>

                <td class="${
                    returnRate >= 0
                        ? "profit"
                        : "loss"
                }">
                    ${returnRate.toFixed(2)}%
                </td>

                <td>

                    <button
                        class="delete"
                        onclick="deleteRecord(${record.id})"
                    >
                        刪除
                    </button>

                </td>

            </tr>

            `;

        }).join("");


    const profit =
        totalValue -
        totalInvested;


    const returnRate =
        totalInvested > 0
            ? profit /
              totalInvested *
              100
            : 0;


    document.getElementById(
        "totalInvested"
    ).textContent =
        money(totalInvested);


    document.getElementById(
        "totalValue"
    ).textContent =
        money(totalValue);


    document.getElementById(
        "totalProfit"
    ).textContent =
        money(profit);


    document.getElementById(
        "totalReturn"
    ).textContent =
        returnRate.toFixed(2) +
        "%";

}


document.getElementById(
    "date"
).value =
    new Date()
        .toISOString()
        .slice(0,10);


render();

</script>

</body>
</html>
