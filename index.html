<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股資訊儀表板</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 16px; max-width: 600px; margin: 0 auto; }

    .dashboard-header { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; margin-bottom: 20px; }
    .dashboard-title { font-size: 1.25rem; font-weight: bold; margin-bottom: 6px; }
    .status-msg { color: var(--accent-blue); font-size: 0.85rem; }

    .stock-list { display: flex; flex-direction: column; gap: 16px; }
    .stock-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 12px; padding: 16px; }

    pre { background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 8px; color: #38bdf8; font-size: 0.85rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>

  <div class="dashboard-header">
    <div class="dashboard-title">台股數據監控</div>
    <div class="status-msg" id="statusMsg">正在讀取 Data/prices.json...</div>
  </div>

  <div class="stock-list" id="dataContainer"></div>

  <script>
    async function loadData() {
      const statusElem = document.getElementById('statusMsg');
      const container = document.getElementById('dataContainer');

      try {
        // 直接從 Data/prices.json 抓取資料
        const response = await fetch('./Data/prices.json');
        
        if (!response.ok) {
          throw new Error(`HTTP 狀態碼: ${response.status}`);
        }

        const jsonData = await response.json();
        statusElem.innerText = "資料讀取成功";

        // 完整呈現 JSON 內容
        container.innerHTML = `
          <div class="stock-card">
            <pre>${JSON.stringify(jsonData, null, 2)}</pre>
          </div>
        `;

      } catch (error) {
        console.error("讀取失敗:", error);
        statusElem.innerText = "數據讀取失敗，請確認 Data/prices.json 檔案是否存在。";
      }
    }

    window.onload = loadData;
  </script>
</body>
</html>
