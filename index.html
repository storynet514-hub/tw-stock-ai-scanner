<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#080d15">

<title>台股 AI 選股</title>

<style>

/* =========================================================
   基本設定
========================================================= */

:root{
  --bg:#080d15;
  --bg2:#0d141e;

  --card:#111a25;
  --card-hover:#152131;

  --line:rgba(255,255,255,.08);

  --text:#f5f7fa;
  --muted:#8b98a8;

  /* 台股習慣：紅漲、綠跌 */
  --up:#ff5364;
  --down:#27c997;

  --blue:#5caeff;
  --gold:#f4c96b;

  --good:#27c997;
  --watch:#f4c96b;
  --hold:#66aaff;
  --bad:#ff6675;

  --radius:16px;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(70,130,220,.12),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;

  -webkit-font-smoothing:antialiased;
}

button,
input{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(1180px,100%);
  margin:0 auto;

  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(40px,env(safe-area-inset-bottom));
}


/* =========================================================
   HEADER
========================================================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;

  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;

  gap:10px;
}

.logo{
  width:42px;
  height:42px;

  display:grid;
  place-items:center;

  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      rgba(92,174,255,.20),
      rgba(160,130,255,.16)
    );

  border:1px solid var(--line);

  font-size:20px;
}

.title{
  font-size:18px;
  font-weight:900;
  line-height:1.2;
}

.sub{
  margin-top:3px;

  color:var(--muted);

  font-size:11px;
}

.status{
  display:flex;
  align-items:center;

  gap:6px;

  color:var(--muted);

  font-size:11px;
}

.status-dot{
  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--good);

  box-shadow:
    0 0 9px rgba(39,201,151,.65);
}


/* =========================================================
   全市場掃描
========================================================= */

.scan-card{
  padding:17px;

  margin-bottom:13px;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #121d2a,
      #0c131d
    );
}

.scan-head{
  display:flex;

  justify-content:space-between;
  align-items:flex-start;

  gap:10px;

  margin-bottom:15px;
}

.scan-title{
  font-size:18px;
  font-weight:900;
}

.scan-subtitle{
  margin-top:4px;

  color:var(--muted);

  font-size:11px;
}

.scan-status{
  padding:5px 9px;

  border-radius:999px;

  color:var(--good);

  background:
    rgba(39,201,151,.09);

  font-size:10px;

  white-space:nowrap;
}

.scan-grid{
  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:8px;
}

.scan-item{
  min-width:0;

  padding:11px 9px;

  border-radius:13px;

  background:
    rgba(255,255,255,.035);

  border:
    1px solid rgba(255,255,255,.05);
}

.scan-label{
  color:var(--muted);

  font-size:10px;

  white-space:nowrap;
}

.scan-value{
  margin-top:5px;

  font-size:19px;

  font-weight:900;

  line-height:1.1;
}

.scan-update{
  margin-top:12px;

  color:var(--muted);

  font-size:10px;
}


/* =========================================================
   搜尋
========================================================= */

.search-wrap{
  position:sticky;

  top:0;

  z-index:20;

  padding:8px 0;

  background:
    linear-gradient(
      var(--bg) 72%,
      transparent
    );

  backdrop-filter:blur(9px);
}

.search-box{
  display:flex;

  align-items:center;

  gap:8px;

  height:46px;

  padding:0 13px;

  border:
    1px solid var(--line);

  border-radius:13px;

  background:var(--card);
}

.search-icon{
  color:var(--muted);

  font-size:19px;
}

.search-box input{
  width:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:16px;
}

.search-box input::placeholder{
  color:#657184;
}


/* =========================================================
   TOP 30
========================================================= */

.section{
  margin-top:14px;
}

.section-head{
  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  margin-bottom:9px;
}

.section-title{
  font-size:19px;
  font-weight:900;
}

.section-count{
  color:var(--muted);

  font-size:11px;
}

.list{
  display:grid;

  gap:8px;
}


/* =========================================================
   股票卡片
========================================================= */

.stock{
  display:grid;

  grid-template-columns:
    34px
    minmax(0,1fr)
    auto;

  gap:9px;

  align-items:center;

  min-height:82px;

  padding:12px;

  border:
    1px solid var(--line);

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      var(--card),
      #0d151f
    );

  cursor:pointer;

  transition:
    transform .12s ease,
    border-color .12s ease,
    background .12s ease;
}

.stock:hover{
  border-color:
    rgba(92,174,255,.25);

  background:var(--card-hover);
}

.stock:active{
  transform:scale(.992);
}

.rank{
  color:var(--gold);

  font-size:14px;

  font-weight:900;

  text-align:center;
}

.stock-main{
  min-width:0;
}

.stock-name-row{
  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;
}

.stock-name{
  min-width:0;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

  font-size:16px;

  font-weight:850;
}

.stock-code{
  flex:none;

  color:var(--muted);

  font-size:11px;
}

.recommend{
  display:inline-flex;

  align-items:center;

  gap:4px;

  margin-top:5px;

  padding:3px 8px;

  border-radius:999px;

  font-size:10px;

  font-weight:750;

  white-space:nowrap;
}

.recommend.good{
  color:#4be0b0;

  background:
    rgba(39,201,151,.10);
}

.recommend.watch{
  color:#f5d178;

  background:
    rgba(244,201,107,.10);
}

.recommend.hold{
  color:#72b4ff;

  background:
    rgba(92,174,255,.10);
}

.recommend.neutral{
  color:#aab3bf;

  background:
    rgba(255,255,255,.06);
}

.recommend.bad{
  color:#ff7c88;

  background:
    rgba(255,83,100,.10);
}

.price-box{
  text-align:right;

  white-space:nowrap;
}

.stock-price{
  font-size:17px;

  font-weight:900;

  line-height:1.2;
}

.stock-change{
  margin-top:4px;

  font-size:12px;

  font-weight:800;
}

/* 台股：紅漲 */
.stock-change.up{
  color:var(--up);
}

/* 台股：綠跌 */
.stock-change.down{
  color:var(--down);
}

.stock-change.flat{
  color:var(--muted);
}


/* =========================================================
   空狀態
========================================================= */

.empty{
  padding:32px 15px;

  text-align:center;

  color:var(--muted);

  border:
    1px dashed var(--line);

  border-radius:15px;
}

.error{
  padding:14px;

  border-radius:13px;

  color:#ff9ba5;

  background:
    rgba(255,83,100,.08);

  border:
    1px solid rgba(255,83,100,.18);

  font-size:13px;

  line-height:1.5;
}


/* =========================================================
   詳細資料
========================================================= */

.detail{
  display:none;

  position:fixed;

  inset:0;

  z-index:50;

  padding:12px;

  align-items:flex-end;

  background:
    rgba(0,0,0,.68);
}

.detail.open{
  display:flex;
}

.sheet{
  width:min(600px,100%);

  max-height:88vh;

  overflow:auto;

  margin:auto;

  padding:18px;

  border:
    1px solid var(--line);

  border-radius:21px;

  background:#0d151f;

  box-shadow:
    0 20px 70px rgba(0,0,0,.55);
}

.sheet-head{
  display:flex;

  justify-content:space-between;

  gap:12px;
}

.detail-name{
  font-size:22px;

  font-weight:900;
}

.detail-code{
  margin-top:3px;

  color:var(--muted);

  font-size:12px;
}

.close{
  width:44px;
  height:44px;

  flex:none;

  border:0;

  border-radius:12px;

  color:var(--text);

  background:
    rgba(255,255,255,.06);

  font-size:23px;

  cursor:pointer;
}

.detail-price-row{
  display:flex;

  align-items:flex-end;
  justify-content:space-between;

  gap:10px;

  margin-top:17px;
}

.detail-price{
  font-size:30px;

  font-weight:950;
}

.detail-change{
  padding-bottom:4px;

  font-size:14px;

  font-weight:850;
}

.detail-change.up{
  color:var(--up);
}

.detail-change.down{
  color:var(--down);
}

.detail-change.flat{
  color:var(--muted);
}

.detail-recommend{
  margin-top:13px;
}

.detail-recommend-label{
  color:var(--muted);

  font-size:11px;
}

.detail-recommend-value{
  margin-top:5px;

  font-size:18px;

  font-weight:900;
}

.metrics{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-top:15px;
}

.metric{
  padding:12px;

  border:
    1px solid var(--line);

  border-radius:12px;

  background:var(--card);
}

.metric-label{
  color:var(--muted);

  font-size:10px;
}

.metric-value{
  margin-top:4px;

  font-size:16px;

  font-weight:850;
}

.detail-note{
  margin-top:14px;

  color:var(--muted);

  font-size:10px;

  line-height:1.6;
}


/* =========================================================
   平板 / 桌面
========================================================= */

@media(min-width:700px){

  .app{
    padding:
      22px
      24px
      50px;
  }

  .scan-card{
    padding:21px;
  }

  .list{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .stock{
    min-height:88px;
  }

}


/* =========================================================
   小尺寸手機
========================================================= */

@media(max-width:380px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .scan-grid{
    gap:6px;
  }

  .scan-item{
    padding:10px 7px;
  }

  .scan-value{
    font-size:17px;
  }

  .stock{
    grid-template-columns:
      30px
      minmax(0,1fr)
      auto;

    gap:7px;

    padding:11px;
  }

  .stock-name{
    font-size:15px;
  }

  .stock-price{
    font-size:16px;
  }

  .metrics{
    grid-template-columns:1fr;
  }

}

</style>
</head>


<body>

<div class="app">


  <!-- =====================================================
       HEADER
  ====================================================== -->

  <header class="top">

    <div class="brand">

      <div class="logo">
        📈
      </div>

      <div>

        <div class="title">
          台股 AI 選股
        </div>

        <div class="sub">
          每日市場掃描
        </div>

      </div>

    </div>


    <div class="status">

      <span class="status-dot"></span>

      <span id="statusText">
        資料正常
      </span>

    </div>

  </header>


  <!-- =====================================================
       全市場掃描
  ====================================================== -->

  <section class="scan-card">

    <div class="scan-head">

      <div>

        <div class="scan-title">
          全市場掃描
        </div>

        <div class="scan-subtitle">
          今日市場資料
        </div>

      </div>

      <div
        class="scan-status"
        id="scanStatus"
      >
        掃描完成
      </div>

    </div>


    <div class="scan-grid">


      <div class="scan-item">

        <div class="scan-label">
          掃描股票
        </div>

        <div
          class="scan-value"
          id="totalStocks"
        >
          —
        </div>

      </div>


      <div class="scan-item">

        <div class="scan-label">
          符合篩選
        </div>

        <div
          class="scan-value"
          id="qualifiedStocks"
        >
          —
        </div>

      </div>


      <div class="scan-item">

        <div class="scan-label">
          精選標的
        </div>

        <div
          class="scan-value"
          id="selectedStocks"
        >
          30
        </div>

      </div>


    </div>


    <div
      class="scan-update"
      id="updated"
    >
      資料更新時間：讀取中…
    </div>

  </section>


  <!-- =====================================================
       SEARCH
       搜尋整個市場，不限制 TOP 30
  ====================================================== -->

  <div class="search-wrap">

    <label class="search-box">

      <span class="search-icon">
        ⌕
      </span>

      <input
        id="search"
        type="search"
        placeholder="搜尋股票代號或名稱"
        autocomplete="off"
      >

    </label>

  </div>


  <!-- =====================================================
       TOP 30
  ====================================================== -->

  <section class="section">

    <div class="section-head">

      <div class="section-title">
        今日精選 TOP 30
      </div>

      <div
        class="section-count"
        id="count"
      >
        讀取中…
      </div>

    </div>


    <div
      id="list"
      class="list"
    >

      <div class="empty">
        正在載入股票資料…
      </div>

    </div>

  </section>


</div>


<!-- =======================================================
     DETAIL
======================================================== -->

<div
  id="detail"
  class="detail"
  aria-hidden="true"
>

  <div class="sheet">


    <div class="sheet-head">

      <div>

        <div
          id="dName"
          class="detail-name"
        >
          —
        </div>

        <div
          id="dCode"
          class="detail-code"
        >
          —
        </div>

      </div>


      <button
        id="close"
        class="close"
        type="button"
        aria-label="關閉"
      >
        ×
      </button>

    </div>


    <div class="detail-price-row">

      <div
        id="dPrice"
        class="detail-price"
      >
        —
      </div>

      <div
        id="dChange"
        class="detail-change flat"
      >
        —
      </div>

    </div>


    <div class="detail-recommend">

      <div class="detail-recommend-label">
        系統建議
      </div>

      <div
        id="dRecommend"
        class="detail-recommend-value"
      >
        —
      </div>

    </div>


    <div
      id="metrics"
      class="metrics"
    >
    </div>


    <div class="detail-note">
      個股詳細資料僅在點選股票後顯示。
    </div>


  </div>

</div>


<script>

/* =========================================================
   資料來源
========================================================= */

const DATA_URL =
  'Data/prices.json';


const state = {

  stocks: [],

  top30: [],

  updatedAt: '',

  qualifiedCount: null

};


/* =========================================================
   DOM
========================================================= */

const $ = id =>
  document.getElementById(id);


/* =========================================================
   基本工具
========================================================= */

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function text(value){

  if(
    value === null ||
    value === undefined
  ){

    return '';

  }

  return String(value);

}


function escapeHTML(value){

  return text(value)
    .replace(
      /[&<>'"]/g,
      char => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        "'":'&#39;',
        '"':'&quot;'
      }[char])
    );

}


/* =========================================================
   股票欄位兼容
========================================================= */

function getCode(stock){

  return (
    stock?.code ??
    stock?.stock_code ??
    stock?.symbol ??
    stock?.ticker ??
    stock?.id ??
    ''
  );

}


function getName(stock){

  return (
    stock?.name ??
    stock?.stock_name ??
    stock?.stockName ??
    stock?.display_name ??
    stock?.displayName ??
    getCode(stock)
  );

}


function getPrice(stock){

  return num(
    stock?.price ??
    stock?.close ??
    stock?.closing_price ??
    stock?.last_price ??
    stock?.current_price ??
    stock?.currentPrice ??
    stock?.收盤價 ??
    stock?.股價
  );

}


function getChangePercent(stock){

  let value =
    stock?.change_pct ??
    stock?.change_percent ??
    stock?.pct_change ??
    stock?.changePercent ??
    stock?.漲跌幅;

  const n =
    num(value);

  if(n === null){

    return null;

  }

  /*
    如果後端直接提供小數，例如 0.0234，
    自動轉為 2.34%
  */

  if(
    Math.abs(n) <= 1
    &&
    Math.abs(n) > 0
  ){

    return n * 100;

  }

  return n;

}


function getVolume(stock){

  return (
    stock?.volume ??
    stock?.成交量 ??
    stock?.vol ??
    null
  );

}


function getVolumeMA5(stock){

  return (
    stock?.volume_ma5 ??
    stock?.volume5 ??
    stock?.ma5_volume ??
    stock?.五日均量 ??
    null
  );

}


function getRSI(stock){

  const value =
    num(
      stock?.rsi ??
      stock?.RSI
    );

  return value === null
    ? null
    : value;

}


function getMACD(stock){

  return (
    stock?.macd ??
    stock?.MACD ??
    null
  );

}


function getK(stock){

  return (
    stock?.kd_k ??
    stock?.K ??
    stock?.k ??
    null
  );

}


function getD(stock){

  return (
    stock?.kd_d ??
    stock?.D ??
    stock?.d ??
    null
  );

}


/* =========================================================
   建議
========================================================= */

function getRecommendation(stock){

  /*
    優先使用後端已經產生的建議。
    不在前端重新計算核心選股邏輯。
  */

  const direct =
    stock?.recommendation ??
    stock?.recommend ??
    stock?.advice ??
    stock?.suggestion ??
    stock?.signal_text ??
    stock?.signal ??
    stock?.建議;


  if(
    direct !== null &&
    direct !== undefined &&
    String(direct).trim() !== ''
  ){

    return normalizeRecommendation(
      String(direct)
    );

  }


  /*
    如果後端有 recommendation_type
  */

  const type =
    stock?.recommendation_type ??
    stock?.recommendationType ??
    stock?.advice_type;


  if(type){

    return normalizeRecommendation(
      String(type)
    );

  }


  /*
    沒有後端建議時，
    不自行假裝計算策略。
  */

  return {
    text:'觀望',
    className:'neutral'
  };

}


function normalizeRecommendation(value){

  const v =
    value.trim();


  if(
    /可考慮進場|建議進場|買進|買入|進場/i.test(v)
  ){

    return {
      text:'可考慮進場',
      className:'good'
    };

  }


  if(
    /分批|關注|觀察/i.test(v)
  ){

    return {
      text:'可分批關注',
      className:'watch'
    };

  }


  if(
    /續抱|持有/i.test(v)
  ){

    return {
      text:'續抱觀察',
      className:'hold'
    };

  }


  if(
    /暫不|不建議|避免|賣出/i.test(v)
  ){

    return {
      text:'暫不建議',
      className:'bad'
    };

  }


  return {
    text:v,
    className:'neutral'
  };

}


/* =========================================================
   數字格式
========================================================= */

function formatNumber(value){

  const n =
    num(value);

  if(n === null){

    return '—';

  }

  return n.toLocaleString(
    'zh-TW'
  );

}


function formatPrice(value){

  const n =
    num(value);

  if(n === null){

    return '—';

  }

  return n.toLocaleString(
    'zh-TW',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function formatPercent(value){

  const n =
    num(value);

  if(n === null){

    return '—';

  }

  return (
    (n >= 0 ? '+' : '') +
    n.toFixed(2) +
    '%'
  );

}


/* =========================================================
   漲跌 class
   台股：紅漲綠跌
========================================================= */

function changeClass(value){

  const n =
    num(value);

  if(n === null){

    return 'flat';

  }

  if(n > 0){

    return 'up';

  }

  if(n < 0){

    return 'down';

  }

  return 'flat';

}


/* =========================================================
   資料結構兼容
========================================================= */

function extractStocks(data){

  if(
    Array.isArray(data)
  ){

    return data;

  }


  if(
    Array.isArray(data?.stocks)
  ){

    return data.stocks;

  }


  if(
    Array.isArray(data?.data)
  ){

    return data.data;

  }


  if(
    Array.isArray(data?.items)
  ){

    return data.items;

  }


  if(
    Array.isArray(data?.results)
  ){

    return data.results;

  }


  /*
    某些版本可能使用：
    data.market / data.all_stocks
  */

  if(
    Array.isArray(data?.all_stocks)
  ){

    return data.all_stocks;

  }


  if(
    Array.isArray(data?.market)
  ){

    return data.market;

  }


  return [];

}


function extractTop30(data, stocks){

  const candidates = [

    data?.top30,

    data?.top_30,

    data?.top30_stocks,

    data?.selected_stocks,

    data?.selected,

    data?.recommendations

  ];


  for(
    const candidate of candidates
  ){

    if(
      Array.isArray(candidate)
      &&
      candidate.length
    ){

      return candidate.slice(0,30);

    }

  }


  /*
    如果後端沒有獨立 TOP30，
    使用 stocks 裡已有的排名資訊。

    優先 rank / ranking / score。
  */

  const ranked =
    stocks
      .filter(stock =>
        stock &&
        (
          stock.rank !== undefined ||
          stock.ranking !== undefined ||
          stock.ai_score !== undefined ||
          stock.score !== undefined
        )
      )
      .sort(
        (a,b) => {

          const ar =
            num(
              a.rank ??
              a.ranking
            );

          const br =
            num(
              b.rank ??
              b.ranking
            );


          if(
            ar !== null &&
            br !== null
          ){

            return ar - br;

          }


          const as =
            num(
              a.ai_score ??
              a.score
            ) ?? 0;

          const bs =
            num(
              b.ai_score ??
              b.score
            ) ?? 0;


          return bs - as;

        }
      );


  if(ranked.length){

    return ranked.slice(0,30);

  }


  /*
    最後才使用 stocks 前 30。
  */

  return stocks.slice(0,30);

}


/* =========================================================
   全市場統計
========================================================= */

function getQualifiedCount(data, stocks, top30){

  const candidates = [

    data?.qualified_count,

    data?.qualifiedCount,

    data?.qualified,

    data?.selected_count,

    data?.selectedCount,

    data?.符合條件數,

    data?.符合篩選,

    data?.rsi_above_50_count,

    data?.rsiAbove50Count

  ];


  for(
    const value of candidates
  ){

    const n =
      num(value);

    if(n !== null){

      return n;

    }

  }


  /*
    如果後端沒有統計欄位，
    嘗試從股票資料中的 qualified
    判斷。

    注意：
    這只是讀取後端結果，
    不重新執行選股邏輯。
  */

  const qualified =
    stocks.filter(
      stock =>
        stock?.qualified === true ||
        stock?.selected === true ||
        stock?.is_selected === true
    );


  if(qualified.length){

    return qualified.length;

  }


  /*
    如果完全沒有統計資料，
    不拿 TOP30 假裝成全市場符合數。
  */

  return null;

}


/* =========================================================
   更新時間
========================================================= */

function getUpdatedAt(data){

  return (
    data?.updated_at ??
    data?.updatedAt ??
    data?.generated_at ??
    data?.generatedAt ??
    data?.timestamp ??
    data?.last_updated ??
    data?.lastUpdated ??
    ''
  );

}


/* =========================================================
   Render Scan
========================================================= */

function renderScan(){

  const total =
    state.stocks.length;


  $('totalStocks').textContent =
    formatNumber(total);


  $('qualifiedStocks').textContent =
    state.qualifiedCount === null
      ? '—'
      : formatNumber(
          state.qualifiedCount
        );


  $('selectedStocks').textContent =
    formatNumber(
      Math.min(
        30,
        state.top30.length
      )
    );


  $('updated').textContent =
    `資料更新時間：${
      state.updatedAt || '—'
    }`;

}


/* =========================================================
   Render TOP30
========================================================= */

function renderTop30(rows){

  if(!rows.length){

    $('list').innerHTML =
      `
      <div class="empty">
        目前沒有可顯示的精選股票資料。
      </div>
      `;

    $('count').textContent =
      '0 檔';

    return;

  }


  $('count').textContent =
    `${rows.length} 檔`;


  $('list').innerHTML =
    rows
      .map(
        (stock,index) => {

          const code =
            getCode(stock);

          const name =
            getName(stock);

          const price =
            getPrice(stock);

          const change =
            getChangePercent(stock);

          const recommendation =
            getRecommendation(stock);


          return `

          <article
            class="stock"
            data-code="${escapeHTML(code)}"
          >

            <div class="rank">
              ${String(index + 1).padStart(2,'0')}
            </div>


            <div class="stock-main">

              <div class="stock-name-row">

                <div class="stock-name">
                  ${escapeHTML(name)}
                </div>

                <div class="stock-code">
                  ${escapeHTML(code)}
                </div>

              </div>


              <div
                class="recommend ${recommendation.className}"
              >
                ${escapeHTML(
                  recommendation.text
                )}
              </div>

            </div>


            <div class="price-box">

              <div class="stock-price">
                $${formatPrice(price)}
              </div>

              <div
                class="stock-change ${changeClass(change)}"
              >
                ${formatPercent(change)}
              </div>

            </div>

          </article>

          `;

        }
      )
      .join('');


  document
    .querySelectorAll('.stock')
    .forEach(
      element => {

        element.addEventListener(
          'click',
          () => {

            openDetail(
              element.dataset.code
            );

          }
        );

      }
    );

}


/* =========================================================
   全市場搜尋
========================================================= */

function searchAllStocks(){

  const query =
    $('search')
      .value
      .trim()
      .toLowerCase();


  /*
    沒搜尋：
    顯示 TOP30
  */

  if(!query){

    renderTop30(
      state.top30.slice(0,30)
    );

    return;

  }


  /*
    有搜尋：
    搜尋整個市場 stocks[]
  */

  const results =
    state.stocks
      .filter(
        stock => {

          const code =
            String(
              getCode(stock)
            ).toLowerCase();

          const name =
            String(
              getName(stock)
            ).toLowerCase();

          return (
            code.includes(query) ||
            name.includes(query)
          );

        }
      );


  $('count').textContent =
    `搜尋到 ${results.length} 檔`;


  if(!results.length){

    $('list').innerHTML =
      `
      <div class="empty">
        找不到符合的股票
      </div>
      `;

    return;

  }


  /*
    搜尋結果不再限制 30 檔。
  */

  renderSearchResults(
    results
  );

}

/* =========================================================
   找股票
========================================================= */

function findStock(code){

  return (
    state.stocks.find(
      stock =>
        String(
          getCode(stock)
        ) === String(code)
    )
    ||
    state.top30.find(
      stock =>
        String(
          getCode(stock)
        ) === String(code)
    )
  );

}


/* =========================================================
   個股詳細
========================================================= */

function openDetail(code){

  const stock =
    findStock(code);


  if(!stock){

    return;

  }


  const price =
    getPrice(stock);

  const change =
    getChangePercent(stock);

  const recommendation =
    getRecommendation(stock);


  $('dName').textContent =
    getName(stock);

  $('dCode').textContent =
    getCode(stock);


  $('dPrice').textContent =
    `$${formatPrice(price)}`;


  $('dChange').textContent =
    formatPercent(change);


  $('dChange').className =
    `detail-change ${
      changeClass(change)
    }`;


  $('dRecommend').textContent =
    recommendation.text;


  $('dRecommend').className =
    `detail-recommend-value`;


  const rsi =
    getRSI(stock);

  const macd =
    getMACD(stock);

  const k =
    getK(stock);

  const d =
    getD(stock);

  const volume =
    getVolume(stock);

  const volumeMA5 =
    getVolumeMA5(stock);


  /*
    詳細頁可以查看數據。
    首頁不暴露這些內部欄位。
  */

  const metrics = [

    [
      'RSI',
      rsi === null
        ? '—'
        : Number(rsi).toFixed(2)
    ],

    [
      'MACD',
      macd === null
        ? '—'
        : macd
    ],

    [
      'KD K',
      k === null
        ? '—'
        : k
    ],

    [
      'KD D',
      d === null
        ? '—'
        : d
    ],

    [
      '成交量',
      volume === null
        ? '—'
        : formatNumber(volume)
    ],

    [
      '5日均量',
      volumeMA5 === null
        ? '—'
        : formatNumber(volumeMA5)
    ]

  ];


  $('metrics').innerHTML =
    metrics
      .map(
        ([label,value]) => `

        <div class="metric">

          <div class="metric-label">
            ${label}
          </div>

          <div class="metric-value">
            ${escapeHTML(value)}
          </div>

        </div>

        `
      )
      .join('');


  $('detail')
    .classList
    .add('open');


  $('detail')
    .setAttribute(
      'aria-hidden',
      'false'
    );

}


/* =========================================================
   關閉詳細
========================================================= */

function closeDetail(){

  $('detail')
    .classList
    .remove('open');


  $('detail')
    .setAttribute(
      'aria-hidden',
      'true'
    );

}


/* =========================================================
   載入資料
========================================================= */

async function load(){

  $('scanStatus').textContent =
    '資料載入中';

  $('statusText').textContent =
    '讀取資料';


  try{

    const response =
      await fetch(
        `${DATA_URL}?t=${Date.now()}`,
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    state.stocks =
      extractStocks(data);


    state.top30 =
      extractTop30(
        data,
        state.stocks
      );


    state.updatedAt =
      getUpdatedAt(data);


    state.qualifiedCount =
      getQualifiedCount(
        data,
        state.stocks,
        state.top30
      );


    renderScan();


    renderTop30(
      state.top30.slice(0,30)
    );


    $('scanStatus').textContent =
      '掃描完成';


    $('statusText').textContent =
      '資料正常';

  }
  catch(error){

    console.error(
      '資料載入失敗：',
      error
    );


    $('scanStatus').textContent =
      '資料讀取失敗';


    $('statusText').textContent =
      '資料異常';


    $('list').innerHTML =
      `
      <div class="error">
        股票資料目前無法載入。
        請確認 Data/prices.json 是否存在，
        或稍後重新整理。
      </div>
      `;


    $('count').textContent =
      '載入失敗';

  }

}


/* =========================================================
   搜尋事件
========================================================= */

$('search')
  .addEventListener(
    'input',
    searchAllStocks
  );


/* =========================================================
   詳細頁關閉
========================================================= */

$('close')
  .addEventListener(
    'click',
    closeDetail
  );


$('detail')
  .addEventListener(
    'click',
    event => {

      if(
        event.target ===
        $('detail')
      ){

        closeDetail();

      }

    }
  );


document
  .addEventListener(
    'keydown',
    event => {

      if(
        event.key === 'Escape'
      ){

        closeDetail();

      }

    }
  );


/* =========================================================
   啟動
========================================================= */

load();

</script>
