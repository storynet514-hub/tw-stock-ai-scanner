<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d15">

<title>台股 AI 選股｜零股定投與動態風控</title>

<style>

:root{
  --bg:#080d15;
  --bg2:#0d1420;
  --card:#111a25;
  --card2:#151f2d;
  --line:rgba(255,255,255,.08);

  --text:#f5f7fa;
  --muted:#8b98a8;

  --up:#ff5367;
  --down:#27c997;

  --blue:#5caeff;
  --gold:#f4c96b;

  --good:#27c997;
  --warn:#f4c96b;
  --bad:#ff6675;

  --radius:16px;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  min-height:100vh;

  background:
    radial-gradient(
      circle at 15% 0%,
      rgba(70,130,220,.12),
      transparent 28%
    ),
    var(--bg);

  color:var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(1200px,100%);
  margin:auto;

  padding:
    14px
    max(14px,env(safe-area-inset-left))
    50px;
}

/* =====================================
   HEADER
===================================== */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:12px;
  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:42px;
  height:42px;

  border-radius:13px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      #5caeff,
      #916bff
    );

  font-weight:900;
}

.title{
  font-size:18px;
  font-weight:900;
}

.sub{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.status{
  font-size:11px;
  color:var(--muted);
  white-space:nowrap;
}

.dot{
  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--good);

  margin-right:6px;
}

/* =====================================
   NAVIGATION
===================================== */

.tabs{
  display:flex;
  gap:8px;

  overflow:auto;

  margin-bottom:12px;

  position:sticky;
  top:0;

  z-index:20;

  padding:6px 0;

  background:rgba(8,13,21,.86);

  backdrop-filter:blur(12px);
}

.tab{
  border:1px solid var(--line);

  background:var(--card);

  color:var(--muted);

  padding:9px 14px;

  border-radius:999px;

  white-space:nowrap;

  font-weight:800;

  font-size:13px;
}

.tab.active{
  background:#183455;
  color:#fff;
  border-color:#2b5e92;
}

/* =====================================
   PANELS
===================================== */

.panel{
  display:none;
}

.panel.active{
  display:block;
}

/* =====================================
   CARDS
===================================== */

.scan-card,
.card{

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.035),
      rgba(255,255,255,.018)
    );

  border:1px solid var(--line);

  border-radius:20px;

  padding:16px;

  margin-bottom:13px;
}

.scan-head{
  display:flex;

  justify-content:space-between;

  gap:12px;

  align-items:flex-start;
}

h2{
  font-size:18px;
  margin:0;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

/* =====================================
   BUTTONS
===================================== */

.btn{

  border:1px solid var(--line);

  background:var(--card2);

  color:#fff;

  border-radius:10px;

  padding:9px 12px;

  font-weight:800;
}

.btn.primary{

  background:#1d5e9c;

  border-color:#2b79bd;
}

.btn.danger{
  background:#55202a;
}

.btn.good{
  background:#174c3e;
}

/* =====================================
   SEARCH
===================================== */

.search{
  display:flex;

  gap:8px;

  margin:12px 0;
}

.search input{

  flex:1;

  min-width:0;

  background:var(--card);

  color:#fff;

  border:1px solid var(--line);

  border-radius:11px;

  padding:11px 13px;

  outline:0;
}

/* =====================================
   GRID
===================================== */

.grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:9px;
}

.metric{

  background:
    rgba(255,255,255,.035);

  border:1px solid var(--line);

  border-radius:12px;

  padding:10px;
}

.metric .label{

  font-size:10px;

  color:var(--muted);
}

.metric .value{

  font-size:18px;

  font-weight:900;

  margin-top:4px;
}

/* =====================================
   STOCK
===================================== */

.stock-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.stock{

  border:1px solid var(--line);

  background:var(--card);

  border-radius:15px;

  padding:13px;

  cursor:pointer;

  transition:
    transform .15s ease,
    background .15s ease;
}

.stock:hover{

  background:var(--card2);

  transform:translateY(-1px);
}

.stock-top{

  display:flex;

  justify-content:space-between;

  gap:8px;
}

.name{
  font-weight:900;
}

.code{

  font-size:11px;

  color:var(--muted);

  margin-top:2px;
}

.price{

  font-size:20px;

  font-weight:900;

  margin-top:12px;
}

.change{

  font-size:12px;

  margin-left:6px;
}

.up{
  color:var(--up);
}

.down{
  color:var(--down);
}

.neutral{
  color:var(--muted);
}

/* =====================================
   BADGES
===================================== */

.badge{

  display:inline-block;

  padding:4px 7px;

  border-radius:999px;

  font-size:10px;

  font-weight:900;

  background:
    rgba(92,174,255,.12);

  color:var(--blue);
}

.badge.good{

  background:
    rgba(39,201,151,.12);

  color:var(--good);
}

.badge.warn{

  background:
    rgba(244,201,107,.12);

  color:var(--warn);
}

.badge.bad{

  background:
    rgba(255,102,117,.12);

  color:var(--bad);
}

.score{

  font-size:25px;

  font-weight:900;

  color:var(--gold);
}

/* =====================================
   FORM
===================================== */

.form-grid{

  display:grid;

  grid-template-columns:
    repeat(3,1fr);

  gap:10px;
}

.field label{

  display:block;

  font-size:11px;

  color:var(--muted);

  margin-bottom:5px;
}

.field input,
.field select{

  width:100%;

  background:var(--card);

  border:1px solid var(--line);

  color:#fff;

  border-radius:10px;

  padding:10px;

  outline:0;
}

.form-actions{

  display:flex;

  gap:8px;

  margin-top:12px;
}

/* =====================================
   RISK
===================================== */

.risk-box{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:9px;
}

.risk{

  padding:12px;

  border:1px solid var(--line);

  border-radius:13px;

  background:
    rgba(255,255,255,.03);
}

.risk strong{

  display:block;

  font-size:18px;

  margin-top:5px;
}

/* =====================================
   DETAIL
===================================== */

.detail-head{

  display:flex;

  justify-content:space-between;

  gap:10px;

  align-items:flex-start;
}

.back{
  margin-bottom:10px;
}

/* =====================================
   NOTICE
===================================== */

.notice{

  padding:11px 12px;

  border-radius:11px;

  background:
    rgba(92,174,255,.08);

  border:
    1px solid
    rgba(92,174,255,.18);

  font-size:12px;

  line-height:1.7;

  margin-bottom:12px;
}

.empty{

  padding:30px;

  text-align:center;

  color:var(--muted);
}

.footer{

  text-align:center;

  color:var(--muted);

  font-size:10px;

  margin-top:25px;
}

/* =====================================
   MOBILE
===================================== */

@media(max-width:850px){

  .stock-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .form-grid{
    grid-template-columns:
      repeat(2,1fr);
  }

}

@media(max-width:560px){

  .status{
    display:none;
  }

  .grid{
    grid-template-columns:
      repeat(2,1fr);
  }

  .stock-grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .risk-box{
    grid-template-columns:
      repeat(2,1fr);
  }

  .scan-head{
    flex-direction:column;
  }

}

</style>
</head>

<body>

<div class="app">

<!-- =====================================
     HEADER
===================================== -->

<header class="top">

  <div class="brand">

    <div class="logo">
      AI
    </div>

    <div>

      <div class="title">
        台股 AI 選股
      </div>

      <div class="sub">
        選股・個股分析・零股定投・動態風控
      </div>

    </div>

  </div>

  <div class="status">

    <span class="dot"></span>

    <span id="dataStatus">
      資料載入中
    </span>

  </div>

</header>


<!-- =====================================
     NAVIGATION
===================================== -->

<nav class="tabs">

  <button
    class="tab active"
    data-tab="scan">

    AI 選股

  </button>

  <button
    class="tab"
    data-tab="watch">

    我的清單

  </button>

  <button
    class="tab"
    data-tab="dca">

    零股定投

  </button>

</nav>


<main>


<!-- =====================================
     AI SCANNER
===================================== -->

<section
  id="scan"
  class="panel active">

  <div class="scan-card">

    <div class="scan-head">

      <div>

        <h2>
          每日 AI 精選
        </h2>

        <div
          class="muted small"
          id="scanMeta">

          讀取 Data/prices.json

        </div>

      </div>

      <div
        class="score"
        id="marketCount">

        0

      </div>

    </div>


    <div
      class="grid"
      style="margin-top:12px">


      <div class="metric">

        <div class="label">
          符合 6 條件
        </div>

        <div
          class="value"
          id="qualifiedCount">

          0

        </div>

      </div>


      <div class="metric">

        <div class="label">
          資料筆數
        </div>

        <div
          class="value"
          id="dataCount">

          0

        </div>

      </div>


      <div class="metric">

        <div class="label">
          最後更新
        </div>

        <div
          class="value"
          id="updatedAt"
          style="font-size:13px">

          —

        </div>

      </div>


    </div>

  </div>


  <!-- SEARCH -->

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="搜尋股票代號或名稱">

    <button
      class="btn primary"
      id="refreshBtn">

      重新讀取

    </button>

  </div>


  <!-- STOCK LIST -->

  <div
    id="stockGrid"
    class="stock-grid">

  </div>

</section>


<!-- =====================================
     WATCH LIST
===================================== -->

<section
  id="watch"
  class="panel">

  <div class="card">

    <div class="scan-head">

      <div>

        <h2>
          我的清單
        </h2>

        <div class="muted small">
          可從個股加入；資料保存在本機
        </div>

      </div>

      <button
        class="btn danger"
        id="clearWatch">

        清空

      </button>

    </div>

  </div>


  <div
    id="watchGrid"
    class="stock-grid">

  </div>

</section>


<!-- =====================================
     DCA
===================================== -->

<section
  id="dca"
  class="panel">


  <div class="notice">

    <strong>
      動態風控自動計算
    </strong>

    <br>

    停損、第一停利、第二停利
    <strong>不需要使用者輸入</strong>。

    <br>

    有 ATR 資料時：
    停損 = 成本 − 1.5 × ATR；
    第一停利 = 成本 + 1.5 × ATR；
    第二停利 = 成本 + 3 × ATR。

    <br>

    沒有 ATR 時，
    系統自動使用百分比備援模型。

  </div>


  <div class="card">

    <h2>
      新增／編輯定投
    </h2>


    <form id="dcaForm">

      <div class="form-grid">


        <div class="field">

          <label>
            股票代號
          </label>

          <input
            id="fCode"
            required>

        </div>


        <div class="field">

          <label>
            股票名稱
          </label>

          <input
            id="fName"
            required>

        </div>


        <div class="field">

          <label>
            持有股數
          </label>

          <input
            id="fShares"
            type="number"
            min="0"
            step="0.001"
            required>

        </div>


        <div class="field">

          <label>
            平均成本
          </label>

          <input
            id="fCost"
            type="number"
            min="0"
            step="0.01"
            required>

        </div>


        <div class="field">

          <label>
            目前價格
          </label>

          <input
            id="fPrice"
            type="number"
            min="0"
            step="0.01">

        </div>


        <div class="field">

          <label>
            每期投入
          </label>

          <input
            id="fInvest"
            type="number"
            min="0"
            step="1">

        </div>


        <div class="field">

          <label>
            定投頻率
          </label>

          <select id="fFreq">

            <option>
              每月
            </option>

            <option>
              每週
            </option>

            <option>
              每兩週
            </option>

            <option>
              自訂
            </option>

          </select>

        </div>


        <div class="field">

          <label>
            備註
          </label>

          <input
            id="fNote">

        </div>

      </div>


      <div class="form-actions">

        <button
          class="btn primary"
          type="submit">

          儲存

        </button>

        <button
          class="btn"
          type="button"
          id="cancelEdit">

          取消

        </button>

      </div>

    </form>

  </div>


  <div
    id="dcaSummary"
    class="grid">

  </div>


  <div
    id="dcaList">

  </div>

</section>


<!-- =====================================
     DETAIL
===================================== -->

<section
  id="detail"
  class="panel">

  <button
    class="btn back"
    id="backBtn">

    ← 返回

  </button>


  <div
    id="detailContent">

  </div>

</section>


</main>


<div class="footer">

  台股 AI 選股／零股定投與動態風控

</div>


</div>


<script>

/* =====================================
   CONFIG
===================================== */

const DATA_URL =
  "./Data/prices.json";

const WATCH_KEY =
  "tw_ai_watch_v2";

const DCA_KEY =
  "tw_ai_dca_v2";


/* =====================================
   GLOBAL
===================================== */

let stocks = [];

let watch =
  loadLocal(
    WATCH_KEY,
    []
  );

let dca =
  loadLocal(
    DCA_KEY,
    []
  );

let editingIndex = -1;


/* =====================================
   LOCAL STORAGE
===================================== */

function loadLocal(
  key,
  fallback
){

  try{

    const raw =
      localStorage.getItem(key);

    if(!raw){
      return fallback;
    }

    const value =
      JSON.parse(raw);

    return value ?? fallback;

  }catch(error){

    return fallback;

  }

}


function saveLocal(
  key,
  value
){

  try{

    localStorage.setItem(
      key,
      JSON.stringify(value)
    );

  }catch(error){

    console.error(
      "LocalStorage error:",
      error
    );

  }

}


/* =====================================
   BASIC HELPERS
===================================== */

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : 0;

}


function text(value){

  return String(
    value ?? ""
  );

}


function escapeHTML(value){

  return text(value)
    .replace(
      /[&<>"']/g,
      function(char){

        const map = {

          "&":"&amp;",
          "<":"&lt;",
          ">":"&gt;",
          '"':"&quot;",
          "'":"&#39;"

        };

        return map[char];

      }
    );

}


function formatPrice(value){

  const n =
    num(value);

  if(!n){
    return "—";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function formatNumber(value){

  return num(value)
    .toLocaleString(
      "zh-TW"
    );

}


function formatMoney(value){

  return "NT$ " +
    Math.round(
      num(value)
    ).toLocaleString(
      "zh-TW"
    );

}


function formatPct(value){

  const n =
    num(value);

  return (
    n >= 0
      ? "+"
      : ""
  ) +
  n.toFixed(2) +
  "%";

}


function colorClass(value){

  const n =
    num(value);

  if(n > 0){
    return "up";
  }

  if(n < 0){
    return "down";
  }

  return "neutral";

}


function setText(
  id,
  value
){

  const element =
    document.getElementById(id);

  if(element){
    element.textContent =
      value;
  }

}


/* =====================================
   NORMALIZE STOCK DATA
===================================== */

function normalizeStock(raw){

  const x =
    raw || {};

  const stock = {

    code:
      text(
        x.code ??
        x.stock_id ??
        x.stockCode ??
        x.ticker ??
        x.symbol ??
        ""
      )
      .replace(
        ".TW",
        ""
      ),

    name:
      text(
        x.name ??
        x.stock_name ??
        x.stockName ??
        x.n ??
        ""
      ),

    price:
      num(
        x.price ??
        x.close ??
        x.current_price ??
        x.currentPrice ??
        x.last ??
        x.close_price
      ),

    change:
      num(
        x.change_pct ??
        x.changePercent ??
        x.pct_change ??
        x.change ??
        0
      ),

    rsi:
      num(
        x.rsi ??
        x.RSI
      ),

    k:
      num(
        x.k ??
        x.K ??
        x.kd_k
      ),

    d:
      num(
        x.d ??
        x.D ??
        x.kd_d
      ),

    macd:
      num(
        x.macd ??
        x.MACD
      ),

    signal:
      num(
        x.signal ??
        x.macd_signal ??
        x.MACD_signal
      ),

    volume:
      num(
        x.volume ??
        x.Volume
      ),

    avgVolume5:
      num(
        x.avg_volume_5 ??
        x.volume_ma5 ??
        x.vol_ma5
      ),

    ma20:
      num(
        x.ma20 ??
        x.MA20
      ),

    atr:
      num(
        x.atr ??
        x.ATR
      ),

    score:
      num(
        x.ai_score ??
        x.AI_SCORE ??
        x.score ??
        x.aiScore
      ),

    raw:x

  };


  stock.conditions =
    buildConditions(
      stock,
      x
    );


  return stock;

}


/* =====================================
   SIX CONDITIONS
===================================== */

function buildConditions(
  s,
  raw
){

  const c =
    raw.conditions ??
    raw.signals ??
    {};


  const macd =
    Boolean(
      c.macd ??
      c.MACD ??
      raw.macd_goldencross ??
      raw.macdGoldenCross ??
      (
        s.macd > s.signal &&
        s.macd !== 0
      )
    );


  const rsi =
    Boolean(
      c.rsi ??
      c.RSI ??
      raw.rsi_bull ??
      (
        s.rsi > 50
      )
    );


  const kd =
    Boolean(
      c.kd ??
      c.KD ??
      raw.kd_bull ??
      (
        s.k > s.d &&
        s.k !== 0
      )
    );


  const volume =
    Boolean(
      c.volume ??
      c.Volume ??
      raw.volume_expand ??
      (
        s.volume > 0 &&
        s.avgVolume5 > 0 &&
        s.volume >=
          s.avgVolume5 * 1.5
      )
    );


  const ma =
    Boolean(
      c.ma ??
      c.MA ??
      raw.above_ma20 ??
      (
        s.price > s.ma20 &&
        s.ma20 > 0
      )
    );


  const trend =
    Boolean(
      c.trend ??
      c.Trend ??
      raw.trend_up ??
      (
        s.price > s.ma20 &&
        s.macd > s.signal &&
        s.rsi > 50
      )
    );


  return {

    macd,
    rsi,
    kd,
    volume,
    ma,
    trend

  };

}


/* =====================================
   CONDITION COUNT
===================================== */

function conditionCount(stock){

  return Object
    .values(
      stock.conditions
    )
    .filter(Boolean)
    .length;

}


/* =====================================
   AI SCORE
===================================== */

function getAIScore(
  stock
){

  if(
    stock.score > 0
  ){

    return Math.min(
      100,
      stock.score
    );

  }


  return (
    conditionCount(stock) /
    6
  ) * 100;

}


/* =====================================
   QUALIFICATION
===================================== */

function isQualified(
  stock
){

  return (
    conditionCount(stock) >= 5
    ||
    getAIScore(stock) >= 80
  );

}


/* =====================================
   DYNAMIC RISK
===================================== */

function calculateRisk(
  stock,
  costOverride
){

  const marketPrice =
    num(stock.price);

  const cost =
    num(costOverride) ||
    marketPrice;


  let stopLoss;
  let takeProfit1;
  let takeProfit2;

  /*
    ATR 模型：

    停損：
    成本 - 1.5 ATR

    第一停利：
    成本 + 1.5 ATR

    第二停利：
    成本 + 3 ATR
  */

  if(
    stock.atr > 0
  ){

    stopLoss =
      cost -
      stock.atr * 1.5;

    takeProfit1 =
      cost +
      stock.atr * 1.5;

    takeProfit2 =
      cost +
      stock.atr * 3;

  }else{

    /*
      沒 ATR：

      停損 -8%

      第一停利 +10%

      第二停利 +18%
    */

    stopLoss =
      cost * 0.92;

    takeProfit1 =
      cost * 1.10;

    takeProfit2 =
      cost * 1.18;

  }


  return {

    stopLoss:
      Math.max(
        0,
        stopLoss
      ),

    takeProfit1:
      Math.max(
        0,
        takeProfit1
      ),

    takeProfit2:
      Math.max(
        0,
        takeProfit2
      )

  };

}


/* =====================================
   RISK STATUS
===================================== */

function getRiskStatus(
  stock,
  cost
){

  const price =
    num(stock.price);

  const risk =
    calculateRisk(
      stock,
      cost
    );


  if(!price){

    return {
      text:"等待價格",
      className:"warn"
    };

  }


  if(
    price <=
    risk.stopLoss
  ){

    return {
      text:"停損警戒",
      className:"bad"
    };

  }


  if(
    price >=
    risk.takeProfit2
  ){

    return {
      text:"第二停利",
      className:"good"
    };

  }


  if(
    price >=
    risk.takeProfit1
  ){

    return {
      text:"第一停利",
      className:"good"
    };

  }


  if(
    price <=
    risk.stopLoss * 1.03
  ){

    return {
      text:"接近停損",
      className:"warn"
    };

  }


  return {
    text:"正常",
    className:"good"
  };

}


/* =====================================
   FETCH DATA
===================================== */

async function fetchData(){

  setText(
    "dataStatus",
    "資料載入中"
  );


  try{

    const response =
      await fetch(
        DATA_URL +
        "?t=" +
        Date.now(),
        {
          cache:"no-store"
        }
      );


    if(
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const raw =
      await response.json();


    let array;


    if(
      Array.isArray(raw)
    ){

      array =
        raw;

    }else{

      array =
        raw.data ??
        raw.stocks ??
        raw.items ??
        raw.results ??
        raw.stocks_data ??
        [];

    }


    stocks =
      array
        .map(normalizeStock)
        .filter(
          stock =>
            stock.code ||
            stock.name
        );


    const updated =
      raw.updated_at ??
      raw.updatedAt ??
      raw.last_update ??
      raw.update_time ??
      raw.date ??
      "";


    setText(
      "updatedAt",
      updated
        ? String(updated)
        : "—"
    );


    setText(
      "dataStatus",
      "資料正常"
    );


    setText(
      "dataCount",
      formatNumber(
        stocks.length
      )
    );


    setText(
      "marketCount",
      formatNumber(
        stocks.length
      )
    );


    renderAll();


  }catch(error){

    console.error(
      error
    );


    stocks = [];


    setText(
      "dataStatus",
      "資料讀取失敗"
    );


    setText(
      "dataCount",
      "0"
    );


    setText(
      "marketCount",
      "0"
    );


    document.getElementById(
      "stockGrid"
    ).innerHTML = `

      <div
        class="card empty"
        style="grid-column:1/-1">

        <strong>
          無法讀取股票資料
        </strong>

        <br><br>

        Data/prices.json

        <br><br>

        ${escapeHTML(
          error.message
        )}

        <br><br>

        請確認 GitHub Actions
        是否已成功產生
        Data/prices.json。

      </div>

    `;


    renderWatch();

  }

}

/* =====================================

===================================== */

function addWatch(
  code
){

  const stock =
    stocks.find(
      item =>
        item.code === code
    );


  if(!stock){
    return;
  }


  if(
    watch.some(
      item =>
        item.code === code
    )
  ){

    switchTab(
      "watch"
    );

    return;

  }


  watch.push({

    code:
      stock.code,

    name:
      stock.name

  });


  saveLocal(
    WATCH_KEY,
    watch
  );


  renderWatch();


  switchTab(
    "watch"
  );

}


function renderWatch(){

  const grid =
    document.getElementById(
      "watchGrid"
    );


  if(!watch.length){

    grid.innerHTML = `

        點進個股後加入。

    return;

  const list =

          const live =

          return live || {

        return;

      }


      if(
        editingIndex >= 0
      ){

        dca[
          editingIndex
        ] = item;

      }else{

        dca.push(
          item
        );

      }


      saveLocal(
        DCA_KEY,
        dca
      );


      editingIndex =
        -1;


      this.reset();


      renderDCA();

    }
  );


/* =====================================
   EDIT DCA
===================================== */

function editDCA(
  index
){

  const item =
    dca[index];


  if(!item){
    return;
  }


  editingIndex =
    index;


  document.getElementById(
    "fCode"
  ).value =
    item.code;


  document.getElementById(
    "fName"
  ).value =
    item.name;


  document.getElementById(
    "fShares"
  ).value =
    item.shares;


  document.getElementById(
    "fCost"
  ).value =
    item.avgCost;


  document.getElementById(
    "fPrice"
  ).value =
    item.price || "";


  document.getElementById(
    "fInvest"
  ).value =
    item.invest || "";


  document.getElementById(
    "fFreq"
  ).value =
    item.freq ||
    "每月";


  document.getElementById(
    "fNote"
  ).value =
    item.note || "";


  switchTab(
    "dca"
  );


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}


/* =====================================
   DELETE DCA
===================================== */

function deleteDCA(
  index
){

  if(
    !confirm(
      "確定刪除此零股定投標的？"
    )
  ){

    return;

  }


  dca.splice(
    index,
    1
  );


  saveLocal(
    DCA_KEY,
    dca
  );


  renderDCA();

}


/* =====================================
   CANCEL EDIT
===================================== */

document
  .getElementById(
    "cancelEdit"
  )
  .addEventListener(
    "click",
    function(){

      editingIndex =
        -1;


      document
        .getElementById(
          "dcaForm"
        )
        .reset();

    }
  );


/* =====================================
   SEARCH
===================================== */

document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    renderScanner
  );


/* =====================================
   REFRESH
===================================== */

document
  .getElementById(
    "refreshBtn"
  )
  .addEventListener(
    "click",
    fetchData
  );


/* =====================================
   TAB
===================================== */

document
  .querySelectorAll(
    ".tab"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function(){

          switchTab(
            this.dataset.tab
          );

        }
      );

    }
  );


/* =====================================
   SWITCH TAB
===================================== */

function switchTab(
  id
){

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(
      button => {

        button.classList.toggle(
          "active",
          button.dataset.tab === id
        );

      }
    );


  document
    .querySelectorAll(
      ".panel"
    )
    .forEach(
      panel => {

        panel.classList.toggle(
          "active",
          panel.id === id
        );

      }
    );


  window.scrollTo(
    {
      top:0,
      behavior:"smooth"
    }
  );

}


/* =====================================
   BACK BUTTON
===================================== */

document
  .getElementById(
    "backBtn"
  )
  .addEventListener(
    "click",
    function(){

      switchTab(
        "scan"
      );

    }
  );


/* =====================================
   INITIAL LOAD
===================================== */

fetchData();

</script>

</body>
</html>
