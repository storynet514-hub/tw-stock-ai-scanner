<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<title>台股 AI 選股・零股定投</title>

<style>
:root {
  --bg: #080c14;
  --panel: #111827;
  --panel-2: #0d1422;
  --border: #243047;
  --text: #e5e7eb;
  --sub: #94a3b8;
  --white: #ffffff;

  /* 台股慣例：上漲紅、下跌綠 */
  --up: #ef4444;
  --down: #22c55e;

  --blue: #38bdf8;
  --yellow: #f59e0b;
  --purple: #a855f7;
  --gray: #64748b;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  background: var(--bg);
}

body {
  min-height: 100vh;
  background:
    radial-gradient(
      circle at top right,
      rgba(56, 189, 248, 0.06),
      transparent 32%
    ),
    radial-gradient(
      circle at top left,
      rgba(168, 85, 247, 0.05),
      transparent 30%
    ),
    var(--bg);
  color: var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    "PingFang TC",
    "Noto Sans TC",
    "Microsoft JhengHei",
    sans-serif;
}

button,
input {
  font: inherit;
}

button {
  cursor: pointer;
}

button:disabled {
  cursor: default;
  opacity: 0.55;
}

.app {
  width: 100%;
  max-width: 760px;
  margin: 0 auto;
  padding: 18px 12px 44px;
}

/* =========================================================
   HEADER
========================================================= */

.header {
  margin-bottom: 15px;
}

.brand {
  color: var(--blue);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 2px;
}

.market-title {
  margin-top: 5px;
  color: var(--white);
  font-size: 25px;
  line-height: 1.2;
  font-weight: 850;
}

.market-subtitle {
  margin-top: 4px;
  color: var(--sub);
  font-size: 12px;
}

.market-status-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-top: 12px;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: rgba(17, 24, 39, 0.82);
}

.market-status {
  display: flex;
  align-items: center;
  gap: 7px;
  color: var(--text);
  font-size: 12px;
  font-weight: 750;
}

.status-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.status-open .status-dot {
  background: var(--up);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.45);
}

.status-closed .status-dot {
  background: var(--red, #ef4444);
  box-shadow: 0 0 8px rgba(239, 68, 68, 0.35);
}

.status-other .status-dot {
  background: var(--yellow);
}

.latest-date {
  color: var(--sub);
  font-size: 11px;
  white-space: nowrap;
}

/* =========================================================
   FOUR SUMMARY PANELS
========================================================= */

.summary-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
  margin-bottom: 14px;
}

.summary-panel {
  min-height: 104px;
  padding: 13px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background:
    linear-gradient(
      145deg,
      rgba(17, 24, 39, 0.98),
      rgba(13, 20, 34, 0.98)
    );
}

.summary-label {
  color: var(--sub);
  font-size: 11px;
  font-weight: 700;
}

.summary-value {
  margin-top: 7px;
  color: var(--white);
  font-size: 23px;
  line-height: 1.15;
  font-weight: 850;
}

.summary-note {
  margin-top: 6px;
  color: var(--sub);
  font-size: 10px;
  line-height: 1.4;
}

.summary-value.small {
  font-size: 20px;
}

.summary-value.holdings-empty {
  font-size: 16px;
  color: var(--sub);
}

.index-change {
  display: flex;
  gap: 7px;
  margin-top: 6px;
  font-size: 11px;
  font-weight: 750;
}

.sentiment-line {
  display: flex;
  align-items: center;
  gap: 7px;
}

.sentiment-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex: 0 0 auto;
}

.sentiment-bullish .sentiment-dot {
  background: var(--up);
}

.sentiment-neutral .sentiment-dot {
  background: var(--yellow);
}

.sentiment-bearish .sentiment-dot {
  background: var(--down);
}

.sentiment-unavailable .sentiment-dot {
  background: var(--gray);
}

/* =========================================================
   SEARCH
========================================================= */

.search-section {
  margin-bottom: 13px;
}

.search-title {
  margin-bottom: 7px;
  color: var(--white);
  font-size: 12px;
  font-weight: 800;
}

.search-row {
  display: flex;
  gap: 7px;
}

.search-input {
  flex: 1 1 auto;
  min-width: 0;
  height: 40px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 9px;
  outline: none;
  background: var(--panel-2);
  color: var(--white);
  font-size: 13px;
}

.search-input:focus {
  border-color: var(--blue);
}

.search-input::placeholder {
  color: #64748b;
}

.search-button {
  flex: 0 0 auto;
  height: 40px;
  padding: 0 15px;
  border: 1px solid rgba(56, 189, 248, 0.45);
  border-radius: 9px;
  background: rgba(56, 189, 248, 0.1);
  color: var(--blue);
  font-size: 12px;
  font-weight: 800;
}

.search-button:hover {
  background: rgba(56, 189, 248, 0.16);
}

.search-results {
  display: none;
  margin-top: 7px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
}

.search-results.show {
  display: block;
}

.search-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 12px;
  border: 0;
  border-bottom: 1px solid var(--border);
  background: transparent;
  color: var(--text);
  text-align: left;
}

.search-item:last-child {
  border-bottom: 0;
}

.search-item:hover {
  background: rgba(56, 189, 248, 0.05);
}

.search-main {
  min-width: 0;
}

.search-name {
  color: var(--white);
  font-size: 14px;
  font-weight: 800;
}

.search-symbol {
  margin-top: 2px;
  color: var(--sub);
  font-size: 10px;
}

.search-action {
  flex: 0 0 auto;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel-2);
  color: var(--blue);
  font-size: 10px;
  font-weight: 750;
}

.search-action.added {
  color: var(--sub);
}

/* =========================================================
   TABS
========================================================= */

.tabs {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 5px;
  margin-bottom: 15px;
}

.tab {
  min-width: 0;
  padding: 9px 4px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--sub);
  font-size: 10px;
  font-weight: 800;
  white-space: nowrap;
}

.tab.active {
  border-color: var(--blue);
  background: rgba(56, 189, 248, 0.1);
  color: var(--blue);
}

/* =========================================================
   SECTION
========================================================= */

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin: 0 2px 9px;
}

.section-title {
  color: var(--white);
  font-size: 17px;
  font-weight: 850;
}

.section-count {
  color: var(--sub);
  font-size: 10px;
}

/* =========================================================
   STOCK CARD
========================================================= */

.stock-card {
  width: 100%;
  margin-bottom: 10px;
  padding: 14px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 12px;
  background:
    linear-gradient(
      145deg,
      rgba(17, 24, 39, 0.98),
      rgba(13, 20, 34, 0.98)
    );
}

.stock-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
}

.stock-main {
  min-width: 0;
}

/*
  股票名稱 > 股票代號
  絕對不使用「1102 亞泥」格式
*/

.stock-name {
  color: var(--white);
  font-size: 21px;
  line-height: 1.2;
  font-weight: 900;
  letter-spacing: 0.2px;
}

.stock-symbol {
  margin-top: 3px;
  color: var(--sub);
  font-size: 12px;
  line-height: 1.2;
  font-weight: 650;
  letter-spacing: 0.5px;
}

.stock-market {
  flex: 0 0 auto;
  padding: 3px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--sub);
  font-size: 9px;
}

/* =========================================================
   PRICE
========================================================= */

.price-row {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 9px;
  margin-top: 14px;
}

.price {
  color: var(--white);
  font-size: 24px;
  line-height: 1;
  font-weight: 900;
}

.change {
  font-size: 13px;
  font-weight: 800;
}

.text-up {
  color: var(--up) !important;
}

.text-down {
  color: var(--down) !important;
}

.text-flat {
  color: var(--sub) !important;
}

/* =========================================================
   STRENGTH / RECOMMENDATION
========================================================= */

.ai-summary {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 8px;
  margin-top: 12px;
}

.ai-cell {
  min-width: 0;
  padding: 9px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel-2);
}

.ai-label {
  color: var(--sub);
  font-size: 10px;
  font-weight: 700;
}

.ai-value {
  margin-top: 4px;
  color: var(--white);
  font-size: 12px;
  line-height: 1.35;
  font-weight: 800;
}

.strength-strong {
  color: var(--up);
}

.strength-neutral {
  color: var(--yellow);
}

.strength-weak {
  color: var(--down);
}

.strength-unavailable {
  color: var(--sub);
}

/* =========================================================
   MY LIST HOLDING
========================================================= */

.my-list-holding {
  margin-top: 11px;
  padding-top: 11px;
  border-top: 1px dashed var(--border);
}

.holding-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 8px;
}

.holding-input-group label {
  display: block;
  margin-bottom: 4px;
  color: var(--sub);
  font-size: 10px;
}

.holding-input {
  width: 100%;
  height: 34px;
  padding: 0 8px;
  border: 1px solid var(--border);
  border-radius: 7px;
  outline: none;
  background: var(--panel-2);
  color: var(--white);
  font-size: 12px;
  text-align: right;
}

.holding-input:focus {
  border-color: var(--blue);
}

.holding-result {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 7px;
  margin-top: 8px;
}

.holding-result-cell {
  padding: 8px 9px;
  border-radius: 7px;
  background: var(--panel-2);
}

.holding-result-label {
  color: var(--sub);
  font-size: 9px;
}

.holding-result-value {
  margin-top: 3px;
  color: var(--white);
  font-size: 12px;
  font-weight: 850;
}

.remove-button {
  width: 100%;
  margin-top: 8px;
  padding: 7px;
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 7px;
  background: rgba(239, 68, 68, 0.05);
  color: #fca5a5;
  font-size: 10px;
  font-weight: 750;
}

/* =========================================================
   EMPTY / ERROR / LOADING
========================================================= */

.state-box {
  padding: 32px 15px;
  border: 1px dashed var(--border);
  border-radius: 11px;
  background: rgba(17, 24, 39, 0.55);
  text-align: center;
}

.state-title {
  color: var(--white);
  font-size: 14px;
  font-weight: 850;
}

.state-text {
  margin-top: 6px;
  color: var(--sub);
  font-size: 11px;
  line-height: 1.6;
}

.error-box {
  border-color: rgba(239, 68, 68, 0.35);
  background: rgba(239, 68, 68, 0.05);
}

.error-box .state-title {
  color: #fecaca;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
  margin-top: 25px;
  color: #475569;
  font-size: 9px;
  line-height: 1.6;
  text-align: center;
}

/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 430px) {
  .app {
    padding: 14px 9px 35px;
  }

  .market-title {
    font-size: 23px;
  }

  .summary-panel {
    min-height: 100px;
    padding: 11px;
  }

  .summary-value {
    font-size: 21px;
  }

  .summary-value.small {
    font-size: 18px;
  }

  .stock-name {
    font-size: 20px;
  }

  .price {
    font-size: 22px;
  }

  .ai-summary {
    grid-template-columns: 1fr;
  }

  .tab {
    font-size: 9px;
    padding-left: 2px;
    padding-right: 2px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ======================================================

<script>
"use strict";

/* =========================================================
   CONFIG
========================================================= */

const UI_DATA_URL =
  "Data/ui_data.json";

const STORAGE_KEY =
  "tw_stock_ai_my_list_v1";

const EXPECTED_SCHEMA =
  "UI-DATA-2.1";

const TABS = [
  "today",
  "top10",
  "etf",
  "bond",
  "mylist"
];

let uiData = null;
let currentTab = "today";
let myList = loadMyList();


/* =========================================================
   DOM
========================================================= */

const content =
  document.getElementById("content");

const tabsElement =
  document.getElementById("tabs");

const searchInput =
  document.getElementById("searchInput");

const searchButton =
  document.getElementById("searchButton");

const searchResults =
  document.getElementById("searchResults");

const todayPickCount =
  document.getElementById("todayPickCount");

const portfolioProfit =
  document.getElementById("portfolioProfit");

const indexValue =
  document.getElementById("indexValue");

const indexChange =
  document.getElementById("indexChange");

const sentimentValue =
  document.getElementById("sentimentValue");

const sentimentNote =
  document.getElementById("sentimentNote");

const marketStatus =
  document.getElementById("marketStatus");

const marketStatusText =
  document.getElementById("marketStatusText");

const latestDate =
  document.getElementById("latestDate");


/* =========================================================
   SAFE HELPERS
========================================================= */

function escapeHtml(value) {
  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


function normalizeSymbol(value) {
  let text =
    String(value ?? "")
      .trim()
      .toUpperCase();

  for (const suffix of [
    ".TW",
    ".TWO",
    ".TSE",
    ".OTC"
  ]) {
    if (text.endsWith(suffix)) {
      text =
        text.slice(
          0,
          -suffix.length
        );
      break;
    }
  }

  return text;
}


function isFiniteNumber(value) {
  return (
    typeof value === "number" &&
    Number.isFinite(value)
  );
}


function toNumber(value) {
  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  if (typeof value === "number") {
    return Number.isFinite(value)
      ? value
      : null;
  }

  const number =
    Number(
      String(value)
        .replace(/,/g, "")
        .replace(/%/g, "")
        .trim()
    );

  return Number.isFinite(number)
    ? number
    : null;
}


/* =========================================================
   NUMBER FORMAT
========================================================= */

function formatNumber(
  value,
  digits = 2
) {
  const number =
    toNumber(value);

  if (number === null) {
    return "—";
  }

  return number.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatPrice(value) {
  const number =
    toNumber(value);

  if (number === null) {
    return "—";
  }

  let digits = 2;

  if (
    Math.abs(number) >= 1000
  ) {
    digits = 0;
  } else if (
    Math.abs(number) >= 100
  ) {
    digits = 1;
  }

  return number.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatSigned(
  value,
  digits = 2
) {
  const number =
    toNumber(value);

  if (number === null) {
    return "—";
  }

  const sign =
    number > 0
      ? "+"
      : number < 0
        ? "-"
        : "";

  return (
    sign +
    Math.abs(number).toLocaleString(
      "zh-TW",
      {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      }
    )
  );
}


function formatSignedPct(value) {
  return formatSigned(value, 2) + "%";
}


/* =========================================================
   CHANGE CLASS
========================================================= */

function changeClass(value) {
  const number =
    toNumber(value);

  if (number === null) {
    return "text-flat";
  }

  if (number > 0) {
    return "text-up";
  }

  if (number < 0) {
    return "text-down";
  }

  return "text-flat";
}


/* =========================================================
   LOCAL STORAGE
========================================================= */

function loadMyList() {
  try {
    const raw =
      localStorage.getItem(
        STORAGE_KEY
      );

    if (!raw) {
      return [];
    }

    const parsed =
      JSON.parse(raw);

    if (!Array.isArray(parsed)) {
      return [];
    }

    return parsed
      .map(item => {
        if (
          typeof item === "string"
        ) {
          return {
            symbol:
              normalizeSymbol(item),
            shares: "",
            averageCost: ""
          };
        }

        if (
          item &&
          typeof item === "object"
        ) {
          return {
            symbol:
              normalizeSymbol(
                item.symbol
              ),
            shares:
              item.shares ?? "",
            averageCost:
              item.averageCost ?? ""
          };
        }

        return null;
      })
      .filter(
        item =>
          item &&
          item.symbol
      );

  } catch (error) {
    console.warn(
      "My List localStorage 讀取失敗",
      error
    );

    return [];
  }
}


function saveMyList() {
  try {
    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(myList)
    );
  } catch (error) {
    console.warn(
      "My List localStorage 寫入失敗",
      error
    );
  }
}


function getMyListItem(symbol) {
  const normalized =
    normalizeSymbol(symbol);

  return (
    myList.find(
      item =>
        item.symbol === normalized
    ) || null
  );
}


function isInMyList(symbol) {
  return Boolean(
    getMyListItem(symbol)
  );
}


function addToMyList(symbol) {
  const normalized =
    normalizeSymbol(symbol);

  if (!normalized) {
    return;
  }

  if (
    isInMyList(normalized)
  ) {
    return;
  }

  myList.push({
    symbol: normalized,
    shares: "",
    averageCost: ""
  });

  saveMyList();

  if (currentTab === "mylist") {
    renderCurrentTab();
  }

  runSearch();
}


function removeFromMyList(symbol) {
  const normalized =
    normalizeSymbol(symbol);

  myList =
    myList.filter(
      item =>
        item.symbol !== normalized
    );

  saveMyList();

  renderSummary();

  if (currentTab === "mylist") {
    renderCurrentTab();
  }

  runSearch();
}

    text.includes("交易中")

    text.includes("非交易") ||

/* =========================================================
   PORTFOLIO CALCULATION
========================================================= */

function calculateHolding(stock) {
  const item =
    getMyListItem(
      stock.symbol
    );

  if (!item) {
    return {
      valid: false,
      shares: 0,
      averageCost: 0,
      marketValue: 0,
      invested: 0,
      profit: 0,
      returnPct: 0
    };
  }

  const shares =
    toNumber(item.shares);

  const averageCost =
    toNumber(
      item.averageCost
    );

  const price =
    toNumber(stock.price);

  if (
    shares === null ||
    shares <= 0 ||
    averageCost === null ||
    averageCost <= 0 ||
    price === null
  ) {
    return {
      valid: false,
      shares:
        shares || 0,
      averageCost:
        averageCost || 0,
      marketValue: 0,
      invested: 0,
      profit: 0,
      returnPct: 0
    };
  }

  const invested =
    shares * averageCost;

  const marketValue =
    shares * price;

  const profit =
    marketValue - invested;

  const returnPct =
    invested !== 0
      ? (
          profit /
          invested
        ) * 100
      : 0;

  return {
    valid: true,
    shares,
    averageCost,
    marketValue,
    invested,
    profit,
    returnPct
  };
}


function calculatePortfolioProfit() {
  let totalProfit = 0;
  let hasPosition = false;

  for (const item of myList) {
    const stock =
      getStock(item.symbol);

    if (!stock) {
      continue;
    }

    const holding =
      calculateHolding(stock);

    if (!holding.valid) {
      continue;
    }

    hasPosition = true;
    totalProfit +=
      holding.profit;
  }

  return {
    hasPosition,
    totalProfit
  };
}


function renderPortfolioSummary() {
  const result =
    calculatePortfolioProfit();

  if (!result.hasPosition) {
    portfolioProfit.className =
      "summary-value holdings-empty";

    portfolioProfit.textContent =
      "尚未建立持倉";

    return;
  }

  portfolioProfit.className =
    "summary-value " +
    changeClass(
      result.totalProfit
    );

  portfolioProfit.textContent =
    formatSigned(
      result.totalProfit,
      0
    ) + " 元";
}

function normalizeStrength(value) {

  ) {

    };
  }

/* =========================================================
   MY LIST RECOMMENDATION
   不直接複製今日精選 recommendation
========================================================= */

function getMyListRecommendation(
  stock,
  holding
) {
  const strength =
    normalizeStrength(
      stock.strength
    ).text;

  const price =
    toNumber(stock.price);

  if (
    !holding.valid ||
    price === null
  ) {
    if (strength === "強勢") {
      return "積極關注";
    }

    if (strength === "弱勢") {
      return "暫停加碼";
    }

    return "續抱觀察";
  }

  const roi =
    holding.returnPct;

  /*
   * 已有持倉 + 高獲利：
   * 不因為市場仍強就直接追價加碼。
   */
  if (roi >= 20) {
    if (strength === "弱勢") {
      return "考慮減碼";
    }

    return "持有觀察，不追價";
  }

  /*
   * 明顯虧損：
   * 弱勢優先停止加碼；
   * 強勢則觀察是否有重新轉強機會。
   */
  if (roi <= -15) {
    if (strength === "弱勢") {
      return "考慮減碼";
    }

    if (strength === "強勢") {
      return "暫停加碼";
    }

    return "暫停加碼";
  }

  /*
   * 小幅獲利：
   * 強勢可考慮分批加碼，
   * 但不直接沿用今日精選建議。
   */
  if (
    roi > 0 &&
    roi < 10
  ) {
    if (strength === "強勢") {
      return "偏多，可分批加碼";
    }

    if (strength === "弱勢") {
      return "暫停加碼";
    }

    return "持有觀察，不追價";
  }

  /*
   * 成本附近：
   */
  if (
    roi >= -5 &&
    roi <= 5
  ) {
    if (strength === "強勢") {
      return "偏多，可分批加碼";
    }

    if (strength === "弱勢") {
      return "暫停加碼";
    }

    return "持有觀察，不追價";
  }

  /*
   * 中度虧損：
   */
  if (roi < -5) {
    if (strength === "弱勢") {
      return "暫停加碼";
    }

    return "持有觀察，不追價";
  }

  /*
   * 其他正報酬：
   */
  if (
    roi >= 10 &&
    roi < 20
  ) {
    if (strength === "強勢") {
      return "持有觀察，不追價";
    }

    if (strength === "弱勢") {
      return "考慮減碼";
    }

    return "持有觀察，不追價";
  }

  return "持有觀察，不追價";
}

  document
    .querySelectorAll(
      "[data-holding-shares]"
    )
    .forEach(input => {

      input.addEventListener(
        "input",
        () => {

          const symbol =
            normalizeSymbol(
              input.dataset.holdingShares
            );

          updateHoldingField(
            symbol,
            "shares",
            input.value
          );
        }
      );
    });


  document
    .querySelectorAll(
      "[data-holding-cost]"
    )
    .forEach(input => {

      input.addEventListener(
        "input",
        () => {

          const symbol =
            normalizeSymbol(
              input.dataset.holdingCost
            );

          updateHoldingField(
            symbol,
            "averageCost",
            input.value
          );
        }
      );
    });


  document
    .querySelectorAll(
      "[data-remove-symbol]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          removeFromMyList(
            button.dataset.removeSymbol
          );
        }
      );
    });
}


function updateHoldingField(
  symbol,
  field,
  value
) {
  const item =
    getMyListItem(symbol);

  if (!item) {
    return;
  }

  if (field === "shares") {
    item.shares = value;
  }

  if (field === "averageCost") {
    item.averageCost = value;
  }

  saveMyList();

  /*
   * 更新首頁持倉總盈虧，
   * 同時重新 render 我的清單，
   * 但不重新載入 backend。
   */
  renderPortfolioSummary();

  if (
    currentTab === "mylist"
  ) {
    renderCurrentTab();
  }
}


/* =========================================================
   SEARCH
========================================================= */

function runSearch() {

  const query =
    String(
      searchInput.value || ""
    )
      .trim()
      .toLowerCase();

  if (!query) {
    searchResults.classList.remove(
      "show"
    );

    searchResults.innerHTML =
      "";

    return;
  }

  if (
    !uiData ||
    !uiData.stocks
  ) {
    return;
  }

  const matches =
    Object.values(
      uiData.stocks
    )
      .filter(stock => {

        const symbol =
          String(
            stock.symbol || ""
          )
            .toLowerCase();

        const name =
          String(
            stock.name || ""
          )
            .toLowerCase();

        return (
          symbol.includes(query) ||
          name.includes(query)
        );
      })
      .slice(0, 12);

  if (matches.length === 0) {

    searchResults.classList.add(
      "show"
    );

    searchResults.innerHTML = `
      <div class="search-item">
        <div class="search-main">
          <div class="search-name">
            找不到符合的股票
          </div>
          <div class="search-symbol">
            請確認股票名稱或代號
          </div>
        </div>
      </div>
    `;

    return;
  }

  searchResults.classList.add(
    "show"
  );

  searchResults.innerHTML =
    matches
      .map(stock => {

        const inList =
          isInMyList(
            stock.symbol
          );

        return `
          <div class="search-item">

            <div class="search-main">

              <div class="search-name">
                ${escapeHtml(stock.name || stock.symbol)}
              </div>

              <div class="search-symbol">
                ${escapeHtml(stock.symbol)}
              </div>

            </div>

            <button
              type="button"
              class="search-action ${inList ? "added" : ""}"
              data-search-symbol="${escapeHtml(stock.symbol)}"
              ${inList ? "disabled" : ""}
            >
              ${
                inList
                  ? "已加入"
                  : "＋加入我的清單"
              }
            </button>

          </div>
        `;
      })
      .join("");

  document
    .querySelectorAll(
      "[data-search-symbol]"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        event => {

          event.stopPropagation();

          addToMyList(
            button.dataset.searchSymbol
          );
        }
      );
    });
}


/* =========================================================
   TAB EVENTS
========================================================= */

function setActiveTab(tab) {

  if (
    !TABS.includes(tab)
  ) {
    return;
  }

  currentTab = tab;

  document
    .querySelectorAll(
      ".tab"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );
    });

  renderCurrentTab();

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


tabsElement
  .querySelectorAll(".tab")
  .forEach(button => {

    button.addEventListener(
      "click",
      () => {
        setActiveTab(
          button.dataset.tab
        );
      }
    );
  });


searchButton.addEventListener(
  "click",
  runSearch
);


searchInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {
      event.preventDefault();
      runSearch();
    }
  }
);


searchInput.addEventListener(
  "input",
  () => {

    if (
      searchInput.value.trim()
    ) {
      runSearch();
    } else {
      searchResults.classList.remove(
        "show"
      );

      searchResults.innerHTML =
        "";
    }
  }
);


/* =========================================================
   LOAD UI DATA
========================================================= */

async function loadUIData() {

  try {

    const response =
      await fetch(
        UI_DATA_URL +
        "?v=" +
        Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    validateUIData(data);

    uiData = data;

    renderMarket();
    renderSummary();
    renderCurrentTab();

  } catch (error) {

    console.error(
      "UI DATA LOAD ERROR:",
      error
    );

    renderError(
      error
    );
  }
}


/* =========================================================
   UI DATA CONTRACT VALIDATION
========================================================= */

function validateUIData(data) {

  if (
    !data ||
    typeof data !== "object"
  ) {
    throw new Error(
      "ui_data.json 根節點不是 object"
    );
  }

  if (
    data.schema_version !==
    EXPECTED_SCHEMA
  ) {
    throw new Error(
      "UI schema_version 不符合 UI-DATA-2.1"
    );
  }

  if (
    data.status !== "ok"
  ) {
    throw new Error(
      "UI data status 不是 ok"
    );
  }

  if (
    !data.market ||
    typeof data.market !== "object"
  ) {
    throw new Error(
      "ui_data.market 不存在"
    );
  }

  if (
    !data.summary ||
    typeof data.summary !== "object"
  ) {
    throw new Error(
      "ui_data.summary 不存在"
    );
  }

  if (
    !data.tabs ||
    typeof data.tabs !== "object"
  ) {
    throw new Error(
      "ui_data.tabs 不存在"
    );
  }

  if (
    !data.stocks ||
    typeof data.stocks !== "object"
  ) {
    throw new Error(
      "ui_data.stocks 不存在"
    );
  }

  const requiredTabs = [
    "today_picks",
    "top10",
    "etf",
    "bond"
  ];

  for (
    const key of requiredTabs
  ) {
    if (
      !Array.isArray(
        data.tabs[key]
      )
    ) {
      throw new Error(
        `ui_data.tabs.${key} 不是 array`
      );
    }
  }

  /*
   * backend watchlist 必須維持空值。
   * 我的清單由 browser localStorage 管理。
   */
  if (
    data.tabs.watchlist !== undefined &&
    !Array.isArray(
      data.tabs.watchlist
    )
  ) {
    throw new Error(
      "ui_data.tabs.watchlist 不是 array"
    );
  }

  /*
   * 前端禁止看到技術指標欄位。
   */
  const forbidden =
    new Set([
      "rsi",
      "macd",
      "kd",
      "ma5",
      "ma20",
      "volume",
      "average_volume",
      "technical_score",
      "strength_score",
      "core_score",
      "core_total"
    ]);

  for (
    const [symbol, stock]
    of Object.entries(
      data.stocks
    )
  ) {

    if (
      !stock ||
      typeof stock !== "object"
    ) {
      throw new Error(
        `${symbol} stock record 無效`
      );
    }

    for (
      const field
      of forbidden
    ) {

      if (
        Object.prototype.hasOwnProperty.call(
          stock,
          field
        )
      ) {
        throw new Error(
          `${symbol} 暴露禁止 technical field：${field}`
        );
      }
    }
  }
}


/* =========================================================
   ERROR
========================================================= */

function renderError(error) {

  content.innerHTML = `
    <div class="state-box error-box">

      <div class="state-title">
        資料載入失敗
      </div>

      <div class="state-text">
        ${
          escapeHtml(
            error?.message ||
            "無法讀取 Data/ui_data.json"
          )
        }
      </div>

    </div>
  `;

  todayPickCount.textContent =
    "—";

  portfolioProfit.className =
    "summary-value holdings-empty";

  portfolioProfit.textContent =
    "尚未建立持倉";

  indexValue.textContent =
    "—";

  indexChange.innerHTML =
    "<span>—</span><span>—</span>";

  sentimentValue.className =
    "summary-value small sentiment-line sentiment-unavailable";

  sentimentValue.innerHTML = `
    <span class="sentiment-dot"></span>
    <span>資料不足</span>
  `;

  sentimentNote.textContent =
    "市場氣氛資料不足";

  marketStatus.className =
    "market-status status-other";

  marketStatusText.textContent =
    "⚪ 資料無法取得";

  latestDate.textContent =
    "最新交易日：—";
}


/* =========================================================
   START
========================================================= */

loadUIData();

</script>
