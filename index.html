<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>台股 AI 選股・零股定投</title>

  <style>
    :root {
      --bg: #080d16;
      --bg2: #0d1422;
      --card: #111a2a;
      --card2: #151f31;
      --border: #243149;

      --text: #e7edf7;
      --muted: #91a0b7;
      --muted2: #6f7d94;

      --blue: #38bdf8;
      --cyan: #22d3ee;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #f59e0b;
      --purple: #a855f7;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background: var(--bg);
    }

    body {
      background:
        radial-gradient(
          circle at top,
          #132038 0%,
          var(--bg) 42%
        );
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        "Noto Sans TC",
        sans-serif;

      min-height: 100vh;
      padding: 12px;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
    }

    /* ========================================================
       Header
       ======================================================== */

    .header {
      background: linear-gradient(
        145deg,
        #15243b,
        #0d1524
      );

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      margin-bottom: 12px;
      box-shadow:
        0 12px 35px rgba(0,0,0,.18);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: .3px;
      color: #fff;
    }

    .subtitle {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .market-pill {
      white-space: nowrap;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 11px;
      border: 1px solid var(--border);
      background: rgba(8,13,22,.65);
      color: var(--muted);
    }

    .market-pill.open {
      color: var(--green);
      border-color: rgba(34,197,94,.45);
    }

    .market-pill.closed {
      color: var(--muted);
    }

    /* ========================================================
       Navigation
       ======================================================== */

    .tabs {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 7px;
      margin-bottom: 12px;
    }

    .tab-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      border-radius: 10px;
      padding: 10px 6px;
      font-size: 13px;
      font-weight: 700;
    }

    .tab-btn.active {
      color: #fff;
      border-color: rgba(56,189,248,.55);
      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.18),
          rgba(34,211,238,.06)
        );
    }

    /* ========================================================
       Common Card
       ======================================================== */

    .card {
      background:
        linear-gradient(
          145deg,
          rgba(17,26,42,.98),
          rgba(12,19,31,.98)
        );

      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .section-title {
      font-size: 16px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 4px;
    }

    .section-subtitle {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .muted {
      color: var(--muted);
    }

    .small {
      font-size: 11px;
    }

    .empty {
      padding: 28px 15px;
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      border: 1px dashed var(--border);
      border-radius: 10px;
    }

    .error-box {
      background: rgba(239,68,68,.08);
      border: 1px solid rgba(239,68,68,.4);
      color: #fca5a5;
      border-radius: 12px;
      padding: 16px;
      line-height: 1.7;
      font-size: 13px;
    }

    .loading {
      padding: 40px 15px;
      text-align: center;
      color: var(--muted);
    }

    /* ========================================================
       Overview
       ======================================================== */

    .summary-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0, 1fr));

      gap: 8px;
      margin-bottom: 12px;
    }

    .summary-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
      min-width: 0;
    }

    .summary-label {
      color: var(--muted);
      font-size: 11px;
      margin-bottom: 5px;
    }

    .summary-value {
      color: #fff;
      font-size: 19px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .summary-note {
      color: var(--muted2);
      font-size: 10px;
      margin-top: 4px;
    }

    .market-index {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 13px;
    }

    .index-name {
      font-size: 12px;
      color: var(--muted);
    }

    .index-value {
      margin-top: 4px;
      font-size: 22px;
      font-weight: 800;
    }

    .index-change {
      text-align: right;
      font-size: 13px;
      font-weight: 700;
    }

    .market-sentiment {
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 9px;
      background: rgba(56,189,248,.06);
      border: 1px solid rgba(56,189,248,.18);
      font-size: 12px;
      color: var(--muted);
    }

    /* ========================================================
       Pick cards
       ======================================================== */

    .pick-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 10px;
    }

    .pick-card {
      background: var(--card2);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px;
    }

    .pick-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .pick-name {
      font-weight: 800;
      color: #fff;
      font-size: 15px;
    }

    .pick-symbol {
      color: var(--muted);
      font-size: 10px;
      margin-top: 3px;
    }

    .price {
      font-size: 17px;
      font-weight: 800;
      white-space: nowrap;
    }

    .pick-meta {
      margin-top: 10px;
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 6px;
    }

    .mini-metric {
      background: #0b1220;
      border-radius: 7px;
      padding: 7px;
    }

    .mini-label {
      color: var(--muted2);
      font-size: 10px;
    }

    .mini-value {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      margin-top: 2px;
    }

    /* ========================================================
       Stock Card
       ======================================================== */

    .stock-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 10px;
    }

    .stock-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .stock-title {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 7px;
    }

    .stock-name {
      font-size: 17px;
      font-weight: 800;
      color: #fff;
    }

    .stock-symbol {
      font-size: 11px;
      color: var(--muted);
    }

    .stock-category {
      color: var(--muted);
      font-size: 10px;
      margin-top: 4px;
    }

    .stock-price {
      font-size: 19px;
      font-weight: 800;
      white-space: nowrap;
    }

    .stock-change {
      font-size: 11px;
      margin-top: 2px;
      text-align: right;
    }

    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 10px;
      font-weight: 800;
      white-space: nowrap;
      border: 1px solid var(--border);
    }

    .badge-strong {
      color: var(--green);
      border-color: rgba(34,197,94,.4);
      background: rgba(34,197,94,.08);
    }

    .badge-neutral {
      color: var(--muted);
      background: rgba(148,163,184,.07);
    }

    .badge-weak {
      color: var(--yellow);
      border-color: rgba(245,158,11,.4);
      background: rgba(245,158,11,.08);
    }

    .badge-danger {
      color: var(--red);
      border-color: rgba(239,68,68,.4);
      background: rgba(239,68,68,.08);
    }

    .recommendation {
      margin-top: 10px;
      padding: 9px 10px;
      border-radius: 8px;
      background: #0b1220;
      border: 1px solid var(--border);
      color: #dbeafe;
      font-size: 12px;
      font-weight: 700;
    }

    /* ========================================================
       Metric Grid
       ======================================================== */

    .metric-grid {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 7px;
      margin-top: 11px;
    }

    .metric {
      background: #0b1220;
      border: 1px solid rgba(36,49,73,.75);
      border-radius: 8px;
      padding: 8px;
      min-width: 0;
    }

    .metric-label {
      color: var(--muted2);
      font-size: 10px;
      white-space: nowrap;
    }

    .metric-value {
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
      margin-top: 3px;
      overflow-wrap: anywhere;
    }

    /* ========================================================
       Expand details
       ======================================================== */

    details {
      margin-top: 10px;
      border-top: 1px dashed var(--border);
      padding-top: 9px;
    }

    summary {
      cursor: pointer;
      color: var(--blue);
      font-size: 12px;
      font-weight: 700;
      user-select: none;
    }

    .detail-section {
      margin-top: 10px;
    }

    .detail-title {
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      margin-bottom: 6px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 6px;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 8px;
      background: #0b1220;
      border-radius: 6px;
      font-size: 11px;
    }

    .detail-item span:first-child {
      color: var(--muted);
    }

    .detail-item span:last-child {
      color: var(--text);
      font-weight: 700;
      text-align: right;
    }

    /* ========================================================
       DCA
       ======================================================== */

    .dca-box {
      margin-top: 10px;
      background:
        linear-gradient(
          135deg,
          rgba(56,189,248,.07),
          rgba(168,85,247,.04)
        );

      border: 1px solid rgba(56,189,248,.16);
      border-radius: 10px;
      padding: 11px;
    }

    .dca-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .dca-action {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
    }

    .dca-level {
      color: var(--blue);
      font-size: 11px;
    }

    .dca-grid {
      display: grid;
      grid-template-columns:
        repeat(3, minmax(0,1fr));

      gap: 6px;
      margin-top: 8px;
    }

    .dca-item {
      background: rgba(8,13,22,.5);
      border-radius: 7px;
      padding: 7px;
    }

    .dca-label {
      color: var(--muted2);
      font-size: 9px;
    }

    .dca-value {
      margin-top: 3px;
      font-size: 11px;
      font-weight: 700;
    }

    /* ========================================================
       Holding
       ======================================================== */

    .holding {
      margin-top: 11px;
      padding-top: 11px;
      border-top: 1px dashed var(--border);
    }

    .holding-grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0,1fr));

      gap: 8px;
    }

    .input-group label {
      display: block;
      color: var(--muted);
      font-size: 10px;
      margin-bottom: 4px;
    }

    .input-group input {
      width: 100%;
      background: #080d16;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 8px;
      text-align: right;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--blue);
    }

    .roi {
      margin-top: 8px;
      background: #080d16;
      border-radius: 8px;
      padding: 9px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 11px;
    }

    /* ========================================================
       Search
       ======================================================== */

    .search-box {
      display: flex;
      gap: 7px;
      margin-bottom: 10px;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      background: #080d16;
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      outline: none;
    }

    .search-box button {
      border: 1px solid var(--border);
      background: #182338;
      color: #fff;
      border-radius: 8px;
      padding: 0 13px;
    }

    .search-results {
      display: grid;
      gap: 7px;
    }

    .search-result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #0b1220;
    }

    .search-result-name {
      font-size: 12px;
      font-weight: 700;
    }

    .search-result-symbol {
      color: var(--muted);
      font-size: 10px;
    }

    .small-btn {
      border: 1px solid var(--blue);
      color: var(--blue);
      background: transparent;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 10px;
    }

    .danger-btn {
      border-color: rgba(239,68,68,.5);
      color: #fca5a5;
    }

    /* ========================================================
       Footer
       ======================================================== */

    .footer {
      text-align: center;
      color: var(--muted2);
      font-size: 10px;
      padding: 15px 0 8px;
      line-height: 1.6;
    }

    /* ========================================================
       Colors
       ======================================================== */

    .up {
      color: var(--red);
    }

    .down {
      color: var(--green);
    }

    .flat {
      color: var(--muted);
    }

    /* ========================================================
       Responsive
       ======================================================== */

    @media (max-width: 800px) {

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .metric-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .pick-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {

      body {
        padding: 8px;
      }

      .header {
        padding: 14px;
      }

      .title {
        font-size: 19px;
      }

      .tabs {
        grid-template-columns:
          repeat(4, minmax(0,1fr));
      }

      .tab-btn {
        font-size: 11px;
        padding: 9px 3px;
      }

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .metric-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .dca-grid {
        grid-template-columns:
          repeat(2, minmax(0,1fr));
      }

      .stock-head {
        align-items: flex-start;
      }

      .stock-name {
        font-size: 16px;
      }

      .stock-price {
        font-size: 17px;
      }

      .holding-grid {
        grid-template-columns: 1fr;
      }

      .detail-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ======================================================
       HEADER
       ====================================================== -->

  <header class="header">

    <div class="header-top">

      <div>
        <div class="title">
          台股 AI 選股・零股定投
        </div>

        <div class="subtitle">
          AI 市場分析・短線選股・零股定投・動態風控
        </div>
      </div>

      <div
        id="market-pill"
        class="market-pill"
      >
        載入中
      </div>

    </div>

    <div
      id="data-status"
      class="subtitle"
      style="margin-top:10px;"
    >
      正在載入儀表板資料...
    </div>

  </header>


  <!-- ======================================================
       NAV
       ====================================================== -->

  <nav class="tabs">

    <button
      class="tab-btn active"
      data-tab="overview"
      onclick="switchTab('overview')"
    >
      總覽
    </button>

    <button
      class="tab-btn"
      data-tab="short"
      onclick="switchTab('short')"
    >
      短期選股
    </button>

    <button
      class="tab-btn"
      data-tab="dca"
      onclick="switchTab('dca')"
    >
      零股定投
    </button>

    <button
      class="tab-btn"
      data-tab="stocks"
      onclick="switchTab('stocks')"
    >
      股票清單
    </button>

  </nav>


  <!-- ======================================================
       MAIN
       ====================================================== -->

  <main id="app-content">

    <div class="loading">
      ⏳ 正在載入資料...
    </div>

  </main>


  <footer class="footer">

    <div>
      資料來源：
      analysis.json →
      build_ui_data.py →
      ui_data.json
    </div>

    <div>
      前端不重新計算後端技術指標
    </div>

  </footer>

</div>


<script>
"use strict";

/* ============================================================
   Configuration
   ============================================================ */

const UI_DATA_PATHS = [
  "./Data/ui_data.json",
  "./data/ui_data.json"
];

const MONTHLY_BUDGET = 6000;

let UI_DATA = null;
let CURRENT_TAB = "overview";

let customWatchlist = loadWatchlist();


/* ============================================================
   Basic Helpers
   ============================================================ */

function esc(value) {

  return String(value ?? "")
    .replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#039;"
    }[character]));

}


function num(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function fmt(
  value,
  digits = 2
) {

  const n = num(value);

  if (n === null) {
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );

}


function fmtInteger(value) {

  const n = num(value);

  if (n === null) {
    return "--";
  }

  return Math.round(n)
    .toLocaleString("zh-TW");

}


function fmtPct(value) {

  const n = num(value);

  if (n === null) {
    return "--";
  }

  return `${n >= 0 ? "+" : ""}${n.toFixed(2)}%`;

}


function changeClass(value) {

  const n = num(value);

  if (n === null || n === 0) {
    return "flat";
  }

  return n > 0
    ? "up"
    : "down";

}


function safeArray(value) {

  return Array.isArray(value)
    ? value
    : [];

}


function getStock(symbol) {

  if (
    !UI_DATA ||
    !UI_DATA.stocks
  ) {
    return null;
  }

  return UI_DATA.stocks[symbol] || null;

}


function getBackend(stock) {

  return (
    stock &&
    stock.backend &&
    typeof stock.backend === "object"
  )
    ? stock.backend
    : {};

}


function getIndicators(stock) {

  const backend =
    getBackend(stock);

  return (
    backend.indicators &&
    typeof backend.indicators === "object"
  )
    ? backend.indicators
    : {};

}


function getShortTerm(stock) {

  const backend =
    getBackend(stock);

  return (
    backend.short_term &&
    typeof backend.short_term === "object"
  )
    ? backend.short_term
    : {};

}


function getDca(stock) {

  const backend =
    getBackend(stock);

  return (
    backend.dca &&
    typeof backend.dca === "object"
  )
    ? backend.dca
    : {};

}


function getChip(stock) {

  const backend =
    getBackend(stock);

  return (
    backend.chip &&
    typeof backend.chip === "object"
  )
    ? backend.chip
    : {};

}


/* ============================================================
   Local Watchlist
   ============================================================ */

function loadWatchlist() {

  try {

    const raw =
      localStorage.getItem(
        "tw_ai_watchlist"
      );

    const parsed =
      JSON.parse(raw || "[]");

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    return [];

  }

}


function saveWatchlist() {

  localStorage.setItem(
    "tw_ai_watchlist",
    JSON.stringify(customWatchlist)
  );

}


function isWatched(symbol) {

  return customWatchlist.includes(
    symbol
  );

}


function toggleWatchlist(symbol) {

  if (isWatched(symbol)) {

    customWatchlist =
      customWatchlist.filter(
        item => item !== symbol
      );

  } else {

    customWatchlist.push(symbol);

  }

  saveWatchlist();

  renderCurrentTab();

}


/* ============================================================
   Holding Storage
   ============================================================ */

function holdingKey(
  symbol,
  field
) {

  return `tw_ai_holding_${field}_${symbol}`;

}


function getHolding(symbol) {

  const shares =
    num(
      localStorage.getItem(
        holdingKey(symbol, "shares")
      )
    );

  const cost =
    num(
      localStorage.getItem(
        holdingKey(symbol, "cost")
      )
    );

  return {

    shares:
      shares && shares > 0
        ? shares
        : null,

    average_cost:
      cost && cost > 0
        ? cost
        : null

  };

}


function saveHolding(
  symbol
) {

  const sharesInput =
    document.getElementById(
      `shares-${cssSafe(symbol)}`
    );

  const costInput =
    document.getElementById(
      `cost-${cssSafe(symbol)}`
    );

  const shares =
    num(sharesInput?.value);

  const cost =
    num(costInput?.value);

  if (
    shares !== null &&
    shares > 0
  ) {

    localStorage.setItem(
      holdingKey(symbol, "shares"),
      shares
    );

  } else {

    localStorage.removeItem(
      holdingKey(symbol, "shares")
    );

  }

  if (
    cost !== null &&
    cost > 0
  ) {

    localStorage.setItem(
      holdingKey(symbol, "cost"),
      cost
    );

  } else {

    localStorage.removeItem(
      holdingKey(symbol, "cost")
    );

  }

  updatePortfolioSummary();

  updateStockROI(symbol);

}


function cssSafe(symbol) {

  return String(symbol)
    .replace(/[^a-zA-Z0-9_-]/g, "_");

}


/* ============================================================
   Portfolio
   ============================================================ */

function getCurrentPrice(stock) {

  return num(
    stock?.price
  );

}


function calculatePortfolio() {

  let totalValue = 0;
  let totalCost = 0;

  if (
    !UI_DATA ||
    !UI_DATA.stocks
  ) {

    return {
      totalValue: 0,
      totalCost: 0,
      profit: 0,
      returnPct: null,
      hasHoldings: false
    };

  }

  Object.values(
    UI_DATA.stocks
  ).forEach(stock => {

    const holding =
      getHolding(stock.symbol);

    const price =
      getCurrentPrice(stock);

    if (
      !holding.shares ||
      !holding.average_cost ||
      !price
    ) {
      return;
    }

    totalValue +=
      holding.shares * price;

    totalCost +=
      holding.shares *
      holding.average_cost;

  });

  const profit =
    totalValue - totalCost;

  const returnPct =
    totalCost > 0
      ? profit / totalCost * 100
      : null;

  return {

    totalValue,
    totalCost,
    profit,
    returnPct,

    hasHoldings:
      totalCost > 0

  };

}


function updatePortfolioSummary() {

  const portfolio =
    calculatePortfolio();

  const value =
    document.getElementById(
      "portfolio-total-value"
    );

  const profit =
    document.getElementById(
      "portfolio-profit"
    );

  const count =
    document.getElementById(
      "portfolio-holding-count"
    );

  if (!value) {
    return;
  }

  value.textContent =
    portfolio.hasHoldings
      ? fmtInteger(
          portfolio.totalValue
        )
      : "--";

  if (profit) {

    if (
      !portfolio.hasHoldings
    ) {

      profit.textContent =
        "--";

      profit.className =
        "summary-value flat";

    } else {

      profit.textContent =
        `${portfolio.profit >= 0 ? "+" : ""}${fmtInteger(portfolio.profit)} (${fmtPct(portfolio.returnPct)})`;

      profit.className =
        `summary-value ${changeClass(portfolio.profit)}`;

    }

  }

  if (count) {

    let holdingCount = 0;

    Object.keys(
      UI_DATA?.stocks || {}
    ).forEach(symbol => {

      const holding =
        getHolding(symbol);

      if (
        holding.shares &&
        holding.average_cost
      ) {

        holdingCount++;

      }

    });

    count.textContent =
      `${holdingCount} 檔`;

  }

}


function updateStockROI(symbol) {

  const element =
    document.getElementById(
      `roi-${cssSafe(symbol)}`
    );

  if (!element) {
    return;
  }

  const stock =
    getStock(symbol);

  const holding =
    getHolding(symbol);

  const price =
    getCurrentPrice(stock);

  if (
    !holding.shares ||
    !holding.average_cost ||
    !price
  ) {

    element.innerHTML =
      `<span>未實現損益：</span><b>--</b>`;

    return;

  }

  const profit =
    (
      price -
      holding.average_cost
    ) * holding.shares;

  const pct =
    (
      price -
      holding.average_cost
    ) /
    holding.average_cost *
    100;

  const cls =
    changeClass(profit);

  element.innerHTML = `
    <span>未實現損益：</span>
    <b class="${cls}">
      ${profit >= 0 ? "+" : ""}${fmtInteger(profit)}
      (${fmtPct(pct)})
    </b>
  `;

}


/* ============================================================
   Data Loading
   ============================================================ */

async function loadUIData() {

  let lastError = null;

  for (
    const path of UI_DATA_PATHS
  ) {

    try {

      const response =
        await fetch(
          `${path}?t=${Date.now()}`,
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }

      const data =
        await response.json();

      if (
        !data ||
        typeof data !== "object"
      ) {

        throw new Error(
          "JSON 根節點格式錯誤"
        );

      }

      if (
        !data.stocks ||
        typeof data.stocks !== "object"
      ) {

        throw new Error(
          "ui_data.json 缺少 stocks"
        );

      }

      UI_DATA = data;

      return data;

    } catch (error) {

      lastError = error;

    }

  }

  throw lastError ||
    new Error(
      "ui_data.json 無法載入"
    );

}

    <div style="display:grid;gap:7px;">

      ${
        list
          .map(
            symbol => {

              const stock =
                getStock(symbol);

              if (!stock) {
                return "";
              }

              return `
                <div class="search-result">

                  <div>

                    <div class="search-result-name">
                      ${esc(stock.name)}
                    </div>

                    <div class="search-result-symbol">
                      ${esc(stock.symbol)}
                    </div>

                  </div>

                  <div
                    class="price ${changeClass(stock.change)}"
                  >
                    ${fmt(stock.price, 2)}
                  </div>

                </div>
              `;

            }
          )
          .join("")
      }

    </div>
  `;

}


/* ============================================================
   Detailed Stock Rendering
   ============================================================ */

function renderDetailedStocks(
  symbols
) {

  const list =
    safeArray(symbols)
      .map(
        symbol =>
          getStock(symbol)
      )
      .filter(Boolean);

  if (!list.length) {

    return `
      <div class="empty">
        目前沒有資料。
      </div>
    `;

  }

  return list
    .map(
      stock =>
        renderStockCard(
          stock,
          false
        )
    )
    .join("");

}

/* ============================================================
   Detail Helpers
   ============================================================ */

function detailItem(
  label,
  value
) {

  return `
    <div class="detail-item">

      <span>
        ${esc(label)}
      </span>

      <span>
        ${esc(value)}
      </span>

    </div>
  `;

}


function boolText(value) {

  if (
    value === true
  ) {
    return "是";
  }

  if (
    value === false
  ) {
    return "否";
  }

  return "--";

}


function strengthClass(
  strength
) {

  if (
    strength === "強勢"
  ) {
    return "badge-strong";
  }

  if (
    strength === "弱勢"
  ) {
    return "badge-weak";
  }

  return "badge-neutral";

}


/* ============================================================
   Tab Switching
   ============================================================ */

function switchTab(tab) {

  CURRENT_TAB =
    tab;

  document
    .querySelectorAll(
      ".tab-btn"
    )
    .forEach(button => {

      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );

    });

  renderCurrentTab();

}


function renderCurrentTab() {

  const content =
    document.getElementById(
      "app-content"
    );

  if (!content) {
    return;
  }

  if (!UI_DATA) {

    content.innerHTML = `
      <div class="error-box">
        無法載入儀表板資料。
      </div>
    `;

    return;

  }

  switch (CURRENT_TAB) {

    case "short":

      content.innerHTML =
        renderShortTab();

      break;


    case "dca":

      content.innerHTML =
        renderDcaTab();

      break;


    case "stocks":

      content.innerHTML =
        renderStocksTab();

      break;


    case "overview":

    default:

      content.innerHTML =
        renderOverview();

      break;

  }

  updatePortfolioSummary();

  refreshAllROI();

}


/* ============================================================
   ROI Refresh
   ============================================================ */

function refreshAllROI() {

  Object.keys(
    UI_DATA?.stocks || {}
  ).forEach(
    symbol =>
      updateStockROI(symbol)
  );

}


/* ============================================================
   Initialisation
   ============================================================ */

async function init() {

  const content =
    document.getElementById(
      "app-content"
    );

  try {

    content.innerHTML = `
      <div class="loading">
        ⏳ 正在載入 Data/ui_data.json...
      </div>
    `;

    await loadUIData();

    renderMarketStatus();

    document.getElementById(
      "data-status"
    ).textContent =
      `資料更新時間：${
        UI_DATA.generated_at || "--"
      }｜最新交易日：${
        UI_DATA.status?.latest_trading_date || "--"
      }`;

    renderCurrentTab();

  } catch (error) {

    console.error(
      "ui_data.json 載入失敗：",
      error
    );

    document.getElementById(
      "market-pill"
    ).textContent =
      "⚠️ 資料錯誤";

    document.getElementById(
      "market-pill"
    ).className =
      "market-pill closed";

    document.getElementById(
      "data-status"
    ).textContent =
      "無法載入儀表板資料";

    content.innerHTML = `

      <div class="error-box">

        <div
          style="
            font-size:16px;
            font-weight:800;
            margin-bottom:8px;
          "
        >
          無法載入儀表板資料
        </div>

        <div>
          HTTP / JSON 資料載入失敗。
        </div>

        <div
          style="
            margin-top:7px;
            color:#fecaca;
            font-size:11px;
          "
        >
          請確認：
          Data/ui_data.json
          是否已由 GitHub Actions 正常產生。
        </div>

        <button
          onclick="location.reload()"
          style="
            margin-top:12px;
            padding:8px 12px;
            border-radius:7px;
            border:1px solid rgba(239,68,68,.5);
            background:rgba(239,68,68,.1);
            color:#fca5a5;
          "
        >
          重新載入
        </button>

      </div>

    `;

  }

}


/* ============================================================
   Start
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
