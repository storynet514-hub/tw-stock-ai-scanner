<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股 AI 選股・零股定投 V4</title>

<style>

:root{
    --bg:#0b1020;
    --panel:#11182b;
    --panel2:#151e34;
    --card:#18233d;
    --border:rgba(255,255,255,.08);

    --text:#f5f7fb;
    --muted:#8f9bb3;

    --blue:#4da3ff;
    --green:#35d07f;
    --yellow:#ffc857;
    --red:#ff5d73;
    --purple:#9b7cff;

    --shadow:0 10px 30px rgba(0,0,0,.25);
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:
        radial-gradient(circle at top right,rgba(77,163,255,.12),transparent 35%),
        radial-gradient(circle at bottom left,rgba(155,124,255,.08),transparent 35%),
        var(--bg);

    color:var(--text);
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

    min-height:100vh;
}

button,
input{
    font:inherit;
}

button{
    cursor:pointer;
}

.container{
    width:min(1400px,94%);
    margin:auto;
}

/* =========================
   Header
========================= */

.header{
    padding:24px 0 16px;
}

.header-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:20px;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:14px;
}

.logo{
    width:52px;
    height:52px;
    border-radius:16px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(135deg,#4da3ff,#9b7cff);

    font-size:25px;
    box-shadow:0 8px 25px rgba(77,163,255,.25);
}

.title{
    font-size:24px;
    font-weight:800;
}

.subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:4px;
}

.status{
    display:flex;
    align-items:center;
    gap:8px;

    padding:9px 14px;
    border:1px solid var(--border);
    border-radius:999px;

    background:rgba(255,255,255,.03);

    font-size:13px;
}

.status-dot{
    width:8px;
    height:8px;
    border-radius:50%;
    background:var(--green);
    box-shadow:0 0 10px var(--green);
}

/* =========================
   Navigation
========================= */

.nav{
    display:flex;
    gap:8px;
    margin:12px 0 20px;

    overflow-x:auto;
    padding-bottom:3px;
}

.nav button{
    white-space:nowrap;

    border:1px solid var(--border);
    background:rgba(255,255,255,.03);
    color:var(--muted);

    padding:10px 16px;
    border-radius:12px;
}

.nav button.active{
    color:white;
    border-color:rgba(77,163,255,.4);
    background:rgba(77,163,255,.12);
}

/* =========================
   Search
========================= */

.search-panel{
    background:linear-gradient(
        135deg,
        rgba(77,163,255,.12),
        rgba(155,124,255,.08)
    );

    border:1px solid var(--border);
    border-radius:20px;

    padding:20px;

    box-shadow:var(--shadow);

    margin-bottom:20px;
}

.search-title{
    font-size:17px;
    font-weight:700;
    margin-bottom:12px;
}

.search-row{
    display:flex;
    gap:10px;
}

.search-input{
    flex:1;

    background:rgba(0,0,0,.22);
    border:1px solid var(--border);

    color:white;

    padding:13px 15px;

    border-radius:12px;

    outline:none;
}

.search-input:focus{
    border-color:rgba(77,163,255,.6);
}

.primary-btn{
    border:none;

    color:white;

    padding:12px 18px;

    border-radius:12px;

    background:linear-gradient(
        135deg,
        #348ff7,
        #7565e8
    );

    font-weight:700;

    box-shadow:0 8px 20px rgba(77,163,255,.2);
}

.secondary-btn{
    border:1px solid var(--border);

    color:white;

    background:rgba(255,255,255,.05);

    padding:9px 13px;

    border-radius:10px;
}

/* =========================
   Stats
========================= */

.stats{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:14px;

    margin-bottom:20px;
}

.stat{
    background:var(--panel);

    border:1px solid var(--border);

    border-radius:18px;

    padding:18px;

    box-shadow:var(--shadow);
}

.stat-label{
    color:var(--muted);
    font-size:13px;
}

.stat-value{
    font-size:28px;
    font-weight:800;

    margin-top:8px;
}

.stat-sub{
    color:var(--muted);
    font-size:12px;
    margin-top:5px;
}

/* =========================
   Section
========================= */

.section{
    margin:28px 0;
}

.section-header{
    display:flex;
    justify-content:space-between;
    align-items:center;

    margin-bottom:12px;
}

.section-title{
    font-size:20px;
    font-weight:800;
}

.section-description{
    color:var(--muted);
    font-size:13px;
}

/* =========================
   Watchlist
========================= */

.watchlist{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
}

.empty{
    grid-column:1/-1;

    padding:35px;

    text-align:center;

    color:var(--muted);

    border:1px dashed var(--border);
    border-radius:18px;
}

/* =========================
   Cards
========================= */

.card{
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.015)
        );

    border:1px solid var(--border);

    border-radius:18px;

    padding:17px;

    box-shadow:var(--shadow);

    transition:.2s;
}

.card:hover{
    transform:translateY(-2px);

    border-color:rgba(77,163,255,.3);
}

.card-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
}

.stock-id{
    font-size:12px;
    color:var(--muted);
}

.stock-name{
    font-size:19px;
    font-weight:800;
    margin-top:3px;
}

.price{
    font-size:26px;
    font-weight:800;
    margin-top:15px;
}

.change{
    font-size:13px;
    margin-top:3px;
}

.up{
    color:var(--green);
}

.down{
    color:var(--red);
}

.neutral{
    color:var(--muted);
}

/* =========================
   Signal
========================= */

.signal{
    padding:6px 10px;

    border-radius:999px;

    font-size:12px;
    font-weight:700;
}

.signal-strong{
    background:rgba(53,208,127,.14);
    color:var(--green);
}

.signal-watch{
    background:rgba(255,200,87,.14);
    color:var(--yellow);
}

.signal-weak{
    background:rgba(255,93,115,.14);
    color:var(--red);
}

/* =========================
   Score
========================= */

.score-box{
    margin-top:15px;
}

.score-header{
    display:flex;
    justify-content:space-between;

    font-size:12px;
    color:var(--muted);
}

.score{
    color:white;
    font-weight:800;
}

.progress{
    height:7px;

    background:rgba(255,255,255,.06);

    border-radius:999px;

    overflow:hidden;

    margin-top:7px;
}

.progress-bar{
    height:100%;

    border-radius:999px;

    background:linear-gradient(
        90deg,
        #348ff7,
        #9b7cff
    );
}

/* =========================
   Metrics
========================= */

.metrics{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;

    margin-top:15px;
}

.metric{
    background:rgba(0,0,0,.15);

    border-radius:10px;

    padding:9px;
}

.metric-label{
    color:var(--muted);
    font-size:10px;
}

.metric-value{
    font-size:13px;
    font-weight:700;
    margin-top:3px;
}

/* =========================
   Conditions
========================= */

.conditions{
    display:flex;
    flex-wrap:wrap;
    gap:6px;

    margin-top:13px;
}

.condition{
    font-size:10px;

    padding:5px 8px;

    border-radius:8px;

    background:rgba(255,255,255,.05);

    color:var(--muted);
}

.condition.ok{
    color:var(--green);
    background:rgba(53,208,127,.08);
}

.condition.no{
    color:var(--red);
    background:rgba(255,93,115,.06);
}

/* =========================
   DCA / Risk
========================= */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:8px;

    margin-top:14px;
}

.info-box{
    padding:11px;

    border-radius:11px;

    background:rgba(0,0,0,.14);
}

.info-title{
    font-size:10px;
    color:var(--muted);
}

.info-value{
    margin-top:4px;
    font-weight:700;
    font-size:13px;
}

/* =========================
   Win Rate
========================= */

.winrate{
    display:grid;
    grid-template-columns:repeat(3,1fr);

    gap:8px;

    margin-top:14px;
}

.win{
    text-align:center;

    background:rgba(77,163,255,.06);

    border-radius:11px;

    padding:10px;
}

.win-label{
    color:var(--muted);
    font-size:10px;
}

.win-value{
    font-size:17px;
    font-weight:800;

    margin-top:4px;
}

/* =========================
   Ranking
========================= */

.ranking{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.rank-row{
    display:flex;
    align-items:center;
    gap:12px;

    background:var(--panel);

    border:1px solid var(--border);

    padding:14px;

    border-radius:14px;
}

.rank-number{
    width:34px;
    height:34px;

    border-radius:10px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(77,163,255,.1);

    font-weight:800;
}

.rank-info{
    flex:1;
}

.rank-stock{
    font-weight:700;
}

.rank-score{
    font-size:13px;
    color:var(--muted);
}

/* =========================
   Modal
========================= */

.modal{
    position:fixed;
    inset:0;

    display:none;

    align-items:center;
    justify-content:center;

    background:rgba(0,0,0,.65);

    z-index:1000;

    padding:20px;
}

.modal.show{
    display:flex;
}

.modal-box{
    width:min(620px,100%);

    max-height:90vh;

    overflow:auto;

    background:#11182b;

    border:1px solid var(--border);

    border-radius:22px;

    padding:22px;

    box-shadow:0 25px 80px rgba(0,0,0,.5);
}

.modal-header{
    display:flex;
    justify-content:space-between;

    align-items:center;

    margin-bottom:15px;
}

.close{
    border:none;

    background:rgba(255,255,255,.05);

    color:white;

    width:34px;
    height:34px;

    border-radius:10px;
}

/* =========================
   Footer
========================= */

.footer{
    text-align:center;

    color:var(--muted);

    font-size:11px;

    padding:35px 0 50px;
}

/* =========================
   Mobile
========================= */

@media(max-width:1000px){

    .stats{
        grid-template-columns:repeat(3,1fr);
    }

    .watchlist{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:700px){

    .container{
        width:92%;
    }

    .header-top{
        align-items:flex-start;
    }

    .title{
        font-size:20px;
    }

    .logo{
        width:44px;
        height:44px;
    }

    .status{
        font-size:11px;
        padding:7px 9px;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .stat-value{
        font-size:23px;
    }

    .watchlist{
        grid-template-columns:1fr;
    }

    .ranking{
        grid-template-columns:1fr;
    }

    .search-row{
        flex-direction:column;
    }

    .primary-btn{
        width:100%;
    }

    .metrics{
        grid-template-columns:repeat(2,1fr);
    }

}

</style>
</head>

<body>

<div class="container">

<header class="header">

    <div class="header-top">

            <div class="logo">
                📊
            </div>

                </div>

<script>

/* =========================================================
   V4 台股 AI 儀表板
========================================================= */

let stockData = [];
let watchlist = [];

const DATA_URL =
    "./Data/prices.json";

const WATCH_KEY =
    "tw_stock_ai_watchlist_v4";


/* =========================================================
   初始化
========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadWatchlist();

        loadData();

        setupNavigation();

        document
            .getElementById("searchInput")
            .addEventListener(
                "keydown",
                event => {

                    if(event.key === "Enter"){
                        searchStock();
                    }

                }
            );

    }
);


/* =========================================================
   載入資料
========================================================= */

async function loadData(){

    const status =
        document.getElementById(
            "systemStatus"
        );

    try{

        const response =
            await fetch(
                DATA_URL + "?t=" + Date.now()
            );

        if(!response.ok){
            throw new Error(
                "Data/prices.json 無法讀取"
            );
        }

        const data =
            await response.json();

        stockData =
            Array.isArray(data.stocks)
                ? data.stocks
                : [];

        status.textContent =
            "資料已更新";

        updateStatistics(data);

        renderDashboard();

        renderWatchlist();

        renderRanking();

        renderRisk();

        const generated =
            data.system &&
            data.system.generated_at
                ? data.system.generated_at
                : "";

        document.getElementById(
            "updateTime"
        ).textContent =
            generated
                ? "最後更新：" + formatDate(generated)
                : "資料已載入";

    }catch(error){

        console.error(error);

        status.textContent =
            "資料讀取失敗";

        document.getElementById(
            "topStocks"
        ).innerHTML = `
            <div class="empty">
                ❌ 無法讀取 Data/prices.json<br><br>
                請確認 GitHub Pages 已完成部署，
                並確認檔案位於 Data/prices.json。
            </div>
        `;

    }

}


/* =========================================================
   統計
========================================================= */

function updateStatistics(data){

    const stats =
        data.statistics || {};

    document.getElementById(
        "totalStocks"
    ).textContent =
        stats.total_stocks ??
        stockData.length;

    document.getElementById(
        "coreStocks"
    ).textContent =
        stats.core_stocks ?? 0;

    document.getElementById(
        "macdCount"
    ).textContent =
        stats.macd_golden ?? 0;

    document.getElementById(
        "rsiCount"
    ).textContent =
        stats.rsi_above_50 ?? 0;

    updateWatchCount();

}


/* =========================================================
   Dashboard
========================================================= */

function renderDashboard(){

    const container =
        document.getElementById(
            "topStocks"
        );

    if(!stockData.length){

        container.innerHTML =
            `<div class="empty">
                尚無股票資料
            </div>`;

        return;
    }

    const sorted =
        [...stockData]
        .sort(
            (a,b) =>
                getScore(b) -
                getScore(a)
        )
        .slice(0,9);

    container.innerHTML =
        sorted
        .map(stockCard)
        .join("");

}


/* =========================================================
   股票卡片
========================================================= */

function stockCard(stock){

    const price =
        stock.price || {};

    const tech =
        stock.technical || {};

    const cond =
        stock.conditions || {};

    const short =
        stock.short_term || {};

    const dca =
        stock.dca || {};

    const risk =
        stock.risk_control || {};

    const score =
        Number(short.score || 0);

    const signal =
        short.signal ||
        "觀察";

    const change =
        Number(
            price.change_percent || 0
        );

    const changeClass =
        change > 0
            ? "up"
            : change < 0
                ? "down"
                : "neutral";

    const signalClass =
        signal.includes("強勢")

/* =========================================================
   條件
========================================================= */

function condition(label,value){

    return `
        <span class="condition ${value ? "ok" : "no"}">
            ${value ? "✓" : "×"} ${label}
        </span>
    `;

}


/* =========================================================
   勝率
========================================================= */

function renderWinRate(stock){

    const win =
        stock.win_rate ||
        stock.winrate ||
        stock.statistics?.win_rate ||
        {};

    const d30 =
        win["30"] ??
        win["30d"] ??
        win["30_day"] ??
        null;

    const d60 =
        win["60"] ??
        win["60d"] ??
        win["60_day"] ??
        null;

    const d90 =
        win["90"] ??
        win["90d"] ??
        win["90_day"] ??
        null;

    return `

        <div class="winrate">

            <div class="win">

                <div class="win-label">
                    30日勝率
                </div>

                <div class="win-value">
                    ${formatPercent(d30)}
                </div>

            </div>


            <div class="win">

                <div class="win-label">
                    60日勝率
                </div>

                <div class="win-value">
                    ${formatPercent(d60)}
                </div>

            </div>


            <div class="win">

                <div class="win-label">
                    90日勝率
                </div>

                <div class="win-value">
                    ${formatPercent(d90)}
                </div>

            </div>

        </div>

    `;

}


/* =========================================================
   觀察清單
========================================================= */

function loadWatchlist(){

    try{

        const saved =
            localStorage.getItem(
                WATCH_KEY
            );

        watchlist =
            saved
                ? JSON.parse(saved)
                : [];

        if(!Array.isArray(watchlist)){
            watchlist = [];
        }

    }catch(error){

        watchlist = [];

    }

}


function saveWatchlist(){

    localStorage.setItem(
        WATCH_KEY,
        JSON.stringify(watchlist)
    );

    updateWatchCount();

}


function toggleWatch(id){

    id = String(id);

    const index =
        watchlist.indexOf(id);

    if(index >= 0){

        watchlist.splice(
            index,
            1
        );

    }else{

        watchlist.push(id);

    }

    saveWatchlist();

    renderDashboard();

    renderWatchlist();

}


function renderWatchlist(){

    const container =
        document.getElementById(
            "watchlist"
        );

    const stocks =
        watchlist
        .map(
            id =>
                stockData.find(
                    stock =>
                        String(stock.id) ===
                        String(id)
                )
        )
        .filter(Boolean);

    if(!stocks.length){

        container.innerHTML = `
            <div class="empty">

                ⭐ 目前還沒有觀察標的

                <br><br>

                在上方輸入股票代號，
                就可以加入自己的觀察清單。

            </div>
        `;

        return;

    }

    container.innerHTML =
        stocks
        .map(stockCard)
        .join("");

}


function clearWatchlist(){

    if(!watchlist.length){
        return;
    }

    if(
        !confirm(
            "確定要清空我的觀察清單嗎？"
        )
    ){
        return;
    }

    watchlist = [];

    saveWatchlist();

    renderWatchlist();

    renderDashboard();

}


/* =========================================================
   搜尋
========================================================= */

function searchStock(){

    const input =
        document
        .getElementById(
            "searchInput"
        );

    const keyword =
        input.value
        .trim()
        .toLowerCase();

    const result =
        document.getElementById(
            "searchResult"
        );

    if(!keyword){

        result.innerHTML =
            `<div class="section-description">
                請輸入股票代號或名稱
            </div>`;

        return;

    }

    const matches =
        stockData.filter(
            stock => {

                const id =
                    String(
                        stock.id || ""
                    ).toLowerCase();

                const name =
                    String(
                        stock.name || ""
                    ).toLowerCase();

                return (
                    id.includes(keyword) ||
                    name.includes(keyword)
                );

            }
        );

    if(!matches.length){

        result.innerHTML = `
            <div class="empty">
                找不到「${escapeHtml(keyword)}」
                <br><br>
                目前只能搜尋 fetch_data.py
                已經抓取到的個股與ETF。
            </div>
        `;

        return;

    }

    result.innerHTML =
        matches
        .slice(0,10)
        .map(
            stock => {

                const id =
                    String(stock.id);

                const exists =
                    watchlist.includes(id);

                return `

                <div
                    style="
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:10px;
                        padding:12px;
                        margin-top:8px;
                        background:rgba(0,0,0,.16);
                        border:1px solid var(--border);
                        border-radius:12px;
                    "
                >

                    <div>

                        <strong>
                            ${escapeHtml(id)}
                        </strong>

                        <span
                            style="
                                color:var(--muted);
                                margin-left:8px;
                            "
                        >
                            ${escapeHtml(
                                stock.name || ""
                            )}
                        </span>

                    </div>


                    <button
                        class="primary-btn"
                        onclick="toggleWatch('${escapeJs(id)}'); searchStock();"
                    >
                        ${exists ? "已加入" : "＋加入觀察"}
                    </button>

                </div>

                `;

            }
        )
        .join("");

}

/* =========================================================
   Navigation
========================================================= */

function setupNavigation(){

    const buttons =
        document.querySelectorAll(
            ".nav button"
        );

    buttons.forEach(button => {

        button.addEventListener(
            "click",
            () => {

                buttons.forEach(
                    b =>
                        b.classList.remove(
                            "active"
                        )
                );

                button.classList.add(
                    "active"
                );

                showTab(
                    button.dataset.tab
                );

            }
        );

    });

}


function showTab(tab){

    const tabs = [
        "dashboard",
        "watchlist",
        "ranking",
        "risk"
    ];

    tabs.forEach(name => {

        const element =
            document.getElementById(
                name + "Tab"
            );

        if(element){

            element.style.display =
                name === tab
                    ? "block"
                    : "none";

        }

    });

}


/* =========================================================
   Utility
========================================================= */

function getScore(stock){

    return Number(
        stock.short_term?.score || 0
    );

}


function updateWatchCount(){

    document.getElementById(
        "watchCount"
    ).textContent =
        watchlist.length;

}


function formatPrice(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(Number(value))
    ){
        return "--";
    }

    return Number(value)
        .toLocaleString(
            "zh-TW",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        );

}


function formatNumber(value,digits=2){

    if(
        value === null ||
        value === undefined ||
        isNaN(Number(value))
    ){
        return "--";
    }

    return Number(value)
        .toLocaleString(
            "zh-TW",
            {
                minimumFractionDigits:digits,
                maximumFractionDigits:digits
            }
        );

}


function formatPercent(value){

    if(
        value === null ||
        value === undefined ||
        isNaN(Number(value))
    ){
        return "--";
    }

    let number =
        Number(value);

    if(
        Math.abs(number) <= 1
    ){
        number *= 100;
    }

    return (
        number.toFixed(1) +
        "%"
    );

}


function formatDate(value){

    try{

        return new Date(value)
            .toLocaleString(
                "zh-TW"
            );

    }catch(error){

        return value;

    }

}


function escapeHtml(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeJs(value){

    return String(
        value ?? ""
    )
    .replace(
        /\\/g,
        "\\\\"
    )
    .replace(
        /'/g,
        "\\'"
    );

}
