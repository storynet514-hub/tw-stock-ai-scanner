<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0f19">
<title>台股 AI 選股・零股定投</title>

<style>
:root{
  --bg:#0b0f19;
  --card:#151c2c;
  --card2:#101827;
  --border:#263247;
  --text:#e5e7eb;
  --sub:#94a3b8;
  --blue:#38bdf8;
  --green:#22c55e;
  --red:#ef4444;
  --yellow:#f59e0b;
  --purple:#a855f7;
  --gray:#64748b;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",
    "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
}

body{
  min-height:100vh;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(100%,760px);
  margin:0 auto;
  padding:16px 14px 40px;
}

/* =========================================================
   HEADER
========================================================= */

.header{
  margin-bottom:14px;
}

.brand{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}

.brand-title{
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.brand-sub{
  margin-top:5px;
  color:var(--sub);
  font-size:12px;
}

.status{
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:6px 9px;
  border:1px solid var(--border);
  border-radius:999px;
  font-size:11px;
  white-space:nowrap;
}

.status-dot{
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--gray);
}

.status.ok .status-dot{
  background:var(--green);
}

.status.warn .status-dot{
  background:var(--yellow);
}

.status.error .status-dot{
  background:var(--red);
}

/* =========================================================
   MARKET SUMMARY
========================================================= */

.market-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:15px;
  margin-bottom:14px;
}

.market-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}

.market-name{
  font-size:15px;
  font-weight:700;
}

.market-date{
  color:var(--sub);
  font-size:11px;
  margin-top:4px;
}

.market-status{
  font-size:12px;
  color:var(--sub);
}

.market-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-top:13px;
}

.market-metric{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:11px;
}

.metric-label{
  color:var(--sub);
  font-size:11px;
}

.metric-value{
  margin-top:5px;
  font-size:18px;
  font-weight:800;
}

.market-index-up{
  color:var(--red);
}

.market-index-down{
  color:var(--green);
}

.sentiment-strong{
  color:var(--red);
}

.sentiment-weak{
  color:var(--green);
}

.sentiment-neutral{
  color:var(--yellow);
}

/* =========================================================
   SEARCH
========================================================= */

.search-wrap{
  margin-bottom:14px;
}

.search{
  width:100%;
  padding:12px 13px;
  border:1px solid var(--border);
  border-radius:12px;
  background:var(--card);
  color:var(--text);
  outline:none;
}

.search::placeholder{
  color:#64748b;
}

.search:focus{
  border-color:var(--blue);
}

.search-result{
  margin-top:8px;
  display:none;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:12px;
  overflow:hidden;
}

.search-result.show{
  display:block;
}

.search-item{
  width:100%;
  border:0;
  border-bottom:1px solid var(--border);
  background:transparent;
  color:var(--text);
  text-align:left;
  padding:11px 13px;
}

.search-item:last-child{
  border-bottom:0;
}

.search-item:hover{
  background:var(--card2);
}

.search-symbol{
  font-weight:800;
}

.search-name{
  color:var(--sub);
  margin-left:8px;
  font-size:12px;
}

/* =========================================================
   TABS
========================================================= */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:14px;
  padding-bottom:2px;
}

.tab{
  flex:0 0 auto;
  border:1px solid var(--border);
  background:var(--card);
  color:var(--sub);
  border-radius:10px;
  padding:9px 13px;
  font-size:12px;
  font-weight:700;
}

.tab.active{
  color:#fff;
  border-color:var(--blue);
  background:#10263a;
}

/* =========================================================
   SECTION
========================================================= */

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:end;
  margin:5px 2px 10px;
}

.section-title{
  font-size:16px;
  font-weight:800;
}

.section-count{
  color:var(--sub);
  font-size:11px;
}

/* =========================================================
   STOCK CARD
========================================================= */

.stock-list{
  display:grid;
  gap:10px;
}

.stock-card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:15px;
  padding:14px;
}

.stock-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:10px;
}

.stock-symbol{
  font-size:16px;
  font-weight:850;
}

.stock-name{
  margin-top:3px;
  color:var(--sub);
  font-size:12px;
}

.stock-meta{
  margin-top:7px;
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.tag{
  display:inline-flex;
  align-items:center;
  padding:4px 7px;
  border-radius:7px;
  border:1px solid var(--border);
  background:var(--card2);
  color:var(--sub);
  font-size:10px;
}

.strength{
  border-radius:8px;
  padding:6px 9px;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
}

.strength.strong{
  color:#fecaca;
  background:rgba(239,68,68,.12);
  border:1px solid rgba(239,68,68,.3);
}

.strength.neutral{
  color:#fde68a;
  background:rgba(245,158,11,.10);
  border:1px solid rgba(245,158,11,.28);
}

.strength.weak{
  color:#bbf7d0;
  background:rgba(34,197,94,.10);
  border:1px solid rgba(34,197,94,.28);
}

.price-row{
  display:flex;
  align-items:baseline;
  gap:9px;
  margin-top:14px;
}

.price{
  font-size:24px;
  font-weight:850;
}

.change{
  font-size:13px;
  font-weight:750;
}

.up{
  color:var(--red);
}

.down{
  color:var(--green);
}

.flat{
  color:var(--sub);
}

.stock-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:8px;
  margin-top:12px;
}

.info-box{
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:10px;
  padding:9px;
}

.info-label{
  color:var(--sub);
  font-size:10px;
}

.info-value{
  margin-top:4px;
  font-size:12px;
  font-weight:700;
}

.recommendation{
  margin-top:10px;
  padding:10px;
  border-radius:10px;
  background:var(--card2);
  border:1px solid var(--border);
  font-size:12px;
}

.recommendation strong{
  color:var(--blue);
}

.backend-date{
  margin-top:9px;
  color:#64748b;
  font-size:10px;
}

/* =========================================================
   EMPTY / ERROR
========================================================= */

.empty{
  padding:28px 15px;
  text-align:center;
  border:1px dashed var(--border);
  border-radius:14px;
  color:var(--sub);
  background:rgba(21,28,44,.55);
}

.empty-title{
  color:var(--text);
  font-weight:800;
  margin-bottom:6px;
}

.error-box{
  padding:18px;
  border:1px solid rgba(239,68,68,.35);
  border-radius:14px;
  background:rgba(239,68,68,.08);
}

.error-title{
  font-weight:800;
  color:#fecaca;
}

.error-detail{
  margin-top:7px;
  color:#fca5a5;
  font-size:12px;
  line-height:1.6;
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
  margin-top:25px;
  text-align:center;
  color:#475569;
  font-size:10px;
  line-height:1.7;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:480px){
  .app{
    padding:13px 10px 30px;
  }

  .brand-title{
    font-size:20px;
  }

  .market-grid{
    grid-template-columns:1fr 1fr;
  }

  .stock-grid{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <header class="header">
    <div class="brand">
      <div>
        <div class="brand-title">台股 AI 選股・零股定投</div>
        <div class="brand-sub">資料由後端 UI-DATA-2.1 統一提供</div>
      </div>

      <div id="systemStatus" class="status">
        <span class="status-dot"></span>
        <span id="systemStatusText">載入中</span>
      </div>
    </div>
  </header>

  <section class="market-card">
    <div class="market-top">
      <div>
        <div id="marketName" class="market-name">台股市場</div>
        <div id="marketDate" class="market-date">資料載入中</div>
      </div>
      <div id="marketStatus" class="market-status">—</div>
    </div>

    <div class="market-grid">
      <div class="market-metric">
        <div class="metric-label">加權指數</div>
        <div id="marketIndex" class="metric-value">—</div>
      </div>

      <div class="market-metric">
        <div class="metric-label">市場情緒</div>
        <div id="marketSentiment" class="metric-value">—</div>
      </div>
    </div>
  </section>

  <div class="search-wrap">
    <input
      id="searchInput"
      class="search"
      type="search"
      autocomplete="off"
      placeholder="搜尋股票代號／名稱"
    >
    <div id="searchResult" class="search-result"></div>
  </div>

  <nav id="tabs" class="tabs"></nav>

  <section>
    <div class="section-head">
      <div id="sectionTitle" class="section-title">今日選股</div>
      <div id="sectionCount" class="section-count">0 檔</div>
    </div>

    <div id="content"></div>
  </section>

  <footer class="footer">
    台股 AI 選股系統<br>
    前端僅使用 Data/ui_data.json
  </footer>

</div>

<script>
"use strict";

/* =========================================================
   UI-DATA-2.1 FRONTEND
   ---------------------------------------------------------
   唯一資料來源：
       Data/ui_data.json

   禁止：
       prices.json
       analysis.json
       chip.json
       universe.json
       market.json
       Yahoo Finance
       前端自行計算技術指標
       前端自行建立固定股票清單
========================================================= */

const UI_DATA_URLS = [
  "Data/ui_data.json",
  "./Data/ui_data.json",
  "/tw-stock-ai-scanner/Data/ui_data.json"
];

let uiData = null;
let allStocks = [];
let currentTab = "today_picks";

/* =========================================================
   DOM
========================================================= */

const $ = id => document.getElementById(id);

const systemStatus = $("systemStatus");
const systemStatusText = $("systemStatusText");
const marketName = $("marketName");
const marketDate = $("marketDate");
const marketStatus = $("marketStatus");
const marketIndex = $("marketIndex");
const marketSentiment = $("marketSentiment");
const tabsEl = $("tabs");
const contentEl = $("content");
const sectionTitle = $("sectionTitle");
const sectionCount = $("sectionCount");
const searchInput = $("searchInput");
const searchResult = $("searchResult");

/* =========================================================
   HELPERS
========================================================= */

function escapeHtml(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalizeSymbol(value){
  if(value === null || value === undefined) return "";

  return String(value)
    .trim()
    .toUpperCase()
    .replace(/\.(TW|TWO|TSE|OTC)$/i,"");
}

function isObject(value){
  return value !== null &&
         typeof value === "object" &&
         !Array.isArray(value);
}

function validNumber(value){
  return typeof value === "number" &&
         Number.isFinite(value);
}

function formatNumber(value, digits=2){
  if(!validNumber(value)) return "—";

  return value.toLocaleString("zh-TW",{
    minimumFractionDigits:digits,
    maximumFractionDigits:digits
  });
}

function formatPrice(value){
  if(!validNumber(value)) return "—";

  const digits =
    Math.abs(value) >= 1000 ? 0 :
    Math.abs(value) >= 100 ? 1 :
    2;

  return formatNumber(value,digits);
}

function formatPercent(value){
  if(!validNumber(value)) return "—";

  return `${value >= 0 ? "+" : ""}${value.toFixed(2)}%`;
}

function getChangeClass(value){
  if(!validNumber(value)) return "flat";
  if(value > 0) return "up";
  if(value < 0) return "down";
  return "flat";
}

function getStrengthClass(strength){
  const s = String(strength || "");

  if(s.includes("強")) return "strong";
  if(s.includes("弱")) return "weak";
  return "neutral";
}

function sentimentClass(sentiment){
  const s = String(sentiment || "");

  if(/強|樂觀|多頭|偏多/.test(s)){
    return "sentiment-strong";
  }

  if(/弱|悲觀|空頭|偏空/.test(s)){
    return "sentiment-weak";
  }

  return "sentiment-neutral";
}

/* =========================================================
   DATA VALIDATION
========================================================= */

function validateUiData(data){

  if(!isObject(data)){
    throw new Error("ui_data.json 不是有效 JSON 物件");
  }

  if(data.schema_version !== "UI-DATA-2.1"){
    throw new Error(
      `UI schema 不符：${data.schema_version || "未提供"}`
    );
  }

  if(data.status !== "ok"){
    throw new Error(
      `UI data status 非 ok：${data.status || "未提供"}`
    );
  }

  if(!isObject(data.market)){
    throw new Error("缺少 market");
  }

  if(!isObject(data.summary)){
    throw new Error("缺少 summary");
  }

  if(!isObject(data.tabs)){
    throw new Error("缺少 tabs");
  }

  if(!isObject(data.stocks)){
    throw new Error("缺少 stocks");
  }

  return true;
}

/* =========================================================
   LOAD UI DATA
========================================================= */

async function fetchUiData(){

  let lastError = null;

  for(const url of UI_DATA_URLS){

    try{

      const response = await fetch(
        `${url}${url.includes("?") ? "&" : "?"}_=${Date.now()}`,
        {
          cache:"no-store",
          headers:{
            "Accept":"application/json"
          }
        }
      );

      if(!response.ok){
        throw new Error(
          `HTTP ${response.status} ${response.statusText}`
        );
      }

      const data = await response.json();

      validateUiData(data);

      return data;

    }catch(error){
      lastError = error;
    }
  }

  throw lastError || new Error("無法載入 ui_data.json");
}

/* =========================================================
   NORMALIZE STOCKS
========================================================= */

function buildStockList(data){

  const stocks = [];

  for(const [key, raw] of Object.entries(data.stocks || {})){

    if(!isObject(raw)) continue;

    const symbol =
      normalizeSymbol(raw.symbol || key);

    if(!symbol) continue;

    stocks.push({
      ...raw,
      symbol,
      name: raw.name || symbol,
      market: raw.market || "—",
      instrument_type: raw.instrument_type || "stock",
      strength: raw.strength || "中性",
      recommendation: raw.recommendation || "續抱觀察"
    });
  }

  stocks.sort((a,b) =>
    String(a.symbol).localeCompare(
      String(b.symbol),
      "zh-TW",
      {numeric:true}
    )
  );

  return stocks;
}

/* =========================================================
   MARKET
========================================================= */

function renderMarket(){

  const market = uiData.market || {};

  marketName.textContent =
    market.name || "台股市場";

  marketDate.textContent =
    market.latest_trading_date
      ? `最新交易日：${market.latest_trading_date}`
      : "最新交易日：—";

  marketStatus.textContent =
    market.status || "—";

  const index = market.index;

  if(isObject(index)){

    const value =
      index.value ??
      index.close ??
      index.price;

    const change =
      index.change ??
      index.price_change;

    const pct =
      index.change_pct ??
      index.change_percent;

    if(validNumber(value)){

      let html = escapeHtml(formatNumber(value,2));

      if(validNumber(change) || validNumber(pct)){

        html += `
          <div class="${getChangeClass(change)}"
               style="font-size:11px;margin-top:4px;">
            ${validNumber(change)
              ? `${change >= 0 ? "+" : ""}${formatNumber(change,2)}`
              : ""}
            ${validNumber(pct)
              ? ` ${formatPercent(pct)}`
              : ""}
          </div>
        `;
      }

      marketIndex.innerHTML = html;

    }else{

      marketIndex.textContent = "—";
    }

  }else if(validNumber(index)){

    marketIndex.textContent =
      formatNumber(index,2);

  }else{

    marketIndex.textContent = "—";
  }

  const sentiment = market.sentiment;

  if(isObject(sentiment)){

    const label =
      sentiment.label ??
      sentiment.name ??
      sentiment.status ??
      sentiment.value ??
      "—";

    marketSentiment.textContent = label;
    marketSentiment.className =
      `metric-value ${sentimentClass(label)}`;

  }else{

    const label =
      sentiment || "—";

    marketSentiment.textContent = label;
    marketSentiment.className =
      `metric-value ${sentimentClass(label)}`;
  }
}

/* =========================================================
   TAB CONFIG
========================================================= */

const TAB_CONFIG = [
  {
    id:"today_picks",
    label:"今日選股",
    title:"今日選股"
  },
  {
    id:"top10",
    label:"AI Top 10",
    title:"AI Top 10"
  },
  {
    id:"etf",
    label:"ETF",
    title:"ETF"
  },
  {
    id:"bond",
    label:"債券",
    title:"債券"
  },
  {
    id:"watchlist",
    label:"觀察",
    title:"觀察清單"
  },
  {
    id:"all",
    label:"全部",
    title:"全部商品"
  }
];

/* =========================================================
   TAB DATA
========================================================= */

function symbolsToStocks(symbols){

  if(!Array.isArray(symbols)) return [];

  const map = new Map(
    allStocks.map(stock => [
      normalizeSymbol(stock.symbol),
      stock
    ])
  );

  const result = [];
  const seen = new Set();

  for(const item of symbols){

    const symbol =
      normalizeSymbol(
        typeof item === "string"
          ? item
          : item?.symbol ||
            item?.code ||
            item?.ticker
      );

    if(!symbol || seen.has(symbol)) continue;

    const stock = map.get(symbol);

    if(stock){
      result.push(stock);
      seen.add(symbol);
    }
  }

  return result;
}

function getTabStocks(tab){

  if(tab === "all"){
    return [...allStocks];
  }

  if(tab === "today_picks"){
    return symbolsToStocks(
      uiData.tabs?.today_picks
    );
  }

  if(tab === "top10"){
    return symbolsToStocks(
      uiData.tabs?.top10
    );
  }

  if(tab === "etf"){
    return symbolsToStocks(
      uiData.tabs?.etf
    );
  }

  if(tab === "bond"){
    return symbolsToStocks(
      uiData.tabs?.bond
    );
  }

  if(tab === "watchlist"){
    return symbolsToStocks(
      uiData.tabs?.watchlist
    );
  }

  return [];
}

/* =========================================================
   TABS
========================================================= */

function renderTabs(){

  tabsEl.innerHTML = TAB_CONFIG.map(tab => `
    <button
      class="tab ${tab.id === currentTab ? "active" : ""}"
      data-tab="${escapeHtml(tab.id)}"
      type="button">
      ${escapeHtml(tab.label)}
    </button>
  `).join("");

  tabsEl.querySelectorAll(".tab").forEach(button => {

    button.addEventListener("click",() => {

      currentTab = button.dataset.tab;

      renderTabs();
      renderCurrentTab();

    });

  });
}

/* =========================================================
   STOCK CARD
========================================================= */

function renderStockCard(stock){

  const symbol =
    escapeHtml(stock.symbol);

  const name =
    escapeHtml(stock.name || "—");

  const market =
    escapeHtml(stock.market || "—");

  const instrument =
    escapeHtml(
      stock.instrument_type || "stock"
    );

  const strength =
    String(stock.strength || "中性");

  const recommendation =
    escapeHtml(
      stock.recommendation || "續抱觀察"
    );

  const price =
    formatPrice(stock.price);

  const change =
    validNumber(stock.change)
      ? `${stock.change >= 0 ? "+" : ""}${formatNumber(stock.change,2)}`
      : "—";

  const changePct =
    validNumber(stock.change_pct)
      ? formatPercent(stock.change_pct)
      : "—";

  const changeClass =
    getChangeClass(stock.change);

  const backend =
    isObject(stock.backend)
      ? stock.backend
      : {};

  const latestDate =
    backend.latest_date || "—";

  return `
    <article class="stock-card">

      <div class="stock-header">

        <div>
          <div class="stock-symbol">${symbol}</div>
          <div class="stock-name">${name}</div>

          <div class="stock-meta">
            <span class="tag">${market}</span>
            <span class="tag">${instrument}</span>
          </div>
        </div>

        <div class="strength ${getStrengthClass(strength)}">
          ${escapeHtml(strength)}
        </div>

      </div>

      <div class="price-row">

        <div class="price">
          ${escapeHtml(price)}
        </div>

        <div class="change ${changeClass}">
          ${escapeHtml(change)}
          ${escapeHtml(changePct)}
        </div>

      </div>

      <div class="stock-grid">

        <div class="info-box">
          <div class="info-label">AI 判定</div>
          <div class="info-value">
            ${escapeHtml(strength)}
          </div>
        </div>

        <div class="info-box">
          <div class="info-label">操作建議</div>
          <div class="info-value">
            ${recommendation}
          </div>
        </div>

      </div>

      <div class="recommendation">
        <strong>AI 建議：</strong>
        ${recommendation}
      </div>

      <div class="backend-date">
        後端資料日期：${escapeHtml(latestDate)}
      </div>

    </article>
  `;
}

/* =========================================================
   RENDER CURRENT TAB
========================================================= */

function renderCurrentTab(){

  const config =
    TAB_CONFIG.find(
      item => item.id === currentTab
    ) || TAB_CONFIG[0];

  const stocks =
    getTabStocks(currentTab);

  sectionTitle.textContent =
    config.title;

  sectionCount.textContent =
    `${stocks.length} 檔`;

  if(!stocks.length){

    contentEl.innerHTML = `
      <div class="empty">
        <div class="empty-title">
          目前沒有資料
        </div>
        <div>
          此分類目前沒有符合的商品。
        </div>
      </div>
    `;

    return;
  }

  contentEl.innerHTML = `
    <div class="stock-list">
      ${stocks.map(renderStockCard).join("")}
    </div>
  `;
}

/* =========================================================
   SEARCH
========================================================= */

function searchStocks(keyword){

  const q =
    String(keyword || "")
      .trim()
      .toUpperCase();

  if(!q){

    searchResult.classList.remove("show");
    searchResult.innerHTML = "";
    return;
  }

  const matches =
    allStocks
      .filter(stock => {

        const symbol =
          normalizeSymbol(stock.symbol)
            .toUpperCase();

        const name =
          String(stock.name || "")
            .toUpperCase();

        return symbol.includes(q) ||
               name.includes(q);
      })
      .slice(0,10);

  if(!matches.length){

    searchResult.innerHTML = `
      <div class="search-item">
        <span class="search-name">
          找不到符合的商品
        </span>
      </div>
    `;

    searchResult.classList.add("show");
    return;
  }

  searchResult.innerHTML =
    matches.map(stock => `
      <button
        type="button"
        class="search-item"
        data-symbol="${escapeHtml(stock.symbol)}">

        <span class="search-symbol">
          ${escapeHtml(stock.symbol)}
        </span>

        <span class="search-name">
          ${escapeHtml(stock.name || "")}
        </span>

      </button>
    `).join("");

  searchResult.classList.add("show");

  searchResult
    .querySelectorAll(".search-item[data-symbol]")
    .forEach(button => {

      button.addEventListener("click",() => {

        const symbol =
          normalizeSymbol(button.dataset.symbol);

        const stock =
          allStocks.find(
            item =>
              normalizeSymbol(item.symbol) === symbol
          );

        if(stock){

          currentTab = "all";

          renderTabs();
          renderCurrentTab();

          searchInput.value =
            `${stock.symbol} ${stock.name}`;

          searchResult.classList.remove("show");

          setTimeout(() => {

            const cards =
              [...document.querySelectorAll(".stock-card")];

            const target =
              cards.find(card =>
                card.querySelector(".stock-symbol")
                  ?.textContent === stock.symbol
              );

            if(target){
              target.scrollIntoView({
                behavior:"smooth",
                block:"center"
              });
            }

          },50);
        }

      });

    });
}

searchInput.addEventListener(
  "input",
  event => searchStocks(event.target.value)
);

document.addEventListener("click",event => {

  if(
    !searchResult.contains(event.target) &&
    event.target !== searchInput
  ){
    searchResult.classList.remove("show");
  }

});

/* =========================================================
   SYSTEM STATUS
========================================================= */

function setSystemStatus(type,text){

  systemStatus.className =
    `status ${type}`;

  systemStatusText.textContent =
    text;
}

/* =========================================================
   SUMMARY
========================================================= */

function renderSummary(){

  const summary =
    uiData.summary || {};

  const todayCount =
    Array.isArray(uiData.tabs?.today_picks)
      ? uiData.tabs.today_picks.length
      : 0;

  document.title =
    `台股 AI 選股・零股定投｜${todayCount} 檔`;
}

/* =========================================================
   INIT
========================================================= */

async function init(){

  setSystemStatus(
    "warn",
    "資料載入中"
  );

  try{

    uiData =
      await fetchUiData();

    allStocks =
      buildStockList(uiData);

    renderMarket();
    renderSummary();
    renderTabs();
    renderCurrentTab();

    setSystemStatus(
      "ok",
      "資料正常"
    );

  }catch(error){

    console.error(
      "UI DATA ERROR:",
      error
    );

    setSystemStatus(
      "error",
      "資料錯誤"
    );

    marketDate.textContent =
      "無法取得後端資料";

    marketStatus.textContent =
      "錯誤";

    marketIndex.textContent =
      "—";

    marketSentiment.textContent =
      "—";

    tabsEl.innerHTML = "";

    sectionTitle.textContent =
      "資料載入失敗";

    sectionCount.textContent =
      "—";

    contentEl.innerHTML = `
      <div class="error-box">
        <div class="error-title">
          無法載入台股 AI 資料
        </div>

        <div class="error-detail">
          ${escapeHtml(error?.message || "未知錯誤")}
        </div>

        <div class="error-detail">
          前端唯一資料來源：
          Data/ui_data.json
        </div>
      </div>
    `;
  }
}

/* =========================================================
   START
========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  init
);
</script>
