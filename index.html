<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股 AI 選購與籌碼掃描系統</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --accent-red: #ef4444;
      --accent-green: #22c55e;
      --border-color: #334155;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px 0;
    }

    .status-badge {
      display: inline-block;
      font-size: 0.85rem;
      padding: 4px 8px;
      border-radius: 4px;
      background-color: var(--border-color);
      color: var(--text-sub);
    }

    .control-panel {
      margin-bottom: 24px;
    }

    select {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      font-size: 1rem;
      outline: none;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.875rem;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 1.5rem;
      font-weight: bold;
    }

    .text-red { color: var(--accent-red); }
    .text-green { color: var(--accent-green); }
    .text-gray { color: var(--text-sub); }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>台股 AI 籌碼監控儀表板</h1>
      <span id="system-status" class="status-badge">資料連線中...</span>
    </header>

    <!-- 1. 股票選擇器 -->
    <div class="control-panel">
      <label for="stock-select" style="display:block; margin-bottom: 8px; color: var(--text-sub);">搜尋 / 選擇標的：</label>
      <select id="stock-select" disabled>
        <option value="">載入後台 Data/ 資料庫中...</option>
      </select>
    </div>

    <!-- 2. 數據呈現面板 -->
    <h2 id="selected-stock-name" style="font-size: 1.25rem; margin-bottom: 16px;">請選擇個股</h2>

    <div class="dashboard-grid">
      <div class="card">
        <div class="card-title">外資買賣超 (1日)</div>
        <div id="foreign-1d" class="card-value">--</div>
      </div>

      <div class="card">
        <div class="card-title">投信買賣超 (1日)</div>
        <div id="trust-1d" class="card-value">--</div>
      </div>

      <div class="card">
        <div class="card-title">主力籌碼 (1日)</div>
        <div id="main-1d" class="card-value">--</div>
      </div>

      <div class="card">
        <div class="card-title">當沖成交率</div>
        <div id="day-trading-rate" class="card-value">--</div>
      </div>
    </div>
  </div>

  <!-- 3. 後端 JSON 讀取與 DOM 綁定邏輯 (方案 A 內嵌式) -->
  <script>
    let stockUniverse = [];
    let chipDataMap = {};

    document.addEventListener('DOMContentLoaded', async () => {
      await connectBackendData();
    });

    async function connectBackendData() {
      const statusBadge = document.getElementById('system-status');
      const selectEl = document.getElementById('stock-select');

      try {
        // 使用時間戳記避免瀏覽器 HTTP 快取
        const cacheBuster = `?v=${new Date().getTime()}`;

        // 並行讀取後台產出的 2 個關鍵 JSON 檔案
        const [universeResp, chipResp] = await Promise.all([
          fetch(`Data/universe.json${cacheBuster}`),
          fetch(`Data/chip.json${cacheBuster}`)
        ]);

        if (!universeResp.ok || !chipResp.ok) {
          throw new Error('無法順利取得 Data/ 靜態檔案');
        }

        stockUniverse = await universeResp.json();
        chipDataMap = await chipResp.json();

        // 渲染下拉清單
        renderDropdown();

        statusBadge.textContent = '✓ 後台資料庫連線成功';
        statusBadge.style.backgroundColor = '#166534';
        statusBadge.style.color = '#4ade80';

      } catch (error) {
        console.error('連線失敗:', error);
        statusBadge.textContent = 'x 資料載入失敗 (請確認 CI/CD Data/ 檔)';
        statusBadge.style.backgroundColor = '#991b1b';
        statusBadge.style.color = '#f87171';
        selectEl.innerHTML = '<option value="">載入失敗，請重新整理</option>';
      }
    }

    function renderDropdown() {
      const selectEl = document.getElementById('stock-select');
      selectEl.innerHTML = '<option value="">-- 請選擇台股標的 --</option>';

      stockUniverse.forEach(stock => {
        const opt = document.createElement('option');
        opt.value = stock.symbol;
        opt.textContent = `${stock.symbol} ${stock.name}`;
        selectEl.appendChild(opt);
      });

      selectEl.disabled = false;

      selectEl.addEventListener('change', (e) => {
        updateDashboard(e.target.value);
      });
    }

    function updateDashboard(symbol) {
      if (!symbol) return;

      const stockNameEl = document.getElementById('selected-stock-name');
      const foreignEl = document.getElementById('foreign-1d');
      const trustEl = document.getElementById('trust-1d');
      const mainEl = document.getElementById('main-1d');
      const dayTradeEl = document.getElementById('day-trading-rate');

      // 從底冊取得股票名稱
      const stockMeta = stockUniverse.find(s => s.symbol === symbol);
      const stockName = stockMeta ? stockMeta.name : '';
      stockNameEl.textContent = `${symbol} ${stockName}`;

      const chip = chipDataMap[symbol];

      if (!chip) {
        foreignEl.textContent = '無數據';
        trustEl.textContent = '無數據';
        mainEl.textContent = '無數據';
        dayTradeEl.textContent = '--';
        return;
      }

      // 格式化數字與紅綠色彩 (買超紅/賣超綠)
      formatValue(foreignEl, chip.foreign_1d);
      formatValue(trustEl, chip.investment_trust_1d);
      formatValue(mainEl, chip.main_force_1d);

      dayTradeEl.textContent = chip.day_trading_rate ? `${chip.day_trading_rate}%` : '--';
      dayTradeEl.className = 'card-value';
    }

    function formatValue(element, val) {
      if (val === undefined || val === null) {
        element.textContent = '0';
        element.className = 'card-value text-gray';
        return;
      }

      const num = Number(val);
      element.textContent = num.toLocaleString() + ' 張';

      if (num > 0) {
        element.className = 'card-value text-red';
      } else if (num < 0) {
        element.className = 'card-value text-green';
      } else {
        element.className = 'card-value text-gray';
      }
    }
  </script>
</body>
</html>
