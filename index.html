<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI MARKET INTELLIGENCE</title>

  <meta name="theme-color" content="#08111f">
  <meta name="description" content="台股 AI MARKET INTELLIGENCE 智慧投資儀表板">

  <style>
    :root {
      --bg-main: #07101d;
      --bg-secondary: #0b1626;
      --bg-card: rgba(15, 28, 46, 0.92);
      --bg-card-soft: rgba(19, 35, 56, 0.82);

      --border: rgba(148, 163, 184, 0.14);
      --border-strong: rgba(148, 163, 184, 0.24);

      --text-main: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #8ea0b8;

      --accent: #60a5fa;
      --accent-soft: rgba(96, 165, 250, 0.12);

      /* 台股慣用顏色：
         上漲 = 紅
         下跌 = 綠
      */
      --tw-up: #ff4d5a;
      --tw-up-soft: rgba(255, 77, 90, 0.13);

      --tw-down: #35d07f;
      --tw-down-soft: rgba(53, 208, 127, 0.13);

      --neutral: #94a3b8;
      --neutral-soft: rgba(148, 163, 184, 0.12);

      --strong: #39d98a;
      --strong-soft: rgba(57, 217, 138, 0.12);

      --warning: #f4c95d;
      --warning-soft: rgba(244, 201, 93, 0.12);

      --weak: #ff6875;
      --weak-soft: rgba(255, 104, 117, 0.12);

      --shadow:
        0 18px 50px rgba(0, 0, 0, 0.28);

      --radius-xl: 22px;
      --radius-lg: 18px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;

      color: var(--text-main);

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(37, 99, 235, 0.16),
          transparent 32%
        ),
        radial-gradient(
          circle at 90% 12%,
          rgba(14, 165, 233, 0.10),
          transparent 30%
        ),
        linear-gradient(
          180deg,
          #07101d 0%,
          #081321 42%,
          #050c16 100%
        );

      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: min(1180px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 60px;
    }

    /* ========================================================
       TOP / AI MARKET INTELLIGENCE
       ======================================================== */

    .hero {
      position: relative;
      overflow: hidden;

      padding: 28px 28px 24px;

      border: 1px solid var(--border);
      border-radius: var(--radius-xl);

      background:
        linear-gradient(
          135deg,
          rgba(19, 39, 65, 0.94),
          rgba(8, 20, 35, 0.94)
        );

      box-shadow: var(--shadow);
    }

    .hero::before {
      content: "";

      position: absolute;
      width: 240px;
      height: 240px;

      top: -130px;
      right: -70px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(96, 165, 250, 0.18),
          transparent 68%
        );

      pointer-events: none;
    }

    .hero-label {
      position: relative;

      display: flex;
      align-items: center;
      gap: 10px;

      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.22em;

      color: #8ebcff;

      text-transform: uppercase;
    }

    .hero-label::before {
      content: "";

      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #60a5fa;

      box-shadow:
        0 0 14px rgba(96, 165, 250, 0.9);
    }

    .hero-title {
      position: relative;

      margin-top: 12px;

      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.08;
      font-weight: 850;

      letter-spacing: -0.035em;
    }

    .hero-subtitle {
      position: relative;

      margin-top: 8px;

      color: var(--text-secondary);

      font-size: 16px;
      font-weight: 650;
    }

    .hero-signal {
      position: relative;

      margin-top: 18px;

      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .market-status {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 9px 13px;

      border-radius: 999px;

      font-size: 13px;
      font-weight: 800;

      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.04);
    }

    .market-status.open {
      color: #7ef0ae;
      background: rgba(57, 217, 138, 0.08);
      border-color: rgba(57, 217, 138, 0.18);
    }

    .market-status.closed {
      color: #f4c95d;
      background: rgba(244, 201, 93, 0.08);
      border-color: rgba(244, 201, 93, 0.18);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
      box-shadow: 0 0 12px currentColor;
    }

    .latest-date {
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
    }

    /* ========================================================
       FOUR SUMMARY CARDS
       ======================================================== */

    .summary-grid {
      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;

      margin-top: 18px;
    }

    .summary-card {
      min-height: 150px;

      padding: 20px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(17, 32, 52, 0.95),
          rgba(10, 22, 37, 0.94)
        );

      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.20);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .summary-card:hover {
      transform: translateY(-2px);

      border-color:
        rgba(96, 165, 250, 0.28);

      background:
        linear-gradient(
          145deg,
          rgba(20, 39, 63, 0.98),
          rgba(11, 25, 42, 0.96)
        );
    }

    .summary-label {
      color: var(--text-muted);

      font-size: 13px;
      font-weight: 750;

      letter-spacing: 0.02em;
    }

    .summary-value {
      margin-top: 13px;

      font-size: clamp(25px, 5vw, 34px);
      line-height: 1;

      font-weight: 850;

      letter-spacing: -0.04em;
    }

    .summary-note {
      margin-top: 12px;

      color: var(--text-secondary);

      font-size: 12px;
      font-weight: 600;
    }

    .summary-up {
      color: var(--tw-up);
    }

    .summary-down {
      color: var(--tw-down);
    }

    .summary-neutral {
      color: var(--text-main);
    }

    .summary-market {
      display: flex;
      align-items: baseline;
      gap: 9px;
      flex-wrap: wrap;
    }

    .summary-market-change {
      font-size: 14px;
      font-weight: 800;
    }

    /* ========================================================
       MARKET WIND
       ======================================================== */

    .wind-wrap {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .wind-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 13px;

      font-size: 21px;

      background: var(--neutral-soft);
    }

    .wind-icon.bullish {
      background: var(--strong-soft);
    }

    .wind-icon.neutral {
      background: var(--warning-soft);
    }

    .wind-icon.bearish {
      background: var(--weak-soft);
    }

    .wind-value {
      font-size: 27px;
      font-weight: 850;
      line-height: 1;
    }

    .wind-value.bullish {
      color: var(--strong);
    }

    .wind-value.neutral {
      color: var(--warning);
    }

    .wind-value.bearish {
      color: var(--weak);
    }

    /* ========================================================
       SEARCH
       ======================================================== */

    .search-panel {
      margin-top: 18px;

      padding: 17px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background:
        rgba(10, 24, 40, 0.90);

      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.18);
    }

    .search-heading {
      margin-bottom: 11px;

      display: flex;
      align-items: center;
      gap: 8px;

      font-size: 15px;
      font-weight: 850;
    }

    .search-heading-icon {
      font-size: 17px;
    }

    .search-row {
      display: flex;
      gap: 10px;
    }

    .search-input-wrap {
      position: relative;
      flex: 1;
    }

    .search-input {
      width: 100%;

      height: 48px;

      padding: 0 15px;

      color: var(--text-main);

      border: 1px solid var(--border-strong);
      border-radius: 12px;

      outline: none;

      background:
        rgba(255, 255, 255, 0.045);

      transition:
        border-color 0.2s ease,
        background 0.2s ease;
    }

    .search-input::placeholder {
      color: #70829a;
    }

    .search-input:focus {
      border-color:
        rgba(96, 165, 250, 0.55);

      background:
        rgba(255, 255, 255, 0.065);
    }

    .search-button {
      flex: 0 0 auto;

      min-width: 78px;
      height: 48px;

      padding: 0 18px;

      color: #fff;

      border: 0;
      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          #3182f6,
          #2563eb
        );

      font-size: 14px;
      font-weight: 800;

      box-shadow:
        0 8px 20px rgba(37, 99, 235, 0.25);
    }

    .search-button:active {
      transform: translateY(1px);
    }

    .search-result {
      display: none;

      margin-top: 12px;

      padding: 15px;

      border: 1px solid var(--border);
      border-radius: 14px;

      background:
        rgba(255, 255, 255, 0.035);
    }

    .search-result.show {
      display: block;
    }

    .search-empty {
      color: var(--text-muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* ========================================================
       TABS
       ======================================================== */

    .tabs {
      margin-top: 18px;

      display: grid;

      grid-template-columns:
        repeat(5, minmax(0, 1fr));

      gap: 7px;

      padding: 6px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background:
        rgba(8, 18, 31, 0.88);

      position: sticky;
      top: 10px;
      z-index: 20;

      backdrop-filter: blur(16px);
    }

    .tab-button {
      min-height: 42px;

      border: 0;
      border-radius: 10px;

      color: var(--text-muted);

      background: transparent;

      font-size: 13px;
      font-weight: 800;

      transition:
        color 0.2s ease,
        background 0.2s ease;
    }

    .tab-button:hover {
      color: var(--text-main);
      background:
        rgba(255, 255, 255, 0.04);
    }

    .tab-button.active {
      color: #fff;

      background:
        linear-gradient(
          135deg,
          rgba(59, 130, 246, 0.28),
          rgba(37, 99, 235, 0.16)
        );

      box-shadow:
        inset 0 0 0 1px
        rgba(96, 165, 250, 0.18);
    }

    /* ========================================================
       CONTENT
       ======================================================== */

    .content-header {
      margin-top: 26px;

      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 15px;
    }

    .content-title {
      font-size: 21px;
      font-weight: 850;

      letter-spacing: -0.025em;
    }

    .content-subtitle {
      margin-top: 5px;

      color: var(--text-muted);

      font-size: 12px;
      font-weight: 600;
    }

    .content-count {
      color: var(--text-muted);

      font-size: 12px;
      font-weight: 700;
    }

    .cards-grid {
      margin-top: 14px;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 14px;
    }

    /* ========================================================
       STOCK CARD
       ======================================================== */

    .stock-card {
      position: relative;
      overflow: hidden;

      padding: 20px;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background:
        linear-gradient(
          145deg,
          rgba(16, 31, 50, 0.96),
          rgba(9, 21, 35, 0.96)
        );

      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.20);

      transition:
        transform 0.2s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .stock-card::after {
      content: "";

      position: absolute;

      width: 150px;
      height: 150px;

      right: -90px;
      bottom: -95px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(96, 165, 250, 0.08),
          transparent 70%
        );

      pointer-events: none;
    }

    .stock-card:hover {
      transform: translateY(-3px);

      border-color:
        rgba(96, 165, 250, 0.27);

      box-shadow:
        0 18px 42px rgba(0, 0, 0, 0.27);
    }

    .stock-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 15px;
    }

    .stock-name {
      font-size: 22px;
      line-height: 1.15;

      font-weight: 850;

      letter-spacing: -0.03em;
    }

    .stock-code {
      margin-top: 6px;

      color: var(--text-muted);

      font-size: 12px;
      font-weight: 700;

      letter-spacing: 0.08em;
    }

    .market-tag {
      padding: 5px 8px;

      border: 1px solid var(--border);

      border-radius: 7px;

      color: var(--text-muted);

      background:
        rgba(255, 255, 255, 0.035);

      font-size: 10px;
      font-weight: 800;
    }

    .stock-price-row {
      margin-top: 20px;

      display: flex;
      align-items: baseline;
      flex-wrap: wrap;

      gap: 12px;
    }

    .stock-price {
      font-size: 30px;
      line-height: 1;

      font-weight: 850;

      letter-spacing: -0.045em;
    }

    .stock-change {
      font-size: 15px;
      font-weight: 850;
    }

    /* 台股：
       上漲紅色
       下跌綠色
    */
    .price-up {
      color: var(--tw-up);
    }

    .price-down {
      color: var(--tw-down);
    }

    .price-flat {
      color: var(--neutral);
    }

    .stock-divider {
      height: 1px;

      margin: 18px 0;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--border),
          transparent
        );
    }

    .stock-section-label {
      color: var(--text-muted);

      font-size: 11px;
      font-weight: 800;

      letter-spacing: 0.05em;
    }

    .strength-row {
      margin-top: 8px;

      display: flex;
      align-items: center;
      gap: 9px;
    }

    .strength-light {
      width: 10px;
      height: 10px;

      border-radius: 50%;

      box-shadow: 0 0 12px currentColor;
    }

    .strength-text {
      font-size: 15px;
      font-weight: 850;
    }

    .strength-strong {
      color: var(--strong);
    }

    .strength-neutral {
      color: var(--warning);
    }

    .strength-weak {
      color: var(--weak);
    }

    .recommendation {
      margin-top: 14px;

      padding: 11px 13px;

      border: 1px solid var(--border);
      border-radius: 11px;

      color: var(--text-main);

      background:
        rgba(255, 255, 255, 0.035);

      font-size: 13px;
      font-weight: 750;

      line-height: 1.5;
    }

    .recommendation-label {
      display: block;

      margin-bottom: 4px;

      color: var(--text-muted);

      font-size: 10px;
      font-weight: 800;

      letter-spacing: 0.05em;
    }

    /* ========================================================
       MY WATCHLIST / HOLDINGS
       ======================================================== */

    .holding-info {
      margin-top: 17px;

      display: grid;

      grid-template-columns:
        repeat(2, minmax(0, 1fr));

      gap: 8px;
    }

    .holding-item {
      padding: 10px;

      border-radius: 10px;

      background:
        rgba(255, 255, 255, 0.035);

      border: 1px solid
        rgba(148, 163, 184, 0.08);
    }

    .holding-label {
      color: var(--text-muted);

      font-size: 10px;
      font-weight: 700;
    }

    .holding-value {
      margin-top: 5px;

      color: var(--text-main);

      font-size: 13px;
      font-weight: 800;
    }

    .holding-profit {
      color: var(--tw-up);
    }

    .holding-loss {
      color: var(--tw-down);
    }

    .my-list-empty {
      margin-top: 14px;

      padding: 40px 22px;

      text-align: center;

      border: 1px dashed
        rgba(148, 163, 184, 0.20);

      border-radius: var(--radius-lg);

      background:
        rgba(255, 255, 255, 0.025);
    }

    .my-list-empty-icon {
      font-size: 32px;
      opacity: 0.8;
    }

    .my-list-empty-title {
      margin-top: 12px;

      font-size: 16px;
      font-weight: 800;
    }

    .my-list-empty-text {
      margin-top: 7px;

      color: var(--text-muted);

      font-size: 13px;
      line-height: 1.7;
    }

    /* ========================================================
       SEARCH RESULT CARD
       ======================================================== */

    .search-stock-result {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .search-stock-main {
      min-width: 0;
    }

    .search-stock-name {
      font-size: 17px;
      font-weight: 850;
    }

    .search-stock-code {
      margin-top: 4px;

      color: var(--text-muted);

      font-size: 11px;
      font-weight: 700;
    }

    .search-stock-price {
      margin-top: 8px;

      font-size: 14px;
      font-weight: 800;
    }

    .add-list-button {
      flex: 0 0 auto;

      padding: 10px 13px;

      color: #fff;

      border: 1px solid
        rgba(96, 165, 250, 0.30);

      border-radius: 10px;

      background:
        rgba(37, 99, 235, 0.18);

      font-size: 12px;
      font-weight: 800;
    }

    .add-list-button:hover {
      background:
        rgba(37, 99, 235, 0.28);
    }

    /* ========================================================
       LOADING / ERROR
       ======================================================== */

    .loading,
    .error-state,
    .empty-state {
      margin-top: 14px;

      padding: 35px 20px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: var(--radius-lg);

      background:
        rgba(12, 25, 42, 0.88);

      color: var(--text-muted);

      font-size: 14px;
      line-height: 1.7;
    }

    .error-state {
      color: #ff9ba3;

      border-color:
        rgba(255, 104, 117, 0.18);

      background:
        rgba(255, 104, 117, 0.06);
    }

    /* ========================================================
       FOOTER
       ======================================================== */

    .footer {
      margin-top: 32px;

      padding-top: 18px;

      border-top: 1px solid var(--border);

      text-align: center;

      color: #62748b;

      font-size: 11px;
      line-height: 1.7;
    }

    /* ========================================================
       RESPONSIVE
       ======================================================== */

    @media (max-width: 760px) {

      .app {
        width: min(
          100% - 18px,
          680px
        );

        padding-top: 12px;
      }

      .hero {
        padding: 22px 19px 20px;
      }

      .summary-grid {
        gap: 10px;
      }

      .summary-card {
        min-height: 135px;
        padding: 16px;
      }

      .summary-value {
        font-size: 25px;
      }

      .cards-grid {
        grid-template-columns: 1fr;
      }

      .tabs {
        gap: 3px;
        padding: 4px;

        top: 6px;
      }

      .tab-button {
        min-height: 40px;

        padding: 0 4px;

        font-size: 11px;
      }

      .content-header {
        align-items: flex-start;
      }
    }

    @media (max-width: 520px) {

      .summary-grid {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }

      .summary-card {
        min-height: 128px;
      }

      .summary-label {
        font-size: 11px;
      }

      .summary-value {
        font-size: 22px;
      }

      .summary-note {
        font-size: 10px;
      }

      .search-row {
        flex-direction: column;
      }

      .search-button {
        width: 100%;
      }

      .search-stock-result {
        align-items: flex-start;
        flex-direction: column;
      }

      .add-list-button {
        width: 100%;
      }

      .stock-card {
        padding: 17px;
      }

      .stock-name {
        font-size: 20px;
      }

      .stock-price {
        font-size: 28px;
      }

      .holding-info {
        grid-template-columns:
          repeat(2, minmax(0, 1fr));
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- ======================================================
       AI MARKET INTELLIGENCE
       ====================================================== -->

  <header class="hero">

    <div class="hero-label">
      AI MARKET INTELLIGENCE
    </div>

    <div class="hero-title">
      台股市場
    </div>

    <div class="hero-subtitle">
      今日量化訊號
    </div>

    <div class="hero-signal">

      <div
        id="marketStatus"
        class="market-status"
      >
        <span class="status-dot"></span>
        <span id="marketStatusText">
          載入市場狀態
        </span>
      </div>

      <div class="latest-date">
        最新交易日：
        <span id="latestMarketDate">
          --
        </span>
      </div>

    </div>

  </header>


  <!-- ======================================================
       FOUR SUMMARY CARDS
       ====================================================== -->

  <section class="summary-grid">

<script>
"use strict";

/* ============================================================
   基本設定
   ============================================================ */

const DATA_URL = "./Data/prices.json";

const WATCHLIST_STORAGE_KEY =
  "ai_market_intelligence_watchlist_v1";


/* ============================================================
   全域狀態
   ============================================================ */

let marketData = null;

let activeTab = "today";

let watchlist = [];


/* ============================================================
   DOM
   ============================================================ */

const $ = (selector) =>
  document.querySelector(selector);

const $$ = (selector) =>
  Array.from(
    document.querySelectorAll(selector)
  );


/* ============================================================
   安全數字
   ============================================================ */

function safeNumber(value) {

  if (
    value === null ||
    value === undefined ||
    value === ""
  ) {
    return null;
  }

  const number = Number(value);

  return Number.isFinite(number)
    ? number
    : null;
}


/* ============================================================
   HTML Escape
   ============================================================ */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ============================================================
   格式化
   ============================================================ */

function formatNumber(
  value,
  digits = 2
) {

  const number = safeNumber(value);

  if (number === null) {
    return "--";
  }

  return number.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: digits,
      maximumFractionDigits: digits
    }
  );
}


function formatInteger(value) {

  const number = safeNumber(value);

  if (number === null) {
    return "--";
  }

  return Math.round(number)
    .toLocaleString("zh-TW");
}


function formatPercent(value) {

  const number = safeNumber(value);

  if (number === null) {
    return "--";
  }

  const sign =
    number > 0
      ? "+"
      : "";

  return (
    sign +
    number.toFixed(2) +
    "%"
  );
}


function formatMoney(value) {

  const number = safeNumber(value);

  if (number === null) {
    return "--";
  }

  const sign =
    number > 0
      ? "+"
      : "";

  return (
    sign +
    "$" +
    Math.round(number)
      .toLocaleString("zh-TW")
  );
}


/* ============================================================
   台股漲跌顏色
   ============================================================

   台股慣用：
   上漲 = 紅色
   下跌 = 綠色
   平盤 = 中性
   ============================================================ */

function changeClass(value) {

  const number = safeNumber(value);

  if (number === null) {
    return "price-flat";
  }

  if (number > 0) {
    return "price-up";
  }

  if (number < 0) {
    return "price-down";
  }

  return "price-flat";
}


function changeText(value) {

  const number = safeNumber(value);

  if (number === null) {
    return "--";
  }

  return formatPercent(number);
}


/* ============================================================
   強度燈號
   ============================================================ */

function getStrengthInfo(item) {

  /*
   * 前台不顯示 strength_score。
   * 只把後台結果整理成：
   * 強勢 / 中性 / 弱勢
   *
   * 這裡只負責 UI 分級。
   */

  const score =
    safeNumber(
      item?.strength_score
    );

  if (score === null) {

    return {
      className: "strength-neutral",
      text: "中性"
    };
  }

  if (score >= 70) {

    return {
      className: "strength-strong",
      text: "強勢"
    };
  }

  if (score >= 45) {

    return {
      className: "strength-neutral",
      text: "中性"
    };
  }

  return {
    className: "strength-weak",
    text: "弱勢"
  };
}


/* ============================================================
   Recommendation
   ============================================================ */

function getRecommendation(
  item
) {

  /*
   * 後台已有 recommendation。
   * 前台只顯示結果。
   *
   * 不顯示：
   * - 6/6
   * - 核心條件名稱
   * - 技術指標
   */

  const value =
    item?.recommendation;

  if (
    value &&
    typeof value === "string"
  ) {

    /*
     * V10.2 的舊 recommendation
     * 可能包含：
     *
     * 符合 6/6 核心條件
     *
     * 這種文字不能直接暴露在 UI。
     */

    if (
      value.includes("核心條件")
      ||
      value.includes("/")
    ) {

      if (
        safeNumber(
          item?.core_score
        ) === 6
      ) {
        return "偏多，可分批";
      }

      return "暫不追價";
    }

    return value;
  }

  return "續抱觀察";
}


/* ============================================================
   Market status
   ============================================================ */

function isTaiwanTradingDay(
  latestDate
) {

  if (!latestDate) {
    return false;
  }

  /*
   * 這裡不假造日期。
   *
   * fetch_data.py V10.2 已經保證：
   * latest_market_date =
   * 實際有效行情最新交易日
   *
   * 因此前端只比較：
   * 最新交易日是否等於今天。
   */

  const now =
    new Date();

  const today =
    now.toLocaleDateString(
      "sv-SE",
      {
        timeZone:
          "Asia/Taipei"
      }
    );

  return latestDate === today;
}


function renderMarketStatus() {

  const latestDate =
    marketData?.latest_market_date
    ||
    marketData?.date
    ||
    null;

  const status =
    $("#marketStatus");

  const text =
    $("#marketStatusText");

  const date =
    $("#latestMarketDate");

  if (date) {

    date.textContent =
      latestDate || "--";
  }

  if (!status || !text) {
    return;
  }

  const open =
    isTaiwanTradingDay(
      latestDate
    );

  status.classList.remove(
    "open",
    "closed"
  );

  status.classList.add(
    open
      ? "open"
      : "closed"
  );

  text.textContent =
    open
      ? "今日開市"
      : "非交易日";
}


/* ============================================================
   Market index
   ============================================================ */

function findMarketIndex() {

  /*
   * V10.2 目前沒有直接產生
   * 大盤指數欄位。
   *
   * 因此不使用假數字。
   *
   * 未來 fetch_data.py 若提供：
   *
   * market_index
   * market_index_change
   *
   * 這裡即可直接接入。
   */

  const candidates = [
    marketData?.market_index,
    marketData?.summary?.market_index,
    marketData?.taiwan_index,
    marketData?.summary?.taiwan_index
  ];

  for (const candidate of candidates) {

    if (
      candidate &&
      typeof candidate === "object"
    ) {

      const value =
        safeNumber(
          candidate.value
          ??
          candidate.close
          ??
          candidate.price
        );

      const change =
        safeNumber(
          candidate.change_pct
          ??
          candidate.changePercent
        );

      if (value !== null) {

        return {
          value,
          change
        };
      }
    }

    const value =
      safeNumber(candidate);

    if (value !== null) {

      return {
        value,
        change: null
      };
    }
  }

  return null;
}


function renderMarketIndex() {

  const valueEl =
    $("#marketIndex");

  const changeEl =
    $("#marketIndexChange");

  const index =
    findMarketIndex();

  if (!index) {

    valueEl.textContent =
      "--";

    changeEl.textContent =
      "大盤資料尚未提供";

    changeEl.className =
      "summary-note";

    return;
  }

  valueEl.textContent =
    formatNumber(
      index.value,
      2
    );

  if (
    safeNumber(
      index.change
    ) === null
  ) {

    changeEl.textContent =
      "最新大盤指數";

    changeEl.className =
      "summary-note";

    return;
  }

  const change =
    safeNumber(
      index.change
    );

  changeEl.textContent =
    formatPercent(change);

  changeEl.className =
    "summary-note " +
    changeClass(change);
}


/* ============================================================
   Market wind
   ============================================================ */

function calculateMarketWind() {

  const breadth =
    marketData?.summary?.market_breadth
    ||
    marketData?.market_breadth
    ||
    null;

  if (!breadth) {

    return {
      type: "neutral",
      text: "震盪",
      icon: "🟡",
      note: "市場資料不足"
    };
  }

  const rising =
    safeNumber(
      breadth.rising
    ) ?? 0;

  const falling =
    safeNumber(
      breadth.falling
    ) ?? 0;

  const total =
    rising +
    falling;

  if (total <= 0) {

    return {
      type: "neutral",
      text: "震盪",
      icon: "🟡",
      note: "市場方向不明"
    };
  }

  const ratio =
    (rising - falling)
    / total;

  if (ratio >= 0.12) {

    return {
      type: "bullish",
      text: "偏多",
      icon: "🟢",
      note: "市場氣氛偏強"
    };
  }

  if (ratio <= -0.12) {

    return {
      type: "bearish",
      text: "偏弱",
      icon: "🔴",
      note: "市場氣氛偏弱"
    };
  }

  return {
    type: "neutral",
    text: "震盪",
    icon: "🟡",
    note: "多空力量接近"
  };
}


function renderMarketWind() {

  const result =
    calculateMarketWind();

  const icon =
    $("#windIcon");

  const text =
    $("#marketWind");

  const note =
    $("#marketWindNote");

  icon.className =
    "wind-icon " +
    result.type;

  icon.textContent =
    result.icon;

  text.className =
    "wind-value " +
    result.type;

  text.textContent =
    result.text;

  note.textContent =
    result.note;
}


/* ============================================================
   Summary
   ============================================================ */

function renderSummary() {

  const selected =
    Array.isArray(
      marketData?.today_selected
    )
      ? marketData.today_selected
      : [];

  const selectedCount =
    safeNumber(
      marketData?.summary
        ?.today_selected_count
    )
    ??
    selected.length;

  $("#selectedCount")
    .textContent =
    formatInteger(
      selectedCount
    );

  renderMarketIndex();

  renderMarketWind();

  renderHoldingSummary();
}


/* ============================================================
   Watchlist
   ============================================================ */

function loadWatchlist() {

  try {

    const raw =
      localStorage.getItem(
        WATCHLIST_STORAGE_KEY
      );

    if (!raw) {
      watchlist = [];
      return;
    }

    const parsed =
      JSON.parse(raw);

    if (Array.isArray(parsed)) {

      watchlist =
        parsed.filter(
          item =>
            item &&
            item.symbol
        );
    }

  } catch (error) {

    console.warn(
      "讀取我的清單失敗：",
      error
    );

    watchlist = [];
  }
}


function saveWatchlist() {

  try {

    localStorage.setItem(
      WATCHLIST_STORAGE_KEY,
      JSON.stringify(
        watchlist
      )
    );

  } catch (error) {

    console.warn(
      "儲存我的清單失敗：",
      error
    );
  }
}


function findWatchlistItem(
  symbol
) {

  return watchlist.find(
    item =>
      item.symbol === symbol
  );
}


function addToWatchlist(
  item
) {

  if (!item?.symbol) {
    return;
  }

  const existing =
    findWatchlistItem(
      item.symbol
    );

  if (existing) {

    alert(
      `${item.name || item.code} 已經在我的清單。`
    );

    return;
  }

  /*
   * 不預設持股。
   *
   * 新加入項目只建立：
   * symbol / code / name
   *
   * 股數與成本必須由使用者之後設定。
   */

  watchlist.push({
    symbol: item.symbol,
    code: item.code,
    name: item.name,

    shares: null,
    average_cost: null
  });

  saveWatchlist();

  alert(
    `${item.name || item.code} 已加入我的清單。`
  );

  if (activeTab === "watchlist") {
    renderActiveTab();
  }

  renderHoldingSummary();
}


/* ============================================================
   Holdings
   ============================================================ */

function getHoldingMarketData(
  watchItem
) {

  const all =
    getAllItems();

  return all.find(
    item =>
      item.symbol ===
      watchItem.symbol
  );
}


function calculateHolding(
  watchItem
) {

  const item =
    getHoldingMarketData(
      watchItem
    );

  const shares =
    safeNumber(
      watchItem.shares
    );

  const averageCost =
    safeNumber(
      watchItem.average_cost
    );

  const price =
    safeNumber(
      item?.price
    );

  if (
    shares === null
    ||
    averageCost === null
    ||
    price === null
  ) {

    return {
      shares,
      averageCost,
      price,
      marketValue: null,
      profit: null,
      returnPct: null
    };
  }

  const marketValue =
    price * shares;

  const cost =
    averageCost * shares;

  const profit =
    marketValue - cost;

  const returnPct =
    cost !== 0
      ? (profit / cost) * 100
      : null;

  return {
    shares,
    averageCost,
    price,
    marketValue,
    profit,
    returnPct
  };
}


function renderHoldingSummary() {

  const valueEl =
    $("#totalHoldingProfit");

  const returnEl =
    $("#totalHoldingReturn");

  if (!watchlist.length) {

    valueEl.textContent =
      "尚未建立持倉";

    valueEl.className =
      "summary-value summary-neutral";

    returnEl.textContent =
      "目前持倉";

    return;
  }

  let totalProfit = 0;
  let totalCost = 0;

  let hasHoldingData = false;

  for (const watchItem of watchlist) {

    const holding =
      calculateHolding(
        watchItem
      );

    if (
      holding.profit === null
      ||
      holding.shares === null
      ||
      holding.averageCost === null
    ) {
      continue;
    }

    hasHoldingData = true;

    totalProfit +=
      holding.profit;

    totalCost +=
      holding.averageCost *
      holding.shares;
  }

  if (!hasHoldingData) {

    valueEl.textContent =
      "尚未建立持倉";

    valueEl.className =
      "summary-value summary-neutral";

    returnEl.textContent =
      "已加入清單，尚未設定股數與成本";

    return;
  }

  const totalReturn =
    totalCost !== 0
      ? (
          totalProfit /
          totalCost
        ) * 100
      : null;

  valueEl.textContent =
    formatMoney(
      totalProfit
    );

  valueEl.className =
    "summary-value " +
    (
      totalProfit > 0
        ? "summary-up"
        : totalProfit < 0
          ? "summary-down"
          : "summary-neutral"
    );

  returnEl.textContent =
    totalReturn === null
      ? "目前持倉"
      : `總報酬率 ${formatPercent(totalReturn)}`;
}


/* ============================================================
   Data helpers
   ============================================================ */

function getAllItems() {

  if (!marketData) {
    return [];
  }

  const arrays = [
    marketData.today_selected,
    marketData.top10,
    marketData.etfs,
    marketData.bonds
  ];

  const map = new Map();

  for (const array of arrays) {

    if (!Array.isArray(array)) {
      continue;
    }

    for (const item of array) {

      if (!item?.symbol) {
        continue;
      }

      map.set(
        item.symbol,
        item
      );
    }
  }

  return Array.from(
    map.values()
  );
}


/* ============================================================
   Card
   ============================================================ */

function renderStockCard(

) {

  const strength =

    );

    options.myList
      ? getMyListRecommendation(

        )
      : getRecommendation(

        );

  const change =
    safeNumber(

    );

  const changeClassName =
    changeClass(
      change
    );

  const changeDisplay =
    changeText(
      change
    );

  const market =
    item?.market
    ||
    "";

  let holdingHtml = "";

  if (
    options.myList &&
    options.watchItem
  ) {

    const holding =
      calculateHolding(
        options.watchItem
      );

    const profitClass =
      holding.profit === null
        ? ""
        : holding.profit > 0
          ? "holding-profit"
          : holding.profit < 0
            ? "holding-loss"
            : "";

    holdingHtml = `
      <div class="holding-info">

        <div class="holding-item">
          <div class="holding-label">
            持有股數
          </div>
          <div class="holding-value">
            ${
              holding.shares === null
                ? "--"
                : formatInteger(
                    holding.shares
                  ) + " 股"
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-label">
            平均成本
          </div>
          <div class="holding-value">
            ${
              holding.averageCost === null
                ? "--"
                : formatNumber(
                    holding.averageCost,
                    2
                  )
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-label">
            目前市值
          </div>
          <div class="holding-value">
            ${
              holding.marketValue === null
                ? "--"
                : "$" +
                  Math.round(
                    holding.marketValue
                  ).toLocaleString(
                    "zh-TW"
                  )
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-label">
            損益
          </div>
          <div
            class="holding-value ${profitClass}"
          >
            ${
              holding.profit === null
                ? "--"
                : formatMoney(
                    holding.profit
                  )
            }
          </div>
        </div>

        <div class="holding-item">
          <div class="holding-label">
            報酬率
          </div>
          <div
            class="holding-value ${profitClass}"
          >
            ${
              holding.returnPct === null
                ? "--"
                : formatPercent(
                    holding.returnPct
                  )
            }
          </div>
        </div>

      </div>
    `;
  }

  return `
    <article class="stock-card">

      <div class="stock-top">

        <div>

          <div class="stock-name">
            ${escapeHtml(
              item?.name ||
              item?.code ||
              "--"
            )}
          </div>

          <div class="stock-code">
            ${escapeHtml(
              item?.code ||
              "--"
            )}
          </div>

        </div>

        ${
          market
            ? `
              <div class="market-tag">
                ${escapeHtml(
                  market === "TW"
                    ? "上市"
                    : market === "TWO"
                      ? "上櫃"
                      : market
                )}
              </div>
            `
            : ""
        }

      </div>


      <div class="stock-price-row">

        <div class="stock-price">
          ${formatNumber(
            item?.price,
            2
          )}
        </div>

        <div
          class="
            stock-change
            ${changeClassName}
          "
        >
          ${changeDisplay}
        </div>

      </div>


      ${holdingHtml}


      <div class="stock-divider"></div>


      <div class="stock-section-label">
        指數強度
      </div>

      <div class="strength-row">

        <span
          class="
            strength-light
            ${strength.className}
          "
        ></span>

        <span
          class="
            strength-text
            ${strength.className}
          "
        >
          ${escapeHtml(
            strength.text
          )}
        </span>

      </div>


      <div class="recommendation">

        <span class="recommendation-label">
          建議
        </span>

        ${escapeHtml(
          recommendation
        )}

      </div>

    </article>
  `;
}


/* ============================================================
   我的清單建議
   ============================================================ */

function getMyListRecommendation(
  item,
  watchItem
) {

  const holding =
    calculateHolding(
      watchItem
    );

  const strength =
    getStrengthInfo(
      item
    );

  const returnPct =
    holding.returnPct;

  /*
   * 這裡只輸出使用者看得懂的建議。
   * 不顯示後台技術條件。
   */

  if (
    returnPct !== null
    &&
    returnPct >= 20
    &&
    strength.text === "強勢"
  ) {

    return "持有觀察，不追價";
  }

  if (
    returnPct !== null
    &&
    returnPct <= -10
  ) {

    return "暫停加碼";
  }

  if (
    strength.text === "弱勢"
  ) {

    return "暫停加碼";
  }

  if (
    strength.text === "強勢"
    &&
    (
      returnPct === null
      ||
      returnPct < 15
    )
  ) {

    return "偏多，可分批加碼";
  }

  if (
    strength.text === "中性"
  ) {

    return "持有觀察，不追價";
  }

  return "續抱觀察";
}


/* ============================================================
   Tab data
   ============================================================ */

function getTabItems(
  tab
) {

  if (!marketData) {
    return [];
  }

  switch (tab) {

    case "today":
      return Array.isArray(
        marketData.today_selected
      )
        ? marketData.today_selected
        : [];

    case "top10":
      return Array.isArray(
        marketData.top10
      )
        ? marketData.top10
        : [];

    case "etf":
      return Array.isArray(
        marketData.etfs
      )
        ? marketData.etfs
        : [];

    case "bond":
      return Array.isArray(
        marketData.bonds
      )
        ? marketData.bonds
        : [];

    case "watchlist":
      return [];

    default:
      return [];
  }
}


/* ============================================================
   Tab title
   ============================================================ */

function getTabMeta(
  tab
) {

  switch (tab) {

    case "today":
      return {
        title: "今日精選",
        subtitle: "最新交易日篩選結果"
      };

    case "top10":
      return {
        title: "Top 10",
        subtitle: "最新交易日重點標的"
      };

    case "etf":
      return {
        title: "ETF",
        subtitle: "ETF 市場資料"
      };

    case "bond":
      return {
        title: "債券",
        subtitle: "債券市場資料"
      };

    case "watchlist":
      return {
        title: "我的清單",
        subtitle: "你的持倉與追蹤標的"
      };

    default:
      return {
        title: "",
        subtitle: ""
      };
  }
}


/* ============================================================
   Render active tab
   ============================================================ */

function renderActiveTab() {

  const meta =
    getTabMeta(
      activeTab
    );

  $("#contentTitle")
    .textContent =
    meta.title;

  $("#contentSubtitle")
    .textContent =
    meta.subtitle;

  if (
    activeTab === "watchlist"
  ) {

    renderWatchlistTab();
    return;
  }

  const items =
    getTabItems(
      activeTab
    );

  $("#contentCount")
    .textContent =
    `${items.length} 筆`;

  if (!items.length) {

    $("#contentArea")
      .innerHTML = `
        <div class="empty-state">
          此分頁目前沒有可顯示的資料。
        </div>
      `;

    return;
  }

  $("#contentArea")
    .innerHTML = `
      <div class="cards-grid">
        ${items
          .map(
            item =>
              renderStockCard(
                item
              )
          )
          .join("")
        }
      </div>
  `;
}


/* ============================================================
   Render watchlist
   ============================================================ */

function renderWatchlistTab() {

  $("#contentCount")
    .textContent =
    `${watchlist.length} 筆`;

  if (!watchlist.length) {

    $("#contentArea")
      .innerHTML = `
        <div class="my-list-empty">

          <div class="my-list-empty-icon">
            🔍
          </div>

          <div class="my-list-empty-title">
            我的清單目前是空的
          </div>

          <div class="my-list-empty-text">
            使用上方「查詢個股」搜尋股票，
            <br>
            再加入你的清單。
          </div>

        </div>
      `;

    return;
  }

  const cards = [];

  for (const watchItem of watchlist) {

    const item =
      getHoldingMarketData(
        watchItem
      );

    if (!item) {

      /*
       * 如果該股票不在目前四組資料，
       * 仍然保留使用者的清單。
       */

      cards.push(
        renderMissingWatchlistCard(
          watchItem
        )
      );

      continue;
    }

    cards.push(
      renderStockCard(
        item,
        {
          myList: true,
          watchItem
        }
      )
    );
  }

  $("#contentArea")
    .innerHTML = `
      <div class="cards-grid">
        ${cards.join("")}
      </div>
    `;
}

  watchItem
) {

  return `
    <article class="stock-card">

      <div class="stock-top">

        <div>

          <div class="stock-name">
            ${escapeHtml(
              watchItem.name ||
              watchItem.code ||
              "--"
            )}
          </div>

          <div class="stock-code">
            ${escapeHtml(
              watchItem.code ||
              "--"
            )}
          </div>

        </div>

      </div>

      <div class="stock-price-row">

        <div class="stock-price">
          --
        </div>

        <div class="stock-change price-flat">
          --
        </div>

      </div>

      <div class="holding-info">

        <div class="holding-item">
          <div class="holding-label">
            持有股數
          </div>
          <div class="holding-value">

          </div>

          </div>
        </div>

      <div class="recommendation">

        </span>

      </div>

/* ============================================================
   Search
   ============================================================ */

function searchStocks(
  query
) {

  const keyword =
    String(
      query || ""
    )
      .trim()
      .toLowerCase();

  if (!keyword) {
    return [];
  }

  const all =
    getAllItems();

  return all.filter(
    item => {

      const name =
        String(
          item?.name || ""
        ).toLowerCase();

      const code =
        String(
          item?.code || ""
        ).toLowerCase();

      const symbol =
        String(
          item?.symbol || ""
        ).toLowerCase();

      return (
        name.includes(keyword)
        ||
        code.includes(keyword)
        ||
        symbol.includes(keyword)
      );
    }
  );
}


function renderSearchResult(
  results,
  query
) {

  const box =
    $("#searchResult");

  box.classList.add(
    "show"
  );

  if (!query.trim()) {

    box.innerHTML = `
      <div class="search-empty">
        請輸入股票名稱或代號。
      </div>
    `;

    return;
  }

  if (!results.length) {

    box.innerHTML = `
      <div class="search-empty">
        找不到「${escapeHtml(
          query
        )}」的市場資料。
      </div>
    `;

    return;
  }

  box.innerHTML =
    results
      .slice(0, 10)
      .map(
        item => {

          const change =
            safeNumber(
              item?.change_pct
            );

          return `
            <div class="search-stock-result">

              <div class="search-stock-main">

                <div class="search-stock-name">
                  ${escapeHtml(
                    item?.name ||
                    item?.code ||
                    "--"
                  )}
                </div>

                <div class="search-stock-code">
                  ${escapeHtml(
                    item?.code ||
                    "--"
                  )}
                </div>

                <div class="search-stock-price">

                  ${formatNumber(
                    item?.price,
                    2
                  )}

                  <span
                    class="${changeClass(
                      change
                    )}"
                  >
                    ${changeText(
                      change
                    )}
                  </span>

                </div>

              </div>

              <button
                class="add-list-button"
                type="button"
                data-add-symbol="${escapeHtml(
                  item?.symbol || ""
                )}"
              >
                ＋加入我的清單
              </button>

            </div>
          `;
        }
      )
      .join("");

  box
    .querySelectorAll(
      "[data-add-symbol]"
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const symbol =
              button.dataset.addSymbol;

            const item =
              getAllItems().find(
                stock =>
                  stock.symbol ===
                  symbol
              );

            if (item) {
              addToWatchlist(
                item
              );
            }
          }
        );
      }
    );
}


/* ============================================================
   Search action
   ============================================================ */

function performSearch() {

  const input =
    $("#stockSearchInput");

  const query =
    input.value;

  const results =
    searchStocks(
      query
    );

  renderSearchResult(
    results,
    query
  );
}


/* ============================================================
   Tabs
   ============================================================ */

function initTabs() {

  $$(".tab-button")
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const tab =
              button.dataset.tab;

            activeTab =
              tab;

            $$(".tab-button")
              .forEach(
                item =>
                  item.classList.toggle(
                    "active",
                    item === button
                  )
              );

            renderActiveTab();

            window.scrollTo(
              {
                top:
                  Math.max(
                    0,
                    document.querySelector(
                      ".tabs"
                    ).offsetTop - 12
                  ),
                behavior: "smooth"
              }
            );
          }
        );
      }
    );
}


/* ============================================================
   Load prices.json
   ============================================================ */

async function loadMarketData() {

  const content =
    $("#contentArea");

  try {

    const response =
      await fetch(
        `${DATA_URL}?t=${Date.now()}`,
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {

      throw new Error(
        `HTTP ${response.status}`
      );
    }

    const data =
      await response.json();

    if (
      !data
      ||
      typeof data !== "object"
    ) {

      throw new Error(
        "prices.json 格式無效"
      );
    }

    marketData =
      data;

    renderMarketStatus();

    renderSummary();

    renderActiveTab();

  } catch (error) {

    console.error(
      "prices.json 讀取失敗：",
      error
    );

    content.innerHTML = `
      <div class="error-state">

        資料尚未更新

        <br><br>

        無法讀取最新市場資料，
        請確認 Data/prices.json
        是否已由 GitHub Actions 更新。

      </div>
    `;

    $("#selectedCount")
      .textContent = "--";

    $("#latestMarketDate")
      .textContent = "--";

    $("#marketStatusText")
      .textContent =
      "資料尚未更新";

    $("#marketIndex")
      .textContent = "--";

    $("#marketWind")
      .textContent = "—";

    $("#marketWindNote")
      .textContent =
      "等待市場資料";
  }
}


/* ============================================================
   初始化
   ============================================================ */

function init() {

  loadWatchlist();

  initTabs();

  $("#searchButton")
    .addEventListener(
      "click",
      performSearch
    );

  $("#stockSearchInput")
    .addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter"
        ) {

          event.preventDefault();

          performSearch();
        }
      }
    );

  loadMarketData();
}


/* ============================================================
   Start
   ============================================================ */

document.addEventListener(
  "DOMContentLoaded",
  init
);

</script>
