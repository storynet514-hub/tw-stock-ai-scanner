<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08101b">
<meta name="description" content="台股 AI 選股 TOP 30">
<title>台股 AI 選股</title>

<style>
:root{
  --bg:#070b12;
  --card:#101722;
  --card2:#151e2b;
  --line:rgba(255,255,255,.08);
  --text:#f5f7fa;
  --muted:#8d99a9;
  --blue:#58a8ff;
  --green:#24d69d;
  --red:#ff6170;
  --gold:#f4c96b;
  --purple:#a98bff;
  --radius:16px;
}

*{
  box-sizing:border-box;
}

html{
  background:var(--bg);
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 10% 0,
      rgba(70,140,230,.12),
      transparent 28%
    ),
    var(--bg);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Noto Sans TC",
    "PingFang TC",
    "Microsoft JhengHei",
    sans-serif;
  -webkit-font-smoothing:antialiased;
}

button,
input,
select{
  font:inherit;
}

button{
  -webkit-tap-highlight-color:transparent;
}

.app{
  width:min(1180px,100%);
  margin:auto;
  padding:
    max(14px,env(safe-area-inset-top))
    14px
    max(40px,env(safe-area-inset-bottom));
}

/* =========================
   HEADER
========================= */

.top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:14px;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo{
  width:40px;
  height:40px;
  border-radius:12px;

  display:grid;
  place-items:center;

  background:
    linear-gradient(
      135deg,
      rgba(88,168,255,.22),
      rgba(169,139,255,.18)
    );

  border:1px solid var(--line);

  font-size:19px;
}

.title{
  font-size:18px;
  font-weight:900;
  line-height:1.2;
}

.sub{
  margin-top:3px;
  color:var(--muted);
  font-size:11px;
}

.status{
  display:flex;
  align-items:center;
  gap:6px;

  color:var(--muted);
  font-size:11px;
}

.dot{
  width:7px;
  height:7px;
  border-radius:50%;

  background:var(--green);

  box-shadow:
    0 0 10px rgba(36,214,157,.7);
}

/* =========================
   HERO
========================= */

.hero{
  padding:18px;

  border:1px solid var(--line);
  border-radius:20px;

  background:
    linear-gradient(
      145deg,
      #111d2b,
      #0b111a
    );

  margin-bottom:12px;
}

.hero h1{
  margin:0;

  font-size:24px;
  line-height:1.25;
  font-weight:900;
}

.hero p{
  margin:7px 0 0;

  color:var(--muted);

  font-size:13px;
  line-height:1.55;
}

.updated{
  margin-top:11px;

  color:var(--muted);

  font-size:11px;
}

/* =========================
   SEARCH
========================= */

.search{
  position:sticky;
  top:0;

  z-index:10;

  padding:8px 0;

  background:
    linear-gradient(
      var(--bg) 75%,
      transparent
    );

  backdrop-filter:blur(8px);
}

.searchbox{
  display:flex;
  align-items:center;
  gap:8px;

  background:var(--card);

  border:1px solid var(--line);

  border-radius:13px;

  padding:0 13px;

  height:46px;
}

.searchbox span{
  color:var(--muted);
  font-size:18px;
}

.searchbox input{
  width:100%;

  border:0;
  outline:0;

  background:transparent;

  color:var(--text);

  font-size:16px;
}

.searchbox input::placeholder{
  color:#667284;
}

/* =========================
   SECTION
========================= */

.section{
  margin-top:16px;
}

.section-head{
  display:flex;
  align-items:end;
  justify-content:space-between;

  margin-bottom:9px;
}

.section-title{
  font-size:18px;
  font-weight:900;
}

.section-count{
  color:var(--muted);
  font-size:12px;
}

/* =========================
   STOCK LIST
========================= */

.list{
  display:grid;
  gap:8px;
}

.stock{
  display:grid;

  grid-template-columns:
    42px
    minmax(0,1fr)
    auto;

  gap:10px;

  align-items:center;

  padding:13px;

  border:1px solid var(--line);

  border-radius:15px;

  background:
    linear-gradient(
      145deg,
      var(--card),
      #0d141e
    );

  transition:
    transform .15s ease,
    border-color .15s ease;
}

.stock:hover{
  border-color:
    rgba(88,168,255,.25);
}

.stock:active{
  transform:scale(.99);
}

.rank{
  font-size:15px;
  font-weight:900;

  color:var(--gold);

  text-align:center;
}

.name-row{
  display:flex;
  align-items:center;

  gap:7px;

  min-width:0;
}

.name{
  font-size:16px;
  font-weight:850;

  white-space:nowrap;

  overflow:hidden;
  text-overflow:ellipsis;
}

.code{
  color:var(--muted);

  font-size:11px;

  white-space:nowrap;
}

.badges{
  display:flex;

  gap:5px;

  margin-top:5px;

  flex-wrap:wrap;
}

.badge{
  padding:3px 7px;

  border-radius:999px;

  font-size:10px;

  background:
    rgba(255,255,255,.05);

  color:var(--muted);
}

.badge.up{
  color:var(--green);

  background:
    rgba(36,214,157,.09);
}

.badge.down{
  color:var(--red);

  background:
    rgba(255,97,112,.09);
}

.price{
  text-align:right;

  white-space:nowrap;
}

.price-main{
  font-size:18px;

  font-weight:900;
}

.change{
  margin-top:3px;

  font-size:12px;

  font-weight:750;
}

.up{
  color:var(--green);
}

.down{
  color:var(--red);
}

.neutral{
  color:var(--muted);
}

/* =========================
   EMPTY / ERROR
========================= */

.empty{
  padding:32px 15px;

  text-align:center;

  color:var(--muted);

  border:
    1px dashed var(--line);

  border-radius:15px;
}

.error{
  padding:14px;

  border-radius:13px;

  background:
    rgba(255,97,112,.08);

  border:
    1px solid rgba(255,97,112,.18);

  color:#ff9da7;

  font-size:13px;
}

/* =========================
   DETAIL SHEET
========================= */

.detail{
  display:none;

  position:fixed;

  inset:0;

  z-index:30;

  background:
    rgba(0,0,0,.62);

  padding:12px;

  align-items:flex-end;
}

.detail.open{
  display:flex;
}

.sheet{
  width:min(600px,100%);

  max-height:88vh;

  overflow:auto;

  margin:auto;

  border:
    1px solid var(--line);

  border-radius:20px;

  background:#0d141e;

  padding:18px;

  box-shadow:
    0 20px 70px rgba(0,0,0,.5);
}

.sheet-head{
  display:flex;

  justify-content:space-between;

  gap:10px;
}

.close{
  border:0;

  background:
    rgba(255,255,255,.06);

  color:var(--text);

  width:44px;
  height:44px;

  border-radius:11px;

  font-size:22px;

  cursor:pointer;
}

.detail-name{
  font-size:22px;

  font-weight:900;
}

.detail-code{
  color:var(--muted);

  font-size:12px;

  margin-top:3px;
}

.detail-price{
  font-size:28px;

  font-weight:950;

  margin-top:16px;
}

.metrics{
  display:grid;

  grid-template-columns:
    repeat(2,1fr);

  gap:8px;

  margin-top:14px;
}

.metric{
  padding:12px;

  border-radius:12px;

  background:var(--card);

  border:
    1px solid var(--line);
}

.metric-label{
  font-size:11px;

  color:var(--muted);
}

.metric-value{
  margin-top:4px;

  font-size:17px;

  font-weight:850;
}

.note{
  margin-top:14px;

  color:var(--muted);

  font-size:11px;

  line-height:1.6;
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){

  .app{
    padding:
      22px
      24px
      50px;
  }

  .hero{
    padding:24px;
  }

  .hero h1{
    font-size:28px;
  }

  .list{
    grid-template-columns:
      repeat(2,minmax(0,1fr));
  }

  .stock{
    min-height:88px;
  }
}

/* =========================
   SMALL PHONE
========================= */

@media(max-width:380px){

  .app{
    padding-left:10px;
    padding-right:10px;
  }

  .stock{
    grid-template-columns:
      34px
      minmax(0,1fr)
      auto;

    gap:7px;

    padding:11px;
  }

  .name{
    font-size:15px;
  }

  .price-main{
    font-size:16px;
  }

  .hero h1{
    font-size:22px;
  }

  .metrics{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="top">

    <div class="brand">

      <div class="logo">
        📈
      </div>

      <div>

        <div class="title">
          台股 AI 選股
        </div>

        <div class="sub">
          每日精選 TOP 30
        </div>

      </div>

    </div>

    <div class="status">

      <i class="dot"></i>

      資料正常

    </div>

  </header>


  <!-- HERO -->
  <section class="hero">

    <h1>
      今日精選個股
    </h1>

    <p>
      直接查看系統篩選出的前 30 檔標的。
    </p>

    <div
      class="updated"
      id="updated"
    >
      資料更新時間：讀取中…
    </div>

  </section>


  <!-- SEARCH -->
  <div class="search">

    <label class="searchbox">

      <span>
        ⌕
      </span>

      <input
        id="search"
        type="search"
        placeholder="搜尋股票代號或名稱"
        autocomplete="off"
      >

    </label>

  </div>


  <!-- TOP 30 -->
  <section class="section">

    <div class="section-head">

      <div class="section-title">
        TOP 30
      </div>

      <div
        class="section-count"
        id="count"
      >
        讀取中…
      </div>

    </div>

    <div
      id="list"
      class="list"
    >

      <div class="empty">
        正在載入股票資料…
      </div>

    </div>

  </section>

</div>


<!-- DETAIL -->
<div
  id="detail"
  class="detail"
  aria-hidden="true"
>

  <div class="sheet">

    <div class="sheet-head">

      <div>

        <div
          id="dName"
          class="detail-name"
        >
          —
        </div>

        <div
          id="dCode"
          class="detail-code"
        >
          —
        </div>

      </div>

      <button
        class="close"
        id="close"
        aria-label="關閉"
      >
        ×
      </button>

    </div>


    <div
      id="dPrice"
      class="detail-price"
    >
      —
    </div>


    <div
      id="metrics"
      class="metrics"
    >
    </div>


    <div class="note">
      個股詳細行情資訊。
    </div>

  </div>

</div>


<script>

const DATA_URL =
  'Data/prices.json';


const state = {

  stocks: [],

  top30: [],

  updatedAt: '',

  loaded: false

};


const $ =
  id => document.getElementById(id);


/* =========================
   DATA HELPERS
========================= */

function num(value){

  const n =
    Number(value);

  return Number.isFinite(n)
    ? n
    : null;

}


function price(stock){

  return num(
    stock?.price ??
    stock?.close ??
    stock?.last_price ??
    stock?.current_price
  );

}


function change(stock){

  return num(
    stock?.change_pct ??
    stock?.change_percent ??
    stock?.pct_change ??
    stock?.change
  );

}


function rsi(stock){

  const n =
    num(stock?.rsi);

  if(
    n !== null &&
    n >= 0 &&
    n <= 100
  ){

    return n;

  }

  return null;

}


function fmtPrice(value){

  if(value === null){

    return '—';

  }

  return value.toLocaleString(
    'zh-TW',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );

}


function fmtPct(value){

  if(value === null){

    return '—';

  }

  return `${
    value >= 0
      ? '+'
      : ''
  }${value.toFixed(2)}%`;

}


function esc(value){

  return String(
    value ?? ''
  ).replace(
    /[&<>'"]/g,
    match => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[match])
  );

}


function getCode(stock){

  return (
    stock?.code ??
    stock?.id ??
    stock?.symbol ??
    ''
  );

}


function getName(stock){

  return (
    stock?.name ??
    stock?.stock_name ??
    stock?.display_name ??
    getCode(stock)
  );

}


/* =========================
   SIMPLE RESULT BADGES
========================= */

function signals(stock){

  const c =
    stock?.conditions || {};

  const output = [];


  /*
    前台只顯示簡單結果標籤。
    不顯示核心計算方式。
  */

  if(
    c.rsi_above_50 === true
  ){

    output.push(
      '<span class="badge up">強勢</span>'
    );

  }


  if(
    c.volume_expand === true
  ){

    output.push(
      '<span class="badge">量能</span>'
    );

  }


  if(
    c.macd_golden_cross === true
  ){

    output.push(
      '<span class="badge">MACD</span>'
    );

  }


  if(
    c.kd_golden_cross === true
  ){

    output.push(
      '<span class="badge">KD</span>'
    );

  }


  return output.join('');

}


/* =========================
   RENDER TOP 30
========================= */

function render(){

  const query =
    $('search')
      .value
      .trim()
      .toLowerCase();


  const rows =
    state.top30.filter(
      stock => {

        if(!query){

          return true;

        }


        return (
          String(
            getCode(stock)
          )
          .toLowerCase()
          .includes(query)
          ||
          String(
            getName(stock)
          )
          .toLowerCase()
          .includes(query)
        );

      }
    );


  $('count').textContent =
    `顯示 ${rows.length} / 30`;


  if(!rows.length){

    $('list').innerHTML =
      '<div class="empty">找不到符合的股票</div>';

    return;

  }


  $('list').innerHTML =
    rows.map(
      (stock,index) => {

        const p =
          price(stock);

        const ch =
          change(stock);

        const code =
          getCode(stock);

        const name =
          getName(stock);


        const cls =
          ch === null
            ? 'neutral'
            : ch >= 0
              ? 'up'
              : 'down';


        return `

          <article
            class="stock"
            data-code="${esc(code)}"
          >

            <div class="rank">

              ${String(
                index + 1
              ).padStart(2,'0')}

            </div>


            <div>

              <div class="name-row">

                <div class="name">
                  ${esc(name)}
                </div>

                <div class="code">
                  ${esc(code)}
                </div>

              </div>


              <div class="badges">

                ${signals(stock)}

              </div>

            </div>


            <div class="price">

              <div class="price-main">

                $${fmtPrice(p)}

              </div>

              <div
                class="change ${cls}"
              >

                ${fmtPct(ch)}

              </div>

            </div>

          </article>

        `;

      }
    )
    .join('');


  document
    .querySelectorAll('.stock')
    .forEach(
      element => {

        element.addEventListener(
          'click',
          () => {

            openDetail(
              element.dataset.code
            );

          }
        );

      }
    );

}


/* =========================
   FIND STOCK
========================= */

function findStock(code){

  return (
    state.top30.find(
      stock =>
        String(
          getCode(stock)
        ) === String(code)
    )
    ||
    state.stocks.find(
      stock =>
        String(
          getCode(stock)
        ) === String(code)
    )
  );

}


/* =========================
   DETAIL
========================= */

function openDetail(code){

  const stock =
    findStock(code);


  if(!stock){

    return;

  }


  const p =
    price(stock);

  const ch =
    change(stock);

  const rv =
    rsi(stock);


  $('dName').textContent =
    getName(stock);

  $('dCode').textContent =
    getCode(stock);


  $('dPrice').textContent =
    `$${fmtPrice(p)}  ${fmtPct(ch)}`;


  $('metrics').innerHTML = [

    [
      'RSI',
      rv === null
        ? '—'
        : rv.toFixed(2)
    ],

    [
      'MACD',
      stock?.macd ?? '—'
    ],

    [
      'KD K',
      stock?.kd_k ?? '—'
    ],

    [
      'KD D',
      stock?.kd_d ?? '—'
    ],

    [
      '成交量',
      stock?.volume ?? '—'
    ],

    [
      '5日均量',
      stock?.volume_ma5 ?? '—'
    ]

  ]
  .map(
    ([label,value]) => `

      <div class="metric">

        <div class="metric-label">
          ${label}
        </div>

        <div class="metric-value">
          ${esc(value)}
        </div>

      </div>

    `
  )
  .join('');


  $('detail')
    .classList
    .add('open');


  $('detail')
    .setAttribute(
      'aria-hidden',
      'false'
    );

}


/* =========================
   CLOSE DETAIL
========================= */

function closeDetail(){

  $('detail')
    .classList
    .remove('open');


  $('detail')
    .setAttribute(
      'aria-hidden',
      'true'
    );

}


/* =========================
   LOAD DATA
========================= */

async function load(){

  try{

    const response =
      await fetch(
        `${DATA_URL}?t=${Date.now()}`,
        {
          cache:'no-store'
        }
      );


    if(!response.ok){

      throw new Error(
        `HTTP ${response.status}`
      );

    }


    const data =
      await response.json();


    state.stocks =
      Array.isArray(data.stocks)
        ? data.stocks
        : [];


    /*
      優先使用後端已經產生的 TOP30。
      前端不重新計算選股排名。
    */

    state.top30 =
      Array.isArray(data.top30)
        ? data.top30.slice(0,30)
        : [];


    state.updatedAt =
      data.updated_at ||
      data.generated_at ||
      data.timestamp ||
      '';


    $('updated').textContent =
      `資料更新時間：${
        state.updatedAt || '—'
      }`;


    state.loaded =
      true;


    render();

  }
  catch(error){

    console.error(error);


    $('count').textContent =
      '載入失敗';


    $('list').innerHTML = `

      <div class="error">

        股票資料目前無法載入。
        請稍後重新整理。

      </div>

    `;

  }

}


/* =========================
   EVENTS
========================= */

$('search')
  .addEventListener(
    'input',
    render
  );


$('close')
  .addEventListener(
    'click',
    closeDetail
  );


$('detail')
  .addEventListener(
    'click',
    event => {

      if(
        event.target ===
        $('detail')
      ){

        closeDetail();

      }

    }
  );


document
  .addEventListener(
    'keydown',
    event => {

      if(
        event.key === 'Escape'
      ){

        closeDetail();

      }

    }
  );


/* =========================
   START
========================= */

load();

</script>

</body>
</html>
