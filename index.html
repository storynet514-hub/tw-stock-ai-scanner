<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <title>AI Market Intelligence</title>

  <style>
    :root {
      --bg: #f3f4f6;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --line: #e5e7eb;

      --green: #16a34a;
      --green-bg: #ecfdf3;

      --yellow: #d97706;
      --yellow-bg: #fff7ed;

      --red: #dc2626;
      --red-bg: #fef2f2;

      --blue: #2563eb;
      --blue-bg: #eff6ff;

      --shadow:
        0 2px 10px rgba(0, 0, 0, 0.05);

      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Noto Sans TC",
        "PingFang TC",
        "Microsoft JhengHei",
        sans-serif;
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }

    /* ======================================================
       Header
       ====================================================== */

    .market-header {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 22px 20px;
      box-shadow: var(--shadow);
      margin-bottom: 14px;
    }

    .market-kicker {
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1.8px;
      color: #4b5563;
      margin-bottom: 8px;
    }

    .market-title {
      font-size: 28px;
      line-height: 1.15;
      font-weight: 800;
      margin: 0;
    }

    .market-subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 600;
    }

    /* ======================================================
       Summary
       ====================================================== */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .summary-label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 700;
    }

    .summary-number {
      font-size: 34px;
      line-height: 1;
      margin-top: 8px;
      font-weight: 850;
      letter-spacing: -1px;
    }

    .summary-note {
      margin-top: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    /* ======================================================
       Tabs
       ====================================================== */

    .tabs-wrap {
      position: sticky;
      top: 0;
      z-index: 20;

      background: rgba(243, 244, 246, 0.95);
      backdrop-filter: blur(10px);

      padding: 8px 0;
      margin-bottom: 12px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;

      background: #e5e7eb;
      border-radius: 15px;
      padding: 5px;
    }

    .tab {
      border: 0;
      background: transparent;
      color: #6b7280;

      border-radius: 11px;
      padding: 11px 5px;

      font-size: 13px;
      font-weight: 750;

      cursor: pointer;
      transition:
        background 0.18s ease,
        color 0.18s ease,
        box-shadow 0.18s ease;
    }

    .tab.active {
      background: #ffffff;
      color: #111827;
      box-shadow:
        0 2px 7px rgba(0, 0, 0, 0.08);
    }

    /* ======================================================
       Section
       ====================================================== */

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;

      margin: 20px 2px 12px;
    }

    .section-title {
      margin: 0;
      font-size: 21px;
      font-weight: 850;
    }

    .section-note {
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }

    .market-date {
      flex-shrink: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
    }

    /* ======================================================
       Stock cards
       ====================================================== */

    .stock-list {
      display: grid;
      gap: 12px;
    }

    .stock-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);

      padding: 18px;
    }

    .stock-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .stock-name {
      font-size: 23px;
      line-height: 1.15;
      font-weight: 850;
      letter-spacing: -0.4px;
    }

    .stock-code {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .stock-market {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f3f4f6;
      color: #6b7280;
      font-size: 11px;
      font-weight: 750;
      white-space: nowrap;
    }

    .price-row {
      display: flex;
      align-items: baseline;
      gap: 18px;
      margin-top: 18px;
    }

    .price {
      font-size: 27px;
      font-weight: 850;
      letter-spacing: -0.5px;
    }

    .change {
      font-size: 17px;
      font-weight: 800;
    }

    .change.up {
      color: var(--green);
    }

    .change.down {
      color: var(--red);
    }

    .change.flat {
      color: var(--muted);
    }

    .stock-divider {
      height: 1px;
      background: var(--line);
      margin: 17px 0;
    }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .result-block {
      min-width: 0;
    }

    .result-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .strength {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      font-size: 15px;
      font-weight: 800;
    }

    .strength-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .strength.strong {
      color: var(--green);
    }

    .strength.strong .strength-dot {
      background: var(--green);
    }

    .strength.neutral {
      color: var(--yellow);
    }

    .strength.neutral .strength-dot {
      background: var(--yellow);
    }

    .strength.weak {
      color: var(--red);
    }

    .strength.weak .strength-dot {
      background: var(--red);
    }

    .recommendation {
      font-size: 14px;
      line-height: 1.45;
      font-weight: 750;
    }

    /* ======================================================
       Holdings
       ====================================================== */

    .holding-area {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--line);
    }

    .holding-title {
      font-size: 12px;
      color: var(--muted);
      font-weight: 750;
      margin-bottom: 10px;
    }

    .holding-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 14px;
    }

    .holding-item {
      display: flex;
      justify-content: space-between;
      gap: 10px;

      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
    }

    .holding-item-label {
      color: var(--muted);
      font-size: 12px;
    }

    .holding-item-value {
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .profit-positive {
      color: var(--green);
    }

    .profit-negative {
      color: var(--red);
    }

    .profit-neutral {
      color: var(--muted);
    }

    /* ======================================================
       Empty
       ====================================================== */

    .empty-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 35px 20px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .empty-title {
      font-size: 17px;
      font-weight: 800;
    }

    .empty-note {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    /* ======================================================
       Loading
       ====================================================== */

    .loading {
      padding: 40px 20px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
    }

    .loading-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
      margin-right: 6px;
      animation: pulse 1s infinite ease-in-out;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    /* ======================================================
       Footer
       ====================================================== */

    .footer {
      margin-top: 28px;
      text-align: center;
      color: #9ca3af;
      font-size: 11px;
      line-height: 1.6;
    }

    /* ======================================================
       Desktop
       ====================================================== */

    @media (min-width: 760px) {

      .app {
        padding-left: 24px;
        padding-right: 24px;
      }

      .summary-grid {
        grid-template-columns: repeat(3, 1fr);
      }

      .stock-list {
        grid-template-columns: repeat(2, 1fr);
      }

      .stock-card {
        min-height: 250px;
      }
    }

    /* ======================================================
       Mobile
       ====================================================== */

    @media (max-width: 520px) {

      .app {
        padding:
          12px
          12px
          80px;
      }

      .market-header {
        padding: 19px 17px;
      }

      .market-title {
        font-size: 25px;
      }

      .summary-number {
        font-size: 29px;
      }

      .tabs {
        gap: 3px;
        padding: 4px;
      }

      .tab {
        padding: 10px 2px;
        font-size: 11px;
      }

      .section-head {
        align-items: flex-start;
      }

      .market-date {
        font-size: 10px;
      }

      .stock-card {
        padding: 16px;
      }

      .stock-name {
        font-size: 21px;
      }

      .price {
        font-size: 25px;
      }

      .change {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- =====================================================
       頂部市場區
       ===================================================== -->

  <header class="market-header">

    <div class="market-kicker">
      AI MARKET INTELLIGENCE
    </div>

    <h1 class="market-title">
      台股市場
    </h1>

    <div class="market-subtitle">
      今日量化訊號
    </div>

  </header>


  <!-- =====================================================
       Summary
       ===================================================== -->

  <section class="summary-grid">

    <div class="summary-card">

      <div class="summary-label">
        今日精選
      </div>

      <div
        id="selectedCount"
        class="summary-number"
      >
        --
      </div>

      <div class="summary-note">
        最新交易日篩選結果
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        股票池
      </div>

      <div
        id="stockPoolCount"
        class="summary-number"
      >
        --
      </div>

      <div
        id="stockPoolNote"
        class="summary-note"
      >
        等待資料
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-label">
        最新交易日
      </div>

      <div
        id="marketDate"
        class="summary-number"
        style="font-size:22px;"
      >
        --
      </div>

      <div
        id="marketDateNote"
        class="summary-note"
      >
        最新有效市場資料
      </div>

    </div>

  </section>


  <!-- =====================================================
       分頁
       ===================================================== -->

  <div class="tabs-wrap">

    <nav class="tabs">

      <button
        class="tab active"
        data-tab="selected"
      >
        今日精選
      </button>

      <button
        class="tab"
        data-tab="top10"
      >
        Top 10
      </button>

      <button
        class="tab"
        data-tab="etf"
      >
        ETF
      </button>

      <button
        class="tab"
        data-tab="bond"
      >
        債券
      </button>

      <button
        class="tab"
        data-tab="watchlist"
      >
        我的清單
      </button>

    </nav>

  </div>


  <!-- =====================================================
       Main content
       ===================================================== -->

  <main id="mainContent">

    <div class="loading">

      <span class="loading-dot"></span>

      正在讀取市場資料……

    </div>

  </main>


  <div class="footer">

    AI Market Intelligence

  </div>

</div>


<script>
"use strict";

/* ==========================================================
   基本設定
   ========================================================== */

const DATA_URL = "./Data/prices.json";

const HOLDINGS_STORAGE_KEY =
  "tw-stock-ai-scanner-holdings-v1";


/* ==========================================================
   全域狀態
   ========================================================== */

let marketData = null;

let currentTab = "selected";


/* ==========================================================
   使用者持倉
   ----------------------------------------------------------
   注意：
   V10.2 目前輸出的 prices.json 沒有 holdings。
   因此持倉資料與市場資料分離。

   未來若加入 holdings.json，可以直接替換
   loadHoldings()，不需要修改卡片邏輯。
   ========================================================== */

const DEFAULT_HOLDINGS = {
  "1319": {
    shares: 300,
    averageCost: 72.50
  }
};


/* ==========================================================
   DOM
   ========================================================== */

const mainContent =
  document.getElementById("mainContent");

const selectedCount =
  document.getElementById("selectedCount");

const stockPoolCount =
  document.getElementById("stockPoolCount");

const stockPoolNote =
  document.getElementById("stockPoolNote");

const marketDate =
  document.getElementById("marketDate");

const marketDateNote =
  document.getElementById("marketDateNote");


/* ==========================================================
   數字處理
   ========================================================== */

function safeNumber(value) {

  const n = Number(value);

  return Number.isFinite(n)
    ? n
    : null;
}


function formatPrice(value) {

  const n = safeNumber(value);

  if (n === null) {
    return "--";
  }

  return n.toLocaleString(
    "zh-TW",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );
}


function formatPercent(
  value,
  digits = 2
) {

  const n = safeNumber(value);

  if (n === null) {
    return "--";
  }

  const sign =
    n > 0
      ? "+"
      : "";

  return (
    sign
    + n.toFixed(digits)
    + "%"
  );
}


function formatInteger(value) {

  const n = safeNumber(value);

  if (n === null) {
    return "--";
  }

  return Math.round(n)
    .toLocaleString("zh-TW");
}


function formatMoney(value) {

  const n = safeNumber(value);

  if (n === null) {
    return "--";
  }

  const sign =
    n > 0
      ? "+"
      : "";

  return (
    sign
    + Math.round(n)
      .toLocaleString("zh-TW")
  );
}


/* ==========================================================
   HTML escape
   ========================================================== */

function escapeHtml(value) {

  if (
    value === null
    || value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}


/* ==========================================================
   市場資料
   ========================================================== */

async function loadMarketData() {

  try {

    const response =
      await fetch(
        DATA_URL
        + "?t="
        + Date.now(),
        {
          cache: "no-store"
        }
      );

    if (!response.ok) {
      throw new Error(
        "HTTP "
        + response.status
      );
    }

    const data =
      await response.json();

    if (
      !data
      || typeof data !== "object"
    ) {
      throw new Error(
        "prices.json 格式錯誤"
      );
    }

    marketData = data;

    return data;

  } catch (error) {

    console.error(
      "prices.json 讀取失敗：",
      error
    );

    marketData = null;

    return null;
  }
}


/* ==========================================================
   持倉資料
   ========================================================== */

function loadHoldings() {

  try {

    const stored =
      localStorage.getItem(
        HOLDINGS_STORAGE_KEY
      );

    if (stored) {

      const parsed =
        JSON.parse(stored);

      if (
        parsed
        && typeof parsed === "object"
      ) {

        return parsed;
      }
    }

  } catch (error) {

    console.warn(
      "持倉資料讀取失敗：",
      error
    );
  }

  /*
   * 第一次使用時提供目前已知持倉資料。
   * 這不是市場資料，不會寫入 prices.json。
   */
  return {
    ...DEFAULT_HOLDINGS
  };
}


let holdings =
  loadHoldings();


function saveHoldings() {

  try {

    localStorage.setItem(
      HOLDINGS_STORAGE_KEY,
      JSON.stringify(holdings)
    );

  } catch (error) {

    console.warn(
      "持倉資料儲存失敗：",
      error
    );
  }
}


/* ==========================================================
   找股票
   ========================================================== */

function findStockByCode(code) {

  if (!marketData) {
    return null;
  }

  const allLists = [
    marketData.today_selected,
    marketData.top10,
    marketData.etfs,
    marketData.bonds
  ];

  for (const list of allLists) {

    if (!Array.isArray(list)) {
      continue;
    }

    const found =
      list.find(
        item =>
          String(item.code)
          === String(code)
      );

    if (found) {
      return found;
    }
  }

  return null;
}


/* ==========================================================
   建立完整市場股票池
   ----------------------------------------------------------
   V10.2 並沒有把全部 analyzed stocks 寫入 prices.json。
   因此：

   1. 優先使用 universe.stock_count 作為股票池規模
   2. 若沒有 universe，退回 summary.stock_count
   3. 絕不寫死數字
   ========================================================== */

function getStockPoolCount() {

  if (!marketData) {
    return null;
  }

  const universeCount =
    safeNumber(
      marketData?.universe?.stock_count
    );

  if (universeCount !== null) {
    return universeCount;
  }

  const summaryCount =
    safeNumber(
      marketData?.summary?.stock_count
    );

  if (summaryCount !== null) {
    return summaryCount;
  }

  return null;
}


/* ==========================================================
   今日精選數量
   ========================================================== */

function getSelectedCount() {

  if (!marketData) {
    return null;
  }

  const summaryCount =
    safeNumber(
      marketData?.summary
        ?.today_selected_count
    );

  if (summaryCount !== null) {
    return summaryCount;
  }

  if (
    Array.isArray(
      marketData.today_selected
    )
  ) {
    return marketData
      .today_selected
      .length;
  }

  return null;
}


/* ==========================================================
   強度
   ----------------------------------------------------------
   前台只顯示整理後的燈號與文字。
   不顯示 strength_score。
   ========================================================== */

function getStrengthState(item) {

  const score =
    safeNumber(
      item?.strength_score
    );

  if (score === null) {

    return {
      className: "neutral",
      text: "中性"
    };
  }

  if (score >= 80) {

    return {
      className: "strong",
      text: "強勢"
    };
  }

  if (score >= 50) {

    return {
      className: "neutral",
      text: "中性"
    };
  }

  return {
    className: "weak",
    text: "弱勢"
  };
}


/* ==========================================================
   一般建議
   ----------------------------------------------------------
   不直接顯示後台 recommendation，
   因為 V10.2 的 recommendation 會包含
   「6/6」等後台條件名稱。
   ========================================================== */

function getGeneralRecommendation(item) {

  const coreScore =
    safeNumber(
      item?.core_score
    );

  const strength =
    safeNumber(
      item?.strength_score
    );

  if (
    coreScore !== null
    && coreScore >= 6
  ) {

    if (
      strength !== null
      && strength >= 80
    ) {
      return "偏多，可分批";
    }

    return "積極關注";
  }

  if (
    strength !== null
    && strength >= 80
  ) {
    return "積極關注";
  }

  if (
    strength !== null
    && strength >= 50
  ) {
    return "等待拉回";
  }

  if (
    strength !== null
    && strength >= 35
  ) {
    return "續抱觀察";
  }

  return "暫停操作";
}


/* ==========================================================
   我的清單建議
   ----------------------------------------------------------
   同時考慮：
   1. 個股目前狀態
   2. 持股成本
   3. 損益
   4. 報酬率
   5. 是否適合繼續加碼
   ========================================================== */

function getHoldingRecommendation(
  item,
  holding
) {

  if (!holding) {
    return "尚未建立持倉";
  }

  const price =
    safeNumber(item?.price);

  const averageCost =
    safeNumber(
      holding.averageCost
    );

  const strength =
    safeNumber(
      item?.strength_score
    );

  if (
    price === null
    || averageCost === null
    || averageCost <= 0
  ) {
    return "持有觀察";
  }

  const returnPct =
    (
      price / averageCost - 1
    ) * 100;

  /*
   * 已有明顯獲利 + 強勢：
   * 不追價，以持有觀察為主。
   */
  if (
    returnPct >= 15
    && strength !== null
    && strength >= 80
  ) {
    return "持有觀察，不追價";
  }

  /*
   * 小幅獲利 + 強勢：
   * 可以考慮分批加碼。
   */
  if (
    returnPct >= 0
    && returnPct < 15
    && strength !== null
    && strength >= 80
  ) {
    return "偏多，可分批加碼";
  }

  /*
   * 虧損但目前轉強：
   * 不急著攤平。
   */
  if (
    returnPct < 0
    && strength !== null
    && strength >= 80
  ) {
    return "偏多，等待確認後再加碼";
  }

  /*
   * 中性：
   * 暫停加碼。
   */
  if (
    strength !== null
    && strength >= 50
  ) {
    return "暫停加碼";
  }

  /*
   * 弱勢且已有明顯獲利：
   */
  if (
    returnPct >= 10
    && (
      strength === null
      || strength < 50
    )
  ) {
    return "考慮減碼";
  }

  return "持有觀察";
}


/* ==========================================================
   持倉計算
   ========================================================== */

function calculateHolding(item) {

  if (!item) {
    return null;
  }

  const code =
    String(item.code);

  const holding =
    holdings[code];

  if (!holding) {
    return null;
  }

  const shares =
    safeNumber(
      holding.shares
    );

  const averageCost =
    safeNumber(
      holding.averageCost
    );

  const price =
    safeNumber(
      item.price
    );

  if (
    shares === null
    || averageCost === null
    || price === null
  ) {
    return null;
  }

  const marketValue =
    price * shares;

  const costValue =
    averageCost * shares;

  const profit =
    marketValue - costValue;

  const returnPct =
    costValue !== 0
      ? (
          profit
          / costValue
        ) * 100
      : null;

  return {
    shares,
    averageCost,
    marketValue,
    profit,
    returnPct
  };
}


/* ==========================================================
   漲跌
   ========================================================== */

function getChangeClass(
  value
) {

  const n =
    safeNumber(value);

  if (n === null) {
    return "flat";
  }

  if (n > 0) {
    return "up";
  }

  if (n < 0) {
    return "down";
  }

  return "flat";
}


/* ==========================================================
   卡片
   ========================================================== */

function createStockCard(
  item,
  options = {}
) {

  const isHolding =
    options.isHolding === true;

  const holding =
    isHolding
      ? calculateHolding(item)
      : null;

  const strength =
    getStrengthState(item);

  const changeClass =
    getChangeClass(
      item?.change_pct
    );

  const recommendation =
    isHolding
      ? getHoldingRecommendation(
          item,
          holding
        )
      : getGeneralRecommendation(
          item
        );

  const market =
    item?.market === "TWO"
      ? "上櫃"
      : "上市";

  let holdingHtml = "";

  if (holding) {

    const profitClass =
      holding.profit > 0
        ? "profit-positive"
        : holding.profit < 0
          ? "profit-negative"
          : "profit-neutral";

    holdingHtml = `
      <div class="holding-area">

        <div class="holding-title">
          持倉資料
        </div>

        <div class="holding-grid">

          <div class="holding-item">
            <span class="holding-item-label">
              持有
            </span>

            <span class="holding-item-value">
              ${formatInteger(holding.shares)} 股
            </span>
          </div>

          <div class="holding-item">
            <span class="holding-item-label">
              均價
            </span>

            <span class="holding-item-value">
              ${formatPrice(holding.averageCost)}
            </span>
          </div>

          <div class="holding-item">
            <span class="holding-item-label">
              目前市值
            </span>

            <span class="holding-item-value">
              ${formatMoney(holding.marketValue)}
            </span>
          </div>

          <div class="holding-item">
            <span class="holding-item-label">
              損益
            </span>

            <span class="holding-item-value ${profitClass}">
              ${formatMoney(holding.profit)}
            </span>
          </div>

          <div class="holding-item">
            <span class="holding-item-label">
              報酬率
            </span>

            <span class="holding-item-value ${profitClass}">
              ${formatPercent(holding.returnPct)}
            </span>
          </div>

        </div>

      </div>
    `;
  }

  return `
    <article class="stock-card">

      <div class="stock-top">

        <div>

          <div class="stock-name">
            ${escapeHtml(item?.name || "--")}
          </div>

          <div class="stock-code">
            ${escapeHtml(item?.code || "--")}
          </div>

        </div>

        <div class="stock-market">
          ${market}
        </div>

      </div>


      <div class="price-row">

        <div class="price">
          ${formatPrice(item?.price)}
        </div>

        <div class="change ${changeClass}">
          ${formatPercent(item?.change_pct)}
        </div>

      </div>


      <div class="stock-divider"></div>


      <div class="result-grid">

        <div class="result-block">

          <div class="result-label">
            指數強度
          </div>

          <div class="strength ${strength.className}">

            <span class="strength-dot"></span>

            <span>
              ${strength.text}
            </span>

          </div>

        </div>


        <div class="result-block">

          <div class="result-label">
            建議
          </div>

          <div class="recommendation">
            ${escapeHtml(recommendation)}
          </div>

        </div>

      </div>


      ${holdingHtml}

    </article>
  `;
}


/* ==========================================================
   建立清單
   ========================================================== */

function renderList(
  list,
  options = {}
) {

  if (
    !Array.isArray(list)
    || list.length === 0
  ) {

    return `
      <div class="empty-card">

        <div class="empty-title">
          目前沒有資料
        </div>

        <div class="empty-note">
          此分頁目前沒有可顯示的市場資料。
        </div>

      </div>
    `;
  }

  return `
    <div class="stock-list">
      ${list
        .map(
          item =>
            createStockCard(
              item,
              options
            )
        )
        .join("")}
    </div>
  `;
}


/* ==========================================================
   我的清單
   ========================================================== */

function getWatchlistItems() {

  const result = [];

  for (
    const code
    of Object.keys(holdings)
  ) {

    const item =
      findStockByCode(code);

    if (!item) {
      continue;
    }

    result.push(item);
  }

  return result;
}


/* ==========================================================
   分頁資料
   ========================================================== */

function getTabData(
  tab
) {

  if (!marketData) {
    return [];
  }

  switch (tab) {

    case "selected":

      return Array.isArray(
        marketData.today_selected
      )
        ? marketData.today_selected
        : [];


    case "top10":

      return Array.isArray(
        marketData.top10
      )
        ? marketData.top10
        : [];


    case "etf":

      return Array.isArray(
        marketData.etfs
      )
        ? marketData.etfs
        : [];


    case "bond":

      return Array.isArray(
        marketData.bonds
      )
        ? marketData.bonds
        : [];


    case "watchlist":

      return getWatchlistItems();


    default:

      return [];
  }
}


/* ==========================================================
   分頁標題
   ========================================================== */

function getTabTitle(
  tab
) {

  switch (tab) {

    case "selected":
      return {
        title: "今日精選",
        note: "最新交易日篩選結果"
      };

    case "top10":
      return {
        title: "Top 10",
        note: "市場強度排序"
      };

    case "etf":
      return {
        title: "ETF",
        note: "ETF 市場資料"
      };

    case "bond":
      return {
        title: "債券",
        note: "債券市場資料"
      };

    case "watchlist":
      return {
        title: "我的清單",
        note: "市場狀態與持倉分析"
      };

    default:
      return {
        title: "",
        note: ""
      };
  }
}


/* ==========================================================
   Render 主畫面
   ========================================================== */

function renderCurrentTab() {

  if (!marketData) {

    mainContent.innerHTML = `
      <div class="empty-card">

        <div class="empty-title">
          資料尚未更新
        </div>

        <div class="empty-note">
          目前無法取得 Data/prices.json。
        </div>

      </div>
    `;

    return;
  }

  const info =
    getTabTitle(
      currentTab
    );

  const list =
    getTabData(
      currentTab
    );

  const isWatchlist =
    currentTab === "watchlist";

  mainContent.innerHTML = `

    <section>

      <div class="section-head">

        <div>

          <h2 class="section-title">
            ${info.title}
          </h2>

          <div class="section-note">
            ${info.note}
          </div>

        </div>

        <div class="market-date">
          ${escapeHtml(
            marketData.latest_market_date
            || marketData.date
            || "--"
          )}
        </div>

      </div>

      ${renderList(
        list,
        {
          isHolding: isWatchlist
        }
      )}

    </section>
  `;
}


/* ==========================================================
   Render Summary
   ========================================================== */

function renderSummary() {

  if (!marketData) {

    selectedCount.textContent = "--";
    stockPoolCount.textContent = "--";
    marketDate.textContent = "--";
    stockPoolNote.textContent = "資料尚未更新";
    marketDateNote.textContent = "等待市場資料";

    return;
  }

  /*
   * 今日精選
   * --------------------------------------------------------
   * 直接使用 V10.2 summary.today_selected_count。
   */
  const selected =
    getSelectedCount();

  selectedCount.textContent =
    selected === null
      ? "--"
      : selected;


  /*
   * 股票池
   * --------------------------------------------------------
   * 不寫死。
   * 優先使用 universe.stock_count。
   */
  const pool =
    getStockPoolCount();

  stockPoolCount.textContent =
    pool === null
      ? "--"
      : pool;

  /*
   * 這裡不顯示任何核心條件名稱。
   */
  stockPoolNote.textContent =
    pool === null
      ? "資料尚未取得"
      : "目前股票池";


  /*
   * 最新交易日
   */
  const date =
    marketData.latest_market_date
    || marketData.date
    || null;

  marketDate.textContent =
    date || "--";

  marketDateNote.textContent =
    date
      ? "最新有效市場資料"
      : "等待市場資料";
}


/* ==========================================================
   Tab switching
   ========================================================== */

function setupTabs() {

  const tabs =
    document.querySelectorAll(
      ".tab"
    );

  tabs.forEach(
    tab => {

      tab.addEventListener(
        "click",
        () => {

          const nextTab =
            tab.dataset.tab;

          if (!nextTab) {
            return;
          }

          currentTab =
            nextTab;

          tabs.forEach(
            button => {

              button.classList.toggle(
                "active",
                button.dataset.tab
                === currentTab
              );

            }
          );

          renderCurrentTab();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );

    }
  );
}


/* ==========================================================
   初始化
   ========================================================== */

async function init() {

  setupTabs();

  const data =
    await loadMarketData();

  if (!data) {

    renderSummary();
    renderCurrentTab();

    return;
  }

  renderSummary();
  renderCurrentTab();
}


/* ==========================================================
   啟動
   ========================================================== */

init();

</script>
