<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>台股 AI 選股｜動態風控儀表板</title>

<meta name="theme-color" content="#0b0f17">

<style>
/* =========================================================
   ROOT
========================================================= */

:root {
    --bg: #080b12;
    --bg-2: #0d111a;
    --panel: #111722;
    --panel-2: #151c28;
    --panel-3: #1a2230;

    --border: rgba(255,255,255,.08);
    --border-light: rgba(255,255,255,.12);

    --text: #f4f7fb;
    --text-2: #aab4c3;
    --text-3: #707b8d;

    --green: #31d49b;
    --green-soft: rgba(49,212,155,.12);

    --red: #ff5f6d;
    --red-soft: rgba(255,95,109,.12);

    --blue: #5ca9ff;
    --blue-soft: rgba(92,169,255,.12);

    --yellow: #f5c85b;
    --yellow-soft: rgba(245,200,91,.12);

    --purple: #a78bfa;
    --purple-soft: rgba(167,139,250,.12);

    --shadow:
        0 16px 40px rgba(0,0,0,.28);

    --radius: 18px;
    --radius-sm: 12px;

    --max-width: 1440px;
}

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Segoe UI",
        "Noto Sans TC",
        Arial,
        sans-serif;

    color: var(--text);

    background:
        radial-gradient(
            circle at 15% -10%,
            rgba(92,169,255,.13),
            transparent 35%
        ),
        radial-gradient(
            circle at 90% 0%,
            rgba(167,139,250,.10),
            transparent 30%
        ),
        var(--bg);
}

button,
input,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

a {
    color: inherit;
    text-decoration: none;
}

/* =========================================================
   APP
========================================================= */

.app {
    width: 100%;
    min-height: 100vh;
}

.container {
    width: min(
        calc(100% - 32px),
        var(--max-width)
    );

    margin: 0 auto;
}

/* =========================================================
   HEADER
========================================================= */

.header {
    position: sticky;
    top: 0;
    z-index: 100;

    background:
        rgba(8,11,18,.88);

    backdrop-filter: blur(18px);

    border-bottom:
        1px solid var(--border);
}

.header-inner {
    min-height: 72px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 18px;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
}

.brand-icon {
    width: 42px;
    height: 42px;

    border-radius: 13px;

    display: grid;
    place-items: center;

    background:
        linear-gradient(
            135deg,
            #1c2738,
            #101722
        );

    border:
        1px solid var(--border-light);

    box-shadow:
        0 8px 25px rgba(0,0,0,.25);
}

.brand-icon svg {
    width: 23px;
    height: 23px;
}

.brand-text {
    min-width: 0;
}

.brand-title {
    font-size: 17px;
    font-weight: 800;
    letter-spacing: .3px;
}

.brand-subtitle {
    margin-top: 2px;

    color: var(--text-3);

    font-size: 11px;
}

.header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
}

.icon-button {
    width: 42px;
    height: 42px;

    border-radius: 12px;

    border: 1px solid var(--border);

    background: var(--panel);

    color: var(--text);

    display: grid;
    place-items: center;

    transition:
        .2s ease;
}

.icon-button:hover {
    background: var(--panel-2);
    border-color: var(--border-light);
    transform: translateY(-1px);
}

/* =========================================================
   MAIN
========================================================= */

main {
    padding:
        28px 0
        70px;
}

.section {
    margin-bottom: 34px;
}

.section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    gap: 16px;

    margin-bottom: 16px;
}

.section-title-wrap {
    min-width: 0;
}

.section-kicker {
    color: var(--blue);

    font-size: 11px;
    font-weight: 800;

    letter-spacing: 1.2px;

    text-transform: uppercase;

    margin-bottom: 5px;
}

.section-title {
    margin: 0;

    font-size: 24px;
    line-height: 1.2;

    letter-spacing: -.4px;
}

.section-description {
    margin-top: 6px;

    color: var(--text-3);

    font-size: 13px;
}

/* =========================================================
   STATUS
========================================================= */

.status-bar {
    display: flex;
    align-items: center;
    gap: 8px;

    padding:
        8px 12px;

    border-radius: 10px;

    background: var(--panel);

    border:
        1px solid var(--border);

    color: var(--text-2);

    font-size: 12px;
}

.status-dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: var(--green);

    box-shadow:
        0 0 10px rgba(49,212,155,.7);
}

/* =========================================================
   SEARCH
========================================================= */

.search-section {
    margin-bottom: 28px;
}

.search-box {
    position: relative;
}

.search-input-wrap {
    display: flex;
    align-items: center;

    gap: 10px;

    padding:
        0 14px;

    height: 52px;

    background:
        linear-gradient(
            180deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.02)
        );

    border:
        1px solid var(--border-light);

    border-radius: 15px;

    box-shadow:
        0 10px 30px rgba(0,0,0,.16);
}

.search-icon {
    width: 19px;
    height: 19px;

    color: var(--text-3);

    flex: 0 0 auto;
}

#searchInput {
    width: 100%;

    border: 0;
    outline: 0;

    color: var(--text);

    background: transparent;

    font-size: 15px;
}

#searchInput::placeholder {
    color: var(--text-3);
}

.search-results {
    position: absolute;

    left: 0;
    right: 0;

    top: calc(100% + 8px);

    z-index: 50;

    display: none;

    max-height: 380px;

    overflow-y: auto;

    padding: 8px;

    border:
        1px solid var(--border-light);

    border-radius: 15px;

    background:
        rgba(17,23,34,.98);

    box-shadow:
        var(--shadow);
}

.search-results.show {
    display: block;
}

.search-result {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding: 12px;

    border-radius: 11px;

    transition: .15s ease;
}

.search-result:hover {
    background: var(--panel-3);
}

.result-main {
    min-width: 0;
}

.result-code {
    font-size: 14px;
    font-weight: 800;
}

.result-name {
    margin-top: 3px;

    color: var(--text-2);

    font-size: 12px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.result-type {
    margin-top: 4px;

    font-size: 10px;

    color: var(--text-3);
}

.add-button {
    flex: 0 0 auto;

    border:
        1px solid rgba(92,169,255,.25);

    color: var(--blue);

    background: var(--blue-soft);

    border-radius: 9px;

    padding:
        7px 10px;

    font-size: 11px;
    font-weight: 700;
}

.add-button.added {
    color: var(--green);
    background: var(--green-soft);
    border-color: rgba(49,212,155,.22);
}

/* =========================================================
   HERO / TODAY SELECTED
========================================================= */

.hero-card {
    position: relative;

    overflow: hidden;

    border-radius: 24px;

    padding: 24px;

    background:
        radial-gradient(
            circle at 100% 0%,
            rgba(92,169,255,.13),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #121b29,
            #0f151f 55%,
            #0c1119
        );

    border:
        1px solid var(--border-light);

    box-shadow:
        var(--shadow);
}

.hero-card::after {
    content: "";

    position: absolute;

    width: 180px;
    height: 180px;

    right: -70px;
    bottom: -100px;

    border-radius: 50%;

    border:
        1px solid rgba(92,169,255,.14);
}

.hero-top {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 16px;

    margin-bottom: 20px;
}

.hero-label {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding:
        6px 10px;

    border-radius: 9px;

    background:
        rgba(49,212,155,.10);

    color: var(--green);

    font-size: 11px;
    font-weight: 800;
}

.hero-date {
    color: var(--text-3);
    font-size: 11px;
}

.selected-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(260px, 1fr)
        );

    gap: 14px;
}

/* =========================================================
   STOCK CARD
========================================================= */

.stock-card {
    position: relative;

    overflow: hidden;

    padding: 18px;

    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.015)
        );

    border:
        1px solid var(--border);

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease;

    cursor: pointer;
}

.stock-card:hover {
    transform: translateY(-3px);

    border-color:
        rgba(255,255,255,.16);

    box-shadow:
        0 16px 32px rgba(0,0,0,.20);
}

.stock-card.selected {
    border-color:
        rgba(49,212,155,.22);

    background:
        linear-gradient(
            145deg,
            rgba(49,212,155,.07),
            rgba(255,255,255,.015)
        );
}

.card-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;

    gap: 10px;

    margin-bottom: 18px;
}

.stock-ident {
    min-width: 0;
}

.stock-code {
    font-size: 17px;
    font-weight: 850;

    letter-spacing: .3px;
}

.stock-name {
    margin-top: 4px;

    color: var(--text-2);

    font-size: 12px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.signal-badge {
    flex: 0 0 auto;

    padding:
        6px 9px;

    border-radius: 8px;

    font-size: 10px;
    font-weight: 800;

    color: var(--green);

    background: var(--green-soft);

    border:
        1px solid rgba(49,212,155,.18);
}

.signal-badge.observe {
    color: var(--yellow);
    background: var(--yellow-soft);
    border-color: rgba(245,200,91,.18);
}

.signal-badge.neutral {
    color: var(--text-2);
    background: rgba(255,255,255,.05);
    border-color: var(--border);
}

.price-row {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    gap: 12px;

    margin-bottom: 18px;
}

.price {
    font-size: 28px;
    font-weight: 850;

    letter-spacing: -.7px;
}

.price-change {
    font-size: 13px;
    font-weight: 800;

    margin-bottom: 4px;
}

.positive {
    color: var(--green);
}

.negative {
    color: var(--red);
}

.neutral-text {
    color: var(--text-2);
}

/* =========================================================
   CARD METRICS
========================================================= */

.metrics {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;
}

.metric {
    min-width: 0;

    padding:
        9px 8px;

    border-radius: 10px;

    background:
        rgba(0,0,0,.16);

    border:
        1px solid rgba(255,255,255,.04);
}

.metric-label {
    color: var(--text-3);

    font-size: 9px;

    margin-bottom: 4px;
}

.metric-value {
    color: var(--text);

    font-size: 12px;
    font-weight: 750;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.core-row {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-top: 13px;

    padding-top: 13px;

    border-top:
        1px solid var(--border);

    font-size: 11px;
}

.core-label {
    color: var(--text-3);
}

.core-value {
    color: var(--green);

    font-weight: 800;
}

/* =========================================================
   EMPTY
========================================================= */

.empty-state {
    padding: 38px 20px;

    text-align: center;

    border-radius: var(--radius);

    border:
        1px dashed var(--border-light);

    background:
        rgba(255,255,255,.015);
}

.empty-icon {
    width: 45px;
    height: 45px;

    margin:
        0 auto 12px;

    border-radius: 14px;

    display: grid;
    place-items: center;

    background: var(--panel-2);

    color: var(--text-3);
}

.empty-title {
    font-weight: 750;
}

.empty-text {
    margin-top: 6px;

    color: var(--text-3);

    font-size: 12px;
}

/* =========================================================
   TOP 10
========================================================= */

.top-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(250px, 1fr)
        );

    gap: 12px;
}

.rank-card {
    display: grid;

    grid-template-columns:
        38px 1fr auto;

    align-items: center;

    gap: 12px;

    padding: 14px;

    border-radius: 14px;

    background: var(--panel);

    border:
        1px solid var(--border);

    transition: .2s ease;
}

.rank-card:hover {
    background: var(--panel-2);
    border-color: var(--border-light);
}

.rank-number {
    width: 34px;
    height: 34px;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background:
        rgba(255,255,255,.05);

    color: var(--text-2);

    font-size: 12px;
    font-weight: 850;
}

.rank-number.top {
    color: var(--yellow);
    background: var(--yellow-soft);
}

.rank-info {
    min-width: 0;
}

.rank-code {
    font-weight: 800;
    font-size: 13px;
}

.rank-name {
    color: var(--text-3);
    font-size: 11px;
    margin-top: 3px;
}

.rank-price {
    text-align: right;

    font-weight: 800;

    font-size: 13px;
}

.rank-change {
    margin-top: 3px;

    font-size: 10px;
}

/* =========================================================
   TWO COLUMN
========================================================= */

.two-column {
    display: grid;

    grid-template-columns:
        minmax(0, 1.35fr)
        minmax(300px, .65fr);

    gap: 18px;
}

@media (max-width: 900px) {

    .two-column {
        grid-template-columns: 1fr;
    }
}

/* =========================================================
   LIST PANEL
========================================================= */

.panel {
    border-radius: var(--radius);

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    border:
        1px solid var(--border);

    overflow: hidden;
}

.panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding:
        18px 18px 14px;

    border-bottom:
        1px solid var(--border);
}

.panel-title {
    font-size: 15px;
    font-weight: 800;
}

.panel-count {
    color: var(--text-3);
    font-size: 11px;
}

.panel-body {
    padding: 10px;
}

.compact-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.compact-item {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 12px;

    padding: 12px;

    border-radius: 11px;

    transition: .15s ease;

    cursor: pointer;
}

.compact-item:hover {
    background: var(--panel-2);
}

.compact-left {
    min-width: 0;

    display: flex;
    align-items: center;

    gap: 10px;
}

.compact-icon {
    width: 34px;
    height: 34px;

    flex: 0 0 auto;

    display: grid;
    place-items: center;

    border-radius: 10px;

    background: var(--blue-soft);

    color: var(--blue);

    font-size: 10px;
    font-weight: 850;
}

.compact-code {
    font-size: 12px;
    font-weight: 800;
}

.compact-name {
    margin-top: 3px;

    color: var(--text-3);

    font-size: 10px;

    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.compact-right {
    text-align: right;
    flex: 0 0 auto;
}

.compact-price {
    font-size: 12px;
    font-weight: 800;
}

.compact-change {
    margin-top: 3px;
    font-size: 10px;
}

/* =========================================================
   WATCHLIST
========================================================= */

.watchlist {
    min-height: 100px;
}

.watchlist-empty {
    padding: 30px 15px;

    text-align: center;

    color: var(--text-3);

    font-size: 12px;
}

/* =========================================================
   SYSTEM OVERVIEW
========================================================= */

.system-grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(150px, 1fr)
        );

    gap: 10px;
}

.system-stat {
    padding: 16px;

    border-radius: 14px;

    background: var(--panel);

    border:
        1px solid var(--border);
}

.system-stat-label {
    color: var(--text-3);

    font-size: 10px;
}

.system-stat-value {
    margin-top: 7px;

    font-size: 22px;
    font-weight: 850;
}

.system-stat-sub {
    margin-top: 4px;

    color: var(--text-3);

    font-size: 10px;
}

/* =========================================================
   FOOTER
========================================================= */

.footer {
    padding:
        25px 0 50px;

    color: var(--text-3);

    text-align: center;

    font-size: 10px;

    border-top:
        1px solid var(--border);
}

/* =========================================================
   MODAL
========================================================= */

.modal-overlay {
    position: fixed;

    inset: 0;

    z-index: 500;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 18px;

    background:
        rgba(0,0,0,.72);

    backdrop-filter: blur(8px);
}

.modal-overlay.show {
    display: flex;
}

.modal {
    width: min(
        720px,
        100%
    );

    max-height:
        calc(100vh - 36px);

    overflow-y: auto;

    border-radius: 22px;

    background:
        #101722;

    border:
        1px solid var(--border-light);

    box-shadow:
        0 30px 80px rgba(0,0,0,.55);
}

.modal-header {
    position: sticky;
    top: 0;
    z-index: 2;

    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;

    padding: 20px;

    background:
        rgba(16,23,34,.95);

    backdrop-filter: blur(15px);

    border-bottom:
        1px solid var(--border);
}

.modal-code {
    font-size: 22px;
    font-weight: 850;
}

.modal-name {
    margin-top: 4px;

    color: var(--text-2);

    font-size: 12px;
}

.modal-close {
    width: 36px;
    height: 36px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--panel-2);

    color: var(--text);

    display: grid;
    place-items: center;
}

.modal-body {
    padding: 20px;
}

.detail-price {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;

    gap: 15px;

    padding-bottom: 20px;

    border-bottom:
        1px solid var(--border);
}

.detail-price-number {
    font-size: 35px;
    font-weight: 900;
}

.detail-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;

    margin-top: 18px;
}

.detail-item {
    padding: 12px;

    border-radius: 11px;

    background: rgba(255,255,255,.035);

    border:
        1px solid var(--border);
}

.detail-item-label {
    color: var(--text-3);

    font-size: 10px;

    margin-bottom: 6px;
}

.detail-item-value {
    font-size: 14px;
    font-weight: 800;
}

.condition-list {
    margin-top: 20px;
}

.condition-title {
    margin-bottom: 10px;

    font-size: 13px;
    font-weight: 800;
}

.condition {
    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    padding: 10px 12px;

    border-bottom:
        1px solid var(--border);

    font-size: 11px;
}

.condition:last-child {
    border-bottom: 0;
}

.condition-status {
    padding:
        4px 7px;

    border-radius: 7px;

    font-size: 9px;
    font-weight: 800;
}

.condition-pass {
    color: var(--green);
    background: var(--green-soft);
}

.condition-fail {
    color: var(--red);
    background: var(--red-soft);
}

.modal-footer {
    display: flex;
    gap: 8px;

    margin-top: 20px;
}

.modal-action {
    flex: 1;

    padding:
        11px;

    border-radius: 11px;

    border:
        1px solid var(--border-light);

    background: var(--panel-2);

    color: var(--text);

    font-weight: 750;
}

.modal-action.primary {
    background: var(--blue-soft);
    color: var(--blue);
    border-color: rgba(92,169,255,.22);
}

/* =========================================================
   TOAST
========================================================= */

.toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    z-index: 1000;

    transform:
        translate(-50%, 20px);

    opacity: 0;

    pointer-events: none;

<script>
/* ============================================================
   台股 AI 選股系統
   index.html V10.0

   前台資料來源：

       Data/ui_data.json
       Data/securities.json

   不直接讀取：

       Data/prices.json

   使用者清單：

       localStorage
============================================================ */


/* ============================================================
   CONFIG
============================================================ */

const CONFIG = {

    UI_DATA_URL:
        "./Data/ui_data.json",

    SECURITIES_URL:
        "./Data/securities.json",

    WATCHLIST_KEY:
        "tw-stock-ai-watchlist-v10",

    CACHE_BUSTER:
        "?v=" + Date.now()

};


/* ============================================================
   STATE
============================================================ */

const state = {

    uiData: null,

    securities: [],

    securityMap: new Map(),

    watchlist: [],

    allRecords: [],

    loaded: false

};


/* ============================================================
   DOM
============================================================ */

const appContent =
    document.getElementById(
        "appContent"
    );

const systemStatus =
    document.getElementById(
        "systemStatus"
    );

const refreshButton =
    document.getElementById(
        "refreshButton"
    );

const detailModal =
    document.getElementById(
        "detailModal"
    );

const modalClose =
    document.getElementById(
        "modalClose"
    );

const modalCode =
    document.getElementById(
        "modalCode"
    );

const modalName =
    document.getElementById(
        "modalName"
    );

const modalBody =
    document.getElementById(
        "modalBody"
    );

const toast =
    document.getElementById(
        "toast"
    );


/* ============================================================
   UTIL
============================================================ */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );
}


function numberValue(value) {

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : null;
}


function formatNumber(
    value,
    digits = 2
) {

    const n =
        numberValue(value);

    if (n === null) {
        return "-";
    }

    return n.toLocaleString(
        "zh-TW",
        {
            minimumFractionDigits:
                digits,

            maximumFractionDigits:
                digits
        }
    );
}


function formatInteger(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "-";
    }

    return n.toLocaleString(
        "zh-TW",
        {
            maximumFractionDigits: 0
        }
    );
}


function formatPercent(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "-";
    }

    const sign =
        n > 0
            ? "+"
            : "";

    return (
        sign +
        n.toFixed(2) +
        "%"
    );
}


function positiveClass(value) {

    const n =
        numberValue(value);

    if (n === null) {
        return "neutral-text";
    }

    if (n > 0) {
        return "positive";
    }

    if (n < 0) {
        return "negative";
    }

    return "neutral-text";
}


function signalClass(signal) {

    const text =
        String(
            signal || ""
        );

    if (
        text.includes(
            "精選"
        )
    ) {
        return "";
    }

    if (
        text.includes(
            "觀察"
        )
    ) {
        return "observe";
    }

    return "neutral";
}


function getTypeLabel(item) {

    const type =
        String(
            item?.type || ""
        ).toLowerCase();

    if (
        type === "etf" ||
        type.includes("etf")
    ) {
        return "ETF";
    }

    if (
        type === "bond" ||
        type.includes("bond") ||
        type.includes("債")
    ) {
        return "債券";
    }

    return "股票";
}


/* ============================================================
   TOAST
============================================================ */

let toastTimer = null;

function showToast(message) {

    toast.textContent =
        message;

    toast.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            2200
        );
}


/* ============================================================
   WATCHLIST
============================================================ */

function loadWatchlist() {

    try {

        const raw =
            localStorage.getItem(
                CONFIG.WATCHLIST_KEY
            );

        if (!raw) {

            state.watchlist = [];

            return;
        }

        const parsed =
            JSON.parse(
                raw
            );

        if (
            Array.isArray(parsed)
        ) {

            state.watchlist =
                parsed.map(
                    x => String(x)
                );

        } else {

            state.watchlist = [];

        }

    } catch (error) {

        console.warn(
            "Watchlist 載入失敗",
            error
        );

        state.watchlist = [];
    }
}


function saveWatchlist() {

    localStorage.setItem(
        CONFIG.WATCHLIST_KEY,
        JSON.stringify(
            state.watchlist
        )
    );
}


function isInWatchlist(code) {

    return state.watchlist.includes(
        String(code)
    );
}


function toggleWatchlist(code) {

    code =
        String(code);

    if (
        isInWatchlist(code)
    ) {

        state.watchlist =
            state.watchlist.filter(
                x => x !== code
            );

        saveWatchlist();

        showToast(
            `${code} 已從清單移除`
        );

    } else {

        state.watchlist.push(
            code
        );

        saveWatchlist();

        showToast(
            `${code} 已加入我的清單`
        );
    }

    renderWatchlist();

    updateSearchButtons();
}


/* ============================================================
   FETCH JSON
============================================================ */

async function fetchJson(url) {

    const response =
        await fetch(
            url +
            CONFIG.CACHE_BUSTER,
            {
                cache:
                    "no-store"
            }
        );

    if (
        !response.ok
    ) {

        throw new Error(
            `HTTP ${response.status}：${url}`
        );
    }

    return response.json();
}


/* ============================================================
   NORMALIZE UI DATA
============================================================ */

/*
    V10 ui_data.json 可能採用：

    {
        "today_selected": [],
        "top10": [],
        "etfs": [],
        "bonds": [],
        "statistics": {},
        "updated_at": ""
    }

    也兼容：

    todaySelected
    top10
    ETF
    bond
    dashboard
    data
*/


function findArray(
    object,
    keys
) {

    for (
        const key of keys
    ) {

        if (
            Array.isArray(
                object?.[key]
            )
        ) {

            return object[key];
        }
    }

    return [];
}


function findObject(
    object,
    keys
) {

    for (
        const key of keys
    ) {

        if (
            object?.[key] &&
            typeof object[key] === "object" &&
            !Array.isArray(object[key])
        ) {

            return object[key];
        }
    }

    return {};
}


function normalizeRecord(
    raw
) {

    if (
        !raw ||
        typeof raw !== "object"
    ) {
        return null;
    }

    const record =
        {
            ...raw
        };

    record.code =
        String(
            raw.code ??
            raw.Code ??
            raw.stock_code ??
            raw.symbol_code ??
            ""
        ).trim();

    record.name =
        String(
            raw.name ??
            raw.Name ??
            raw.stock_name ??
            raw.company_name ??
            ""
        ).trim();

    record.price =
        numberValue(
            raw.price ??
            raw.close ??
            raw.Close
        );

    record.close =
        numberValue(
            raw.close ??
            raw.price ??
            raw.Close
        );

    record.previous_close =
        numberValue(
            raw.previous_close ??
            raw.prev_close ??
            raw.previousClose
        );

    record.change_pct =
        numberValue(
            raw.change_pct ??
            raw.changePercent ??
            raw.change_percent ??
            raw.pct_change
        );

    record.volume =
        numberValue(
            raw.volume ??
            raw.Volume
        );

    record.volume_ratio =
        numberValue(
            raw.volume_ratio ??
            raw.volumeRatio
        );

    record.rsi =
        numberValue(
            raw.rsi ??
            raw.RSI
        );

    record.k =
        numberValue(
            raw.k ??
            raw.K
        );

    record.d =
        numberValue(
            raw.d ??
            raw.D
        );

    record.macd =
        numberValue(
            raw.macd ??
            raw.MACD
        );

    record.macd_signal =
        numberValue(
            raw.macd_signal ??
            raw.MACD_SIGNAL ??
            raw.macdSignal
        );

    record.macd_hist =
        numberValue(
            raw.macd_hist ??
            raw.MACD_HIST ??
            raw.macdHist
        );

    record.ma5 =
        numberValue(
            raw.ma5 ??
            raw.MA5
        );

    record.ma20 =
        numberValue(
            raw.ma20 ??
            raw.MA20
        );

    record.ma60 =
        numberValue(
            raw.ma60 ??
            raw.MA60
        );

    record.core_score =
        numberValue(
            raw.core_score ??
            raw.coreScore
        );

    record.core_total =
        numberValue(
            raw.core_total ??
            raw.coreTotal
        );

    record.strength_score =
        numberValue(
            raw.strength_score ??
            raw.strengthScore
        );

    record.ai_score =
        numberValue(
            raw.ai_score ??
            raw.aiScore ??
            raw.score
        );

    record.signal =
        raw.signal ??
        raw.status ??
        "";

    record.type =
        raw.type ??
        raw.security_type ??
        raw.securityType ??
        "stock";

    record.market =
        raw.market ??
        raw.exchange ??
        "";

    record.macd_golden_cross =
        Boolean(
            raw.macd_golden_cross ??
            raw.macdGoldenCross
        );

    record.rsi_over_50 =
        Boolean(
            raw.rsi_over_50 ??
            raw.rsiOver50
        );

    record.kd_golden_cross =
        Boolean(
            raw.kd_golden_cross ??
            raw.kdGoldenCross
        );

    record.volume_expand =
        Boolean(
            raw.volume_expand ??
            raw.volumeExpand
        );

    record.price_over_ma20 =
        Boolean(
            raw.price_over_ma20 ??
            raw.priceOverMA20
        );

    record.ma20_up =
        Boolean(
            raw.ma20_up ??
            raw.ma20Up
        );

    record.core_pass =
        Boolean(
            raw.core_pass ??
            raw.corePass
        );

    return record;
}


/* ============================================================
   NORMALIZE SECURITIES
============================================================ */

function normalizeSecurities(
    raw
) {

    let list = [];

    if (
        Array.isArray(raw)
    ) {

        list = raw;

    } else if (
        Array.isArray(
            raw?.securities
        )
    ) {

        list =
            raw.securities;

    } else if (
        Array.isArray(
            raw?.data
        )
    ) {

        list =
            raw.data;

    } else if (
        Array.isArray(
            raw?.items
        )
    ) {

        list =
            raw.items;
    }

    return list
        .map(
            item => {

                const code =
                    String(
                        item.code ??
                        item.Code ??
                        item.stock_code ??
                        item.symbol ??
                        ""
                    ).trim();

                if (!code) {
                    return null;
                }

                return {

                    ...item,

                    code,

                    name:
                        String(
                            item.name ??
                            item.Name ??
                            item.stock_name ??
                            item.company_name ??
                            code
                        ),

                    type:
                        item.type ??
                        item.security_type ??
                        "stock",

                    market:
                        item.market ??
                        item.exchange ??
                        ""

                };

            }
        )
        .filter(Boolean);
}


/* ============================================================
   BUILD SECURITY MAP
============================================================ */

function buildSecurityMap() {

    state.securityMap =
        new Map();

    for (
        const item of
        state.securities
    ) {

        state.securityMap.set(
            String(item.code),
            item
        );
    }
}


/* ============================================================
   MERGE SECURITY INFO
============================================================ */

function enrichRecord(
    record
) {

    if (!record) {
        return null;
    }

    const security =
        state.securityMap.get(
            String(
                record.code
            )
        );

    if (
        security
    ) {

        return {

            ...security,
            ...record,

            name:
                record.name ||
                security.name,

            type:
                record.type ||
                security.type,

            market:
                record.market ||
                security.market

        };
    }

    return record;
}


/* ============================================================
   LOAD DATA
============================================================ */

async function loadData() {

    setStatus(
        "資料載入中",
        false
    );

    try {

        const [
            uiRaw,
            securitiesRaw
        ] =
            await Promise.all([
                fetchJson(
                    CONFIG.UI_DATA_URL
                ),
                fetchJson(
                    CONFIG.SECURITIES_URL
                )
            ]);

        state.uiData =
            uiRaw || {};

        state.securities =
            normalizeSecurities(
                securitiesRaw
            );

        buildSecurityMap();

        state.allRecords = [];

        const candidateArrays = [

            findArray(
                state.uiData,
                [
                    "stocks",
                    "top10",
                    "top_10",
                    "top30",
                    "today_selected",
                    "todaySelected",
                    "etfs",
                    "ETF",
                    "bonds",
                    "bond"
                ]
            )

        ];

        for (
            const list
            of candidateArrays
        ) {

            for (
                const raw
                of list
            ) {

                const record =
                    enrichRecord(
                        normalizeRecord(
                            raw
                        )
                    );

                if (
                    record &&
                    record.code
                ) {

                    const exists =
                        state.allRecords.some(
                            x =>
                                x.code ===
                                record.code
                        );

                    if (!exists) {

                        state.allRecords.push(
                            record
                        );

                    }
                }
            }
        }

        loadWatchlist();

        state.loaded =
            true;

        render();

        setStatus(
            "系統正常",
            true
        );

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            "資料載入失敗",
            false
        );

        renderError(
            error
        );
    }
}


/* ============================================================
   STATUS
============================================================ */

function setStatus(
    text,
    success
) {

    systemStatus.innerHTML = `

        <span
            class="status-dot"
            style="
                background:${success ? "var(--green)" : "var(--yellow)"};
                box-shadow:
                    0 0 10px
                    ${success
                        ? "rgba(49,212,155,.7)"
                        : "rgba(245,200,91,.6)"
                    };
            "
        ></span>

        <span>
            ${escapeHtml(text)}
        </span>

    `;
}


/* ============================================================
   ERROR
============================================================ */

function renderError(
    error
) {

    appContent.innerHTML = `

        <div class="error-box">

            <strong>
                無法載入儀表板資料
            </strong>

            <br><br>

            請確認 GitHub Pages 中存在：

            <br>

            <code>
                Data/ui_data.json
            </code>

            <br>

            <code>
                Data/securities.json
            </code>

            <br><br>

            錯誤：

            ${escapeHtml(
                error?.message ||
                String(error)
            )}

        </div>

    `;
}


/* ============================================================
   DATA ACCESS
============================================================ */

function getTodaySelected() {

    return findArray(
        state.uiData,
        [
            "today_selected",
            "todaySelected",
            "today_selection",
            "selected",
            "featured",
            "featured_stocks"
        ]
    )
        .map(
            normalizeRecord
        )
        .map(
            enrichRecord
        )
        .filter(Boolean)
        .slice(
            0,
            6
        );
}


function getTop10() {

    let list =
        findArray(
            state.uiData,
            [
                "top10",
                "top_10",
                "top10_stocks",
                "top"
            ]
        );

    if (
        !list.length
    ) {

        list =
            findArray(
                state.uiData,
                [
                    "top30"
                ]
            );
    }

    return list
        .map(
            normalizeRecord
        )
        .map(
            enrichRecord
        )
        .filter(Boolean)
        .sort(
            (
                a,
                b
            ) =>
                (
                    b.ai_score || 0
                )
                -
                (
                    a.ai_score || 0
                )
        )
        .slice(
            0,
            10
        );
}


function getEtfs() {

    const list =
        findArray(
            state.uiData,
            [
                "etfs",
                "ETF",
                "etf"
            ]
        );

    return list
        .map(
            normalizeRecord
        )
        .map(
            enrichRecord
        )
        .filter(Boolean)
        .slice(
            0,
            8
        );
}


function getBonds() {

    const list =
        findArray(
            state.uiData,
            [
                "bonds",
                "bond",
                "債券"
            ]
        );

    return list
        .map(
            normalizeRecord
        )
        .map(
            enrichRecord
        )
        .filter(Boolean)
        .slice(

/* ============================================================
   FIND RECORD
============================================================ */

function findRecordByCode(
    code
) {

    code =
        String(code);

    const direct =
        state.allRecords.find(
            item =>
                String(
                    item.code
                ) === code
        );

    if (
        direct
    ) {
        return direct;
    }

    const security =
        state.securityMap.get(
            code
        );

    if (
        security
    ) {

        return normalizeRecord(
            security
        );
    }

    return null;
}


/* ============================================================
   SEARCH
============================================================ */

function setupSearch() {

    const input =
        document.getElementById(
            "searchInput"
        );

    const results =
        document.getElementById(
            "searchResults"
        );

    if (
        !input ||
        !results
    ) {
        return;
    }

    input.addEventListener(
        "input",
        () => {

            const query =
                input.value
                    .trim()
                    .toLowerCase();

            if (
                !query
            ) {

                results.innerHTML = "";

                results.classList.remove(
                    "show"
                );

                return;
            }

            const matches =
                state.securities
                    .filter(
                        item => {

                            const code =
                                String(
                                    item.code ||
                                    ""
                                ).toLowerCase();

                            const name =
                                String(
                                    item.name ||
                                    ""
                                ).toLowerCase();

                            return (
                                code.includes(
                                    query
                                )
                                ||
                                name.includes(
                                    query
                                )
                            );

                        }
                    )
                    .slice(
                        0,
                        15
                    );

            if (
                !matches.length
            ) {

                results.innerHTML = `

                    <div
                        class="watchlist-empty"
                    >
                        找不到符合的標的
                    </div>

                `;

                results.classList.add(
                    "show"
                );

                return;
            }

            results.innerHTML =
                matches
                    .map(
                        item =>
                            renderSearchResult(
                                item
                            )
                    )
                    .join("");

            results.classList.add(
                "show"
            );

            bindSearchButtons();

        }
    );


    document.addEventListener(
        "click",
        event => {

            if (
                !event.target.closest(
                    ".search-box"
                )
            ) {

                results.classList.remove(
                    "show"
                );

            }

        }
    );
}

/* ============================================================
   SEARCH BUTTONS
============================================================ */

function bindSearchButtons() {

    document
        .querySelectorAll(
            "[data-add-code]"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    event => {

                        event.stopPropagation();

                        const code =
                            button.getAttribute(
                                "data-add-code"
                            );

                        toggleWatchlist(
                            code
                        );

                        updateSearchButtons();

                    }
                );

            }
        );
}


function updateSearchButtons() {

    document
        .querySelectorAll(
            "[data-add-code]"
        )
        .forEach(
            button => {

                const code =
                    button.getAttribute(
                        "data-add-code"
                    );

                const added =
                    isInWatchlist(
                        code
                    );

                button.classList.toggle(
                    "added",
                    added
                );

                button.textContent =
                    added
                        ? "已加入"
                        : "+ 加入清單";

            }
        );
}

   CARD EVENTS
============================================================ */

function bindCards() {

    document
        .querySelectorAll(
            "[data-code]"
        )
        .forEach(
            element => {

                if (
                    element.closest(
                        ".search-result"
                    )
                ) {
                    return;
                }

                element.addEventListener(
                    "click",
                    () => {

                        const code =
                            element.getAttribute(
                                "data-code"
                            );

                        openDetail(
                            code
                        );

                    }
                );

            }
        );
}

            code
        );

    if (
        !item
    ) {

        showToast(
            "目前沒有這檔標的的詳細資料"
        );

        return;
    }

    modalCode.textContent =
        item.code;

    modalName.textContent =
        item.name ||
        "";

    const change =
        item.change_pct;

    modalBody.innerHTML = `

        <div
            class="detail-price"
        >

            <div>

                <div
                    class="detail-price-number"
                >
                    ${formatNumber(
                        item.price,
                        2
                    )}
                </div>

            </div>

            <div
                class="
                    price-change
                    ${positiveClass(
                        change
                    )}
                "
            >
                ${formatPercent(
                    change
                )}
            </div>

        </div>


        <div
            class="detail-grid"
        >

            ${detailItem(
                "AI Score",
                formatNumber(
                    item.ai_score,
                    1
                )
            )}

            ${detailItem(
                "Strength Score",
                formatNumber(
                    item.strength_score,
                    1
                )
            )}

            ${detailItem(
                "RSI",
                formatNumber(
                    item.rsi,
                    1
                )
            )}

            ${detailItem(
                "K",
                formatNumber(
                    item.k,
                    1
                )
            )}

            ${detailItem(
                "D",
                formatNumber(
                    item.d,
                    1
                )
            )}

            ${detailItem(
                "MACD",
                formatNumber(
                    item.macd,
                    2
                )
            )}

            ${detailItem(
                "MA20",
                formatNumber(
                    item.ma20,
                    2
                )
            )}

            ${detailItem(
                "MA60",
                formatNumber(
                    item.ma60,
                    2
                )
            )}

            ${detailItem(
                "成交量",
                formatInteger(
                    item.volume
                )
            )}

            ${detailItem(
                "量比",
                item.volume_ratio !== null
                    ? formatNumber(
                        item.volume_ratio,
                        2
                    ) + "x"
                    : "-"
            )}

        </div>


        ${
            item.core_total
            ?
            `

                <div
                    class="condition-list"
                >

                    <div
                        class="condition-title"
                    >
                        六項核心條件
                    </div>

                    ${renderCondition(
                        "MACD 多方",
                        item.macd_golden_cross
                    )}

                    ${renderCondition(
                        "RSI > 50",
                        item.rsi_over_50
                    )}

                    ${renderCondition(
                        "KD 多方",
                        item.kd_golden_cross
                    )}

                    ${renderCondition(
                        "成交量 ≥ MA5 × 1.5",
                        item.volume_expand
                    )}

                    ${renderCondition(
                        "股價 > MA20",
                        item.price_over_ma20
                    )}

                    ${renderCondition(
                        "MA20 今日 > 昨日",
                        item.ma20_up
                    )}

                </div>

            `
            :
            ""
        }


        <div
            class="modal-footer"
        >

            <button
                class="modal-action primary"
                id="modalWatchButton"
            >
                ${
                    isInWatchlist(
                        item.code
                    )
                    ? "✓ 已加入我的清單"
                    : "+ 加入我的清單"
                }
            </button>

        </div>

    `;

    document
        .getElementById(
            "modalWatchButton"
        )
        .addEventListener(
            "click",
            () => {

                toggleWatchlist(
                    item.code
                );

                document
                    .getElementById(
                        "modalWatchButton"
                    )
                    .textContent =
                        isInWatchlist(
                            item.code
                        )
                        ? "✓ 已加入我的清單"
                        : "+ 加入我的清單";

            }
        );

    detailModal.classList.add(
        "show"
    );

    document.body.style.overflow =
        "hidden";
}


/* ============================================================
   DETAIL ITEM
============================================================ */

function detailItem(
    label,
    value
) {

    return `

        <div
            class="detail-item"
        >

            <div
                class="detail-item-label"
            >
                ${escapeHtml(
                    label
                )}
            </div>

            <div
                class="detail-item-value"
            >
                ${escapeHtml(
                    String(
                        value
                    )
                )}
            </div>

        </div>

    `;
}


/* ============================================================
   CONDITION
============================================================ */

function renderCondition(
    label,
    passed
) {

    const ok =
        passed === true;

    return `

        <div
            class="condition"
        >

            <span>
                ${escapeHtml(
                    label
                )}
            </span>

            <span
                class="
                    condition-status
                    ${
                        ok
                            ? "condition-pass"
                            : "condition-fail"
                    }
                "
            >
                ${
                    ok
                        ? "PASS"
                        : "未通過"
                }
            </span>

        </div>

    `;
}


/* ============================================================
   MODAL CLOSE
============================================================ */

function closeModal() {

    detailModal.classList.remove(
        "show"
    );

    document.body.style.overflow =
        "";
}


modalClose.addEventListener(
    "click",
    closeModal
);


detailModal.addEventListener(
    "click",
    event => {

        if (
            event.target ===
            detailModal
        ) {

            closeModal();

        }

    }
);


document.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Escape"
        ) {

            closeModal();

        }

    }
);


/* ============================================================
   REFRESH
============================================================ */

refreshButton.addEventListener(
    "click",
    async () => {

        refreshButton.style.transform =
            "rotate(180deg)";

        setTimeout(
            () => {

                refreshButton.style.transform =
                    "";

            },
            350
        );

        await loadData();

    }
);


/* ============================================================
   INITIALIZE
============================================================ */

loadData();

</script>

</body>
</html>
